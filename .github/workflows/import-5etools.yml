name: 5e.tools einlesen

# Die 5e.tools-Datei erzeugen und in eine Umgebung einlesen (W8). Bisher
# entstand sie von Hand in einem Wegwerf-Container auf dem Server; hier
# entsteht sie im Lauf, und die Daten von 5e.tools kommen nie ins
# Repository und bleiben nicht auf dem Server liegen.
#
# Der Import ist ein einmaliger Lauf, der die Basis bildet; danach wird
# ergänzt (D71). Darum ist `only-new` die Vorgabe: angelegt wird nur, was
# es noch nicht gibt, und was die Leitung seither geändert hat, bleibt.
# Ein Modul ergänzt man mit `sources` (z. B. `CoS`).
#
# Ausgelöst wird nur von Hand, nie von selbst:
# - Actions › 5e.tools einlesen › Run workflow: dev vom Zweig preprod, prod
#   vom Zweig main — die Zweigregel der Environments verlangt es, und ein
#   Lauf vom falschen Zweig sagt das gleich am Anfang;
# - CI › Run workflow mit dem Häkchen „5e.tools danach einlesen" (ci.yml,
#   Job `import-5etools`): dasselbe mit `only-new`, nach dem Ausrollen.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Umgebung (dev vom Zweig preprod, prod vom Zweig main)"
        type: choice
        options: [dev, prod]
        default: dev
      mode:
        description: "only-new: nur anlegen, was es noch nicht gibt · additions: wie only-new, aber nur die Neuzugänge seit T-087 (2024, UA, Fahrzeuge, Decks, Bastionen), nichts aus dem Grundstand ausser dem Text der Regelbücher (T-145) · dry-run: nur sagen, was only-new (mit confirm=ersetzen: replace-layer, mit confirm=neues: additions) täte · replace-layer: die Ebene D&D 5e (2014) neu laden — eigene Änderungen an 5e.tools-Artikeln gehen dabei verloren, braucht confirm=ersetzen · add: dazulegen und Bestehendes überschreiben · layers: nur die Ebenen — Gruppen und Herausgeber anlegen, Beschreibung nachtragen, kein Artikel (T-088, T-094)"
        type: choice
        options: [only-new, additions, dry-run, replace-layer, add, layers]
        default: only-new
      sources:
        description: "Nur diese Quellen, z. B. PHB,MM oder ein Modulkürzel (leer = alles)"
        type: string
        default: ""
      types:
        description: "Nur diese Arten ausgeben, z. B. Place (leer = alle) — zum Nachtragen einer neuen Art mit only-new"
        type: string
        default: ""
      confirm:
        description: "Für replace-layer: ersetzen eintippen"
        type: string
        default: ""
      source-ref:
        description: "Stand von 5etools-src (Zweig oder Tag, leer = neuester)"
        type: string
        default: ""
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      mode:
        type: string
        default: only-new
      sources:
        type: string
        default: ""
      types:
        type: string
        default: ""
      confirm:
        type: string
        default: ""
      source-ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  import:
    name: einlesen (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    # Nie zwei Läufe in dieselbe Umgebung gleichzeitig, und keinen abbrechen:
    # ein halber Lauf ist schlimmer als ein später.
    concurrency:
      group: import-5etools-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      MODE: ${{ inputs.mode }}
      SOURCES: ${{ inputs.sources }}
      TYPES: ${{ inputs.types }}
      CONFIRM: ${{ inputs.confirm }}
      SOURCE_REF: ${{ inputs.source-ref }}
      DIR: ${{ vars.DEPLOY_DIR || (inputs.environment == 'prod' && '/srv/atlas/prod' || '/srv/atlas/dev') }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Eingaben prüfen
        run: |
          case "$ENVIRONMENT:$GITHUB_REF_NAME" in
            dev:preprod|prod:main) ;;
            dev:*|prod:*)
              echo "::error::$ENVIRONMENT wird vom Zweig $([ "$ENVIRONMENT" = prod ] && echo main || echo preprod) eingelesen, nicht von $GITHUB_REF_NAME — dort steht das Abbild, das auf dem Server läuft."
              exit 1 ;;
            *) echo "::error::Unbekannte Umgebung: $ENVIRONMENT"; exit 1 ;;
          esac
          # Ersetzen nur ausdrücklich (D67, D71): es nimmt der Leitung, was
          # sie an 5e.tools-Artikeln geändert hat.
          case "$MODE" in
            only-new) echo "FLAGS=--only-new" >> "$GITHUB_ENV" ;;
            # Nur die Neuzugänge (T-087): für einen Bestand aus einem älteren
            # Importer, dessen Geteiltes andere Peg-Ids trägt.
            additions) echo "FLAGS=--only-new --additions" >> "$GITHUB_ENV" ;;
            dry-run)
              if [ "$CONFIRM" = ersetzen ]; then echo "FLAGS=--replace-layer --dry-run" >> "$GITHUB_ENV"
              elif [ "$CONFIRM" = neues ]; then echo "FLAGS=--only-new --additions --dry-run" >> "$GITHUB_ENV"
              else echo "FLAGS=--only-new --dry-run" >> "$GITHUB_ENV"; fi ;;
            replace-layer)
              [ "$CONFIRM" = ersetzen ] || {
                echo "::error::replace-layer lädt die Ebene neu, eigene Änderungen an 5e.tools-Artikeln gehen dabei verloren. Wer das will, tippt bei confirm „ersetzen“ ein."
                exit 1
              }
              echo "FLAGS=--replace-layer" >> "$GITHUB_ENV" ;;
            add) echo "FLAGS=" >> "$GITHUB_ENV" ;;
            # Nur Ebenen (T-088): Gruppen und Beschreibung, kein Artikel.
            layers) echo "FLAGS=--layers" >> "$GITHUB_ENV" ;;
            *) echo "::error::Unbekannte Art: $MODE (only-new, additions, dry-run, replace-layer, add, layers)"; exit 1 ;;
          esac
          case "$SOURCES" in
            *[!A-Za-z0-9,_\ -]*) echo "::error::sources: nur Kürzel, durch Kommas getrennt (z. B. PHB,MM)"; exit 1 ;;
          esac
          case "$TYPES" in
            *[!A-Za-z0-9,]*) echo "::error::types: nur Artnamen, durch Kommas getrennt (z. B. Place)"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nw/model build
      - run: pnpm --filter @nw/registry build
      - run: pnpm --filter @nw/import-5etools build

      # Ausserhalb des Arbeitsverzeichnisses: was hier liegt, kann nicht aus
      # Versehen in einen Commit oder ein Artefakt geraten.
      - name: 5e.tools holen
        run: |
          src="$RUNNER_TEMP/5etools-src"
          git clone --depth 1 --filter=blob:none --sparse ${SOURCE_REF:+--branch "$SOURCE_REF"} \
            https://github.com/5etools-mirror-3/5etools-src.git "$src"
          # `js/` für die Titel der Quellen ohne Kopf in books/adventures (T-420, `js/parser.js`).
          git -C "$src" sparse-checkout set data js
          echo "Stand: $(git -C "$src" log -1 --format='%h %cs %s')"

      - name: Datei erzeugen
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node packages/import-5etools/dist/cli.js "$RUNNER_TEMP/5etools-src/data" \
            ${SOURCES:+--sources "$SOURCES"} ${TYPES:+--types "$TYPES"} --out "$RUNNER_TEMP/5etools-2014.json" --bericht "$RUNNER_TEMP/5etools-Bericht.md"
          gzip -9 "$RUNNER_TEMP/5etools-2014.json"
          ls -l "$RUNNER_TEMP/5etools-2014.json.gz"

      # Der Bericht ist unser Text über die Daten, nicht die Daten — er steht
      # auch im Repository (docs/5etools-Bericht.md) und darf mit.
      - uses: actions/upload-artifact@v4
        with:
          name: 5etools-bericht-${{ inputs.environment }}
          path: ${{ runner.temp }}/5etools-Bericht.md
          retention-days: 30

      - name: SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Feste Hostschlüssel wie beim Ausrollen (ci.yml, deploy).
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Hinlegen
        run: |
          ssh "$TARGET" "mkdir -p '$DIR/import'"
          scp deploy/import.sh "$TARGET:$DIR/import.sh"
          scp "$RUNNER_TEMP/5etools-2014.json.gz" "$TARGET:$DIR/import/5etools-2014.json.gz"

      # import.sh sichert die Datenbank (ausser beim Probelauf), liest im
      # Container ein und löscht die Datei danach, auch wenn es scheitert.
      - name: Einlesen
        run: |
          set -o pipefail
          ssh "$TARGET" "cd '$DIR' && chmod +x import.sh && ./import.sh import/5etools-2014.json.gz $FLAGS" 2>&1 \
            | tee "$RUNNER_TEMP/ausgabe.txt"

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### 5e.tools → $ENVIRONMENT ($MODE${SOURCES:+, $SOURCES}${TYPES:+, nur $TYPES})"
            echo
            echo '```'
            cat "$RUNNER_TEMP/ausgabe.txt" 2>/dev/null || echo "(keine Ausgabe — siehe Log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
