name: CI

on:
  push:
    branches: [main, preprod]
  pull_request:
    branches: [main, preprod]
  # Dieselbe Umgebung noch einmal ausrollen, ohne einen Commit dafür.
  workflow_dispatch:
    inputs:
      import5etools:
        description: "5e.tools danach einlesen (nur ergänzen, was es noch nicht gibt)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose — the action reads `packageManager`
      # from package.json, and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build order matters: the apps compile against @nw/model's emitted types.
      - run: pnpm --filter @nw/model build
      - run: pnpm --filter @nw/registry build
      # Alle Pakete und die E2E-Dateien (T-429): der Importer läuft nicht in
      # der Anwendung, übersetzt aber gegen dieselben Typen, und Playwright
      # prüft beim Laufen keine Typen — ein Fehler dort blieb sonst grün.
      - run: pnpm typecheck

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @nw/server build
      - run: pnpm --filter web build

  # Die Tests laufen gegen InMemoryRepository; das hier läuft gegen eine
  # frische Postgres, mit allen Migrationen von der ersten an. Zwei davon
  # liefen nie auf einer leeren Datenbank durch, und keiner hat es gemerkt.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nw/model build
      - run: pnpm --filter @nw/registry build
      - run: pnpm --filter @nw/server build
      - run: node apps/server/scripts/durchstich.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Keine Registeränderung ohne Migration (T-123): eine Installation auf
      # dem Stand von register-stand.json muss nach allen Migrationen und
      # dem Seed den Startzeilen gleichen.
      - run: node apps/server/scripts/register-abgleich.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Die Übernahme dev ↔ prod (T-130): zwei Server, zwei Datenbanken.
      - run: node apps/server/scripts/uebernahme-durchstich.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # Die Abläufe im Browser (T-356): gebauter Server mit gebauter
  # Oberfläche gegen eine frische Postgres, als Leitung und als Spielerin,
  # 1360 und 390 px. Konten und Testkampagne legt der Aufbau selbst an
  # (apps/web/e2e/aufbau.ts). Kein `needs` vom Abbild: ob der Job den Merge
  # hält, sagt die Pflichtprüfung in den Repo-Einstellungen.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nw/model build
      - run: pnpm --filter @nw/registry build
      - run: pnpm --filter @nw/server build
      - run: pnpm --filter web build
      # Chromium in der Version, die zum installierten Playwright gehört;
      # zwischengespeichert je Version, das spart eine Minute.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Spuren und Bilder der fehlgeschlagenen Specs: `pnpm exec playwright
      # show-trace <datei>` oder der HTML-Bericht.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-spuren
          path: |
            apps/web/e2e/.ergebnis/
            apps/web/e2e/.bericht/
          retention-days: 14

  # Gebaut wird immer; nach GHCR geht das Abbild nur von preprod und main.
  # Der Server baut nie selbst — was dort läuft, ist genau das, was hier
  # geprüft wurde.
  image:
    runs-on: ubuntu-latest
    needs: [check, postgres]
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.name.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          # „123/merge" aus einem Pull Request ist kein gültiger Tag.
          tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
          echo "ref=${repo}:${tag}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${repo}:${tag}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_NAME" in
            pull_request:*) echo "push=false" >> "$GITHUB_OUTPUT" ;;
            *:main|*:preprod) echo "push=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "push=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - if: steps.name.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.name.outputs.push == 'true' }}
          tags: |
            ${{ steps.name.outputs.ref }}
            ${{ steps.name.outputs.branch }}
          # Verknüpft das Paket mit dem Repository; dann darf der
          # GITHUB_TOKEN eines späteren Laufs es auch lesen.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # preprod → dev, main → prod. Je Umgebung ein GitHub-Environment mit
  # eigenen Geheimnissen; wer für prod eine Freigabe will, stellt sie dort
  # ein (Required reviewers), nicht hier.
  deploy:
    runs-on: ubuntu-latest
    needs: image
    # Ausgerollt wird nur, wenn das Repo es sagt (Variable DEPLOY_ENABLED=true):
    # ohne Secrets scheiterte der Job sonst bei jedem Push und färbte den
    # Zweig rot, obwohl Tests und Abbild grün sind.
    if: github.event_name != 'pull_request' && (github.ref_name == 'preprod' || github.ref_name == 'main') && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ vars.PUBLIC_URL }}
    # Nie zwei Ausrollungen derselben Umgebung gleichzeitig, und keine
    # abbrechen: eine halbe ist schlimmer als eine späte.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DIR: ${{ vars.DEPLOY_DIR || (github.ref_name == 'main' && '/srv/atlas/prod' || '/srv/atlas/dev') }}
      PROXY_DIR: ${{ vars.PROXY_DIR || '/srv/atlas/proxy' }}
      COMPOSE: ${{ github.ref_name == 'main' && 'docker-compose.yml' || 'docker-compose.preprod.yml' }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v5
      - name: SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Feste Hostschlüssel statt „beim ersten Mal vertrauen": sonst
          # rollt CI auf die erste Maschine aus, die sich meldet.
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Dateien
        run: |
          ssh "$TARGET" "mkdir -p '$DIR' '$PROXY_DIR'"
          scp "$COMPOSE" "$TARGET:$DIR/compose.yml"
          scp deploy/deploy.sh deploy/bilder-sichern.sh "$TARGET:$DIR/"
          scp deploy/proxy/compose.yml deploy/proxy/Caddyfile "$TARGET:$PROXY_DIR/"
      # Der Reverse Proxy kommt aus dem Repository mit: Caddyfile und Compose
      # werden bei jedem Ausrollen frisch hingelegt, Caddy lädt sie ohne
      # Unterbruch neu. Die Namen stehen in .env auf dem Server (bootstrap.sh).
      - name: Proxy
        run: |
          ssh "$TARGET" "cd '$PROXY_DIR' && docker compose up -d --remove-orphans \
            && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile"
      - name: Ausrollen
        env:
          IMAGE: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Der Zugang zu GHCR geht über stdin und nicht in die Befehlszeile:
        # die stünde auf dem Server in der Prozessliste.
        run: |
          printf '%s\n' "$TOKEN" | ssh "$TARGET" \
            "cd '$DIR' && chmod +x deploy.sh bilder-sichern.sh && read -r GHCR_TOKEN && export GHCR_TOKEN GHCR_USER='${{ github.actor }}' && ./deploy.sh '$IMAGE'"

  # Nach dem Ausrollen, mit dem Abbild, das gerade gestartet ist — nur,
  # wenn jemand CI von Hand mit dem Häkchen startet. Von selbst nie mehr:
  # der Import ist einmalig, danach wird ergänzt (D71); ein geänderter
  # Importer ist kein Grund, alles neu zu laden.
  import-5etools:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.import5etools && needs.deploy.result == 'success'
    uses: ./.github/workflows/import-5etools.yml
    # Ein aufgerufener Workflow sieht die Secrets des Aufrufers nicht von
    # selbst — ohne `inherit` war DEPLOY_USER@DEPLOY_HOST leer und ssh brach
    # beim ersten Lauf mit 255 ab.
    secrets: inherit
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      mode: only-new
