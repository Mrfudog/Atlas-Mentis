# Produktion — das, woran der Tisch spielt. Läuft von main.
#
# Lokal: `docker compose up --build` baut das Abbild selbst. Auf dem Server
# setzt deploy/deploy.sh `IMAGE` auf das Abbild aus GHCR, das CI gebaut und
# geprüft hat — dort wird nichts gebaut.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nebelwacht
      # Kein Vorgabewert: ein Passwort, das im Repository steht, ist keines.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: nebelwacht
    volumes: ["./daten/db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebelwacht"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${IMAGE:-atlas-mentis:local}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://nebelwacht:${POSTGRES_PASSWORD}@db:5432/nebelwacht
      # Im Container richtig: die Grenze ist der Container, nach aussen geht
      # nur der Port unten, und der nur auf loopback.
      HOST: 0.0.0.0
      PORT: 8080
      # Caddy auf derselben Maschine spricht über die Docker-Brücke herein
      # (172.16/12 gehört zu uniquelocal). Nur ihm wird X-Forwarded-* geglaubt.
      TRUST_PROXY: loopback,uniquelocal
      # Welche Umgebung das ist: prod zeigt kein Band (T-070).
      ATLAS_ENV: prod
      # Gibt für genau einen Start frei, was eine Migration oder der Seed
      # entfernen würde (T-076): `ATLAS_ALLOW_DATA_LOSS=024_x.sql ./deploy.sh …`.
      # Nicht in .env — eine Freigabe, die stehen bleibt, gilt auch beim nächsten.
      ATLAS_ALLOW_DATA_LOSS: ${ATLAS_ALLOW_DATA_LOSS:-}
      # Die Bilder (T-114, E-032 a): eine Dateiablage im Volume unten.
      # Grösser als ASSET_MAX_MB nimmt der Server nichts an (Vorgabe 40).
      ASSET_DIR: /data/assets
      ASSET_MAX_MB: ${ASSET_MAX_MB:-40}
      # Die Übernahme dev ↔ prod (T-130, docs/Betrieb.md › Übernahme): die
      # Gegenstelle und ihr Token stehen in .env, nie im Repository; prod
      # nimmt nur mit ATLAS_TRANSFER_ACCEPT=1 an. Die Sicherung vor jedem
      # Schreiben liegt in backups/uebernahme/.
      ATLAS_PEER_URL: ${ATLAS_PEER_URL:-}
      ATLAS_PEER_TOKEN: ${ATLAS_PEER_TOKEN:-}
      ATLAS_TRANSFER_ACCEPT: ${ATLAS_TRANSFER_ACCEPT:-}
      ATLAS_BACKUP_DIR: /data/backups
    # Gehören dem Benutzer node (uid 1000) im Abbild; deploy.sh legt sie an.
    volumes: ["./daten/bilder:/data/assets", "./backups/uebernahme:/data/backups"]
    # Nur auf loopback veröffentlicht: davor steht der Reverse Proxy.
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
