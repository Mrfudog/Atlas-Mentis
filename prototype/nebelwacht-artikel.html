    var inp=el("input",{class:"i",type:"text",value:String(REG.vars[k])});
    if(!w) inp.disabled=true;
    inp.addEventListener("change",function(){ REG.vars[k]=inp.value; saveReg("vars"); render(); });
    row.appendChild(inp);
    if(w) row.appendChild(el("button",{class:"btn sm gh dngr",type:"button",title:"Remove",
      onclick:function(){ confirmDialog("Remove {"+k+"}?",function(){
        delete REG.vars[k]; saveReg("vars"); render(); },"Remove"); }},"×"));
    box.appendChild(row);
  });
  v.appendChild(box);
  if(w){
    var nk=el("input",{class:"i",type:"text",placeholder:"NAME"});
    var nv=el("input",{class:"i",type:"text",placeholder:"value"});
    var bar=el("div",{class:"addbar",style:"margin-top:10px"});
    bar.appendChild(nk); bar.appendChild(nv);
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      var k=nk.value.trim().replace(/[^A-Za-z0-9_]/g,"").toUpperCase();
      if(!k)return;
      REG.vars=REG.vars||{}; REG.vars[k]=nv.value;
      saveReg("vars"); render();
    }},"Add variable"));
    v.appendChild(bar);
  }
}

/* Kampagneneinstellungen (REQ-043): ein Schlüssel-Wert-Speicher, den jeder
   Bereich für sich auslegt. Absichtlich nicht typisiert — eine Einstellung,
   die erst ein Schema braucht, bevor jemand sie setzen kann, wird nicht
   gesetzt. Wer sie liest, weiss, was sie heisst; `setting()` gibt einen
   Rückfallwert, damit ein fehlender Schlüssel nichts bricht. */
function setting(key,fallback){
  var v=(REG.settings||{})[key];
  return v===undefined||v===""?fallback:v;
}
function settingNum(key,fallback){
  var n=Number(setting(key,fallback)); return isFinite(n)?n:fallback;
}
var SETTING_HINTS={
  gridSize:"Battlemap grid in pixels (maps)",
  gridUnit:"What one square means, e.g. 1,5 m",
  inventoryCols:"Columns of the tile inventory",
  inventoryRows:"Rows of the tile inventory",
  today:"The world date the campaign stands at — empty means the newest used event"
};
function renderSettingsEditor(v){
  var w=canWrite();
  v.appendChild(el("p",{class:"hint",
    text:"Campaign settings. Each area reads the keys it knows and ignores the rest — the store has no schema on purpose, so a setting can exist before anything reads it."}));
  var keys=Object.keys(REG.settings||{}).sort();
  var box=el("div",{class:"regbody",style:"max-height:none;border:1px solid var(--line);border-radius:var(--r)"});
  if(!keys.length) box.appendChild(el("p",{class:"hint",text:"None yet."}));
  keys.forEach(function(k){
    var row=el("div",{class:"crow"});
    var lab=el("span",{class:"cl"});
    lab.appendChild(el("b",{text:k}));
    if(SETTING_HINTS[k]) lab.appendChild(el("span",{class:"co",text:SETTING_HINTS[k]}));
    row.appendChild(lab);
    var inp=el("input",{class:"i",type:"text",value:String(REG.settings[k])});
    if(!w) inp.disabled=true;
    inp.addEventListener("change",function(){ REG.settings[k]=inp.value; saveReg("settings"); render(); });
    row.appendChild(inp);
    if(w) row.appendChild(el("button",{class:"btn sm gh dngr",type:"button",title:"Remove",
      onclick:function(){ confirmDialog("Remove the setting “"+k+"”?",function(){
        delete REG.settings[k]; saveReg("settings"); render(); },"Remove"); }},"×"));
    box.appendChild(row);
  });
  v.appendChild(box);
  if(w){
    var nk=el("select",{class:"i"});
    nk.appendChild(el("option",{value:""},"— known setting —"));
    Object.keys(SETTING_HINTS).forEach(function(k){
      if(keys.indexOf(k)>=0)return;
      nk.appendChild(el("option",{value:k},k+" — "+SETTING_HINTS[k])); });
    var frei=el("input",{class:"i",type:"text",placeholder:"or a key of your own"});
    var nv=el("input",{class:"i",type:"text",placeholder:"value"});
    nk.addEventListener("change",function(){ if(nk.value) frei.value=nk.value; });
    var bar=el("div",{class:"addbar",style:"margin-top:10px"});
    bar.appendChild(nk); bar.appendChild(frei); bar.appendChild(nv);
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      var k=frei.value.trim().replace(/[^A-Za-z0-9_.]/g,"");
      if(!k)return;
      REG.settings=REG.settings||{}; REG.settings[k]=nv.value;
      saveReg("settings"); render();
    }},"Add setting"));
    v.appendChild(bar);
  }
}

/* ---------- how the registry works, on the page that edits it ----------
   Die Mechanik steht hier, weil sie sonst nur in Commit-Nachrichten und im
   Kopf steht. Wer eine Zeile ändert, soll daneben lesen können, was sie
   auslöst. Aufklappbar, damit sie nicht jedes Mal im Weg ist. */
/* ---------- „How it works" ----------
   Die Begriffe standen bis hierher in einer Ausklappzeile über jedem
   Registerreiter — also überall ein bisschen und nirgends ganz. Sie haben
   jetzt eine eigene Seite, und die zeigt nicht nur Worte: ein Artikel wird
   von seinem Typ bis zu seinen Feldern durchgezogen, aus dem laufenden
   Register. Eine Erklärung, die eine Liste abtippt, stimmt am Tag ihrer
   Entstehung und danach nie wieder.

   Die sieben Wörter stehen ausführlich in docs/Begriffe.md; hier steht, was
   man beim Arbeiten braucht. */
var BEGRIFFE=[
  ["Type",
   "A registry row. Three shapes: a base type — it declares fields and "+
   "inherits nothing —, a composite made of other types, or a choice list, "+
   "a named set of words with no fields (Ability is one). Text, number, "+
   "date and colour are not rows: they are the shape of a field, and there "+
   "is nothing about them to configure. Abstract means no article is one "+
   "directly: nobody writes an article called “Identity”. A subtype that "+
   "declares nothing of its own is a word and not a row — that is what "+
   "Creature.kind, Story.kind (arc, chapter) and Event.kind (era, "+
   "milestone) are, and each becomes a row the day it needs fields."],
  ["Part",
   "A type another type is made of. The first one named draws the tree and "+
   "decides the area; the rest only bring their fields and edges along. You "+
   "drop a field by dropping the part that brings it — an exception list "+
   "would be incomplete the day the next field arrives, and nobody would "+
   "notice."],
  ["Field",
   "A type in one place — the fact it records there: a key, a label, a "+
   "kind, required or optional, maybe a default, maybe a calculation. A "+
   "choice either carries its own words or names choice lists, never "+
   "both — several lists count together, which is how “proficient in” "+
   "draws on skills, tools, languages, weapons, armour and fields of "+
   "knowledge at once. As an array the same field holds several of them: "+
   "one ability carries a check, several abilities are saving throws. A "+
   "number may carry a range (1 to 20 is a range, not twenty words). A "+
   "A field may say it is always an input (a state set mid-turn: current "+
   "hit points, the travel counters) instead of waiting for “edit”. It is "+
   "said at the FIELD and nowhere else: at the type it was one switch for "+
   "twenty fields, and on a creature the hit points are a state while the "+
   "list of conditions is a set of ticks. A shape is painted, not typed "+
   "(one character per cell). A "+
   "link names the article types it may point at, subtypes included — "+
   "without that it held the id of anything, and “Scene in play” took an "+
   "armour; tags and a field value may narrow the suggestions, but only "+
   "the type is a rule, because a tag removed later would make a stored "+
   "link wrong in hindsight. A measure names the unit it is stored in. A "+
   "calculated field takes no input "+
   "and is never stored. Values are kept one card per type, named after the "+
   "type that declares the field — that is what keeps hp at the creature "+
   "apart from hp at the statblock. A type may rename a field it inherits: "+
   "the same Time.until is when an event ends and when a quest is too late, "+
   "so the quest calls it “Deadline”. That is a label, not a second field "+
   "list — the part stays one, and a field added tomorrow brings its own "+
   "name."],
  ["Identifier",
   "Issued, not typed: npc-0042, the kind and a running number inside it. "+
   "It is set when the article is made and never changes. It used to be a "+
   "slug of the name — the same thing said twice, which on a rename either "+
   "had to move along or started lying. A number says nothing and stays "+
   "right; what the article is called stands next to it."],
  ["Article",
   "A thing in the campaign: an id, the types it is, the cards with its "+
   "values, and its edges. What it records is said by its type, never by "+
   "code."],
  ["View",
   "How an article is drawn. Three of them, and where you are decides which: "+
   "Overview for a reference in the text, Quick for a card, Full for the "+
   "article page. There is no picker. The arrangement lives at the type, and "+
   "subtypes inherit it."],
  ["Block",
   "One piece of a view — and the same piece in the type definition: the "+
   "fields of one part, a single field, the image, the edges. Definition and "+
   "view show the same blocks, so you do not have to hold two pictures of "+
   "one thing in your head. It no longer means a piece of prose sitting "+
   "beside the fields: that is a field with a long input, and several of "+
   "them is “one or more”."],
  ["Edge",
   "A typed, directed connection between two articles, which may carry "+
   "properties of its own. Stored forward only; the other direction is "+
   "always a query. An edge with a section heading writes the target into "+
   "the article instead of linking to it. An edge may also read like a "+
   "field at one end: a creature's numbers live on its statblock, and the "+
   "creature page draws the statblock's fields with their own inputs. Such "+
   "an edge is always one: a statblock belongs to one creature. What thirty "+
   "guards have in common sits on a template, and each guard reads its own "+
   "instance of it (instanceOf): the instance stores only what differs, the "+
   "template fills in the rest on read, and a value typed back to the "+
   "template's follows the template again. Instances stand at their "+
   "creature and in no list. Without a statblock a creature shows no "+
   "numbers at all."],
  ["Unit",
   "How a measure is written and converted. The vault is imperial because "+
   "the rules are; at the table sit people for whom forty feet means "+
   "nothing. So one number is stored and the other is worked out on read — "+
   "two numbers for one measure are two numbers that can disagree. How the "+
   "conversion goes is a registry row, and which system is shown is a "+
   "setting an article type may override. A measure without a unit is not "+
   "a measure: the conversion starts from the stored unit, so naming none "+
   "converts nothing and looks like a number that is already right. In a "+
   "text (“40 ft, climb 20 ft”) the unit is what bare numbers are assumed "+
   "to be — and only where no word stands in the way, because in “climb "+
   "20” the word could be a unit this campaign knows and the code does "+
   "not."]
];

/** Ein Artikel, an dem sich das Ganze zeigen lässt: einer mit möglichst
 *  vielen Karten. Fest einen zu nennen hiesse, dass die Seite leer ist,
 *  sobald jemand ihn löscht. */
function howtoBeispiel(){
  if(UI.howto&&ENT.get(UI.howto)) return ENT.get(UI.howto);
  /* Die Karten zählen, nicht die Kanten: ein Inventar mit vierzig `holds`
     ist kein gutes Beispiel, ein NPC mit acht Bestandteilen schon. Ein
     Artikel mit verschiedenen Kantenarten gewinnt trotzdem — deshalb die
     Arten und nicht deren Zahl. */
  var best=null,score=-1;
  ENT.forEach(function(e){
    if(!articleVisible(e))return;
    var arten={}; (e.relations||[]).forEach(function(r){ arten[r.type]=1; });
    var n=Object.keys(e.components||{}).length*2+Object.keys(arten).length;
    if(n>score){ score=n; best=e; }
  });
  return best;
}

/* ---------- Das Typendiagramm ----------
   **Wie ein Datenbankdiagramm**: ein Kasten je Artikelart, eine Linie je
   Kantenart, gestrichelt für die Vererbung. Gezogen aus dem laufenden
   Register — eine Zeichnung, die jemand pflegt, stimmt am Tag ihrer
   Entstehung und danach nie wieder.

   **Wer einen Kasten bekommt:** jede Art, die man anlegen kann, und jede,
   die eine Kante nennt. Die dreissig geteilten Typen ohne Kante
   (`Identity`, `Tags`, `Prose` …) sind Felder und keine Beziehungen; alle
   hineinzuzeichnen hiesse, die zwanzig Artikelarten darin zu verlieren.
   Einen Schalter gibt es trotzdem, denn „alle Typen" ist eine berechtigte
   Frage — nur nicht die erste.

   **Angeordnet nach Bereich**, eine Spalte je Seite: Welt, Geschichte,
   Regelwerk, Spiel, und dazu die geteilten. Das ist dieselbe Ordnung, in
   der die Oberfläche sie zeigt, und damit die, die man im Kopf hat.

   **Gezeigt wird eine Art auf einmal.** Einundvierzig Kantenarten
   gleichzeitig sind ein Knäuel, in dem keine einzelne mehr lesbar ist.
   Also stehen alle blass da und die eines gewählten Kastens kräftig —
   das Ganze als Übersicht, das Einzelne auf Klick. */
var DG_W=124, DG_H=30, DG_VGAP=9, DG_COL=176, DG_TOP=26, DG_PAD=12;
var DG_SPALTEN=[["world","World"],["history","History"],["rules","Rules"],
  ["play","Play"],["","Shared"]];

/** Welche Typen ins Diagramm gehören, und in welcher Spalte sie stehen. */
function dgTypen(){
  var kanten={};
  Object.keys(REG.relations||{}).forEach(function(k){
    var r=REG.relations[k]||{};
    (r.from||[]).concat(r.to||[]).forEach(function(n){
      if(n&&n!=="*"&&n!=="same") kanten[n]=1; });
  });
  var alle=Object.keys(REG.interfaces||{}).filter(function(n){
    if(UI.dgAll) return true;
    return !REG.interfaces[n].abstract||kanten[n];
  });
  var spalten={};
  DG_SPALTEN.forEach(function(sp){ spalten[sp[0]]=[]; });
  alle.forEach(function(n){
    var a=areaOf(n)||"";
    if(!spalten[a]) a="";
    spalten[a].push(n);
  });
  Object.keys(spalten).forEach(function(a){
    spalten[a].sort(function(x,y){
      return (REG.interfaces[x].label||x).localeCompare(REG.interfaces[y].label||y);
    });
  });
  return spalten;
}

/** Die Linien: Kanten aus dem Register und die Vererbung. */
function dgLinien(pos){
  var out=[];
  Object.keys(REG.relations||{}).forEach(function(k){
    var r=REG.relations[k]||{};
    var von=(r.from||[]).filter(function(n){ return pos[n]; });
    var nach=(r.to||[]).filter(function(n){ return pos[n]; });
    von.forEach(function(a){ nach.forEach(function(b){
      if(a===b&&von.length>1)return;
      out.push({a:a,b:b,label:r.label||k,art:"rel",name:k});
    }); });
  });
  Object.keys(pos).forEach(function(n){
    (parentsOf(n)||[]).forEach(function(p2){
      if(pos[p2]) out.push({a:n,b:p2,label:"is a",art:"erb",name:"extends"});
    });
  });
  return out;
}

function elTypeDiagram(){
  var wrap=el("div",{class:"dgbox"});
  var bar=el("div",{class:"maptools"});
  bar.appendChild(el("button",{class:"btn sm"+(UI.dgAll?" pri":""),type:"button",
    "aria-pressed":String(!!UI.dgAll),
    title:"The shared types too — the ones that only bring fields",
    onclick:function(){ UI.dgAll=!UI.dgAll; render(); }},"Shared types too"));
  if(UI.dgPick) bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    onclick:function(){ UI.dgPick=""; render(); }},"Show them all again"));
  bar.appendChild(el("span",{class:"co",
    text:UI.dgPick?("Only what touches "+((REG.interfaces[UI.dgPick]||{}).label||UI.dgPick))
                  :"Click a box to follow its edges"}));
  wrap.appendChild(bar);

  var spalten=dgTypen();
  var pos={}, hoehe=0, breite=DG_PAD;
  DG_SPALTEN.forEach(function(sp,i){
    var liste=spalten[sp[0]]||[];
    if(!liste.length)return;
    var x=DG_PAD+i*DG_COL;
    liste.forEach(function(n,j){
      pos[n]={x:x,y:DG_TOP+j*(DG_H+DG_VGAP),spalte:i};
    });
    hoehe=Math.max(hoehe,DG_TOP+liste.length*(DG_H+DG_VGAP));
    breite=Math.max(breite,x+DG_W+DG_PAD);
  });
  var linien=dgLinien(pos);

  /* Die natürliche Breite und kein `100%`: sonst staucht ein enger Kasten
     das Ganze, bis die Namen nicht mehr lesbar sind. Zu schmal wird
     gescrollt — das ist die ehrlichere Antwort. */
  var svg=sv("svg",{class:"dg",viewBox:"0 0 "+breite+" "+(hoehe+DG_PAD),
    width:String(breite),height:String(hoehe+DG_PAD),role:"img",
    "aria-label":"Every article type and the edges between them"});
  var defs=sv("defs");
  ["dgar","dgar-on"].forEach(function(id){
    defs.appendChild(sv("marker",{id:id,viewBox:"0 0 8 8",refX:"7",refY:"4",
      markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},
      sv("path",{d:"M0,0 L8,4 L0,8 z",class:id})));
  });
  svg.appendChild(defs);

  /* Erst die Linien, dann die Kästen, dann die Beschriftungen: eine Linie
     über einem Kasten streicht seinen Namen durch, und eine Beschriftung
     **unter** einem Kasten ist keine. */
  var lg=sv("g",{class:"dglines"});
  var beschriftung=[];
  linien.forEach(function(l){
    var a=pos[l.a], b=pos[l.b];
    if(!a||!b)return;
    var an=!UI.dgPick||UI.dgPick===l.a||UI.dgPick===l.b;
    if(UI.dgPick&&!an)return;
    var x1,y1,x2,y2;
    if(a.spalte===b.spalte){
      /* Innerhalb einer Spalte: aussen herum, damit die Linie nicht durch
         die Kästen dazwischen läuft. */
      x1=a.x+DG_W; y1=a.y+DG_H/2; x2=b.x+DG_W; y2=b.y+DG_H/2;
      var bauch=x1+24+Math.min(40,Math.abs(y2-y1)/4);
      lg.appendChild(sv("path",{class:"dgl "+l.art+(an?" on":""),
        d:"M"+x1+","+y1+" C"+bauch+","+y1+" "+bauch+","+y2+" "+x2+","+y2,
        "marker-end":"url(#"+(an?"dgar-on":"dgar")+")"}));
    } else {
      var rechts=b.spalte>a.spalte;
      x1=rechts?a.x+DG_W:a.x; y1=a.y+DG_H/2;
      x2=rechts?b.x:b.x+DG_W; y2=b.y+DG_H/2;
      var mx=(x1+x2)/2;
      lg.appendChild(sv("path",{class:"dgl "+l.art+(an?" on":""),
        d:"M"+x1+","+y1+" C"+mx+","+y1+" "+mx+","+y2+" "+x2+","+y2,
        "marker-end":"url(#"+(an?"dgar-on":"dgar")+")"}));
    }
    /* **Die Namen stehen nicht im Bild.** Sechs Kanten, die am selben
       Kasten ankommen, schreiben ihre Namen an dieselbe Stelle; mit einem
       Saum liest man dann einen Namen aus sechs übereinander. Also nennt
       sie die Liste unter dem Bild — dort steht jede für sich, mit
       Richtung und Gegenüber. */
    if(UI.dgPick&&an) beschriftung.push(l);
  });
  svg.appendChild(lg);

  DG_SPALTEN.forEach(function(sp,i){
    var liste=spalten[sp[0]]||[];
    if(!liste.length)return;
    svg.appendChild(sv("text",{class:"dgh",x:String(DG_PAD+i*DG_COL),y:"14"},
      document.createTextNode(sp[1]+" · "+liste.length)));
  });

  Object.keys(pos).forEach(function(n){
    var d=REG.interfaces[n]||{}, p2=pos[n];
    var g=sv("g",{class:"dgn"+(d.abstract?" abs":"")+(UI.dgPick===n?" on":""),
      tabindex:"0",role:"button"});
    g.appendChild(sv("rect",{x:String(p2.x),y:String(p2.y),
      width:String(DG_W),height:String(DG_H),rx:"4"}));
    var lab=d.label||n;
    g.appendChild(sv("text",{x:String(p2.x+8),y:String(p2.y+13)},
      document.createTextNode(lab.length>17?lab.slice(0,16)+"…":lab)));
    var zahl=selfAndAncestors(n).reduce(function(m,a){
      return m+Object.keys(propsOf(a)).length; },0);
    g.appendChild(sv("text",{class:"dgs",x:String(p2.x+8),y:String(p2.y+24)},
      document.createTextNode(zahl+" field"+(zahl===1?"":"s")+
        (d.abstract?" · shared":""))));
    g.addEventListener("click",function(){
      UI.dgPick=(UI.dgPick===n?"":n); render(); });
    g.addEventListener("dblclick",function(){
      UI.regtab="types"; UI.typePick=n; UI.regiface=n; go({k:"reg"}); });
    g.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault();
        UI.dgPick=(UI.dgPick===n?"":n); render(); } });
    svg.appendChild(g);
  });

  var host=el("div",{class:"dgscroll"});
  host.appendChild(svg);
  wrap.appendChild(host);

  /* Die Kanten der gewählten Art, ausgeschrieben: Richtung, Name,
     Gegenüber. Das Bild sagt, wie es zusammenhängt; die Liste sagt, wie
     es heisst. */
  if(UI.dgPick&&beschriftung.length){
    /* **Eine Zeile je Kantenart und Richtung**, und die Gegenüber
       dahinter. `regards` steht zwischen vier Arten in beide Richtungen —
       als Kreuzprodukt wären das zwölf Zeilen, die alle dasselbe
       heissen. */
    var nach={}, ordnung=[];
    beschriftung.forEach(function(l){
      var raus=l.a===UI.dgPick;
      var gegen=raus?l.b:l.a;
      var schl=l.art+"|"+l.name+"|"+(raus?"out":"in");
      if(!nach[schl]){
        nach[schl]={art:l.art,name:l.name,raus:raus,label:l.label,ziele:[]};
        ordnung.push(schl);
      }
      if(nach[schl].ziele.indexOf(gegen)<0) nach[schl].ziele.push(gegen);
    });
    var liste=el("div",{class:"dglist"});
    ordnung.sort(function(a,b){
      var x=nach[a], y=nach[b];
      return (x.art===y.art?0:(x.art==="erb"?-1:1))||x.name.localeCompare(y.name);
    }).forEach(function(schl){
      var g=nach[schl];
      var z=el("div",{class:"dgrow"+(g.art==="erb"?" erb":"")});
      z.appendChild(el("span",{class:"dgar",
        title:g.raus?"from here":"to here",text:g.raus?"\u2192":"\u2190"}));
      z.appendChild(el("code",{text:g.name}));
      /* Bei der Vererbung sagt die Richtung etwas anderes als bei einer
         Kante: hinaus heisst „ist ein", herein heisst „davon gibt es". */
      z.appendChild(el("span",{class:"co",
        text:g.art==="erb"?(g.raus?"is a":"subtype"):g.label}));
      var ziele=el("span",{class:"dgz"});
      g.ziele.sort().forEach(function(gegen,i){
        if(i) ziele.appendChild(el("span",{class:"co",text:", "}));
        ziele.appendChild(el("button",{class:"ref",type:"button",onclick:function(){
          UI.dgPick=gegen; render(); }},(REG.interfaces[gegen]||{}).label||gegen));
      });
      z.appendChild(ziele);
      liste.appendChild(z);
    });
    wrap.appendChild(liste);
  }

  wrap.appendChild(el("p",{class:"hint",style:"margin:6px 0 0",
    text:Object.keys(pos).length+" types, "+linien.filter(function(l){
      return l.art==="rel"; }).length+" edges. A dashed line is inheritance ("+
      "“is a”), a solid one an edge type. Double-click a box to open it."}));
  return wrap;
}


function renderHowto(v){
  v.appendChild(el("p",{class:"hint"},
    "Nine words, and one article followed from its type down to the fields "+
    "it records. Everything below is read from the registry as it stands "+
    "right now — nothing here is typed out."));

  /* ---- Der Baum: von einem Artikel bis zu den Feldern ---- */
  var e=howtoBeispiel();
  v.appendChild(el("div",{class:"rsec",text:"One article, all the way down"}));
  if(!e){ v.appendChild(el("div",{class:"empty",text:"No article to follow yet."})); }
  else{
    var waehl=el("div",{class:"addbar"});
    var sel=el("select",{class:"i"});
    byName().forEach(function(x){
      if(!articleVisible(x))return;
      sel.appendChild(el("option",{value:x.id},nameOf(x)));
    });
    sel.value=e.id;
    sel.addEventListener("change",function(){ UI.howto=sel.value; render(); });
    waehl.appendChild(el("span",{class:"co",text:"Follow"}));
    waehl.appendChild(sel);
    v.appendChild(waehl);
    v.appendChild(howtoBaum(e));
  }

  /* ---- Das Diagramm ---- */
  v.appendChild(el("div",{class:"rsec",text:"Every type, and how they connect"}));
  v.appendChild(el("p",{class:"hint"},
    "One box per article type, one line per edge type, dashed for "+
    "inheritance — laid out by the page a type belongs to. Read from the "+
    "registry as it stands; nothing here is drawn by hand."));
  v.appendChild(elTypeDiagram());

  /* ---- Die Begriffe ---- */
  v.appendChild(el("div",{class:"rsec",text:"The nine words"}));
  var dl=el("dl",{class:"kdl"});
  BEGRIFFE.forEach(function(r){
    dl.appendChild(el("dt",{text:r[0]}));
    dl.appendChild(el("dd",{text:r[1]}));
  });
  v.appendChild(dl);

  /* ---- Wer einen Artikel sehen darf ----
     Die **grobe** Frage, und sie kommt vor der feinen: das Wissen sagt,
     welche Felder jemand liest, die Sichtbarkeit, ob der Artikel
     überhaupt an ihn geht. Die Stufen werden aus der Zeile gelesen und
     nicht abgetippt — eine Liste von Hand stimmte am Tag ihrer
     Entstehung. */
  v.appendChild(el("div",{class:"rsec",text:"Who gets to see an article"}));
  v.appendChild(el("p",{class:"hint"},
    "Two questions, and the coarse one comes first: visibility decides "+
    "whether the article reaches a reader at all, knowledge decides which "+
    "of its fields. Merging them would mean hiding an article by taking "+
    "away every field — and it would still stand in the list, with its "+
    "name and its area."));
  var sichtP=((REG.interfaces.Visibility||{}).schema||{}).properties||{};
  var STUFEN={
    "public":"every account. This is the default: an article nobody "+
      "classified is open, because the other way round half the campaign "+
      "would be invisible and nobody would know why.",
    "campaign":"every account with a role at this table. An account without "+
      "one has no seat yet.",
    "players":"the ones playing — player, co-gm or gm, but no spectators. The "+
      "lead sees every step below its own.",
    "gm":"the lead of THIS campaign: gm or co-gm. A role belongs to the "+
      "account, per campaign, and to no article — whoever runs one table may "+
      "play at another, and at that other one they count as what they are "+
      "there. Which campaign an article belongs to is read off the layer "+
      "stack: a layer one campaign runs belongs to it, a layer several run is "+
      "shared, and then the strongest role anywhere counts. That is a "+
      "different thing from is_admin, the account flag for the whole "+
      "installation."
  };
  var sl=el("ul",{class:"bsp"});
  ((sichtP.audience||{})["enum"]||[]).forEach(function(a){
    var li=el("li");
    li.appendChild(el("b",{text:a+((sichtP.audience||{})["default"]===a?" (default)":"")}));
    li.appendChild(el("span",{text:" \u2014 "+(STUFEN[a]||"")}));
    sl.appendChild(li);
  });
  v.appendChild(sl);
  v.appendChild(el("p",{class:"hint"},
    "Two lists override the step, and the order is the rule: Hidden from "+
    "beats Revealed to beats Audience. The explicit ban wins because it is "+
    "the exception somebody entered by hand. Both name holders \u2014 a "+
    "creature, a party, a faction \u2014 and a holder counts one "+
    "step out: naming the party hides it from its members, naming the "+
    "faction from everyone in it. A faction knows nothing by itself: its "+
    "members do, and a knowledge grant to a faction may name the rank it "+
    "starts at (Faction.ranks, memberOf.rank). Nothing is "+
    "inherited to an article\u2019s children: knowing a house is not "+
    "knowing every room in it, and an inheritance without a depth "+
    "eventually releases a whole branch nobody meant."));

  /* ---- Was nie gespeichert wird ---- */
  v.appendChild(el("div",{class:"rsec",text:"What is never stored"}));
  var nie=el("ul",{class:"bsp"});
  [["A calculated value",
    "It is worked out each time the article is read. Two places that can "+
    "disagree are worse than one place that has to think."],
   ["The other direction of an edge",
    "It is a query. A mirrored counterpart goes stale the moment one side "+
    "is deleted."],
   ["Which kinds of article exist",
    "That is a registry row, not a line of code. Adding one is an insert, "+
    "not a migration — the claim this prototype exists to test."]
  ].forEach(function(r){
    var li=el("li");
    li.appendChild(el("b",{text:r[0]}));
    li.appendChild(el("span",{text:" — "+r[1]}));
    nie.appendChild(li);
  });
  v.appendChild(nie);
}

/** Der Baum. Oben der Artikel, darunter sein Artikeltyp, darunter die
 *  Bestandteile bis ganz hinunter zu den Feldern. Ein Feld, das der Artikel
 *  wirklich trägt, ist markiert — sonst läse man eine Möglichkeit und
 *  hielte sie für den Bestand. */
function howtoBaum(e){
  var box=el("div",{class:"tree"});
  var art=(e.interfaces||[])[0]||"";
  var karten=e.components||{};

  var kopf=el("div",{class:"tnode tart"});
  kopf.appendChild(el("span",{class:"tw",text:"article"}));
  kopf.appendChild(el("button",{class:"ref",type:"button",
    onclick:function(){ go({k:"art",id:e.id}); }},nameOf(e)));
  /* Eine Instanz trägt nur, was abweicht — das Übrige liest sie. Steht
     das nicht hier, sieht der Baum aus wie ein halb leerer Statblock. */
  var vorl=templateOf(e);
  if(vorl){
    kopf.appendChild(el("span",{class:"co",text:" instance of "}));
    kopf.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){ go({k:"art",id:vorl.id}); }},nameOf(vorl)));
    kopf.appendChild(el("span",{class:"co",
      text:" — it stores only what differs and reads the rest from there"}));
  }
  box.appendChild(kopf);

  var gesehen={};
  function ast(n,tiefe){
    if(gesehen[n]||tiefe>8)return;
    gesehen[n]=1;
    var d=REG.interfaces[n]||{};
    var eigen=Object.keys((d.schema||{}).properties||{});
    var pflicht=((d.schema||{}).required)||[];
    var row=el("div",{class:"tnode"+(tiefe?"":" ttyp"),
      style:"margin-left:"+(tiefe*18)+"px"});
    row.appendChild(el("span",{class:"tw",
      text:tiefe?(eigen.length?"part":"part, empty"):"its type"}));
    row.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){ UI.regtab="types"; UI.typePick=n; go({k:"reg"}); }},
      d.label||n));
    if(d.abstract) row.appendChild(el("span",{class:"pill q",text:"abstract"}));
    box.appendChild(row);

    if(eigen.length){
      var fb=el("div",{class:"tfields",style:"margin-left:"+(tiefe*18+18)+"px"});
      eigen.forEach(function(k){
        var belegt=karten[n]&&karten[n][k]!==undefined&&karten[n][k]!==""&&
          !(Array.isArray(karten[n][k])&&!karten[n][k].length);
        var p2=((d.schema||{}).properties||{})[k]||{};
        /* Was ein Feld einschränkt, gehört in die Erklärung: ein Verweis
           sagt, worauf er zeigen darf, ein Mass, in welcher Einheit es
           dasteht, eine Zahl ihre Grenzen. Ohne das hiesse hier nur
           „link" und „measure" — der Name des Mechanismus statt der
           Angabe. */
        var enger="";
        if((( p2.target||{}).interfaces||[]).length)
          enger+=" · points at "+p2.target.interfaces.map(function(n2){
            return (REG.interfaces[n2]||{}).label||n2; }).join(" | ");
        if(p2.unit) enger+=" · stored in "+p2.unit;
        if(p2.min!==undefined||p2.max!==undefined)
          enger+=" · "+(p2.min===undefined?"\u2212\u221e":p2.min)+"\u2026"+
            (p2.max===undefined?"\u221e":p2.max);
        fb.appendChild(el("span",{
          class:"pill q tfield"+(belegt?" on":"")+(p2.derived?" der":""),
          title:(p2.title||k)+(pflicht.indexOf(k)>=0?" · required":" · optional")+
            (p2.derived?" · calculated: "+p2.derived:"")+enger+
            (belegt?"":" · this article carries none"),
          text:k+(pflicht.indexOf(k)>=0?"*":"")}));
      });
      box.appendChild(fb);
    }
    parentsOf(n).forEach(function(p2){ ast(p2,tiefe+1); });
  }
  if(art) ast(art,0);

  /* Die Kantenarten, nicht die Kanten: „holds, holds, holds …" sagt über
     das Modell nichts, „holds ×12" schon. */
  var zahl={};
  (e.relations||[]).forEach(function(r){ zahl[r.type]=(zahl[r.type]||0)+1; });
  var kArten=Object.keys(zahl).sort();
  if(kArten.length){
    var kn=el("div",{class:"tnode"});
    kn.appendChild(el("span",{class:"tw",text:"edges"}));
    kArten.forEach(function(t){
      var d2=REG.relations[t]||{};
      kn.appendChild(el("span",{class:"pill q",
        title:d2.label?("„"+d2.label+"“"):"",
        text:t+(zahl[t]>1?" \u00d7"+zahl[t]:"")}));
    });
    box.appendChild(kn);
  }
  box.appendChild(el("p",{class:"hint",style:"margin:10px 0 0"},
    "A field in bold is one this article carries; the rest the type allows "+
    "and this article leaves empty. A star means required, a dashed outline "+
    "means calculated — no input, never stored."));
  return box;
}

/* Jede Maske trägt denselben Notausgang: für Massenänderungen ist ein

/* ---------- compendium: views as an ordered toolbox ---------- */
function renderViewEditor(v){
  var keys=viewKeys();
  if(!keys.length){
    v.appendChild(el("div",{class:"empty",text:"No views yet."}));
    if(canWrite()) v.appendChild(newViewBar());
    return;
  }
  if(keys.indexOf(UI.regview)<0) UI.regview=keys[0];
  /* Gewählt wird in der Leiste. Eine zweite Liste hier wäre genau die
     doppelte Auswahl, die auf der Typenseite schon im Weg stand. */
  v.appendChild(viewBody(UI.regview));
  if(canWrite()) v.appendChild(newViewBar());
}

function newViewBar(){
  var i=el("input",{class:"i",type:"text",placeholder:"Label, e.g. Handout"});
  var bar=el("div",{class:"addbar",style:"margin-top:10px"});
  bar.appendChild(i);
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var label=i.value.trim(); if(!label) return;
    var key=slug(label).replace(/-/g,"")||"view";
    var n=key,c=2; while(REG.views[n]){ n=key+c; c++; }
    var order=Object.keys(REG.views).reduce(function(m,k){
      return Math.max(m,(REG.views[k].order||0)); },0)+1;
    REG.views[n]={label:label,order:order,layout:[{id:uid("l"),el:"description"}]};
    UI.regview=n; saveReg("views"); render();
  }},"Create view"));
  return bar;
}

function viewBody(key){
  var vd=REG.views[key], w=canWrite();
  var box=el("div",{class:"regbody"});
  function save(){ saveReg("views"); render(); }

  box.appendChild(el("h3",{text:vd.label||key}));
  box.appendChild(el("div",{class:"key",text:key}));

  var head=el("div",{class:"fmore",style:"border-bottom:0;padding-top:10px"});
  var labelInput=el("input",{class:"i",type:"text",value:vd.label||""});
  if(!w) labelInput.disabled=true;
  labelInput.addEventListener("change",function(){ vd.label=labelInput.value.trim()||key; save(); });
  head.appendChild(field("Label",labelInput));
  var ord=el("input",{class:"i",type:"number",value:String(vd.order||1)});
  if(!w) ord.disabled=true;
  ord.addEventListener("change",function(){ vd.order=Number(ord.value)||1; save(); });
  head.appendChild(field("Order in the picker",ord));
  box.appendChild(head);

  /* ---- Geltungsbereich ----
     Ohne Bereich gilt das Layout für alles. Mit Bereich gilt es für einen
     Typ und dessen Subtypen — `Item: Full` zeigt dann andere Felder als
     `Statblock: Full`, ohne dass es zwei Ansichten braucht. */
  box.appendChild(el("div",{class:"rsec",text:"Applies to"}));
  var scope=el("select",{class:"i",style:"max-width:280px"});
  scope.appendChild(el("option",{value:""},"Every type (the default layout)"));
  Object.keys(REG.interfaces).sort().forEach(function(n){
    var eigen=(((REG.interfaces[n]||{}).views||{})[key]||[]).length;
    scope.appendChild(el("option",{value:n},
      (REG.interfaces[n].label||n)+(eigen?"  · own layout":"")));
  });
  scope.value=UI.regscope||"";
  scope.addEventListener("change",function(){ UI.regscope=scope.value; UI.regel=""; render(); });
  box.appendChild(scope);

  var ifn=UI.regscope;
  var eigen=ifn?(((REG.interfaces[ifn]||{}).views||{})[key]||[]):(vd.layout||null);
  var geerbtVon="";
  if(ifn&&!eigen.length){
    var kette=ancestorsOf(ifn);
    for(var ai=0;ai<kette.length;ai++){
      if((((REG.interfaces[kette[ai]]||{}).views||{})[key]||[]).length){ geerbtVon=kette[ai]; break; }
    }
  }

  if(ifn){
    box.appendChild(el("p",{class:"hint",style:"margin-top:8px",
      text:eigen&&eigen.length
        ? "This type has its own layout. Remove every element to fall back to the default."
        : (geerbtVon
            ? "Inherited from "+((REG.interfaces[geerbtVon]||{}).label||geerbtVon)+". Adding an element here makes this type's own layout."
            : "Uses the default layout. Adding an element here makes this type's own layout.")}));
  }

  /* Das gezeigte Layout ist das, was ein Artikel dieses Typs wirklich
     bekäme — nicht die leere Liste, auf der man sonst stünde. */
  var wirksam=ifn?layoutOf(vd,ifn,key):(vd.layout||legacyLayout(vd));
  var eigenes=ifn?(eigen&&eigen.length?eigen:null):(Array.isArray(vd.layout)?vd.layout:null);

  box.appendChild(el("div",{class:"rsec",text:"Layout"}));
  if(!eigenes&&!ifn) box.appendChild(el("p",{class:"hint",
    text:"Converted from the older switch form on read. The first change writes it out as elements."}));

  /* Die Anordnung einer Art steht **an der Art**. Nur die Grundanordnung —
     die ohne Art — steht an der Ansicht. */
  function schreibe(liste){
    if(ifn){
      var d2=REG.interfaces[ifn]; if(!d2)return;
      d2.views=d2.views||{};
      if(liste.length) d2.views[key]=liste; else delete d2.views[key];
      if(!Object.keys(d2.views).length) delete d2.views;
      saveReg("interfaces"); render(); return;
    }
    vd.layout=liste;
    save();
  }
  /* Beim ersten Eingriff wird aus dem abgeleiteten Layout ein echtes —
     sonst bearbeitet man eine Liste, die nirgends steht. */
  function arbeitsliste(){
    return (eigenes||wirksam).map(function(x){
      return Object.assign({},x,{id:x.id||uid("l")}); });
  }

  if(!wirksam.length) box.appendChild(el("div",{class:"empty",text:"Nothing in this layout yet."}));
  wirksam.forEach(function(item,i){
    box.appendChild(layoutRow(item,i,wirksam.length));
  });

  if(w){
    var tools=el("div",{class:"tools"});
    LAYOUT_ELEMENTS.forEach(function(t){
      tools.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
        var liste=arbeitsliste();
        var neu={id:uid("l"),el:t[0]};
        if(t[0]==="fields"){ neu.fields=[]; neu.columns=0; }
        if(t[0]==="prose") neu.fields="all";
        if(t[0]==="heading"||t[0]==="text") neu.text="";
        liste.push(neu); UI.regel=neu.id; schreibe(liste);
      }},"+ "+t[1]));
    });
    box.appendChild(el("div",{class:"rsec",text:"Toolbox"}));
    box.appendChild(tools);
  }
  return box;

  function layoutRow(item,i,n){
    var wrap=el("div");
    var row=el("div",{class:"crow"});
    var name=(LAYOUT_ELEMENTS.filter(function(t){return t[0]===item.el;})[0]||[item.el,item.el])[1];
    var lft=el("div",{class:"cl"});
    lft.appendChild(el("b",{text:name}));
    lft.appendChild(el("span",{class:"co",text:layoutSummary(item)}));
    row.appendChild(lft);
    if(w){
      var auf=el("button",{class:"btn sm gh",type:"button",title:"Move up",onclick:function(){
        var l=arbeitsliste(); if(i<1)return;
        var t=l[i-1]; l[i-1]=l[i]; l[i]=t; schreibe(l); }},"↑");
      if(i===0) auf.disabled=true;
      var ab=el("button",{class:"btn sm gh",type:"button",title:"Move down",onclick:function(){
        var l=arbeitsliste(); if(i>=l.length-1)return;
        var t=l[i+1]; l[i+1]=l[i]; l[i]=t; schreibe(l); }},"↓");
      if(i===n-1) ab.disabled=true;
      row.appendChild(auf); row.appendChild(ab);
    }
    row.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      UI.regel=(UI.regel===item.id?"":item.id); render(); }},UI.regel===item.id?"▴":"⋯"));
    if(w) row.appendChild(el("button",{class:"btn sm gh dngr",type:"button",title:"Remove",
      onclick:function(){ var l=arbeitsliste().filter(function(x){return x.id!==item.id;});
        schreibe(l); }},"×"));
    wrap.appendChild(row);
    if(UI.regel===item.id) wrap.appendChild(layoutSettings(item));
    return wrap;
  }

  function layoutSummary(item){
    if(item.el==="heading"||item.el==="text") return item.text?"„"+item.text+"“":"(empty)";
    if(item.el==="fields"){
      if(item.fields==="all") return "every field"+(item.columns?" · "+item.columns+" columns":"");
      var n=(item.fields||[]).length;
      return (n?n+(n===1?" entry":" entries"):"nothing chosen")+(item.columns?" · "+item.columns+" columns":"");
    }
    if(item.el==="prose") return item.fields==="all"?"every passage":((item.fields||[]).join(", ")||"nothing chosen");
    return "";
  }

  function layoutSettings(item){
    var kasten=el("div",{class:"fbox"});
    if(!w){ kasten.appendChild(el("p",{class:"hint",text:"Read only."})); return kasten; }

    function aendere(fn){ var l=arbeitsliste();
      var ziel=l.filter(function(x){return x.id===item.id;})[0];
      if(!ziel)return; fn(ziel); schreibe(l); }

    if(item.el==="heading"||item.el==="text"){
      var t=el(item.el==="text"?"textarea":"input",{class:"i"});
      if(item.el!=="text") t.type="text";
      t.value=item.text||"";
      t.addEventListener("change",function(){ var val=t.value; aendere(function(z){ z.text=val; }); });
      kasten.appendChild(field(item.el==="text"?"Text ([[links]] and {VAR} work)":"Heading",t));
      return kasten;
    }

    if(item.el==="prose"){
      /* Die Prosafelder, die es im ganzen Register gibt — „every passage"
         bleibt richtig, wenn morgen eines dazukommt, eine abgetippte Liste
         nicht. */
      var alleFelder={};
      Object.keys(REG.interfaces).forEach(function(n){
        proseFields(n).forEach(function(f){ alleFelder[f.type+"."+f.key]=1; }); });
      var chips=el("div",{class:"chips"});
      var isAll=item.fields==="all";
      chips.appendChild(marke("every passage",isAll,function(){
        aendere(function(z){ z.fields=isAll?[]:"all"; }); }));
      Object.keys(alleFelder).sort().forEach(function(b){
        var an=!isAll&&Array.isArray(item.fields)&&item.fields.indexOf(b)>=0;
        chips.appendChild(marke(b,an,function(){
          aendere(function(z){
            var l=Array.isArray(z.fields)?z.fields.slice():[];
            if(an) l=l.filter(function(x){return x!==b;}); else l.push(b);
            z.fields=l; });
        },isAll));
      });
      kasten.appendChild(chips);
      return kasten;
    }

    if(item.el==="fields"){
      var cols=el("select",{class:"i"});
      [["0","fit the width"],["1","1"],["2","2"],["3","3"],["4","4"]].forEach(function(c){
        cols.appendChild(el("option",{value:c[0]},c[1])); });
      cols.value=String(item.columns||0);
      cols.addEventListener("change",function(){ var n=Number(cols.value)||0;
        aendere(function(z){ z.columns=n; }); });
      kasten.appendChild(field("Columns",cols));

      var isAll=item.fields==="all";
      var chips=el("div",{class:"chips"});
      chips.appendChild(marke("every field",isAll,function(){
        aendere(function(z){ z.fields=isAll?[]:"all"; }); }));
      kasten.appendChild(chips);

      /* Nur die Komponenten, die der gewählte Typ überhaupt führen kann —
         eine Ansicht auf Felder zu stellen, die dieser Typ nie hat, sieht
         eingestellt aus und zeigt nichts. */
      var quelle=ifn?compsFor(ifn):Object.keys(REG.interfaces).sort();
      quelle.forEach(function(cn){
        var cd=REG.interfaces[cn]; if(!cd)return;
        var props=(cd.schema&&cd.schema.properties)||{};
        if(!Object.keys(props).length)return;
        var ganz=!isAll&&Array.isArray(item.fields)&&item.fields.indexOf(cn)>=0;
        var kopf=el("div",{class:"crow",style:"border-top:1px dashed var(--line)"});
        var kl=el("div",{class:"cl"});
        kl.appendChild(el("b",{text:cd.label||cn}));
        kl.appendChild(el("span",{class:"co",text:cn}));
        kopf.appendChild(kl);
        kopf.appendChild(marke("whole component",ganz,function(){
          aendere(function(z){
            var l=Array.isArray(z.fields)?z.fields.slice():[];
            if(ganz) l=l.filter(function(x){return x!==cn;});
            else l=l.filter(function(x){return x.indexOf(cn+".")!==0;}).concat([cn]);
            z.fields=l; });
        },isAll));
        kasten.appendChild(kopf);
        var fc=el("div",{class:"chips"});
        Object.keys(props).forEach(function(pk){
          var ref=cn+"."+pk;
          var an=!isAll&&!ganz&&Array.isArray(item.fields)&&item.fields.indexOf(ref)>=0;
          fc.appendChild(marke(props[pk].title||pk,an,function(){
            aendere(function(z){
              var l=Array.isArray(z.fields)?z.fields.slice():[];
              if(an) l=l.filter(function(x){return x!==ref;}); else l.push(ref);
              z.fields=l; });
          },isAll||ganz));
        });
        kasten.appendChild(fc);
      });
      return kasten;
    }

    kasten.appendChild(el("p",{class:"hint",text:"Nothing to set on this element."}));
    return kasten;
  }

  function marke(text,an,onclick,aus){
    var b=el("button",{type:"button",class:"chip pick"+(an?" on":""),onclick:onclick},text);
    if(aus) b.disabled=true;
    return b;
  }
}

function regIfaceBody(ifn){
  var d=REG.interfaces[ifn], w=canWrite();
  var box=el("div",{class:"regbody"});
  function save(){ saveReg("interfaces"); render(); }

  /* ---- Kopf ----
     Kein zweiter Titel: die Art steht als Überschrift darüber. */
  var count=countIface(ifn);
  box.appendChild(el("div",{class:"key",
    text:ifn+" · "+(count?count+(count===1?" articles":" articles"):"no articles")}));

  var head=el("div",{class:"fmore",style:"border-bottom:0;padding-top:10px"});
  var labelInput=el("input",{class:"i",type:"text",value:d.label||""});
  if(!w) labelInput.disabled=true;
  labelInput.addEventListener("change",function(){ d.label=labelInput.value.trim()||ifn; save(); });
  head.appendChild(field("Label",labelInput));

  var ab=el("select",{class:"i"}); if(!w) ab.disabled=true;
  ab.appendChild(el("option",{value:""},"instantiable"));
  ab.appendChild(el("option",{value:"1"},"abstract only"));
  ab.value=d.abstract?"1":"";
  ab.addEventListener("change",function(){
    if(ab.value) d.abstract=true; else delete d.abstract;
    save(); });
  head.appendChild(field("Kind",ab));

  /* Hier stand „Its fields are: always an input". Am Typ traf das zwanzig
     Felder auf einmal — an `Vitals` sind die Trefferpunkte ein Stand, die
     Zustandsliste aber ein Satz Häkchen. Die Angabe steht jetzt am Feld,
     wo sich auch die Ausnahme benennen lässt. */
  box.appendChild(head);

  /* ---- Felder: **ein** Bereich ----
     Hier standen zwei: oben „Made of" mit den Bestandteilen als Marken,
     darunter „Fields" mit den Feldern, gruppiert nach denselben
     Bestandteilen. Zwei Darstellungen derselben Sache, und die Frage „wie
     werde ich dieses Feld los" war nur in der oberen zu beantworten, wo die
     Felder nicht standen.
     
     Jetzt ist der Bestandteil die **Kopfzeile seiner Gruppe**: dort steht,
     woher er kommt, dort nimmt man ihn heraus, und die Felder, die dabei
     mitgehen, stehen darunter. Ein neues Feld und ein neuer Bestandteil
     kommen an derselben Stelle dazu. */
  box.appendChild(el("div",{class:"rsec",text:"Fields"}));
  box.appendChild(el("p",{class:"hint",
    text:"Every field an article of this kind records, grouped by the type that declares it. Its own are editable here; an inherited group belongs to its part — open it to change the fields for every type that has it, or take the whole part out. The first part drawn with ● decides the area."}));
  box.appendChild(fieldTable(ifn,w,save));

  /* ---- Subtypen ---- */
  box.appendChild(el("div",{class:"rsec",text:"Subtypes"}));
  var children=kindsOf(ifn);
  if(!children.length) box.appendChild(el("p",{class:"hint",
    text:"None. A subtype inherits everything from here and adds parts and fields of its own."}));
  else{
    var kc=el("div",{class:"chips"});
    children.forEach(function(n){
      var c=el("span",{class:"chip"});
      c.appendChild(el("button",{type:"button",class:"ref",onclick:function(){
        UI.regiface=n; UI.regcomp=""; UI.regprop=""; render(); }},REG.interfaces[n].label||n));
      var z=countIface(n);
      if(z) c.appendChild(el("span",{class:"co",text:String(z)}));
      kc.appendChild(c);
    });
    box.appendChild(kc);
  }
  if(w) box.appendChild(newInterfaceBar(ifn));

  /* ---- Entfernen ---- */
  if(w){
    var reason=count?count+" articles use it":(children.length?"has subtypes":"");
    var del=el("button",{class:"btn sm dngr",type:"button",onclick:function(){
      if(reason) return;
      confirmDialog("Schnittstelle „"+(d.label||ifn)+"”?",function(){
        delete REG.interfaces[ifn]; UI.regiface=""; save(); },"Remove"); }},"Remove interface");
    if(reason){ del.disabled=true; del.title=reason; }
    var fbar=el("div",{class:"rowbtns"}); fbar.appendChild(del);
    if(reason) fbar.appendChild(el("span",{class:"co",style:"align-self:center",text:reason}));
    box.appendChild(fbar);
  }

  return box;

  /* ---------- eine Karte, aufklappbar ----------
     Eine Karte heisst nach der Art, die ihre Felder erklärt. Für diese Art
     ist es sie selbst; alles andere kommt von oben und wird dort geändert.
     Es gab hier einmal eine Auswahl „Pflicht / Optional / nicht benutzt" —
     sie stand für `requires` und `allows`, und beides sagte über die Hälfte
     der Einträge nichts, weil die verlangte Karte kein Pflichtfeld hatte. */
  function compRow(cn){
    var cd=REG.interfaces[cn]||{};
    var props=propsOf(cn);
    var n=Object.keys(props).length;
    var eigen=(cn===ifn);

    var row=el("div",{class:"crow"});
    var lft=el("div",{class:"cl"});
    lft.appendChild(el("b",{text:cd.label||cn}));
    lft.appendChild(el("span",{class:"co",
      text:cn+" · "+n+(n===1?" field":" fields")+(eigen?" · its own":" · inherited")}));
    row.appendChild(lft);

    if(!eigen) row.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
      UI.regiface=cn; UI.regcomp=""; UI.regprop=""; render(); }},"Open"));

    row.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      UI.regcomp=(UI.regcomp===cn?"":cn); UI.regprop=""; render(); }},
      UI.regcomp===cn?"Fields \u25b4":"Fields \u25be"));

    var wrap=el("div");
    wrap.appendChild(row);
    /* Geerbte Felder werden dort geändert, wo sie stehen. Sie hier
       bearbeitbar zu machen hiesse, sie für jede andere Art mitzuändern,
       ohne dass es jemand sieht. */
    if(UI.regcomp===cn) wrap.appendChild(fieldBox(cn,ifn,w&&eigen,save));
    return wrap;
  }
}

/* ---------- alle Felder einer Art, in einer Liste ----------
   Eigene zuerst und bearbeitbar, geerbte darunter mit dem Bestandteil, der
   sie mitbringt. Geerbte sind hier **nicht** bearbeitbar: ein Feld an
   `Identity` zu ändern, weil man gerade bei `Event` steht, änderte es für
   jede Artikelart — und zwar ohne dass es irgendwo stünde. Ein Klick auf
   den Bestandteil führt dorthin, wo die Änderung hingehört. */
/* Die Felder einer Art — als **Blöcke**, nicht als eine flache Liste.
   Oben die eigenen, darunter je ein Block für den Bestandteil, der seine
   mitbringt. Vorher stand an jeder geerbten Zeile „from Time"; bei
   dreiundachtzig Feldern las man dann dreiundachtzigmal, woher etwas kommt,
   statt einmal zu sehen, woraus die Art besteht. Und es ist dieselbe
   Einteilung, die die Ansicht zeichnet — zwei Bilder derselben Sache im
   Kopf zusammenzuhalten ist Arbeit, die niemand tun sollte. */
function fieldTable(ifn,w,save){
  var d=REG.interfaces[ifn]||{};
  var aussen=el("div");
  var direkt=parentsOf(ifn);

  /* ---- Die eigenen Felder ----
     Sie stehen offen da: das ist der Typ, den man aufgeschlagen hat. */
  var box=el("div",{class:"fbox"});
  var eigen=propsOf(ifn), keys=Object.keys(eigen);
  box.appendChild(el("div",{class:"fhead"},
    [el("b",{text:"Its own fields"}),
     el("span",{class:"co",text:keys.length
       ?keys.length+(keys.length===1?" field":" fields")
       :"nothing of its own"})]));
  keys.forEach(function(k){ box.appendChild(fieldRow(ifn,k,ifn,w,save)); });
  if(w){
    var nk=el("input",{class:"i",type:"text",placeholder:"Field name, e.g. weight"});
    var nt=el("input",{class:"i",type:"text",placeholder:"Label"});
    var bar=el("div",{class:"addbar",style:"margin-top:9px"});
    bar.appendChild(nk); bar.appendChild(nt);
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      var k=nk.value.trim().replace(/[^A-Za-z0-9_]/g,"");
      if(!k) return;
      var schon=fieldsOf(ifn).filter(function(f){ return f.key===k; })[0];
      if(schon){ UI.err="The field "+k+" already comes from "+
        (REG.interfaces[schon.type].label||schon.type)+"."; render(); return; }
      var dd=REG.interfaces[ifn];
      dd.schema=dd.schema||{type:"object",properties:{}};
      dd.schema.properties=dd.schema.properties||{};
      dd.schema.properties[k]={type:"string",title:nt.value.trim()||k};
      UI.regprop=ifn+"."+k;
      save();
    }},"Add field"));
    box.appendChild(bar);
  }
  aussen.appendChild(box);

  /* ---- Die geerbten Typen: **zugeklappt** ----
     Eine Spielerfigur erbt aus siebzehn Typen; flach ausgeschrieben sind
     das achtundvierzig Zeilen, und die eigenen sechs gehen darin unter.
     Zugeklappt steht je Typ eine Zeile: der Name, woher er kommt, wie
     viele Felder er bringt. Aufgeklappt stehen **seine** Felder, mit
     derselben Konfiguration wie am Typ selbst — geändert wird damit der
     Typ, dem sie gehören, und das gilt dann für jede Art, die ihn nimmt.
     Darum steht es an der Kopfzeile und nicht im Kleingedruckten.

     Auf- und Zuklappen zeichnet die Seite **nicht** neu: die Zeilen stehen
     schon da und werden nur gezeigt. Ein Neuzeichnen setzte jeden Kasten
     mit eigenem Scroll wieder nach oben, und wer unten in der Liste etwas
     aufklappt, sucht danach die Stelle, an der er war. */
  ancestorsOf(ifn).forEach(function(a){
    var ks=Object.keys(propsOf(a));
    var schluessel=ifn+"::"+a;
    var offen=!!(UI.regOpen||{})[schluessel];
    var teil=el("div",{class:"fbox part","data-part":a});
    var kopf=el("div",{class:"fhead klapp"});
    var pfeil=el("span",{class:"twist",text:offen?"\u25be":"\u25b8"});
    kopf.appendChild(pfeil);
    kopf.appendChild(el("button",{class:"ref",type:"button","data-from":a,
      title:"Open "+((REG.interfaces[a]||{}).label||a)+" as a type of its own",
      onclick:function(ev){
        ev.stopPropagation();
        UI.typePick=a; UI.regiface=a; UI.regcomp=""; UI.regprop=""; render(); }},
      (REG.interfaces[a]||{}).label||a));
    /* Woher er kommt: direkt dazugenommen oder über einen anderen
       hereingekommen. Nur der direkte lässt sich hier herausnehmen — am
       anderen zu ziehen hiesse, den falschen Typ zu ändern. */
    var ueber=direkt.indexOf(a)>=0?null:direkt.filter(function(p2){
      return p2===a||ancestorsOf(p2).indexOf(a)>=0; })[0];
    kopf.appendChild(el("span",{class:"pill q",
      title:ueber?"Comes in through "+((REG.interfaces[ueber]||{}).label||ueber)
        :"Taken in here",
      text:ueber?"via "+((REG.interfaces[ueber]||{}).label||ueber):"taken in here"}));
    if(direkt.length&&direkt[0]===a) kopf.appendChild(el("span",{class:"pill q",
      title:"The first type taken in decides the area — "+(areaOf(ifn)||"none"),
      text:"\u25cf area"}));
    kopf.appendChild(el("span",{class:"co",text:ks.length
      ?ks.length+(ks.length===1?" field":" fields")
      :"no fields"}));
    if(w&&!ueber) kopf.appendChild(el("button",{class:"btn sm gh dngr",type:"button",
      title:"Take "+((REG.interfaces[a]||{}).label||a)+" out of "+(d.label||ifn),
      onclick:function(ev){
        ev.stopPropagation();
        confirmDialog("Take \u201e"+((REG.interfaces[a]||{}).label||a)+"\u201c out of "+
          (d.label||ifn)+"? Its "+ks.length+" field(s) go with it. "+
          "The values stay in the articles but are no longer shown.",
          function(){
            var dd=REG.interfaces[ifn];
            dd.extends=parentsOf(ifn).filter(function(x){ return x!==a; });
            if(!dd.extends.length) delete dd.extends;
            save(); },"Remove"); }},"\u00d7"));
    teil.appendChild(kopf);

    var felder=el("div",{class:"partfields"});
    if(!offen) felder.style.display="none";
    ks.forEach(function(k){ felder.appendChild(erbRow(a,k,ifn,w,save)); });
    if(!ks.length) felder.appendChild(el("p",{class:"hint",
      text:"This type brings no fields — it is taken in for its edges or its arrangement."}));
    teil.appendChild(felder);

    kopf.addEventListener("click",function(){
      offen=!offen;
      UI.regOpen=UI.regOpen||{};
      if(offen) UI.regOpen[schluessel]=1; else delete UI.regOpen[schluessel];
      felder.style.display=offen?"":"none";
      pfeil.textContent=offen?"\u25be":"\u25b8";
      kopf.setAttribute("aria-expanded",String(offen));
    });
    kopf.setAttribute("role","button");
    kopf.setAttribute("aria-expanded",String(offen));
    aussen.appendChild(teil);
  });

  /* ---- Und die Typen, die über eine Kante hängen ----
     Der Statblock einer Kreatur ist ein eigener Artikel, und seine Felder
     gehören trotzdem zu dem, was eine Kreatur trägt: wer im Register
     wissen will, was an einer Kreatur dransteht, will `ac` und `hp` sehen
     und nicht „es gibt da eine Kante". Also stehen sie hier — als Gruppe
     wie eine geerbte, mit einer Marke, die sagt, dass sie woanders wohnen
     und **nicht** in der Karte dieser Art stehen. */
  verlinkteTypen(ifn).forEach(function(l){
    var dl=REG.interfaces[l.type]||{};
    var kette=selfAndAncestors(l.type);
    var ks=[];
    kette.forEach(function(a){ ks=ks.concat(Object.keys(propsOf(a))); });
    var schluessel=ifn+"::\u2192"+l.type;
    var offen=!!(UI.regOpen||{})[schluessel];
    var teil=el("div",{class:"fbox part linked","data-linked":l.type});
    var kopf=el("div",{class:"fhead klapp"});
    var pfeil=el("span",{class:"twist",text:offen?"\u25be":"\u25b8"});
    kopf.appendChild(pfeil);
    kopf.appendChild(el("button",{class:"ref",type:"button","data-from":l.type,
      title:"Open "+(dl.label||l.type)+" as a type of its own",
      onclick:function(ev){
        ev.stopPropagation();
        UI.typePick=l.type; UI.regiface=l.type; UI.regcomp=""; UI.regprop=""; render(); }},
      dl.label||l.type));
    kopf.appendChild(el("span",{class:"pill",
      title:"Its own article, held by the edge \u201c"+l.relation+"\u201d ("+
        (l.cardinality==="one"?"one":"many")+"). The values do not live in this type\u2019s card.",
      text:"linked \u00b7 "+l.relation}));
    kopf.appendChild(el("span",{class:"co",text:ks.length
      ?ks.length+(ks.length===1?" field":" fields")
      :"no fields"}));
    teil.appendChild(kopf);
    var felder=el("div",{class:"partfields"});
    if(!offen) felder.style.display="none";
    /* **Die ganze Kette des anderen Typs, nicht nur seine eigenen Felder.**
       Die sechs Attribute wohnen an `Abilities`, und der Statblock nimmt
       sie dazu — wer an der Kreatur nachsieht, was dransteht, sucht `str`
       und `dex` und nicht die Auskunft, dass es da noch einen Obertyp
       gibt. Gruppiert nach dem Typ, der ein Feld erklärt, denn geändert
       wird es dort. */
    kette.forEach(function(a,i){
      var aks=Object.keys(propsOf(a));
      if(!aks.length)return;
      if(i) felder.appendChild(el("div",{class:"fhead sub"},[
        el("span",{class:"co",text:"via "}),
        el("button",{class:"ref",type:"button","data-from":a,
          title:"Open "+((REG.interfaces[a]||{}).label||a)+" as a type of its own",
          onclick:function(ev){ ev.stopPropagation();
            UI.typePick=a; UI.regiface=a; UI.regcomp=""; UI.regprop=""; render(); }},
          (REG.interfaces[a]||{}).label||a)]));
      aks.forEach(function(k){
        felder.appendChild(i?erbRow(a,k,l.type,w,save):fieldRow(a,k,l.type,w,save));
      });
    });
    teil.appendChild(felder);
    kopf.addEventListener("click",function(){
      offen=!offen;
      UI.regOpen=UI.regOpen||{};
      if(offen) UI.regOpen[schluessel]=1; else delete UI.regOpen[schluessel];
      felder.style.display=offen?"":"none";
      pfeil.textContent=offen?"\u25be":"\u25b8";
      kopf.setAttribute("aria-expanded",String(offen));
    });
    kopf.setAttribute("role","button");
    kopf.setAttribute("aria-expanded",String(offen));
    aussen.appendChild(teil);
  });

  /* ---- Und die Kanten, die von hier ausgehen ----
     **Damit ein Gesamtbild entsteht.** Eine Kante ist kein Feld: sie steht
     nicht in der Karte, sie zeigt auf einen anderen Artikel, und die
     Gegenrichtung ist eine Abfrage. Aber wer im Register wissen will, was
     an einer Art dransteht, will sie sehen — sonst liest er eine
     Feldliste und hält sie für alles.

     Die mit `asField` stehen schon oben als eigene Gruppe: dort **sind**
     sie ein Feld. Hier kommt der Rest, und die Zahl der Kantenarten, die
     mit `*` jede Art treffen, steht als Fussnote — sie sagen über diese
     Art nichts. */
  (function(){
    var schonOben={};
    verlinkteTypen(ifn).forEach(function(l){ schonOben[l.relation]=1; });
    /* **Genannt ist nicht dasselbe wie getroffen.** `relsFrom` nimmt auch
       die mit `from: ['*']` mit — die treffen jede Art und sagen über
       diese nichts. Also zählt hier nur, was sie (oder einen ihrer
       Obertypen) beim Namen nennt. */
    var kette=selfAndAncestors(ifn);
    var genannt=[], allgemein=0;
    relsFrom(ifn).forEach(function(r){
      if(schonOben[r.type])return;
      var liste=r.from||[];
      var nennt=liste.length&&liste.indexOf("*")<0
        &&liste.some(function(n2){ return kette.indexOf(n2)>=0; });
      if(nennt) genannt.push(r); else allgemein++;
    });
    if(!genannt.length&&!allgemein)return;
    var schluessel=ifn+"::kanten";
    var offen=!!(UI.regOpen||{})[schluessel];
    var teil=el("div",{class:"fbox part kanten","data-kanten":"1"});
    var kopf=el("div",{class:"fhead klapp"});
    var pfeil=el("span",{class:"twist",text:offen?"\u25be":"\u25b8"});
    kopf.appendChild(pfeil);
    kopf.appendChild(el("b",{text:"Edges from here"}));
    kopf.appendChild(el("span",{class:"pill",
      title:"Not fields: an edge points at another article and is stored in one direction. The other way round is a query.",
      text:"edge \u00b7 its own article"}));
    kopf.appendChild(el("span",{class:"co",text:genannt.length
      ?genannt.length+(genannt.length===1?" kind":" kinds")
      :"none that name this type"}));
    teil.appendChild(kopf);
    var felder=el("div",{class:"partfields"});
    if(!offen) felder.style.display="none";
    genannt.sort(function(a,b){ return a.type.localeCompare(b.type); }).forEach(function(r){
      var zeile=el("div",{class:"frow inh"});
      zeile.appendChild(el("span",{class:"fk",text:r.type}));
      zeile.appendChild(el("span",{class:"co",text:r.label||r.type}));
      var ziel=el("span",{class:"dgz"});
      (r.to||["*"]).forEach(function(n2,i){
        if(i) ziel.appendChild(el("span",{class:"co",text:", "}));
        if(n2==="*"||n2==="same"||!REG.interfaces[n2])
          ziel.appendChild(el("span",{class:"co",text:n2}));
        else ziel.appendChild(el("button",{class:"ref",type:"button",onclick:function(){
          UI.typePick=n2; UI.regiface=n2; UI.regcomp=""; UI.regprop=""; render(); }},
          REG.interfaces[n2].label||n2));
      });
      zeile.appendChild(ziel);
      zeile.appendChild(el("span",{class:"pill q",
        text:(r.cardinality==="one"?"one":"many")+(r.owned?" \u00b7 owned":"")}));
      zeile.appendChild(el("button",{class:"btn sm gh",type:"button",
        title:"Open this edge kind under Registry \u00b7 Relations",
        onclick:function(){ UI.regtab="relations"; UI.regrel=r.type; go({k:"reg"}); }},
        "\u2197"));
      felder.appendChild(zeile);
    });
    if(allgemein) felder.appendChild(el("p",{class:"hint",style:"margin:4px 0 0",
      text:"Plus "+allgemein+" edge kinds that hit every kind (*) \u2014 they say nothing about this one."}));
    teil.appendChild(felder);
    kopf.addEventListener("click",function(){
      offen=!offen;
      UI.regOpen=UI.regOpen||{};
      if(offen) UI.regOpen[schluessel]=1; else delete UI.regOpen[schluessel];
      felder.style.display=offen?"":"none";
      pfeil.textContent=offen?"\u25be":"\u25b8";
      kopf.setAttribute("aria-expanded",String(offen));
    });
    kopf.setAttribute("role","button");
    kopf.setAttribute("aria-expanded",String(offen));
    aussen.appendChild(teil);
  })();

  /* Und ein ganzer Typ dazu — seine Felder kommen mit. */
  if(w){
    var mehr=el("select",{class:"i",style:"width:auto"});
    mehr.appendChild(el("option",{value:""},"+ type\u2026"));
    typeList().forEach(function(n2){
      if(n2===ifn||wouldCycle(ifn,n2)||direkt.indexOf(n2)>=0)return;
      mehr.appendChild(el("option",{value:n2},REG.interfaces[n2].label||n2)); });
    mehr.addEventListener("change",function(){
      if(!mehr.value)return;
      var dd=REG.interfaces[ifn];
      dd.extends=parentsOf(ifn).concat([mehr.value]);
      save(); });
    var pbar=el("div",{class:"addbar",style:"margin-top:9px"});
    pbar.appendChild(el("span",{class:"co",
      text:direkt.length
        ?"Take a type in — its fields come along"
        :"This type declares its fields itself. Take one in and its fields come along"}));
    pbar.appendChild(mehr);
    aussen.appendChild(pbar);
  }
  return aussen;
}

/* Eine geerbte Zeile: das Feld gehört dem Bestandteil, und dort wird es
   geändert — wo, sagt die Kopfzeile des Blocks; an jeder Zeile stünde es
   dreiundachtzigmal.
   
   **Die Beschriftung ist die Ausnahme**, und zwar weil sie keine Tatsache
   über das Feld ist, sondern eine über diese Art: derselbe `Time.until`
   ist an einem Ereignis, wann es aufhört, und an einem Auftrag, wann es zu
   spät ist. Also darf die Art ihn umbenennen, und das schreibt in ihre
   `titles` und nicht in den Bestandteil. Eine Umbenennung, die ein
   *Obertyp* gesetzt hat, bleibt hier lesbar: sie zu ändern änderte sie für
   jede Unterart mit. */
function erbRow(art,k,ifn,w,save){
  var p=propsOf(art)[k]||{};
  var pflicht=(schemaOf(art).required||[]).indexOf(k)>=0;
  var eigenName=p.title||k;
  var woher=titleSource(ifn,art,k);
  var jetzt=fieldTitle(ifn,art,k,p);
  var row=el("div",{class:"frow inh"});
  row.appendChild(el("span",{class:"fk",text:k+(pflicht?"*":"")}));

  /* Wem das Feld gehört, sagt die **Kopfzeile der Gruppe** — dort steht es
     einmal und nicht an jeder der achtundvierzig Zeilen, und dort wird der
     Typ auch herausgenommen. Die Zeile selbst sagt, wie das Feld **hier**
     heisst, und lässt es einstellen. */
  if(w&&(!woher||woher===ifn)){
    var ti=el("input",{class:"i",type:"text",value:jetzt,placeholder:eigenName,
      title:"What this field is called here. Empty means “"+eigenName+"”, the name it brings."});
    ti.addEventListener("change",function(){
      var neu=ti.value.trim();
      var d=REG.interfaces[ifn]; if(!d)return;
      var ref=art+"."+k;
      var t=d.titles||{};
      /* Gleich wie der eigene Name heisst: keine Umbenennung. Sie
         stehenzulassen wäre eine Zeile, die nichts tut und beim nächsten
         Umbenennen des Feldes still falsch wird. */
      if(!neu||neu===eigenName) delete t[ref]; else t[ref]=neu;
      if(Object.keys(t).length) d.titles=t; else delete d.titles;
      save();
    });
    row.appendChild(ti);
  } else {
    row.appendChild(el("span",{class:"co",
      title:woher?("Renamed at "+(REG.interfaces[woher].label||woher)+
        " — change it there, it holds for every kind under it"):"",
      text:jetzt+(woher&&woher!==ifn?" ← "+(REG.interfaces[woher].label||woher):"")}));
  }

  row.appendChild(el("span",{class:"pill q"+(p.derived?" der":""),
    title:p.derived?"Computed on read — no input, no column (D8)":"",
    text:p.derived?"derived":fieldKind(p)}));
  /* Dass hier umbenannt wurde, muss man sehen — sonst sucht jemand den
     Namen im Bestandteil und findet ihn nicht. */
  if(woher===ifn&&ifn) row.appendChild(el("span",{class:"pill",
    title:"Renamed here; it is called “"+eigenName+"” where it is declared",
    text:"renamed"}));

  /* **Auch ein geerbtes Feld lässt sich einstellen** — Standard, Werte,
     Pflicht, Spanne. Geändert wird dabei der Typ, dem es gehört, und das
     gilt für jede Art, die ihn nimmt; darum sagt es die Kopfzeile der
     Gruppe und der Titel dieses Knopfs. Ohne das müsste man den Typ
     aufschlagen, um einen Standard zu setzen, und käme mit dem, was man
     gerade eingestellt hat, nirgends wieder heraus.

     Gelöscht wird es **nur dort**: das × steht an der Zeile des Typs, dem
     das Feld gehört, und die steht eine Gruppe weiter unten. Hier wäre es
     der Klick, der aussieht wie „an dieser Art weg" und alle trifft. */
  var id=art+"."+k;
  row.appendChild(el("button",{class:"btn sm gh",type:"button",
    title:"Settings of this field — they belong to "+
      ((REG.interfaces[art]||{}).label||art)+" and hold for every kind that takes it",
    onclick:function(){ UI.regprop=(UI.regprop===id?"":id); render(); }},
    UI.regprop===id?"\u25b4":"\u22ef"));

  var wrap=el("div");
  wrap.appendChild(row);
  if(UI.regprop===id) wrap.appendChild(fieldMore(art,k,ifn,w,save));
  return wrap;
}

/* Alle Felder einer Art mit der Art, die sie erklärt — dieselbe Reihenfolge
   wie die Liste oben. */
function fieldsOf(ifn){
  var out=[];
  selfAndAncestors(ifn).forEach(function(a){
    Object.keys(propsOf(a)).forEach(function(k){ out.push({type:a,key:k,prop:propsOf(a)[k]}); });
  });
  return out;
}

/* ---------- the fields of a component ----------
 Used from two places: inside an interface, where it says which *other*
 interfaces share the component, and in the components tab, where the
 component is the subject. `within` may be empty — the sharing note then
 names every user instead of "the others". */
function fieldBox(cn,within,w,saveC){
  var cd=REG.interfaces[cn];
  if(!cd) return el("div",{class:"fbox"},el("span",{class:"warnzeile",text:"Component missing from the registry."}));
  cd.schema=cd.schema||{type:"object",properties:{}};
  var schema=cd.schema;
  schema.properties=schema.properties||{};
  var props=schema.properties;
