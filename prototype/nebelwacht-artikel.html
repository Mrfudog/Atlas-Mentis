  var cols=Math.max(1,Number(card.tileCols)||1), rows=Math.max(1,Number(card.tileRows)||1);
  var px=Math.max(16,Number(card.tileSize)||256);
  var box=el("div",{class:"mtiles"});
  box.style.gridTemplateColumns="repeat("+cols+",1fr)";
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
    box.appendChild(el("img",{src:String(m).replace(/\{x\}/g,x).replace(/\{y\}/g,y),
      alt:"",loading:"lazy"}));
  }
  return {node:box,nat:{w:cols*px,h:rows*px}};
}

/* Ein Token einstellen: Art, Grösse, Drehung, Notiz — und der Weg hinaus.
   Es steht alles an der Kante, weil alles davon an **beiden** Enden hängt:
   dasselbe Fass steht auf einer Karte quer und auf der nächsten längs, und
   dieselbe Laterne leuchtet auf einer Stadtkarte anders weit als auf einer
   Kampfkarte. */
function tokenSetup(e,r,art){
  dialog("On the map — "+(art?nameOf(art):"token"),function(host,close){
    var pr=r.props||{};
    var artSel=el("select",{class:"i"});
    TOKEN_KINDS.forEach(function(k){ artSel.appendChild(el("option",{value:k[0]},k[1])); });
    artSel.value=tokenKind(r);
    var size=el("input",{class:"i",type:"number",min:"0.25",step:"0.25",
      value:String(Number(pr.size)||1)});
    var rot=el("input",{class:"i",type:"number",min:"-180",max:"360",step:"15",
      value:String(Number(pr.rot)||0)});
    var ratio=el("input",{class:"i",type:"number",min:"0.1",step:"0.1",
      value:String(Number(pr.ratio)>0?Number(pr.ratio):1)});
    var note=el("input",{class:"i",type:"text",value:pr.note||"",placeholder:"optional"});
    var hell=el("input",{class:"i",type:"number",min:"0",step:"1",
      value:pr.light==null?"":String(pr.light)});
    var matt=el("input",{class:"i",type:"number",min:"0",step:"1",
      value:pr.dim==null?"":String(pr.dim)});

    host.appendChild(field("Kind",artSel));
    host.appendChild(field("Width in squares",size));
    /* Seitenverhältnis nur beim Möbel: eine Kreatur belegt Felder und kein
       Rechteck, und ein Feld, das für sie nichts heisst, fragt nach einer
       Antwort, die es nicht gibt. */
    var vz=field("Height ÷ width",ratio);
    host.appendChild(vz);
    host.appendChild(field("Rotation in degrees",rot));
    host.appendChild(field("Note",note));
    host.appendChild(field("Bright light in squares",hell));
    host.appendChild(field("Dim light in squares",matt));
    function zeig(){ vz.style.display=artSel.value==="scenery"?"":"none"; }
    artSel.addEventListener("change",zeig); zeig();

    var weg=el("div",{class:"rowbtns"});
    weg.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
      close();
      confirmDialog("Take “"+(art?nameOf(art):"?")+"” off this map?",function(){
        e.relations=e.relations.filter(function(x){return x.id!==r.id;}); persist(e); });
    }},"Take it off"));
    host.appendChild(weg);

    actions(host,close,function(){
      var neu=Object.assign({},pr,{
        kind:artSel.value,
        size:Number(size.value)||1,
        rot:Number(rot.value)||undefined,
        ratio:artSel.value==="scenery"&&Number(ratio.value)>0&&Number(ratio.value)!==1
          ?Number(ratio.value):undefined,
        note:note.value.trim()||undefined,
        light:hell.value===""?undefined:Number(hell.value),
        dim:matt.value===""?undefined:Number(matt.value)});
      r.props=neu;
      persist(e);
    },"Save");
  });
}

/* ---- Hineinzoomen statt hineinspringen (REQ-131, 160) ----
   Eine Unterkarte ist ein Rahmen auf der grossen Karte. Ihn anzuklicken
   ging schon; was fehlte, war das, was man tatsächlich tut: **näher
   herangehen.** Das Rad zoomt auf den Zeiger zu, und wenn ein Rahmen den
   Blick füllt, ist der nächste Zoomschritt der Schritt hinein.

   Eine Schwelle allein wäre ein Sprung, den niemand kommen sieht. Deshalb
   zwei Stufen: ab `NAH` wird der Rahmen aufdringlich — durchgezogen,
   beschriftet, „zoom in to enter" —, und erst der Schritt danach betritt
   ihn. Und zurück geht es genauso: wer auf einer Unterkarte hinauszoomt
   und schon ganz draussen ist, landet beim Elternteil. */
var MAP_NAH=0.55, mapBox={w:0,h:0};
function noteMapBox(){
  var st=document.querySelector(".mapstage");
  if(st&&st.clientWidth) mapBox={w:st.clientWidth,h:st.clientHeight||mapBox.h};
}
/* Wie viel vom Sichtfenster ein Rahmen füllt. Gemessen am Fenster und
   nicht am Bild: „füllt den Blick" ist eine Aussage über den Blick.

   Die Höhe kommt aus der natürlichen Grösse und nicht aus `offsetHeight`.
   Solange das Bild lädt, ist die gemessene Höhe 0 — und dann wäre jeder
   Rahmen winzig, obwohl er den halben Schirm füllt. Dieselbe Regel wie
   beim Nebel: das Register zuerst, die Messung danach. */
function areaShare(pr,nat,zoom){
  /* Gemessen wird das Sichtfenster, gerechnet das Bild. Beim Zeichnen hängt
     das neue Bild noch nicht im Baum — es zu messen ergäbe null, und dann
     wäre jeder Rahmen winzig, obwohl er den halben Schirm füllt. Die
     Breite des Bildes ist ohnehin der Zoom mal das Fenster; sie
     auszurechnen ist genauer als sie abzulesen. */
  /* Beim Zeichnen ist das alte Sichtfenster schon weg und das neue noch
     nicht da. Darum wird es nach jedem Zeichnen gemerkt: die Grösse des
     Fensters ändert sich mit dem Fenster und nicht mit dem Zoom. */
  var st=document.querySelector(".mapstage");
  var sw=(st&&st.clientWidth)||mapBox.w, sh=(st&&st.clientHeight)||mapBox.h;
  if(!sw||!sh||!nat||!(Number(nat.w)>0))return 0;
  var bw=sw*(zoom||1), bh=bw*(Number(nat.h)/Number(nat.w));
  /* Beide Seiten müssen voll sein. Ein Rahmen, der nur quer den Blick
     füllt, ist ein Streifen und kein Ziel. */
  return Math.min(((Number(pr.w)||0.12)*bw)/sw,((Number(pr.h)||0.12)*bh)/sh);
}
function mapZoomBy(schritt,e,nat){
  var alt=UI.mapZoom;
  var neu=Math.min(8,Math.max(0.25,alt*(schritt>0?1.25:0.8)));
  if(neu===alt&&schritt<0){
    /* Ganz draussen und noch weiter hinaus: das ist die Frage nach der
       Karte darüber. */
    var oben=parentMap(e);
    if(oben){ UI.mapZoom=1; go({k:"art",id:oben.id}); return; }
  }
  if(schritt>0){
    /* Was den Blick schon füllt, wird jetzt betreten. Geprüft wird vor dem
       Zoomen, damit der Schritt hinein und der Schritt näher nicht
       derselbe sind. */
    var rein=null;
    childMaps(e).forEach(function(k){
      var pr=k.rel.props||{};
      if(pr.x==null||pr.y==null)return;
      if(areaShare(pr,nat,UI.mapZoom)>=MAP_NAH) rein=k.map;
    });
    if(rein){ UI.mapZoom=1; go({k:"art",id:rein.id}); return; }
  }
  UI.mapZoom=neu;
  render();
}

function elMap(e,ifn,item){
  var card=mapCard(e);
  var src=assetSrc(card.image);
  var wrap=el("div",{class:"mapbox"});
  /* Die beiden werden weiter unten gefüllt; die Leiste braucht sie nur,
     wenn jemand klickt, und dann stehen sie. */
  var stage=null, img=null, nat=null;   /* erst weiter unten gefüllt */

  /* Werkzeugleiste: Zoom, Gitter, Tokenfilter. Der Filter ist kein Zierrat —
     eine vorbereitete Karte und eine im Spiel laufende sind dieselbe Karte,
     und man will die Vorbereitung sehen können, ohne die Spielzüge. */
  var bar=el("div",{class:"maptools"});
  if(inPlacement) bar.style.display="none";
  /* Dieselbe Funktion wie das Rad: zwei Wege, die verschieden zoomen, sind
     zwei Wege, auf denen man verschieden tief landet. */
  [["−",-1],["+",1]].forEach(function(z){
    bar.appendChild(el("button",{class:"btn sm",type:"button",title:"Zoom",
      onclick:function(){ mapZoomBy(z[1],e,nat); }},z[0]));
  });
  bar.appendChild(el("span",{class:"hint",style:"margin:0",
    text:Math.round(UI.mapZoom*100)+"%"+(card.scale?" · 1 square = "+card.scale:"")}));
  var filt=el("select",{class:"i",style:"width:auto"});
  filt.appendChild(el("option",{value:""},"all tokens"));
  TOKEN_KINDS.forEach(function(k){ filt.appendChild(el("option",{value:k[0]},k[1])); });
  filt.value=UI.mapKind;
  filt.addEventListener("change",function(){ UI.mapKind=filt.value; render(); });
  bar.appendChild(filt);
  if(canWrite()) bar.appendChild(el("button",{class:"btn sm",type:"button",
    onclick:function(){ addMarker(e); }},"+ Token"));
  if(canWrite()) bar.appendChild(el("button",{class:"btn sm",type:"button",
    onclick:function(){ addSubmap(e,null); }},"+ Sub-map"));
  var eltern=parentMap(e);
  if(eltern) bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    onclick:function(){ go({k:"art",id:eltern.id}); }},"↑ "+nameOf(eltern)));
  wrap.appendChild(bar);

  var kacheln=tileGrid(card);
  if(!src&&!kacheln){
    wrap.appendChild(el("div",{class:"empty",
      text:canWrite()?"This map has no image yet — set MapInfo · Image.":"No image."}));
    return wrap;
  }
  if(canWrite()&&!inPlacement){
    wrap.appendChild(sheetTools(e,card));
    wrap.appendChild(fogTools(e,card));
  }

  stage=el("div",{class:"mapstage"});
  var inner=el("div",{class:"mapinner"});
  /* Das Rad zoomt und rollt nicht. Ohne `passive:false` liesse sich das
     Scrollen nicht abbestellen, und die Seite führe unter der Karte weg. */
  stage.addEventListener("wheel",function(ev){
    if(ev.ctrlKey)return;                 /* der Browserzoom gehört dem Browser */
    ev.preventDefault();
    mapZoomBy(ev.deltaY<0?1:-1,e,nat);
  },{passive:false});
  /* Alt-Klick zeigt auf eine Stelle. Das ist der einzige Grund, warum es den
     Echtzeitkanal überhaupt braucht: „da" lässt sich nicht speichern. */
  inner.addEventListener("click",function(ev){
    if(!ev.altKey)return;
    var rect=img.getBoundingClientRect();
    if(!rect.width)return;
    pingMap(e.id,(ev.clientX-rect.left)/rect.width,(ev.clientY-rect.top)/rect.height);
  });
  if(kacheln){
    img=kacheln.node;
    img.style.width=(UI.mapZoom*100)+"%";
  } else {
    img=el("img",{class:"mapimg",src:src,alt:nameOf(e)});
    img.style.width=(UI.mapZoom*100)+"%";
    /* Die natürliche Grösse kommt erst mit dem Bild. Bis dahin wird nichts
       aufgedeckt — lieber ein Bild ohne Nebel gar nicht zeigen als einen
       Nebel, der einen Wimpernschlag zu spät kommt. */
    img.addEventListener("load",function(){ noteNat(src,img.naturalWidth,img.naturalHeight); });
    if(img.complete&&img.naturalWidth) noteNat(src,img.naturalWidth,img.naturalHeight);
  }
  inner.appendChild(img);

  /* Die Zeichenebenen darüber. Das unterste Blatt bleibt im Fluss — es
     bestimmt, wie gross die Karte ist —, auch wenn es ausgeblendet ist;
     ausgeblendet heisst dann durchsichtig und nicht weg. Alle weiteren
     liegen darüber und fangen keine Maus. */
  if(!kacheln){
    var basis=mapSheets(e,card)[0];
    if(!(basis.visible&&(isGM()||!basis.gmOnly))) img.style.opacity="0";
    drawnSheets(e,card).forEach(function(sh){
      if(sh.base)return;
      var u=assetSrc(sh.image); if(!u)return;
      var lage=el("img",{class:"msheet",src:u,alt:"",title:sh.name});
      lage.style.opacity=String(Math.max(0,Math.min(1,sh.opacity)));
      inner.appendChild(lage);
    });
  }

  var raster=gridOverlay(card,UI.mapZoom);
  if(raster) inner.appendChild(raster);

  nat=kacheln?kacheln.nat:natFor(card,src);
  var sicht=nat?visionOverlay(e,card,nat):null;
  if(sicht) inner.appendChild(sicht);
  else if(!nat&&(card.fog||(card.lighting&&card.lighting!=="bright")))
    inner.appendChild(el("div",{class:"mfogflat"}));

  /* Untergliederungen als Rechtecke: ein Klick springt hinein, und die
     Breadcrumbs merken sich den Weg zurück (REQ-131, REQ-160). */
  childMaps(e).forEach(function(k){
    var pr=k.rel.props||{};
    if(pr.x==null||pr.y==null)return;
    /* Füllt der Rahmen den Blick, ist der nächste Zoomschritt der Schritt
       hinein. Er sagt das vorher — ein Sprung, den niemand kommen sieht,
       ist keine Navigation, sondern ein Versehen. */
    var nah=areaShare(pr,nat,UI.mapZoom)>=MAP_NAH;
    var box=el("button",{class:"maparea"+(nah?" near":""),type:"button",
      title:nah?"Zoom in once more to enter "+nameOf(k.map):"Enter "+nameOf(k.map),
      onclick:function(){ UI.mapZoom=1; go({k:"art",id:k.map.id}); }});
    box.style.left=(pr.x*100)+"%"; box.style.top=(pr.y*100)+"%";
    box.style.width=((pr.w||0.12)*100)+"%"; box.style.height=((pr.h||0.12)*100)+"%";
    box.appendChild(el("span",{text:nah?nameOf(k.map)+" — zoom in to enter":nameOf(k.map)}));
    inner.appendChild(box);
  });

  var marker=(e.relations||[]).filter(function(r){ return r.type===REL_MARKER; });
  marker.forEach(function(r){
    var art=r.to?ENT.get(r.to):null;
    var kind=tokenKind(r);
    if(UI.mapKind&&kind!==UI.mapKind)return;
    var pr=r.props||{};
    /* Der Zeiger auf dem, der dran ist (REQ-144): derselbe Zeichner, nur
       ein Ring mehr. */
    var dran=UI.turnActor&&art&&art.id===UI.turnActor;
    /* Ein Möbel ist kein Token: es liegt auf der Karte, statt auf ihr zu
       stehen. Deshalb ohne Kreis, mit Drehung und mit einem Seitenverhältnis
       — ein Tisch ist kein Quadrat. */
    var moebel=kind==="scenery";
    var t=el("button",{class:"mtoken k-"+kind+(dran?" now":"")+(moebel?" asset":""),
      type:"button",
      title:(art?nameOf(art):"(missing)")+(pr.note?" — "+pr.note:"")+
        (canWrite()?" · right-click to set it up":"")});
    t.style.left=((pr.x||0.5)*100)+"%";
    t.style.top=((pr.y||0.5)*100)+"%";
    var d=Math.max(14,(Number(card.gridSize)||70)*(Number(pr.size)||1)*UI.mapZoom);
    var hoch=moebel?d*(Number(pr.ratio)>0?Number(pr.ratio):1):d;
    t.style.width=d+"px"; t.style.height=hoch+"px";
    /* Die Drehung kommt hinter die Zentrierung, sonst dreht sich der Punkt
       mit und das Möbel wandert beim Drehen aus. */
    var dreh=Number(pr.rot)||0;
    if(dreh) t.style.transform="translate(-50%,-50%) rotate("+dreh+"deg)";
    var bild=art&&assetSrc(((art.components||{}).Image||{}).ref||((art.components||{}).Image||{}).url);
    if(bild) t.appendChild(el("img",{src:bild,alt:""}));
    else t.appendChild(el("span",{text:(art?nameOf(art):"?").slice(0,2)}));

    /* Ziehen verschiebt, ein Klick ohne Ziehen öffnet. Beides am selben
       Knopf: ein Token, das sich nur über ein Menü bewegen liesse, bewegt
       niemand mitten im Kampf. */
    var von=null;
    t.addEventListener("pointerdown",function(ev){
      if(!canWrite())return;
      von={x:ev.clientX,y:ev.clientY,moved:false};
      try{ t.setPointerCapture(ev.pointerId); }catch(x){}
    });
    t.addEventListener("pointermove",function(ev){
      if(!von)return;
      if(Math.abs(ev.clientX-von.x)+Math.abs(ev.clientY-von.y)>4) von.moved=true;
      if(!von.moved)return;
      var rect=img.getBoundingClientRect();
      if(!rect.width||!rect.height)return;
      var nx=Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width));
      var ny=Math.min(1,Math.max(0,(ev.clientY-rect.top)/rect.height));
      t.style.left=(nx*100)+"%"; t.style.top=(ny*100)+"%";
      von.nx=nx; von.ny=ny;
    });
    t.addEventListener("pointerup",function(ev){
      if(!von){ if(art) go({k:"art",id:art.id}); return; }
      var war=von; von=null;
      try{ t.releasePointerCapture(ev.pointerId); }catch(x){}
      if(!war.moved){ if(art) go({k:"art",id:art.id}); return; }
      r.props=Object.assign({},r.props,{x:war.nx,y:war.ny});
      persist(e);
    });
    /* Rechtsklick stellt ein und löscht nicht sofort. Ein Rechtsklick, der
       ohne Rückfrage etwas wegnimmt, ist der Klick, den man auf einem
       Laptop-Touchpad aus Versehen macht. */
    t.addEventListener("contextmenu",function(ev){
      ev.preventDefault();
      if(!canWrite())return;
      tokenSetup(e,r,art);
    });
    inner.appendChild(t);
  });

  (UI.pings||[]).forEach(function(pg){
    if(pg.map!==e.id)return;
    var n=el("div",{class:"mping"});
    n.style.left=(pg.x*100)+"%"; n.style.top=(pg.y*100)+"%";
    n.appendChild(el("span",{text:pg.who||""}));
    inner.appendChild(n);
  });

  if(UI.mapTool&&canWrite()&&!inPlacement) inner.appendChild(mapToolLayer(e,card,img));

  stage.appendChild(inner);
  wrap.appendChild(stage);

  var zahl=marker.length;
  wrap.appendChild(el("p",{class:"hint",
    text:zahl?(zahl+" token"+(zahl===1?"":"s")+
      (canWrite()?" · drag to move, right-click to set up":"")+
      (roomNS?" · alt-click points at a spot for everyone":"")):
      (roomNS?"No tokens yet — alt-click points at a spot for everyone.":"No tokens yet.")}));
  return wrap;
}

/* Ein Token anlegen: Artikel wählen, Art wählen, fertig. Es landet in der
   Mitte und wird von dort gezogen — eine Eingabemaske für Koordinaten wäre
   genau der Umweg, den niemand am Tisch geht. */
function addMarker(e){
  dialog("Put a token on the map",function(host,close){
    var suche=el("input",{class:"i",type:"text",placeholder:"Search articles…"});
    var sel=el("select",{class:"i",size:"8",style:"height:auto"});
    function fuelle(){
      var q=suche.value.toLowerCase().trim();
      sel.textContent="";
      byName().forEach(function(c){
        if(c.id===e.id)return;
        if(q&&nameOf(c).toLowerCase().indexOf(q)<0)return;
        sel.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
      });
      if(!sel.childNodes.length) sel.appendChild(el("option",{value:""},"— nothing matches —"));
    }
    suche.addEventListener("input",fuelle);
    var art=el("select",{class:"i"});
    TOKEN_KINDS.forEach(function(k){ art.appendChild(el("option",{value:k[0]},k[1])); });
    var note=el("input",{class:"i",type:"text",placeholder:"optional"});
    var size=el("input",{class:"i",type:"number",value:"1",min:"0.25",step:"0.25"});
    host.appendChild(field("Article",suche));
    host.appendChild(sel);
    host.appendChild(field("Kind",art));
    host.appendChild(field("Size in squares",size));
    host.appendChild(field("Note",note));
    fuelle();
    actions(host,close,function(){
      if(!sel.value)return false;
      e.relations=e.relations||[];
      e.relations.push({id:uid("r"),type:REL_MARKER,to:sel.value,props:{
        x:0.5,y:0.5,kind:art.value,size:Number(size.value)||1,
        note:note.value.trim()||undefined}});
      persist(e);
    },"Place");
  });
}

/* Eine Unterkarte: entweder eine vorhandene hineinhängen oder eine neue
   anlegen. Der Ankerbereich sitzt zuerst in der Mitte und wird dort
   zurechtgezogen — dieselbe Regel wie beim Token. */
function addSubmap(e,rahmen){
  dialog("Sub-map",function(host,close){
    var sel=el("select",{class:"i"});
    sel.appendChild(el("option",{value:""},"— create a new map —"));
    byName().forEach(function(c){
      if(c.id===e.id)return;
      if(((c.interfaces||[])[0])!==MAP_IFACE)return;
      sel.appendChild(el("option",{value:c.id},nameOf(c)));
    });
    var nm=el("input",{class:"i",type:"text",placeholder:"Name of the new map"});
    host.appendChild(field("Map",sel));
    host.appendChild(field("New name",nm));
    host.appendChild(el("p",{class:"hint",
      text:rahmen?"The frame you dragged is where it sits on this map.":
        "No frame drawn — it lands in the middle. Use the Sub-map tool to draw where it sits."}));
    actions(host,close,function(){
      var kind=sel.value?ENT.get(sel.value):null;
      if(!kind){
        var name=nm.value.trim(); if(!name){nm.focus();return false;}
        kind={ id:uid("mp"), interfaces:[MAP_IFACE], name:name, tags:[],
          components:{ Name:{text:name}, Identity:{key:"map/"+slug(name),aliases:[]} },
          adhoc:[], blocks:[], relations:[], createdAt:new Date().toISOString() };
        reqFor(MAP_IFACE).forEach(function(c){ if(!kind.components[c]&&REG.components[c]) kind.components[c]={}; });
        applyDefaults(kind,MAP_IFACE);
        ENT.set(kind.id,kind);
      }
      kind.relations=(kind.relations||[]).filter(function(r){return r.type!==REL_INSIDE;});
      kind.relations.push({id:uid("r"),type:REL_INSIDE,to:e.id,
        props:rahmen?{x:rahmen.x,y:rahmen.y,w:rahmen.w,h:rahmen.h}
                    :{x:0.4,y:0.4,w:0.2,h:0.2}});
      persist(kind);
      render();
    },"Attach");
  });
}

/* ---------- Zugang und Spieleransicht (REQ-031 bis 040, 069, 119, 128) ----------
   Ein Spieler ist kein Zuschauer mit weniger Knöpfen. Er sieht einen anderen
   Artikel: Sichtbarkeit und Wissen greifen *vor* der Darstellung, nicht
   danach. Alles, was die Seite filtert, filtert sie an drei Stellen —
   welche Artikel, welche Felder, welche Blöcke — und nirgends sonst.

   Die Identität kommt von der Laufzeit (`user`), nicht aus einem Passwort
   in einem Feld: die Seite hat keinen Server, an dem sie eines prüfen
   könnte, und ein Passwort im Browser ist keines. Wenn der echte Stapel
   kommt, tritt REQ-031 an diese Stelle — die Abfragen darunter bleiben.

   Der „Ansehen als"-Schalter zählt wie ein anderer Betrachter. Sonst liesse
   sich nicht prüfen, was ein Charakter sieht, und man merkte es erst am
   Tisch. */
var ACCESS_COMP="Access";

/* Wen dieser Nutzer spielt: die Figur, deren Access-Karte seine Id nennt. */
function actorForUser(uid){
  if(!uid)return "";
  var hit="";
  ENT.forEach(function(e){
    if(hit)return;
    var ac=(e.components||{})[ACCESS_COMP];
    if(ac&&Array.isArray(ac.userIds)&&ac.userIds.indexOf(uid)>=0) hit=e.id;
  });
  return hit;
}
/* Darf dieser Betrachter den Artikel überhaupt sehen? Nur die grobe Stufe
   (REQ-038): `gm` heisst Spielleitung, alles andere heisst sichtbar. Die
   feine Auswertung (REQ-039) ist das Wissensmodell, und das sitzt eine
   Ebene tiefer — am Feld, nicht am Artikel. */
function articleVisible(e){
  /* Der Stapel gilt für alle, auch für die Spielleitung: was nicht läuft,
     ist nicht da. Wissen und Sichtbarkeit sind die zweite Frage und
     kommen danach. */
  if(!inStack(e))return false;
  if(isOverridden(e))return false;
  if(isGM())return true;
  var vis=(e.components||{}).Visibility||{};
  if(vis.audience==="gm")return false;
  var a=viewerActor();
  if(Array.isArray(vis.hiddenFrom)&&a&&vis.hiddenFrom.indexOf(a)>=0)return false;
  return true;
}
/* Welche Feldverweise darf dieser Betrachter sehen? Offen plus das, was er
   weiss — dieselbe Abfrage wie in der Wissensansicht, nur als Filter. */
function visibleRefs(e,refs){
  if(isGM())return refs;
  var a=viewerActor();
  var erlaubt={};
  knowledgeGroups(e,refs,a).forEach(function(g){
    if(g.known) g.fields.forEach(function(f){ erlaubt[f]=1; });
  });
  return refs.filter(function(f){ return erlaubt[f]; });
}
/* Blöcke: was eine unbekannte Information beansprucht, fällt weg. Dazu die
   Blockarten, die ein Spieler grundsätzlich nicht sieht — als Einstellung,
   damit eine Kampagne das anders halten kann. */
function visibleBlockIds(e){
  var a=viewerActor();
  var ids=(e.blocks||[]).map(function(b){return b.anchor||b.id;});
  if(isGM())return ids;
  var geheim=String(setting("gmBlockTypes","secret,tactics")).split(",")
    .map(function(x){return x.trim();}).filter(Boolean);
  /* Zwei Regeln, und die ausdrückliche gewinnt: ein Block, den eine
     *bekannte* Information beansprucht, ist freigegeben — auch wenn er
     `secret` heisst. Genau dafür hat ihn jemand hineingelegt. Ein Block,
     den keine Information nennt, liegt offen und fällt nur über seine
     Blockart weg. Andersherum wäre jede Freigabe wirkungslos, sobald der
     Block die falsche Art trägt, und niemand fände den Grund. */
  var bekannt={}, beansprucht={};
  knowledgeGroups(e,[],a).forEach(function(g){
    g.blocks.forEach(function(b){
      if(!g.open) beansprucht[b]=1;
      if(g.known) bekannt[b]=1;
    });
  });
  return (e.blocks||[]).filter(function(b){
    var key=b.anchor||b.id;
    if(beansprucht[key])return !!bekannt[key];
    return geheim.indexOf(b.blockType)<0;
  }).map(function(b){ return b.anchor||b.id; });
}

/* Der Schalter in der Kopfzeile: als wen sehe ich das gerade an? */
function renderAsSelect(){
  var host=document.getElementById("asbox");
  if(!host)return;
  if(!me.gm){ host.style.display="none"; return; }
  host.style.display="";
  var spieler=[];
  ENT.forEach(function(e){
    if(!ifaceInList(["Creature","Party"],(e.interfaces||[])[0]))return;
    if(!(e.components||{})[ACCESS_COMP]&&((e.interfaces||[])[0])!=="PlayerCharacter")return;
    spieler.push(e);
  });
  spieler.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
  var sig=spieler.map(function(e){return e.id;}).join("|");
  if(host.getAttribute("data-sig")!==sig){
    host.textContent="";
    var sel=el("select",{class:"vw",id:"asview","aria-label":"Viewing as"});
    sel.appendChild(el("option",{value:""},"As GM"));
    spieler.forEach(function(e){ sel.appendChild(el("option",{value:e.id},"As "+nameOf(e))); });
    sel.addEventListener("change",function(){ UI.asActor=sel.value; UI.err=""; render(); });
    host.appendChild(sel);
    host.setAttribute("data-sig",sig);
  }
  var s2=document.getElementById("asview");
  if(s2) s2.value=UI.asActor||"";
  document.body.classList.toggle("asplayer",!!UI.asActor);
}

/* ---------- Wissen (A6) ----------
   Die Einheit zwischen Feld und Empfänger heisst Information und ist ein
   eigener Artikel. Nur ein Peg trägt Kanten — und „wer weiss vom wahren
   Namen des Barons?" soll ein Rückbezug sein wie jeder andere, kein Griff
   in ein Feldattribut, das ohnehin nur einen Empfänger fassen könnte.

     Artikel     --knowledge--> Information   (owned)
     Information --knownBy-->   Creature | Party | KnowledgeLevel
     Creature    --atLevel-->   KnowledgeLevel

   Ein Feld, das keine Information nennt, liegt offen. Die Umkehrung wäre
   sicherer, macht aber jede neue Zeile unsichtbar, bis jemand daran denkt.
   Deshalb steht „Offen" als eigene Gruppe zuoberst: man sieht dort immer,
   was gerade offen liegt. */
var INFO_IFACE="Information", INFO_COMP="Info",
    REL_KNOW="knowledge", REL_KNOWNBY="knownBy", REL_ATLEVEL="atLevel", REL_PARTY="memberOfParty";

function edgesOf(e,typ){
  return ((e&&e.relations)||[]).filter(function(r){return r.type===typ;});
}
function infosOf(e){
  var out=[];
  edgesOf(e,REL_KNOW).forEach(function(r){ var i=ENT.get(r.to); if(i) out.push(i); });
  return out;
}
function infoList(info,key){
  var raw=((info.components||{})[INFO_COMP]||{})[key];
  return Array.isArray(raw)?raw.map(String):[];
}
function infoTier(info){
  return ((info.components||{})[INFO_COMP]||{}).tier||"secret";
}
/* Dieselbe Regel wie bei den Ansichten: „Comp" nimmt die ganze Komponente,
   „Comp.feld" genau eines. */
function infoCovers(info,ref){
  var f=infoList(info,"fields"), cn=ref.split(".")[0];
  return f.indexOf(ref)>=0||f.indexOf(cn)>=0;
}
/* Wer zählt für diesen Betrachter als „ich": er selbst, seine Gruppen und
   seine Wissensstände. Einen Schritt weit — ein Stand, der einem anderen
   angehört, wäre eine Hierarchie, und die hat niemand verlangt. */
function knowledgeHolders(viewerId){
  var holders={}; holders[viewerId]=true;
  var v=ENT.get(viewerId); if(!v)return holders;
  edgesOf(v,REL_ATLEVEL).forEach(function(r){ holders[r.to]=true; });
  edgesOf(v,REL_PARTY).forEach(function(r){
    holders[r.to]=true;
    edgesOf(ENT.get(r.to),REL_ATLEVEL).forEach(function(q){ holders[q.to]=true; });
  });
  return holders;
}
function knowsInfo(info,viewerId){
  if(!viewerId)return true;               /* ohne Betrachter: die Spielleitung */
  var holders=knowledgeHolders(viewerId);
  return edgesOf(info,REL_KNOWNBY).some(function(r){ return !!holders[r.to]; });
}
/* Der Artikel, nach Informationen geordnet. Die offene Restgruppe steht
   vorn und trägt keine Information — sie ist, was übrig bleibt. */
function knowledgeGroups(e,refs,viewerId){
  var blockIds=(e.blocks||[]).map(function(b){return b.anchor||b.id;});
  var claimedF={}, claimedB={};
  var groups=infosOf(e).map(function(info){
    var fields=refs.filter(function(r){ return infoCovers(info,r); });
    var blocks=infoList(info,"blocks").filter(function(a){ return blockIds.indexOf(a)>=0; });
    fields.forEach(function(f){claimedF[f]=true;});
    blocks.forEach(function(b){claimedB[b]=true;});
    return {info:info,label:nameOf(info),fields:fields,blocks:blocks,open:false,
            known:knowsInfo(info,viewerId)};
  });
  return [{info:null,label:"Open",open:true,known:true,
           fields:refs.filter(function(f){return !claimedF[f];}),
           blocks:blockIds.filter(function(b){return !claimedB[b];})}].concat(groups);
}

function elKnowledge(e,ifn,item){
  /* Wo nichts gehütet wird, steht auch keine Gruppierung. Eine leere
     „offene Gruppe" auf jedem Artikel wäre Lärm — und sie sähe aus, als
     wäre Wissen eingerichtet, wo keines ist. */
  if(!infosOf(e).length)return null;
  var cells=fieldPlan(e,ifn,item.fields||"all",item.except);
  var zurueck=cells.withheld||0;
  var byRef={}; cells.forEach(function(c){ byRef[c.ref]=c; });
  var blocks={}; (e.blocks||[]).forEach(function(b){ blocks[b.anchor||b.id]=b; });
  var wrap=el("div",{class:"knowledge"});
  knowledgeGroups(e,cells.map(function(c){return c.ref;})).forEach(function(g){
    var box=el("div",{class:"kgrp"+(g.open?" open":"")});
    var head=el("div",{class:"kh"});
    head.appendChild(el("b",{text:g.label}));
    if(g.info) head.appendChild(el("span",{class:"pill q",text:infoTier(g.info)}));
    if(g.info){
      var who=el("span",{class:"who"});
      var recips=edgesOf(g.info,REL_KNOWNBY);
      if(!recips.length) who.appendChild(document.createTextNode("nobody yet"));
      recips.forEach(function(r,i){
        var t=ENT.get(r.to);
        if(i) who.appendChild(document.createTextNode(", "));
        if(t) who.appendChild(el("button",{class:"ref",type:"button",
          onclick:function(){go({k:"art",id:t.id});}},nameOf(t)));
        else who.appendChild(el("span",{class:"gone",text:"missing"}));
      });
      head.appendChild(who);
    }
    if(canWrite()) head.appendChild(el("button",{class:"btn gh sm",type:"button",
      title:g.open?"Turn the open fields into an Information":"Edit this Information",
      onclick:function(){ UI.pane="aside"; UI.aside="know";
        UI.info=g.info?g.info.id:""; if(!g.info) newInformation(e); else render(); }},
      g.open?"+ Information":"Edit"));
    box.appendChild(head);

    if(!g.fields.length&&!g.blocks.length){
      box.appendChild(el("div",{class:"nothing",text:"Nothing assigned."}));
    } else {
      if(g.fields.length){
        var dl=el("dl",{class:"fields"});
        g.fields.forEach(function(ref){ var c=byRef[ref];
          if(c) dl.appendChild(fieldCell(e,c.cn,c.p,c.pd,c.val,c.txt)); });
        box.appendChild(dl);
      }
      g.blocks.forEach(function(a){ var b=blocks[a]; if(!b)return;
        var blk=el("div",{class:"blk "+b.blockType});
        if(b.blockType!=="paragraph") blk.appendChild(el("div",{class:"bl",text:b.blockType}));
        blk.appendChild(para(fillVars(b.body,null,e)));
        box.appendChild(blk);
      });
    }
    wrap.appendChild(box);
  });
  if(zurueck) wrap.appendChild(el("div",{class:"kgrp withheldgrp"},[
    el("div",{class:"kh"},[el("b",{text:"Not yours yet"})]),
    el("div",{class:"nothing",text:"…and "+zurueck+" thing"+(zurueck===1?"":"s")+
      " about this that you have not learned"})]));
  return wrap;
}

/* Eine Information anlegen. Sie ist ein Artikel wie jeder andere — deshalb
   geht sie durch dieselben Schritte — und hängt danach über `knowledge` am
   Artikel, von dem sie handelt. */
function newInformation(e){
  dialog("New information",function(host,close){
    var nm=el("input",{class:"i",type:"text",placeholder:"e.g. His real name"});
    var tier=el("select",{class:"i"});
    ["secret","rumour","open"].forEach(function(t){ tier.appendChild(el("option",{value:t},t)); });
    host.appendChild(field("Label",nm));
    host.appendChild(field("Guardedness",tier));
    host.appendChild(el("p",{class:"hint",
      text:"A bundle of fields and blocks of this article, handed out as a whole. Assign its fields and its recipients in the side panel."}));
    actions(host,close,function(){
      var name=nm.value.trim(); if(!name){nm.focus();return false;}
      if(!REG.interfaces[INFO_IFACE]){ alert("The interface “"+INFO_IFACE+"” is missing from the registry."); return; }
      var info={ id:uid("i"), interfaces:[INFO_IFACE], name:name, tags:[],
        components:{ Name:{text:name}, Identity:{key:"information/"+slug(name),aliases:[]} },
        adhoc:[], blocks:[], relations:[], createdAt:new Date().toISOString() };
      reqFor(INFO_IFACE).forEach(function(c){ if(!info.components[c]&&REG.components[c]) info.components[c]={}; });
      applyDefaults(info,INFO_IFACE);
      info.components[INFO_COMP]=Object.assign({fields:[],blocks:[]},info.components[INFO_COMP]||{},{tier:tier.value});
      ENT.set(info.id,info); persist(info);
      e.relations=e.relations||[];
      e.relations.push({id:uid("r"),type:REL_KNOW,to:info.id,props:{}});
      UI.aside="know"; UI.info=info.id;
      persist(e);
    },"Create");
  });
}

/* Das Seitenpanel: welche Felder zu welcher Information gehören, und wer sie
   kennt. Beides sind Schreibvorgänge am Bündel, nicht am Artikel — der
   Artikel selbst bleibt unverändert, wenn jemand etwas erfährt. */
function renderKnowPanel(a,e){
  var ifn=(e.interfaces||[])[0]||"";
  var cells=fieldPlan(e,ifn,"all");
  var infos=infosOf(e);

  var head=el("h3",{text:"Knowledge"});
  if(canWrite()) head.appendChild(el("button",{class:"btn gh sm",type:"button",
    title:"New information",onclick:function(){newInformation(e);}},"+"));
  a.appendChild(head);

  if(!infos.length){
    a.appendChild(el("p",{class:"hint",text:"Everything about this article is open. An information bundles some of its fields and blocks so they can be handed to a character, a party or a knowledge level — and stays hidden from everyone else."}));
    return;
  }

  var sel=el("select",{class:"i"});
  infos.forEach(function(i){ sel.appendChild(el("option",{value:i.id},nameOf(i))); });
  if(!UI.info||!infos.some(function(i){return i.id===UI.info;})) UI.info=infos[0].id;
  sel.value=UI.info;
  sel.addEventListener("change",function(){ UI.info=sel.value; render(); });
  a.appendChild(field("Information",sel));

  var info=ENT.get(UI.info); if(!info)return;
  var card=info.components[INFO_COMP]=info.components[INFO_COMP]||{};

  var tier=el("select",{class:"i"});
  ["secret","rumour","open"].forEach(function(t){ tier.appendChild(el("option",{value:t},t)); });
  tier.value=infoTier(info);
  tier.addEventListener("change",function(){ card.tier=tier.value; persist(info); });
  a.appendChild(field("Guardedness",tier));

  /* Felder. Ein Feld darf in mehreren Bündeln stehen; die Anzeige ordnet es
     dem ersten zu, das es nennt — das steht hier dran, statt es zu verbieten. */
  a.appendChild(el("h3",{text:"Fields"}));
  var picks=el("div",{class:"kpick"});
  cells.forEach(function(c){
    var mine=infoCovers(info,c.ref);
    var taken=!mine&&infos.some(function(o){ return o.id!==info.id&&infoCovers(o,c.ref); });
    var cb=el("input",{type:"checkbox"}); cb.checked=mine; cb.disabled=!canWrite();
    cb.addEventListener("change",function(){
      var f=infoList(info,"fields").filter(function(x){ return x!==c.ref&&x!==c.cn; });
      if(cb.checked) f.push(c.ref);
      card.fields=f; persist(info);
    });
    var lab=el("label",{class:taken?"taken":null},[cb,el("span",{text:c.label})]);
    if(taken) lab.title="Already in another information";
    picks.appendChild(lab);
  });
  if(!cells.length) picks.appendChild(el("span",{class:"hint",text:"This article carries no fields yet."}));
  a.appendChild(picks);

  if((e.blocks||[]).length){
    a.appendChild(el("h3",{text:"Text blocks"}));
    var bp=el("div",{class:"kpick"});
    (e.blocks||[]).slice().sort(function(x,y){return (x.order||0)-(y.order||0);}).forEach(function(b){
      var key=b.anchor||b.id, mine=infoList(info,"blocks").indexOf(key)>=0;
      var cb=el("input",{type:"checkbox"}); cb.checked=mine; cb.disabled=!canWrite();
      cb.addEventListener("change",function(){
        var l=infoList(info,"blocks").filter(function(x){return x!==key;});
        if(cb.checked) l.push(key);
        card.blocks=l; persist(info);
      });
      bp.appendChild(el("label",null,[cb,
        el("span",{text:b.blockType+": "+String(b.body||"").slice(0,42)})]));
    });
    a.appendChild(bp);
  }

  /* Empfänger. Die Kante hängt an der Information, nicht am Empfänger —
     sonst müsste jede Figur eine Liste pflegen, und Entziehen hiesse, sie
     dort wiederzufinden. */
  a.appendChild(el("h3",{text:"Known by"}));
  var recips=edgesOf(info,REL_KNOWNBY);
  if(!recips.length) a.appendChild(el("p",{class:"hint",text:"Nobody yet — the fields above stay with the GM."}));
  else{
    var box=el("div",{class:"rel"});
    recips.forEach(function(r){
      var t=ENT.get(r.to);
      var row=el("div",{class:"relrow"});
      row.appendChild(el("span",{class:"rl",text:t?ifaceName(t):"gone"}));
      var rv=el("span",{class:"rv"});
      if(t) rv.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:t.id});}},nameOf(t)));
      else rv.appendChild(el("span",{class:"gone",text:"missing"}));
      if(canWrite()) rv.appendChild(el("button",{class:"btn gh sm",type:"button",onclick:function(){
        info.relations=(info.relations||[]).filter(function(x){return x.id!==r.id;});
        persist(info); }},"×"));
      row.appendChild(rv); box.appendChild(row);
    });
    a.appendChild(box);
  }

  if(canWrite()){
    var to=relDef(REL_KNOWNBY).to||["*"];
    var add=el("select",{class:"i"});
    add.appendChild(el("option",{value:""},"— assign to …"));
    byName().forEach(function(c){
      if(!ifaceInList(to,(c.interfaces||[])[0]))return;
      if(recips.some(function(r){return r.to===c.id;}))return;
      add.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
    });
    add.addEventListener("change",function(){
      if(!add.value)return;
      info.relations=info.relations||[];
      info.relations.push({id:uid("r"),type:REL_KNOWNBY,to:add.value,props:{}});
      persist(info);
    });
    a.appendChild(add);
    if(add.childNodes.length===1) a.appendChild(el("p",{class:"hint",
      text:"No character, party or knowledge level exists yet to hand this to."}));

    a.appendChild(el("button",{class:"btn sm dngr gh",type:"button",style:"margin-top:10px",
      onclick:function(){ confirmDialog("Delete the information “"+nameOf(info)+"”? The fields become open again.",function(){
        e.relations=(e.relations||[]).filter(function(x){return !(x.type===REL_KNOW&&x.to===info.id);});
        UI.info="";
        drop(info.id); persist(e);
      }); }},"Delete information"));
  }
}

/* ---------- Beziehungen (REQ-030, 081) ----------
   Hier stand einmal ein Ruf-System: Taten als eigene Artikel, ein Gewicht
   je Tat, ein Ausgangswert, eine gerechnete Leiter von −3 bis +3, und die
   Regel, dass eine Tat, von der niemand weiss, nichts ändert.

   Es war richtig gebaut und trotzdem zu viel. Am Tisch fragt niemand nach
   einer Zahl; man fragt „was hält das Auge von euch?", und die Antwort ist
   ein Satz. Geblieben ist deshalb **eine Kante mit Marken**: die Gedanken,
   die der eine über den anderen hat.

   Die Marken sind Worte und keine Aufzählung im Register. Was jemand vom
   anderen hält, ist Kampagneninhalt — eine feste Liste hätte entweder
   zwanzig Einträge oder die falschen drei.

   Zwei Dinge bleiben, weil sie nichts kosten: die Kante steht **beim
   Urteilenden** („das Auge hält von euch nichts" ist eine Aussage über das
   Auge), und die **Gegenrichtung ist eine eigene Kante**, die etwas ganz
   anderes sagen darf. Genau da wird es interessant (REQ-081): einer traut,
   der andere nicht.

   Was mit den Taten wegfiel, ist eine Registerzeile und ein Dialog — wenn
   es fehlt, kommt es zurück. */
var REL_REGARDS="regards";

/* Die Kante von diesem Artikel auf jenen, falls es eine gibt. Höchstens
   eine je Paar: zwei Meinungen desselben über denselben wären zwei
   Wahrheiten. */
function regardsEdge(e,zuId){
  return (e.relations||[]).filter(function(r){
    return r.type===REL_REGARDS&&r.to===zuId; })[0]||null;
}
function regardTags(r){
  var t=(r&&(r.props||{}).tags)||[];
  return Array.isArray(t)?t.filter(function(x){ return String(x||"").trim(); }):[];
}
/* Mit wem dieser Artikel überhaupt etwas zu tun hat — hin wie zurück.
   Gespeichert wird nur vorwärts, also wird die Gegenrichtung gesucht. */
function regardPartners(e){
  var m={};
  (e.relations||[]).forEach(function(r){ if(r.type===REL_REGARDS) m[r.to]=true; });
  ENT.forEach(function(o){
    if(o.id===e.id)return;
    (o.relations||[]).forEach(function(r){
      if(r.type===REL_REGARDS&&r.to===e.id) m[o.id]=true;
    });
  });
  delete m[e.id];
  return Object.keys(m).filter(function(id){
    var o=ENT.get(id); return o&&articleVisible(o);
  });
}

/* Die Marken einer Beziehung. Jede ist ein Knopf, der sie wegnimmt —
   eine Marke, die man nur über einen Dialog loswird, bleibt stehen. */
function regardTagList(e,zuId,r){
  var box=el("span",{class:"rtags"});
  regardTags(r).forEach(function(t){
    if(canWrite()){
      box.appendChild(el("button",{class:"pill tag x",type:"button",
        title:"Remove this thought",
        onclick:function(){ setRegard(e,zuId,regardTags(r).filter(function(x){return x!==t;}),null); }},t));
    } else {
      box.appendChild(el("span",{class:"pill tag",text:t}));
    }
  });
  if(canWrite()) box.appendChild(el("button",{class:"btn sm gh",type:"button",
    title:"Add a thought",
    onclick:function(){
      prompt1("What does “"+nameOf(e)+"” think of them?","",function(v){
        if(!v)return;
        var alt=regardTags(r);
        /* Zweimal dieselbe Marke sagt nichts zweimal. */
        if(alt.indexOf(v)>=0)return;
        setRegard(e,zuId,alt.concat([v]),null);
      },"Add");
    }},"+"));
  return box;
}
/* Schreiben. `tags` null heisst „lass sie", `note` null ebenso — sonst
   löschte jedes Ändern der einen Seite die andere. Eine Kante ohne Marken
   und ohne Zeile ist keine Beziehung und geht weg. */
function setRegard(e,zuId,tags,note){
  var r=regardsEdge(e,zuId);
  var t=tags==null?regardTags(r):tags;
  var n=note==null?((r&&(r.props||{}).note)||""):note;
  e.relations=(e.relations||[]).filter(function(x){
    return !(x.type===REL_REGARDS&&x.to===zuId); });
  if(t.length||n) e.relations.push({id:(r&&r.id)||uid("r"),type:REL_REGARDS,to:zuId,
    props:{tags:t,note:n||undefined}});
  persist(e);
}

function elStanding(e,ifn,item){
  var partner=regardPartners(e);
  /* Wo niemand eine Meinung hat, steht nichts. Nur so darf das Element im
     gewöhnlichen Layout stehen, statt hinter einem Dropdown für genau eine
     Artikelart. */
  if(!partner.length&&!canWrite())return null;
  var wrap=el("div",{class:"standbox"});

  if(!partner.length) wrap.appendChild(el("p",{class:"hint",
    text:"Nobody has an opinion here yet."}));

  partner.forEach(function(id){
    var o=ENT.get(id);
    var hin=regardsEdge(e,id);                  /* was e von o hält */
    var her=o?regardsEdge(o,e.id):null;         /* und was o zurückhält */
    var row=el("div",{class:"strow"});

    var kopf=el("div",{class:"ck"});
    kopf.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:id});}},nameOf(o)));
    kopf.appendChild(regardTagList(e,id,hin));
    row.appendChild(kopf);

    var zeile=(hin&&(hin.props||{}).note)||"";
    if(zeile||canWrite()){
      var p=el("p",{class:"hint rnote",style:"margin:2px 0"});
      if(canWrite()){
        p.appendChild(el("button",{class:"btn sm gh",type:"button",
          title:"Why they think so",
          onclick:function(){
            prompt1("Why — one line",zeile,function(v){ setRegard(e,id,null,v); });
          }},zeile||"why…"));
      } else p.appendChild(el("span",{text:zeile}));
      row.appendChild(p);
    }

    /* Die Gegenrichtung als eigene Zeile, weil sie eine eigene Kante ist.
       Bearbeitet wird sie dort, wo sie steht — wer sie hier änderte,
       schriebe in einen fremden Artikel, ohne ihn zu sehen. */
    if(her&&regardTags(her).length){
      var rueck=el("div",{class:"ck back"});
      rueck.appendChild(el("span",{class:"co",text:"↩ thinks back:"}));
      regardTags(her).forEach(function(t){
        rueck.appendChild(el("span",{class:"pill tag",text:t})); });
      row.appendChild(rueck);
    }
    wrap.appendChild(row);
  });

  if(canWrite()) wrap.appendChild(el("button",{class:"btn sm",type:"button",
    onclick:function(){ addRegards(e); }},"+ Relationship"));
  return wrap;
}

function pickArticle(titel,filter,dann){
  dialog(titel,function(host,close){
    var suche=el("input",{class:"i",type:"text",placeholder:"Search articles…"});
    var sel=el("select",{class:"i",size:"8",style:"height:auto"});
    function fuelle(){
      var q=suche.value.toLowerCase().trim();
      sel.textContent="";
      byName().forEach(function(c){
        if(filter&&!filter(c))return;
        if(q&&nameOf(c).toLowerCase().indexOf(q)<0)return;
        sel.appendChild(el("option",{value:c.id},nameOf(c)+" · "+ifaceName(c)));
      });
    }
    suche.addEventListener("input",fuelle); fuelle();
    host.appendChild(suche); host.appendChild(sel);
    var btn=el("div",{class:"rowbtns"});
    btn.appendChild(el("button",{class:"btn pri",type:"button",onclick:function(){
      if(!sel.value)return;
      close(); dann(sel.value);
    }},"Take it"));
    host.appendChild(btn);
  });
}
/* Eine Beziehung anlegen: wen, was denkt er, warum. Drei Zeilen, und mehr
   war die Frage nie. */
function addRegards(e){
  pickArticle("Whom does “"+nameOf(e)+"” have an opinion about?",
    function(c){ return c.id!==e.id; },
    function(id){
      dialog("What does “"+nameOf(e)+"” think of them?",function(host,close){
        var marken=el("input",{class:"i",type:"text",
          placeholder:"Thoughts, comma separated — wary, owes us, asks too much"});
        var note=el("input",{class:"i",type:"text",placeholder:"Why — one line"});
        host.appendChild(field("Thoughts",marken));
        host.appendChild(field("Why",note));
        actions(host,close,function(){
          var t=marken.value.split(",").map(function(x){return x.trim();})
            .filter(function(x){return x;});
          if(!t.length&&!note.value.trim())return false;
          setRegard(e,id,t,note.value.trim());
        },"Set it");
      });
    });
}

/* ---------- Blockanker und Kampagnenwerte (B3) ----------
   Zwei kleine Sachen, die beide daran hängen, dass ein Bezeichner hält.

   **Der Blockanker.** Wissen an einem Block hängt an der Block-Id, und die
   Id entsteht beim Anlegen (`uid("b")`). Wer denselben Artikel neu
   einliest, bekommt neue Ids — und jede Wissenszuteilung an einem Block
   zeigt danach ins Leere. Das fällt niemandem auf: der Block ist da, der
   Text ist da, und die Information hat nur plötzlich nichts mehr zu
   verbergen.

   Ein Anker ist deshalb **aus dem Inhalt abgeleitet**: Blockart plus die
   ersten Worte. Derselbe Text an derselben Stelle ergibt denselben Anker,
   also übersteht die Zuteilung den Import. Kollidieren zwei, zählt der
   zweite hoch — innerhalb eines Artikels, nicht global: ein Anker muss
   nur dort eindeutig sein, wo er gelesen wird.

   **Die Kampagnenwerte.** Gruppenstufe und Gruppen-Aufenthaltsort standen
   als Einstellung zum Eintippen da. Eine eingetippte Gruppenstufe ist nach
   der ersten Stufe falsch, und niemand merkt es, weil sie plausibel
   aussieht. Also werden sie **gerechnet** — dieselbe Regel wie bei jedem
   abgeleiteten Wert (D8) —, sie gewinnen gegen eine gleichnamige Zeile im
   Register, und die Maske gibt ihnen kein Eingabefeld. */

function blockStub(b){
  var t=String(b.body||"").replace(/[\[\]{}*_#>`]/g,"").replace(/\s+/g," ").trim();
  var worte=t.split(" ").slice(0,5).join(" ");
  return slug(worte)||"block";
}
/* Der Anker eines Blocks, in der Reihenfolge, in der man ihm trauen darf:
   was der Autor gesetzt hat, sonst was der Inhalt hergibt. */
function anchorFor(e,b){
  if(b.anchor)return b.anchor;
  var roh=(b.blockType||"paragraph")+"-"+blockStub(b);
  var belegt={};
  (e.blocks||[]).forEach(function(x){ if(x!==b&&x.anchor) belegt[x.anchor]=true; });
  var a=roh, n=2;
  while(belegt[a]) a=roh+"-"+(n++);
  return a;
}
/* Anker nachtragen. Gibt zurück, ob sich etwas geändert hat — nur dann
   wird geschrieben, sonst schriebe jede Anzeige den Artikel neu. */
function ensureAnchors(e){
  var neu=false;
  (e.blocks||[]).forEach(function(b){
    if(b.anchor)return;
    b.anchor=anchorFor(e,b);
    neu=true;
  });
  return neu;
}
/* Wie viele Blöcke im Bestand noch ohne Anker sind — die Zahl, die sagt,
   ob ein Import die Wissenszuteilungen gerade mitgenommen hätte. */
function anchorlessBlocks(){
  var n=0;
  ENT.forEach(function(e){ (e.blocks||[]).forEach(function(b){ if(!b.anchor) n++; }); });
  return n;
}

/* Nachtragen, was noch keinen hat — und die Wissenszuteilungen mitnehmen.
   Ohne den zweiten Schritt zeigte danach jede Zuteilung ins Leere: der
   Block hiesse plötzlich anders, und die Information hätte nichts mehr zu
   verbergen. Genau die Sorte Verlust, die man erst Wochen später bemerkt. */
function backfillAnchors(melde){
  var geaendert={}, gesetzt=0, nachgezogen=0;
  ENT.forEach(function(e){
    /* Je Artikel eine eigene Zuordnung. Block-Ids sind nur innerhalb eines
       Artikels eindeutig — im Bestand heissen sieben verschiedene Blöcke
       „b1" —, und eine gemeinsame Tabelle zöge die Zuteilung des einen auf
       den Block des anderen. Das wäre schlimmer als gar keine Wanderung. */
    var karte={};
    (e.blocks||[]).forEach(function(b){
      if(b.anchor)return;
      karte[b.id]=b.anchor=anchorFor(e,b);
      gesetzt++;
      geaendert[e.id]=true;
    });
    if(!Object.keys(karte).length)return;
    /* Und nur die Informationen dieses Artikels — die Kante sagt, welche. */
    infosOf(e).forEach(function(i){
      var info=(i.components||{})[INFO_COMP];
      if(!info||!Array.isArray(info.blocks))return;
      var neu=info.blocks.map(function(a){
        if(karte[a]){ nachgezogen++; return karte[a]; }
        return a;
      });
      if(neu.join("\u0000")===info.blocks.join("\u0000"))return;
      i.components[INFO_COMP]=Object.assign({},info,{blocks:neu});
      geaendert[i.id]=true;
    });
  });
  var ids=Object.keys(geaendert);
  ids.forEach(function(id){ var e=ENT.get(id); if(e) persist(e); });
  melde&&melde(gesetzt+" block"+(gesetzt===1?"":"s")+
    " anchored, "+nachgezogen+" knowledge reference"+(nachgezogen===1?"":"s")+
    " moved over, "+ids.length+" article"+(ids.length===1?"":"s")+" written.");
  render();
}

/* ---- Kampagnenwerte, gerechnet ---- */
function theParty(){
  var beste=null;
  ENT.forEach(function(e){
    if(((e.interfaces||[])[0])!=="Party")return;
    if(!inStack(e))return;
    if(!beste) beste=e;
  });
  return beste;
}
function partyMembers(p){
  if(!p)return [];
  var out=[];
  ENT.forEach(function(o){
    (o.relations||[]).forEach(function(r){
      if(r.type===REL_PARTY&&r.to===p.id) out.push(o);
    });
  });
  return out;
}
/* Wo die Gruppe steht: da, wo ein Gruppen-Token auf der Karte sitzt. Die
   Karte weiss, welchen Ort sie zeigt (`mapOf`) — also wird nicht ein
   zweites Mal hingeschrieben, wo die Gruppe ist. */
function partyPlace(p){
  if(!p)return null;
  var ids={}; ids[p.id]=true;
  partyMembers(p).forEach(function(m){ ids[m.id]=true; });
  var treffer=null;
  ENT.forEach(function(k){
    if(treffer)return;
    if(((k.interfaces||[])[0])!=="Map")return;
    var hat=(k.relations||[]).some(function(r){
      return r.type===REL_MARKER&&((r.props||{}).kind)==="party"&&ids[r.to]; });
    if(!hat)return;
    var ort=(k.relations||[]).filter(function(r){return r.type===REL_MAPOF;})[0];
    treffer=ort?ENT.get(ort.to):k;
  });
  return treffer;
}
/* Das jüngste benutzte Ereignis — der Tag, an dem die Kampagne steht, wenn
   niemand ihn als Einstellung gesetzt hat. */
function worldToday(){
  var gesetzt=setting("today","");
  if(gesetzt)return gesetzt;
  var beste=null, rang=-Infinity;
  ENT.forEach(function(e){
    var wd=(e.components||{}).WorldDate;
    if(!wd||!wd.display)return;
    if((((e.components||{}).Status||{}).value)!=="used")return;
    var s=Number(wd.sort);
    if(!isFinite(s)||s<rang)return;
    rang=s; beste=wd.display;
  });
  return beste||"";
}
var COMPUTED_VARS=[
  ["PARTY","The party's name"],
  ["PARTYSIZE","How many are in it"],
  ["PARTYLEVEL","Average level of its members"],
  ["PARTYTIER","1–4, for encounter budgeting"],
  ["PARTYWHERE","Where its token stands on a map"],
  ["TODAY","The world date the campaign stands at"],
  ["CALENDAR","Name of the calendar"]
];
var computedSig="", computedCache=null;
function campaignVars(){
  var sig=ENT.size+"|"+JSON.stringify(REG.settings||{});
  if(sig===computedSig&&computedCache)return computedCache;
  var p=theParty(), mit=partyMembers(p);
  var stufen=mit.map(function(m){
    return Number(((m.components||{}).CharacterInfo||{}).level);
  }).filter(function(n){ return isFinite(n)&&n>0; });
  var mittel=stufen.length?Math.round(stufen.reduce(function(a,b){return a+b;},0)/stufen.length):0;
  var ort=partyPlace(p);
  var out={
    PARTY:p?nameOf(p):"",
    PARTYSIZE:mit.length?String(mit.length):"",
    PARTYLEVEL:mittel?String(mittel):"",
    PARTYTIER:mittel?String(mittel<5?1:(mittel<11?2:(mittel<17?3:4))):"",
    PARTYWHERE:ort?nameOf(ort):"",
    TODAY:worldToday(),
    CALENDAR:setting("calendar","")
  };
  computedSig=sig; computedCache=out;
  return out;
}

/* ---------- aside: relations + backlinks ---------- */
function renderAside(){
  var a=document.getElementById("aside"); a.textContent="";
  if(UI.route.k!=="art"){
    a.appendChild(el("h3",{text:"Relations"}));
    a.appendChild(el("p",{class:"hint",text:"Relations are the edges between articles — typed and directed. Open an article and this panel shows what it points at and what points back. Only one direction is stored; the reverse is always derived."}));
    return;
  }
  var e=ENT.get(UI.route.id); if(!e)return;

  /* Zwei Reiter statt zweier Panels: Bezüge und Wissen wollen beide die
     ganze Breite der Spalte, und man braucht selten beide zugleich. */
  var tabs=el("div",{class:"ktabs"});
  [["rel","Relations"],["know","Knowledge"]].forEach(function(t){
    tabs.appendChild(el("button",{class:"btn sm"+(UI.aside===t[0]?" pri":""),type:"button",
      "aria-pressed":String(UI.aside===t[0]),
      onclick:function(){ UI.aside=t[0]; render(); }},t[1]));

  if(UI.aside==="know"){ renderKnowPanel(a,e); return; }

  if(viewDef().relations===false){
    a.appendChild(el("h3",{text:"Relations"}));
    a.appendChild(el("p",{class:"hint",text:"In dieser Darstellungsstufe ausgeblendet."}));
    return;
  }

  var outs=(e.relations||[]).filter(function(r){ var rd=REG.relations[r.type]; return !(rd&&rd.section); });
  var head=el("h3",{text:"Zeigt auf"});
  if(canWrite()) head.appendChild(el("button",{class:"btn gh sm",type:"button",
    title:"Add relation",onclick:function(){addRelation(e);}},"+"));
  a.appendChild(head);
  if(!outs.length) a.appendChild(el("p",{class:"hint",text:"Keine."}));
  else{
    var box=el("div",{class:"rel"});
    outs.forEach(function(r){
      var rd=relDef(r.type), t=ENT.get(r.to);
      var row=el("div",{class:"relrow"});
      row.appendChild(el("span",{class:"rl",text:rd.label||r.type}));
      var rv=el("span",{class:"rv"});
      if(t) rv.appendChild(el("button",{class:"ref",type:"button",onclick:function(){go({k:"art",id:t.id});}},nameOf(t)));
      else rv.appendChild(el("span",{class:"gone",text:"missing"}));
      if(r.props&&r.props.note) rv.appendChild(el("span",{class:"bind",text:r.props.note}));
      if(canWrite()) rv.appendChild(el("button",{class:"btn gh sm",type:"button",onclick:function(){
        e.relations=e.relations.filter(function(x){return x.id!==r.id;}); persist(e); }},"×"));
      row.appendChild(rv); box.appendChild(row);
    });
    a.appendChild(box);
  }

  /* backlinks — the reverse is a query, with the inverse label (REQ-182) */
  var backs=[];
  ENT.forEach(function(o){ (o.relations||[]).forEach(function(r){
    if(r.to===e.id) backs.push({from:o,rel:r}); }); });
  a.appendChild(el("h3",{text:"Zeigt hierher"}));
  if(!backs.length) a.appendChild(el("p",{class:"hint",text:"Nothing points here."}));
  else{
    var bx=el("div",{class:"rel"});
    backs.forEach(function(b){
      var rd=relDef(b.rel.type);
      var row=el("div",{class:"relrow"});
      row.appendChild(el("span",{class:"rl",text:rd.inverseLabel||("← "+rd.label)}));
      var rv=el("span",{class:"rv"});
      rv.appendChild(el("button",{class:"ref",type:"button",onclick:function(){go({k:"art",id:b.from.id});}},nameOf(b.from)));
      if(b.rel.props&&b.rel.props.note) rv.appendChild(el("span",{class:"bind",text:b.rel.props.note}));
      row.appendChild(rv); bx.appendChild(row);
    });
    a.appendChild(bx);
  }
}

/* ---------- graph ---------- */
function renderGraph(v){
  v.appendChild(el("h2",{text:"Graph"}));
  v.appendChild(el("p",{class:"hint",text:"Every stored edge, once — the reverse direction is derived from it everywhere."}));
  var rows=el("div",{class:"rows"});
  var n=0;
  byName().forEach(function(e){ (e.relations||[]).forEach(function(r){
    var rd=relDef(r.type), t=ENT.get(r.to); n++;
    var row=el("div",{class:"row"});
    var line=el("div",{class:"rt"});
    line.appendChild(el("button",{class:"ref",type:"button",onclick:function(){go({k:"art",id:e.id});}},nameOf(e)));
    line.appendChild(el("span",{class:"pill",text:rd.label||r.type}));
    if(t) line.appendChild(el("button",{class:"ref",type:"button",onclick:function(){go({k:"art",id:t.id});}},nameOf(t)));
    else line.appendChild(el("span",{class:"gone",text:"missing"}));
    row.appendChild(line);
    var vb=(r.props&&r.props.vars)||{}, ks=Object.keys(vb);
    if(ks.length) row.appendChild(el("span",{class:"bind",text:ks.map(function(k){return k+"="+vb[k];}).join("  ·  ")}));
    rows.appendChild(row);
  });});
  if(!n) v.appendChild(el("div",{class:"empty",text:"No relations yet."}));
  else v.appendChild(rows);
}

/* ---------- registry ---------- */
function renderRegistry(v){
  v.appendChild(el("h2",{text:"Data model"}));
  v.appendChild(konzept());
  var tabs=el("div",{class:"tabs",role:"tablist"});
  [["interfaces","Interfaces"],["components","Components"],
   ["relations","Relation types"],["views","Views"],["vars","Variables"],
   ["settings","Settings"],["backup","Backup"]]
  .forEach(function(t){
    tabs.appendChild(el("button",{type:"button",role:"tab","aria-selected":String(UI.regtab===t[0]),
      onclick:function(){UI.regtab=t[0];UI.err="";render();}},t[1]));
  });
  v.appendChild(tabs);

  /* Schnittstellen bekommen eine Maske: Komponenten, Felder, Blockarten und
     Subtypen an einer Stelle. Das JSON bleibt daneben stehen — für Massen-
     änderungen ist ein Textfeld schneller als jedes Formular. */
  if(UI.regtab==="components"&&!UI.regjson){ maskeMitJson(v,renderComponentEditor,
    "A component is one typed fact about an article — at most one per kind, absent when unused. Its fields are edited here and hold wherever the component is used."); return; }
  if(UI.regtab==="relations"&&!UI.regjson){ maskeMitJson(v,renderRelationEditor,null); return; }
  if(UI.regtab==="vars"&&!UI.regjson){ maskeMitJson(v,renderVarEditor,null); return; }
  if(UI.regtab==="settings"&&!UI.regjson){ maskeMitJson(v,renderSettingsEditor,null); return; }
  /* Die Sicherung hat kein JSON daneben: sie *ist* das JSON. */
  if(UI.regtab==="backup"){ renderBackupEditor(v); return; }

  if(UI.regtab==="views"&&!UI.regjson){
    v.appendChild(el("p",{class:"hint",
      text:"A view is an ordered list of elements. Pick a type under “Applies to” to give that type — and its subtypes — a layout of its own."}));
    renderViewEditor(v);
    var barV=el("div",{class:"rowbtns"});
    barV.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
      UI.regjson=true; UI.err=""; render(); }},"Edit as JSON"));
    v.appendChild(barV);
    return;
  }

  if(UI.regtab==="interfaces"&&!UI.regjson){
    regIfaceEditor(v);
    var bar0=el("div",{class:"rowbtns"});
    bar0.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
      UI.regjson=true; UI.err=""; render(); }},"Edit as JSON"));
    v.appendChild(bar0);
    return;
  }

  if(UI.regtab==="views") v.appendChild(el("p",{class:"hint",
    text:"Compendium — the views in the picker at the top right. fields: \"none\" | \"all\" | a list of components · blocks: \"all\" | a list of block types · description, composed, relations, bindings, image: true/false · order sets the sequence."}));
  var ta=el("textarea",{class:"i code",spellcheck:"false",id:"regbox"});
  ta.value=JSON.stringify(REG[UI.regtab],null,2);
  v.appendChild(ta);
  var msg=el("div",{class:"err"});
  v.appendChild(msg);

  var bar=el("div",{class:"rowbtns"});
  if(canWrite()) bar.appendChild(el("button",{class:"btn pri",type:"button",onclick:function(){
    try{ var parsed=JSON.parse(ta.value); }
    catch(x){ msg.textContent="Not valid JSON: "+x.message; return; }
    REG[UI.regtab]=parsed; saveReg(UI.regtab); msg.textContent=""; render();
  }},"Apply"));
  bar.appendChild(el("button",{class:"btn",type:"button",onclick:function(){
    ta.value=JSON.stringify(REG[UI.regtab],null,2); msg.textContent="";}},"Reset"));
  bar.appendChild(el("button",{class:"btn gh",type:"button",
    onclick:function(){ UI.regjson=false; UI.err=""; render(); }},"Back to the form"));
  v.appendChild(bar);
}

/* Der Baum links, die gewählte Schnittstelle rechts. */
function regIfaceEditor(v){
  var namen=Object.keys(REG.interfaces);
  if(!namen.length){
    v.appendChild(el("div",{class:"empty",text:"No interfaces yet."}));
    if(canWrite()) v.appendChild(newInterfaceBar(""));
    return;
  }
  if(!REG.interfaces[UI.regiface]) UI.regiface=ifaceRoots()[0]||namen.sort()[0];

  var grid=el("div",{class:"reg2"});
  var tree=el("div",{class:"regtree"});
  (function walk(list,depth){
    list.forEach(function(n){
      var d=REG.interfaces[n], c=countIface(n);
      var b=el("button",{type:"button","aria-current":String(UI.regiface===n),
        style:"padding-left:"+(7+depth*13)+"px",
        onclick:function(){ UI.regiface=n; UI.regcomp=""; UI.regprop=""; render(); }});
      if(c) b.appendChild(el("em",{text:String(c)}));
      b.appendChild(el("span",{class:d.abstract?"ab":"",text:d.label||n}));
      tree.appendChild(b);
      walk(kindsOf(n),depth+1);
    });
  })(ifaceRoots(),0);
  grid.appendChild(tree);
  grid.appendChild(regIfaceBody(UI.regiface));
  v.appendChild(grid);
  if(canWrite()) v.appendChild(newInterfaceBar(""));
}

function newInterfaceBar(unter){

function componentBody(cn){
  var cd=REG.components[cn], w=canWrite();
  var box=el("div",{class:"regbody"});
  function save(){ saveReg("components"); render(); }

  box.appendChild(el("h3",{text:cd.label||cn}));
  box.appendChild(el("div",{class:"key",text:cn}));

  var head=el("div",{class:"fmore",style:"border-bottom:0;padding-top:10px"});
  var labelInput=el("input",{class:"i",type:"text",value:cd.label||""});
  if(!w) labelInput.disabled=true;
  labelInput.addEventListener("change",function(){ cd.label=labelInput.value.trim()||cn; save(); });
  head.appendChild(field("Label",labelInput));
  var eng=el("input",{class:"i",type:"text",value:cd.engine||"",placeholder:"none"});
  if(!w) eng.disabled=true;
  eng.addEventListener("change",function(){
    var val=eng.value.trim(); if(val) cd.engine=val; else cd.engine=null; save(); });
  head.appendChild(field("Engine",eng));
  box.appendChild(head);

  box.appendChild(el("div",{class:"rsec",text:"Fields"}));
  box.appendChild(fieldBox(cn,"",w,save));

  var users=ifacesUsing(cn);
  box.appendChild(el("div",{class:"rsec",text:"Used by"}));
  if(!users.length) box.appendChild(el("p",{class:"hint",
    text:"No interface lists this component yet. Add it under an interface, or it stays unreachable."}));
  else{
    var chips=el("div",{class:"chips"});
    users.forEach(function(n){
      var c=el("span",{class:"chip"});
      c.appendChild(el("button",{type:"button",class:"ref",onclick:function(){
        UI.regtab="interfaces"; UI.regiface=n; UI.regcomp=cn; render(); }},
        REG.interfaces[n].label||n));
      chips.appendChild(c);
    });
    box.appendChild(chips);
  }

  if(w){
    /* Eine Komponente zu entfernen, die noch jemand nennt, hinterliesse eine
       Schnittstelle, die auf nichts zeigt — die Prüfung beanstandet dann
       jeden Artikel dieser Art. */
    var traeger=[]; ENT.forEach(function(e){ if((e.components||{})[cn]) traeger.push(e); });
    var reason=users.length?users.length+" interfaces list it"
              :(traeger.length?traeger.length+" articles carry it":"");
    var del=el("button",{class:"btn sm dngr",type:"button",onclick:function(){
      if(reason)return;
      confirmDialog("Remove the component “"+(cd.label||cn)+"”?",function(){
        delete REG.components[cn]; UI.regcomp2=""; save(); },"Remove"); }},"Remove component");
    if(reason){ del.disabled=true; del.title=reason; }
    var fbar=el("div",{class:"rowbtns"}); fbar.appendChild(del);
    if(reason) fbar.appendChild(el("span",{class:"co",style:"align-self:center",text:reason}));
    box.appendChild(fbar);
  }
  return box;
}

function newRelationBar(){
  var i=el("input",{class:"i",type:"text",placeholder:"Label, e.g. owes a favour to"});
  var bar=el("div",{class:"addbar",style:"margin-top:10px"});
  bar.appendChild(i);
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var label=i.value.trim(); if(!label) return;
    var base=slug(label).replace(/-([a-z])/g,function(_,c){return c.toUpperCase();})||"relates";
    var n=base,c=2; while(REG.relations[n]){ n=base+c; c++; }

    UI.regrel=n; saveReg("relations"); render();
  }},"Create relation type"));
  return bar;

  var rd=REG.relations[rt], w=canWrite();
  var box=el("div",{class:"regbody"});
  function save(){ saveReg("relations"); render(); }

  box.appendChild(el("h3",{text:rd.label||rt}));
  box.appendChild(el("div",{class:"key",text:rt}));

  box.appendChild(el("p",{class:"hint",style:"margin-top:8px",

  var head=el("div",{class:"fmore",style:"border-bottom:0"});
  function text(label,val,set,ph){
    var i=el("input",{class:"i",type:"text",value:val==null?"":val,placeholder:ph||""});
    if(!w) i.disabled=true;
    i.addEventListener("change",function(){ set(i.value.trim()); save(); });
    head.appendChild(field(label,i));
  }
  text("Label (forwards)",rd.label||"",function(x){ rd.label=x||rt; },"lives in");
  text("Label (backwards)",rd.inverseLabel||"",function(x){ rd.inverseLabel=x||("← "+rt); },"residents");
  text("Section heading",rd.section||"",function(x){ if(x)rd.section=x; else delete rd.section; },
       "set to compose the target into the article");
  var card=el("select",{class:"i"}); if(!w) card.disabled=true;
  [["","many"],["one","at most one"]].forEach(function(c){
    card.appendChild(el("option",{value:c[0]},c[1])); });
  card.value=rd.cardinality||"";
  card.addEventListener("change",function(){
    if(card.value) rd.cardinality=card.value; else delete rd.cardinality; save(); });
  head.appendChild(field("How many",card));
  box.appendChild(head);

  box.appendChild(el("div",{class:"rsec",text:"From and to"}));
  box.appendChild(el("p",{class:"hint",
    text:"Nothing picked means any type. Picking a type includes its subtypes."}));
  [["from","May start at"],["to","May point at"]].forEach(function(side){
    var sel=el("select",{class:"i",multiple:"multiple",size:"5",style:"max-width:280px"});
    if(!w) sel.disabled=true;
    var cur=(rd[side[0]]||[]).filter(function(x){return x!=="*";});
    Object.keys(REG.interfaces).sort().forEach(function(n){
      var o=el("option",{value:n},REG.interfaces[n].label||n);
      if(cur.indexOf(n)>=0) o.selected=true;
      sel.appendChild(o);
    });
    sel.addEventListener("change",function(){
      var picked=Array.prototype.filter.call(sel.options,function(o){return o.selected;})
        .map(function(o){return o.value;});
      rd[side[0]]=picked.length?picked:["*"];
      save();
    });
    box.appendChild(field(side[1],sel));
  });

  if(w){
    var n=0; ENT.forEach(function(e){ (e.relations||[]).forEach(function(r){ if(r.type===rt)n++; }); });
    var del=el("button",{class:"btn sm dngr",type:"button",onclick:function(){
      if(n)return;
      confirmDialog("Remove the relation type “"+(rd.label||rt)+"”?",function(){
        delete REG.relations[rt]; UI.regrel=""; save(); },"Remove"); }},"Remove relation type");
    if(n){ del.disabled=true; del.title=n+" edges use it"; }
    var fbar=el("div",{class:"rowbtns"}); fbar.appendChild(del);
    if(n) fbar.appendChild(el("span",{class:"co",style:"align-self:center",text:n+" edges use it"}));
    box.appendChild(fbar);
  }
  return box;
}

/* Kampagneneinstellungen (REQ-043): ein Schlüssel-Wert-Speicher, den jeder
   Bereich für sich auslegt. Absichtlich nicht typisiert — eine Einstellung,
   die erst ein Schema braucht, bevor jemand sie setzen kann, wird nicht
   gesetzt. Wer sie liest, weiss, was sie heisst; `setting()` gibt einen
   Rückfallwert, damit ein fehlender Schlüssel nichts bricht. */
function setting(key,fallback){
  var v=(REG.settings||{})[key];
  return v===undefined||v===""?fallback:v;
}
function settingNum(key,fallback){
  var n=Number(setting(key,fallback)); return isFinite(n)?n:fallback;
}
var SETTING_HINTS={
  gridSize:"Battlemap grid in pixels (maps)",
  gridUnit:"What one square means, e.g. 1,5 m",
  inventoryCols:"Columns of the tile inventory",

};

  var box=el("div",{class:"regbody",style:"max-height:none;border:1px solid var(--line);border-radius:var(--r)"});

    inp.addEventListener("change",function(){ REG.settings[k]=inp.value; saveReg("settings"); render(); });
    row.appendChild(inp);
    if(w) row.appendChild(el("button",{class:"btn sm gh dngr",type:"button",title:"Remove",
      onclick:function(){ confirmDialog("Remove the setting “"+k+"”?",function(){
        delete REG.settings[k]; saveReg("settings"); render(); },"Remove"); }},"×"));
    box.appendChild(row);
  });
  v.appendChild(box);
  if(w){
    var nk=el("select",{class:"i"});
    nk.appendChild(el("option",{value:""},"— known setting —"));
    Object.keys(SETTING_HINTS).forEach(function(k){
      if(keys.indexOf(k)>=0)return;
      nk.appendChild(el("option",{value:k},k+" — "+SETTING_HINTS[k])); });

    var bar=el("div",{class:"addbar",style:"margin-top:10px"});
    bar.appendChild(nk); bar.appendChild(frei); bar.appendChild(nv);
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){

      if(!k)return;
      REG.settings=REG.settings||{}; REG.settings[k]=nv.value;
      saveReg("settings"); render();
    }},"Add setting"));
    v.appendChild(bar);
  }
}

/* ---------- how the registry works, on the page that edits it ----------
   Die Mechanik steht hier, weil sie sonst nur in Commit-Nachrichten und im
   Kopf steht. Wer eine Zeile ändert, soll daneben lesen können, was sie
   auslöst. Aufklappbar, damit sie nicht jedes Mal im Weg ist. */
function konzept(){
  var box=el("details",{class:"konzept"});
  if(UI.konzept) box.setAttribute("open","open");
  box.addEventListener("toggle",function(){ UI.konzept=box.hasAttribute("open"); });

  var d=el("div",{class:"kbody"});
  d.appendChild(el("p",{},"An article is an id and nothing else. Every fact about it sits in a "+
    "component, every connection in an edge, and what kinds of article exist is a row in here — "+
    "not a line of code. Adding a kind of thing is an insert, not a migration. That claim is what "+
    "this prototype is testing."));

  var t=el("dl",{class:"kdl"});
  [["Interfaces",
    "What an article of this kind must carry (requires) and may carry (allows), what it extends, "+
    "and which text blocks it allows. Resolution walks extends upward, so Weapon gets everything "+
    "Item and Base have. A subtype may tighten optional into required, never the other way — "+
    "validation walks the same chain and would find the requirement anyway."],
   ["Components",
    "One typed fact, at most one per article, absent when unused. Each is a JSON Schema: fields "+
    "with a type, a title, and optionally a format, choices, a derived expression, or a link "+
    "target. Components are shared — changing a field here changes it everywhere the component "+
    "is used, which is the point of the pool."],
   ["Relation types",
    "A typed, directed edge with its own properties. Stored in one direction only; the reverse is "+
    "a query, and the inverse label is what it reads as from the other end. A relation with a "+
    "section heading composes the target into the article instead of listing it."],
   ["Views",
    "An ordered list of layout elements — headings, paragraphs, field tables, blocks, composed "+
    "rules, relations, images. A type may carry its own layout, inherited by its subtypes, so "+
    "Item: Full and Statblock: Full differ without being two views."],
   ["Variables",
    "Campaign-wide values for {VAR}. Resolution order: the binding on the edge, then the article "+
    "using it, then these."]
  ].forEach(function(r){
    t.appendChild(el("dt",{text:r[0]}));
    t.appendChild(el("dd",{text:r[1]}));
  });
  d.appendChild(t);

  d.appendChild(el("p",{class:"hint",style:"margin:10px 0 0"},
    "Two things are never stored: a derived value, which is computed on read, and the reverse of "+
    "an edge. Storing either means having two places that can disagree."));
  d.appendChild(el("p",{class:"hint",style:"margin:6px 0 0"},
    "`engine` on a component names the machinery that will own it in the real stack "+
    "(Calculation, Resolution, Access …). The prototype records it and does not act on it yet."));

  /* Ein durchgezogenes Beispiel schlägt fünf Definitionen. Es nennt echte
     Zeilen aus diesem Register, damit man es nachklicken kann statt es zu
     glauben. */
  d.appendChild(el("div",{class:"rsec",style:"margin-top:18px",text:"Following one article through"}));
  var bsp=el("ol",{class:"bsp"});
  [["The row that says what a statblock is",
    "Interfaces › Statblock. It extends Base, requires StatblockInfo and allows Vars. "+
    "That is the whole definition — everything below follows from it."],
   ["What it may carry",
    "Because it extends Base it also gets Name, Identity, Status, Description, Visibility, "+
    "Image and Raw content. Open Statblock and you see them listed as inherited, with the "+
    "interface they come from."],
   ["Where the fields come from",
    "Components › StatblockInfo holds ac, hp, speed, str … and their titles. Nothing about "+
    "statblocks is written in code: the form, the field table and the validation all read "+
    "this one schema."],
   ["A value nobody typed",
    "StatblockInfo.passivePerception carries derived: 10+mod(wis). It has no input and is "+
    "never stored — it is computed each time the article is read. Change wis and it follows."],
   ["How the actions get in",
    "Relation types › composed of has a section heading. That makes it compose instead of "+
    "list: open Kanalschleim and its three pooled rules are written into the article under "+
    "“Actions & traits”, not shown as links. The rules themselves are ordinary articles of "+
    "type Rule Element, shared by every statblock that uses them."],
   ["The same rule, said differently",
    "“Weapon attack” is one article. Kanalschleim binds NAME=Pseudopod, AB=+5, DMG=2d6 + 3 "+
    "on the edge, so {VAR} in the rule text reads as its own attack. Another statblock binds "+
    "other values against the same rule. Resolution order: the edge, then the article using "+
    "it, then Variables."],
   ["What you actually see",
    "Views › Full lists the elements in order. Under “Applies to” a type may carry its own "+
    "layout, so Statblock: Full can lead with the stat table where Item: Full leads with the "+
    "image — one view, two layouts."],
   ["Add a kind of thing",
    "Interfaces › Create interface. Give it a parent, tick the components it needs, and it "+

/* ---------- compendium: views as an ordered toolbox ---------- */
function renderViewEditor(v){
  var keys=viewKeys();
  if(!keys.length){
    v.appendChild(el("div",{class:"empty",text:"No views yet."}));
    if(canWrite()) v.appendChild(newViewBar());
    return;
  }
  if(keys.indexOf(UI.regview)<0) UI.regview=keys[0];

  var grid=el("div",{class:"reg2"});
  var list=el("div",{class:"regtree"});
  keys.forEach(function(k){
    var vd=REG.views[k]||{};
    var b=el("button",{type:"button","aria-current":String(UI.regview===k),
      onclick:function(){ UI.regview=k; UI.regscope=""; UI.regel=""; render(); }});
    b.appendChild(el("span",{text:vd.label||k}));
    list.appendChild(b);
  });
