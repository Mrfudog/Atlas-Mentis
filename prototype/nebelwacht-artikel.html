   Kreis nicht berühren, werden gar nicht erst geprüft. */
function visionPoly(lx,ly,rad,walls){
  var nah=[], winkel=[];
  for(var i=0;i<walls.length;i++){
    if(segDist(lx,ly,walls[i])>rad)continue;
    nah.push(walls[i]);
    var ecken=[[walls[i].x1,walls[i].y1],[walls[i].x2,walls[i].y2]];
    for(var j=0;j<2;j++){
      var a=Math.atan2(ecken[j][1]-ly,ecken[j][0]-lx);
      winkel.push(a-0.0007,a,a+0.0007);
    }
  }
  var n=nah.length?48:24;
  for(var k=0;k<n;k++) winkel.push(-Math.PI+k*2*Math.PI/n);
  winkel.sort(function(a,b){return a-b;});
  var pts=[];
  for(var m=0;m<winkel.length;m++){
    var dx=Math.cos(winkel[m]), dy=Math.sin(winkel[m]);
    var t=rayHit(lx,ly,dx,dy,nah,rad);
    pts.push([lx+dx*t,ly+dy*t]);
  }
  return pts;
}
function polyAttr(pts){
  return pts.map(function(p){ return (Math.round(p[0]*10000)/10000)+","+(Math.round(p[1]*10000)/10000); }).join(" ");
}

/* ---- Formen: Anteile hinein, Quadrateinheiten heraus ---- */
/* Gezeichnet wird in einem Raum, in dem ein Schritt nach rechts so lang ist
   wie einer nach unten (x von 0 bis 1, y von 0 bis ar). Sonst wäre jeder
   Lichtkreis auf einer breiten Karte ein Ei. */
function shapeNode(s,ar,attrs){
  var a=Object.assign({},attrs||{});
  if(s.kind==="circle"){
    a.cx=s.x; a.cy=(s.y||0)*ar; a.r=Math.max(0.001,Number(s.r)||0.05);
    return sv("circle",a);
  }
  if(s.kind==="poly"&&(s.pts||[]).length>2){
    a.points=(s.pts||[]).map(function(p){ return p[0]+","+(p[1]*ar); }).join(" ");
    return sv("polygon",a);
  }
  a.x=Math.min(s.x,s.x+(s.w||0)); a.y=Math.min(s.y,s.y+(s.h||0))*ar;
  a.width=Math.abs(s.w||0); a.height=Math.abs(s.h||0)*ar;
  return sv("rect",a);
}
function inShape(s,x,y){
  if(s.kind==="circle"){
    var dx=x-s.x, dy=y-(s.y||0);
    return dx*dx+dy*dy<=(Number(s.r)||0)*(Number(s.r)||0);
  }
  if(s.kind==="poly"){
    var p=s.pts||[], drin=false;
    for(var i=0,j=p.length-1;i<p.length;j=i++){
      if(((p[i][1]>y)!==(p[j][1]>y))&&
         (x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1]+1e-12)+p[i][0])) drin=!drin;
    }
    return drin;
  }
  var x0=Math.min(s.x,s.x+(s.w||0)), x1=Math.max(s.x,s.x+(s.w||0));
  var y0=Math.min(s.y,s.y+(s.h||0)), y1=Math.max(s.y,s.y+(s.h||0));
  return x>=x0&&x<=x1&&y>=y0&&y<=y1;
}

/* ---- Was leuchtet ---- */
/* Ein Licht ist keine eigene Artikelart: es ist ein Token, an dessen Kante
   ein Radius steht. Eine Laterne auf der Karte ist eine Laterne auf der
   Karte — und was sie beleuchtet, hängt an beiden Enden, also an der Kante
   (dieselbe Regel wie bei der Tragestufe im Inventar). */
function mapLights(e,card,nat){
  var g=Math.max(4,Number(card.gridSize)||70), out=[];
  (e.relations||[]).forEach(function(r){
    if(r.type!==REL_MARKER)return;
    var pr=r.props||{};
    var hell=Number(pr.light)||0, matt=Number(pr.dim)||0;
    if(hell<=0&&matt<=0)return;
    out.push({x:Number(pr.x)||0.5,y:Number(pr.y)||0.5,
      bright:hell*g/nat.w, dim:Math.max(matt,hell)*g/nat.w});
  });
  return out;
}
/* ---- Sperren: Wand, Tür, Fenster, Abgrund ----
   Eine Sperre hält Blick, Schritt, beides oder — bei einer offenen Tür —
   nichts. Das steht an der Sperre selbst und nicht in vier Listen, die
   dasselbe meinen: wer eine Tür zur Wand macht, ändert ein Feld und nicht
   den Ort des Eintrags.

   Die Bewegung wertet noch niemand aus — es gibt keine Zugrechnung. Sie
   steht trotzdem hier, weil eine Tür, die man erst beim Bewegungssystem
   als Tür erfasst, bis dahin als Wand gezeichnet wird und die Karte
   zweimal gebaut werden muss. */
/* Schlüssel, Name, Farbe, durchsichtig, hält den Schritt. */
var WALL_KINDS=[
  ["wall",  "Wall",   "#e2554a", false, true],
  ["door",  "Door",   "#d99a2b", false, true],
  ["window","Window", "#4aa3e2", true,  true],
  ["chasm", "Chasm",  "#8a6bd1", true,  true]
];
function wallKind(w){
  var k=(w&&w.kind)||"wall";
  for(var i=0;i<WALL_KINDS.length;i++) if(WALL_KINDS[i][0]===k)return WALL_KINDS[i];
  return WALL_KINDS[0];
}
/* Eine offene Tür ist keine Sperre. Alles andere kennt `open` nicht — ein
   offenes Fenster bleibt ein Fenster, und ein Abgrund lässt sich nicht
   aufklappen. */
function wallOpen(w){ return (w&&w.kind)==="door"&&!!w.open; }
function blocksSight(w){ return !wallOpen(w)&&!wallKind(w)[3]; }
function blocksMove(w){ return !wallOpen(w)&&!!wallKind(w)[4]; }

/* Was das Sichtbarkeitspolygon kennt: nur, was den Blick hält. Ein Fenster
   steht auf der Karte und im Weg, aber nicht im Licht. */
function mapWalls(card,ar){
  return (card.walls||[]).filter(blocksSight).map(function(w){
    return {id:w.id,x1:Number(w.x1)||0,y1:(Number(w.y1)||0)*ar,
            x2:Number(w.x2)||0,y2:(Number(w.y2)||0)*ar};
  });
}
/* Was den Schritt hält. Noch wertet es niemand aus; die Abfrage steht, damit
   das Bewegungssystem sie nicht erfinden muss. */
function mapBarriers(card,ar){
  return (card.walls||[]).filter(blocksMove).map(function(w){
    return {id:w.id,kind:wallKind(w)[0],x1:Number(w.x1)||0,y1:(Number(w.y1)||0)*ar,
            x2:Number(w.x2)||0,y2:(Number(w.y2)||0)*ar};
  });
}
/* Gezeichnet wird jede Sperre, auch die offene Tür — die Spielleitung baut
   die Karte und muss sehen, was sie gebaut hat. Wer nur mitspielt, sieht
   keine: für ihn ist die Wand der Grund, warum es dahinter dunkel ist. */
function wallLines(card,ar){
  return (card.walls||[]).map(function(w){
    var k=wallKind(w);
    return {id:w.id,kind:k[0],label:k[1],color:k[2],open:wallOpen(w),
            x1:Number(w.x1)||0,y1:(Number(w.y1)||0)*ar,
            x2:Number(w.x2)||0,y2:(Number(w.y2)||0)*ar};
  });
}

/* ---- Zeichenebenen ----
   Ein Kartenblatt je Ebene, das unterste ist das Kartenbild selbst. Es
   steht in `image` und nicht als erster Eintrag in `sheets`, weil die
   natürliche Grösse an ihm hängt und eine Karte ohne unterstes Blatt keine
   Karte ist. Die Leiste zeigt trotzdem beides in einer Liste — dort ist es
   eine Ebene wie jede andere.

   Oben in der Liste heisst obenauf: gezeichnet wird von hinten nach vorn,
   also die Liste rückwärts. Eine Reihenfolge, die im Feld anders herum
   steht als auf dem Schirm, sortiert früher oder später jemand falsch. */
function mapSheets(e,card){
  var out=[{id:"__base",name:"Base map",image:mapImage(e),opacity:1,
            visible:!card.baseHidden,gmOnly:!!card.baseGmOnly,base:true}];
  (card.sheets||[]).forEach(function(s){
    out.push({id:s.id,name:s.name||"Layer",image:s.image,
      opacity:s.opacity==null?1:Number(s.opacity),
      visible:s.visible!==false,gmOnly:!!s.gmOnly,base:false});
  });
  return out;
}
/* Was gezeichnet wird: sichtbar, mit Bild, und für Spieler ohne die Blätter,
   die der Spielleitung gehören. Zurückgehalten wird hier in der Seite, weil
   die Seite keinen Server hat — im echten Stapel tut es `redactEntity`. */
function drawnSheets(e,card){
  var gm=isGM();
  return mapSheets(e,card).filter(function(s){
    return s.visible&&s.image&&(gm||!s.gmOnly);
  });
}

/* ---- Die Überlagerung ---- */
function visionOverlay(e,card,nat){
  var ar=nat.h/nat.w;
  var nebel=!!card.fog, licht=card.lighting||"bright";
  var terr=(e.relations||[]).filter(function(r){ return r.type===REL_TERRITORY; });
  /* Die Sperren sieht nur, wer sie setzen darf. Sie sind aber auch bei
     Tageslicht zu zeichnen — wer eine Battlemap baut, baut sie am hellen
     Tag und will sehen, wo die Wände stehen. */
  var bau=isGM()&&canWrite()&&(card.walls||[]).length>0;
  if(!nebel&&licht==="bright"&&!terr.length&&!bau)return null;

  var svg=sv("svg",{"class":"mvis",viewBox:"0 0 1 "+ar,preserveAspectRatio:"none"});
  var defs=sv("defs"); svg.appendChild(defs);
  var gm=isGM();

  /* Gebiete zuerst, damit Nebel und Dunkelheit darüber liegen — wem ein Feld
     gehört, ist eine Frage der Karte und keine des Augenblicks. */
  if(terr.length){
    var g=Math.max(4,Number(card.gridSize)||70);
    var cols=Math.max(1,Math.round(nat.w/g)), rows=Math.max(1,Math.round(nat.h/g));
    var deckel=cols*rows<=20000;
    terr.forEach(function(r){
      var ziel=ENT.get(r.to);
      if(ziel&&!articleVisible(ziel))return;
      var pr=r.props||{};
      var farbe=pr.color||"#7a5cff";
      var grp=sv("g",{"class":"mterr",fill:farbe,"fill-opacity":pr.opacity!=null?pr.opacity:0.18,
        stroke:farbe,"stroke-opacity":0.5,"stroke-width":0.0015});
      if(deckel&&(card.gridShape==="square")){
        /* Gerastert (REQ-193): gefüllt wird, welches Feld mit seiner Mitte
           in der Form liegt. Am Tisch zählt „welche Quadrate sind unsere",
           nicht wo die Linie genau verläuft. */
        for(var cy=0;cy<rows;cy++)for(var cx=0;cx<cols;cx++){
          var mx=(cx+0.5)/cols, my=(cy+0.5)/rows;
          if(!inShape(pr,mx,my))continue;
          grp.appendChild(sv("rect",{x:cx/cols,y:(cy/rows)*ar,
            width:1/cols,height:(1/rows)*ar}));
        }
      } else {
        grp.appendChild(shapeNode(pr,ar,{}));
      }
      if(ziel){ var tt=sv("title"); tt.textContent=nameOf(ziel); grp.appendChild(tt); }
      svg.appendChild(grp);
    });
  }

  /* Dunkelheit: die Lichter stanzen ihr Sichtbarkeitspolygon heraus. Ohne
     ein einziges Licht bleibt sie ganz — das ist keine Panne, sondern eine
     dunkle Karte. */
  if(licht!=="bright"){
    var walls=mapWalls(card,ar), lichter=mapLights(e,card,nat);
    var mid="dark_"+uid("m");
    var maske=sv("mask",{id:mid});
    maske.appendChild(sv("rect",{x:0,y:0,width:1,height:ar,fill:"#fff"}));
    lichter.forEach(function(l){
      var lx=l.x, ly=l.y*ar;
      if(l.dim>0) maske.appendChild(sv("polygon",
        {points:polyAttr(visionPoly(lx,ly,l.dim,walls)),fill:"#808080"}));
      if(l.bright>0) maske.appendChild(sv("polygon",
        {points:polyAttr(visionPoly(lx,ly,l.bright,walls)),fill:"#000"}));
    });
    defs.appendChild(maske);
    svg.appendChild(sv("rect",{x:0,y:0,width:1,height:ar,
      fill:licht==="dark"?"#05070d":"#0b1020",
      "fill-opacity":gm?0.42:(licht==="dark"?0.94:0.6),
      mask:"url(#"+mid+")"}));
  }

  /* Nebel: zugedeckt ist alles, was keine aufgedeckte Form berührt. */
  if(nebel){
    var fid="fog_"+uid("m");
    var fm=sv("mask",{id:fid});
    fm.appendChild(sv("rect",{x:0,y:0,width:1,height:ar,fill:"#fff"}));
    (card.reveal||[]).forEach(function(s){ fm.appendChild(shapeNode(s,ar,{fill:"#000"})); });
    defs.appendChild(fm);
    svg.appendChild(sv("rect",{x:0,y:0,width:1,height:ar,"class":"mfog",
      "fill-opacity":gm?0.5:1,mask:"url(#"+fid+")"}));
  }

  /* Die Sperren zuletzt und damit obenauf: für alle anderen sind sie der
     Grund, warum es dahinter dunkel ist, und sonst nichts. Eine offene Tür
     wird gestrichelt — sie steht da, hält aber nichts. */
  if(bau) wallLines(card,ar).forEach(function(w){
    var n=sv("line",{"class":"mwall k-"+w.kind,x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2,
      stroke:w.color});
    if(w.open||w.kind==="window") n.setAttribute("stroke-dasharray","0.012 0.008");
    var tt=sv("title"); tt.textContent=w.label+(w.open?" (open)":"");
    n.appendChild(tt);
    svg.appendChild(n);
  });
  return svg;
}

/* ---- Zeichnen: was die Spielleitung aufdeckt und zumauert ---- */
var MAP_TOOLS=[["reveal","Reveal"],["hide","Hide"],["wall","Barrier"],
               ["area","Sub-map"],["erase","Erase"]];
function mapToolLayer(e,card,img){
  var lay=el("div",{class:"mdraw t-"+UI.mapTool});
  var von=null, vorschau=null;
  function punkt(ev){
    var rect=img.getBoundingClientRect();
    if(!rect.width||!rect.height)return null;
    return {x:Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width)),
            y:Math.min(1,Math.max(0,(ev.clientY-rect.top)/rect.height))};
  }
  lay.addEventListener("pointerdown",function(ev){
    var p=punkt(ev); if(!p)return;
    von=p; ev.preventDefault();
    try{ lay.setPointerCapture(ev.pointerId); }catch(x){}
    vorschau=el("div",{class:"mprev"+(UI.mapTool==="wall"?" line":"")+
      (UI.mapTool==="area"?" area":"")});
    lay.appendChild(vorschau);
  });
  lay.addEventListener("pointermove",function(ev){
    if(!von||!vorschau)return;
    var p=punkt(ev); if(!p)return;
    if(UI.mapTool==="wall"){
      var dx=(p.x-von.x), dy=(p.y-von.y);
      var rect=img.getBoundingClientRect();
      var lx=dx*rect.width, ly=dy*rect.height;
      vorschau.style.left=(von.x*100)+"%"; vorschau.style.top=(von.y*100)+"%";
      vorschau.style.width=Math.sqrt(lx*lx+ly*ly)+"px";
      vorschau.style.transform="rotate("+Math.atan2(ly,lx)+"rad)";
    } else {
      vorschau.style.left=(Math.min(von.x,p.x)*100)+"%";
      vorschau.style.top=(Math.min(von.y,p.y)*100)+"%";
      vorschau.style.width=(Math.abs(p.x-von.x)*100)+"%";
      vorschau.style.height=(Math.abs(p.y-von.y)*100)+"%";
    }
  });
  lay.addEventListener("pointerup",function(ev){
    var p=punkt(ev), a=von; von=null;
    if(vorschau){ vorschau.remove(); vorschau=null; }
    if(!a||!p)return;
    try{ lay.releasePointerCapture(ev.pointerId); }catch(x){}
    applyMapTool(e,card,a,p);
  });
  return lay;
}
/* Welcher Unterkartenrahmen unter diesem Punkt liegt — und ob an seiner
   Ecke. Die Ecke misst in Anteilen und nicht in Bildpunkten: auf einer
   herangezoomten Karte wäre eine Ecke von zwanzig Bildpunkten ein Fleck,
   auf einer herausgezoomten der halbe Rahmen. */
var FRAME_ECKE=0.025;
function frameAt(e,pt){
  var treffer=null;
  childMaps(e).forEach(function(k){
    var pr=k.rel.props||{};
    if(pr.x==null||pr.y==null)return;
    var x=Number(pr.x)||0, y=Number(pr.y)||0;
    var w=Number(pr.w)||0.12, h=Number(pr.h)||0.12;
    if(pt.x<x||pt.x>x+w||pt.y<y||pt.y>y+h)return;
    var ecke=Math.abs(pt.x-(x+w))<FRAME_ECKE&&Math.abs(pt.y-(y+h))<FRAME_ECKE;
    /* Der zuletzt gezeichnete liegt obenauf, also gewinnt er. */
    treffer={map:k.map,rel:k.rel,ecke:ecke};
  });
  return treffer;
}
function applyMapTool(e,card,a,b){
  var t=UI.mapTool, winzig=Math.abs(b.x-a.x)<0.005&&Math.abs(b.y-a.y)<0.005;
  if(t==="wall"){
    /* Ziehen baut, ein Klick schaltet. Eine Tür, die man nur über ein Menü
       aufbekommt, bleibt am Tisch zu. */
    if(winzig){
      var tuer=null, nah=0.02;
      (card.walls||[]).forEach(function(w){
        if((w.kind||"wall")!=="door")return;
        var d=segDist(a.x,a.y,{x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2});
        if(d<nah){ nah=d; tuer=w; }
      });
      if(!tuer)return;
      card.walls=(card.walls||[]).map(function(w){
        return w.id===tuer.id?Object.assign({},w,{open:!w.open}):w; });
    } else {
      card.walls=(card.walls||[]).concat([{id:uid("w"),kind:UI.wallKind||"wall",
        x1:a.x,y1:a.y,x2:b.x,y2:b.y}]);
    }
  } else if(t==="area"){
    /* Fängt der Zug an einem Rahmen an, gilt er dem Rahmen: an der Ecke
       wird die Grösse geändert, sonst wird geschoben. Ein Rahmen, den man
       nur neu aufziehen kann, wird beim ersten Vertun neu aufgezogen — und
       die Unterkarte hängt danach zweimal. */
    var fass=frameAt(e,a);
    if(fass){
      var pr=Object.assign({},fass.rel.props||{});
      if(fass.ecke){
        pr.w=Math.max(0.02,Math.min(1-(Number(pr.x)||0),b.x-(Number(pr.x)||0)));
        pr.h=Math.max(0.02,Math.min(1-(Number(pr.y)||0),b.y-(Number(pr.y)||0)));
      } else {
        var bw=Number(pr.w)||0.12, bh=Number(pr.h)||0.12;
        pr.x=Math.max(0,Math.min(1-bw,(Number(pr.x)||0)+(b.x-a.x)));
        pr.y=Math.max(0,Math.min(1-bh,(Number(pr.y)||0)+(b.y-a.y)));
      }
      fass.rel.props=pr;
      /* Der Rahmen steht am Kind — es nennt sein Elternteil, und nur
         vorwärts. Also wird das Kind geschrieben und nicht diese Karte. */
      persist(fass.map);
      return;
    }
    /* Der Rahmen einer Unterkarte wird aufgezogen und nicht in die Mitte
       gelegt: eine Karte, die zeigt, *wo* sie liegt, ist der halbe Zweck
       der Verschachtelung. */
    if(winzig)return;
    addSubmap(e,{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),
      w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)});
    return;
  } else if(t==="reveal"){
    if(winzig)return;
    card.reveal=(card.reveal||[]).concat([{id:uid("s"),kind:"rect",
      x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),
      w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)}]);
    card.fog=true;
  } else if(t==="hide"){
    if(winzig)return;
    var kasten={kind:"rect",x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),
      w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)};
    /* Zudecken heisst hier: was in diesem Kasten liegt, gilt nicht mehr als
       aufgedeckt. Ein Loch in eine Form zu schneiden ginge auch, wäre aber
       eine Form, die niemand mehr von Hand versteht. */
    card.reveal=(card.reveal||[]).filter(function(s){
      return !inShape(kasten,s.kind==="circle"?s.x:(s.x+(s.w||0)/2),
                             s.kind==="circle"?s.y:(s.y+(s.h||0)/2));
    });
  } else if(t==="erase"){
    var best=null, weit=0.02;
    (card.walls||[]).forEach(function(w){
      var d=segDist(a.x,a.y,{x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2});
      if(d<weit){ weit=d; best={art:"wall",id:w.id}; }
    });
    if(!best) (card.reveal||[]).forEach(function(s){
      if(inShape(s,a.x,a.y)) best={art:"reveal",id:s.id};
    });
    if(!best)return;
    if(best.art==="wall") card.walls=(card.walls||[]).filter(function(w){return w.id!==best.id;});
    else card.reveal=(card.reveal||[]).filter(function(s){return s.id!==best.id;});
  } else return;
  e.components=e.components||{};
  e.components[MAP_COMP]=card;
  persist(e);
}

/* Die Ebenenleiste. Eine Zeile je Zeichenebene, oben ist obenauf.

   Das unterste Blatt ist das Kartenbild selbst und lässt sich weder
   entfernen noch verschieben — an ihm hängt die Grösse. Es lässt sich
   ausblenden: wer ein Gelände über eine Skizze legt, will die Skizze
   danach weghaben, ohne sie zu verlieren. */
function sheetRow(e,card,sh,i,n){
  var zeile=el("div",{class:"msheetrow"+(sh.base?" base":"")});

  var auge=el("input",{type:"checkbox",title:"Visible"});
  auge.checked=sh.visible;
  auge.addEventListener("change",function(){ setSheet(e,card,sh,{visible:auge.checked}); });
  zeile.appendChild(auge);

  var name=el("button",{class:"btn sm gh msname",type:"button",
    title:sh.base?"The map image":"Rename this layer",
    onclick:function(){
      if(sh.base){ setSheetImage(e,card,sh); return; }
      prompt1("Layer name",sh.name,function(v){ setSheet(e,card,sh,{name:v||"Layer"}); });
    }},sh.name);
  zeile.appendChild(name);

  zeile.appendChild(el("button",{class:"btn sm gh",type:"button",title:"Background image",
    onclick:function(){ setSheetImage(e,card,sh); }},sh.image?"image":"no image"));

  /* Deckkraft nur, wo sie etwas heisst: das unterste Blatt hat nichts, durch
     das es scheinen könnte. */
  if(!sh.base){
    var sl=el("input",{type:"range",min:"0",max:"1",step:"0.05",
      class:"msopacity",title:"Opacity"});
    sl.value=String(sh.opacity);
    sl.addEventListener("change",function(){ setSheet(e,card,sh,{opacity:Number(sl.value)}); });
    zeile.appendChild(sl);
  }

  var gm=el("button",{class:"btn sm"+(sh.gmOnly?" pri":" gh"),type:"button",
    title:sh.gmOnly?"Only the GM sees this layer":"Everyone sees this layer",
    onclick:function(){ setSheet(e,card,sh,{gmOnly:!sh.gmOnly}); }},sh.gmOnly?"GM":"all");
  zeile.appendChild(gm);

  if(!sh.base){
    zeile.appendChild(el("button",{class:"btn sm gh",type:"button",title:"Further up",
      disabled:i<=1,onclick:function(){ moveSheet(e,card,sh,-1); }},"\u2191"));
    zeile.appendChild(el("button",{class:"btn sm gh",type:"button",title:"Further down",
      disabled:i>=n-1,onclick:function(){ moveSheet(e,card,sh,1); }},"\u2193"));
    zeile.appendChild(el("button",{class:"btn sm gh",type:"button",title:"Remove this layer",
      onclick:function(){
        confirmDialog("Remove the layer \u201c"+sh.name+"\u201d? Its image stays an asset.",
          function(){
            card.sheets=(card.sheets||[]).filter(function(x){return x.id!==sh.id;});
            e.components[MAP_COMP]=card; persist(e);
          });
      }},"\u00d7"));
  }
  return zeile;
}
function setSheet(e,card,sh,patch){
  if(sh.base){
    /* Das unterste Blatt hat keinen eigenen Eintrag — es *ist* die Karte.
       Was an ihm einstellbar ist, steht deshalb an der Karte. */
    if(patch.visible!=null) card.baseHidden=!patch.visible;
    if(patch.gmOnly!=null) card.baseGmOnly=!!patch.gmOnly;
    if(patch.image!==undefined) setMapImage(e,patch.image);
  } else {
    card.sheets=(card.sheets||[]).map(function(x){
      return x.id===sh.id?Object.assign({},x,patch):x; });
  }
  e.components=e.components||{}; e.components[MAP_COMP]=card; persist(e);
}
function moveSheet(e,card,sh,d){
  var l=(card.sheets||[]).slice();
  var i=l.findIndex(function(x){return x.id===sh.id;});
  /* Die Liste wird rückwärts gezeichnet, also ist „hoch" in der Liste
     „später" im Feld. Ein Vorzeichen, das an einer Stelle steht statt an
     zweien. */
  var j=i-d;
  if(i<0||j<0||j>=l.length)return;
  var t=l[i]; l[i]=l[j]; l[j]=t;
  card.sheets=l; e.components[MAP_COMP]=card; persist(e);
}
function setSheetImage(e,card,sh){
  dialog("Background image \u2014 "+sh.name,function(host,close){
    var w=assetInput({},sh.image||"");
    host.appendChild(field("Image",w));
    actions(host,close,function(){ setSheet(e,card,sh,{image:w.value||undefined}); },"Set");
  });
}
function addSheet(e,card){
  prompt1("New layer","Layer "+((card.sheets||[]).length+1),function(v){
    card.sheets=(card.sheets||[]).concat([
      {id:uid("sh"),name:v||"Layer",opacity:1,visible:true,gmOnly:false}]);
    e.components=e.components||{}; e.components[MAP_COMP]=card; persist(e);
  });
}
function sheetTools(e,card){
  var box=el("div",{class:"msheets sub"});
  var kopf=el("div",{class:"maptools"});
  kopf.appendChild(el("strong",{class:"hint",style:"margin:0;align-self:center",text:"Layers"}));
  kopf.appendChild(el("button",{class:"btn sm",type:"button",
    onclick:function(){ addSheet(e,card); }},"+ Layer"));
  box.appendChild(kopf);
  var liste=mapSheets(e,card);
  /* Oben ist obenauf: gezeichnet wird von hinten nach vorn, also die Liste
     rückwärts. Wer sie vorwärts zeigte, müsste jedes Mal umdenken. */
  liste.slice().reverse().forEach(function(sh,i){
    box.appendChild(sheetRow(e,card,sh,i,liste.length));
  });
  return box;
}

/* Die Leiste dafür. Sie steht nur der Spielleitung offen und nur, wenn die
   Karte ein Bild hat — ein Nebelwerkzeug über einer leeren Fläche wäre
   ein Knopf, der nichts tut. */
function fogTools(e,card){
  var bar=el("div",{class:"maptools sub"});
  var an=el("label",{class:"task"});
  var cb=el("input",{type:"checkbox"});
  cb.checked=!!card.fog;
  cb.addEventListener("change",function(){
    card.fog=cb.checked; e.components[MAP_COMP]=card; persist(e); });
  an.appendChild(cb); an.appendChild(el("span",{text:"Fog"}));
  bar.appendChild(an);

  var sel=el("select",{class:"i",style:"width:auto",title:"Lighting"});
  [["bright","Daylight"],["dim","Dim"],["dark","Dark"]].forEach(function(o){
    sel.appendChild(el("option",{value:o[0]},o[1])); });
  sel.value=card.lighting||"bright";
  sel.addEventListener("change",function(){
    card.lighting=sel.value; e.components[MAP_COMP]=card; persist(e); });
  bar.appendChild(sel);

  MAP_TOOLS.forEach(function(t){
    bar.appendChild(el("button",{class:"btn sm"+(UI.mapTool===t[0]?" pri":""),type:"button",
      onclick:function(){ UI.mapTool=UI.mapTool===t[0]?"":t[0]; render(); }},t[1]));
    /* Die Art steht neben dem Werkzeug, das sie braucht, und nur dann.
       Eine Auswahl, die immer dasteht, fragt nach einer Antwort, die
       gerade niemand hat. */
    if(t[0]==="wall"&&UI.mapTool==="wall"){
      var art=el("select",{class:"i",style:"width:auto",title:"What kind of barrier"});
      WALL_KINDS.forEach(function(k){ art.appendChild(el("option",{value:k[0]},k[1])); });
      art.value=UI.wallKind||"wall";
      art.addEventListener("change",function(){ UI.wallKind=art.value; render(); });
      bar.appendChild(art);
    }
  });
  bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    title:"Reveal the whole map",
    onclick:function(){
      card.reveal=[{id:uid("s"),kind:"rect",x:0,y:0,w:1,h:1}];
      card.fog=true; e.components[MAP_COMP]=card; persist(e); }},"all"));
  bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    title:"Cover the whole map again",
    onclick:function(){
      confirmDialog("Cover the whole map again? Everything the party has uncovered goes back under.",
        function(){ card.reveal=[]; card.fog=true; e.components[MAP_COMP]=card; persist(e); });
    }},"none"));
  var n=(card.reveal||[]).length, w=(card.walls||[]).length;
  var tuer=(card.walls||[]).filter(function(x){return (x.kind||"wall")==="door";}).length;
  var wie=UI.mapTool==="wall"?" · drag to build, click a door to open or shut it":
          UI.mapTool==="area"?" · drag a new frame, or move one you have \u2014 its corner resizes it":
          UI.mapTool?" · drag on the map":"";
  bar.appendChild(el("span",{class:"hint",style:"margin:0;align-self:center",
    text:n+" uncovered · "+w+" barrier"+(w===1?"":"s")+
      (tuer?" ("+tuer+" door"+(tuer===1?"":"s")+")":"")+wie}));
  return bar;
}

/* Kartenkacheln (REQ-138). Ein Muster mit {x} und {y} statt eines Bildes —
   für Scans, die als ein Stück niemand lädt. Die natürliche Grösse steht
   dann fest, statt vom Laden abzuhängen. */
function tileGrid(card){
  var m=card.tiles; if(!m)return null;
  var cols=Math.max(1,Number(card.tileCols)||1), rows=Math.max(1,Number(card.tileRows)||1);
  var px=Math.max(16,Number(card.tileSize)||256);
  var box=el("div",{class:"mtiles"});
  box.style.gridTemplateColumns="repeat("+cols+",1fr)";
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
    box.appendChild(el("img",{src:String(m).replace(/\{x\}/g,x).replace(/\{y\}/g,y),
      alt:"",loading:"lazy"}));
  }
  return {node:box,nat:{w:cols*px,h:rows*px}};
}

/* Ein Token einstellen: Art, Grösse, Drehung, Notiz — und der Weg hinaus.
   Es steht alles an der Kante, weil alles davon an **beiden** Enden hängt:
   dasselbe Fass steht auf einer Karte quer und auf der nächsten längs, und
   dieselbe Laterne leuchtet auf einer Stadtkarte anders weit als auf einer
   Kampfkarte. */
function tokenSetup(e,r,art){
  dialog("On the map — "+(art?nameOf(art):"token"),function(host,close){
    var pr=r.props||{};
    var artSel=el("select",{class:"i"});
    TOKEN_KINDS.forEach(function(k){ artSel.appendChild(el("option",{value:k[0]},k[1])); });
    artSel.value=tokenKind(r);
    var size=el("input",{class:"i",type:"number",min:"0.25",step:"0.25",
      value:String(Number(pr.size)||1)});
    var rot=el("input",{class:"i",type:"number",min:"-180",max:"360",step:"15",
      value:String(Number(pr.rot)||0)});
    var ratio=el("input",{class:"i",type:"number",min:"0.1",step:"0.1",
      value:String(Number(pr.ratio)>0?Number(pr.ratio):1)});
    var note=el("input",{class:"i",type:"text",value:pr.note||"",placeholder:"optional"});
    var hell=el("input",{class:"i",type:"number",min:"0",step:"1",
      value:pr.light==null?"":String(pr.light)});
    var matt=el("input",{class:"i",type:"number",min:"0",step:"1",
      value:pr.dim==null?"":String(pr.dim)});

    host.appendChild(field("Kind",artSel));
    host.appendChild(field("Width in squares",size));
    /* Seitenverhältnis nur beim Möbel: eine Kreatur belegt Felder und kein
       Rechteck, und ein Feld, das für sie nichts heisst, fragt nach einer
       Antwort, die es nicht gibt. */
    var vz=field("Height ÷ width",ratio);
    host.appendChild(vz);
    host.appendChild(field("Rotation in degrees",rot));
    host.appendChild(field("Note",note));
    host.appendChild(field("Bright light in squares",hell));
    host.appendChild(field("Dim light in squares",matt));
    function zeig(){ vz.style.display=artSel.value==="scenery"?"":"none"; }
    artSel.addEventListener("change",zeig); zeig();

    var weg=el("div",{class:"rowbtns"});
    weg.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
      close();
      confirmDialog("Take “"+(art?nameOf(art):"?")+"” off this map?",function(){
        e.relations=e.relations.filter(function(x){return x.id!==r.id;}); persist(e); });
    }},"Take it off"));
    host.appendChild(weg);

    actions(host,close,function(){
      var neu=Object.assign({},pr,{
        kind:artSel.value,
        size:Number(size.value)||1,
        rot:Number(rot.value)||undefined,
        ratio:artSel.value==="scenery"&&Number(ratio.value)>0&&Number(ratio.value)!==1
          ?Number(ratio.value):undefined,
        note:note.value.trim()||undefined,
        light:hell.value===""?undefined:Number(hell.value),
        dim:matt.value===""?undefined:Number(matt.value)});
      r.props=neu;
      persist(e);
    },"Save");
  });
}

/* ---- Hineinzoomen statt hineinspringen (REQ-131, 160) ----
   Eine Unterkarte ist ein Rahmen auf der grossen Karte. Ihn anzuklicken
   ging schon; was fehlte, war das, was man tatsächlich tut: **näher
   herangehen.** Das Rad zoomt auf den Zeiger zu, und wenn ein Rahmen den
   Blick füllt, ist der nächste Zoomschritt der Schritt hinein.

   Eine Schwelle allein wäre ein Sprung, den niemand kommen sieht. Deshalb
   zwei Stufen: ab `NAH` wird der Rahmen aufdringlich — durchgezogen,
   beschriftet, „zoom in to enter" —, und erst der Schritt danach betritt
   ihn. Und zurück geht es genauso: wer auf einer Unterkarte hinauszoomt
   und schon ganz draussen ist, landet beim Elternteil. */
var MAP_NAH=0.55, mapBox={w:0,h:0};
function noteMapBox(){
  var st=document.querySelector(".mapstage");
  if(st&&st.clientWidth) mapBox={w:st.clientWidth,h:st.clientHeight||mapBox.h};
}
/* Wie viel vom Sichtfenster ein Rahmen füllt. Gemessen am Fenster und
   nicht am Bild: „füllt den Blick" ist eine Aussage über den Blick.

   Die Höhe kommt aus der natürlichen Grösse und nicht aus `offsetHeight`.
   Solange das Bild lädt, ist die gemessene Höhe 0 — und dann wäre jeder
   Rahmen winzig, obwohl er den halben Schirm füllt. Dieselbe Regel wie
   beim Nebel: das Register zuerst, die Messung danach. */
function areaShare(pr,nat,zoom){
  /* Gemessen wird das Sichtfenster, gerechnet das Bild. Beim Zeichnen hängt
     das neue Bild noch nicht im Baum — es zu messen ergäbe null, und dann
     wäre jeder Rahmen winzig, obwohl er den halben Schirm füllt. Die
     Breite des Bildes ist ohnehin der Zoom mal das Fenster; sie
     auszurechnen ist genauer als sie abzulesen. */
  /* Beim Zeichnen ist das alte Sichtfenster schon weg und das neue noch
     nicht da. Darum wird es nach jedem Zeichnen gemerkt: die Grösse des
     Fensters ändert sich mit dem Fenster und nicht mit dem Zoom. */
  var st=document.querySelector(".mapstage");
  var sw=(st&&st.clientWidth)||mapBox.w, sh=(st&&st.clientHeight)||mapBox.h;
  if(!sw||!nat||!(Number(nat.w)>0))return 0;
  var bw=sw*(zoom||1), bh=bw*(Number(nat.h)/Number(nat.w));
  var quer=((Number(pr.w)||0.12)*bw)/sw;
  /* Die Höhe des Sichtfensters steht nicht immer: beim Zeichnen hängt die
     Bühne noch nicht im Baum, und ein Bild, das noch lädt, gibt ihr keine.
     Dann zählt die Breite allein. Eine Höhe von null hiess hier einmal
     „füllt den Blick nicht" — und der Rahmen sagte nie an, was der nächste
     Schritt tut, sondern betrat sie ohne Vorwarnung. Eine fehlende Messung
     ist keine Messung von null. */
  if(!sh) return quer;
  /* Beide Seiten müssen voll sein. Ein Rahmen, der nur quer den Blick
     füllt, ist ein Streifen und kein Ziel. */
  return Math.min(quer,((Number(pr.h)||0.12)*bh)/sh);
}
function mapZoomBy(schritt,e,nat){
  var alt=UI.mapZoom;
  var neu=Math.min(8,Math.max(0.25,alt*(schritt>0?1.25:0.8)));
  if(neu===alt&&schritt<0){
    /* Ganz draussen und noch weiter hinaus: das ist die Frage nach der
       Karte darüber. */
    var oben=parentMap(e);
    if(oben){ UI.mapZoom=1; go({k:"art",id:oben.id}); return; }
  }
  if(schritt>0){
    /* Was den Blick schon füllt, wird jetzt betreten. Geprüft wird vor dem
       Zoomen, damit der Schritt hinein und der Schritt näher nicht
       derselbe sind. */
    var rein=null;
    childMaps(e).forEach(function(k){
      var pr=k.rel.props||{};
      if(pr.x==null||pr.y==null)return;
      if(areaShare(pr,nat,UI.mapZoom)>=MAP_NAH) rein=k.map;
    });
    if(rein){ UI.mapZoom=1; go({k:"art",id:rein.id}); return; }
  }
  UI.mapZoom=neu;
  render();
}

function elMap(e,ifn,item){
  var card=mapCard(e);
  var src=assetSrc(mapImage(e));
  var wrap=el("div",{class:"mapbox"});
  /* Die beiden werden weiter unten gefüllt; die Leiste braucht sie nur,
     wenn jemand klickt, und dann stehen sie. */
  var stage=null, img=null, nat=null;   /* erst weiter unten gefüllt */

  /* Werkzeugleiste: Zoom, Gitter, Tokenfilter. Der Filter ist kein Zierrat —
     eine vorbereitete Karte und eine im Spiel laufende sind dieselbe Karte,
     und man will die Vorbereitung sehen können, ohne die Spielzüge. */
  var bar=el("div",{class:"maptools"});
  if(inPlacement) bar.style.display="none";
  /* Dieselbe Funktion wie das Rad: zwei Wege, die verschieden zoomen, sind
     zwei Wege, auf denen man verschieden tief landet. */
  [["−",-1],["+",1]].forEach(function(z){
    bar.appendChild(el("button",{class:"btn sm",type:"button",title:"Zoom",
      onclick:function(){ mapZoomBy(z[1],e,nat); }},z[0]));
  });
  bar.appendChild(el("span",{class:"hint",style:"margin:0",
    text:Math.round(UI.mapZoom*100)+"%"+(card.scale?" · 1 square = "+card.scale:"")}));
  var filt=el("select",{class:"i",style:"width:auto"});
  filt.appendChild(el("option",{value:""},"all tokens"));
  TOKEN_KINDS.forEach(function(k){ filt.appendChild(el("option",{value:k[0]},k[1])); });
  filt.value=UI.mapKind;
  filt.addEventListener("change",function(){ UI.mapKind=filt.value; render(); });
  bar.appendChild(filt);
  if(canWrite()) bar.appendChild(el("button",{class:"btn sm",type:"button",
    onclick:function(){ addMarker(e); }},"+ Token"));
  if(canWrite()) bar.appendChild(el("button",{class:"btn sm",type:"button",
    onclick:function(){ addSubmap(e,null); }},"+ Sub-map"));
  var eltern=parentMap(e);
  if(eltern) bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    onclick:function(){ go({k:"art",id:eltern.id}); }},"↑ "+nameOf(eltern)));
  wrap.appendChild(bar);

  var kacheln=tileGrid(card);
  if(!src&&!kacheln){
    wrap.appendChild(el("div",{class:"empty",
      text:canWrite()?"This map has no image yet — set MapInfo · Image.":"No image."}));
    return wrap;
  }
  if(canWrite()&&!inPlacement){
    wrap.appendChild(sheetTools(e,card));
    wrap.appendChild(fogTools(e,card));
  }

  stage=el("div",{class:"mapstage"});
  var inner=el("div",{class:"mapinner"});
  /* Das Rad zoomt und rollt nicht. Ohne `passive:false` liesse sich das
     Scrollen nicht abbestellen, und die Seite führe unter der Karte weg. */
  stage.addEventListener("wheel",function(ev){
    if(ev.ctrlKey)return;                 /* der Browserzoom gehört dem Browser */
    ev.preventDefault();
    mapZoomBy(ev.deltaY<0?1:-1,e,nat);
  },{passive:false});
  /* Alt-Klick zeigt auf eine Stelle. Das ist der einzige Grund, warum es den
     Echtzeitkanal überhaupt braucht: „da" lässt sich nicht speichern. */
  inner.addEventListener("click",function(ev){
    if(!ev.altKey)return;
    var rect=img.getBoundingClientRect();
    if(!rect.width)return;
    pingMap(e.id,(ev.clientX-rect.left)/rect.width,(ev.clientY-rect.top)/rect.height);
  });
  /* Gezoomt wird der **Kasten** und nicht das Bild darin: so bleiben Bild,
     Gitter und Tokens in einem Koordinatenraum, und ein Anteil von 0 bis 1
     meint überall dasselbe. */
  inner.style.width=(UI.mapZoom*100)+"%";
  if(kacheln){
    img=kacheln.node;
    img.style.width="100%";
  } else {
    img=el("img",{class:"mapimg",src:src,alt:nameOf(e)});
    /* Die natürliche Grösse kommt erst mit dem Bild. Bis dahin wird nichts
       aufgedeckt — lieber ein Bild ohne Nebel gar nicht zeigen als einen
       Nebel, der einen Wimpernschlag zu spät kommt. */
    img.addEventListener("load",function(){ noteNat(src,img.naturalWidth,img.naturalHeight); });
    if(img.complete&&img.naturalWidth) noteNat(src,img.naturalWidth,img.naturalHeight);
  }
  inner.appendChild(img);

  /* Die Zeichenebenen darüber. Das unterste Blatt bleibt im Fluss — es
     bestimmt, wie gross die Karte ist —, auch wenn es ausgeblendet ist;
     ausgeblendet heisst dann durchsichtig und nicht weg. Alle weiteren
     liegen darüber und fangen keine Maus. */
  if(!kacheln){
    var basis=mapSheets(e,card)[0];
    if(!(basis.visible&&(isGM()||!basis.gmOnly))) img.style.opacity="0";
    drawnSheets(e,card).forEach(function(sh){
      if(sh.base)return;
      var u=assetSrc(sh.image); if(!u)return;
      var lage=el("img",{class:"msheet",src:u,alt:"",title:sh.name});
      lage.style.opacity=String(Math.max(0,Math.min(1,sh.opacity)));
      inner.appendChild(lage);
    });
  }

  var raster=gridOverlay(card,UI.mapZoom);
  if(raster) inner.appendChild(raster);

  nat=kacheln?kacheln.nat:natFor(card,src,e);
  var sicht=nat?visionOverlay(e,card,nat):null;
  if(sicht) inner.appendChild(sicht);
  else if(!nat&&(card.fog||(card.lighting&&card.lighting!=="bright")))
    inner.appendChild(el("div",{class:"mfogflat"}));

  /* Untergliederungen als Rechtecke: ein Klick springt hinein, und die
     Breadcrumbs merken sich den Weg zurück (REQ-131, REQ-160). */
  childMaps(e).forEach(function(k){
    var pr=k.rel.props||{};
    if(pr.x==null||pr.y==null)return;
    /* Füllt der Rahmen den Blick, ist der nächste Zoomschritt der Schritt
       hinein. Er sagt das vorher — ein Sprung, den niemand kommen sieht,
       ist keine Navigation, sondern ein Versehen. */
    var nah=areaShare(pr,nat,UI.mapZoom)>=MAP_NAH;
    var box=el("button",{class:"maparea"+(nah?" near":""),type:"button",
      title:nah?"Zoom in once more to enter "+nameOf(k.map):"Enter "+nameOf(k.map),
      onclick:function(){ UI.mapZoom=1; go({k:"art",id:k.map.id}); }});
    box.style.left=(pr.x*100)+"%"; box.style.top=(pr.y*100)+"%";
    box.style.width=((pr.w||0.12)*100)+"%"; box.style.height=((pr.h||0.12)*100)+"%";
    box.appendChild(el("span",{text:nah?nameOf(k.map)+" — zoom in to enter":nameOf(k.map)}));
    inner.appendChild(box);
  });

  var marker=(e.relations||[]).filter(function(r){ return r.type===REL_MARKER; });
  marker.forEach(function(r){
    var art=r.to?ENT.get(r.to):null;
    var kind=tokenKind(r);
    if(UI.mapKind&&kind!==UI.mapKind)return;
    var pr=r.props||{};
    /* Der Zeiger auf dem, der dran ist (REQ-144): derselbe Zeichner, nur
       ein Ring mehr. */
    var dran=UI.turnActor&&art&&art.id===UI.turnActor;
    /* Ein Möbel ist kein Token: es liegt auf der Karte, statt auf ihr zu
       stehen. Deshalb ohne Kreis, mit Drehung und mit einem Seitenverhältnis
       — ein Tisch ist kein Quadrat. */
    var moebel=kind==="scenery";
    var t=el("button",{class:"mtoken k-"+kind+(dran?" now":"")+(moebel?" asset":""),
      type:"button",
      title:(art?nameOf(art):"(missing)")+(pr.note?" — "+pr.note:"")+
        (canWrite()?" · right-click to set it up":"")});
    t.style.left=((pr.x||0.5)*100)+"%";
    t.style.top=((pr.y||0.5)*100)+"%";
    var d=Math.max(14,(Number(card.gridSize)||70)*(Number(pr.size)||1)*UI.mapZoom);
    var hoch=moebel?d*(Number(pr.ratio)>0?Number(pr.ratio):1):d;
    t.style.width=d+"px"; t.style.height=hoch+"px";
    /* Die Drehung kommt hinter die Zentrierung, sonst dreht sich der Punkt
       mit und das Möbel wandert beim Drehen aus. */
    var dreh=Number(pr.rot)||0;
    if(dreh) t.style.transform="translate(-50%,-50%) rotate("+dreh+"deg)";
    var bild=art&&assetSrc(((art.components||{}).Image||{}).image||((art.components||{}).Image||{}).url);
    if(bild) t.appendChild(el("img",{src:bild,alt:""}));
    else t.appendChild(el("span",{text:(art?nameOf(art):"?").slice(0,2)}));

    /* Ziehen verschiebt, ein Klick ohne Ziehen öffnet. Beides am selben
       Knopf: ein Token, das sich nur über ein Menü bewegen liesse, bewegt
       niemand mitten im Kampf. */
    var von=null;
    t.addEventListener("pointerdown",function(ev){
      if(!canWrite())return;
      von={x:ev.clientX,y:ev.clientY,moved:false};
      try{ t.setPointerCapture(ev.pointerId); }catch(x){}
    });
    t.addEventListener("pointermove",function(ev){
      if(!von)return;
      if(Math.abs(ev.clientX-von.x)+Math.abs(ev.clientY-von.y)>4) von.moved=true;
      if(!von.moved)return;
      var rect=img.getBoundingClientRect();
      if(!rect.width||!rect.height)return;
      var nx=Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width));
      var ny=Math.min(1,Math.max(0,(ev.clientY-rect.top)/rect.height));
      t.style.left=(nx*100)+"%"; t.style.top=(ny*100)+"%";
      von.nx=nx; von.ny=ny;
    });
    t.addEventListener("pointerup",function(ev){
      if(!von){ if(art) go({k:"art",id:art.id}); return; }
      var war=von; von=null;
      try{ t.releasePointerCapture(ev.pointerId); }catch(x){}
      if(!war.moved){ if(art) go({k:"art",id:art.id}); return; }
      r.props=Object.assign({},r.props,{x:war.nx,y:war.ny});
      persist(e);
    });
    /* Rechtsklick stellt ein und löscht nicht sofort. Ein Rechtsklick, der
       ohne Rückfrage etwas wegnimmt, ist der Klick, den man auf einem
       Laptop-Touchpad aus Versehen macht. */
    t.addEventListener("contextmenu",function(ev){
      ev.preventDefault();
      if(!canWrite())return;
      tokenSetup(e,r,art);
    });
    inner.appendChild(t);
  });

  /* Die Gruppe steht auf einer feineren Karte: hier nur abgebildet (A6),
     gestrichelt, und ein Klick führt auf die Karte, auf der sie steht. */
  var abgebildet=derivedPartyToken(e);
  if(abgebildet&&(!UI.mapKind||UI.mapKind==="party")){
    var gt=el("button",{class:"mtoken k-party ghost",type:"button",
      title:nameOf(abgebildet.party)+" — stands on "+nameOf(abgebildet.map)+
        (abgebildet.place?" ("+nameOf(abgebildet.place)+")":"")+"; shown here, moved there"});
    gt.style.left=(abgebildet.x*100)+"%"; gt.style.top=(abgebildet.y*100)+"%";
    var gd=Math.max(14,(Number(card.gridSize)||70)*UI.mapZoom);
    gt.style.width=gd+"px"; gt.style.height=gd+"px";
    gt.appendChild(el("span",{text:nameOf(abgebildet.party).slice(0,2)}));
    gt.addEventListener("click",function(){ go({k:"art",id:abgebildet.map.id}); });
    inner.appendChild(gt);
  }

  (UI.pings||[]).forEach(function(pg){
    if(pg.map!==e.id)return;
    var n=el("div",{class:"mping"});
    n.style.left=(pg.x*100)+"%"; n.style.top=(pg.y*100)+"%";
    n.appendChild(el("span",{text:pg.who||""}));
    inner.appendChild(n);
  });

  if(UI.mapTool&&canWrite()&&!inPlacement) inner.appendChild(mapToolLayer(e,card,img));

  stage.appendChild(inner);
  wrap.appendChild(stage);

  var zahl=marker.length;
  wrap.appendChild(el("p",{class:"hint",
    text:zahl?(zahl+" token"+(zahl===1?"":"s")+
      (canWrite()?" · drag to move, right-click to set up":"")+
      (roomNS?" · alt-click points at a spot for everyone":"")):
      (roomNS?"No tokens yet — alt-click points at a spot for everyone.":"No tokens yet.")}));
  return wrap;
}

/* Ein Token anlegen: Artikel wählen, Art wählen, fertig. Es landet in der
   Mitte und wird von dort gezogen — eine Eingabemaske für Koordinaten wäre
   genau der Umweg, den niemand am Tisch geht. */
function addMarker(e){
  dialog("Put a token on the map",function(host,close){
    var suche=el("input",{class:"i",type:"text",placeholder:"Search articles…"});
    var sel=el("select",{class:"i",size:"8",style:"height:auto"});
    function fuelle(){
      var q=suche.value.toLowerCase().trim();
      sel.textContent="";
      byName().forEach(function(c){
        if(c.id===e.id)return;
        if(q&&nameOf(c).toLowerCase().indexOf(q)<0)return;
        sel.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
      });
      if(!sel.childNodes.length) sel.appendChild(el("option",{value:""},"— nothing matches —"));
    }
    suche.addEventListener("input",fuelle);
    var art=el("select",{class:"i"});
    TOKEN_KINDS.forEach(function(k){ art.appendChild(el("option",{value:k[0]},k[1])); });
    var note=el("input",{class:"i",type:"text",placeholder:"optional"});
    var size=el("input",{class:"i",type:"number",value:"1",min:"0.25",step:"0.25"});
    host.appendChild(field("Article",suche));
    host.appendChild(sel);
    host.appendChild(field("Kind",art));
    host.appendChild(field("Size in squares",size));
    host.appendChild(field("Note",note));
    fuelle();
    actions(host,close,function(){
      if(!sel.value)return false;
      e.relations=e.relations||[];
      e.relations.push({id:uid("r"),type:REL_MARKER,to:sel.value,props:{
        x:0.5,y:0.5,kind:art.value,size:Number(size.value)||1,
        note:note.value.trim()||undefined}});
      persist(e);
    },"Place");
  });
}

/* Eine Unterkarte: entweder eine vorhandene hineinhängen oder eine neue
   anlegen. Der Ankerbereich sitzt zuerst in der Mitte und wird dort
   zurechtgezogen — dieselbe Regel wie beim Token. */
function addSubmap(e,rahmen){
  dialog("Sub-map",function(host,close){
    var sel=el("select",{class:"i"});
    sel.appendChild(el("option",{value:""},"— create a new map —"));
    byName().forEach(function(c){
      if(c.id===e.id)return;
      if(((c.interfaces||[])[0])!==MAP_IFACE)return;
      sel.appendChild(el("option",{value:c.id},nameOf(c)));
    });
    var nm=el("input",{class:"i",type:"text",placeholder:"Name of the new map"});
    host.appendChild(field("Map",sel));
    host.appendChild(field("New name",nm));
    host.appendChild(el("p",{class:"hint",
      text:rahmen?"The frame you dragged is where it sits on this map.":
        "No frame drawn — it lands in the middle. Use the Sub-map tool to draw where it sits."}));
    actions(host,close,function(){
      var kind=sel.value?ENT.get(sel.value):null;
      if(!kind){
        var name=nm.value.trim(); if(!name){nm.focus();return false;}
        kind={ id:uid("mp"), interfaces:[MAP_IFACE], name:name,
          components:{ Identity:{name:name,id:nextId("Map"),aliases:[]} },
          adhoc:[], relations:[], createdAt:new Date().toISOString() };
        reqFor(MAP_IFACE).forEach(function(c){ if(!kind.components[c]&&REG.interfaces[c]) kind.components[c]={}; });
        applyDefaults(kind,MAP_IFACE);
        ENT.set(kind.id,kind);
      }
      kind.relations=(kind.relations||[]).filter(function(r){return r.type!==REL_INSIDE;});
      kind.relations.push({id:uid("r"),type:REL_INSIDE,to:e.id,
        props:rahmen?{x:rahmen.x,y:rahmen.y,w:rahmen.w,h:rahmen.h}
                    :{x:0.4,y:0.4,w:0.2,h:0.2}});
      persist(kind);
      render();
    },"Attach");
  });
}

/* ---------- Zugang und Spieleransicht (REQ-031 bis 040, 069, 119, 128) ----------
   Ein Spieler ist kein Zuschauer mit weniger Knöpfen. Er sieht einen anderen
   Artikel: Sichtbarkeit und Wissen greifen *vor* der Darstellung, nicht
   danach. Alles, was die Seite filtert, filtert sie an drei Stellen —
   welche Artikel, welche Felder, welche Blöcke — und nirgends sonst.

   Die Identität kommt von der Laufzeit (`user`), nicht aus einem Passwort
   in einem Feld: die Seite hat keinen Server, an dem sie eines prüfen
   könnte, und ein Passwort im Browser ist keines. Wenn der echte Stapel
   kommt, tritt REQ-031 an diese Stelle — die Abfragen darunter bleiben.

   Der „Ansehen als"-Schalter zählt wie ein anderer Betrachter. Sonst liesse
   sich nicht prüfen, was ein Charakter sieht, und man merkte es erst am
   Tisch. */
/* ---------- Konten und ihre Rollen ----------
   **Was ein Konto am Tisch ist, steht am Konto** und in keinem Artikel. Am
   Server sind das zwei Tabellen — `app_user_actor` (welche Figuren) und
   `campaign_member` (welche Rolle in welcher Kampagne); hier ist es die
   Sammlung `members`, ein Dokument je Konto:

     members/<kontoId> = { actors: [Figuren-Ids], roles: { <kampagne>: "gm" } }

   Es stand als `Access`-Karte an der Figur (und für einen Tag an der
   Kampagne). Eine Figur sagt aber nicht, in welcher Runde ihr Konto was
   ist, und eine Konto-Id in einem Artikel wanderte mit jeder Ausfuhr mit
   (REQ-199). Die Sammlung wandert deshalb **nicht** mit: sie steht nicht in
   der Ausfuhr, und keine Einfuhr rührt sie an. */
var MEMBERS=new Map();
function memberOf(uid){ return (uid&&MEMBERS.get(uid))||null; }

/* Wen dieser Nutzer spielt: die erste Figur seines Kontos. */
function actorForUser(uid){
  var m=memberOf(uid);
  return (m&&Array.isArray(m.actors)&&m.actors[0])||"";
}
/* Das Konto, das eine Figur führt — für „ansehen als". */
function memberOfActor(actorId){
  var hit=null;
  MEMBERS.forEach(function(m,uid){
    if(!hit&&actorId&&Array.isArray(m.actors)&&m.actors.indexOf(actorId)>=0) hit={id:uid,m:m};
  });
  return hit;
}
/* Ein Konto schreiben. Wer das darf, prüft der Aufrufer (die Verwaltung,
   oder die Leitung der Kampagne, um deren Rolle es geht). */
function saveMember(uid,m){
  if(!uid||blockedByLoad())return;
  var sauber={actors:(m.actors||[]).filter(Boolean),roles:{}};
  Object.keys(m.roles||{}).forEach(function(k){
    if(ROLLEN_RANG[m.roles[k]]) sauber.roles[k]=m.roles[k];
  });
  if(m.name) sauber.name=String(m.name);
  MEMBERS.set(uid,sauber);
  render();
  if(db) db.doc("members/"+uid).set(sauber).catch(fail);
}
/* ---------- Sichtbarkeit (REQ-038) ----------
   Die **grobe** Frage: ob dieser Artikel überhaupt an diesen Betrachter
   geht. Die feine (REQ-039) ist das Wissensmodell und sitzt eine Ebene
   tiefer — am Feld, nicht am Artikel. Sie zusammenzulegen hiesse, einen
   Artikel dadurch zu verbergen, dass man alle seine Felder wegnimmt, und
   er stünde trotzdem in der Liste, mit Namen und Bereich.

   Was ein Konto am Tisch ist, steht an ihm (`members`, siehe oben), **je
   Kampagne**: `gm`, `co-gm`, `player`, `spectator`. Das ist nicht der
   Besitzer des Artefakts (`me.gm`) — der ist die Verwaltung und sieht
   alles, wie `is_admin` am Server. */
var ROLLEN_RANG={"gm":4,"co-gm":3,"player":2,"spectator":1};
var ROLLEN=["gm","co-gm","player","spectator"];
/* ---------- wem ein Artikel gehört ----------
   **Abgelesen am Ebenenstapel und nicht an einem eigenen Feld.** Ein
   Artikel liegt in Ebenen (`inLayer`), eine Kampagne schaltet Ebenen auf
   (`activates`). Also gehört eine Ebene, die genau **eine** Kampagne
   aufschaltet, ihr — und eine, die mehrere aufschalten, ist gemeinsam.

   Dass die Zugehörigkeit so von selbst herausfällt, ist der Grund, hier
   kein Feld zu setzen: ein Feld, das gleichzeitig Regel ist, leckt beim
   ersten Tippfehler — ein Paket, das versehentlich `campaign` heisst,
   gehörte plötzlich wem? */
function kampagnenVon(e){
  var ebenen={};
  (e.relations||[]).forEach(function(r){
    if(r.type!==REL_INLAYER)return;
    if(((r.props||{}).mode)==="removes")return;      /* nimmt heraus, bringt nicht */
    ebenen[r.to]=1;
  });
  if(!Object.keys(ebenen).length)return null;        /* keine Ebene sagt nichts */
  var out={};
  ENT.forEach(function(c){
    if((c.interfaces||[])[0]!=="Campaign")return;
    (c.relations||[]).forEach(function(r){
      if(r.type===REL_ACTIVATES&&ebenen[r.to]) out[c.id]=1;
    });
  });
  return Object.keys(out);
}
/* Die **eine** Kampagne, der er gehört — sonst nichts. Keine Ebene (nicht
   zuzuordnen) und mehrere Kampagnen (gemeinsam) laufen auf dasselbe
   hinaus: er ist nicht das Geheimnis *einer* Runde. */
function campaignOf(e){
  var k=kampagnenVon(e);
  return (k&&k.length===1)?k[0]:"";
}
/* Die Konten, die eine Kampagne leiten — `gm` oder `co-gm` an ihrem Konto. */
function gmAccounts(campId){
  var out=[];
  MEMBERS.forEach(function(m,uid){
    var r=(m.roles||{})[campId];
    if(r==="gm"||r==="co-gm") out.push(uid);
  });
  return out;
}
/* **Die Rollen des Betrachters**, je Kampagne.
   Beim Blick „als Figur" sind es die Rollen des Kontos, das sie führt —
   sonst sähe die Probe weiter die eigene Leitung. Führt kein Konto die
   Figur, ist der Blick eine **Probe**: sie sitzt als Spielerin in der
   laufenden Kampagne, denn genau das will wissen, wer „als Rook" schaut. */
function viewerRoles(){
  if(UI.asActor){
    var wer=memberOfActor(UI.asActor);
    if(wer) return wer.m.roles||{};
    var camp=currentCampaign(), r={};
    if(camp) r[camp.id]="player";
    return r;
  }
  return (memberOf(me.id)||{}).roles||{};
}
/* Die Rolle in **dieser** Kampagne — oder, ohne Kampagne, die stärkste
   irgendwo. Wer in der einen Runde leitet und in der anderen zuschaut, ist
   in der anderen Zuschauer. */
function tableRole(roles,campId){
  roles=roles||{};
  if(campId) return ROLLEN_RANG[roles[campId]]?roles[campId]:null;
  var beste=null;
  Object.keys(roles).forEach(function(k){
    var r=roles[k];
    if(!ROLLEN_RANG[r])return;
    if(!beste||ROLLEN_RANG[r]>ROLLEN_RANG[beste]) beste=r;
  });
  return beste;
}
/* Was die Stufe für diese Rolle erlaubt. **`public` ist die Vorgabe:** ein
   Artikel, den niemand eingestuft hat, ist offen. Andersherum wäre die
   halbe Kampagne unsichtbar, und niemand wüsste, warum. */
function audienceAllows(stufe,rolle){
  /* Ein Mitleiter sitzt hinter dem Schirm und nicht davor. */
  if(stufe==="gm")return rolle==="gm"||rolle==="co-gm";
  /* Die Leitung sieht alles darunter mit — ein Artikel „für die
     Spielenden" vor ihr zu verbergen wäre Unsinn. */
  if(stufe==="players")return rolle==="player"||rolle==="co-gm"||rolle==="gm";
  if(stufe==="campaign")return rolle!==null;         /* wer am Tisch sitzt */
  return true;                                       /* public */
}
function articleVisible(e){
  /* Der Stapel gilt für alle, auch für die Spielleitung: was nicht läuft,
     ist nicht da. Wissen und Sichtbarkeit sind die zweite Frage und
     kommen danach. */
  if(!inStack(e))return false;
  if(isOverridden(e))return false;
  if(isGM())return true;
  var vis=(e.components||{}).Visibility||{};
  var traeger=knowledgeHolders(viewerActor()||"");
  var nennt=function(liste){
    return Array.isArray(liste)&&liste.some(function(x){ return !!traeger[x]; });
  };
  /* Die Reihenfolge **ist** die Regel: Verbot, Freigabe, Stufe. Das
     ausdrückliche Verbot gewinnt, weil es die Ausnahme ist, die jemand von
     Hand eingetragen hat. `revealedTo` war bis hierher nie gelesen — eine
     Freigabe, die nichts tat. */
  if(nennt(vis.hiddenFrom))return false;
  if(nennt(vis.revealedTo))return true;
  var stufe=vis.audience||"public";
  if(stufe==="public")return true;
  /* **Die Rolle in der Kampagne, der der Artikel gehört.** Liegt er in der
     Ebene einer Runde, zählt nur die Rolle dort — die Leitung der anderen
     Runde ist hier niemand. Liegt er in einer geteilten Ebene oder in
     keiner, zählt die stärkste Rolle irgendwo: ein Grundregelwerk, das
     drei Runden aufschalten, gehört keiner davon. */
  return audienceAllows(stufe,tableRole(viewerRoles(),campaignOf(e)));
}
/* Welche Feldverweise darf dieser Betrachter sehen? Offen plus das, was er
   weiss — dieselbe Abfrage wie in der Wissensansicht, nur als Filter. */
function visibleRefs(e,refs){
  if(isGM())return refs;
  var a=viewerActor();
  var erlaubt={};
  knowledgeGroups(e,refs,a).forEach(function(g){
    if(!g.known)return;
    g.fields.forEach(function(f){
      /* Zwei Regeln, und die ausdrückliche gewinnt: was eine *bekannte*
         Information nennt, ist freigegeben — auch wenn das Feld „secret"
         heisst. Genau dafür hat es jemand hineingelegt. Was keine
         Information nennt, liegt offen und fällt nur über die Liste der
         Felder weg, die nie an einen Spieler gehen. Andersherum wäre jede
         Freigabe wirkungslos, sobald sie am falschen Feld hängt, und
         niemand fände den Grund. */
      if(g.open&&nurSL(f))return;
      erlaubt[f]=1;
    });
  });
  return refs.filter(function(f){ return erlaubt[f]; });
}
/* Ein Verweis auf ein Feld, das nie an einen Spieler geht. `Typ.feld#id`
   zählt wie sein Feld — ein Eintrag ist nicht offener als das, worin er
   steht. */
function nurSL(ref){
  var ohne=String(ref).split("#")[0];
  return gmFields().indexOf(ohne)>=0;
}
/* Der Schalter in der Kopfzeile: als wen sehe ich das gerade an? */
function renderAsSelect(){
  var host=document.getElementById("asbox");
  if(!host)return;
  if(!me.gm){ host.style.display="none"; return; }
  host.style.display="";
  var spieler=[];
  /* Wer sich ansehen lässt: jede Spielerfigur, und jede Figur oder Gruppe,
     die ein Konto führt. Das stand einmal an einer `Access`-Karte. */
  var gefuehrt={};
  MEMBERS.forEach(function(m){ (m.actors||[]).forEach(function(a){ gefuehrt[a]=1; }); });
  ENT.forEach(function(e){
    if(!ifaceInList(["Creature","Party"],(e.interfaces||[])[0]))return;
    if(!gefuehrt[e.id]&&((e.interfaces||[])[0])!=="PlayerCharacter")return;
    spieler.push(e);
  });
  spieler.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
  var sig=spieler.map(function(e){return e.id;}).join("|");
  if(host.getAttribute("data-sig")!==sig){
    host.textContent="";
    var sel=el("select",{class:"vw",id:"asview","aria-label":"Viewing as"});
    sel.appendChild(el("option",{value:""},"As GM"));
    spieler.forEach(function(e){ sel.appendChild(el("option",{value:e.id},"As "+nameOf(e))); });
    sel.addEventListener("change",function(){ UI.asActor=sel.value; UI.err=""; render(); });
    host.appendChild(sel);
    host.setAttribute("data-sig",sig);
  }
  var s2=document.getElementById("asview");
  if(s2) s2.value=UI.asActor||"";
  document.body.classList.toggle("asplayer",!!UI.asActor);
}

/* ---------- Wissen (A6) ----------
   Die Einheit zwischen Feld und Empfänger heisst Information und ist ein
   eigener Artikel. Nur ein Peg trägt Kanten — und „wer weiss vom wahren
   Namen des Barons?" soll ein Rückbezug sein wie jeder andere, kein Griff
   in ein Feldattribut, das ohnehin nur einen Empfänger fassen könnte.

     Artikel     --knowledge--> Information   (owned)
     Knowledge   --includes--> Information               (ein Bündel)
     Information | Knowledge --knownBy--> Creature | Party | Faction

   Ein Feld, das keine Information nennt, liegt offen. Die Umkehrung wäre
   sicherer, macht aber jede neue Zeile unsichtbar, bis jemand daran denkt.
   Deshalb steht „Offen" als eigene Gruppe zuoberst: man sieht dort immer,
   was gerade offen liegt. */
var INFO_IFACE="Information", INFO_COMP="Information", BUNDLE_IFACE="Knowledge",
    REL_KNOW="knowledge", REL_KNOWNBY="knownBy", REL_INCLUDES="includes",
    REL_PARTY="memberOfParty";

function edgesOf(e,typ){
  return ((e&&e.relations)||[]).filter(function(r){return r.type===typ;});
}
function infosOf(e){
  var out=[];
  edgesOf(e,REL_KNOW).forEach(function(r){ var i=ENT.get(r.to); if(i) out.push(i); });
  return out;
}
function infoList(info,key){
  var raw=((info.components||{})[INFO_COMP]||{})[key];
  return Array.isArray(raw)?raw.map(String):[];
}
function infoTier(info){
  return ((info.components||{})[INFO_COMP]||{}).tier||"secret";
}
/* Dieselbe Regel wie bei den Ansichten, eine Stufe tiefer: „Type" nimmt
   alle Felder dieser Art, „Type.feld" das ganze Feld mit allen Einträgen,
   „Type.feld#id" genau einen Eintrag. Die dritte Form war einmal der
   Blockanker — ein Geheimnis von dreien freizugeben heisst, genau dieses
   freizugeben, und dafür braucht es einen Namen, der ein Umsortieren
   überlebt. */
function infoCovers(info,ref){
  var f=infoList(info,"fields");
  if(f.indexOf(ref)>=0)return true;
  var ohne=String(ref).split("#")[0];
  return f.indexOf(ohne)>=0||f.indexOf(ohne.split(".")[0])>=0;
}
/* Wer zählt für diesen Betrachter als „ich": er selbst, seine Gruppen und
   seine Wissensstände. Einen Schritt weit — ein Stand, der einem anderen
   angehört, wäre eine Hierarchie, und die hat niemand verlangt. */
function knowledgeHolders(viewerId){
  var holders={}; holders[viewerId]=true;
  var v=ENT.get(viewerId); if(!v)return holders;
  edgesOf(v,REL_PARTY).forEach(function(r){ holders[r.to]=true; });
  /* Die Fraktion zählt auch einen Schritt weit (A7, REQ-203): eine
     Fraktion weiss nichts, ihre Mitglieder wissen. Den Rang prüft
     `knowsInfo` an der Zuteilung. */
  edgesOf(v,"memberOf").forEach(function(r){ holders[r.to]=true; });
  return holders;
}
/* Die Rangleiter einer Fraktion, der niedrigste zuerst. */
function factionRanks(f){
  var raw=(((f||{}).components||{}).Faction||{}).ranks;
  return Array.isArray(raw)?raw.map(String):[];
}
/* Auf welcher Sprosse der Betrachter steht: -1 Mitglied ohne Rang, null
   kein Mitglied. Ein Rang, der nicht in der Leiter steht, zählt wie keiner. */
function rankIndex(viewerId,factionId){
  var leiter=factionRanks(ENT.get(factionId)), best=null;
  edgesOf(ENT.get(viewerId),"memberOf").forEach(function(r){
    if(r.to!==factionId)return;
    var rang=(r.props||{}).rank, idx=rang?leiter.indexOf(String(rang)):-1;
    if(best===null||idx>best) best=idx;
  });
  return best;
}
/* Die Bündel, die diese Information nennen — ein Rückbezug, weil
   `includes` nur vorwärts gespeichert wird. */
function bundlesWith(infoId){
  var out=[];
  ENT.forEach(function(e){
    if(edgesOf(e,REL_INCLUDES).some(function(r){ return r.to===infoId; })) out.push(e);
  });
  return out;
}
/** Die Informationen in einem Bündel, in der Reihenfolge seiner Kanten. */
function informationsIn(b){
  var out=[];
  edgesOf(b,REL_INCLUDES).forEach(function(r){ var i=ENT.get(r.to); if(i) out.push(i); });
  return out;
}
/**
 * Kennt dieser Betrachter die Information?
 *
 * Gefragt wird zweimal: hat er sie **selbst** bekommen, oder ein **Bündel**,
 * in dem sie steckt. Ein Bündel ist ein Artikel wie sie und trägt dieselbe
 * `knownBy`-Kante — wer „was ein Kanalgänger weiss" kennt, kennt alles
 * darin, ohne dass jemand die Zuteilungen einzeln nachzieht.
 *
 * Ein Bündel in einem Bündel zählt nicht: ein Schritt weit, dieselbe Regel
 * wie bei den Haltern. Eine Hierarchie von Wissen wäre die Stelle, an der
 * eine Freigabe weiter reicht, als jemand gemeint hat.
 */
function knowsInfo(info,viewerId){
  if(!viewerId)return true;               /* ohne Betrachter: die Spielleitung */
  var holders=knowledgeHolders(viewerId);
  /* Eine Zuteilung an eine Fraktion darf einen Mindestrang nennen (A7). */
  var erreicht=function(r){
    if(!holders[r.to])return false;
    var verlangt=(r.props||{}).rank; if(!verlangt)return true;
    var leiter=factionRanks(ENT.get(r.to)); if(!leiter.length)return true;
    var noetig=leiter.indexOf(String(verlangt)); if(noetig<0)return false;
    var hat=rankIndex(viewerId,r.to);
    return hat!==null&&hat>=noetig;
  };
  var direkt=function(e){ return edgesOf(e,REL_KNOWNBY).some(erreicht); };
  if(direkt(info))return true;
  return bundlesWith(info.id).some(direkt);
}
/* Der Artikel, nach Informationen geordnet. Die offene Restgruppe steht
   vorn und trägt keine Information — sie ist, was übrig bleibt. */
function knowledgeGroups(e,refs,viewerId){
  var claimedF={};
  var groups=infosOf(e).map(function(info){
    var fields=refs.filter(function(r){ return infoCovers(info,r); });
    fields.forEach(function(f){claimedF[f]=true;});
    return {info:info,label:nameOf(info),fields:fields,open:false,
            known:knowsInfo(info,viewerId)};
  });
  return [{info:null,label:"Open",open:true,known:true,
           fields:refs.filter(function(f){return !claimedF[f];})}].concat(groups);
}

function elKnowledge(e,ifn,item){
  /* Wo nichts gehütet wird, steht auch keine Gruppierung. Eine leere
     „offene Gruppe" auf jedem Artikel wäre Lärm — und sie sähe aus, als
     wäre Wissen eingerichtet, wo keines ist. */
  if(!infosOf(e).length)return null;
  var cells=fieldPlan(e,ifn,item.fields||"all",item.except);
  var zurueck=cells.withheld||0;
  var byRef={}; cells.forEach(function(c){ byRef[c.ref]=c; });
  /* Prosa steht hier neben den Feldern und nicht in einer zweiten Liste:
     seit ein Textstück ein Feldeintrag ist, gibt es keinen zweiten Verweis
     mehr, den eine Information nennen könnte. */
  var stuecke={}; var proseRefs=[];
  allProse(e).forEach(function(x){ stuecke[x.ref]=x; proseRefs.push(x.ref); });
  var alle=cells.map(function(c){return c.ref;}).concat(proseRefs);
  var wrap=el("div",{class:"knowledge"});
  knowledgeGroups(e,alle).forEach(function(g){
    var box=el("div",{class:"kgrp"+(g.open?" open":"")});
    var head=el("div",{class:"kh"});
    head.appendChild(el("b",{text:g.label}));
    if(g.info) head.appendChild(el("span",{class:"pill q",text:infoTier(g.info)}));
    if(g.info){
      var who=el("span",{class:"who"});
      var recips=edgesOf(g.info,REL_KNOWNBY);
      if(!recips.length) who.appendChild(document.createTextNode("nobody yet"));
      recips.forEach(function(r,i){
        var t=ENT.get(r.to);
        if(i) who.appendChild(document.createTextNode(", "));
        if(t) who.appendChild(el("button",{class:"ref",type:"button",
          onclick:function(){go({k:"art",id:t.id});}},nameOf(t)));
        else who.appendChild(el("span",{class:"gone",text:"missing"}));
      });
      head.appendChild(who);
    }
    if(canWrite()) head.appendChild(el("button",{class:"btn gh sm",type:"button",
      title:g.open?"Turn the open fields into an Information":"Edit this Information",
      onclick:function(){ UI.pane="aside"; UI.aside="know";
        UI.info=g.info?g.info.id:""; if(!g.info) newInformation(e); else render(); }},
      g.open?"+ Information":"Edit"));
    box.appendChild(head);

    if(!g.fields.length){
      box.appendChild(el("div",{class:"nothing",text:"Nothing assigned."}));
    } else {
      var felder=g.fields.filter(function(r){ return byRef[r]; });
      if(felder.length){
        var dl=el("dl",{class:"fields"});
        felder.forEach(function(ref){ var c=byRef[ref];
          dl.appendChild(fieldCell(e,c.cn,c.p,c.pd,c.val,c.txt,c.titel)); });
        box.appendChild(dl);
      }
      g.fields.forEach(function(ref){ var x=stuecke[ref]; if(!x)return;
        var blk=el("div",{class:"blk "+x.key});
        if(x.key!=="paragraph") blk.appendChild(el("div",{class:"bl",
          text:proseTitle(x)}));
        blk.appendChild(para(fillVars(x.value,null,e)));
        box.appendChild(blk);
      });
    }
    wrap.appendChild(box);
  });
  if(zurueck) wrap.appendChild(el("div",{class:"kgrp withheldgrp"},[
    el("div",{class:"kh"},[el("b",{text:"Not yours yet"})]),
    el("div",{class:"nothing",text:"…and "+zurueck+" thing"+(zurueck===1?"":"s")+
      " about this that you have not learned"})]));
  return wrap;
}

/* Eine Information anlegen. Sie ist ein Artikel wie jeder andere — deshalb
   geht sie durch dieselben Schritte — und hängt danach über `knowledge` am
   Artikel, von dem sie handelt. */
function newInformation(e){
  dialog("New information",function(host,close){
    var nm=el("input",{class:"i",type:"text",placeholder:"e.g. His real name"});
    var tier=el("select",{class:"i"});
    ["secret","rumour","open"].forEach(function(t){ tier.appendChild(el("option",{value:t},t)); });
    host.appendChild(field("Label",nm));
    host.appendChild(field("Guardedness",tier));
    host.appendChild(el("p",{class:"hint",
      text:"A bundle of fields and passages of this article, handed out as a whole. Assign its fields and its recipients in the side panel."}));
    actions(host,close,function(){
      var name=nm.value.trim(); if(!name){nm.focus();return false;}
      if(!REG.interfaces[INFO_IFACE]){ alert("The interface “"+INFO_IFACE+"” is missing from the registry."); return; }
      var info={ id:uid("i"), interfaces:[INFO_IFACE], name:name,
        components:{ Identity:{name:name,id:nextId(INFO_IFACE),aliases:[]} },
        adhoc:[], relations:[], createdAt:new Date().toISOString() };
      reqFor(INFO_IFACE).forEach(function(c){ if(!info.components[c]&&REG.interfaces[c]) info.components[c]={}; });
      applyDefaults(info,INFO_IFACE);
      info.components[INFO_COMP]=Object.assign({fields:[]},info.components[INFO_COMP]||{},{tier:tier.value});
      ENT.set(info.id,info); persist(info);
      e.relations=e.relations||[];
      e.relations.push({id:uid("r"),type:REL_KNOW,to:info.id,props:{}});
      UI.aside="know"; UI.info=info.id;
      persist(e);
    },"Create");
  });
}

/* Das Seitenpanel: welche Felder zu welcher Information gehören, und wer sie
   kennt. Beides sind Schreibvorgänge am Bündel, nicht am Artikel — der
   Artikel selbst bleibt unverändert, wenn jemand etwas erfährt. */
function renderKnowPanel(a,e){
  var ifn=(e.interfaces||[])[0]||"";
  var cells=fieldPlan(e,ifn,"all");
  var infos=infosOf(e);

  var head=el("h3",{text:"Knowledge"});
  if(canWrite()) head.appendChild(el("button",{class:"btn gh sm",type:"button",
    title:"New information",onclick:function(){newInformation(e);}},"+"));
  a.appendChild(head);

  if(!infos.length){
    a.appendChild(el("p",{class:"hint",text:"Everything about this article is open. An information bundles some of its fields and passages so they can be handed to a character, a party or a knowledge level — and stays hidden from everyone else."}));
    return;
  }

  var sel=el("select",{class:"i"});
  infos.forEach(function(i){ sel.appendChild(el("option",{value:i.id},nameOf(i))); });
  if(!UI.info||!infos.some(function(i){return i.id===UI.info;})) UI.info=infos[0].id;
  sel.value=UI.info;
  sel.addEventListener("change",function(){ UI.info=sel.value; render(); });
  a.appendChild(field("Information",sel));

  var info=ENT.get(UI.info); if(!info)return;
  var card=info.components[INFO_COMP]=info.components[INFO_COMP]||{};

  var tier=el("select",{class:"i"});
  ["secret","rumour","open"].forEach(function(t){ tier.appendChild(el("option",{value:t},t)); });
  tier.value=infoTier(info);
  tier.addEventListener("change",function(){ card.tier=tier.value; persist(info); });
  a.appendChild(field("Guardedness",tier));

  /* Felder. Ein Feld darf in mehreren Bündeln stehen; die Anzeige ordnet es
     dem ersten zu, das es nennt — das steht hier dran, statt es zu verbieten. */
  a.appendChild(el("h3",{text:"Fields"}));
  var picks=el("div",{class:"kpick"});
  cells.forEach(function(c){
    var mine=infoCovers(info,c.ref);
    var taken=!mine&&infos.some(function(o){ return o.id!==info.id&&infoCovers(o,c.ref); });
    var cb=el("input",{type:"checkbox"}); cb.checked=mine; cb.disabled=!canWrite();
    cb.addEventListener("change",function(){
      var f=infoList(info,"fields").filter(function(x){ return x!==c.ref&&x!==c.cn; });
      if(cb.checked) f.push(c.ref);
      card.fields=f; persist(info);
    });
    var lab=el("label",{class:taken?"taken":null},[cb,el("span",{text:c.label})]);
    if(taken) lab.title="Already in another information";
    picks.appendChild(lab);
  });
  if(!cells.length) picks.appendChild(el("span",{class:"hint",text:"This article carries no fields yet."}));
  a.appendChild(picks);

  /* Einzelne Textstellen. Sie stehen in derselben Liste `fields` wie alles
     andere — ein Eintrag heisst `Typ.feld#id`, und das ist der Anker, an
     dem die Freigabe hängt, wenn jemand die Reihenfolge ändert. */
  var prosa=allProse(e);
  if(prosa.length){
    a.appendChild(el("h3",{text:"Passages"}));
    var bp=el("div",{class:"kpick"});
    prosa.forEach(function(x){
      var mine=infoList(info,"fields").indexOf(x.ref)>=0;
      var cb=el("input",{type:"checkbox"}); cb.checked=mine; cb.disabled=!canWrite();
      cb.addEventListener("change",function(){
        var l=infoList(info,"fields").filter(function(y){return y!==x.ref;});
        if(cb.checked) l.push(x.ref);
        card.fields=l; persist(info);
      });
      bp.appendChild(el("label",null,[cb,
        el("span",{text:proseTitle(x)+": "+String(x.value||"").slice(0,42)})]));
    });
    a.appendChild(bp);
  }

  /* Empfänger. Die Kante hängt an der Information, nicht am Empfänger —
     sonst müsste jede Figur eine Liste pflegen, und Entziehen hiesse, sie
     dort wiederzufinden. */
  a.appendChild(el("h3",{text:"Known by"}));
  var recips=edgesOf(info,REL_KNOWNBY);
  if(!recips.length) a.appendChild(el("p",{class:"hint",text:"Nobody yet — the fields above stay with the GM."}));
  else{
    var box=el("div",{class:"rel"});
    recips.forEach(function(r){
      var t=ENT.get(r.to);
      var row=el("div",{class:"relrow"});
      row.appendChild(el("span",{class:"rl",text:t?ifaceName(t):"gone"}));
      var rv=el("span",{class:"rv"});
      if(t) rv.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:t.id});}},nameOf(t)));
      else rv.appendChild(el("span",{class:"gone",text:"missing"}));
      /* An eine Fraktion mit Rängen: ab welcher Sprosse (A7). Ohne Wahl
         weiss es jedes Mitglied. */
      var leiter=t?factionRanks(t):[];
      if(leiter.length){
        var rs=el("select",{class:"bsel",title:"Known from this rank upward"});
        rs.appendChild(el("option",{value:""},"every member"));
        leiter.forEach(function(k){ rs.appendChild(el("option",{value:k},"from "+k)); });
        rs.value=(r.props||{}).rank||"";
        if(!canWrite()) rs.disabled=true;
        rs.addEventListener("change",function(){
          r.props=Object.assign({},r.props||{},{rank:rs.value||undefined});
          persist(info);
        });
        rv.appendChild(rs);
      }
      if(canWrite()) rv.appendChild(el("button",{class:"btn gh sm",type:"button",onclick:function(){
        info.relations=(info.relations||[]).filter(function(x){return x.id!==r.id;});
        persist(info); }},"×"));
      row.appendChild(rv); box.appendChild(row);
    });
    a.appendChild(box);
  }

  if(canWrite()){
    var to=relDef(REL_KNOWNBY).to||["*"];
    var add=el("select",{class:"i"});
    add.appendChild(el("option",{value:""},"— assign to …"));
    byName().forEach(function(c){
      if(!ifaceInList(to,(c.interfaces||[])[0]))return;
      if(recips.some(function(r){return r.to===c.id;}))return;
      add.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
    });
    add.addEventListener("change",function(){
      if(!add.value)return;
      info.relations=info.relations||[];
      info.relations.push({id:uid("r"),type:REL_KNOWNBY,to:add.value,props:{}});
      persist(info);
    });
    a.appendChild(add);
    if(add.childNodes.length===1) a.appendChild(el("p",{class:"hint",
      text:"No character, party or knowledge level exists yet to hand this to."}));

    a.appendChild(el("button",{class:"btn sm dngr gh",type:"button",style:"margin-top:10px",
      onclick:function(){ confirmDialog("Delete the information “"+nameOf(info)+"”? The fields become open again.",function(){
        e.relations=(e.relations||[]).filter(function(x){return !(x.type===REL_KNOW&&x.to===info.id);});
        UI.info="";
        drop(info.id); persist(e);
      }); }},"Delete information"));
  }
}

/* ---------- Beziehungen (REQ-030, 081) ----------
   Hier stand einmal ein Ruf-System: Taten als eigene Artikel, ein Gewicht
   je Tat, ein Ausgangswert, eine gerechnete Leiter von −3 bis +3, und die
   Regel, dass eine Tat, von der niemand weiss, nichts ändert.

   Es war richtig gebaut und trotzdem zu viel. Am Tisch fragt niemand nach
   einer Zahl; man fragt „was hält das Auge von euch?", und die Antwort ist
   ein Satz. Geblieben ist deshalb **eine Kante mit Marken**: die Gedanken,
   die der eine über den anderen hat.

   Die Marken sind Worte und keine Aufzählung im Register. Was jemand vom
   anderen hält, ist Kampagneninhalt — eine feste Liste hätte entweder
   zwanzig Einträge oder die falschen drei.

   Zwei Dinge bleiben, weil sie nichts kosten: die Kante steht **beim
   Urteilenden** („das Auge hält von euch nichts" ist eine Aussage über das
   Auge), und die **Gegenrichtung ist eine eigene Kante**, die etwas ganz
   anderes sagen darf. Genau da wird es interessant (REQ-081): einer traut,
   der andere nicht.

   Was mit den Taten wegfiel, ist eine Registerzeile und ein Dialog — wenn
   es fehlt, kommt es zurück. */
var REL_REGARDS="regards";

/* Die Kante von diesem Artikel auf jenen, falls es eine gibt. Höchstens
   eine je Paar: zwei Meinungen desselben über denselben wären zwei
   Wahrheiten. */
function regardsEdge(e,zuId){
  return (e.relations||[]).filter(function(r){
    return r.type===REL_REGARDS&&r.to===zuId; })[0]||null;
}
function regardTags(r){
  var t=(r&&(r.props||{}).tags)||[];
  return Array.isArray(t)?t.filter(function(x){ return String(x||"").trim(); }):[];
}
/* Mit wem dieser Artikel überhaupt etwas zu tun hat — hin wie zurück.
   Gespeichert wird nur vorwärts, also wird die Gegenrichtung gesucht. */
function regardPartners(e){
  var m={};
  (e.relations||[]).forEach(function(r){ if(r.type===REL_REGARDS) m[r.to]=true; });
  ENT.forEach(function(o){
    if(o.id===e.id)return;
    (o.relations||[]).forEach(function(r){
      if(r.type===REL_REGARDS&&r.to===e.id) m[o.id]=true;
    });
  });
  delete m[e.id];
  return Object.keys(m).filter(function(id){
    var o=ENT.get(id); return o&&articleVisible(o);
  });
}

/* Die Marken einer Beziehung. Jede ist ein Knopf, der sie wegnimmt —
   eine Marke, die man nur über einen Dialog loswird, bleibt stehen. */
function regardTagList(e,zuId,r){
  var box=el("span",{class:"rtags"});
  regardTags(r).forEach(function(t){
    if(canWrite()){
      box.appendChild(el("button",{class:"pill tag x",type:"button",
        title:"Remove this thought",
        onclick:function(){ setRegard(e,zuId,regardTags(r).filter(function(x){return x!==t;}),null); }},t));
    } else {
      box.appendChild(el("span",{class:"pill tag",text:t}));
    }
  });
  if(canWrite()) box.appendChild(el("button",{class:"btn sm gh",type:"button",
    title:"Add a thought",
    onclick:function(){
      prompt1("What does “"+nameOf(e)+"” think of them?","",function(v){
        if(!v)return;
        var alt=regardTags(r);
        /* Zweimal dieselbe Marke sagt nichts zweimal. */
        if(alt.indexOf(v)>=0)return;
        setRegard(e,zuId,alt.concat([v]),null);
      },"Add");
    }},"+"));
  return box;
}
/* Schreiben. `tags` null heisst „lass sie", `note` null ebenso — sonst
   löschte jedes Ändern der einen Seite die andere. Eine Kante ohne Marken
   und ohne Zeile ist keine Beziehung und geht weg. */
function setRegard(e,zuId,tags,note){
  var r=regardsEdge(e,zuId);
  var t=tags==null?regardTags(r):tags;
  var n=note==null?((r&&(r.props||{}).note)||""):note;
  e.relations=(e.relations||[]).filter(function(x){
    return !(x.type===REL_REGARDS&&x.to===zuId); });
  if(t.length||n) e.relations.push({id:(r&&r.id)||uid("r"),type:REL_REGARDS,to:zuId,
    props:{tags:t,note:n||undefined}});
  persist(e);
}

function elStanding(e,ifn,item){
  var partner=regardPartners(e);
  /* Wo niemand eine Meinung hat, steht nichts. Nur so darf das Element im
     gewöhnlichen Layout stehen, statt hinter einem Dropdown für genau eine
     Artikelart. */
  if(!partner.length&&!canWrite())return null;
  var wrap=el("div",{class:"standbox"});

  if(!partner.length) wrap.appendChild(el("p",{class:"hint",
    text:"Nobody has an opinion here yet."}));

  partner.forEach(function(id){
    var o=ENT.get(id);
    var hin=regardsEdge(e,id);                  /* was e von o hält */
    var her=o?regardsEdge(o,e.id):null;         /* und was o zurückhält */
    var row=el("div",{class:"strow"});

    var kopf=el("div",{class:"ck"});
    kopf.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:id});}},nameOf(o)));
    kopf.appendChild(regardTagList(e,id,hin));
    row.appendChild(kopf);

    var zeile=(hin&&(hin.props||{}).note)||"";
    if(zeile||canWrite()){
      var p=el("p",{class:"hint rnote",style:"margin:2px 0"});
      if(canWrite()){
        p.appendChild(el("button",{class:"btn sm gh",type:"button",
          title:"Why they think so",
          onclick:function(){
            prompt1("Why — one line",zeile,function(v){ setRegard(e,id,null,v); });
          }},zeile||"why…"));
      } else p.appendChild(el("span",{text:zeile}));
      row.appendChild(p);
    }

    /* Die Gegenrichtung als eigene Zeile, weil sie eine eigene Kante ist.
       Bearbeitet wird sie dort, wo sie steht — wer sie hier änderte,
