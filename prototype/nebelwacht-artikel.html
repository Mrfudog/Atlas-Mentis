  if(UI.err) v.appendChild(el("div",{class:"banner",text:UI.err}));
  if(!ready){ v.appendChild(el("div",{class:"empty",text:"Loading…"})); return; }
  writeCtx=null;
  if(UI.route.k==="art"){ renderArticle(v,UI.route.id); return; }
  /* Register und Graph gehören der Spielleitung. Ein Spieler, der die
     Adresse errät, bekommt dieselbe Antwort wie ein Spieler, der sie nicht
     errät. */
  if((UI.route.k==="reg"||UI.route.k==="graph"||UI.route.k==="types")&&!isGM()){
    v.appendChild(el("div",{class:"empty",text:"Not for you."})); return;
  }
  if(UI.route.k==="reg"){ renderRegistry(v); return; }
  if(UI.route.k==="graph"){ renderGraph(v); return; }
  if(UI.route.k==="rules"){ renderRules(v); return; }
  if(UI.route.k==="tags"){ renderTags(v); return; }
  if(UI.route.k==="play"){ renderPlay(v); return; }
  /* `types` ist keine eigene Seite mehr, sondern der erste Reiter des
     Datenmodells. Die Route bleibt als Abkürzung: sie wählt den Reiter und
     zeigt dieselbe Seite. */
  if(UI.route.k==="types"){ UI.regtab="types"; renderRegistry(v); return; }
  renderList(v);
}

function matches(e){
  if(!articleVisible(e))return false;
  /* Instanzen stehen an ihrer Kreatur und sonst nirgends: dreissig Wachen
     wären sonst dreissig „Wache"-Statblocks im Regelwerk. */
  if(isInstance(e))return false;
  if(UI.offen && !checkArticle(e).length) return false;
  if(UI.iface){
    /* Ein Obertyp meint seine Subtypen mit. Exakt zu vergleichen hiesse:
       „Item" zeigt nichts, obwohl jede Waffe eins ist. */
    var erlaubt=ifaceAndKinds(UI.iface);
    if(!(e.interfaces||[]).some(function(n){ return erlaubt.indexOf(n)>=0; })) return false;
  }
  /* Der Bereich. Er fragt dieselbe Registerzeile wie die Seitenleiste —
     eine zweite Zuordnung hier wäre die Stelle, an der ein Artikel in der
     Leiste steht und in der Liste fehlt. */
  if(UI.area && areaOf((e.interfaces||[])[0])!==UI.area) return false;
  if(UI.tag && tagsOf(e).indexOf(UI.tag)<0) return false;
  if(UI.status && (((e.components||{}).Status||{}).status)!==UI.status) return false;
  if(UI.q){
    /* Prosa steht jetzt in den Karten und ist damit schon im Stringify —
       eine zweite Zeile dafür fände dieselben Wörter zweimal. */
    var hay=(nameOf(e)+" "+tagsOf(e).join(" ")+" "+
      JSON.stringify(e.components||{})).toLowerCase();
    if(hay.indexOf(UI.q.toLowerCase())<0) return false;
  }
  return true;
}
function summary(e){
  var d=e.components&&e.components.Description&&e.components.Description.description;
  if(d)return d;
  var geheim=gmFields();
  var p=allProse(e).filter(function(x){ return geheim.indexOf(x.type+"."+x.key)<0; })[0];
  return p?p.value:"";
}

/* ---------- Marken ----------
   Eine eigene Ansicht und keine Wolke in der Leiste: hier steht, wie oft
   eine Marke vergeben ist und an welchen Artikelarten sie hängt. Genau das
   ist die Frage, die man an eine Marke hat — „gibt es sie" beantwortet
   schon die Eingabe mit ihrer Vervollständigung.

   Die Marken selbst stehen nirgends im Register: welche es gibt, sagen die
   Artikel. Eine Aufzählung im Register hiesse, dass eine neue Marke eine
   Registeränderung braucht, und gemarkt wird während der Sitzung. */
function renderTags(v){
  var zahl={},arten={};
  ENT.forEach(function(e){
    if(!articleVisible(e))return;
    var art=(e.interfaces||[])[0]||"";
    tagsOf(e).forEach(function(t){
      zahl[t]=(zahl[t]||0)+1;
      (arten[t]=arten[t]||{})[art]=1;
    });
  });
  var keys=Object.keys(zahl).sort(function(a,b){
    return zahl[b]-zahl[a] || a.localeCompare(b,"de");
  });

  var head=el("div",{class:"listhead"});
  head.appendChild(el("h2",{text:"Tags"}));
  head.appendChild(el("span",{class:"count",text:keys.length+" tags"}));
  v.appendChild(head);
  v.appendChild(el("p",{class:"hint",
    text:"A tag is a field like any other: the type `Tags` brings it, and a kind that does not inherit it carries none. Which tags exist is said by the articles, not by the registry."}));
  if(!keys.length){ v.appendChild(el("div",{class:"empty",text:"No tag has been given yet."})); return; }

  var box=el("div",{class:"tagtab"});
  keys.forEach(function(t){
    var row=el("button",{class:"row tagrow",type:"button",
      onclick:function(){ UI.tag=t; UI.iface=""; UI.area=""; go({k:"list"}); }});
    row.appendChild(el("span",{class:"tag",text:t}));
    row.appendChild(el("span",{class:"count",text:String(zahl[t])}));
    var wo=el("span",{class:"tagkinds"});
    Object.keys(arten[t]).sort().forEach(function(a){
      wo.appendChild(el("span",{class:"pill q",
        text:(REG.interfaces[a]&&REG.interfaces[a].label)||a||"—"})); });
    row.appendChild(wo);
    box.appendChild(row);
  });
  v.appendChild(box);
}

function renderList(v){
  var list=byName().filter(matches);
  var head=el("div",{class:"listhead"});
  var areaLabel="";
  AREAS.forEach(function(x){ if(x[0]===UI.area) areaLabel="All "+x[1].toLowerCase(); });
  head.appendChild(el("h2",{text:UI.iface
    ?(REG.interfaces[UI.iface]&&REG.interfaces[UI.iface].label||UI.iface)
    :(areaLabel||"All articles")}));
  head.appendChild(el("span",{class:"count",text:list.length+" of "+ENT.size}));
  if(UI.tag) head.appendChild(el("span",{class:"pill",text:"#"+UI.tag}));
  if(canWrite()) head.appendChild(el("button",{class:"btn sm"+(UI.pick?" pri":""),type:"button",
    onclick:function(){ UI.pick=!UI.pick; UI.picked={}; render(); }},
    UI.pick?"Done selecting":"Select"));
  v.appendChild(head);
  v.appendChild(filterBar());

  /* Die Auswahl gilt für das, was gerade in der Liste steht — ausnahmslos,
     also vor dem Ausstieg bei null Treffern. Sonst überlebte eine Auswahl
     eine Suche, die sie versteckt hat, und man handelte an Artikeln, die
     nie auf dem Schirm waren. Der Preis ist, dass eine Suche ohne Treffer
     die Auswahl leert; das ist vorhersehbar, das andere nicht. */
  if(UI.pick){
    var sichtbar={}; list.forEach(function(e){ sichtbar[e.id]=1; });
    Object.keys(UI.picked).forEach(function(id){ if(!sichtbar[id]) delete UI.picked[id]; });
  }

  if(!list.length){ v.appendChild(el("div",{class:"empty",text:"Nothing found."})); return; }

  if(UI.pick) v.appendChild(bulkBar(list));

  /* Eine Zeile ist eine Übersicht: Name, Art, ein Satz. Sie richtete sich
     nach dem Wähler oben rechts, und der ist weg — der Ort weiss, wie viel
     hier hingehört. */
  var vw=viewByKey(VIEW_OVERVIEW);
  var rows=el("div",{class:"rows"});
  list.forEach(function(e){
    var row=el("button",{class:"row"+(UI.pick&&UI.picked[e.id]?" picked":""),type:"button",
      onclick:function(){
        if(UI.pick){ if(UI.picked[e.id]) delete UI.picked[e.id]; else UI.picked[e.id]=1; render(); return; }
        go({k:"art",id:e.id});
      }});
    var t=el("div",{class:"rt"});
    if(UI.pick) t.appendChild(el("span",{class:"tick",text:UI.picked[e.id]?"\u2713":"\u00b7"}));
    t.appendChild(el("span",{class:"rn",text:nameOf(e)}));
    t.appendChild(el("span",{class:"pill",text:ifaceName(e)}));
    var st=e.components&&e.components.Status&&e.components.Status.status;
    if(st) t.appendChild(el("span",{class:"pill q",text:st}));
    tagsOf(e).slice(0,3).forEach(function(tg){ t.appendChild(el("span",{class:"pill q",text:"#"+tg})); });
    var pr=checkArticle(e);
    if(pr.length) t.appendChild(el("span",{class:"warn",title:pr.map(function(x){return x.t;}).join("\n"),
      text:"\u25cf "+pr.length}));
    row.appendChild(t);
    if(vw.image){
      var b=e.components&&e.components.Image&&e.components.Image.url;
      if(b) row.appendChild(el("img",{class:"thumb",src:b,alt:"",loading:"lazy"}));
    }
    if(vw.description!==false&&summary(e))
      row.appendChild(el("div",{class:"rs",text:String(summary(e)).replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g,"$1").slice(0,220)}));
    rows.appendChild(row);
  });
  v.appendChild(rows);
}

/* ---------- article ---------- */
function renderArticle(v,id){
  /* Eine Instanz zeigt sich aufgelöst: mit dem, was sie von ihrer Vorlage
     liest. Geschrieben wird trotzdem nur, was abweicht (`persist`). */
  var e=resolvedOf(ENT.get(id));
  if(!e){ v.appendChild(el("div",{class:"empty",text:"Article not found."})); return; }
  writeCtx=e;
  if(!articleVisible(e)){
    v.appendChild(el("div",{class:"empty",
      text:"Nothing here for you — or not yet."}));
    return;
  }
  var ifn=(e.interfaces||[])[0]||"", d=REG.interfaces[ifn], vw=viewDef();


  var head=el("div",{class:"arthead"});
  var kick=el("div",{class:"kicker"});
  kick.appendChild(el("span",{class:"pill",text:ifaceName(e)}));
  var st=e.components&&e.components.Status&&e.components.Status.status;
  if(st) kick.appendChild(el("span",{class:"pill q",text:st}));
  /* Woher sie liest und wer aus ihr liest — beides vor dem ersten Feld,
     denn es sagt, wen eine Änderung hier trifft. */
  if(e.__template) kick.appendChild(el("button",{class:"pill q instof",type:"button",
    title:"Fields not set here come from the template",
    onclick:function(){ go({k:"art",id:e.__template.id}); }},"instance of "+nameOf(e.__template)));
  var inst=instancesOf(e).length;
  if(inst) kick.appendChild(el("span",{class:"pill q tplof",
    title:"Changing a field here changes it for every instance that has not set it itself",
    text:"template of "+inst}));
  if(canWrite()&&(UI.inline||UI.editField==="__tags")){
    var tgIn=el("input",{class:"i",type:"text",value:tagsOf(e).join(", "),
      placeholder:"comma, separated",style:"max-width:280px"});
    tgIn.addEventListener("change",function(){
      setTags(e,tgIn.value.split(","));
      if(!UI.inline) UI.editField="";
      persist(e);
    });
    tgIn.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"){ ev.preventDefault(); tgIn.blur(); }
      if(ev.key==="Escape"){ UI.editField=""; render(); } });
    kick.appendChild(tgIn);
    if(!UI.inline) setTimeout(function(){ try{ tgIn.focus(); }catch(x){} },0);
  } else {
    tagsOf(e).forEach(function(t){ kick.appendChild(el("button",{class:"tag",type:"button",
      onclick:function(){UI.tag=t;UI.iface="";UI.area="";go({k:"list"});}},"#"+t)); });
    if(canWrite()) kick.appendChild(el("button",{class:"tag",type:"button",title:"Edit tags",
      onclick:function(){ UI.editField="__tags"; render(); }},tagsOf(e).length?"✎":"+ tag"));
  }
  head.appendChild(kick);
  if(canWrite()&&(UI.inline||UI.editField==="__name")){
    var nmIn=el("input",{class:"i",type:"text",value:nameOf(e),style:"font-family:var(--ff-disp);font-size:26px"});
    nmIn.addEventListener("change",function(){
      var neu=nmIn.value.trim(); if(!neu||neu===nameOf(e)){ if(!UI.inline)UI.editField=""; render(); return; }
      e.name=neu; e.components=e.components||{};
      /* Nur das Feld setzen, nicht die ganze Karte: `Identity` trägt auch
         Schlüssel, Aliasse und den Decknamen. */
      e.components.Identity=Object.assign({},e.components.Identity||{},{name:neu});
      if(!UI.inline) UI.editField="";
      persist(e);
    });
    nmIn.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"){ ev.preventDefault(); nmIn.blur(); }
      if(ev.key==="Escape"){ UI.editField=""; render(); } });
    head.appendChild(nmIn);
    if(!UI.inline) setTimeout(function(){ try{ nmIn.focus(); nmIn.select(); }catch(x){} },0);
  } else {
    var h2=el("h2",{text:nameOf(e)});
    if(canWrite()){ h2.className="editable";
      h2.addEventListener("click",function(){ UI.editField="__name"; render(); }); }
    head.appendChild(h2);
  }
  var ik=articleId(e);
  if(ik) head.appendChild(el("div",{class:"key",text:ik}));
  var herkunft=stackChip(e);
  if(herkunft) head.appendChild(herkunft);
  v.appendChild(head);

  var bar=el("div",{class:"rowbtns"});
  if(canWrite()){
    bar.appendChild(el("button",{class:"btn sm"+(UI.inline?" pri":""),type:"button",
      "aria-pressed":String(!!UI.inline),onclick:function(){
        UI.inline=!UI.inline; UI.editField=""; render(); }},
      UI.inline?"Done editing":"Edit all fields"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){addRelation(e);}},"+ Relation"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){addAdhoc(e);}},"+ Custom field"));
    bar.appendChild(el("button",{class:"btn sm dngr gh",type:"button",onclick:function(){
      confirmDialog("Delete “"+nameOf(e)+"” for good?",function(){
        drop(e.id); go({k:"list"}); });}},"Delete"));
  }
  v.appendChild(bar);

  if(foreignEdit===e.id){
    var fw=el("div",{class:"banner"});
    fw.appendChild(document.createTextNode(
      "Someone else changed this article while you had it open. What you see is theirs."));
    fw.appendChild(el("button",{class:"btn sm gh",type:"button",
      onclick:function(){ foreignEdit=""; render(); }},"Got it"));
    v.appendChild(fw);
  }

  /* Was die Validierung beanstanden würde — hier, wo es zu beheben ist. */
  var problems=checkArticle(e);
  if(problems.length){
    var box=el("div",{class:"pruef"});
    box.appendChild(el("div",{class:"pruefkopf",text:problems.length===1?"One open issue":problems.length+" open issues"}));
    var ul=el("ul");
    problems.forEach(function(p){ ul.appendChild(el("li",{text:p.t})); });
    box.appendChild(ul);
    v.appendChild(box);
  }

  /* The body is driven by the view's layout: an ordered list of elements.
     Before, a view was a bag of flags and the order was whatever this
     function happened to do. A layout says what appears and in which
     order, and a type may override it — see layoutOf(). */
  layoutOf(vw,ifn).forEach(function(item){
    var node=renderLayoutItem(item,e,ifn,vw);
    if(node) v.appendChild(node);
  });
}

/* ---------- compendium filters ----------
   Dieselben Regeln, die matches() anwendet, hier sichtbar und abstellbar.
   In der Seitenleiste allein sah man nie, *dass* gefiltert wird — nur, dass
   weniger da war als erwartet. */
function filterBar(){
  var bar=el("div",{class:"filters"});

  /* **Flach und alphabetisch**, wie die Auswahl im Register. Hier stand ein
     Baum mit Einrückung — gebaut aus `extends`, und weil `extends` ein Array
     ist, hing eine Art, die von zweien erbt, unter einer davon und unter der
     anderen nicht. Wer sie dort suchte, hielt sie für nicht filterbar. */
  var typ=el("select",{class:"i"});
  typ.appendChild(el("option",{value:""},"any type"));
  typeList().forEach(function(n){
    var d=REG.interfaces[n];
    typ.appendChild(el("option",{value:n},
      (d.label||n)+(d.abstract?" (and below)":"")));
  });
  typ.value=UI.iface||"";
  typ.addEventListener("change",function(){ UI.iface=typ.value; UI.route={k:"list"}; render(); });
  bar.appendChild(typ);

  var tagNames={};
  ENT.forEach(function(e){ tagsOf(e).forEach(function(t){ tagNames[t]=1; }); });
  var tag=el("select",{class:"i"});
  tag.appendChild(el("option",{value:""},"any tag"));
  Object.keys(tagNames).sort().forEach(function(t){ tag.appendChild(el("option",{value:t},"#"+t)); });
  tag.value=UI.tag||"";
  tag.addEventListener("change",function(){ UI.tag=tag.value; UI.route={k:"list"}; render(); });
  bar.appendChild(tag);

  var stProp=(((REG.interfaces.Status||{}).schema||{}).properties||{}).status;
  var st=el("select",{class:"i"});
  st.appendChild(el("option",{value:""},"any status"));
  (enumWerte(stProp)||["idea","prepared","ready"]).forEach(function(o){
    st.appendChild(el("option",{value:o},o)); });
  st.value=UI.status||"";
  st.addEventListener("change",function(){ UI.status=st.value; UI.route={k:"list"}; render(); });
  bar.appendChild(st);

  bar.appendChild(el("button",{class:"chip pick"+(UI.offen?" on":""),type:"button",
    onclick:function(){ UI.offen=!UI.offen; UI.route={k:"list"}; render(); }},"only open issues"));

  var aktiv=UI.iface||UI.tag||UI.status||UI.offen||UI.q;
  if(aktiv) bar.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
    UI.iface=""; UI.tag=""; UI.status=""; UI.offen=false; UI.q="";
    var q=document.getElementById("q"); if(q)q.value="";
    UI.route={k:"list"}; render();
  }},"Clear filters"));
  return bar;
}

/* ---------- editing many at once ----------
   Everything here writes one article at a time through persist(); there is no
   bulk path in the store and inventing one would skip the same checks a
   single edit goes through. What it saves is the clicking, not the writing. */
function bulkBar(list){
  var ids=Object.keys(UI.picked);
  var bar=el("div",{class:"bulk"});

  var alle=ids.length===list.length&&list.length>0;
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    if(alle) UI.picked={};
    else list.forEach(function(e){ UI.picked[e.id]=1; });
    render();
  }},alle?"Select none":"Select all "+list.length));

  bar.appendChild(el("span",{class:"count",
    text:ids.length?ids.length+(ids.length===1?" selected":" selected"):"none selected"}));

  if(!ids.length){
    bar.appendChild(el("span",{class:"hint",style:"margin:0",
      text:"Click the rows you mean."}));
    return bar;
  }

  var gewaehlt=function(){ return ids.map(function(id){return ENT.get(id);}).filter(Boolean); };
  var durch=function(was,fn){
    var betroffen=gewaehlt();
    betroffen.forEach(fn);
    betroffen.forEach(function(e){ persist(e); });
    UI.picked={};
    UI.err=was+" — "+betroffen.length+(betroffen.length===1?" article":" articles")+".";
    render();
  };

  /* Tags */
  var tagIn=el("input",{class:"i",type:"text",placeholder:"tag, tag",style:"min-width:140px"});
  bar.appendChild(tagIn);
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var xs=tagIn.value.split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(!xs.length)return;
    durch("Tags added",function(e){
      var jetzt=tagsOf(e).slice();
      xs.forEach(function(t){ if(jetzt.indexOf(t)<0) jetzt.push(t); });
      setTags(e,jetzt);
    });
  }},"+ tags"));
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var xs=tagIn.value.split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(!xs.length)return;
    durch("Tags removed",function(e){
      setTags(e,tagsOf(e).filter(function(t){ return xs.indexOf(t)<0; }));
    });
  }},"− tags"));

  /* Stand */
  var stEnum=(((REG.interfaces.Status||{}).schema||{}).properties||{}).status;
  var stSel=el("select",{class:"i",style:"width:auto"});
  stSel.appendChild(el("option",{value:""},"set status…"));
  (enumWerte(stEnum)||["idea","prepared","ready"]).forEach(function(o){
    stSel.appendChild(el("option",{value:o},o)); });
  stSel.addEventListener("change",function(){
    if(!stSel.value)return;
    var val=stSel.value; stSel.value="";
    durch("Status set to “"+val+"”",function(e){
      e.components=e.components||{};
      e.components.Status=Object.assign({},e.components.Status||{},{status:val}); });
  });
  bar.appendChild(stSel);

  /* Schnittstelle wechseln */
  var ifSel=el("select",{class:"i",style:"width:auto"});
  ifSel.appendChild(el("option",{value:""},"change type…"));
  Object.keys(REG.interfaces).sort().forEach(function(n){
    if(REG.interfaces[n].abstract)return;
    ifSel.appendChild(el("option",{value:n},REG.interfaces[n].label||n)); });
  ifSel.addEventListener("change",function(){
    if(!ifSel.value)return;
    var ifn=ifSel.value; ifSel.value="";
    /* Der Typwechsel nimmt nichts weg. Eine Komponente, die der neue Typ
       nicht erlaubt, bleibt am Artikel stehen und wird von der Prüfung
       beanstandet — sichtbar und behebbar, statt still gelöscht. */
    var verliert=0;
    gewaehlt().forEach(function(e){
      Object.keys(e.components||{}).forEach(function(cn){
        if(!compOrigin(ifn,cn)) verliert++;
      });
    });
    var frage="Change "+ids.length+(ids.length===1?" article":" articles")+" to “"+
      (REG.interfaces[ifn].label||ifn)+"”?";
    if(verliert) frage+=" "+verliert+" component value(s) will no longer be allowed there; "+
      "they stay on the articles and validation will flag them.";
    confirmDialog(frage,function(){
      durch("Type changed",function(e){
        e.interfaces=[ifn];
        reqFor(ifn).forEach(function(c){ if(!e.components[c]&&REG.interfaces[c]) e.components[c]={}; });
      });
    },"Change");
  });
  bar.appendChild(ifSel);

  /* Ein Feld auf denselben Wert */
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    bulkFieldDialog(gewaehlt(),durch);
  }},"Set a field…"));

  bar.appendChild(el("button",{class:"btn sm dngr",type:"button",onclick:function(){
    confirmDialog("Delete "+ids.length+(ids.length===1?" article":" articles")+" for good?",function(){
      var weg=gewaehlt();
      weg.forEach(function(e){ drop(e.id); });
      UI.picked={};
      UI.err=weg.length+(weg.length===1?" article deleted.":" articles deleted.");
      render();
    });
  }},"Delete"));

  return bar;
}

var BULK_TABU={"Identity.name":1,"Identity.id":1};
/* Nur Felder anbieten, die alle Gewählten überhaupt führen können — sonst
   stellt man etwas ein, das bei der Hälfte nirgends ankommt. */
function bulkFieldDialog(betroffen,durch){
  var gemeinsam=null;
  betroffen.forEach(function(e){
    var ifn=(e.interfaces||[])[0]||"";
    var hier={};
    compsFor(ifn).forEach(function(cn){
      var props=((REG.interfaces[cn]||{}).schema||{}).properties||{};
      Object.keys(props).forEach(function(k){
        if(props[k].derived)return;
        /* Name und Identitätsschlüssel sind nicht Eigenschaft, sondern
           Identität. Sie auf allen Gewählten gleich zu setzen macht
           Dubletten, die danach kein Verweis mehr auseinanderhält. */
        if(BULK_TABU[cn+"."+k])return;
        hier[cn+"."+k]=1;
      });
    });
    if(gemeinsam===null) gemeinsam=hier;
    else Object.keys(gemeinsam).forEach(function(r){ if(!hier[r]) delete gemeinsam[r]; });
  });
  var refs=Object.keys(gemeinsam||{}).sort();

  dialog("Set one field on "+betroffen.length+(betroffen.length===1?" article":" articles"),
    function(host,close){
    if(!refs.length){
      host.appendChild(el("p",{class:"hint",
        text:"These articles share no editable field. Narrow the selection to one type."}));
      host.appendChild(el("div",{class:"rowbtns"},
        el("button",{class:"btn",type:"button",onclick:close},"Close")));
      return;
    }
    var sel=el("select",{class:"i"});
    refs.forEach(function(r){
      var teil=r.split("."), cd=REG.interfaces[teil[0]]||{};
      var pd=((cd.schema||{}).properties||{})[teil[1]]||{};
      sel.appendChild(el("option",{value:r},(cd.label||teil[0])+" · "+(pd.title||teil[1])));
    });
    host.appendChild(field("Field",sel));
    var halter=el("div");
    host.appendChild(halter);
    function zeigeEingang(){
      halter.textContent="";
      var teil=sel.value.split(".");
      var pd=((REG.interfaces[teil[0]].schema||{}).properties||{})[teil[1]];
      var node=fieldInput(pd,undefined);
      halter.appendChild(field("Value",node));
      halter.__node=node; halter.__pd=pd; halter.__ref=teil;
    }
    sel.addEventListener("change",zeigeEingang);
    zeigeEingang();
    host.appendChild(el("p",{class:"hint",
      text:"An empty value clears the field on every selected article."}));
    actions(host,close,function(){
      var pd=halter.__pd, teil=halter.__ref;
      var val=fieldValue(pd,halter.__node);
      durch("Field “"+(pd.title||teil[1])+"” set",function(e){
        e.components=e.components||{};
        var card=e.components[teil[0]]=e.components[teil[0]]||{};
        if(val===undefined) delete card[teil[1]]; else card[teil[1]]=val;
      });
    },"Set");
  });
}

/* ---------- editing where the value is ----------
   A click on a value turns that one field into an input; the switch in the
   bar turns every field into one at once. The dialog stays for creating an
   article from another one, where there is nothing to click yet.
   Derived fields never become inputs — they have no stored value to write
   back to, and offering one would promise an edit that cannot happen. */
/** Wird dieses Feld immer als Eingabe gezeichnet? **Am Feld und nur dort**
 *  — am Typ traf es zwanzig Felder auf einmal, und die Zustandsliste einer
 *  Figur ist kein Stand. Nie an einem gerechneten oder ausgegebenen. */
function immerOffen(cn,pd){
  return !!(pd&&!pd.derived&&!pd.readOnly&&pd.alwaysEdit);
}

function fieldCell(e,cn,p,pd,val,txt,titel){
  var id=cn+"."+p;
  /* **An einer Instanz sagt jedes Feld, woher es kommt.** Blass: von der
     Vorlage. Mit ↺: hier gesetzt, und ein Klick nimmt es zurück — dann
     gilt wieder, was die Vorlage sagt. */
  var vonVorlage=e.__inherited&&e.__inherited[id];
  var cell=el("div",{class:"fld"+(pd.derived?" drv":"")+(vonVorlage?" inherited":"")});
  if(vonVorlage) cell.title="From "+nameOf(vonVorlage);
  var dt=el("dt",{text:titel||pd.title||p});
  if(e.__template&&!vonVorlage&&!pd.derived&&canWrite()){
    var roh=ENT.get(e.id), eigen=roh&&((roh.components||{})[cn]||{})[p];
    var dort=(((resolvedOf(e.__template).components||{})[cn])||{})[p];
    if(!leerWert(eigen)&&!leerWert(dort)) dt.appendChild(el("button",{class:"btn gh sm reset",type:"button",
      title:"Back to the template ("+fmtVal(pd,dort)+")",
      onclick:function(ev){
        ev.stopPropagation();
        var card=e.components[cn]=Object.assign({},e.components[cn]||{});
        card[p]=tief(dort);
        persist(e);
      }},"\u21ba"));
  }
  cell.appendChild(dt);
  /* Eine ausgegebene Nummer bekommt keine Eingabe: sie steht seit dem
     Anlegen und darf sich nicht ändern — sonst hiesse derselbe Artikel
     morgen anders. Ein gerechneter Wert bekommt aus dem anderen Grund
     keine: ihn zu schreiben ginge ins Leere (D8). */
  var editable=canWrite()&&!pd.derived&&!pd.readOnly;
  /* **Was ein Stand ist, steht immer als Eingabe da.** Die Trefferpunkte
     werden mitten im Zug gesetzt, und erst „Bearbeiten" zu sagen sind drei
     Klicks für eine Zahl. Gesagt wird es am Typ, der das Feld erklärt
     (`alwaysEdit`) — der weiss, ob es ein Stand ist oder eine Festlegung —,
     oder am Feld selbst. */
  var open=editable&&(UI.inline||UI.editField===id||immerOffen(cn,pd));

  if(open){
    var node=fieldInput(pd,val[p],{type:cn,key:p});
    var dd=el("dd",{class:"editing"});
    dd.appendChild(node);
    var schliessen=function(){
      var neu=fieldValue(pd,node);
      var card=e.components[cn]=e.components[cn]||{};
      var alt=card[p];
      if(neu===undefined) delete card[p]; else card[p]=neu;
      var gleich=JSON.stringify(alt===undefined?null:alt)===JSON.stringify(neu===undefined?null:neu);
      if(!UI.inline) UI.editField="";
      if(gleich){ render(); return; }
      persist(e);
    };
    node.addEventListener("change",schliessen);
    if(node.tagName==="INPUT") node.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"){ ev.preventDefault(); node.blur(); }
      if(ev.key==="Escape"){ UI.editField=""; render(); }
    });
    cell.appendChild(dd);
    /* Beim Einzelfeld sofort hineinspringen — sonst muss man zweimal klicken. */
    if(!UI.inline) setTimeout(function(){ try{ node.focus(); }catch(x){} },0);
    return cell;
  }

  var dd2=el(editable?"dd":"dd",{class:editable?"editable":null});
  if(fieldKind(pd)==="color"&&txt){
    dd2.appendChild(el("span",{class:"swatch",style:"background:"+txt}));
    dd2.appendChild(document.createTextNode(" "+txt));
  } else if(fieldKind(pd)==="link"&&txt){
    var target=ENT.get(txt);
    if(target) dd2.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(ev){ ev.stopPropagation(); go({k:"art",id:target.id}); }},nameOf(target)));
    else dd2.appendChild(el("span",{class:"gone",text:"missing"}));
  } else if(fieldKind(pd)==="links"&&Array.isArray(val)&&val.length){
    /* Gelesen wird der **Wert** und nicht der formatierte Text: der trüge
       Ids, und „pc_rook, pc_sela" sagt am Tisch niemandem etwas. */
    val.forEach(function(v,i){
      var ziel=ENT.get(String(v));
      if(i) dd2.appendChild(document.createTextNode(" "));
      if(ziel) dd2.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(ev){ ev.stopPropagation(); go({k:"art",id:ziel.id}); }},nameOf(ziel)));
      else dd2.appendChild(el("span",{class:"gone",text:String(v)}));
    });
  } else dd2.textContent=txt===""?"—":txt;
  if(editable) dd2.addEventListener("click",function(){ UI.editField=id; render(); });
  cell.appendChild(dd2);
  return cell;
}

/* ---------- breadcrumbs ----------
   Jeder Absprung hinterlässt eine Spur. Kommt man auf etwas zurück, das
   schon darin steht, wird die Spur dort abgeschnitten statt verlängert —
   sonst wächst sie beim Hin und Her ins Endlose. */
var TRAIL_MAX=8;
function trailPush(von){
  if(!von||von.k!=="art")return;
  var da=-1;
  UI.trail.forEach(function(t,i){ if(t.id===von.id) da=i; });
  if(da>=0){ UI.trail=UI.trail.slice(0,da+1); return; }
  UI.trail.push({k:"art",id:von.id});
  if(UI.trail.length>TRAIL_MAX) UI.trail=UI.trail.slice(-TRAIL_MAX);
}
/* Woher man kommt, steht **über** der Navigation und nicht im Artikel: es
   sagt, wo man ist, und das gehört zur Navigation. Im Artikel stand es
   unter dem Seitenwechsel und sah aus wie ein Teil des Artikels. */
function renderTrail(){
  var host=document.getElementById("crumbs");
  if(host) host.textContent="";
  if(!UI.trail.length||UI.route.k!=="art")return null;
  var bar=el("nav",{class:"crumbs","aria-label":"Where you came from"});
  UI.trail.forEach(function(t,i){
    var e=ENT.get(t.id);
    if(i) bar.appendChild(el("span",{class:"sep",text:"›"}));
    bar.appendChild(el("button",{class:"ref",type:"button",onclick:function(){
      UI.trail=UI.trail.slice(0,i);
      UI.route={k:"art",id:t.id}; UI.err=""; UI.editField=""; render();
    }},e?nameOf(e):"(gone)"));
  });
  var e0=ENT.get(UI.route.id);
  if(e0){
    bar.appendChild(el("span",{class:"sep",text:"›"}));
    bar.appendChild(el("span",{class:"hier",text:nameOf(e0)}));
  }
  if(host) host.appendChild(bar);
  return bar;
}

/* ---------- Anordnung ----------
   **Eine Ansicht sagt, wie viel; die Artikelart sagt, in welcher Reihenfolge.**
   Die Anordnung steht an der Art (`interfaces[T].views[k]`), und gesucht
   wird die `extends`-Kette hoch: eine Waffe ohne eigene nimmt die von
   `Item`. Sagt keiner etwas, gilt die Grundanordnung der Ansicht. Alte
   Ansichten in Schalterform werden beim Lesen übersetzt, damit nichts
   migriert werden muss, bevor es jemand anfasst. */
var LAYOUT_ELEMENTS=[
  ["heading","Heading"],["text","Paragraph"],["fields","Field table"],
  ["description","Description"],["prose","Passages"],
  ["composed","Composed rules"],["relations","Relations"],["image","Image"],
  ["linked","Linked articles"],
  ["knowledge","Knowledge groups"],["map","Map"],["sheet","Character sheet"],["inventory","Inventory"],["crafting","Crafting"],["board","Board"],["initiative","Initiative"],
  ["quests","Quest board"],["timeline","Timeline"],["live","Live"],["table","Table"],["prep","Prep board"],["crawl","Point-crawl"],["stack","Layer stack"],["members","Members"],["standing","Standing"],
  ["tabs","Tabs"]
];
/* **Die Anordnung wohnt am Typ.** Gesucht wird die `extends`-Kette hoch:
   die Art selbst, dann ihre Bestandteile in der Reihenfolge, in der sie
   dastehen. Damit deckt eine Anordnung an `Creature` auch NSC,
   Spielerfigur, Begleiter und Gefolge ab, ohne dass eine davon sie
   wiederholt. Sagt keiner in der Kette etwas, gilt die Grundanordnung der
   Ansicht.

   Sie stand einmal an der Ansicht (`byInterface`), und das hiess: wer
   wissen wollte, wie eine Art gezeichnet wird, musste drei Ansichten
   aufmachen und in jeder nach ihr suchen. */
function layoutOf(vw,ifn,key){
  return layoutSource(vw,ifn,key).layout;
}
/* Die alte Schalterform in Elemente übersetzen. Sie bleibt lesbar, bis
   jemand die Ansicht anfasst — eine Zwangsmigration bräuchte es nicht. */
function legacyLayout(vw){
  var out=[];
  if(vw.image) out.push({id:"l-img",el:"image"});
  if(vw.description!==false) out.push({id:"l-desc",el:"description"});
  if(vw.fields&&vw.fields!=="none") out.push({id:"l-f",el:"fields",fields:vw.fields,columns:0});
  if(vw.blocks&&(vw.blocks==="all"||vw.blocks.length)) out.push({id:"l-b",el:"prose",fields:vw.blocks});
  if(vw.composed!==false) out.push({id:"l-c",el:"composed"});
  return out;
}
/* ---- Reiter ----
   Ein Charakterbogen ist keine Liste von Abschnitten untereinander: am
   Tisch schaut man auf **einen** davon. Dafür eine Darstellungsstufe je
   Reiter anzulegen wäre der Weg zurück zu einundzwanzig — also enthält ein
   Element benannte Gruppen, und jede Gruppe ist ein gewöhnliches Layout.

   Was **über** den Reitern stehen bleiben soll, steht vor diesem Element im
   selben Layout. Der Vitalstreifen gehört dorthin, weil man ihn braucht,
   ohne umzuschalten — dieselbe Regel wie bei der Initiative am Spieltisch.

   Ein Reiter, der nichts zeichnet, wird nicht angeboten. Ein Knopf, der
   auf eine leere Seite führt, ist am Tisch schlimmer als ein fehlender:
   man drückt ihn zweimal, weil man denkt, es habe nicht geklappt. */
function elTabs(e,ifn,item,vw){
  var gruppen=(item.tabs||[]).map(function(t){
    var teile=(t.layout||[]).map(function(x){ return renderLayoutItem(x,e,ifn,vw); })
      .filter(Boolean);
    return {id:t.id,label:t.label||t.id,teile:teile};
  }).filter(function(g){ return g.teile.length; });
  if(!gruppen.length)return null;

  var wahl=gruppen.filter(function(g){ return g.id===UI.tab; })[0]||gruppen[0];
  var wrap=el("div",{class:"tabbox"});
  var leiste=el("div",{class:"ktabs tabrow",role:"tablist"});
  gruppen.forEach(function(g){
    leiste.appendChild(el("button",{class:"btn sm"+(g.id===wahl.id?" pri":""),
      type:"button",role:"tab","aria-selected":String(g.id===wahl.id),
      onclick:function(){ UI.tab=g.id; render(); }},g.label));
  });
  wrap.appendChild(leiste);
  var inhalt=el("div",{class:"tabpane",role:"tabpanel"});
  wahl.teile.forEach(function(n){ inhalt.appendChild(n); });
  wrap.appendChild(inhalt);
  return wrap;
}

function renderLayoutItem(item,e,ifn,vw){
  switch(item.el){
    case "heading":     return item.text?el("div",{class:"sec",text:fillVars(item.text,null,e)}):null;
    case "text":        return item.text?para(fillVars(item.text,null,e)):null;
    case "image":       return elImage(e);
    case "description": return elDescription(e);
    case "fields":      return elFields(e,ifn,item);
    case "linked":      return elLinked(e,ifn,item);
    case "prose":       return elProse(e,ifn,item);
    case "composed":    return elComposed(e);
    case "relations":   return elRelations(e);
    case "knowledge":   return elKnowledge(e,ifn,item);
    case "map":         return elMap(e,ifn,item);
    case "sheet":       return elSheet(e,ifn,item);
    case "inventory":   return elInventory(e,ifn,item);
    case "crafting":    return elCrafting(e,ifn,item);
    case "board":       return elBoard(e,ifn,item);
    case "initiative":  return elInitiative(e,ifn,item);
    case "quests":      return elQuests(e,ifn,item);
    case "timeline":    return elTimeline(e,ifn,item);
    case "live":        return elLive(e,ifn,item);
    case "table":       return elTable(e,ifn,item);
    case "prep":        return elPrep(e,ifn,item);
    case "crawl":       return elCrawl(e,ifn,item);
    case "stack":       return elStack(e,ifn,item);
    case "members":     return elMembers(e);
    case "standing":    return elStanding(e,ifn,item);
    case "tabs":        return elTabs(e,ifn,item,vw);
    default:            return null;
  }
}

function elImage(e){
  var img=(e.components||{})[IMAGE_COMP];
  if(!img)return null;
  /* `img.image` und nicht `img.ref`: das Feld heisst im Register `image`,
     und `ref` hat es nie gegeben. Solange hier `ref` stand, zeichnete das
     Element nie etwas — und weil ein Artikel ohne Bild genauso aussieht,
     fiel es niemandem auf. */
  var src=assetSrc(img.image||img.url);
  if(!src)return null;
  var fig=el("figure",{class:"pic"});
  fig.appendChild(el("img",{src:src,alt:img.caption||nameOf(e),loading:"lazy"}));
  if(img.caption) fig.appendChild(el("figcaption",{text:img.caption}));
  return fig;
}

function elDescription(e){
  var desc=((e.components||{}).Description||{}).description;
  return desc?para(fillVars(desc,null,e)):null;
}

/* Welche Feldzellen zeigt diese Ansicht — einmal berechnet, damit die
   Feldtabelle und die Wissensgruppen dieselbe Auswahl sehen. Berechnete sie
   jede für sich, könnte die Wissensansicht etwas gruppieren, das die Tabelle
   gar nicht zeigt, und es fiele erst am Tisch auf.
   `want`: "all" oder eine Liste aus "Comp" / "Comp.key". */
/* `ausser` lässt Komponenten weg, die im selben Layout schon ein eigenes
   Element zeichnet — der Bogen zeigt die Kampfwerte, die Feldtabelle den
   Rest. Ohne das müsste jede Artikelart ihre Felder einzeln aufzählen, und
   ein neues Feld stünde dann nirgends, bis es jemand nachträgt. */
function fieldPlan(e,ifn,want,ausser){
  var weg=Array.isArray(ausser)?ausser:[];
  var zeig=function(cn,p){
    if(weg.indexOf(cn)>=0||weg.indexOf(cn+"."+p)>=0)return false;
    if(want==="all")return true;
    if(!Array.isArray(want))return false;
    return want.indexOf(cn)>=0||want.indexOf(cn+"."+p)>=0;
  };
  var cells=[];
  /* Was diese Art **tragen könnte** und dieser Artikel leer lässt. Ein
     leeres Feld anzuzeigen hiesse, jede Seite mit dreissig Strichen zu
     füllen; es wegzulassen hiesse, dass man es nie findet. Also steht es
     nicht da, aber es ist zu haben. */
  var frei=[];
  /* **Beim Bearbeiten steht jedes Feld da.** Der Name ist die Überschrift
     und die Nummer der Schlüssel — die beiden haben ihren Platz. Alles
     andere aus `Identity` (Aliasse, Deckname) stand nirgends, und ein
     Feld, das man nur über die Einfuhr füllen kann, ist keines. `Vars`
     bleibt draussen: die Bindungen haben ihren eigenen Block. */
  var bearbeitet=canWrite()&&UI.inline;
  compsFor(ifn).forEach(function(cn){
    if(cn==="Name"||cn==="Vars")return;
    if(cn==="Identity"&&!bearbeitet)return;
    var cd=REG.interfaces[cn]; if(!cd)return;
    var val=(e.components||{})[cn]||{};
    var props=(cd.schema&&cd.schema.properties)||{};
    /* a derived field with `of` rides in its base field's cell: 16 (+3) */
    var attach={};
    Object.keys(props).forEach(function(p){
      var pd=props[p];
      if(pd.derived&&pd.of&&!zeig(cn,p)) (attach[pd.of]=attach[pd.of]||[]).push(p);
    });
    Object.keys(props).forEach(function(p){
      var pd=props[p];
      if(!zeig(cn,p))return;
      if(pd.derived&&pd.of)return;
      /* Ein Prosafeld gehört `elProse` und nicht der Tabelle. Zweimal
         dasselbe zu zeigen — oben als Zeile, unten als Absatz — war genau
         das, was an den Blöcken störte, und es käme mit ihnen zurück. */
      if(pd.many&&pd.format==="long")return;
      /* Der Name steht als Überschrift und wird dort geändert; zweimal
         dieselbe Eingabe sind zwei Stellen, die auseinanderlaufen. Die
         Nummer steht als Schlüssel unter der Überschrift und ist ohnehin
         ausgegeben — eine Zeile mehr, die niemand anfassen darf. */
      if(cn==="Identity"&&(p==="name"||p==="id"))return;
      var titel=fieldTitle(ifn,cn,p,pd);
      var txt=fmtVal(pd, pd.derived?derivedValue(pd,val):val[p], ifn);
      if(txt===""){
        if(!pd.derived&&!pd.readOnly) frei.push({cn:cn,p:p,pd:pd,ref:cn+"."+p,titel:titel,
          label:(REG.interfaces[cn].label||cn)+" · "+titel});
        /* Ein leeres Feld steht nur da, wenn man gerade alles bearbeitet —
           oder wenn man **dieses** angefordert hat. Ohne den zweiten Fall
           wäre „+ field" ein Knopf, der nichts tut. */
        var gewaehlt=canWrite()&&!pd.derived&&!pd.readOnly&&
          (UI.editField===cn+"."+p||immerOffen(cn,pd));
        if(!gewaehlt&&!(UI.inline&&canWrite()&&!pd.derived&&!pd.readOnly))return;
      }
      (attach[p]||[]).forEach(function(dp){
        var dv=fmtVal(props[dp],derivedValue(props[dp],val), ifn);
        if(dv!=="") txt+=" ("+dv+")";
      });
      cells.push({cn:cn,p:p,pd:pd,val:val,txt:txt,ref:cn+"."+p,titel:titel,
        label:(REG.interfaces[cn].label||cn)+" · "+titel});
    });
  });
  /* Der Wissensfilter sitzt hier, weil hier die Feldauswahl entsteht:
     Feldtabelle, Wissensansicht und Board-Kachel gehen alle durch diese
     Funktion, also filtert sie einmal für alle drei. */
  cells.withheld=0;
  cells.frei=frei;
  if(!isGM()){
    var erlaubt={};
    visibleRefs(e,cells.map(function(c){return c.ref;})).forEach(function(r){ erlaubt[r]=1; });
    var vorher=cells.length;
    var gefiltert=cells.filter(function(c){ return erlaubt[c.ref]; });
    gefiltert.withheld=vorher-gefiltert.length;
    /* Ein leeres Feld anzubieten, das dieser Betrachter gar nicht sehen
       dürfte, verriete, dass es existiert. */
    var erlaubtFrei={};
    visibleRefs(e,frei.map(function(c){return c.ref;})).forEach(function(r){ erlaubtFrei[r]=1; });
    gefiltert.frei=frei.filter(function(c){ return erlaubtFrei[c.ref]; });
    cells=gefiltert;
  }
  return cells;
}

/* `fields: "all"` or a list of "Comp" / "Comp.key"; `columns` 0 means "fit". */
function elFields(e,ifn,item){
  var flds=el("dl",{class:"fields"}), nf=0;
  if(item.columns>0) flds.style.gridTemplateColumns="repeat("+item.columns+",minmax(0,1fr))";
  var plan=fieldPlan(e,ifn,item.fields,item.except);
  plan.forEach(function(c){
    flds.appendChild(fieldCell(e,c.cn,c.p,c.pd,c.val,c.txt,c.titel)); nf++;
  });
  if(item.fields==="all") (e.adhoc||[]).forEach(function(f){
    if(f.value===""||f.value==null)return;
    flds.appendChild(el("div",{class:"fld adhoc"},[
      el("dt",{text:f.label}),el("dd",{text:String(f.value)})])); nf++;
  });
  /* Bekannte Unbekannte (REQ-179): dass etwas fehlt, darf man wissen — was,
     nicht. Eine Ansicht, die lückenlos aussieht, obwohl sie es nicht ist,
     lässt niemanden nachfragen, und Nachfragen ist der Sinn der Sache.
     Zuletzt, nicht mittendrin: es ist eine Fussnote und kein Feld. */
  if(plan.withheld) flds.appendChild(el("div",{class:"fld withheld"},[
    el("dt",{text:"Not yours yet"}),
    el("dd",{text:"…and "+plan.withheld+" more thing"+(plan.withheld===1?"":"s")+
      " about this that you have not learned"})]));

  /* **Was leer ist, steht nicht da — aber es ist zu haben.** Eine Seite,
     die jedes mögliche Feld als Strich zeigt, liest sich wie ein Formular;
     eine, die es verschweigt, lässt es nie jemand ausfüllen. Also eine
     Zeile darunter, die aufzählt, was die Art noch trüge. */
  var frei=(plan.frei||[]).filter(function(c){ return !(UI.inline&&canWrite()); });
  if(canWrite()&&frei.length&&!inPlacement){
    var bar=el("div",{class:"addfield"});
    var sel=el("select",{class:"i"});
    sel.appendChild(el("option",{value:""},
      "+ field  ("+frei.length+" this kind can carry)"));
    frei.forEach(function(c){ sel.appendChild(el("option",{value:c.ref},c.label)); });
    sel.addEventListener("change",function(){
      if(!sel.value)return;
      /* Die Karte anlegen, falls es sie noch nicht gibt — sonst hätte das
         Feld keinen Ort, an dem es stehen könnte. */
      var teil=sel.value.split(".")[0];
      e.components=e.components||{};
      e.components[teil]=e.components[teil]||{};
      UI.editField=sel.value; render();
    });
    bar.appendChild(sel);
    var host=el("div");
    host.appendChild(nf?flds:el("div"));
    host.appendChild(bar);
    return host;
  }
  return nf?flds:null;
}

/* Prosa zeichnen. `except` gilt hier wie bei den Feldern und aus demselben
   Grund: „alles ausser den Geheimnissen" bleibt richtig, wenn ein neues
   Prosafeld dazukommt — eine ausgeschriebene Liste wäre am selben Tag
   falsch, und das Neue stünde nirgends. */
function elProse(e,ifn,item){
  var stuecke=proseOf(e,ifn,item.fields||"all",item["except"]);
  if(!isGM()){
    var ok={};
    visibleRefs(e,stuecke.map(function(x){return x.ref;})).forEach(function(r){ ok[r]=1; });
    stuecke=stuecke.filter(function(x){ return ok[x.ref]; });
  }
  var bw=el("div",{class:"blocks"});
  stuecke.forEach(function(x){
    var box=el("div",{class:"blk "+x.key});
    /* Der gewöhnliche Fliesstext trägt keine Überschrift — „Text" über
       einem Absatz sagt nichts. Alles andere sagt, was es ist. */
    if(x.key!=="paragraph"){
      var kopf=el("div",{class:"bl"},[document.createTextNode(proseTitle(x))]);
      if(canWrite()) kopf.appendChild(el("button",{class:"btn gh sm",type:"button",
        onclick:function(){ confirmDialog("Delete this passage?",function(){
          dropEntry(e,x.type,x.key,x.id); persist(e); }); }},"×"));
      box.appendChild(kopf);
    }
    /* An Ort und Stelle schreiben. Eine Stelle, die man nur über eine
       Maske irgendwo anders ändern kann, ändert niemand. */
    var offen=canWrite()&&!inPlacement&&(UI.inline||UI.editField===x.ref);
    if(offen){
      var ta=el("textarea",{class:"i"});
      ta.value=x.value;
      ta.addEventListener("change",function(){
        var neu=ta.value;
        if(!neu.trim()) dropEntry(e,x.type,x.key,x.id);
        else putEntry(e,x.type,x.key,x.id,neu);
        if(!UI.inline) UI.editField="";
        persist(e);
      });
      ta.addEventListener("keydown",function(ev){
        if(ev.key==="Escape"){ UI.editField=""; render(); } });
      box.appendChild(ta);
      if(!UI.inline) setTimeout(function(){ try{ ta.focus(); }catch(z){} },0);
    } else {
      var text=para(fillVars(x.value,null,e));
      if(canWrite()&&!inPlacement){
        text.classList.add("editable");
        text.addEventListener("click",function(){ UI.editField=x.ref; render(); });
      }
      box.appendChild(text);
    }
    bw.appendChild(box);
  });
  /* Und ein Weg, eine Stelle dazuzuschreiben. Er steht hier und nicht in
     einem Menü: wer gerade liest, weiss, was fehlt. */
  if(canWrite()&&!inPlacement){
    var moeglich=proseFields(ifn).filter(function(f){
      var weg=Array.isArray(item["except"])?item["except"]:[];
      if(weg.indexOf(f.type)>=0||weg.indexOf(f.type+"."+f.key)>=0)return false;
      var want=item.fields||"all";
      return want==="all"||(Array.isArray(want)&&
        (want.indexOf(f.type)>=0||want.indexOf(f.type+"."+f.key)>=0));
    });
    if(moeglich.length){
      var bar=el("div",{class:"addfield"});
      var sel=el("select",{class:"i"});
      sel.appendChild(el("option",{value:""},"+ passage"));
      moeglich.forEach(function(f){
        sel.appendChild(el("option",{value:f.type+"."+f.key},
          fieldTitle(ifn,f.type,f.key,f.prop))); });
      sel.addEventListener("change",function(){
        if(!sel.value)return;
        var teil=sel.value.split("."), id=uid("b");
        putEntry(e,teil[0],teil[1],id,"");
        UI.editField=entryRef(teil[0],teil[1],id);
        persist(e);
      });
      bar.appendChild(sel);
      bw.appendChild(bar);
    }
  }
  return bw.childNodes.length?bw:null;
}

/* compounding — composedOf sections resolved from the pool */
/**
 * **Die Typen, deren Felder diese Art über eine Kante mitbringt.**
 *
 * Eine Kante mit `asField` liest sich an einem ihrer Enden wie ein Feld:
 * die Zahlen einer Kreatur stehen am Statblock, und der ist ein eigener
 * Artikel — austauschbar, wiederverwendbar, mit eigenem Namen. Für die
 * Kreatur ist er trotzdem kein Verweis auf etwas Fremdes, sondern der Teil
 * von ihr, der woanders wohnt.
 *
 * Gespeichert bleibt die Kante **einseitig**: steht `asField` auf `to`,
 * liegt sie am anderen Artikel, und dieser hier findet sie über die
 * Rückfrage. Eine zweite Kante wäre ein Gegenstück, das verwaist.
 */
function verlinkteTypen(ifn){
  var raus=[];
  Object.keys(REG.relations||{}).forEach(function(k){
    var r=REG.relations[k];
    if(!r||!r.asField)return;
    var hier=r.asField;
    var liste=hier==="from"?r.from:r.to;
    if(!ifaceInList(liste,ifn))return;
    var gegen=hier==="from"?r.to:r.from;
    /* Ein Feld hat **einen** Typ. „Irgendeiner von vier" wäre eine Auswahl
       und keine Angabe — dann bleibt es eine Kante wie jede andere. */
    if(!gegen||gegen.length!==1||gegen[0]==="*")return;
    raus.push({relation:k,direction:hier==="from"?"out":"in",
      type:gegen[0],label:hier==="from"?r.label:r.inverseLabel,
      cardinality:r.cardinality||"many"});
  });
  return raus;
}
/** Der Artikel am anderen Ende — oder `null`. */
function verlinkterArtikel(e,l){
  if(l.direction==="out"){
    var k=(e.relations||[]).filter(function(r){ return r.type===l.relation; })[0];
    var ziel=k&&ENT.get(k.to);
    return ziel?{art:ziel,an:e}:null;
  }
  var treffer=null;
  ENT.forEach(function(o){
    if(treffer)return;
    if((o.relations||[]).some(function(r){ return r.type===l.relation&&r.to===e.id; }))
      treffer={art:o,an:o};
  });
  return treffer;
}

/* ---------- anlegen und anhängen ----------
   Ein verlinkter Artikel entsteht **angelegt und verbunden** in einem
   Schritt: einer, den man danach von Hand anhängen muss, ist ein halber
   Schritt, und den zweiten vergisst man. Die Kante liegt an dem Ende, an
   dem sie gespeichert wird. */
function linkFor(ifn,type){
  return verlinkteTypen(ifn).filter(function(l){ return l.type===type; })[0]||null;
}
/* **Ein Statblock trägt den Namen seiner Kreatur** — er ist ihre
   Zahlenseite und kein Ding für sich. Ein Inventar dagegen ist ein
   Behälter und heisst nach ihr: „Rook" zweimal in der Liste, einmal als
   Figur und einmal als Beutel, wäre die Sorte Name, bei der man das
   falsche erwischt. */
function linkedName(e,l){
  var d=REG.interfaces[l.type]||{};
  return l.type==="Statblock"?nameOf(e):nameOf(e)+" \u2014 "+(d.label||l.type);
}
function makeLinked(e,l){
  var name=linkedName(e,l);
  var neu={id:uid("e"),interfaces:[l.type],name:name,
    components:{Identity:{name:name,id:nextId(l.type),aliases:[]}},
    adhoc:[],relations:[],createdAt:new Date().toISOString()};
  applyDefaults(neu,l.type);
  if(l.direction==="out"){
    persist(neu);
    e.relations=(e.relations||[]).concat([{id:uid("r"),type:l.relation,to:neu.id,props:{}}]);
    persist(e);
  } else {
    neu.relations=[{id:uid("r"),type:l.relation,to:e.id,props:{}}];
    persist(neu);
  }
  return neu;
}
/* **Einen bestehenden anhängen** — für Kanten, die an diesem Artikel
   liegen (ein Inventar). Ein Statblock wird so nicht mehr geteilt: aus
   dem gewählten wird eine Instanz (`makeInstanceFor`). Doppelt angehängt
   wird nichts. */
function attachLinked(e,l,zielId){
  var ziel=ENT.get(zielId); if(!ziel||ziel.id===e.id)return;
  if(l.direction==="out"){
    if((e.relations||[]).some(function(r){ return r.type===l.relation&&r.to===ziel.id; }))return;
    e.relations=(e.relations||[]).concat([{id:uid("r"),type:l.relation,to:ziel.id,props:{}}]);
    persist(e);
  } else {
    if((ziel.relations||[]).some(function(r){ return r.type===l.relation&&r.to===e.id; }))return;
    ziel.relations=(ziel.relations||[]).concat([{id:uid("r"),type:l.relation,to:e.id,props:{}}]);
    persist(ziel);
  }
}
function makeStatblockFor(o){
  var l=linkFor((o.interfaces||[])[0],"Statblock");
  if(l){ makeLinked(o,l); render(); }
}

/**
 * **Was woanders wohnt, hier bearbeiten.**
 *
 * Bis hierher stand an einer Kreatur ein Verweis „statblock of: Rooks
 * Bogen", und wer eine Zahl ändern wollte, sprang auf einen zweiten
 * Artikel, änderte sie dort und suchte den Weg zurück. Die Zahlen gehören
 * aber zu dem, was man gerade offen hat.
 *
 * Gezeichnet wird deshalb die Feldtabelle **des anderen Artikels** — mit
 * seinen eigenen Eingaben, die in ihn schreiben. Kein Abschreiben, keine
 * zweite Karte: dieselbe Funktion wie auf seiner eigenen Seite, nur an
 * einer anderen Stelle der Seite. Der Name steht als Kopfzeile und führt
 * hin, denn manchmal will man doch dorthin.
 */
function elLinked(e,ifn,item){
  var liste=verlinkteTypen(ifn).filter(function(l){
    return !(item&&Array.isArray(item["except"])&&item["except"].indexOf(l.type)>=0);
  });
  if(!liste.length) return null;
  var wrap=el("div",{class:"linkedbox"});
  var etwas=false;
  liste.forEach(function(l){
    var d=REG.interfaces[l.type]||{};
    var ziel=verlinkterArtikel(e,l);
    if(!ziel&&!canWrite())return;
    etwas=true;
    var kopf=el("div",{class:"sec linkedhead"});
    kopf.appendChild(el("span",{text:d.label||l.type}));
    if(ziel) kopf.appendChild(el("button",{class:"ref",type:"button","data-linked":l.type,
      title:"Open "+nameOf(ziel.art)+" as its own article",
      onclick:function(){ go({k:"art",id:ziel.art.id}); }},nameOf(ziel.art)));
    kopf.appendChild(el("span",{class:"co",
      title:"Stored as the edge “"+l.relation+"” — this article and that one stay two",
      text:"its own article"}));
    wrap.appendChild(kopf);
    if(!ziel){
      var leer=el("div",{class:"addbar linkmissing"});
      leer.appendChild(el("span",{class:"hint",style:"margin:0",
        text:"None linked yet."}));
      leer.appendChild(el("button",{class:"btn sm",type:"button","data-make":l.type,
        onclick:function(){ makeLinked(e,l); render(); }},
        "Make \u201c"+linkedName(e,l)+"\u201d"));
      /* Oder einen, den es schon gibt — mit demselben Sucher wie jedes
         Verweisfeld, eingeschränkt auf die Art, die hier hängen kann. */
      var such=linkInput({target:{interfaces:[l.type]}},"");
      such.classList.add("attachlinked");
      /* Liegt die Kante am anderen Ende und kann die Art Vorlagen haben,
         wird aus dem gewählten eine **Instanz** für diese Kreatur — sonst
         hinge ein Bogen an dreissig Wachen, und jede Änderung an einer
         wäre eine an allen. */
      var alsInstanz=l.direction!=="out"&&canTemplate(l.type);
      such.addEventListener("change",function(){
        if(!such.value)return;
        if(alsInstanz) makeInstanceFor(e,l,such.value);
        else attachLinked(e,l,such.value);
        render();
      });
      leer.appendChild(el("span",{class:"co",text:alsInstanz?"or from a template":"or attach"}));
      leer.appendChild(such);
      wrap.appendChild(leer);
      return;
    }
    /* **Aus welcher Vorlage**, bevor jemand tippt: was hier geändert wird,
       gilt nur für diese Kreatur; was nicht gesetzt ist, kommt von dort. */
    var vorlage=templateOf(ziel.art);
    if(vorlage) kopf.appendChild(el("button",{class:"pill q instof",type:"button",
      title:"Fields not set here come from the template — changes here stay here",
      onclick:function(){ go({k:"art",id:vorlage.id}); }},"from "+nameOf(vorlage)));
    var felder=elFields(resolvedOf(ziel.art),l.type,{el:"fields",fields:"all"});
    if(felder) wrap.appendChild(felder);
    else wrap.appendChild(el("p",{class:"hint",text:"Nothing filled in there yet."}));
  });
  return etwas?wrap:null;
}

function elComposed(e){
  var comp=(e.relations||[]).filter(function(r){ var rd=REG.relations[r.type]; return rd&&rd.section; });
  if(!comp.length)return null;
  var wrap=el("div");
  var groups={};
  comp.forEach(function(r){ var s=REG.relations[r.type].section; (groups[s]=groups[s]||[]).push(r); });
  Object.keys(groups).forEach(function(sec){
    wrap.appendChild(el("div",{class:"sec",text:sec}));
    groups[sec].forEach(function(r){
      var t=ENT.get(r.to);
      var box=el("div",{class:"comp"});
      if(!t){ box.appendChild(el("div",{class:"gone",text:"Missing reference ("+r.to+")"}));
        wrap.appendChild(box); return; }
      var tn=el("div",{class:"cn"});
      tn.appendChild(el("button",{class:"ref",type:"button",onclick:function(){go({k:"art",id:t.id});}},
        (r.props&&r.props.vars&&r.props.vars.NAME)||nameOf(t)));
      box.appendChild(tn);
      var body=((t.components||{}).Description||{}).description||(allProse(t)[0]||{}).value||"";
      /* Reihenfolge nach REQ-174: Bindung an der Kante → der *nutzende*
         Artikel → Kampagnenregister. Der Statblock trägt DC=12, nicht die
         Regel — gegen die Regel aufzulösen lässt {DC} stehen. */
      box.appendChild(para(fillVars(body,(r.props&&r.props.vars)||null,e),"cb"));
      wrap.appendChild(box);
    });
  });
  return wrap;
}

/* Bezüge im Hauptteil — dieselbe Liste, die sonst in der Seitenleiste steht. */
function elRelations(e){
  var outs=(e.relations||[]).filter(function(r){ var rd=REG.relations[r.type]; return !(rd&&rd.section); });
  if(!outs.length)return null;
  var wrap=el("div",{class:"rel"});
  outs.forEach(function(r){
    var rd=relDef(r.type), t=ENT.get(r.to);
    var row=el("div",{class:"relrow"});
    row.appendChild(el("span",{class:"rl",text:rd.label||r.type}));
    var rv=el("span",{class:"rv"});
    if(t) rv.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:t.id});}},nameOf(t)));
    else rv.appendChild(el("span",{class:"gone",text:"missing"}));
    row.appendChild(rv);
    wrap.appendChild(row);
  });
  return wrap;
}

/* ---------- Ebenen und Stapel (REQ-004 bis 009, 044) ----------
   Ein Artikel ohne `inLayer`-Kante gehört der Kampagne selbst und ist immer
   da. Das ist der Normalfall und soll keine Zeile kosten — wer eine
   Kampagne führt und keine Pakete benutzt, merkt vom Stapel nichts.

   Was eine Ebene mitbringt, ist da, solange die Kampagne sie aufschaltet.
   Eine höhere Ebene kann dasselbe Ding **überschreiben** (`overrides`) oder
   **herausnehmen** (`inLayer` mit `mode: removes`). Löschen ginge in beiden
   Fällen nicht: der Artikel gehört der anderen Ebene, und beim nächsten
   Import wäre er wieder da.

   Die Auflösung ist eine Abfrage und wird nie gespeichert — dieselbe Regel
   wie bei abgeleiteten Werten (D8). Sie sitzt in `articleVisible` und
   `resolveArticle`, also an denselben zwei Stellen wie Sichtbarkeit und
   Wissen; wer eine dritte Stelle bräuchte, hätte das Modell verfehlt. */
var LAYER_IFACE="Layer", LAYER_COMP="Layer",
    REL_INLAYER="inLayer", REL_ACTIVATES="activates",
    REL_OVERRIDES="overrides", REL_VARIANT="variantOf";

/* Die Welt der laufenden Kampagne (`inWorld`) — sie trägt den Kalender (A11). */
function currentWorld(){
  var camp=currentCampaign(); if(!camp)return null;
  var r=(camp.relations||[]).filter(function(x){return x.type==="inWorld";})[0];
  return r?ENT.get(r.to)||null:null;
}
function campaignCalendar(){
  var w=currentWorld();
  return w?String((((w.components||{}).World||{}).calendar)||""):"";
}
/* Die laufende Kampagne. Eine Einstellung schlägt die Suche — wer zwei
   Kampagnen in einem Speicher führt, muss sagen können, welche gilt. */
function currentCampaign(){
  var gesetzt=setting("campaign","");
  if(gesetzt&&ENT.get(gesetzt))return ENT.get(gesetzt);
  var hit=null;
  ENT.forEach(function(e){ if(!hit&&((e.interfaces||[])[0])==="Campaign") hit=e; });
  return hit;
}
/* Die aufgeschalteten Ebenen, von unten nach oben. Reihenfolge: was an der
   Kante steht, sonst die Spezifität der Ebene selbst. */
var stackSig="", stackCache=null;
function activeStack(){
  var camp=currentCampaign();
  var sig=(camp?camp.id+":"+JSON.stringify(camp.relations||[]):"-")+"|"+ENT.size;
  if(sig===stackSig&&stackCache)return stackCache;
  var out=[];
  if(camp){
    (camp.relations||[]).forEach(function(r){
      if(r.type!==REL_ACTIVATES)return;
      var l=ENT.get(r.to); if(!l)return;
      var info=(l.components||{})[LAYER_COMP]||{};
      out.push({layer:l,order:(r.props&&r.props.order!=null)?Number(r.props.order):(Number(info.order)||10)});
    });
  }
  out.sort(function(a,b){ return a.order-b.order; });
  stackSig=sig; stackCache=out;
  return out;
}
function activeLayerIds(){
  var m={};
  activeStack().forEach(function(x,i){ m[x.layer.id]=i+1; });   /* 1..n, höher = spezifischer */
  return m;
}
function layerEdges(e){
  return (e.relations||[]).filter(function(r){ return r.type===REL_INLAYER; });
}
/* Steht dieser Artikel im laufenden Stapel? Ohne Ebenenkante: ja. Mit:
   nur, wenn eine aufgeschaltete Ebene ihn hinzufügt — und keine
   spezifischere ihn herausnimmt. */
function inStack(e){
  var kanten=layerEdges(e);
  if(!kanten.length)return true;
  var aktiv=activeLayerIds();
  var addAt=0, remAt=0;
  kanten.forEach(function(r){
    var rang=aktiv[r.to]; if(!rang)return;
    if(((r.props||{}).mode)==="removes") remAt=Math.max(remAt,rang);
    else addAt=Math.max(addAt,rang);
  });
  if(!addAt&&!remAt)return false;          /* nur in Ebenen, die nicht laufen */
  return addAt>remAt;
}
/* Höchste aufgeschaltete Ebene eines Artikels — für die Herkunftsanzeige. */
function layerOf(e){
  var kanten=layerEdges(e);
  if(!kanten.length)return null;
  var aktiv=activeLayerIds(), best=null, rang=0;
  kanten.forEach(function(r){
    if(((r.props||{}).mode)==="removes")return;
    var x=aktiv[r.to]; if(!x||x<rang)return;
    rang=x; best=ENT.get(r.to)||null;
  });
  if(best)return best;
  return ENT.get(kanten[0].to)||null;
}
/* Wer diesen Artikel überschreibt — die spezifischste aufgeschaltete
   Fassung. Ohne aufgeschaltete Ebene überschreibt niemand: eine
   Überschreibung, die immer gilt, wäre eine Bearbeitung. */
function overriderOf(id){
  var aktiv=activeLayerIds(), best=null, rang=-1;
  ENT.forEach(function(o){
    (o.relations||[]).forEach(function(r){
      if(r.type!==REL_OVERRIDES||r.to!==id)return;
      var l=layerEdges(o).map(function(x){return aktiv[x.to]||0;});
      var r2=l.length?Math.max.apply(null,l):0;
      if(!r2)return;                        /* Überschreibung ohne Ebene zählt nicht */
      if(r2>rang){ rang=r2; best=o; }
    });
  });
  return best;
}
/* Was an dieser Stelle wirklich gilt. Eine Kette von Überschreibungen wird
   bis zum Ende verfolgt, aber nicht im Kreis. */
function resolveArticle(e){
  var at=e, guard=0;
  while(at&&guard++<8){
    var o=overriderOf(at.id);
    if(!o||o.id===at.id)break;
    at=o;
  }
  return at;
}
function isOverridden(e){ return !!overriderOf(e.id); }

/* Der schlanke Herkunfts-Anzeiger (REQ-044): woher dieser Artikel kommt und
   ob etwas ihn ersetzt. Er steht am Artikel und nicht in einem Register —
   die Frage stellt sich dort, wo man liest. */
function stackChip(e){
  var l=layerOf(e);
  var ov=overriderOf(e.id);
  if(!l&&!ov)return null;
  var box=el("span",{class:"stackchip"});
  if(l){
    var info=(l.components||{})[LAYER_COMP]||{};
    box.appendChild(el("button",{class:"chip",type:"button",
      title:"From the layer “"+nameOf(l)+"”"+(info.kind?" ("+info.kind+")":""),
      onclick:function(){go({k:"art",id:l.id});}},nameOf(l)));
    if(!activeLayerIds()[l.id]) box.appendChild(el("span",{class:"co",text:"not running"}));
  }
  if(ov) box.appendChild(el("button",{class:"chip warn",type:"button",
    title:"Something replaces this one in the running stack",
    onclick:function(){go({k:"art",id:ov.id});}},"replaced by "+nameOf(ov)));
  var vr=(e.relations||[]).filter(function(r){return r.type===REL_VARIANT;})[0];
  if(vr){
    var q=ENT.get(vr.to);
    if(q) box.appendChild(el("button",{class:"chip",type:"button",
      onclick:function(){go({k:"art",id:q.id});}},"variant of "+nameOf(q)));
  }
  return box;
}

/* ---------- Wer an diesem Tisch sitzt ----------
   **Die Rollen stehen am Konto, gepflegt werden sie hier.** Eine Zeile je
   Konto: welche Rolle es in **dieser** Kampagne hat, und welche Figuren es
   führt. Die Rolle gilt nur hier — wer in der einen Runde leitet, kann in
   der anderen mitspielen; die Figuren gelten überall, wie am Server
   `app_user_actor`.

   Pflegen darf die Verwaltung (der Besitzer des Artefakts) und die Leitung
   dieser Kampagne. Ein Mitleiter sieht die Liste und ändert sie nicht —
   das ist, was `gm` und `co-gm` trennt; sehen tun beide dasselbe. Wer
   weder das eine noch das andere ist, bekommt das Element gar nicht: eine
   Liste aller Konten ist keine Auskunft für Spielende. */
function elMembers(e){
  if((e.interfaces||[])[0]!=="Campaign")return null;
  var meine=tableRole(viewerRoles(),e.id);
  var pflegt=isGM()||meine==="gm";
  if(!pflegt&&meine!=="co-gm")return null;
  var wrap=el("div",{class:"members"});
  wrap.appendChild(el("div",{class:"sec",text:"Members"}));
  wrap.appendChild(el("p",{class:"hint"},
    "A role counts in this campaign only; the figures an account plays count "+
    "everywhere. Accounts appear here once they have opened the page."));
  var ids=[];
  MEMBERS.forEach(function(m,uid){ ids.push(uid); });
  if(!ids.length){
    wrap.appendChild(el("p",{class:"hint",text:"No accounts yet."}));
    return wrap;
  }
  /* Wer hier eine Rolle hat, zuerst — nach Rang; dann der Rest nach Name. */
  ids.sort(function(a,b){
    var ra=ROLLEN_RANG[(MEMBERS.get(a).roles||{})[e.id]]||0;
    var rb=ROLLEN_RANG[(MEMBERS.get(b).roles||{})[e.id]]||0;
    if(ra!==rb)return rb-ra;
    return String(MEMBERS.get(a).name||a).localeCompare(String(MEMBERS.get(b).name||b));
  });
  var tab=el("div",{class:"memberrows"});
  ids.forEach(function(uid){
    var m=MEMBERS.get(uid);
    var row=el("div",{class:"memberrow","data-user":uid});
    var wer=el("div",{class:"mwho"});
    wer.appendChild(el("b",{text:m.name||uid}));
    if(uid===me.id) wer.appendChild(el("span",{class:"pill q",text:"you"}));
    row.appendChild(wer);

    var rolle=(m.roles||{})[e.id]||"";
    var sel=el("select",{class:"i mrole","aria-label":"Role in this campaign"});
    sel.appendChild(el("option",{value:""},"— no seat"));
    ROLLEN.forEach(function(r){ sel.appendChild(el("option",{value:r},r)); });
    sel.value=rolle;
    if(!pflegt) sel.disabled=true;
    sel.addEventListener("change",function(){
      var roles=Object.assign({},m.roles||{});
      if(sel.value) roles[e.id]=sel.value; else delete roles[e.id];
      saveMember(uid,{actors:m.actors,roles:roles,name:m.name});
    });
    row.appendChild(sel);

    /* Die Figuren als Verweise, mit demselben Sucher wie überall: eine
       getippte Id ist entweder richtig oder unauffindbar. */
    var fig=linksInput({target:{interfaces:["Creature","Party"]}},m.actors||[]);
    if(pflegt){
      /* Der Sucher meldet `change` auch beim blossen Verlassen, und das
         Ereignis steigt durch den Kasten auf. Geschrieben wird darum nur,
         was sich wirklich geändert hat. */
      fig.addEventListener("change",function(){
        var neu=String(fig.value||"").split(",").map(function(x){return x.trim();})
          .filter(Boolean);
        if(neu.join("|")===(m.actors||[]).join("|"))return;
        saveMember(uid,{actors:neu,roles:m.roles,name:m.name});
      });
    } else {
      Array.prototype.forEach.call(fig.querySelectorAll("input,button"),
        function(x){ x.disabled=true; });
    }
    row.appendChild(fig);
    tab.appendChild(row);
  });
  wrap.appendChild(tab);
  return wrap;
}

function elStack(e,ifn,item){
  var wrap=el("div",{class:"stackbox"});
  var camp=currentCampaign();
  var stapel=activeStack();

  if(!camp){
    wrap.appendChild(el("p",{class:"hint",
      text:"No campaign yet. Without one nothing is switched on, and every article is simply there — which is the right default for a campaign that uses no packs."}));
  }

  /* Die Ebenen von unten nach oben, mit dem, was sie beisteuern. */
  wrap.appendChild(el("div",{class:"sec",text:"Running, bottom first"}));
  if(!stapel.length) wrap.appendChild(el("p",{class:"hint",
    text:camp?"This campaign switches on no layer. Everything that carries no layer is in anyway.":""}));
  var box=el("div",{class:"layers"});
  stapel.forEach(function(x,i){
    var info=(x.layer.components||{})[LAYER_COMP]||{};
    var row=el("div",{class:"layer"});
    var kopf=el("div",{class:"ck"});
    kopf.appendChild(el("span",{class:"num",text:String(i+1)}));
    kopf.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:x.layer.id});}},nameOf(x.layer)));
    if(info.kind) kopf.appendChild(el("span",{class:"pill q",text:info.kind}));
    if(info.version) kopf.appendChild(el("span",{class:"co",text:info.version}));
    var bringt=0, nimmt=0;
    ENT.forEach(function(o){
      layerEdges(o).forEach(function(r){
        if(r.to!==x.layer.id)return;
        if(((r.props||{}).mode)==="removes") nimmt++; else bringt++;
      });
    });
    kopf.appendChild(el("span",{class:"co",
      text:bringt+" brought"+(nimmt?", "+nimmt+" taken out":"")}));
    if(canWrite()&&camp) kopf.appendChild(el("button",{class:"btn gh sm",type:"button",
      title:"Switch this layer off",
      onclick:function(){
        camp.relations=(camp.relations||[]).filter(function(r){
          return !(r.type===REL_ACTIVATES&&r.to===x.layer.id); });
        persist(camp);
      }},"off"));
    row.appendChild(kopf);
    box.appendChild(row);
  });
  wrap.appendChild(box);

  if(canWrite()&&camp){
    var frei=[];
    var an=activeLayerIds();
    ENT.forEach(function(o){
      if(((o.interfaces||[])[0])!==LAYER_IFACE)return;
      if(an[o.id])return;
      frei.push(o);
    });
    if(frei.length){
      var sel=el("select",{class:"i",style:"width:auto"});
      sel.appendChild(el("option",{value:""},"— switch a layer on …"));
      frei.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
      frei.forEach(function(o){ sel.appendChild(el("option",{value:o.id},nameOf(o))); });
      sel.addEventListener("change",function(){
        if(!sel.value)return;
        var l=ENT.get(sel.value);
        var info=(l&&l.components&&l.components[LAYER_COMP])||{};
        camp.relations=camp.relations||[];
        camp.relations.push({id:uid("r"),type:REL_ACTIVATES,to:sel.value,
          props:{order:Number(info.order)||10}});
        persist(camp);
      });
      wrap.appendChild(sel);
    }
  }

  /* Was der Stapel gerade ausblendet — die Frage, die man stellt, wenn
     etwas fehlt, und die sonst niemand beantwortet. */
  var draussen=[], ersetzt=[];
  ENT.forEach(function(o){
    if(!inStack(o)) draussen.push(o);
    else if(isOverridden(o)) ersetzt.push(o);
  });
  wrap.appendChild(el("div",{class:"sec",text:"Not in play right now"}));
  if(!draussen.length&&!ersetzt.length) wrap.appendChild(el("p",{class:"hint",
    text:"Nothing is switched out and nothing is replaced."}));
  if(draussen.length){
    var d=el("div",{class:"chips"});
    draussen.slice(0,30).forEach(function(o){
      d.appendChild(el("button",{class:"chip",type:"button",
        onclick:function(){go({k:"art",id:o.id});}},nameOf(o)));
    });
    wrap.appendChild(el("p",{class:"hint",
      text:draussen.length+" article"+(draussen.length===1?"":"s")+
        " belong only to layers that are not running."}));
    wrap.appendChild(d);
  }
  if(ersetzt.length){
    var r2=el("div",{class:"chips"});
    ersetzt.slice(0,30).forEach(function(o){
      var ov=overriderOf(o.id);
      r2.appendChild(el("button",{class:"chip warn",type:"button",
        onclick:function(){go({k:"art",id:ov?ov.id:o.id});}},
        nameOf(o)+" → "+(ov?nameOf(ov):"?")));
    });
    wrap.appendChild(el("p",{class:"hint",
      text:ersetzt.length+" replaced by a more specific layer."}));
    wrap.appendChild(r2);
  }
  return wrap;
}

/* ---------- Punktreise und Erkundung (REQ-168 bis 171) ----------
   Eine Punktreise ist kein Ausschnitt einer Karte, sondern ein Graph: Orte
   und Wege dazwischen. Der Unterschied ist nicht Darstellung — auf einer
   Karte ist jeder Punkt von jedem erreichbar, im Graph nur die, zwischen
   denen jemand einen Weg gelegt hat. Genau das macht Reisen zu einer
   Entscheidung.

   **Der Sinneseindruck steht an der Kante, nicht am Ziel.** Was man
   unterwegs hört und riecht, hängt vom Weg ab: dieselbe Lichtung riecht von
   der Sumpfseite anders als vom Grat. Das ist der Grund, warum eine
   Punktreise mehr ist als eine Liste von Orten.

   **Drei Erkundungsstufen, nicht zwei.** „Verborgen" heisst, die Gruppe
   weiss nicht einmal, dass es den Ort gibt; „entdeckt" heisst, sie weiss
   davon und war nicht dort; „erkundet" heisst, sie war da. Zwei Stufen
   könnten „wir haben davon gehört" nicht abbilden, und daraus entsteht das
   halbe Spiel.

   Angeordnet wird von selbst — nach Abstand vom Standort. Koordinaten je
   Knoten zu speichern hiesse, sie bei jeder neuen Kante nachzuziehen. */
var EXPL_COMP="Place", TRAVEL_COMP="Party", REL_ROUTE="route";
var EXPL_STATES=[["hidden","Hidden"],["discovered","Known of"],["explored","Been there"]];

function explOf(e){ return ((e.components||{})[EXPL_COMP]||{}).state||"hidden"; }
function setExpl(e,st){
  e.components=e.components||{};
  e.components[EXPL_COMP]=Object.assign({},e.components[EXPL_COMP]||{},
    {state:st,since:new Date().toISOString().slice(0,10)});
  persist(e);
}
function routesFrom(e){
  var out=[];
  (e.relations||[]).forEach(function(r){
    if(r.type!==REL_ROUTE)return;
    var t=ENT.get(r.to); if(!t)return;
    out.push({rel:r,to:t,props:r.props||{},back:false});
  });
  /* Die Gegenrichtung ist eine Abfrage, keine zweite Kante — ausser der Weg
     ist ausdrücklich einseitig. Ein gespiegeltes Gegenstück verwaist. */
  ENT.forEach(function(o){
    (o.relations||[]).forEach(function(r){
      if(r.type!==REL_ROUTE||r.to!==e.id)return;
      if((r.props||{}).oneWay)return;
      out.push({rel:r,to:o,props:r.props||{},back:true});
    });
  });
  return out;
}
/* Die Gruppe, die reist: die erste mit einer Reisekarte. Mehrere Gruppen
   wären mehrere Karten — das trägt das Modell, die Oberfläche nimmt die
   erste. */
function travellingParty(){
  var hit=null;
  ENT.forEach(function(e){
    if(hit)return;
    if((e.components||{})[TRAVEL_COMP]) hit=e;
  });
  if(hit)return hit;
  ENT.forEach(function(e){
    if(hit)return;
    if(((e.interfaces||[])[0])==="Party") hit=e;
  });
  return hit;
}
function travelCard(p2){ return ((p2&&p2.components)||{})[TRAVEL_COMP]||{}; }

/* Abstand vom Standort, damit die Knoten sich von selbst ordnen. */
function crawlLayers(start,knoten){
  var idx={}; knoten.forEach(function(k){ idx[k.id]=k; });
  var tiefe={}, rand=[start&&start.id].filter(Boolean), t=0;
  if(rand.length) tiefe[rand[0]]=0;
  while(rand.length&&t<12){
    var naechste=[];
    rand.forEach(function(id){
      var e=ENT.get(id); if(!e)return;
      routesFrom(e).forEach(function(w){
        if(!idx[w.to.id]||tiefe[w.to.id]!==undefined)return;
        tiefe[w.to.id]=t+1; naechste.push(w.to.id);
      });
    });
    rand=naechste; t++;
  }
  var max=0;
  Object.keys(tiefe).forEach(function(k){ max=Math.max(max,tiefe[k]); });
  knoten.forEach(function(k){ if(tiefe[k.id]===undefined) tiefe[k.id]=max+1; });
  var reihen={};
  knoten.forEach(function(k){ (reihen[tiefe[k.id]]=reihen[tiefe[k.id]]||[]).push(k); });
  return {tiefe:tiefe,reihen:reihen};
}

function elCrawl(e,ifn,item){
  var wrap=el("div",{class:"crawl"});
  /* Die Knoten sind die Orte unter diesem Ort — `partOf`, dieselbe Kante
     wie überall. Ein eigenes „Punktreise"-Konstrukt wäre das erste Element,
     das dem Rückgrat nicht folgt. */
  var knoten=[];
  ENT.forEach(function(o){
    if(((o.interfaces||[])[0])!=="Place")return;
    if(!(o.relations||[]).some(function(r){ return r.type==="partOf"&&r.to===e.id; }))return;
    if(!articleVisible(o))return;
    knoten.push(o);
  });
  if(!knoten.length){
    wrap.appendChild(el("p",{class:"hint",
      text:"No nodes here. A point-crawl is made of places that sit inside this one (partOf) with routes between them."}));
    return wrap;
  }
  knoten.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});

  var gruppe=travellingParty();
  var karte=travelCard(gruppe);
  /* Wo die Gruppe steht, sagt ihr Token (A6) — kein Feld an der Gruppe. */
  var hier=crawlNodeOf(partyPlace(gruppe),knoten);
  var lagen=crawlLayers(hier,knoten);

  /* Kopfzeile: Tag, Wache, Zehrung. Die Zahlen, nach denen am Tisch gefragt
     wird — und die niemand nachführt, wenn sie nicht dastehen. */
  if(gruppe){
    var bar=el("div",{class:"maptools"});
    if(inPlacement) bar.style.display="none";
    bar.appendChild(el("span",{class:"pill",text:nameOf(gruppe)}));
    bar.appendChild(el("span",{class:"pill q",text:"Day "+(karte.day||1)+", watch "+(karte.watch||1)}));
    var jeRation=settingNum("travelRationEvery",3);
    var jeLicht=settingNum("travelLightEvery",4);
    if(jeRation>0){
      var offen=jeRation-((karte.sinceRation||0)%jeRation);
      bar.appendChild(el("span",{class:"pill q"+(offen===jeRation?"":""),
        text:"rations in "+(offen===jeRation?jeRation:offen)}));
    }
    if(jeLicht>0){
      var offenL=jeLicht-((karte.sinceLight||0)%jeLicht);
      bar.appendChild(el("span",{class:"pill q",
        text:"light in "+(offenL===jeLicht?jeLicht:offenL)}));
    }
    if(canWrite()&&hier) bar.appendChild(el("button",{class:"btn sm gh",type:"button",
      title:"A watch passes without moving",
      onclick:function(){ zeitVergeht(gruppe,karte,0); }},"Wait a watch"));
    wrap.appendChild(bar);
  }

  function zeitVergeht(g,k,knotenSchritt){
    var wachen=Math.max(1,settingNum("travelWatchesPerDay",3));
    var w=(Number(k.watch)||1)+1, d=Number(k.day)||1;
    if(w>wachen){ w=1; d++; }
    var patch={watch:w,day:d};
    if(knotenSchritt){
      patch.sinceRation=(Number(k.sinceRation)||0)+1;
      patch.sinceLight=(Number(k.sinceLight)||0)+1;
      patch.actions={};                    /* Handlungen gehören zum Knoten */
    }
    g.components=g.components||{};
    g.components[TRAVEL_COMP]=Object.assign({},k,patch);
    persist(g);
  }
  function zieheNach(g,k,ziel){
    /* Ankommen heisst erkunden, und erkunden deckt auf, wohin es von dort
       weitergeht (REQ-169) — sonst müsste die Spielleitung jede Kante von
       Hand freischalten und vergisst die halben. */
    setExpl(ziel,"explored");
    routesFrom(ziel).forEach(function(w){
      if((w.props||{}).hidden)return;
      if(explOf(w.to)==="hidden") setExpl(w.to,"discovered");
    });
    /* Umgesetzt wird das Token, nicht ein Feld (A6). */
    if(!placePartyAt(g,ziel)){
      alert("No map to stand on: give "+nameOf(ziel)+" or a place above it a map.");
      return;
    }
    zeitVergeht(g,k,1);
  }

  /* Der Graph. Reihen nach Abstand vom Standort, Kanten als Linien. */
  var reihenIdx=Object.keys(lagen.reihen).map(Number).sort(function(a,b){return a-b;});
  var graph=el("div",{class:"crgraph"});
  reihenIdx.forEach(function(t){
    var sp=el("div",{class:"crcol"});
    sp.appendChild(el("div",{class:"ck",text:t===0?"here":(t>99?"unlinked":t+" away")}));
    lagen.reihen[t].forEach(function(k){
      var st=explOf(k);
      var b=el("button",{class:"crnode s-"+st+(hier&&k.id===hier.id?" here":""),type:"button",
        onclick:function(){ go({k:"art",id:k.id}); }});
      b.appendChild(el("b",{text:st==="hidden"&&!isGM()?"?":nameOf(k)}));
      var wege=routesFrom(k).length;
      b.appendChild(el("em",{text:wege+(wege===1?" way":" ways")}));
      sp.appendChild(b);
    });
    graph.appendChild(sp);
  });
  wrap.appendChild(graph);

  /* Von hier aus: die Wege mit ihrem Sinneseindruck. Das ist die Ansicht,
     die am Tisch benutzt wird — alles andere ist Übersicht. */
  if(hier){
    wrap.appendChild(el("div",{class:"sec",text:"From "+nameOf(hier)}));
    var ankunft=((hier.components||{})[EXPL_COMP]||{}).arrival;
    if(ankunft) wrap.appendChild(el("div",{class:"blk readaloud"},[para(fillVars(ankunft,null,hier))]));
    var wege=routesFrom(hier).filter(function(w){
      if(!isGM()&&(w.props||{}).hidden&&explOf(w.to)==="hidden")return false;
      return true;
    });
    if(!wege.length) wrap.appendChild(el("p",{class:"hint",text:"No way on from here."}));
    wege.forEach(function(w){
      var box=el("div",{class:"crway"});
      var kopf=el("div",{class:"ck"});
      kopf.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:w.to.id});}},
        explOf(w.to)==="hidden"&&!isGM()?"somewhere unknown":nameOf(w.to)));
      if(w.props.hours) kopf.appendChild(el("span",{class:"pill q",text:w.props.hours+" h"}));
      if(w.props.terrain) kopf.appendChild(el("span",{class:"pill q",text:w.props.terrain}));
      if(w.props.hidden) kopf.appendChild(el("span",{class:"pill q",text:"has to be found"}));
