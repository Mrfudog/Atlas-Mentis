  ["list","List"],["object","Object"]
];
/* **Die Werte, die in ein Feld dürfen** — die eigenen oder die der
   Aufzählungszeile, die es nennt.

   Ein Feld trägt `enum: [...]`, wenn die Liste ihm allein gehört, und
   `enumRef: "Ability"`, wenn mehrere Felder dieselbe Liste brauchen. Die
   sechs Attributkürzel standen an der Fertigkeit und am Rezept wörtlich —
   zwei Listen für eine Sache, und die eine, die niemand nachzieht, ist
   danach still falsch. Gelesen wird deshalb überall über diese Funktion und
   nirgends `p.enum` direkt. */
function enumWerte(p){
  if(!p) return null;
  if(Array.isArray(p["enum"])&&p["enum"].length) return p["enum"];
  var gruppen=enumGruppen(p);
  if(!gruppen.length) return null;
  var raus=[];
  gruppen.forEach(function(g){ g.values.forEach(function(v){
    if(raus.indexOf(v)<0) raus.push(v); }); });
  return raus.length?raus:null;
}
/* Dieselben Werte, aber **je Zeile getrennt**: worin jemand geübt ist, kommt
   aus sechs Listen, und eine Maske, die sie in einen Topf wirft, macht aus
   fünfunddreissig Wörtern eine Wand. Genannte Zeilen, die es nicht gibt,
   fallen weg — eine fehlende Zeile ist keine leere Liste. */
function enumGruppen(p){
  var refs=p&&p.enumRef;
  if(!refs) return [];
  var namen=Array.isArray(refs)?refs:[refs];
  var raus=[];
  namen.forEach(function(n){
    var z=(REG.enums||{})[n];
    if(!z||!Array.isArray(z.values)||!z.values.length)return;
    raus.push({name:n,label:z.label||n,values:z.values});
  });
  return raus;
}
/** Aus welcher genannten Zeile dieser Wert kommt. */
function enumQuelle(p,wert){
  var g=enumGruppen(p).filter(function(x){ return x.values.indexOf(wert)>=0; })[0];
  return g?g.name:null;
}
/** Die Werte eines Feldes, die aus **dieser** Zeile kommen. */
function werteAusZeile(karte,typ,feld,zeile){
  var p=((REG.interfaces[typ]||{}).schema||{}).properties||{};
  var pd=p[feld]||{};
  var drin=(karte||{})[feld];
  if(!Array.isArray(drin)) return [];
  return drin.filter(function(v){ return enumQuelle(pd,v)===zeile; });
}
function fieldKind(p){
  if(!p) return "text";
  if(p.format==="color") return "color";
  /* Eine **Liste** von Verweisen ist etwas anderes als einer: „Revealed
     to" nennt mehrere Träger, „Scene in play" genau eine Szene. Mit einer
     einzelnen Eingabe daran stand dort der erste Eintrag und der zweite
     fiel beim Speichern weg. */
  if(p.format==="link") return p.type==="array"?"links":"link";
  if(p.format==="asset") return "asset";
  if(p.format==="date") return "date";
  /* **Eine Form wird gezeichnet, nicht getippt.** `##.,##.` als Text sagt
     der Eingabe nicht, was dabei herauskommt, und beim Abzählen verrutscht
     eine Spalte. */
  if(p.format==="grid") return "grid";
  if(p.format==="zones") return "zones";
  /* Eine Liste **aus** einer Aufzählung ist etwas anderes als eine Liste
     freier Wörter und etwas anderes als eine einzelne Wahl: „auf welche
     Rettungswürfe geübt" sind mehrere Attribute, „welches Attribut trägt
     die Probe" ist eines. */
  if(p.type==="array"&&(Array.isArray(p["enum"])||p.enumRef)) return "choices";
  if(Array.isArray(p["enum"])||p.enumRef) return "choice";
  if(p.type==="number"||p.type==="integer") return "number";
  if(p.type==="boolean") return "boolean";
  if(p.type==="array") return "list";
  if(p.type==="object") return "object";
  return "text";
}
/* Setting a kind rewrites exactly the keys that define it and leaves the rest
   alone — title, derived and required survive a change of mind. */
function setFieldKind(p,kind){
  delete p["enum"];
  /* Auch die Nennung: ein Feld, das keine Auswahl mehr ist, darf keine
     Liste mehr nennen — sonst käme sie beim nächsten Wechsel zurück. */
  delete p.enumRef;
  if(p.format==="color"||p.format==="link"||p.format==="asset"||p.format==="date"
     ||p.format==="measure"||p.format==="grid"||p.format==="zones") delete p.format;
  delete p.target;
  switch(kind){
    case "number":  p.type="number"; break;
    case "boolean": p.type="boolean"; break;
    case "list":    p.type="array"; break;
    case "object":  p.type="object"; break;
    case "choice":  p.type="string"; p["enum"]=[]; break;
    /* Mehrere Werte aus einer Liste: die Werte kommen aus einer Zeile, und
       die wählt man gleich darunter. Eigene Wörter am Feld gibt es hier
       nicht — eine Liste, die mehrfach gewählt wird, wird geteilt. */
    case "choices": p.type="array"; p.items={type:"string"}; break;
    case "color":   p.type="string"; p.format="color"; break;
    case "asset":   p.type="string"; p.format="asset"; break;
    case "date":    p.type="string"; p.format="date"; break;
    case "link":    p.type="string"; p.format="link"; p.target={}; break;
    case "links":   p.type="array"; p.format="link"; p.items={type:"string"};
                    p.target={}; break;
    case "grid":    p.type="array"; p.format="grid"; p.items={type:"string"}; break;
    case "zones":   p.type="object"; p.format="zones"; break;
    default:        p.type="string";
  }
}

/* ---------- link targets ----------
   Which articles may a link field point at. Three filters, all optional and
   combined with AND: interface (subtypes included), tags (any of), and a
   field value. Empty means "any article" — a link with no constraint is still
   a link, not an error. */
function ifaceAndKinds(name,seen){
  seen=seen||{}; if(seen[name])return []; seen[name]=1;
  var out=[name];
  kindsOf(name).forEach(function(k){ out=out.concat(ifaceAndKinds(k,seen)); });
  return out;
}
function targetMatches(target,e){
  var t=target||{};
  if(Array.isArray(t.interfaces)&&t.interfaces.length){
    var erlaubt={};
    t.interfaces.forEach(function(n){ ifaceAndKinds(n).forEach(function(k){ erlaubt[k]=1; }); });
    if(!(e.interfaces||[]).some(function(n){ return erlaubt[n]; })) return false;
  }
  if(Array.isArray(t.tags)&&t.tags.length){
    if(!tagsOf(e).some(function(x){ return t.tags.indexOf(x)>=0; })) return false;
  }
  if(t.where&&t.where.component&&t.where.property){
    var have=((e.components||{})[t.where.component]||{})[t.where.property];
    if(String(have==null?"":have)!==String(t.where.value==null?"":t.where.value)) return false;
  }
  return true;
}
/* Candidates for a link field, newest-relevant first: name match before a
   match anywhere else, so typing a name does not bury it under descriptions. */
function linkCandidates(target,query,limit){
  var q=String(query||"").toLowerCase().trim();
  var vorn=[], hinten=[];
  ENT.forEach(function(e){
    if(!targetMatches(target,e))return;
    /* Eine Instanz ist kein Verweisziel: sie gehört ihrer Kreatur, und als
       Vorlage dient die Vorlage. */
    if(isInstance(e))return;
    var name=nameOf(e).toLowerCase();
    var aliases=(((e.components||{}).Identity||{}).aliases||[]).join(" ").toLowerCase();
    if(!q){ vorn.push(e); return; }
    if(name.indexOf(q)===0) vorn.push(e);
    else if(name.indexOf(q)>=0||aliases.indexOf(q)>=0) hinten.push(e);
  });
  var byName=function(a,b){ return nameOf(a).localeCompare(nameOf(b),"en"); };
  return vorn.sort(byName).concat(hinten.sort(byName)).slice(0,limit||12);
}

/* A link field holds an article id but a person types a name. The input keeps
   the id on the node (`data-id`) and shows the name; the suggestion list is
   filtered through the field's own target constraint, so a Weapon field never
   offers a Place. Typing a name that matches nothing leaves the id empty —
   better than storing a name the resolver will not find later. */
function linkInput(pd,cur){
  var wrap=el("div",{class:"linkbox"});
  var known=ENT.get(cur);
  var inp=el("input",{class:"i",type:"text",autocomplete:"off",
    placeholder:"Type to search…",value:known?nameOf(known):""});
  inp.dataset.id=known?known.id:"";
  var list=el("div",{class:"sugg"});
  /* Beim Übernehmen eines Vorschlags läuft derselbe `input`, mit dem sonst
     das Tippen die Id verwirft. Ohne diese Sperre löschte die Auswahl genau
     das, was sie eben gesetzt hat — das Feld sah gefüllt aus und speicherte
     nichts. */
  var waehlt=false;
  function hide(){ list.textContent=""; list.style.display="none"; }
  function show(){
    var treffer=linkCandidates(pd.target,inp.value,10);
    list.textContent="";
    if(!treffer.length){ hide(); return; }
    treffer.forEach(function(t){
      var b=el("button",{type:"button",onmousedown:function(ev){
        ev.preventDefault();
        waehlt=true;
        inp.value=nameOf(t); inp.dataset.id=t.id; hide();
        inp.dispatchEvent(new Event("input",{bubbles:true}));
        /* Einen Vorschlag zu übernehmen ist eine fertige Änderung, kein
           Tippen. Ohne `change` merkt das Bearbeiten in der Ansicht nichts
           davon — das Feld zeigte den Namen und speicherte nie. */
        inp.dispatchEvent(new Event("change",{bubbles:true}));
        waehlt=false;
      }});
      b.appendChild(el("b",{text:nameOf(t)}));
      b.appendChild(el("em",{text:ifaceName(t)}));
      list.appendChild(b);
    });
    list.style.display="block";
  }
  inp.addEventListener("focus",show);
  inp.addEventListener("input",function(){
    if(waehlt)return;
    /* Was getippt wird, ist erst eine Absicht. Die Id fällt weg, bis wieder
       ein Artikel gewählt ist — sonst zeigt das Feld einen Namen und speichert
       einen anderen Artikel. */
    inp.dataset.id="";
    show();
  });
  inp.addEventListener("blur",function(){ setTimeout(hide,150); });
  wrap.appendChild(inp); wrap.appendChild(list);
  hide();
  wrap.value="";
  Object.defineProperty(wrap,"value",{
    get:function(){ return inp.dataset.id||""; },
    set:function(v){ var t=ENT.get(v); inp.value=t?nameOf(t):""; inp.dataset.id=t?v:""; }
  });
  wrap.addEventListener=function(t,f){ inp.addEventListener(t,f); };
  return wrap;
}

/* ---------- mehrere Verweise ----------
   `Visibility.revealedTo` und `hiddenFrom` nennen **Träger**: eine Figur,
   eine Gruppe, eine Fraktion, einen Reisetrupp — und oft mehr als einen.
   Mit `linkInput` daran stand dort einer, und der zweite fiel beim
   Speichern weg; mit der Freitext-Listeneingabe daneben musste man Ids
   tippen, und eine getippte Id ist entweder richtig oder unauffindbar.

   Also: die gewählten als Marken mit einem ×, und darunter dasselbe
   Suchfeld wie beim einzelnen Verweis. Nach ausserhalb sieht der Kasten
   aus wie ein Textfeld — `value` gibt die Ids durch Komma getrennt zurück,
   und damit liest `fieldValue` ihn wie jede andere Liste. Ein zweiter Weg
   durch dieselbe Funktion wäre eine zweite Stelle, an der eine Liste
   anders gespeichert wird. */
function linksInput(pd,cur){
  var ids=Array.isArray(cur)?cur.map(String).filter(Boolean)
    :(typeof cur==="string"&&cur!==""
      ?String(cur).split(",").map(function(x){return x.trim();}).filter(Boolean):[]);
  var wrap=el("div",{class:"linksbox"});
  var marken=el("div",{class:"linkchips"});
  var sucher=linkInput(pd,"");
  function melde(){
    wrap.dispatchEvent(new Event("input",{bubbles:true}));
    wrap.dispatchEvent(new Event("change",{bubbles:true}));
  }
  function zeichne(){
    marken.textContent="";
    if(!ids.length) marken.appendChild(el("span",{class:"dim",text:"nobody yet"}));
    ids.forEach(function(id){
      var ziel=ENT.get(id);
      var chip=el("span",{class:"linkchip"+(ziel?"":" gone")});
      chip.appendChild(el("b",{text:ziel?nameOf(ziel):id}));
      chip.appendChild(el("button",{class:"x",type:"button",title:"Remove",
        onclick:function(ev){
          ev.preventDefault(); ev.stopPropagation();
          ids=ids.filter(function(x){ return x!==id; });
          zeichne(); melde();
        }},"\u00d7"));
      marken.appendChild(chip);
    });
  }
  /* Der Sucher meldet `change`, sobald ein Vorschlag übernommen ist. Dann
     wandert die Id in die Marken und das Feld ist wieder leer — sonst
     müsste man es vor dem nächsten Träger von Hand löschen. */
  sucher.addEventListener("change",function(){
    var id=sucher.value;
    if(!id)return;
    if(ids.indexOf(id)<0) ids.push(id);
    sucher.value="";
    zeichne(); melde();
  });
  zeichne();
  wrap.appendChild(marken); wrap.appendChild(sucher);
  Object.defineProperty(wrap,"value",{
    get:function(){ return ids.join(", "); },
    set:function(v){
      ids=String(v||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
      zeichne();
    }
  });
  return wrap;
}

/* Standardwerte beim Anlegen. Bis hierher stand `Status: idea` fest im Code —
   also genau die Sorte Wissen, die laut Rückgrat eine Registerzeile sein soll.
   Jetzt trägt das Feld seinen Standard, und wer ihn ändert, ändert ihn für
   alles, was danach entsteht. Rückwirkend gilt er nicht: vorhandene Artikel
   still zu beschreiben hiesse, Werte zu setzen, die niemand eingetragen hat.

   Gefüllt werden nur Komponenten, die der Artikel schon trägt — also die,
   die seine Art verlangt. Eine Karte allein deshalb anzulegen, weil eines
   ihrer Felder einen Standard hat, brachte jedem Artikel eine
   Sichtbarkeits-Karte, die niemand wollte. Seit die Felder der Art gehören,
   stellt sich die Frage anders: eine Karte heisst nach der Art, und wer von
   dieser Art ist, hat sie — leer oder gefüllt. Angelegt wird sie trotzdem
   nur, wenn etwas drinsteht (siehe `reqFor`); `default` heisst weiter „falls
   der Wert fehlt, gilt dieser". */
function applyDefaults(e,ifn){
  e.components=e.components||{};
  compsFor(ifn).forEach(function(cn){
    var card=e.components[cn];
    if(!card)return;
    var props=((REG.interfaces[cn]||{}).schema||{}).properties||{};
    Object.keys(props).forEach(function(k){
      if(props[k].derived||props[k]["default"]===undefined)return;
      if(card[k]===undefined) card[k]=props[k]["default"];
    });
  });
}

/* ---------- Assets (REQ-021, 145, 147, 148) ----------
   Ein Bildverweis kann dreierlei sein: ein Artikel vom Typ Asset, eine
   Ablage-Id im Artefakt, oder eine fremde Adresse. Verbraucher fragen nie,
   welche Art es ist — sie rufen `assetSrc` und bekommen eine Adresse. Genau
   das meint REQ-021 mit „consumers resolve URLs via asset service": wechselt
   die Ablage, ändert sich diese Funktion und sonst nichts.

   Die Id ist der haltbare Zeiger, nicht die Adresse: die Ablage-Adresse gilt
   je Ansicht, die Id für immer. Gespeichert wird deshalb die Id. */
var ASSET_IFACE="Asset", ASSET_COMP="Asset", IMAGE_COMP="Image";
function assetSrc(ref,tiefe){
  var t=String(ref==null?"":ref).trim();
  if(!t)return "";
  if((tiefe||0)>3)return "";                      /* Artikel zeigt im Kreis */
  var art=ENT.get(t);
  if(art) return assetSrc(((art.components||{})[ASSET_COMP]||{}).ref,(tiefe||0)+1);
  if(/^(https?:|data:|blob:)/i.test(t))return t;
  if(t.charAt(0)==="/")return t;
  if(/^[0-9a-f]{32}$/i.test(t))return "/_blob/"+t;  /* Ablage-Id des Artefakts */
  return t;
}
/* Wie gross die Ablage ist und wie voll — Hauswirtschaft, keine Galerie:
   was ein Bild bedeutet, steht im Artikel, nicht in der Ablage. */
function assetUsage(){
  if(!assetStore||!assetStore.list)return Promise.resolve(null);
  return assetStore.list().then(function(r){ return r&&r.usage||null; })
    .catch(function(){ return null; });
}
var ASSET_FEHLER={
  too_large:"The file is over the limit (20 MB, SVG 2 MB).",
  unsupported_type:"That file type cannot be stored — PNG, JPEG, GIF, WebP, SVG, MP4, WebM or PDF.",
  quota_or_state:"The asset store is full. Remove an asset nothing points at.",
  rate_limited:"Too many uploads in a row. Wait a moment.",
  not_granted:"This view may not upload.",
  capability_disabled:"The asset store is not available in this view."
};
/* Hochladen und den Verweis zurückgeben. Fehlschläge kommen als Text, den
   man hinschreiben kann — ein Code allein sagt dem Nutzer nichts. */
function uploadAsset(file){
  if(!assetStore)return Promise.reject(new Error("No asset store in this view — use a URL instead."));
  return assetStore.upload(file).then(function(r){ return r; })
    .catch(function(x){
      var c=(x&&x.code)||"";
      throw new Error(ASSET_FEHLER[c]||("Upload failed ("+(c||"unknown")+")"));
    });
}
/* Ein Asset ist ein Artikel: so trägt es Marken, eine Quellenangabe und eine
   Sichtbarkeit, und dieselbe Datei kann von zwei Karten benutzt werden, ohne
   zweimal dazuliegen. */
function newAssetArticle(name,res){
  var e={ id:uid("as"), interfaces:[ASSET_IFACE], name:name,
    components:{ Identity:{name:name,id:nextId("Asset"),aliases:[]} },
    adhoc:[], relations:[], createdAt:new Date().toISOString() };
  reqFor(ASSET_IFACE).forEach(function(c){ if(!e.components[c]&&REG.interfaces[c]) e.components[c]={}; });
  applyDefaults(e,ASSET_IFACE);
  e.components[ASSET_COMP]=Object.assign(e.components[ASSET_COMP]||{},{
    backend:"app", ref:res.id, mime:res.contentType||"", bytes:res.sizeBytes||0 });
  ENT.set(e.id,e);
  persist(e);
  return e;
}

/* Ein Feld, das auf ein Bild zeigt. Drei Wege hinein, weil es drei Sorten
   Bild gibt: aus der Ablage laden, ein vorhandenes Asset wählen, oder eine
   fremde Adresse eintippen. Gespeichert wird immer nur der Verweis. */
function assetInput(pd,cur){
  var wrap=el("div",{class:"assetbox"});
  var vorschau=el("div",{class:"aprev"});
  var inp=el("input",{class:"i",type:"text",placeholder:"Asset, id or URL",
    value:String(cur==null?"":cur)});
  var msg=el("div",{class:"err"});

  function zeichne(){
    vorschau.textContent="";
    var src=assetSrc(inp.value);
    if(!src){ vorschau.appendChild(el("span",{class:"hint",text:"no image"})); return; }
    var img=el("img",{src:src,alt:""});
    img.addEventListener("error",function(){
      vorschau.textContent=""; vorschau.appendChild(el("span",{class:"gone",text:"cannot be loaded"})); });
    vorschau.appendChild(img);
  }
  inp.addEventListener("input",zeichne);

  var bar=el("div",{class:"addbar"});
  var vorhanden=el("select",{class:"i"});
  function fuelle(){
    vorhanden.textContent="";
    vorhanden.appendChild(el("option",{value:""},"— pick an asset —"));
    byName().forEach(function(a){
      if(((a.interfaces||[])[0])!==ASSET_IFACE)return;
      vorhanden.appendChild(el("option",{value:a.id},nameOf(a)));
    });
  }
  fuelle();
  vorhanden.addEventListener("change",function(){
    if(!vorhanden.value)return;
    inp.value=vorhanden.value; zeichne();
    inp.dispatchEvent(new Event("change",{bubbles:true}));
  });
  bar.appendChild(vorhanden);

  if(canWrite()&&assetStore){
    var datei=el("input",{type:"file",accept:"image/*",style:"display:none"});
    var knopf=el("button",{class:"btn sm",type:"button",onclick:function(){ datei.click(); }},"Upload…");
    datei.addEventListener("change",function(){
      var f=datei.files&&datei.files[0]; if(!f)return;
      knopf.disabled=true; knopf.textContent="Uploading…"; msg.textContent="";
      uploadAsset(f).then(function(res){
        var a=newAssetArticle(f.name.replace(/\.[^.]+$/,"")||"Asset",res);
        inp.value=a.id; zeichne(); fuelle();
        inp.dispatchEvent(new Event("change",{bubbles:true}));
      }).catch(function(x){ msg.textContent=x.message; })
        .then(function(){ knopf.disabled=false; knopf.textContent="Upload…"; });
    });
    bar.appendChild(knopf); bar.appendChild(datei);
  } else if(canWrite()){
    bar.appendChild(el("span",{class:"hint",text:"No asset store here — paste a URL."}));
  }

  wrap.appendChild(vorschau);
  wrap.appendChild(inp);
  wrap.appendChild(bar);
  wrap.appendChild(msg);
  zeichne();
  Object.defineProperty(wrap,"value",{
    get:function(){ return inp.value.trim(); },
    set:function(v){ inp.value=v==null?"":String(v); zeichne(); }
  });
  wrap.addEventListener=function(t,f){ inp.addEventListener(t,f); };
  return wrap;
}

/* ---------- one input for one field ----------
   The dialog and the in-place editing share it. Two code paths for the same
   field would drift, and the one used less often would be the one that
   quietly stops matching the schema. */
/**
 * **Was in diesem Feld schon dasteht** — als Vorschlagsliste.
 *
 * Ein freies Wort ist frei, damit eine neue Sorte ein Eintrag ist und
 * keine Registeränderung. Der Preis wäre, dass dieselbe Sorte dreimal
 * anders geschrieben dasteht: „npc", „NPC", „Npc". Also schlägt die Maske
 * vor, was andere Artikel in **diesem** Feld tragen — gezogen aus dem
 * Bestand und nicht aus einer gepflegten Liste, denn eine gepflegte Liste
 * wäre die Aufzählung, die das Feld bewusst nicht ist.
 */
/* **Vorgeschlagen wird nur, wo das Feld es sagt** (`suggest`) — eine Sorte
   wie `Creature.kind`, die dreimal anders geschrieben drei Sorten wäre.
   Es galt einmal für jedes freie Textfeld, und der Deckname bot die
   Decknamen anderer Artikel an. Und nur aus Artikeln, die man sehen darf:
   sonst stünde in der Auswahl, was in der Liste fehlt. */
function feldVorschlaege(ref,pd){
  if(!ref||!ref.type||!ref.key) return [];
  if(!(pd&&pd.suggest)) return [];
  var gesehen={};
  ENT.forEach(function(e){
    if(!articleVisible(e)) return;
    var v=((e.components||{})[ref.type]||{})[ref.key];
    if(typeof v!=="string") return;
    var t=v.trim(); if(!t||t.length>40) return;
    gesehen[t]=(gesehen[t]||0)+1;
  });
  return Object.keys(gesehen).sort(function(a,b){
    return gesehen[b]-gesehen[a]||a.localeCompare(b);
  }).slice(0,25);
}
function fieldInput(pd,cur,ref){
  var kind=fieldKind(pd);
  /* Steht nichts drin, aber ein Standard ist gesetzt, zeigt ihn das Feld als
     Vorschlag an — sichtbar, aber nicht gespeichert, bis jemand bestätigt. */
  if(cur===undefined&&pd&&pd["default"]!==undefined) cur=pd["default"];
  if(kind==="color")
    return el("input",{class:"i",type:"color",
      value:/^#[0-9a-fA-F]{6}$/.test(String(cur||""))?String(cur):"#888888"});
  if(kind==="link") return linkInput(pd,cur);
  if(kind==="links") return linksInput(pd,cur);
  if(kind==="asset") return assetInput(pd,cur);
  if(kind==="date") return el("input",{class:"i",type:"text",
    placeholder:"1492-07-03 or Mirtul 12, 1492 DR",value:cur==null?"":String(cur)});
  if(kind==="choices") return choiceListInput(pd,cur);
  if(kind==="grid") return gridInput(pd,cur);
  if(kind==="zones") return zonesInput(pd,cur);
  var werte=enumWerte(pd);
  if(werte){
    var sel=el("select",{class:"i"});
    sel.appendChild(el("option",{value:""},"—"));
    werte.forEach(function(o){ sel.appendChild(el("option",{value:o},o)); });
    sel.value=cur==null?"":String(cur);
    return sel;
  }
  if(pd.type==="number"||pd.type==="integer"){
    /* Grenzen gehören an die Eingabe, nicht nur in die Prüfung: eine Zahl
       erst abzulehnen, wenn sie dasteht, ist die zweitbeste Auskunft. */
    var zahl=el("input",{class:"i",type:"number",value:cur==null?"":String(cur)});
    if(typeof pd.min==="number") zahl.setAttribute("min",String(pd.min));
    if(typeof pd.max==="number") zahl.setAttribute("max",String(pd.max));
    if(typeof pd.min==="number"&&typeof pd.max==="number")
      zahl.setAttribute("placeholder",pd.min+"–"+pd.max);
    return zahl;
  }
  if(pd.format==="long"){
    var ta=el("textarea",{class:"i"}); ta.value=cur==null?"":String(cur); return ta;
  }
  if(pd.type==="array")
    return el("input",{class:"i",type:"text",value:Array.isArray(cur)?cur.join(", "):""});
  if(pd.type==="object"){
    var to=el("textarea",{class:"i code"}); to.value=JSON.stringify(cur||{},null,1); return to;
  }
  var frei=el("input",{class:"i",type:"text",value:cur==null?"":String(cur)});
  var vor=feldVorschlaege(ref,pd);
  if(vor.length){
    /* `datalist` und kein `select`: getippt wird, was noch nicht dasteht,
       und vorgeschlagen, was schon dasteht. */
    var liste=el("datalist",{id:uid("dl")});
    vor.forEach(function(x){ liste.appendChild(el("option",{value:x})); });
    frei.setAttribute("list",liste.id);
    /* Die Liste muss im Baum hängen, damit der Browser sie findet — sie
       kommt als Geschwister mit, und `field()` reicht beides durch. */
    var huelle=el("span",{class:"withlist"});
    huelle.appendChild(frei); huelle.appendChild(liste);
    Object.defineProperty(huelle,"value",{
      get:function(){ return frei.value; },
      set:function(v){ frei.value=v; },
    });
    huelle.addEventListener=function(t,f){ frei.addEventListener(t,f); };
    return huelle;
  }
  return frei;
}
/* ---------- eine Form malen ----------
   `Item.rows` und `Container.grid` tragen beide dasselbe: ein Zeichen je
   Feld, `#` belegt und `.` frei. Als Textzeile war das eine Eingabe, deren
   Ergebnis man erst sah, wenn es woanders gezeichnet wurde — und beim
   Abzählen verrutscht eine Spalte, ohne dass es jemandem auffällt.

   Nach ausserhalb sieht der Kasten aus wie ein Textfeld: `value` gibt die
   Zeilen durch Komma getrennt zurück, und damit liest `fieldValue` ihn wie
   jede andere Liste. Ein zweiter Weg durch dieselbe Funktion wäre eine
   zweite Stelle, an der eine Liste anders gespeichert wird. */
var GRID_MAX=12;
function gridZeilen(cur){
  var rows=Array.isArray(cur)?cur.map(String)
    :(typeof cur==="string"&&cur!==""?String(cur).split(/[,\n]/):[]);
  rows=rows.map(function(r){ return r.trim(); }).filter(function(r){ return r!==""; });
  if(!rows.length) rows=["#"];
  var w=rows.reduce(function(m,r){ return Math.max(m,r.length); },1);
  return rows.map(function(r){
    var out=r.split("");
    while(out.length<w) out.push(".");
    return out;
  });
}
function gridInput(pd,cur){
  var netz=gridZeilen(cur);
  var box=el("div",{class:"gridedit"});
  function text(){ return netz.map(function(r){ return r.join(""); }).join(","); }
  Object.defineProperty(box,"value",{
    get:function(){ return text(); },
    set:function(v){ netz=gridZeilen(v); zeichne(); },
  });
  function melde(){
    box.dispatchEvent(new Event("input",{bubbles:true}));
    box.dispatchEvent(new Event("change",{bubbles:true}));
  }
  function zeichne(){
    box.textContent="";
    var g=el("div",{class:"gridcells"});
    g.style.gridTemplateColumns="repeat("+netz[0].length+",18px)";
    netz.forEach(function(r,y){ r.forEach(function(c,x){
      var an=!EMPTY_CELL[c];
      var b=el("button",{class:"gc"+(an?" on":""),type:"button",
        title:(x+1)+", "+(y+1),
        onclick:function(){ netz[y][x]=an?".":"#"; zeichne(); melde(); }});
      g.appendChild(b);
    }); });
    box.appendChild(g);
    var bar=el("div",{class:"addbar"});
    function knopf(t,titel,fn){ bar.appendChild(el("button",{class:"btn sm gh",type:"button",
      title:titel,onclick:function(){ fn(); zeichne(); melde(); }},t)); }
    knopf("+ col","One column wider",function(){
      if(netz[0].length>=GRID_MAX)return;
      netz.forEach(function(r){ r.push("#"); }); });
    knopf("\u2212 col","One column narrower",function(){
      if(netz[0].length<=1)return;
      netz.forEach(function(r){ r.pop(); }); });
    knopf("+ row","One row taller",function(){
      if(netz.length>=GRID_MAX)return;
      var r=[]; for(var i=0;i<netz[0].length;i++) r.push("#");
      netz.push(r); });
    knopf("\u2212 row","One row shorter",function(){
      if(netz.length<=1)return; netz.pop(); });
    bar.appendChild(el("span",{class:"co",
      text:netz[0].length+"\u00d7"+netz.length+" \u00b7 "+
        netz.reduce(function(n,r){ return n+r.filter(function(c){
          return !EMPTY_CELL[c]; }).length; },0)+" cells"}));
    box.appendChild(bar);
  }
  zeichne();
  return box;
}

/* ---------- Zonen auf ein Raster malen ----------
   Was oben im Rucksack liegt, ist schneller in der Hand als was unten
   liegt. Die Zone sagt, was es kostet — und sie steht als **Wort** in der
   Karte (`{"x,y": "action"}`) und nicht als Nummer: eine Nummer wäre beim
   Umsortieren der Zeile `DrawTime` still die falsche Zone. */
/* Die Zeile, aus der die Zonen kommen, sagt das Feld (`enumRef`) — und
   nicht der Code. Gelesen wird sie über `enumWerte`, wie jede andere. */
function zonenListe(){
  var pd=((REG.interfaces[INV_IFACE]||{}).schema||{}).properties||{};
  return enumWerte(pd.zones)||enumWerte({enumRef:"DrawTime"})||[];
}
function zonenFarbe(v){
  var i=zonenListe().indexOf(v);
  return i<0?"":"z"+(i+1);
}
function zonesInput(pd,cur){
  var karte=(cur&&typeof cur==="object"&&!Array.isArray(cur))?thawed(cur):{};
  var werte=enumWerte(pd)||zonenListe();
  var box=el("div",{class:"gridedit"});
  var pinsel=werte[0]||"";
  Object.defineProperty(box,"value",{
    get:function(){ return JSON.stringify(karte); },
    set:function(v){ try{ karte=JSON.parse(v)||{}; }catch(x){ karte={}; } zeichne(); },
  });
  function melde(){
    box.dispatchEvent(new Event("input",{bubbles:true}));
    box.dispatchEvent(new Event("change",{bubbles:true}));
  }
  /* Gemalt wird auf das Raster des Behälters, den man gerade offen hat —
     eine Zone auf einem Feld, das es nicht gibt, wäre eine Angabe über
     nichts. Ohne Raster: das Rechteck aus den Einstellungen. */
  /* Gemalt wird auf das Raster des Behälters, den man gerade offen hat —
     eine Zone auf einem Feld, das es nicht gibt, wäre eine Angabe über
     nichts. Ohne eigenes Raster: das Rechteck aus den Einstellungen. */
  function netz(){ return containerGrid(writeCtx); }
  function zeichne(){
    box.textContent="";
    var form=netz();
    var pal=el("div",{class:"cwrap"});
    werte.forEach(function(v){
      pal.appendChild(el("button",{class:"chip "+zonenFarbe(v)+(v===pinsel?" on":""),
        type:"button",onclick:function(){ pinsel=v; zeichne(); }},v));
    });
    pal.appendChild(el("button",{class:"chip"+(pinsel===""?" on":""),type:"button",
      onclick:function(){ pinsel=""; zeichne(); }},"none"));
    box.appendChild(pal);
    var g=el("div",{class:"gridcells"});
    g.style.gridTemplateColumns="repeat("+form.cols+",18px)";
    for(var y=0;y<form.rows;y++)for(var x=0;x<form.cols;x++)(function(x,y){
      var schl=x+","+y;
      var jetzt=karte[schl]||"";
      var b=el("button",{class:"gc"+(form.at(x,y)?"":" blocked")+
          (jetzt?" "+zonenFarbe(jetzt):""),type:"button",
        title:(x+1)+", "+(y+1)+(jetzt?" \u00b7 "+jetzt:""),
        onclick:function(){
          if(pinsel) karte[schl]=pinsel; else delete karte[schl];
          zeichne(); melde(); }});
      g.appendChild(b);
    })(x,y);
    box.appendChild(g);
    box.appendChild(el("p",{class:"hint",style:"margin:4px 0 0",
      text:"Pick a draw time, then paint the cells it covers. What is not painted has no zone."}));
  }
  zeichne();
  return box;
}

/**
 * **Mehrere Werte aus einer oder mehreren Aufzählungszeilen.**
 *
 * Häkchen und kein Mehrfach-Auswahlfeld: fünfunddreissig Wörter in einem
 * `select multiple` sind eine Liste, in der man mit der Maus rutscht und
 * seine Wahl wieder verliert. Gruppiert nach Zeile, weil „geübt in" aus
 * Fertigkeiten, Werkzeugen, Sprachen, Waffen, Rüstungen und Wissensgebieten
 * kommt und die Herkunft die halbe Auskunft ist.
 *
 * Nach ausserhalb sieht der Kasten aus wie ein Textfeld: `value` gibt die
 * Werte durch Komma getrennt zurück, und damit liest `fieldValue` ihn wie
 * jede andere Liste — ein zweiter Weg durch dieselbe Funktion wäre eine
 * zweite Stelle, an der eine Liste anders gespeichert wird.
 */
function choiceListInput(pd,cur){
  var gewaehlt=Array.isArray(cur)?cur.slice():(cur==null||cur===""?[]:String(cur)
    .split(",").map(function(x){return x.trim();}).filter(Boolean));
  var box=el("div",{class:"choicebox"});
  var gruppen=enumGruppen(pd);
  var eigene=Array.isArray(pd["enum"])&&pd["enum"].length?pd["enum"]:null;
  if(eigene) gruppen=[{name:"",label:"",values:eigene}].concat(gruppen);
  if(!gruppen.length){
    /* Kein Wort zur Wahl: dann ist es eine freie Liste, und die tippt man.
       Eine leere Häkchenliste wäre eine Maske, die nichts anbietet und
       nichts erklärt. */
    var frei=el("input",{class:"i",type:"text",
      value:gewaehlt.join(", "),placeholder:"comma separated"});
    return frei;
  }
  gruppen.forEach(function(g){
    if(g.label) box.appendChild(el("div",{class:"cgroup",text:g.label}));
    var reihe=el("div",{class:"cwrap"});
    g.values.forEach(function(v){
      var an=gewaehlt.indexOf(v)>=0;
      var lab=el("label",{class:"cchk"+(an?" on":"")});
      var cb=el("input",{type:"checkbox"});
      cb.checked=an;
      cb.addEventListener("change",function(){
        var i=gewaehlt.indexOf(v);
        if(cb.checked&&i<0) gewaehlt.push(v);
        if(!cb.checked&&i>=0) gewaehlt.splice(i,1);
        lab.className="cchk"+(cb.checked?" on":"");
        box.dispatchEvent(new Event("input",{bubbles:true}));
        box.dispatchEvent(new Event("change",{bubbles:true}));
      });
      lab.appendChild(cb);
      lab.appendChild(el("span",{text:humanKey(v)}));
      reihe.appendChild(lab);
    });
    box.appendChild(reihe);
  });
  Object.defineProperty(box,"value",{
    get:function(){ return gewaehlt.join(", "); },
    set:function(v){ /* Die Wahl steht in den Häkchen; ein Setzen von
                        aussen käme nur vom Zurücksetzen der Maske. */ },
  });
  return box;
}

/* Was aus so einem Eingang herauskommt, in der Form, die das Schema will.
   `undefined` heisst „kein Wert" und löscht das Feld — leer zu speichern
   hiesse, einen leeren String gegen eine Zahl zu halten. */
function fieldValue(pd,node){
  var raw=node.value;
  if(raw==="")return undefined;
  /* Ein gemaltes Raster gibt seine Zeilen als Komma-Liste zurück, eine
     Zonenkarte ihr JSON — beides liest der Zweig darunter schon richtig;
     hier steht nur, dass ein leeres Raster kein Wert ist. */
  if(pd.format==="zones"){
    try{ var z=JSON.parse(raw); return Object.keys(z||{}).length?z:undefined; }
    catch(x){ return undefined; }
  }
  if(pd.type==="number"||pd.type==="integer"){ var n=Number(raw); return isFinite(n)?n:undefined; }
  if(pd.type==="array") return raw.split(",").map(function(x){return x.trim();}).filter(Boolean);
  if(pd.type==="object"){ try{ return JSON.parse(raw); }catch(x){ return undefined; } }
  return raw;
}

/* ---------- small helpers ---------- */
function el(t,a,kids){var n=document.createElement(t);
  if(a)for(var k in a){ if(k==="class")n.className=a[k];
    else if(k==="text")n.textContent=a[k];
    else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),a[k]);
    else if(a[k]!==null&&a[k]!==false&&a[k]!==undefined)n.setAttribute(k,a[k]); }
  if(kids)(Array.isArray(kids)?kids:[kids]).forEach(function(c){ if(c==null)return;
    n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;}
function uid(p){return (p||"e")+"_"+Math.random().toString(36).slice(2,9);}
function slug(s){return String(s||"").toLowerCase()
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"unnamed";}
function esc(s){return String(s==null?"":s);}
/* Der gespeicherte Name. Zum Auflösen und zum Schreiben — nie zum Anzeigen,
   solange ein Deckname gelten könnte. */
function rawName(e){return e&&(e.name||(e.components&&e.components.Identity&&e.components.Identity.name))||"Unnamed";}
/* ---------- Marken ----------
   Sie waren die einzige Eigenschaft, die keiner Art gehörte — und damit die
   einzige, die man nirgends weglassen konnte. Jetzt sind sie ein
   Bestandteil (`Tags`), den jede Artikelart erbt und den eine neue Art
   weglassen darf. Gelesen und geschrieben wird er nur hier: sonst stünde
   `components.Tags.tags` an dreissig Stellen und die einunddreissigste
   vergässe das `||[]`. */
var TAGS_COMP="Tags";
function tagsOf(e){
  var t=e&&e.components&&e.components[TAGS_COMP]&&e.components[TAGS_COMP].tags;
  return Array.isArray(t)?t:[];
}
/* Leer heisst weg: abwesend ist „trägt keine Marken", und eine leere Karte
   wäre eine dritte Antwort auf eine Frage mit zwei. */
function setTags(e,xs){
  var sauber=(xs||[]).map(function(x){return String(x).trim();}).filter(Boolean);
  if(!e.components) e.components={};
  if(sauber.length) e.components[TAGS_COMP]={tags:sauber};
  else delete e.components[TAGS_COMP];
}
/* Der angezeigte Name (REQ-178). Ist der eigene Name von einer Information
   beansprucht, die dieser Betrachter nicht kennt, steht der Deckname da —
   und wenn keiner gesetzt ist, ein ehrliches „jemand".
   Das gilt für die strukturierten Stellen: Titel, Listen, Tokens, Bezüge.
   Fliesstext, in dem die Spielleitung den Namen geschrieben hat, deckt es
   nicht zu; das wäre ein Versprechen, das die Seite nicht halten kann. */
function nameOf(e){
  if(!e)return "Unnamed";
  var echt=rawName(e);
  if(isGM())return echt;
  var id=(e.components||{}).Identity||{};
  if(!id.cover)return echt;
  var frei=visibleRefs(e,["Identity.name"]);
  return frei.length?echt:id.cover;
}
function byName(){return Array.from(ENT.values()).sort(function(a,b){
  return nameOf(a).localeCompare(nameOf(b),"de");});}

/* ---------- registry access ---------- */
function ifaceOf(e){ var n=(e.interfaces&&e.interfaces[0])||""; return REG.interfaces[n]||null; }
function ifaceName(e){ var d=ifaceOf(e); return d?(d.label||d.name):((e.interfaces&&e.interfaces[0])||"—"); }
/* Die Arten, deren Felder hier gelten: diese und alle Obertypen. Das ist
   zugleich die Liste der Karten, die ein Artikel tragen darf — eine Karte
   heisst nach der Art, die ihre Felder erklärt. */
function compsFor(name){
  return selfAndAncestors(name).filter(function(n){ return REG.interfaces[n]; });
}
/* Das Schema einer Art: ihre **eigenen** Felder, nicht die geerbten. */
function schemaOf(n){
  var d=REG.interfaces[n]||{};
  return d.schema||{type:"object",properties:{}};
}
function propsOf(n){ return schemaOf(n).properties||{}; }
/* Welche Karten ein neuer Artikel gleich bekommt: die, in denen etwas steht,
   sobald er sie hat — ein Pflichtfeld oder ein Vorgabewert. Eine Karte ohne
   beides bliebe leer, und eine leere Karte sagt nichts.

   Früher entschied das `requires` an der Schnittstelle. Das gibt es nicht
   mehr, und es taugte auch wenig: 13 von 18 Einträgen verlangten eine Karte
   ohne ein einziges Pflichtfeld. */
function reqFor(name){
  return compsFor(name).filter(function(n){
    var sc=schemaOf(n);
    if((sc.required||[]).length) return true;
    var props=sc.properties||{};
    return Object.keys(props).some(function(k){
      return !props[k].derived && props[k]["default"]!==undefined; });
  });
}
/* ---------- registry: hierarchy and provenance ---------- */
/* Subtypen sind keine eigene Sorte Zeile: eine Schnittstelle, die eine andere
   erweitert, ist deren Subtyp. Material erweitert Gegenstand, mehr steht da
   nicht. Damit bleibt „Subtyp anlegen" eine eingefügte Zeile. */
/* `extends` ist ein **Array**: eine Art darf von mehreren erben. Das stand
   immer schon im Schema, und der Code las überall nur `[0]` — für die
   Felder lief die Vererbung über alle (`compsFor` geht `forEach`), für
   Kanten, Bereich und Anordnung nur über den ersten. Zwei Antworten auf
   dieselbe Frage, und die eine war still falsch.

   Getrennt wird jetzt sauber: **`parentOf` ist fürs Zeichnen** — ein Baum
   hat einen Ast je Knoten, und das ist der erste Obertyp. **`ancestorsOf`
   ist für die Bedeutung** und läuft alle ab. */
function parentsOf(n){
  return ((REG.interfaces[n]||{}).extends||[]).filter(function(p){ return REG.interfaces[p]; });
}
function parentOf(n){ return parentsOf(n)[0]||""; }
/* Breitenweise, der erste Obertyp zuerst: die Reihenfolge entscheidet,
   welche Antwort gewinnt, wenn zwei Äste etwas sagen. Der näher stehende
   und weiter vorn genannte gewinnt — dieselbe Regel, nach der man eine
   Aufzählung liest. */
function ancestorsOf(n){
  var out=[], seen={}, q=parentsOf(n).slice(), g=0;
  while(q.length&&g++<256){
    var a=q.shift();
    if(!a||seen[a])continue;
    seen[a]=1; out.push(a);
    parentsOf(a).forEach(function(x){ q.push(x); });
  }
  return out;
}
/* Die Art selbst und alles darüber — die Kette, in der eine Frage nach
   oben gestellt wird. */
function selfAndAncestors(n){ return [n].concat(ancestorsOf(n)); }
function kindsOf(n){
  return Object.keys(REG.interfaces).filter(function(k){ return parentOf(k)===n; })
    .sort(function(a,b){return a.localeCompare(b,"de");});
}
function ifaceRoots(){
  return Object.keys(REG.interfaces).filter(function(n){ return !parentOf(n); })
    .sort(function(a,b){return a.localeCompare(b,"de");});
}
/**
 * **Alle Artikelarten, flach und alphabetisch** — dieselbe Ordnung für die
 * Leiste, den Filter im Kompendium und die Auswahl im Register.
 *
 * Sie standen dreimal als Baum: nach Bereich gruppiert, nach Unterart
 * eingerückt. Der Baum kam aus `extends`, und `extends` ist ein Array —
 * also musste er sich für **eine** Herkunft entscheiden, und jede Art, die
 * von zweien erbt, hing unter einer davon und unter der anderen nicht. Wer
 * sie dort suchte, fand sie nicht und hielt sie für nicht vorhanden.
 *
 * Woher eine Art erbt, steht auf ihrer Seite im Register — dort
 * vollständig, und dort wird es auch geändert.
 */
function typeList(){
  return Object.keys(REG.interfaces).sort(function(a,b){
    var da=REG.interfaces[a]||{}, db=REG.interfaces[b]||{};
    return String(da.label||a).localeCompare(String(db.label||b),"de");
  });
}
/* ---------- Bereiche ----------
   Vier statt eines Kompendiums: **Story**, **World**, **Game**, **Play**.
   Welche Artikelart wohin gehört, steht als `area` an der Schnittstelle —
   also im Register und nicht hier. Sonst bräuchte eine neue Artikelart eine
   Codeänderung, um überhaupt auffindbar zu sein, und genau diese Sorte
   Ausnahme soll das Rückgrat nicht haben.

   Geerbt wird wie alles andere: eine Schnittstelle ohne eigene Angabe nimmt
   die ihres Obertyps. Ein NSC muss nicht wiederholen, dass Kreaturen zur
   Welt gehören. */
/* Vier **Bereiche** für Artikel. Register und Kompendium stehen daneben und
   sind keine: das eine zeigt die Zeilen, aus denen alles besteht, das andere
   alle Artikel ohne Rücksicht darauf, wo sie hingehören. */
var AREAS=[["world","World"],["history","History"],["rules","Rules"],["play","Play"]];
function areaOf(n){
  var kette=selfAndAncestors(n);
  for(var i=0;i<kette.length;i++){
    var a=(REG.interfaces[kette[i]]||{}).area;
    if(a)return a;
  }
  return "";
}
/* Hier stand `areaRoots()`: die obersten Arten eines Bereichs, für den
   Baum in der Leiste. Die Listen sind flach (`typeList()`), also braucht
   niemand mehr eine Wurzel. */
/* Würde `kind` unter `ganz above` hängen, entstünde ein Ring — dann fände
   compsFor() kein Ende. `seen` in compsFor fängt das ab, aber ein Register,
   das sich im Kreis dreht, ist trotzdem broken. Hier wird es verhindert. */
function wouldCycle(n,parent){
  if(parent===n)return true;
  return ancestorsOf(parent).indexOf(n)>=0;
}
/* Woher eine Karte an dieser Art kommt: aus ihr selbst oder von oben. */
function compOrigin(ifn,comp){
  if(ifn===comp) return {iface:comp,mode:"own"};
  return ancestorsOf(ifn).indexOf(comp)>=0 ? {iface:comp,mode:"inherited"} : null;
}
/* Welche Arten die Felder dieser Art mitbekommen — eines davon zu ändern
   ändert es bei allen. Das gehört hingeschrieben, bevor jemand es
   herausfindet. */
function ifacesUsing(comp){
  return Object.keys(REG.interfaces).filter(function(n){
    return n!==comp && ancestorsOf(n).indexOf(comp)>=0;
  }).sort();
}
function countIface(n){
  var c=0; ENT.forEach(function(e){ if(((e.interfaces||[])[0])===n) c++; }); return c;
}
function techName(label,taken){
  var base=slug(label).replace(/-([a-z])/g,function(_,c){return c.toUpperCase();})
    .replace(/^[a-z]/,function(c){return c.toUpperCase();})||"New";
  var n=base, i=2; while(taken[n]){ n=base+i; i++; }
  return n;
}

/* Steht ein Typ in dieser Liste — direkt, als „*", oder über einen seiner
   Obertypen? Exakt zu vergleichen hiesse: eine Kante, die an `Creature`
   hängt, erreicht kein einziges Geschöpf, weil jedes ein Subtyp davon ist.
   Nach oben, nicht nach unten: `from: ["NPC"]` gilt für NPCs, nicht für
   alles, was Geschöpf ist. */
function ifaceInList(list,ifn){
  if(!list||!list.length||list.indexOf("*")>=0)return true;
  return selfAndAncestors(ifn).some(function(a){ return list.indexOf(a)>=0; });
}
function relsFrom(ifn){
  var out=[];
  for(var k in REG.relations){ var r=REG.relations[k];
    if(ifaceInList(r.from,ifn)) out.push(Object.assign({type:k},r)); }
  return out;
}
function relDef(t){ var r=REG.relations[t]; return r?Object.assign({type:t},r):{type:t,label:t,inverseLabel:"← "+t,to:["*"]}; }

/* ---------- Validation: dieselben Regeln wie validateEntity im Modellpaket ---------- */
function checkArticle(e){
  /* Eine Instanz wird **aufgelöst** geprüft: ihre Pflichtfelder stehen an
     der Vorlage, und eine Wache ohne eigene Trefferpunkte ist keine
     unvollständige Wache. */
  e=resolvedOf(e);
  var problems=[], ifn=(e.interfaces||[])[0];
  if(!ifn||!REG.interfaces[ifn]){
    return [{t:"Unknown interface: "+(ifn||"(none)")}];
  }
  var kette=compsFor(ifn), erlaubt={};
  kette.forEach(function(c){erlaubt[c]=1;});

  /* Eine Karte, die keine Art dieses Artikels nennt, ist kein Tippfehler im
     Register, sondern ein Wert ohne Erklärung: es gibt kein Feld, das ihn
     beschreibt, und keine Ansicht, die ihn zeigt. */
  Object.keys(e.components||{}).forEach(function(c){
    if(!REG.interfaces[c]) problems.push({t:c+" is not a type in the registry"});
    else if(!erlaubt[c]) problems.push({t:(REG.interfaces[ifn].label||ifn)+" does not inherit from "+(REG.interfaces[c].label||c)});
  });

  /* Pflichtfelder gelten für die ganze Kette, auch wenn die Karte gar nicht
     da ist: eine fehlende Karte ist kein leerer Wert, sondern derselbe. */
  kette.forEach(function(c){
    var cd=REG.interfaces[c]; if(!cd||!cd.schema)return;
    (cd.schema.required||[]).forEach(function(p){
      var pd=(cd.schema.properties||{})[p];
      if(pd&&pd.derived)return;                       // abgeleitet wird nie gespeichert
      var val=((e.components||{})[c]||{})[p];
      if(val===undefined||val===""||val===null)
        problems.push({t:(cd.label||c)+" \u00b7 "+((pd&&pd.title)||p)+" is required"});
    });
  });

  /* **Ein Verweisfeld hält eine Id, und die Id gehört zu einer Art.**
     Geprüft wird die Art und nur die: Marken und Feldwert aus `target`
     lesen den heutigen Zustand des Ziels, und ein entfernter Marker würde
     einen längst gespeicherten Verweis rückwirkend falsch machen. Die Art
     eines Artikels ändert sich nicht, weil jemand anderes etwas
     bearbeitet — also hält sie. */
  kette.forEach(function(c){
    var cd=REG.interfaces[c]; if(!cd||!cd.schema)return;
    var props=cd.schema.properties||{};
    var karte=(e.components||{})[c]; if(!karte)return;
    Object.keys(props).forEach(function(k){
      var pd=props[k];
      if(!pd||pd.format!=="link"||pd.derived)return;
      var werte=Array.isArray(karte[k])?karte[k]:[karte[k]];
      werte.forEach(function(v){
        if(v===undefined||v===null||v==="")return;
        var ziel=ENT.get(String(v));
        var wie=(pd.title||k);
        if(!ziel){
          problems.push({t:(cd.label||c)+" \u00b7 "+wie+" points at an article that does not exist"});
          return;
        }
        var arten=(pd.target||{}).interfaces||[];
        if(!arten.length)return;
        if(!targetMatches({interfaces:arten},ziel)){
          problems.push({t:(cd.label||c)+" \u00b7 "+wie+" points at a "+ifaceName(ziel)
            +", but only "+arten.map(function(n){return (REG.interfaces[n]||{}).label||n;}).join(", ")
            +" is allowed"});
        }
      });
    });
  });

  (e.relations||[]).forEach(function(r){
    if(!REG.relations[r.type]) problems.push({t:"Relation type "+r.type+" is not in the registry"});
    if(!ENT.get(r.to)) problems.push({t:relDef(r.type).label+" points at an article that does not exist",id:r.id});
  });

  return problems;
}

/* ---------- {VAR} resolution (REQ-174) ---------- */
// order: per-reference bindings → entity defaults → campaign register
function fillVars(text,refVars,ent){
  var entVars=(ent&&ent.components&&ent.components.Vars&&ent.components.Vars.bindings)||{};
  /* Die gerechneten Kampagnenwerte stehen zwischen dem Artikel und dem
     Register — und sie gewinnen gegen eine gleichnamige Registerzeile.
     Sonst überdeckte eine einmal eingetippte Gruppenstufe für immer die
     richtige, und niemand bemerkte es (B3, D8). */
  var rechnung=campaignVars();
  return String(text==null?"":text).replace(/\{([A-Z0-9_ÄÖÜ]+)\}/g,function(m,k){
    var v=(refVars&&refVars[k])!=null?refVars[k]
         :(entVars[k]!=null?entVars[k]
         :(rechnung[k]!=null&&rechnung[k]!==""?rechnung[k]
         :(REG.vars[k]!=null?REG.vars[k]:null)));
    return v==null?m:"\u0001"+v+"\u0002";   // sentinels -> <span class=vr> at render
  });
}

/* ---------- inline rendering: [[links]] + resolved vars ---------- */
function findByName(n){
  var t=String(n||"").trim().toLowerCase();
  var hit=null;
  ENT.forEach(function(e,id){ if(hit)return;
    /* Aufgelöst wird gegen den gespeicherten Namen: ein Verweis muss auch
       dann ankommen, wenn der Betrachter nur den Decknamen sieht. */
    if(rawName(e).toLowerCase()===t){hit=id;return;}
    var al=(e.components&&e.components.Identity&&e.components.Identity.aliases)||[];
    for(var i=0;i<al.length;i++) if(String(al[i]).toLowerCase()===t){hit=id;return;} });
  return hit;
}
/* Ein Verweis im Text führt zum Artikel — und zeigt vorher, worauf er
   zeigt. **Immer die Übersicht**: Name und Beschreibung, wie ein Hover.
   Mehr hat neben einem Satz keinen Platz, und wer mehr will, klickt.

   Gebaut wird der Blick erst beim Hinfahren: eine Seite mit vierzig
   Verweisen zeichnete sonst vierzig Artikel mit, von denen man keinen
   anschaut. */
function refWithPeek(id,show){
  var w=el("span",{class:"refw"});
  var b=el("button",{class:"ref",type:"button",
    onclick:function(){ go({k:"art",id:id}); }},show);
  w.appendChild(b);
  var gebaut=false;
  function zeig(){
    if(gebaut)return; gebaut=true;
    var t=ENT.get(id);
    if(!t||!articleVisible(t))return;
    var pop=el("span",{class:"refpop"});
    pop.appendChild(el("b",{text:nameOf(t)}));
    pop.appendChild(el("span",{class:"pill q",text:ifaceName(t)}));
    pop.appendChild(renderPlacement(t,VIEW_OVERVIEW,2));
    w.appendChild(pop);
  }
  b.addEventListener("mouseenter",zeig);
  b.addEventListener("focus",zeig);
  return w;
}

function inline(text,into){
  var s=String(text==null?"":text);
  var re=/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]|\u0001([^\u0002]*)\u0002|\*\*([^*]+)\*\*/g;
  var last=0,m;
  while((m=re.exec(s))){
    if(m.index>last) into.appendChild(document.createTextNode(s.slice(last,m.index)));
    if(m[1]!==undefined){
      var target=m[1].trim(), show=(m[2]||m[1]).trim(), id=findByName(target);
      if(id) into.appendChild(refWithPeek(id,show));
      // A dead link is an invitation, not an error: klicken legt den Artikel an.
      else   into.appendChild(el("button",{class:"ref dead",type:"button",
               title:canWrite()?"No article yet — create one":"No article named “"+target+"“",
               onclick:function(t){return function(){ if(canWrite())newEntity(t); };}(target)},show));
    } else if(m[3]!==undefined){
      into.appendChild(el("span",{class:"vr"},m[3]));
    } else {
      // Auszeichnung schachtelt: **{NAME}.** ist eine fette *Variable*.
      // Ohne Rekursion landet der Platzhalter als Rohtext im <strong>.
      into.appendChild(inline(m[4],el("strong")));
    }
    last=re.lastIndex;
  }
  if(last<s.length) into.appendChild(document.createTextNode(s.slice(last)));
  return into;
}
function para(text,cls){ return markRules(inline(text,el("p",cls?{class:cls}:null))); }

/* ---------- db wiring ---------- */
function persist(e){
  if(blockedByLoad())return Promise.resolve();
  /* Jeder Block bekommt beim Schreiben einen Anker, wenn er keinen hat.
     Eine Stelle, nicht sechs: an jedem Anlegeweg einzeln daran zu denken
     heisst, es an einem zu vergessen — und dort verliert der nächste Import
     dann die Wissenszuteilungen (B3). */
  /* Eine Instanz speichert nur, was von ihrer Vorlage abweicht. Hier und
     nicht an jeder Maske: die Masken bearbeiten den aufgelösten Artikel,
     und eine, die das vergässe, schriebe alle Werte der Vorlage fest. */
  if(isInstance(e)) e=thinned(e);
  ensureAnchors(e);
  e.updatedAt=new Date().toISOString();
  lastWroteAt[e.id]=e.updatedAt;
  ENT.set(e.id,e);
  render();
  if(!db){return Promise.resolve();}
  return db.doc("entities/"+e.id).set(e).catch(function(x){ fail(x); });
}
function drop(id){
  if(blockedByLoad())return;
  var weg=ENT.get(id);
  if(weg){
    /* **Eine Vorlage nimmt beim Gehen nichts mit.** Ihre Instanzen
       bekommen vorher, was sie von ihr lasen, und hängen danach an
       niemandem. */
    instancesOf(weg).forEach(function(i){ persist(detachInstance(i)); });
    /* **Eine Kreatur nimmt ihre Instanz mit.** Die steht in keiner Liste
       und gehört nur ihr; bliebe sie, wäre sie ein Statblock, den niemand
       mehr findet. Ein eigener Statblock ohne Vorlage bleibt stehen — der
       steht im Regelwerk und kann einer anderen Kreatur als Vorlage
       dienen —, nur seine Kante auf die Kreatur geht. */
    var teilVon={};
    Object.keys(REG.relations||{}).forEach(function(k){
      if((REG.relations[k]||{}).asField==="to") teilVon[k]=1; });
    ENT.forEach(function(o){
      if(o.id===id)return;
      var haengt=(o.relations||[]).some(function(r){ return teilVon[r.type]&&r.to===id; });
      if(!haengt)return;
      if(isInstance(o)){ drop(o.id); return; }
      /* Der eigene bleibt, aber ohne Kante ins Leere. */
      persist(Object.assign({},o,{relations:(o.relations||[]).filter(function(r){
        return !(teilVon[r.type]&&r.to===id); })}));
    });
  }
  ENT.delete(id); render();
  if(db) db.doc("entities/"+id).delete().catch(fail);
}
function saveReg(part){
  if(blockedByLoad())return Promise.resolve();
  if(!db)return Promise.resolve();
  return db.doc("registry/"+part).set(REG[part]).catch(fail);
}
function fail(x){
  var c=(x&&x.code)||"";
  if(c==="invalid_argument"){ me.base=false; UI.err="Write refused — this view is read only."; }
  else UI.err="Save failed ("+(c||"unknown")+")";
  render();
}

/* ============================================================
   RENDER
   ============================================================ */
function go(r){
  if(r.k==="art"&&r.id!==UI.route.id) trailPush(UI.route);
  if(r.k!=="art") UI.trail=[];
  /* Der Reiter gilt für **diesen** Artikel. Ihn mitzunehmen hiesse: von
     seinem eigenen Bogen auf einen NSC springen und auf „Craft" landen —
     und dort steht nichts, weil ein NSC nichts handwerkt. */
  if(r.k!=="art"||r.id!==UI.route.id) UI.tab="";
  UI.route=r; UI.err=""; UI.pane="main"; UI.editField=""; render();
  pushPresence();
  var m=document.getElementById("main"); if(m)m.scrollTop=0; }

/* Jeder Abschnitt für sich. Vorher konnte eine Ausnahme in renderRail()
   renderMain() verhindern — die Seite blieb dann auf „Lädt…" stehen und
   sagte nicht, warum. Ein sichtbarer Fehler ist besser als eine leere Seite. */
/* **Wo man war, bleibt man.**
   Gezeichnet wird die Seite ganz neu, und jeder Kasten mit eigenem Scroll
   fängt danach oben an. Wer unten in einer Feldliste ein Feld aufklappt,
   landete dadurch am Seitenanfang — und suchte die Stelle, an der er
   gerade war. Gemerkt wird über die Reihenfolge der Treffer: dieselben
   Kästen entstehen beim Zeichnen in derselben Ordnung. */
var SCROLLER=".main,.rail,.aside";
function scrollMerken(){
  var stand=[];
  document.querySelectorAll(SCROLLER).forEach(function(n){ stand.push(n.scrollTop); });
  return {stand:stand,fenster:window.scrollY||0};
}
function scrollZurueck(was){
  if(!was)return;
  var i=0;
  document.querySelectorAll(SCROLLER).forEach(function(n){
    var v=was.stand[i++];
    if(v) n.scrollTop=v;
  });
  if(was.fenster) window.scrollTo(0,was.fenster);
}
function render(){
  var broken=[];
  var wo=null;
  try{ wo=scrollMerken(); }catch(z){}
  [["Betrachter",renderAsSelect],["Krümel",renderTrail],
   ["Seiten",renderPages],["Seitenleiste",renderRail],["Content",renderMain],
   ["Bezüge",renderAside],["Bereiche",renderPanes]].forEach(function(t){
    try{ t[1](); }catch(x){ broken.push(t[0]+": "+(x&&x.message||x)); }
  });
  try{ scrollZurueck(wo); }catch(z2){}
  if(broken.length){
    try{
      var v=document.getElementById("view");
      if(v) v.insertBefore(el("div",{class:"banner",text:"Anzeigefehler — "+broken.join(" · ")}),v.firstChild);
      if(window.console) console.error("Atlas Mentis:",broken);
    }catch(y){}
  }
  /* Nach dem Zeichnen, weil es erst jetzt im Baum hängt. Die Grösse des
     Sichtfensters ändert sich mit dem Fenster und nicht mit dem Zoom —
     einmal gemerkt hält sie, bis jemand die Seite anders gross macht. */
  try{ noteMapBox(); }catch(z){}
}
function renderPanes(){
  var narrow=window.matchMedia("(max-width:900px)").matches;
  ["rail","main","aside"].forEach(function(p){
    var n=document.getElementById(p); if(!n)return;
    if(narrow){ n.classList.toggle("on",UI.pane===p); n.style.display=(UI.pane===p)?"":"none"; }
    else { n.classList.remove("on"); n.style.display=""; }
  });
  Array.prototype.forEach.call(document.querySelectorAll("#mob button"),function(b){
    b.setAttribute("aria-current",String(b.dataset.p===UI.pane)); });
}

/* ---------- left rail ---------- */
/* ---------- Die sechs Seiten ----------
   Register, Kompendium, Welt, Geschichte, Regelwerk, Spiel. Zwei davon sind
   keine Bereiche: das Register zeigt die Zeilen, aus denen alles besteht,
   das Kompendium alle Artikel ohne Rücksicht darauf, wo sie hingehören. Die
   vier anderen wählt eine Artikelart über `area` — im Code steht keine
   Liste davon, sonst bräuchte eine neue Art eine Codeänderung, um
   auffindbar zu sein. */
function currentPage(){
  if(UI.route.k==="reg"||UI.route.k==="types"||UI.route.k==="graph") return "registry";
  if(UI.route.k==="play") return "play";
  if(UI.route.k==="list") return UI.area||"compendium";
  if(UI.route.k==="tags") return "compendium";
  /* Ein Artikel gehört zu der Seite, in die seine Art fällt. */
  if(UI.route.k==="art"){
    var e=ENT.get(UI.route.id);
    var a=e?areaOf((e.interfaces||[])[0]):"";
    return a||"compendium";
  }
  return UI.page||"compendium";
}
function goPage(p){
  /* **Der Filter gehört der Seite.** Wer von einem Artikel auf seine Liste
     zurückgeht, will dieselbe Liste sehen wie vorher — ihn auch dann zu
     leeren hiesse, ihn jedes Mal neu zu setzen. Beim Wechsel auf eine
     **andere** Seite geht er weg, denn eine Artikelart aus dem Regelwerk
     filtert in der Welt nichts. */
  if(p!==currentPage()){ UI.iface=""; UI.tag=""; UI.status=""; UI.offen=false; }
  UI.page=p;
  if(p==="registry"){ if(!UI.regtab) UI.regtab="types"; UI.area=""; go({k:"reg"}); return; }
  if(p==="play"){ UI.area=""; go({k:"play"}); return; }
  UI.area=(p==="compendium"?"":p);
  go({k:"list"});
}
function renderPages(){
  var n=document.getElementById("pages"); if(!n)return;
  n.textContent="";
  var jetzt=currentPage();
  var seiten=[["registry","Registry"],["compendium","Compendium"]]
    .concat(AREAS.map(function(a){ return [a[0],a[1]]; }));
  /* Ein Spieler bekommt kein Register — es auszugrauen wäre eine Einladung. */
  if(!isGM()) seiten=seiten.filter(function(x){ return x[0]!=="registry"; });
  seiten.forEach(function(sp){
    var b=el("button",{type:"button","aria-current":String(jetzt===sp[0]),
      onclick:function(){ goPage(sp[0]); }},sp[1]);
    n.appendChild(b);
  });
}

function renderRail(){
  var r=document.getElementById("rail"); r.textContent="";
  var counts={},tags={};
  /* Dieselbe Regel wie der Filter: ein Obertyp zählt seine Subtypen mit. */
  var zaehle=function(e){
    var n=(e.interfaces||[])[0]; if(!n)return;
    selfAndAncestors(n).forEach(function(a){ counts[a]=(counts[a]||0)+1; });
  };
  ENT.forEach(function(e){
    zaehle(e);
    tagsOf(e).forEach(function(t){tags[t]=(tags[t]||0)+1;});
  });

  /* Vier Bereiche statt eines Kompendiums. Innerhalb eines Bereichs bleibt
     der Baum wie im Datenmodell: ein Obertyp steht über seinen Subtypen und
     zählt sie mit. Eine flache Liste verbirgt genau die Verwandtschaft, die
     den Filter erklärt. */
  /* Eine Zeile je Artikelart, **ohne Einrückung**: der Baum kam aus
     `extends`, und `extends` ist ein Array — er musste eine Herkunft wählen
     und die andere verschweigen. Eine abstrakte Art bleibt in der Liste und
     filtert auf sich und alles darunter; das ist die Frage „alles aus
     dieser Ecke", und die stellt man, bevor man die Art kennt. */
  function zeile(box,n){
    var d=REG.interfaces[n]; if(!d)return;
    box.appendChild(el("button",{class:"navrow",type:"button",
      "aria-current":String(UI.iface===n&&UI.route.k==="list"),
      onclick:function(){UI.iface=n;UI.area="";go({k:"list"});}},
      [el("b",{class:d.abstract?"ab":"",text:d.label||n}),el("em",{text:String(counts[n]||0)})]));
  }

  /* Nur der Abschnitt, auf dem man steht. Die sechs Seiten stehen oben;
     die Leiste zeigt, was *in* einer Seite steckt — alle vier Bereiche
     untereinander hiesse, dass die Navigation zweimal dasteht. */
  var seite=currentPage();
  AREAS.forEach(function(ar){
    if(seite!==ar[0])return;
    var wurzeln=typeList().filter(function(n){ return areaOf(n)===ar[0]; });
    if(!wurzeln.length)return;
    var sec=el("section");
    sec.appendChild(el("h3",{text:ar[1]}));
    /* Der Bereich selbst ist anklickbar: „alles aus der Welt" ist eine
       Frage, die man stellt, bevor man weiss, welche Artikelart man sucht. */
    var summe=0;
    wurzeln.forEach(function(n){ summe+=(counts[n]||0); });
    /* **Play führt an den Tisch**, nicht in eine Liste. Karte, Initiative
       und Boards sind das, worauf man während der Sitzung schaut — sie
       über eine Artikelliste zu erreichen hiesse, mitten im Kampf suchen
       zu gehen. Die Artikelarten darunter bleiben Filter: eine Karte
       nachzuschlagen ist etwas anderes, als sie zu benutzen. */
    if(ar[0]==="play"){
      sec.appendChild(el("button",{class:"navrow area",type:"button",
        "aria-current":String(UI.route.k==="play"),
        onclick:function(){UI.area="";UI.iface="";go({k:"play"});}},
        [el("b",{text:"At the table"}),el("em",{text:String(summe)})]));

      sec.appendChild(el("button",{class:"navrow area",type:"button",
        "aria-current":String(UI.area===ar[0]&&UI.route.k==="list"),
        onclick:function(){UI.area=ar[0];UI.iface="";go({k:"list"});}},
        [el("b",{text:"All "+ar[1].toLowerCase()}),el("em",{text:String(summe)})]));
    }
    wurzeln.forEach(function(n){ zeile(sec,n); });
    r.appendChild(sec);
  });

  if(seite==="compendium"){
    var sAll=el("section");
    sAll.appendChild(el("h3",{text:"Compendium"}));
    sAll.appendChild(el("button",{class:"navrow area",type:"button",
      "aria-current":String(UI.iface===""&&UI.area===""&&UI.route.k==="list"),
      onclick:function(){UI.iface="";UI.area="";go({k:"list"});}},
      [el("b",{text:"All articles"}),el("em",{text:String(ENT.size)})]));
    /* Auch hier flach: jede Artikelart einmal, alphabetisch. Der Baum
       stand für „ein Obertyp über seinen Subtypen" — und verschwieg dabei
       die zweite Herkunft jeder Art, die von zweien erbt.

       **Nur Arten mit Bereich.** Ein Bestandteil wie `Tags` oder `Image`
       ist keine Artikelart: danach zu filtern hiesse, nach „hat Marken" zu
       filtern, und das ist keine Frage, die man an eine Liste stellt. Der
       Baum liess sie weg, weil er von den Wurzeln der Bereiche auslief —
       flach muss es dastehen. */
    typeList().filter(function(n){ return areaOf(n); })
      .forEach(function(n){ zeile(sAll,n); });
    /* Die Marken bekommen eine eigene Ansicht und keine Wolke in der
       Leiste. Eine Wolke wächst mit der Kampagne, bis sie die Leiste füllt,
       und sie sagt bei keiner Marke, wie viele Artikel sie trägt oder
       welcher Art die sind. */
    sAll.appendChild(el("button",{class:"navrow area",type:"button",
      "aria-current":String(UI.route.k==="tags"),
      onclick:function(){ UI.iface="";UI.area=""; go({k:"tags"}); }},
      [el("b",{text:"Tags"}),el("em",{text:String(Object.keys(tags).length)})]));
    r.appendChild(sAll);

    /* Die drei Fragen vor jeder Sitzung. Sie standen im Register, und dort
       gehören sie nicht hin: sie fragen nach **Artikeln**, nicht nach den
       Zeilen, aus denen Artikel gemacht sind. Auf dem Vorbereitungsbrett
       der Spielleitung stehen sie ausserdem noch einmal — dort mit dem, was
       man daran tut. */
    var sPrep=el("section");
    sPrep.appendChild(el("h3",{text:"Before the session"}));
    var unfertig=0;
    ENT.forEach(function(x){
      var st=((x.components||{}).Status||{}).status;
      if(unfertigStatus(st)) unfertig++;
    });
    sPrep.appendChild(el("button",{class:"navrow",type:"button",
      title:"Everything not yet ready (REQ-188)",
      "aria-current":String(unfertigStatus(UI.status)),
      /* Ein Klick schaltet durch die unfertigen Stände und dann wieder aus. */
      onclick:function(){
        var w=statusWerte().filter(unfertigStatus), i=w.indexOf(UI.status);
        UI.status=i<0?(w[0]||""):(w[i+1]||"");
        UI.iface="";UI.area=""; go({k:"list"}); }},
      [el("b",{text:"Unfinished"}),el("em",{text:String(unfertig)})]));
    var offeneTodos=0;
    ENT.forEach(function(x){
      ((((x.components||{}).Todos||{}).items)||[]).forEach(function(t){ if(!t.done) offeneTodos++; });
    });
    if(offeneTodos) sPrep.appendChild(el("button",{class:"navrow",type:"button",
      title:"Open the prep board of the first campaign or session",
      onclick:function(){
        var ziel=null;
        ENT.forEach(function(x){
          if(ziel)return;
          var i2=(x.interfaces||[])[0];
          if(i2==="Campaign"||i2==="Session") ziel=x;
        });
        if(ziel) go({k:"art",id:ziel.id});
      }},[el("b",{text:"To do"}),el("em",{text:String(offeneTodos)})]));
    var openCount=0; ENT.forEach(function(x){ if(checkArticle(x).length) openCount++; });
    sPrep.appendChild(el("button",{class:"navrow",type:"button","aria-current":String(UI.offen),
      title:"Articles the validation complains about",
      onclick:function(){UI.offen=!UI.offen;UI.iface="";UI.area="";go({k:"list"});}},
      [el("b",{text:"Open issues"}),el("em",{text:String(openCount)})]));
    r.appendChild(sPrep);
  }

  /* ---- Regelwerk ----
     Nachschlagen ist keine Spielleitungssache: die Regel gilt für alle, und
     wer sie nicht findet, hält den Tisch auf. Der Regelbrowser stand im
     Register — nach Regeln sucht man aber dort, wo die Regeln stehen. */
  if(seite==="rules"){
    var regelZahl=0;
    ENT.forEach(function(x){ if(((x.interfaces||[])[0])===RULE_IFACE) regelZahl++; });
    if(regelZahl){
      var sR=el("section");
      sR.appendChild(el("h3",{text:"Look it up"}));
      sR.appendChild(el("button",{class:"navrow",type:"button",
        "aria-current":String(UI.route.k==="rules"),
        onclick:function(){go({k:"rules"});}},
        [el("b",{text:"Rules"}),el("em",{text:String(regelZahl)})]));
      r.appendChild(sR);
    }
  }


  if(!isGM()){
    /* Für einen Spieler gibt es kein Register und keinen Import. Sie
       auszugrauen wäre eine Einladung; sie wegzulassen ist die Antwort. */
    var sp=el("section");
    sp.appendChild(el("h3",{text:"You"}));
    var ich=ENT.get(viewerActor());
    if(ich) sp.appendChild(el("button",{class:"navrow",type:"button",
      "aria-current":String(UI.route.k==="art"&&UI.route.id===ich.id),
      onclick:function(){go({k:"art",id:ich.id});}},
      [el("b",{text:nameOf(ich)}),el("em",{text:"sheet"})]));
    ENT.forEach(function(o){
      if(((o.interfaces||[])[0])!=="Party")return;
      sp.appendChild(el("button",{class:"navrow",type:"button",
        onclick:function(){go({k:"art",id:o.id});}},
        [el("b",{text:nameOf(o)}),el("em",{text:"party"})]));
    });
    r.appendChild(sp);
    return;
  }
  /* ---- Register ----
     **Oben die Teile, links die Zeilen darin.** Es stand einmal beides in
     der Leiste: die Teile als Zeilen und daneben, in der Seite, noch einmal
     eine Auswahl — zwei Listen für eine Frage, und keine sagte, welche
     gerade gilt. Jetzt sagen die Reiter, worin man ist, und die Leiste, an
     welcher Zeile. */
  if(seite!=="registry") return;
  var s3=el("section");

  if(UI.regtab==="types"){
    s3.appendChild(el("h3",{text:"Types"}));
    typeNav(s3);
  }else if(UI.regtab==="views"){
    s3.appendChild(el("h3",{text:"Views"}));
    viewKeys().forEach(function(k){
      var vd=(Object.keys(REG.views).length?REG.views:VIEWS_FALLBACK)[k]||{};
      s3.appendChild(el("button",{class:"navrow",type:"button","data-v":k,
        "aria-current":String(UI.regview===k),
        onclick:function(){ UI.regview=k; UI.regscope=""; UI.regel=""; render(); }},
        [el("b",{text:vd.label||k}),el("em",{text:k})]));
    });
  }else if(UI.regtab==="relations"){
    s3.appendChild(el("h3",{text:"Relation types"}));
    Object.keys(REG.relations).sort().forEach(function(k){
      var rd=REG.relations[k]||{};
      s3.appendChild(el("button",{class:"navrow",type:"button","data-r":k,
        "aria-current":String(UI.regrel===k),
        onclick:function(){ UI.regrel=k; render(); }},
        [el("b",{text:rd.label||k}),el("em",{text:(rd.to||["*"]).length+"→"})]));
    });
  }else{
    s3.appendChild(el("h3",{text:"Registry"}));
    s3.appendChild(el("p",{class:"hint",style:"margin:0",
      text:"Nothing to pick here — the tabs above say which part you are in."}));
  }
  r.appendChild(s3);
}

/**
 * **Die Typenauswahl ist eine flache Liste.**
 *
 * Sie war ein Baum: nach Bereich gruppiert und nach Unterarten eingerückt.
 * Beides kam aus `extends` — und `extends` ist ein Array. Ein Baum muss sich
 * für **eine** Herkunft entscheiden, also stand jede Art, die von zweien
 * erbt, unter einer davon und unter der anderen nicht. Wer sie dort suchte,
 * fand sie nicht und hielt sie für nicht vorhanden.
 *
 * Jetzt: alle Zeilen alphabetisch, mit einem Filter davor, weil
 * neunundfünfzig Zeilen mehr sind als ein Blick. Woher eine Art erbt, steht
 * auf ihrer Seite — dort, wo es auch geändert wird, und vollständig.
 */
/**
 * Die Reihenfolge der Typenauswahl: alphabetisch nach Beschriftung, und
 * gefiltert wie die Liste, die man sieht.
 *
 * **Eine Ordnung, nicht zwei.** Die Pfeile vor/zurück liefen einmal durch
 * `typeOrder()`, während die Leiste alphabetisch stand — also hiess
 * „nächste" etwas anderes als das, was darunter stand.
 */
function typeNavOrder(){
  var filter=String(UI.typeFilter||"").trim().toLowerCase();
  return typeList().filter(function(n){
    if(!filter)return true;
    return (n+" "+(REG.interfaces[n].label||"")).toLowerCase().indexOf(filter)>=0;
  });
}
function typeNav(into){
  var wahl=REG.interfaces[UI.typePick]?UI.typePick:typeNavOrder()[0];
  var suche=el("input",{class:"i",type:"search",placeholder:"Filter\u2026",
    value:UI.typeFilter||""});
  suche.addEventListener("input",function(){
    UI.typeFilter=suche.value;
    /* Nur die Liste neu zeichnen wäre schöner; die Seite ist billig genug,
       und ein zweiter Zeichenweg wäre die Stelle, an der beide auseinander
       laufen. */
    render();
    var n2=document.querySelector("#rail input[type=search]");
    if(n2){ n2.focus(); n2.setSelectionRange(n2.value.length,n2.value.length); }
  });
  into.appendChild(suche);

  var alle=typeNavOrder();
  if(!alle.length) into.appendChild(el("p",{class:"hint",text:"Nothing matches."}));
  alle.forEach(function(n){
    var dd=REG.interfaces[n]||{};
    var zahl=countIface(n);
    into.appendChild(el("button",{class:"navrow"+(n===wahl?" on":""),type:"button",
      "aria-current":String(n===wahl),
      /* Der Name, nicht die Beschriftung: „Statblock numbers" heisst
         `StatblockCore`, und wer die Zeile sucht, sucht den Namen. */
      "data-t":n,
      title:n+(dd.abstract?" — abstract":"")+
        ((dd.extends||[]).length?" · made of "+(dd.extends||[]).join(", "):""),
      onclick:function(){ UI.typePick=n; UI.regiface=n; render(); }},
      [el("b",{class:dd.abstract?"ab":"",text:dd.label||n}),
       el("em",{text:zahl?String(zahl):"—"})]));
  });
}

/* ---------- Der Spieltisch (Bereich Play) ----------
   Karte, Initiative und Boards sind keine Artikel, die man nachschlägt —
   sie sind das, worauf man während der Sitzung schaut. Sie über die
   Artikelliste zu erreichen hiesse: mitten im Kampf suchen gehen.

   Was gerade läuft, steht **nicht hier**, sondern an der Sitzung
   (`Session.activeMap`, `activeEncounter`, `activeScene`). Eine
   zweite Stelle dafür wäre die, an der der Beamer eine andere Karte zeigt
   als der Laptop.

   Gezeichnet wird mit denselben Elementen wie auf der Artikelseite. Ein
   zweiter Kartenzeichner „für den Tisch" wäre der, der als Erster nicht
   mehr kann, was der andere kann. */
function playingSession(){
  /* Die jüngste Sitzung, an der etwas läuft — und erst wenn es keine gibt,
     die jüngste überhaupt. Sonst übernimmt eine gerade angelegte, leere
     Sitzung den Tisch, und Karte und Kampf sind weg, ohne dass jemand etwas
     ausgeschaltet hätte. */
  var beste=null, leer=null;
  function neuer(a,b){ return (a.updatedAt||a.createdAt||"")>(b.updatedAt||b.createdAt||""); }
  ENT.forEach(function(e){
    var card=(e.components||{}).Session;
    if(!card)return;
    if(!inStack(e)||!articleVisible(e))return;
    var laeuft=card.activeMap||card.activeEncounter||card.activeScene;
    if(laeuft){ if(!beste||neuer(e,beste)) beste=e; }
    else if(!leer||neuer(e,leer)) leer=e;
  });
  return beste||leer;
}
/* Die Karte, auf die geschaut wird: die der Sitzung, sonst die, auf der die
   Gruppe steht, sonst die einzige. Drei Antworten auf dieselbe Frage, in
   der Reihenfolge, in der sie jemand gemeint hat. */
function playMap(ses){
  var card=(ses&&(ses.components||{}).Session)||{};
  var m=card.activeMap&&ENT.get(card.activeMap);
  if(m&&articleVisible(m))return m;
  var p=theParty(), ids={};
  if(p){ ids[p.id]=true; partyMembers(p).forEach(function(x){ ids[x.id]=true; }); }
  var treffer=null, erste=null;
  ENT.forEach(function(k){
    if(((k.interfaces||[])[0])!==MAP_IFACE||!articleVisible(k))return;
    if(!erste) erste=k;
    if(treffer)return;
    if((k.relations||[]).some(function(r){
      return r.type===REL_MARKER&&((r.props||{}).kind)==="party"&&ids[r.to]; })) treffer=k;
  });
  return treffer||erste;
}
function playBoards(){
  var out=[];
  ENT.forEach(function(e){
    if(((e.interfaces||[])[0])===BOARD_IFACE&&articleVisible(e)) out.push(e); });
  out.sort(function(a,b){ return nameOf(a).localeCompare(nameOf(b),"de"); });
  return out;
}
/* Die Auswahl an der Sitzung ändern. Sie steht dort und nicht hier — aber
   gestellt wird sie hier, weil hier jemand sitzt, der sie stellen will. */
function setPlaying(ses,feld,id){
  if(!ses)return;
  var card=(ses.components||{}).Session||{};
  var patch={}; patch[feld]=id||undefined;
  ses.components=ses.components||{};
  ses.components.Session=Object.assign({},card,patch);
  persist(ses);
}
function playPicker(ses,feld,label,arten){
  var card=(ses&&(ses.components||{}).Session)||{};
  var sel=el("select",{class:"i",style:"width:auto",title:label});
  sel.appendChild(el("option",{value:""},"— "+label.toLowerCase()+" —"));
  byName().forEach(function(c){
    if(!ifaceInList(arten,(c.interfaces||[])[0]))return;
    if(!articleVisible(c))return;
    sel.appendChild(el("option",{value:c.id},nameOf(c)));
  });
  sel.value=card[feld]||"";
  sel.addEventListener("change",function(){ setPlaying(ses,feld,sel.value); });
  return sel;
}

var PLAY_TABS=[["map","Map"],["board","Boards"]];
function renderPlay(v){
  var ses=playingSession();
  var card=(ses&&(ses.components||{}).Session)||{};

  var head=el("div",{class:"listhead"});
  head.appendChild(el("h2",{text:"At the table"}));
  if(ses) head.appendChild(el("button",{class:"ref",type:"button",
    onclick:function(){go({k:"art",id:ses.id});}},nameOf(ses)));
  else head.appendChild(el("span",{class:"hint",style:"margin:0",
    text:"No session with a state yet — what runs is set on the session."}));
  v.appendChild(head);

  /* Die Szene ist eine Zeile und kein Feld: sie sagt, worum es gerade geht,
     und mehr braucht sie nicht. */
  var bar=el("div",{class:"maptools playbar"});
  var szene=card.activeScene&&ENT.get(card.activeScene);
  if(szene) bar.appendChild(el("button",{class:"ref",type:"button",
    onclick:function(){go({k:"art",id:szene.id});}},nameOf(szene)));
  if(ses&&(isGM()||card.stewardship==="table")){
    bar.appendChild(playPicker(ses,"activeScene","Scene",["Story"]));
    bar.appendChild(playPicker(ses,"activeMap","Map",["Map"]));
    bar.appendChild(playPicker(ses,"activeEncounter","Fight",["Encounter"]));
  }
  var leute=roomPeers();
  bar.appendChild(el("span",{class:"hint",style:"margin:0;align-self:center",
    text:roomNS?(leute.length===1?"only you here":leute.length+" here"):"no live channel"}));
  v.appendChild(bar);

  /* Die Initiative steht immer oben. Sie ist ein Streifen, und wer dran
     ist, muss man sehen, ohne umzuschalten. */
  var kampf=card.activeEncounter&&ENT.get(card.activeEncounter);
  if(kampf&&articleVisible(kampf)){
    var kb=el("section",{class:"playpane"});
    var kk=el("div",{class:"sec"});
    kk.appendChild(el("span",{text:"Initiative"}));
    kk.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:kampf.id});}},nameOf(kampf)));
    kb.appendChild(kk);
    kb.appendChild(elInitiative(kampf,(kampf.interfaces||[])[0],{}));
    v.appendChild(kb);
  } else {
    /* Kein Kampf ist der Normalfall und keine Panne — es steht trotzdem da,
       damit niemand sucht, wo die Initiative hin ist. */
    UI.turnActor="";
    v.appendChild(el("p",{class:"hint",text:"No fight running."}));
  }

  var tabs=el("div",{class:"ktabs"});
  PLAY_TABS.forEach(function(t){
    tabs.appendChild(el("button",{class:"btn sm"+(UI.playTab===t[0]?" pri":""),type:"button",
      "aria-pressed":String(UI.playTab===t[0]),
      onclick:function(){ UI.playTab=t[0]; render(); }},t[1]));
  });
  v.appendChild(tabs);

  if(UI.playTab==="board"){
    var bretter=playBoards();
    if(!bretter.length){ v.appendChild(el("div",{class:"empty",text:"No boards yet."})); return; }
    var wahl=bretter.filter(function(b){ return b.id===UI.playBoard; })[0]||bretter[0];
    if(bretter.length>1){
      var bt=el("div",{class:"ktabs"});
      bretter.forEach(function(b){
        bt.appendChild(el("button",{class:"btn sm"+(b.id===wahl.id?" pri":" gh"),type:"button",
          onclick:function(){ UI.playBoard=b.id; render(); }},nameOf(b)));
      });
      v.appendChild(bt);
    }
    var bp=el("section",{class:"playpane"});
    var bk=el("div",{class:"sec"});
    bk.appendChild(el("span",{text:"Board"}));
    bk.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:wahl.id});}},nameOf(wahl)));
    bp.appendChild(bk);
    bp.appendChild(elBoard(wahl,(wahl.interfaces||[])[0],{}));
    v.appendChild(bp);
    return;
  }

  var karte=playMap(ses);
  if(!karte){ v.appendChild(el("div",{class:"empty",text:"No map to look at."})); return; }
  var mp=el("section",{class:"playpane"});
  var mk=el("div",{class:"sec"});
  mk.appendChild(el("span",{text:"Map"}));
  mk.appendChild(el("button",{class:"ref",type:"button",
    onclick:function(){go({k:"art",id:karte.id});}},nameOf(karte)));
  if(ses&&card.activeMap!==karte.id&&(isGM()||card.stewardship==="table"))
    mk.appendChild(el("button",{class:"btn sm gh",type:"button",
      title:"Everyone at the table sees this one",
      onclick:function(){ setPlaying(ses,"activeMap",karte.id); }},"put it on the table"));
  mp.appendChild(mk);
  mp.appendChild(elMap(karte,(karte.interfaces||[])[0],{}));
  v.appendChild(mp);
}

function renderMain(){
  var v=document.getElementById("view"); v.textContent="";
