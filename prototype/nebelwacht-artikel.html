function fieldMore(cn,k,within,w,saveC){
  var cd=REG.interfaces[cn], schema=cd.schema, p=schema.properties[k];
  var box=el("div",{class:"fmore"});
  /* Eine Zeile Erklärung unter einer Einstellung, über die ganze Breite.
     `**fett**` und `` `code` `` werden ausgezeichnet — mehr braucht es
     nicht, und mehr wäre ein zweiter Textsatz im Register. */
  function hinweis(md){
    var p2=el("p",{class:"hint fhint"});
    String(md).split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(function(teil){
      if(/^\*\*.+\*\*$/.test(teil)) p2.appendChild(el("b",{text:teil.slice(2,-2)}));
      else if(/^`.+`$/.test(teil)) p2.appendChild(el("code",{text:teil.slice(1,-1)}));
      else if(teil) p2.appendChild(document.createTextNode(teil));
    });
    box.appendChild(p2);
  }
  function text(label,wert,setValue,ph){
    var i=el("input",{class:"i",type:"text",value:wert==null?"":wert,placeholder:ph||""});
    if(!w) i.disabled=true;
    i.addEventListener("change",function(){ setValue(i.value.trim()); saveC(); });
    box.appendChild(field(label,i));
  }

  /* Den Schlüssel umbenennen heisst: Schema, Pflichtliste, Berechnungen der
     Nachbarfelder, Ansichtsverweise und die Werte in jedem Artikel. Wer nur
     das Schema ändert, lässt die Werte hinter einem Namen zurück, den
     niemand mehr abfragt — sie sind dann still weg. */
  var keyInput=el("input",{class:"i",type:"text",value:k});
  if(!w) keyInput.disabled=true;
  keyInput.addEventListener("change",function(){
    var neuK=keyInput.value.trim().replace(/[^A-Za-z0-9_]/g,"");
    if(!neuK||neuK===k){ keyInput.value=k; return; }
    if(schema.properties[neuK]){
      UI.err="The field "+neuK+" already exists in "+(cd.label||cn)+".";
      keyInput.value=k; render(); return;
    }
    renameProperty(cn,k,neuK);
  });
  box.appendChild(field("Key",keyInput));

  var req=el("select",{class:"i"}); if(!w) req.disabled=true;
  req.appendChild(el("option",{value:""},"no"));
  req.appendChild(el("option",{value:"1"},"yes"));
  req.value=((schema.required||[]).indexOf(k)>=0)?"1":"";
  req.addEventListener("change",function(){
    var r=(schema.required||[]).filter(function(x){return x!==k;});
    if(req.value) r.push(k);
    if(r.length) schema.required=r; else delete schema.required;
    saveC(); });
  box.appendChild(field("Required field",req));

  /* Dasselbe für ein einzelnes Feld: was am Tisch gesetzt wird, braucht
     keinen Bearbeitungsmodus davor. Ein gerechnetes oder ausgegebenes Feld
     bekommt ohnehin keine Eingabe — dort ginge sie ins Leere. */
  var imm=el("select",{class:"i"}); if(!w||p.derived||p.readOnly) imm.disabled=true;
  imm.appendChild(el("option",{value:""},"only while editing"));
  imm.appendChild(el("option",{value:"1"},"always an input"));
  imm.value=p.alwaysEdit?"1":"";
  imm.addEventListener("change",function(){
    if(imm.value) p.alwaysEdit=true; else delete p.alwaysEdit;
    saveC(); });
  box.appendChild(field("Edited",imm));

  /* Ob die Eingabe vorschlägt, was andere Artikel schon tragen. Für eine
     Sorte ja (Kind, Item type), für einen Namen nein: der Deckname eines
     Artikels ist kein Vorschlag für den nächsten. */
  if(p.type==="string"&&!p.format&&!enumWerte(p)){
    var vs=el("select",{class:"i"}); if(!w||p.derived||p.readOnly) vs.disabled=true;
    vs.appendChild(el("option",{value:""},"free text"));
    vs.appendChild(el("option",{value:"1"},"free text, suggests values in use"));
    vs.value=p.suggest?"1":"";
    vs.addEventListener("change",function(){
      if(vs.value) p.suggest=true; else delete p.suggest;
      saveC(); });
    box.appendChild(field("Input",vs));
    hinweis("**Suggests values in use** offers what other articles you can see "
      +"already carry in this field \u2014 for a kind of thing (species, item "
      +"type), so the same kind is not spelled three ways. Leave it off for a "
      +"name: a cover name is meant one at a time.");
  }

  /* Ein Standardwert gilt beim Anlegen, nicht rückwirkend. Ihn auch auf
     vorhandene Artikel zu schreiben hiesse, still Werte zu setzen, die
     niemand eingetragen hat. */
  var defNode=fieldInput(p,p["default"]);
  if(!w) defNode.disabled=true;
  defNode.addEventListener("change",function(){
    var val=fieldValue(p,defNode);
    if(val===undefined) delete p["default"]; else p["default"]=val;
    saveC();
  });
  box.appendChild(field("Default when created",defNode));

  var fm=el("select",{class:"i"}); if(!w) fm.disabled=true;
  [["","—"],["long","long text"],["signed","signed"],
   ["measure","measure (text with units)"]].forEach(function(f){
    fm.appendChild(el("option",{value:f[0]},f[1])); });
  fm.value=p.format||"";
  fm.addEventListener("change",function(){
    if(fm.value)p.format=fm.value; else delete p.format;
    /* Ein Mass braucht sein Ausgangsmass — also erscheint die Wahl
       gleich, und nicht erst, wenn jemand das Feld wieder aufmacht. */
    if(fm.value==="measure"&&!p.unit) p.unit="ft";
    saveC(); render(); });
  box.appendChild(field("Display",fm));
  /* **Was eine Einstellung auslöst, gehört dabei.** „Display" sagte nur,
     dass es eine Wahl gibt, und „Derived from" gar nichts — wer nicht
     weiss, was eine Angabe tut, lässt sie leer, und dann ist sie kein
     Werkzeug, sondern ein Rätsel. */
  hinweis("How it is drawn and typed. **long text** gives a textarea "
    +"instead of one line; **signed** prints +3 and \u22121 instead of 3 "
    +"and -3; **measure** says the text carries numbers with units and may "
    +"be converted on read \u2014 that one needs a unit below.");

  /* **Ein Mass nennt die Einheit, in der es gespeichert ist.** Umgerechnet
     wird beim Lesen (D8); nennt das Feld keine, rechnet nichts, und das
     sieht aus wie „diese Zahl stimmt schon". An einem Text (`measure`) ist
     es das Ausgangsmass für Zahlen, die selbst keine nennen. */
  if(p.format==="measure"||p.unit||p.type==="number"||p.type==="integer"){
    var un=el("select",{class:"i"}); if(!w) un.disabled=true;
    un.appendChild(el("option",{value:""},"—"));
    Object.keys(REG.units||{}).sort(function(a,b){
      var ua=REG.units[a],ub=REG.units[b];
      return (ua.quantity||"").localeCompare(ub.quantity||"")||ua.base-ub.base;
    }).forEach(function(k){
      var u=REG.units[k];
      un.appendChild(el("option",{value:u.code},u.code+" — "+u.label+" ("+u.quantity+")"));
    });
    un.value=p.unit||"";
    un.addEventListener("change",function(){
      if(un.value)p.unit=un.value; else delete p.unit; saveC(); render(); });
    box.appendChild(field("Stored in unit",un));
    if(p.format==="measure"&&!p.unit) box.appendChild(el("p",{class:"hint",
      style:"grid-column:1/-1;margin:0",
      text:"A measure without a unit converts nothing. Name the unit its bare numbers are in."}));
  }

  var art=fieldKind(p);
  if(art==="choice"||art==="choices"){
    /* **Woher die Werte kommen**: aus Aufzählungszeilen oder vom Feld
       selbst. Mehrere Zeilen sind erlaubt und gelten zusammen — worin
       jemand geübt ist, kommt aus Fertigkeiten, Werkzeugen, Sprachen,
       Waffen, Rüstungen und Wissensgebieten. Eigene Wörter am Feld gibt es
       nur, solange keine Zeile genannt ist: beides zugleich wären zwei
       Antworten auf dieselbe Frage. */
    var genannt=p.enumRef?(Array.isArray(p.enumRef)?p.enumRef.slice():[p.enumRef]):[];
    var kasten=el("div",{class:"choicebox"});
    var reihe=el("div",{class:"cwrap"});
    var zeilen=Object.keys(REG.enums||{}).sort();
    if(!zeilen.length) reihe.appendChild(el("span",{class:"hint",
      text:"No choice lists yet — make one under Registry › Choices."}));
    zeilen.forEach(function(k){
      var an=genannt.indexOf(k)>=0;
      var lab=el("label",{class:"cchk"+(an?" on":"")});
      var cb=el("input",{type:"checkbox"}); cb.checked=an; if(!w) cb.disabled=true;
      cb.addEventListener("change",function(){
        var i=genannt.indexOf(k);
        if(cb.checked&&i<0) genannt.push(k);
        if(!cb.checked&&i>=0) genannt.splice(i,1);
        /* Eine Zeile heisst: die Werte stehen dort. Also gehen die eigenen
           Wörter weg — und wenn keine Zeile bleibt, geht die Nennung weg. */
        if(genannt.length){ p.enumRef=genannt.length===1?genannt[0]:genannt.slice(); delete p["enum"]; }
        else delete p.enumRef;
        saveC(); render();
      });
      lab.appendChild(cb);
      lab.appendChild(el("span",{text:(REG.enums[k].label||k)+" ("+(REG.enums[k].values||[]).length+")"}));
      reihe.appendChild(lab);
    });
    kasten.appendChild(reihe);
    box.appendChild(field("Choices from",kasten));
    if(!genannt.length) text("Choices (comma separated)",(p["enum"]||[]).join(", "),function(v){
      var xs=v.split(",").map(function(x){return x.trim();}).filter(Boolean);
      p["enum"]=xs;
    },"common, rare");
  }

  if(fieldKind(p)==="link"||fieldKind(p)==="links")
    box.appendChild(targetEditor(p,saveC,w));

  text("Derived from",p.derived||"",function(v){
    if(v)p.derived=v; else delete p.derived;
  },"10+mod(wis)");
  hinweis("**A sum instead of a value.** Write a formula and the field is "
    +"worked out every time the article is read \u2014 never stored, and it "
    +"gets no input (D8). The names in it are the **other fields of this "
    +"same type**: `mod(dex)` reads `dex` next door, `10+mod(wis)` is the "
    +"passive perception. Two places that can disagree are worse than one "
    +"that has to think.");

  text("belongs to field",p.of||"",function(v){
    if(v)p.of=v; else delete p.of;
  },"wis");
  hinweis("**Where a computed value is shown.** Name a neighbour and this "
    +"field rides in its cell instead of taking one of its own: `dexMod` "
    +"belongs to `dex`, so the sheet reads **DEX 16 (+3)** on one line "
    +"instead of two. Only for computed fields \u2014 a stored one has its "
    +"own place.");

  if(p.derived) box.appendChild(el("p",{class:"hint",style:"grid-column:1/-1;margin:0",
    text:"Derived fields are computed on read and never stored. They get no input."}));
  return box;
}

/* ---------- renaming a field key ----------
   Five places know a field key: the schema, the component's `required` list,
   the `derived` / `of` references of its siblings, the `fields` list of every
   view, and the stored value in every article that carries the component.
   Missing any one of them loses data quietly — the value stays under the old
   key, where nothing reads it any more. */
function renameProperty(cn,oldKey,newKey){
  var cd=REG.interfaces[cn]; if(!cd||!cd.schema)return;
  var props=cd.schema.properties||{};
  if(!props[oldKey]||props[newKey])return;

  /* Die Reihenfolge der Felder ist Absicht — neu aufbauen statt anhängen. */
  var neu={};
  Object.keys(props).forEach(function(k){ neu[k===oldKey?newKey:k]=props[k]; });
  cd.schema.properties=neu;

  if(Array.isArray(cd.schema.required)){
    cd.schema.required=cd.schema.required.map(function(x){ return x===oldKey?newKey:x; });
  }
  var karte={}; karte[oldKey]=newKey;
  Object.keys(neu).forEach(function(k){
    var pd=neu[k];
    if(pd.of===oldKey) pd.of=newKey;
    if(pd.derived) pd.derived=String(pd.derived).replace(
      /[A-Za-z_][A-Za-z0-9_]*/g,function(word){ return karte[word]||word; });
  });

  var alterVerweis=cn+"."+oldKey, neuerVerweis=cn+"."+newKey;
  var viewsTouched=false;
  Object.keys(REG.views).forEach(function(vn){
    var f=REG.views[vn].fields;
    if(!Array.isArray(f))return;
    var vorher=f.join("\u0000");
    REG.views[vn].fields=f.map(function(x){ return x===alterVerweis?neuerVerweis:x; });
    if(REG.views[vn].fields.join("\u0000")!==vorher) viewsTouched=true;
  });

  var betroffen=[];
  ENT.forEach(function(e){
    var card=(e.components||{})[cn];
    if(!card||!Object.prototype.hasOwnProperty.call(card,oldKey))return;
    var neuCard={};
    Object.keys(card).forEach(function(k){ neuCard[k===oldKey?newKey:k]=card[k]; });
    e.components[cn]=neuCard;
    betroffen.push(e);
  });

  UI.regprop=cn+"."+newKey;
  saveReg("interfaces");
  if(viewsTouched) saveReg("views");
  betroffen.forEach(function(e){ persist(e); });
  UI.err=betroffen.length
    ? "Field renamed; "+betroffen.length+(betroffen.length===1?" article":" articles")+" rewritten."
    : "Field renamed.";
  render();
}

/* ---------- target constraint for a link field ---------- */
function targetEditor(p,save,writable){
  p.target=p.target||{};
  var t=p.target;
  var box=el("div",{class:"tgt"});
  box.appendChild(el("div",{class:"tt",text:"May point at"}));

  var ifs=el("select",{class:"i",multiple:"multiple",size:"4"});
  if(!writable) ifs.disabled=true;
  Object.keys(REG.interfaces).sort().forEach(function(n){
    var o=el("option",{value:n},REG.interfaces[n].label||n);
    if((t.interfaces||[]).indexOf(n)>=0) o.selected=true;
    ifs.appendChild(o);
  });
  ifs.addEventListener("change",function(){
    var picked=Array.prototype.filter.call(ifs.options,function(o){return o.selected;})
      .map(function(o){return o.value;});
    if(picked.length) t.interfaces=picked; else delete t.interfaces;
    save();
  });
  box.appendChild(field("Interfaces (subtypes included)",ifs));

  var tagBox=el("input",{class:"i",type:"text",value:(t.tags||[]).join(", "),
    placeholder:"any of these"});
  if(!writable) tagBox.disabled=true;
  tagBox.addEventListener("change",function(){
    var xs=tagBox.value.split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(xs.length) t.tags=xs; else delete t.tags;
    save();
  });
  box.appendChild(field("Tags",tagBox));

  var wo=t.where||{};
  var feldBox=el("input",{class:"i",type:"text",
    value:wo.component?wo.component+"."+(wo.property||""):"",
    placeholder:"Item.rarity"});
  var wertBox=el("input",{class:"i",type:"text",value:wo.value==null?"":String(wo.value),
    placeholder:"rare"});
  if(!writable){ feldBox.disabled=true; wertBox.disabled=true; }
  function saveWhere(){
    var teile=feldBox.value.trim().split(".");
    if(teile.length===2&&teile[0]&&teile[1]){
      t.where={component:teile[0],property:teile[1],value:wertBox.value};
    } else delete t.where;
    save();
  }
  feldBox.addEventListener("change",saveWhere);
  wertBox.addEventListener("change",saveWhere);
  box.appendChild(field("Field equals",feldBox));
  box.appendChild(field("…this value",wertBox));

  var n=linkCandidates(t,"",9999).length;
  box.appendChild(el("p",{class:"hint",style:"grid-column:1/-1;margin:0",
    text:n+(n===1?" article matches":" articles match")+
      " right now. Leave everything empty to allow any article."}));
  return box;
}

function dialog(title,build){

  var back=el("div",{class:"dlg",onclick:function(ev){ if(ev.target===back) close(); }});

  function close(){ back.remove(); }
  build(host,close,box);
  var first=box.querySelector("input,select,textarea"); if(first)first.focus();
  document.addEventListener("keydown",function k(ev){ if(ev.key==="Escape"){close();document.removeEventListener("keydown",k);} });
  return close;
}

/* Kein window.confirm: die Seite läuft in einem sandboxed iframe, und ohne
   `allow-modals` verwirft der Browser den Aufruf und liefert false zurück.
   Jede Abfrage sagte damit stillschweigend Nein — die Löschknöpfe taten

function confirmDialog(question, onOk, okLabel){

    sbZeigen();

    if(presetName) host.appendChild(el("p",{class:"hint",
      text:"The link that led here finds the article as soon as it carries the name."}));
    actions(host,close,function(){
      var name=nm.value.trim(); if(!name){nm.focus();return false;}
      var ifn=sel.value;
      var sbl=linkFor(ifn,"Statblock");
      if(sbl&&sbWahl.value==="existing"&&!sbVorhanden.value){
        /* „Bestehenden anhängen" ohne Wahl wäre still „später". */
        sbVorhanden.querySelector("input").focus(); return false;
      }
      var e={ id:uid("e"), interfaces:[ifn], name:name,
        components:{ Identity:{name:name,id:nextId(ifn),aliases:[]} },
        adhoc:[], relations:[], createdAt:new Date().toISOString() };
      reqFor(ifn).forEach(function(c){ if(!e.components[c]&&REG.interfaces[c]) e.components[c]={}; });
      applyDefaults(e,ifn);
      persist(e);
      if(sbl&&sbWahl.value==="new") makeLinked(e,sbl);
      if(sbl&&sbWahl.value==="existing"){
        if(sbl.direction!=="out"&&canTemplate(sbl.type)) makeInstanceFor(e,sbl,sbVorhanden.value);
        else attachLinked(e,sbl,sbVorhanden.value);
      }
      go({k:"art",id:e.id});
      /* Aus einem Verweis heraus angelegt heisst: man war woanders und will
         dahin zurück. Das Formular nimmt die Angaben in einem Zug auf,
         statt dass man sich durch die frische, leere Ansicht klickt. */
      if(presetName) editEntity(e);
    },"Create");
  });
}

/* edit entity: name, tags, and every component field from the schema */
function editEntity(e){
  dialog("Edit",function(host,close){
    var ifn=(e.interfaces||[])[0]||"";
    var nm=el("input",{class:"i",type:"text",value:nameOf(e)});
    host.appendChild(field("Name",nm));
    var tg=el("input",{class:"i",type:"text",value:tagsOf(e).join(", "),placeholder:"comma, separated"});
    host.appendChild(field("Tags",tg));

    var inputs=[], drvCells=[];
    function readInput(it){ return fieldValue(it.pd,it.node); }
    function recalc(){
      var live={};
      inputs.forEach(function(it){
        if(it.adhoc!==undefined)return;
        live[it.cn]=live[it.cn]||{};
        var v=readInput(it); if(v!==undefined) live[it.cn][it.p]=v;
      });
      drvCells.forEach(function(c){
        c.node.textContent=fmtVal(c.pd,derivedValue(c.pd,live[c.cn]||{}))||"—";
      });
    }
    compsFor(ifn).forEach(function(cn){
      var cd=REG.interfaces[cn]; if(!cd)return;
      var props=(cd.schema&&cd.schema.properties)||{};
      var keys=Object.keys(props).filter(function(p){return !(cn==="Name"&&p==="text");});
      if(!keys.length)return;
      host.appendChild(el("div",{class:"dgrp",text:cd.label||cn}));
      keys.forEach(function(p){
        var pd=props[p], cur=((e.components||{})[cn]||{})[p];
        if(pd.derived){
          var b=el("b",{class:"drvval",text:"—"});
          host.appendChild(el("div",{class:"drvrow"},[
            el("span",{text:fieldTitle(ifn,cn,p,pd)+" "}), b,
            el("span",{class:"drvexp",text:pd.derived})]));
          drvCells.push({cn:cn,p:p,pd:pd,node:b});
          return;
        }
        if(pd.readOnly){
          /* Sichtbar, aber ohne Eingabe: man will die Nummer lesen
             können, und sie zu ändern wäre keine Korrektur, sondern ein
             anderer Artikel. */
          host.appendChild(el("div",{class:"drvrow"},[
            el("span",{text:fieldTitle(ifn,cn,p,pd)+" "}),
            el("b",{class:"drvval",text:String(cur==null?"—":cur)}),
            el("span",{class:"drvexp",text:"issued once"})]));
          return;
        }
        var node=fieldInput(pd,cur,{type:cn,key:p});
        host.appendChild(field(fieldTitle(ifn,cn,p,pd),node));
        node.addEventListener("input",recalc);
        inputs.push({cn:cn,p:p,pd:pd,node:node});
      });
    });

    (e.adhoc||[]).forEach(function(f,i){
      var node=el("input",{class:"i",type:"text",value:f.value==null?"":String(f.value)});
      host.appendChild(field("Eigenes · "+f.label,node));
      inputs.push({adhoc:i,node:node});
    });
    recalc();

    actions(host,close,function(){
      e.name=nm.value.trim()||e.name;
      setTags(e,tg.value.split(","));
      e.components=e.components||{};
      e.components.Identity=Object.assign({},e.components.Identity||{},{name:e.name});
      inputs.forEach(function(it){
        if(it.adhoc!==undefined){ e.adhoc[it.adhoc].value=it.node.value; return; }
        var val=readInput(it);
        e.components[it.cn]=e.components[it.cn]||{};
        if(val===undefined) delete e.components[it.cn][it.p]; else e.components[it.cn][it.p]=val;
      });
      persist(e);
    });
  });
}

function addRelation(e){
  dialog("Add relation",function(host,close){
    var ifn=(e.interfaces||[])[0]||"";
    var defs=relsFrom(ifn);
    if(!defs.length){ host.appendChild(el("p",{class:"hint",text:"No relation type is defined for this interface. Add one in the registry."}));
      actions(host,close,function(){},"Close"); return; }
    var rsel=el("select",{class:"i"});
    defs.forEach(function(d){ rsel.appendChild(el("option",{value:d.type},(d.label||d.type))); });
    var tsel=el("select",{class:"i"});
    var note=el("input",{class:"i",type:"text",placeholder:"optional"});
    var vars=el("textarea",{class:"i code",placeholder:'{"NAME":"Pseudopod","DMG":"2d6 + 3"}'});
    vars.style.minHeight="72px";
    var vlab=field("Variable bindings (JSON)",vars);

    function fillTargets(){
      tsel.textContent="";
      var d=relDef(rsel.value), to=d.to||["*"];
      byName().forEach(function(c){
        if(c.id===e.id)return;
        if(!ifaceInList(to,(c.interfaces||[])[0]))return;
        tsel.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
      });
      if(!tsel.childNodes.length) tsel.appendChild(el("option",{value:""},"— no matching article —"));
      vlab.style.display=relDef(rsel.value).section?"":"none";
    }
    rsel.addEventListener("change",fillTargets);
    host.appendChild(field("Bezugsart",rsel));
    host.appendChild(field("Target",tsel));
    host.appendChild(vlab);
    host.appendChild(field("Notiz",note));
    fillTargets();

    actions(host,close,function(){
      if(!tsel.value)return false;
      var props={}; if(note.value.trim())props.note=note.value.trim();
      if(vars.value.trim()){ try{props.vars=JSON.parse(vars.value);}catch(x){ alert("Variables: not valid JSON"); return false; } }
      e.relations=e.relations||[];
      e.relations.push({id:uid("r"),type:rsel.value,to:tsel.value,props:props});
      persist(e);
    },"Link");
  });
}

/* ad-hoc field + promotion into the interface (REQ-181) */
function addAdhoc(e){
  dialog("Custom field",function(host,close){
    var lb=el("input",{class:"i",type:"text",placeholder:"e.g. Favourite oath"});
    var vl=el("input",{class:"i",type:"text"});
    var pr=el("input",{type:"checkbox",id:"promote"});
    host.appendChild(field("Label",lb));
    host.appendChild(field("Value",vl));
    var pw=el("label",{class:"f"});
    pw.appendChild(el("span",{text:"Promote into the registry"}));
    var line=el("div",{style:"display:flex;gap:8px;align-items:center"});
    line.appendChild(pr);
    line.appendChild(el("span",{class:"hint",style:"margin:0",text:"The field becomes part of the interface — for every article of this kind."}));
    pw.appendChild(line); host.appendChild(pw);
    actions(host,close,function(){
      var label=lb.value.trim(); if(!label)return false;
      var key=slug(label).replace(/-/g,"_");
      if(pr.checked){
        /* Befördern heisst jetzt: das Feld an die Art schreiben, der der
           Artikel angehört. Vorher legte es eine Sammelkarte „Custom
           fields" an — ein Behälter neben dem Modell, in dem alles landete,
           was jemand einmal gebraucht hat. */
        var cn=(e.interfaces||[])[0];
        var d=REG.interfaces[cn];
        d.schema=d.schema||{type:"object",properties:{}};
        d.schema.properties[key]={type:"string",title:label};
        saveReg("interfaces");
        e.components[cn]=e.components[cn]||{}; e.components[cn][key]=vl.value;
      } else {
        e.adhoc=e.adhoc||[];
        e.adhoc.push({key:key,label:label,type:"text",value:vl.value});
      }
      persist(e);
    },"Create");
  });
}


/* ============================================================
   BOOT
   ============================================================ */
document.getElementById("new").addEventListener("click",function(){ if(canWrite())newEntity(); });
document.getElementById("q").addEventListener("input",function(ev){
  UI.q=ev.target.value; if(UI.route.k!=="list")UI.route={k:"list"}; render(); });
Array.prototype.forEach.call(document.querySelectorAll("#mob button"),function(b){
  b.addEventListener("click",function(){ UI.pane=b.dataset.p; renderPanes(); }); });
window.addEventListener("resize",renderPanes);

render();

(async function boot(){
  // Beide Fähigkeiten nebeneinander anfordern. Nacheinander hiesse: wenn die
  // eine nicht antwortet, wartet die andere ihre volle Frist mit ab.
  var hat=window.claude&&claude.use;
  var erg=await Promise.all([
    hat?claude.use("db").catch(function(){return null;}):null,
    hat?claude.use("user").catch(function(){return null;}):null,
    hat?claude.use("assets").catch(function(){return null;}):null,
    hat?claude.use("room").catch(function(){return null;}):null,
    hat?claude.use("downloads").catch(function(){return null;}):null
  ]);
  db=erg[0];
  /* Nur Schreibberechtigte bekommen die Ablage; `null` heisst hier nicht
     „kaputt", sondern „diese Ansicht darf nicht hochladen". */
  assetStore=erg[2];

  /* Wer zusieht. `isOwner` ist die Verwaltung — wie `is_admin` am Server:
     sie sieht alles und pflegt die Konten. Welche Figuren ein Konto führt
     und welche Rolle es in welcher Kampagne hat, steht in der Sammlung
     `members` und nicht in einem Artikel. */
  try{
    if(erg[1]){
      me.gm=await erg[1].isOwner();
      if(erg[1].id) me.id=(await erg[1].id())||"";
      var w=await erg[1].can("data.write");
      if(w===false) me.base=false;
    }
  }catch(x){}

  /* Der Raum ist die Zugabe, nicht die Grundlage: fehlt er, läuft alles
     weiter — nur ohne Anwesenheit und ohne Zeigen. */
  roomNS=erg[3];
  downloadNS=erg[4];
  if(roomNS){
    try{
      roomNS.onPeers(function(liste){ UI.peers=liste||[]; render(); });
      roomNS.on("roll",function(ev){
        var d=(ev&&ev.data)||{};
        if(!d.text||d.src===ROOM_SELF)return;
        UI.rollLog.unshift({t:d.what||"roll",who:d.who||"",at:Date.now(),
          r:{total:d.total,rolls:[],expr:d.what,pretty:d.text}});
        if(UI.rollLog.length>12) UI.rollLog.length=12;
        render();
      });
      roomNS.on("ping",function(ev){
        var d=(ev&&ev.data)||{};
        if(!d.map||d.src===ROOM_SELF)return;
        addPing({id:d.id||uid("pg"),map:d.map,x:d.x,y:d.y,at:Date.now(),who:d.who||""});
      });
    }catch(x){}
  }

  if(!db){
    ready=true;
    loadFailed="no data store reachable.";
    UI.err="No data store reachable — nothing will be saved. "+
           "A full page reload usually helps.";
    render(); return;
  }

  var TEILE=["interfaces","relations","views","units","enums","vars","settings"];
  var arrived={register:{},artikel:false};

  /* Wirft ein Snapshot-Callback, endet die Zustellung still: `ready` bliebe
     false und die Seite stünde auf „Lädt…". Darum fängt jeder Callback
     seinen eigenen Fehler und sagt, woran es lag. */
  function guarded(was,fn){
    return function(arg){
      try{ fn(arg); }
      catch(x){
        /* Ein Ladevorgang, der hier hereinfällt, hat etwas nicht gelesen.
           Von da an wird nicht mehr geschrieben (REQ-191): die alte App ist
           genau daran gestorben, dass die nächste Selbstspeicherung den
           unlesbaren Stand überschrieb. */
        ready=true; loadFailed=was+" could not be read.";
        UI.err=was+": "+((x&&x.message)||x); render();
      }
    };
  }

  TEILE.forEach(function(part){
    db.doc("registry/"+part).onSnapshot(guarded("Registry "+part,function(s){
      arrived.register[part]=true;
      REG[part]=thawed(s.exists&&s.data())||REG[part]||{};
      render();
    }),function(e){ loadFailed="the registry part “"+part+"” failed ("+e.code+").";
      UI.err="Registry: "+e.code; render(); });
  });

  loadPins();

  db.collection("entities").limit(1000).onSnapshot(guarded("Artikel",function(snap){
    arrived.artikel=true;
    var neu=new Map();
    var fremd="";
    (snap.docs||[]).forEach(function(d){
      var b=thawed(d.data())||{};
      if(!b.id) b.id=d.id;
      /* Fremd heisst: seit dem letzten Schnappschuss geändert, und nicht
         von uns. Der Speicher kennt keine Bedingung am Schreiben, also
         lässt sich der zweite Schreiber nicht abweisen — erkennen und
         hinschreiben lässt er sich schon, und das ist mehr, als eine
         stille Überschreibung hinterlässt (REQ-192). */
      var vorher=lastSeenAt[b.id];
      if(vorher&&b.updatedAt&&b.updatedAt!==vorher&&b.updatedAt!==lastWroteAt[b.id]
         &&UI.route.k==="art"&&UI.route.id===b.id) fremd=b.id;
      lastSeenAt[b.id]=b.updatedAt||"";
      neu.set(b.id,b);
    });
    foreignEdit=fremd;
    ENT=neu;
    ready=true;
    /* Erst mit den Artikeln steht fest, wen dieser Nutzer spielt — die
       Zuordnung liegt in den Daten, nicht in der Sitzung. */
    me.actor=actorForUser(me.id);
    UI.err="";   // eine frühere Wachmeldung ist mit den Daten erledigt
    render();
  }),function(e){ loadFailed="the articles failed ("+e.code+").";
    UI.err="Articles: "+e.code; ready=true; render(); });

  /* **Die Konten** — welche Figuren sie führen, welche Rolle sie in welcher
     Kampagne haben. Sie fehlen zu dürfen ist richtig: ohne Konten ist jede
     Rolle leer, und die Seite zeigt, was offen ist. Ein Fehler hier stoppt
     deshalb nicht das Schreiben von Artikeln — es sind zwei Dinge. */
  db.collection("members").limit(500).onSnapshot(function(snap){
    var neu=new Map();
    (snap.docs||[]).forEach(function(d){
      var m=thawed(d.data())||{};
      neu.set(d.id,{actors:Array.isArray(m.actors)?m.actors:[],
        roles:(m.roles&&typeof m.roles==="object")?m.roles:{},name:m.name||""});
    });
    MEMBERS=neu;
    me.actor=actorForUser(me.id);
    /* **Wer schaut, steht in der Liste**, ohne Rolle. Sonst müsste die
       Leitung eine Konto-Id abtippen, die sie nirgends sehen kann — und
       eine Rolle für ein Konto, das es nicht gibt, gälte für niemanden. */
    if(me.id&&!MEMBERS.has(me.id)&&me.base&&!loadFailed) saveMember(me.id,{actors:[],roles:{}});
    render();
  },function(){ /* ohne Konten: alle ohne Rolle — sicher, nicht kaputt */ });

  /* Kommt binnen zehn Sekunden nichts, sagt die Seite, was ausblieb —
     statt schweigend auf „Lädt…" zu stehen. */
  setTimeout(function(){
    if(ready) return;
    ready=true;
    UI.err="No data received: "+Object.keys(arrived.register).length+" of "+
           TEILE.length+" registry parts, "+
           (arrived.artikel?"articles yes":"articles no")+". "+
           "Reload the page fully; if it persists, it is a bug in the page.";
    render();
  },10000);
})();

})();
</script>
