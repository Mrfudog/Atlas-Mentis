<title>Atlas Mentis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e8e9e4; --surface:#f5f5f1; --surface2:#dcdfd8; --line:#c3c8bd; --line2:#aab2a4;
  --ink:#1a201d; --dim:#5c6660; --accent:#8a5d0e; --accent-soft:#f0e2c2;
  --link:#1a675e; --warn:#9c3626; --ok:#2f6b46;
  --r:3px; --gut:16px;
  --ff-disp:"Alegreya",Georgia,serif;
  --ff-body:"IBM Plex Sans",system-ui,sans-serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161e1b; --surface2:#1f2825; --line:#2e3a35; --line2:#3e4b45;
  --ink:#e6e3d8; --dim:#8c9690; --accent:#e0a83f; --accent-soft:#33290f;
  --link:#57c3b0; --warn:#e0705c; --ok:#6fc08e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161e1b; --surface2:#1f2825; --line:#2e3a35; --line2:#3e4b45;
  --ink:#e6e3d8; --dim:#8c9690; --accent:#e0a83f; --accent-soft:#33290f;
  --link:#57c3b0; --warn:#e0705c; --ok:#6fc08e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--ff-disp);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;
  padding:10px var(--gut);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--ff-disp);font-weight:700;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.sub{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
.grow{flex:1}
/* Die sechs Seiten. Sie stehen oben und nicht in der Leiste, weil die
   Leiste zeigt, was *in* einer Seite steckt — und weil man sonst nicht
   sieht, wo man ist, ohne zu scrollen. */
.pages{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:19;display:flex;gap:2px;
  padding:0 var(--gut);background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.pages button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 12px;font:inherit;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.pages button:hover{color:var(--fg)}
.pages button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pages button em{font-style:normal;font-weight:400;color:var(--dim);margin-left:6px;font-size:11px}
.search{flex:0 1 260px;min-width:0;padding:6px 9px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.body{flex:1;display:grid;grid-template-columns:210px minmax(0,1fr) 260px;gap:0;min-height:0}
.rail,.aside{overflow-y:auto;padding:14px var(--gut);border-right:1px solid var(--line);background:var(--surface)}
.aside{border-right:0;border-left:1px solid var(--line)}
.main{overflow-y:auto;padding:20px var(--gut) 60px}
.wrap{max-width:760px;margin:0 auto}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:var(--surface2);
  color:var(--ink);border:1px solid var(--line2);border-radius:var(--r);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.gh{background:transparent;border-color:transparent;color:var(--dim)}
.btn.gh:hover{color:var(--accent)}
.btn.dngr:hover{border-color:var(--warn);color:var(--warn)}
.vw{padding:5px 8px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);
  font-size:13px;max-width:140px}
label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:3px}
input.i,select.i,textarea.i{width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
textarea.i{min-height:76px;resize:vertical;font-family:var(--ff-body)}
textarea.code{font-family:var(--ff-mono);font-size:12.5px;min-height:240px;line-height:1.5}

/* ---------- rail ---------- */
.rail h3,.aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
  font-family:var(--ff-body);font-weight:600;margin:0 0 7px}
.rail section{margin-bottom:22px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
  padding:4px 7px;background:transparent;border:0;border-radius:var(--r);cursor:pointer;text-align:left}
.navrow:hover{background:var(--surface2)}
.navrow[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navrow b{font-weight:inherit}
.navrow em{font-style:normal;font-family:var(--ff-mono);font-size:11px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:1px 7px;font-size:11.5px;background:var(--surface2);border:1px solid var(--line);
  border-radius:99px;cursor:pointer;color:var(--dim);font-family:var(--ff-mono)}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* ---------- list ---------- */
.listhead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.listhead h2{font-size:24px}
.count{font-family:var(--ff-mono);font-size:12px;color:var(--dim)}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:block;width:100%;text-align:left;padding:10px 12px;background:var(--surface);border:0;cursor:pointer}
.row:hover{background:var(--surface2)}
.row .rt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row .rn{font-family:var(--ff-disp);font-size:17px;font-weight:700}
.row .rs{font-size:12px;color:var(--dim);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-size:10.5px;font-family:var(--ff-mono);text-transform:uppercase;letter-spacing:.06em;
  padding:1px 6px;border-radius:2px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.q{background:var(--surface2);color:var(--dim)}

/* ---------- article ---------- */
.arthead{border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:6px}
.arthead h2{font-size:30px}
.kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.key{font-family:var(--ff-mono);font-size:11.5px;color:var(--dim)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0}
.fld{background:var(--surface);padding:7px 10px;min-width:0}
.fld dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.fld dd{margin:1px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fld.adhoc{border-left:2px solid var(--accent)}
.fld.drv dd{color:var(--link)}
.fgrp{grid-column:1/-1;background:var(--surface2);padding:3px 10px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:600}
.drvnote{font-size:11px;color:var(--link);margin:-4px 0 8px;font-family:var(--ff-mono)}
.pruef{margin:14px 0;padding:9px 12px;border:1px solid var(--amber,var(--accent));
  border-left-width:3px;border-radius:var(--r);background:var(--accent-soft)}
.pruefkopf{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--accent);font-weight:600;margin-bottom:4px}
.pruef ul{margin:0;padding-left:18px;font-size:13px}
.pruef li{margin:1px 0}
.rail h3 .btn,.aside h3 .btn{float:right;margin-top:-2px;padding:0 6px;font-size:14px;line-height:1.2}
.warn{color:var(--accent);font-family:var(--ff-mono);font-size:11px}
.bericht{font-size:13px;margin:10px 0}
.bericht ul{margin:4px 0;padding-left:18px}
.bericht li{margin:1px 0}
.warnzeile{color:var(--warn);font-size:12.5px;margin:6px 0}
.pic{margin:14px 0}
.pic img{display:block;width:100%;max-width:100%;border:1px solid var(--line);border-radius:var(--r)}
.pic figcaption{font-size:12px;color:var(--dim);margin-top:4px;font-style:italic}
.thumb{display:block;max-width:100%;max-height:150px;margin-top:8px;border:1px solid var(--line);border-radius:var(--r)}
.blocks{margin:18px 0;display:flex;flex-direction:column;gap:12px}
.blk{position:relative}
.blk p{margin:0}
.blk .bl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
  font-weight:600;margin-bottom:2px;display:flex;gap:8px;align-items:center}
.blk.readaloud{border-left:3px solid var(--link);padding:6px 0 6px 13px;font-family:var(--ff-disp);font-size:17px;font-style:italic}
.blk.secret{border:1px dashed var(--accent);background:var(--accent-soft);padding:9px 11px;border-radius:var(--r)}
.blk.fact{border-left:3px solid var(--line2);padding-left:13px}
.blk.note{color:var(--dim);font-size:13.5px}
.sec{font-family:var(--ff-disp);font-size:20px;font-weight:700;margin:24px 0 8px;
  border-bottom:1px solid var(--line);padding-bottom:4px}
.comp{border-left:3px solid var(--accent);padding:8px 0 8px 13px;margin-bottom:12px}
.comp .cn{font-family:var(--ff-disp);font-weight:700;font-style:italic;font-size:17px}
.comp .cb{margin-top:2px}
.vr{color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent);font-variant-numeric:tabular-nums}
.ref{color:var(--link);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font:inherit}
/* Der Blick auf einen Verweis: die Übersicht, ohne die Seite zu verlassen.
   Er steht über dem Text und schiebt nichts — sonst sprängen beim
   Hinfahren die Zeilen. */
.refw{position:relative}
.refpop{display:none}
.refw:hover > .refpop,.refw:focus-within > .refpop{display:block;position:absolute;
  left:0;top:calc(100% + 4px);z-index:80;width:min(320px,80vw);
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);
  box-shadow:0 6px 18px rgba(0,0,0,.2);padding:8px 10px;font-size:13px;
  text-align:left;white-space:normal}
.refpop > b{font-family:var(--ff-disp);font-size:15px;margin-right:6px}
.refpop .pbody{padding:4px 0 0}
.ref.dead{color:var(--warn);text-decoration-style:wavy;cursor:help}
.gone{color:var(--dim);font-style:italic}

/* ---------- relations ---------- */
.rel{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.relrow{display:flex;gap:7px;align-items:baseline;font-size:13.5px}
.relrow .rl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
  flex:0 0 auto;min-width:76px;padding-top:2px}
.relrow .rv{flex:1;min-width:0}
.bind{font-family:var(--ff-mono);font-size:11px;color:var(--dim);display:block;margin-top:1px}

/* ---------- registry ---------- */
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:6px 13px;background:transparent;border:0;border-bottom:2px solid transparent;
  cursor:pointer;color:var(--dim);font-size:13px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.hint{font-size:12.5px;color:var(--dim);margin:0 0 12px;max-width:62ch}
.err{color:var(--warn);font-family:var(--ff-mono);font-size:12px;margin-top:6px;white-space:pre-wrap}

/* ---------- misc ---------- */
.banner{padding:9px 12px;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:var(--r);font-size:13px;margin-bottom:16px}
.empty{padding:40px 0;text-align:center;color:var(--dim)}
.dlg{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:var(--gut);
  background:rgba(0,0,0,.55)}
.dlgbox{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);
  padding:18px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
.dlgbox h3{font-family:var(--ff-disp);font-size:20px;margin-bottom:12px}
.dgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);
  font-weight:600;margin:16px 0 7px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.dgrp:first-child{margin-top:0}
.drvrow{display:flex;align-items:baseline;gap:7px;margin-bottom:10px;font-size:13px;color:var(--dim)}
.drvval{font-family:var(--ff-mono);color:var(--link);font-size:14px;font-variant-numeric:tabular-nums}
.drvexp{font-family:var(--ff-mono);font-size:11px;color:var(--dim);margin-left:auto;opacity:.75}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.mob{display:none}

/* ---------- registry editor ---------- */
.reg2{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.regtree{background:var(--surface2);border-right:1px solid var(--line);padding:8px 6px;
  overflow-y:auto;max-height:72vh}
.regtree button{display:block;width:100%;text-align:left;padding:4px 7px;background:none;border:0;
  border-radius:var(--r);cursor:pointer;font:inherit;font-size:13px;color:inherit}
.regtree button:hover{background:var(--surface)}
.regtree button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.regtree .ab{color:var(--dim);font-style:italic}
.regtree em{font-style:normal;font-family:var(--ff-mono);font-size:10.5px;color:var(--dim);float:right}
.regbody{padding:14px 16px;overflow-y:auto;max-height:72vh;background:var(--surface)}
.regbody h3{font-family:var(--ff-disp);font-size:19px;margin:0 0 2px}
.rsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);
  border-bottom:1px solid var(--line);padding-bottom:3px;margin:20px 0 8px}
.crow{display:flex;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .cl{flex:1;min-width:0}
.crow .cl b{font-weight:600}
.crow .co{display:block;font-size:11px;color:var(--dim)}
.crow select{width:auto;padding:3px 6px;font-size:12px}
.fbox{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;margin:2px 0 10px}
/* Ein Block: eigene Felder oder die eines Bestandteils. Die Kopfzeile sagt,
   welcher — und nicht jede Zeile einzeln. */
.fbox.part{background:var(--surface)}
.fhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
  padding-bottom:5px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.fhead b,.fhead .ref{font-family:var(--ff-disp);font-size:15px;font-weight:700}
.fhead .co{font-family:var(--ff-mono);font-size:11px;color:var(--dim)}
.frow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 108px auto auto;
  gap:6px;align-items:center;padding:3px 0}
.frow .fk{font-family:var(--ff-mono);font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.frow input.i,.frow select.i{padding:3px 6px;font-size:12.5px}
.fmore{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:6px;padding:4px 0 8px 0;border-bottom:1px dashed var(--line)}
.fmore label.f{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;font-size:12px;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px}
.chip.inh{color:var(--dim);font-style:italic}
.chip button{background:none;border:0;cursor:pointer;color:var(--dim);font:inherit;
  padding:0;line-height:1}
.chip button:hover{color:var(--warn)}
.addbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addbar select.i,.addbar input.i{width:auto;min-width:150px;flex:0 1 auto}

.swatch{display:inline-block;width:11px;height:11px;border-radius:2px;
  border:1px solid var(--line2);vertical-align:baseline}
.linkbox{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:70;background:var(--surface);
  border:1px solid var(--line2);border-top:0;border-radius:0 0 var(--r) var(--r);
  max-height:210px;overflow-y:auto;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.sugg button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  width:100%;text-align:left;padding:5px 9px;background:none;border:0;cursor:pointer;font:inherit}
.sugg button:hover{background:var(--accent-soft)}
.sugg em{font-style:normal;font-family:var(--ff-mono);font-size:10.5px;color:var(--dim)}
.tgt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;
  grid-column:1/-1;padding:7px 9px;margin-top:4px;background:var(--surface2);
  border:1px solid var(--line);border-radius:var(--r)}
.tgt .tt{grid-column:1/-1;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent)}

.tools{display:flex;flex-wrap:wrap;gap:6px}
.chip.pick{cursor:pointer;font:inherit;font-size:12px}
.chip.pick.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.chip.pick:disabled{opacity:.4;cursor:default}
.crow .btn.sm.gh:disabled{opacity:.3;cursor:default}

.crumbs{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px;
  font-size:12.5px;color:var(--dim);
  padding:5px var(--gut);background:var(--surface2);
  border-bottom:1px solid var(--line)}
.crumbs .hier{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--line2)}

/* Ansehen als: ein sichtbarer Streifen, damit niemand vergisst, dass er
   gerade nicht alles sieht. */
body.asplayer .top{box-shadow:inset 0 -3px 0 var(--link)}
body.asplayer .brand span{color:var(--link)}
#asbox select.vw{max-width:150px}

/* Wissen (A6): Gruppen, deren Kopfzeile sagt, wer sie kennt. */
.kgrp{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin:10px 0}
.kgrp.open{border-style:dashed}
.kgrp>.kh{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:6px}
.kgrp>.kh b{font-family:var(--ff-disp);font-size:15px}
.kgrp .who{font-size:11.5px;color:var(--dim)}
.kgrp .who .ref{font-size:11.5px}
.kgrp .nothing{font-size:12.5px;color:var(--dim)}
.ktabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
/* Reiter auf einem Artikel. Die Leiste klebt oben, damit sie beim Scrollen
   im langen Reiter nicht verschwindet — man schaltet mitten im Lesen um. */
.tabbox{margin:10px 0}
.tabrow{position:sticky;top:0;z-index:4;background:var(--bg);
  padding:6px 0;margin-bottom:0;border-bottom:1px solid var(--line)}
.tabpane{padding-top:12px}
/* Die Artenübersicht: links die Liste, rechts eine Art ganz. Zwei Spalten,
   weil man durchgeht und nicht nachschlägt — zurückspringen nach jedem
   Eintrag wäre genau der Umweg, den die Seite abschaffen soll. */
/* Der Typenbaum sitzt in der Leiste links — `.navrow.on` markiert dort die
   gewählte Art. Er stand einmal in der Seite, neben derselben Auswahl in
   der Leiste. */
.rail .navrow.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tpdoc{min-width:0}
.tcomp{border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;
  margin-bottom:5px;background:var(--surface2)}
.tcomp .ck{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tfields{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
/* Ein gerechnetes Feld sieht anders aus, weil es sich anders verhält: keine
   Eingabe, keine Spalte (D8). */
.pill.q.der{border:1px dashed var(--line2);opacity:.75;font-style:italic}
ul.tedges,ul.tlayout{margin:0 0 6px;padding-left:0;list-style:none;
  display:flex;flex-direction:column;gap:2px}
ul.tedges li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
ul.tedges .tlab{color:var(--dim)}
ul.tlayout li{font-size:13px}
ul.tlayout li.d1{padding-left:16px}
ul.tlayout li.d2{padding-left:32px}
ul.tlayout li.d3{padding-left:48px}
/* Die Vorlage: ein Kasten je Element, die Auswahl als anklickbare Marken.
   An heisst gezeigt, aus heisst weggelassen — und man sieht beides, statt
   nur das, was übrig blieb. */
.tmpl{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.tmplel{border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;
  background:var(--surface2)}
.tmplel.d1{margin-left:14px} .tmplel.d2{margin-left:28px} .tmplel.d3{margin-left:42px}
.tmplel .ck{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tmpltab{font-family:var(--ff-mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--accent);margin:6px 0 2px}
.tmpltab.d1{margin-left:14px} .tmpltab.d2{margin-left:28px} .tmpltab.d3{margin-left:42px}
.tmplfields{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pill.tgl{cursor:pointer;opacity:.4;text-decoration:line-through}
.pill.tgl.on{opacity:1;text-decoration:none;border-color:var(--accent);
  color:var(--accent)}
.pill.tgl[disabled]{cursor:default}
.pill.gmb{border:1px solid var(--warn);color:var(--warn)}
/* Der Spieltisch: eine Leiste mit dem, was läuft, und darunter Streifen.
   Die Initiative steht immer oben — wer dran ist, muss man sehen, ohne
   umzuschalten. */
.playbar{flex-wrap:wrap;margin-bottom:10px}
.playpane{margin-bottom:14px}
.playpane .sec{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kpick{display:flex;flex-direction:column;gap:2px;max-height:230px;overflow:auto;
  border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;margin:4px 0}
.kpick label{display:flex;gap:6px;align-items:baseline;font-size:12.5px;cursor:pointer}
.kpick label.taken{color:var(--dim)}

/* Assets: Vorschau über dem Verweis, damit man sieht, was man wählt. */
.assetbox{display:flex;flex-direction:column;gap:6px}
.aprev{display:flex;align-items:center;justify-content:center;min-height:74px;
  background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.aprev img{max-height:150px;max-width:100%;display:block}
.assetbox .addbar select.i{min-width:120px}

/* Karten: Bild, Gitter und Tokens liegen im selben Koordinatenraum, damit
   ein Anteil von 0 bis 1 überall dasselbe meint. */
:root{--gridline:rgba(30,40,36,.35)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--gridline:rgba(230,227,216,.22)} }
:root[data-theme="dark"]{--gridline:rgba(230,227,216,.22)}
.maptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.mapstage{overflow:auto;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface2);max-height:70vh}
.mapinner{position:relative;display:inline-block;min-width:100%;line-height:0}
.mapimg{display:block;max-width:none;height:auto}
.mgrid{position:absolute;inset:0;pointer-events:none}
.maparea{position:absolute;border:2px dashed var(--accent);background:var(--accent-soft);
  opacity:.65;border-radius:var(--r);cursor:zoom-in;padding:0;display:flex;
  align-items:flex-start;justify-content:center}
.maparea:hover{opacity:1}
.maparea span{font-size:11px;font-family:var(--ff-mono);color:var(--accent);
  background:var(--surface);padding:0 4px;border-radius:2px;line-height:1.4;
  white-space:nowrap;transform:translateY(-100%)}
.mtoken{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid var(--accent);background:var(--surface);padding:0;cursor:grab;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.35);line-height:1}
.mtoken:active{cursor:grabbing}
.mtoken img{width:100%;height:100%;object-fit:cover}
.mtoken span{font-family:var(--ff-mono);font-size:11px;color:var(--accent);font-weight:600}
.mtoken.k-party{border-color:var(--ok)}
.mtoken.k-party span{color:var(--ok)}
.mtoken.k-quest{border-color:var(--link)}
.mtoken.k-quest span{color:var(--link)}
.mtoken.k-play{border-color:var(--warn);border-style:double;border-width:4px}
.mtoken.k-play span{color:var(--warn)}
.mtoken.k-scenery{border-style:dotted;opacity:.85}
/* Ein Möbel ist kein Token. Es hat keinen Rand, keinen Kreis und keinen
   Schatten — es liegt auf der Karte, statt auf ihr zu stehen. Erst beim
   Darüberfahren zeigt es, dass man es anfassen kann. */
.mtoken.asset{border-radius:0;border-color:transparent;background:transparent;
  box-shadow:none;overflow:visible}
.mtoken.asset img{object-fit:contain}
.mtoken.asset:hover{border-color:var(--accent);border-style:dashed}
/* Der Rahmen einer Unterkarte, wenn man weit genug hineingezoomt ist:
   dann ist er nicht mehr ein Kästchen am Rand, sondern das, was man
   gleich betritt. */
.maparea.near{border-style:solid;border-width:3px;background:transparent}
.maparea.near span{font-size:14px;font-family:var(--ff-disp);
  transform:none;padding:3px 8px}

/* Nebel, Licht und Gebiete. Die Überlagerung liegt über dem Bild und unter
   den Tokens — man muss sehen, wo eine Figur steht, auch wenn es dort
   dunkel ist; was dort sonst noch steht, sieht man nicht. */
.mvis{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.mfog{fill:#11131a}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .mfog{fill:#05060a} }
:root[data-theme="dark"] .mfog{fill:#05060a}
.mfogflat{position:absolute;inset:0;background:#11131a;pointer-events:none;z-index:2}
.mwall{stroke:var(--warn);stroke-width:.004;stroke-linecap:round;opacity:.85}
.msheet{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  display:block}
.msheets{display:flex;flex-direction:column;gap:4px}
.msheetrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:3px 6px;border:1px solid var(--line);border-radius:var(--r)}
.msheetrow.base{border-style:dashed;opacity:.9}
.msname{flex:1 1 120px;text-align:left;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.msopacity{width:80px}
.mterr{pointer-events:none}
.mtoken{z-index:3}
.mdraw{position:absolute;inset:0;z-index:5;touch-action:none;cursor:crosshair}
.mdraw.t-erase{cursor:not-allowed}
.mprev{position:absolute;border:2px dashed var(--accent);background:var(--accent-soft);
  pointer-events:none}
.mprev.line{height:0;border:none;border-top:3px solid var(--warn);transform-origin:0 0}
.mprev.area{border-style:solid;border-width:2px}
.maptools.sub{padding-top:2px;border-top:1px dashed var(--line);margin-top:-2px}

/* Die Werkbank: ein laufender Gang ist ein Balken und zwei Knöpfe. */
.bench{margin:8px 0}
.job{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;
  background:var(--surface2);margin-bottom:6px}
.jbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.jbar i{display:block;height:100%;background:var(--accent)}
/* Was im Kessel liegt und was fehlt. Der Knopf steht neben der Zutat, die
   er hineinlegt — eine Liste, die nur zählt, schickt einen zum Inventar
   und wieder zurück. */
ul.jmat{margin:4px 0 0;padding-left:0;list-style:none;display:flex;
  flex-direction:column;gap:3px}
ul.jmat li{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
ul.jmat li.short .co{color:var(--warn)}
ul.jmat li.ok .co{color:var(--ok)}
.mtiles{display:grid;gap:0;line-height:0}
.mtiles img{width:100%;height:auto;display:block}

/* Beziehung: eine Zeile je Gegenseite, die Gedanken als Marken. Keine
   Leiter mehr — am Tisch fragt niemand nach einer Zahl. */
.standbox{display:flex;flex-direction:column;gap:8px}
.strow{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;
  background:var(--surface2)}
.strow .ck{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.strow .ck.back{margin-top:4px;font-size:13px;opacity:.85}
.rtags{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.tagtab{display:flex;flex-direction:column;gap:2px}
/* Der Baum auf „How it works": eine Zeile je Knoten, eingerückt nach Tiefe.
   Kein Liniengeflecht — die Einrückung sagt dasselbe und überlebt ein
   Handydisplay. */
.tree{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  background:var(--surface);margin:6px 0}
.tnode{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:2px 0}
.tnode .tw{font-family:var(--ff-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--dim);min-width:62px}
.tnode.tart .ref{font-family:var(--ff-disp);font-size:18px}
.tnode.ttyp .ref{font-family:var(--ff-disp);font-size:16px}
.pill.tfield{opacity:.5}
.pill.tfield.on{opacity:1;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tagrow{display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.tagrow .count{min-width:2.5em}
.tagkinds{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
/* Eine Marke, die man wegklicken kann, sagt das erst beim Darüberfahren —
   sonst stünde neben jedem Gedanken ein Kreuz und man läse nur Kreuze. */
.pill.tag.x{cursor:pointer;border:1px solid transparent}
.pill.tag.x:hover{border-color:var(--warn);color:var(--warn)}
.pill.tag.x:hover::after{content:" ×"}
.rnote .btn{font-style:italic;color:var(--dim);text-align:left}

/* Charakterbogen: die Vitalleiste ist eine Zeile, die man antippt. */
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin:12px 0}
.vital{background:var(--surface);padding:7px 8px;text-align:center;min-width:0}
.vital .vk{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vital .vv{font-family:var(--ff-disp);font-size:19px;margin-top:2px}
.vrow{display:flex;align-items:center;justify-content:center;gap:1px;margin-top:1px}
.vbtn{background:none;border:0;color:var(--dim);cursor:pointer;font-family:var(--ff-mono);
  font-size:15px;line-height:1;padding:3px 5px;min-width:24px}
.vbtn:hover{color:var(--accent)}
.vin{width:44px;background:none;border:0;color:var(--ink);font-family:var(--ff-disp);
  font-size:19px;text-align:center;padding:0;-moz-appearance:textfield}
.vin::-webkit-outer-spin-button,.vin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.vital.hp .vin{color:var(--warn)}
.vital.tmp .vin{color:var(--ok)}
.vmax{font-family:var(--ff-mono);font-size:11px;color:var(--dim)}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.pip{width:15px;height:15px;border:1.5px solid var(--accent);border-radius:3px;
  background:var(--accent-soft);cursor:pointer;padding:0}
.pip.round{border-radius:50%}
.pip.used{background:transparent;border-color:var(--line2);opacity:.5}
.pips.ok .pip{border-color:var(--ok);background:rgba(47,107,70,.25)}
.pips.bad .pip{border-color:var(--warn);background:rgba(156,54,38,.25)}
.pips.ok .pip.used,.pips.bad .pip.used{background:transparent;border-color:var(--line2)}
.dsrow{display:flex;gap:8px;justify-content:center}
.condrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.abgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.ability{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:7px 4px;text-align:center}
.ability .k{font-family:var(--ff-mono);font-size:10px;letter-spacing:.08em;color:var(--dim)}
.ability .score{font-family:var(--ff-disp);font-size:22px;margin-top:2px}
.ability .mod{font-family:var(--ff-mono);font-size:13px;color:var(--accent)}
.ability .save{margin-top:4px;font-family:var(--ff-mono);font-size:10.5px;
  background:none;border:1px solid var(--line);border-radius:999px;color:var(--dim);
  padding:1px 7px;cursor:pointer}
.ability .save.on{border-color:var(--ok);color:var(--ok)}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px}
.skillrow{display:flex;align-items:center;gap:7px;padding:3px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.sdot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line2);
  background:none;padding:0;cursor:pointer;flex:0 0 auto}
.sdot.s1{background:var(--accent);border-color:var(--accent)}
.sdot.s2{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 2px rgba(47,107,70,.3)}
.sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srule{flex:1;min-width:8px;border-bottom:1px dotted var(--line)}
.sattr{font-family:var(--ff-mono);font-size:10.5px;color:var(--dim)}
.smod{font-family:var(--ff-mono);width:28px;text-align:right;font-variant-numeric:tabular-nums}
table.atk{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.atk th{text-align:left;font-family:var(--ff-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--dim);font-weight:500;padding:4px 6px;
  border-bottom:1px solid var(--line)}
table.atk td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.atk td.num{font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
table.atk td.note{color:var(--dim);font-size:12.5px}
table.atk tr.equipped td.num{color:var(--accent);font-weight:600}
table.atk tr.stowed td,table.atk tr.buried td{color:var(--dim)}

/* Inventar: dieselben Daten, drei Blickwinkel. */
.invbox .ktabs{margin-bottom:10px}
/* Das Gruppeninventar: was da ist und bei wem. Keine Stufen, keine Slots —
   wo etwas liegt, ist die Frage des Trägers und nicht der Gruppe. */
ul.pstock{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden}
ul.pstock li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:7px 10px;background:var(--surface)}
ul.pstock .pq{font-family:var(--ff-mono);font-size:12px;color:var(--accent);
  min-width:26px}
ul.pstock .pbei{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.chip.sm{font-size:11.5px;padding:1px 7px}
.pickon{color:var(--accent)}
.tier{border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;margin-bottom:7px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.tier.over{border-color:var(--accent);background:var(--accent-soft)}
.tier .tlabel{flex-basis:100%;display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.tier .tlabel b{font-family:var(--ff-disp);font-size:14px}
.tier .tlabel .co{font-size:11.5px;color:var(--dim)}
.tier.t-held{background:var(--accent-soft)}
.tier.t-stored{opacity:.72}
.chip.item{cursor:pointer;gap:6px}
.chip.item.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chip.item .qty{font-family:var(--ff-mono);font-size:11px;color:var(--accent)}
.bodyrig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.slot .slabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  margin-bottom:3px}
.sbox{min-height:48px;border:1px dashed var(--line);border-radius:var(--r);
  background:var(--surface2);padding:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sbox.over{border-color:var(--accent);background:var(--accent-soft)}
.bodyrig.picking .sbox{border-color:var(--accent);border-style:solid}
.invgrid{display:grid;gap:2px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);padding:2px;margin:8px 0;aspect-ratio:auto}
.gcell{background:var(--surface2);min-height:38px;border-radius:2px}
.gcell.over{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.invgrid.picking .gcell{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2)}
.gitem{position:relative;display:grid;gap:2px;cursor:grab;padding:0;z-index:2}
.gitem i{background:var(--accent-soft);border:1px solid var(--accent);border-radius:2px;
  display:block}
.gitem i.off{background:transparent;border-color:transparent}
.gitem.selected i.on{background:var(--accent);border-color:var(--accent)}
/* Ebenen: von unten nach oben, mit dem, was jede beisteuert. */
.stackchip{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:baseline;margin-left:8px}
.stackchip .chip{font-size:11px;padding:1px 7px;cursor:pointer}
.stackchip .chip.warn{border-color:var(--warn);color:var(--warn)}
.stackchip .co{font-size:10.5px;color:var(--warn)}
.layers{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.layer{border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;background:var(--surface)}
.layer .ck{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.layer .num{font-family:var(--ff-mono);font-size:11px;color:var(--accent);
  border:1px solid var(--line2);border-radius:999px;padding:0 6px}
.layer .ref{font-family:var(--ff-disp);font-size:15px}
.layer .co{font-size:11.5px;color:var(--dim);margin-left:auto}
.chips .chip.warn{border-color:var(--warn);color:var(--warn)}

/* Punktreise: Knoten nach Abstand, Wege mit ihrem Eindruck. */
.crgraph{display:flex;gap:14px;overflow-x:auto;padding:8px 0;margin:6px 0}
.crcol{display:flex;flex-direction:column;gap:6px;min-width:150px}
.crcol .ck{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.crnode{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;
  background:var(--surface);cursor:pointer;text-align:left}
.crnode b{font-family:var(--ff-disp);font-size:14px;font-weight:700}
.crnode em{font-style:normal;font-family:var(--ff-mono);font-size:10.5px;color:var(--dim)}
.crnode.s-hidden{opacity:.5;border-style:dashed}
.crnode.s-discovered{border-color:var(--line2)}
.crnode.s-explored{border-color:var(--ok)}
.crnode.here{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.crway{border-left:3px solid var(--line2);padding:6px 0 6px 12px;margin-bottom:8px}
.crway .ck{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline}
.crway .ck .ref{font-family:var(--ff-disp);font-size:15px}
.crway .cb{margin-top:3px;font-size:13.5px}
.cractions{display:flex;flex-direction:column;gap:3px}
.cractions .rl{font-size:12.5px;color:var(--ink);min-width:150px}

/* Vorbereitung: vier Listen, die es ohne dieses Element auch gäbe. */
.prep .addbar.quick{margin-bottom:12px}
.prep .addbar.quick input.i{flex:1;min-width:180px}
.cockpit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cgroup{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--surface)}
.cgroup .ck{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  margin-bottom:4px}
.crowlite{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;padding:2px 0;font-size:13.5px}
.crowlite .co{font-size:11px;color:var(--accent);margin-left:auto}

/* Aufträge und Zeitleiste. */
.tasks{display:flex;flex-direction:column;gap:2px}
.task{display:flex;gap:8px;align-items:baseline;padding:3px 0;
  border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.task.done span{text-decoration:line-through;color:var(--dim)}
.task .co{margin-left:auto;font-size:11px;color:var(--dim)}
.qlist{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
