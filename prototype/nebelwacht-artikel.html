/* ---------- Ebenen und Stapel (REQ-004 bis 009, 044) ----------
   Ein Artikel ohne `inLayer`-Kante gehört der Kampagne selbst und ist immer
   da. Das ist der Normalfall und soll keine Zeile kosten — wer eine
   Kampagne führt und keine Pakete benutzt, merkt vom Stapel nichts.

   Was eine Ebene mitbringt, ist da, solange die Kampagne sie aufschaltet.
   Eine höhere Ebene kann dasselbe Ding **überschreiben** (`overrides`) oder
   **herausnehmen** (`inLayer` mit `mode: removes`). Löschen ginge in beiden
   Fällen nicht: der Artikel gehört der anderen Ebene, und beim nächsten
   Import wäre er wieder da.

   Die Auflösung ist eine Abfrage und wird nie gespeichert — dieselbe Regel
   wie bei abgeleiteten Werten (D8). Sie sitzt in `articleVisible` und
   `resolveArticle`, also an denselben zwei Stellen wie Sichtbarkeit und
   Wissen; wer eine dritte Stelle bräuchte, hätte das Modell verfehlt. */
var LAYER_IFACE="Layer", LAYER_COMP="Layer",
    REL_INLAYER="inLayer", REL_ACTIVATES="activates",
    REL_OVERRIDES="overrides", REL_VARIANT="variantOf";

/* Die laufende Kampagne. Eine Einstellung schlägt die Suche — wer zwei
   Kampagnen in einem Speicher führt, muss sagen können, welche gilt. */
function currentCampaign(){
  var gesetzt=setting("campaign","");
  if(gesetzt&&ENT.get(gesetzt))return ENT.get(gesetzt);
  var hit=null;
  ENT.forEach(function(e){ if(!hit&&((e.interfaces||[])[0])==="Campaign") hit=e; });
  return hit;
}
/* Die aufgeschalteten Ebenen, von unten nach oben. Reihenfolge: was an der
   Kante steht, sonst die Spezifität der Ebene selbst. */
var stackSig="", stackCache=null;
function activeStack(){
  var camp=currentCampaign();
  var sig=(camp?camp.id+":"+JSON.stringify(camp.relations||[]):"-")+"|"+ENT.size;
  if(sig===stackSig&&stackCache)return stackCache;
  var out=[];
  if(camp){
    (camp.relations||[]).forEach(function(r){
      if(r.type!==REL_ACTIVATES)return;
      var l=ENT.get(r.to); if(!l)return;
      var info=(l.components||{})[LAYER_COMP]||{};
      out.push({layer:l,order:(r.props&&r.props.order!=null)?Number(r.props.order):(Number(info.order)||10)});
    });
  }
  out.sort(function(a,b){ return a.order-b.order; });
  stackSig=sig; stackCache=out;
  return out;
}
function activeLayerIds(){
  var m={};
  activeStack().forEach(function(x,i){ m[x.layer.id]=i+1; });   /* 1..n, höher = spezifischer */
  return m;
}
function layerEdges(e){
  return (e.relations||[]).filter(function(r){ return r.type===REL_INLAYER; });
}
/* Steht dieser Artikel im laufenden Stapel? Ohne Ebenenkante: ja. Mit:
   nur, wenn eine aufgeschaltete Ebene ihn hinzufügt — und keine
   spezifischere ihn herausnimmt. */
function inStack(e){
  var kanten=layerEdges(e);
  if(!kanten.length)return true;
  var aktiv=activeLayerIds();
  var addAt=0, remAt=0;
  kanten.forEach(function(r){
    var rang=aktiv[r.to]; if(!rang)return;
    if(((r.props||{}).mode)==="removes") remAt=Math.max(remAt,rang);
    else addAt=Math.max(addAt,rang);
  });
  if(!addAt&&!remAt)return false;          /* nur in Ebenen, die nicht laufen */
  return addAt>remAt;
}
/* Höchste aufgeschaltete Ebene eines Artikels — für die Herkunftsanzeige. */
function layerOf(e){
  var kanten=layerEdges(e);
  if(!kanten.length)return null;
  var aktiv=activeLayerIds(), best=null, rang=0;
  kanten.forEach(function(r){
    if(((r.props||{}).mode)==="removes")return;
    var x=aktiv[r.to]; if(!x||x<rang)return;
    rang=x; best=ENT.get(r.to)||null;
  });
  if(best)return best;
  return ENT.get(kanten[0].to)||null;
}
/* Wer diesen Artikel überschreibt — die spezifischste aufgeschaltete
   Fassung. Ohne aufgeschaltete Ebene überschreibt niemand: eine
   Überschreibung, die immer gilt, wäre eine Bearbeitung. */
function overriderOf(id){
  var aktiv=activeLayerIds(), best=null, rang=-1;
  ENT.forEach(function(o){
    (o.relations||[]).forEach(function(r){
      if(r.type!==REL_OVERRIDES||r.to!==id)return;
      var l=layerEdges(o).map(function(x){return aktiv[x.to]||0;});
      var r2=l.length?Math.max.apply(null,l):0;
      if(!r2)return;                        /* Überschreibung ohne Ebene zählt nicht */
      if(r2>rang){ rang=r2; best=o; }
    });
  });
  return best;
}
/* Was an dieser Stelle wirklich gilt. Eine Kette von Überschreibungen wird
   bis zum Ende verfolgt, aber nicht im Kreis. */
function resolveArticle(e){
  var at=e, guard=0;
  while(at&&guard++<8){
    var o=overriderOf(at.id);
    if(!o||o.id===at.id)break;
    at=o;
  }
  return at;
}
function isOverridden(e){ return !!overriderOf(e.id); }

/* Der schlanke Herkunfts-Anzeiger (REQ-044): woher dieser Artikel kommt und
   ob etwas ihn ersetzt. Er steht am Artikel und nicht in einem Register —
   die Frage stellt sich dort, wo man liest. */
function stackChip(e){
  var l=layerOf(e);
  var ov=overriderOf(e.id);
  if(!l&&!ov)return null;
  var box=el("span",{class:"stackchip"});
  if(l){
    var info=(l.components||{})[LAYER_COMP]||{};
    box.appendChild(el("button",{class:"chip",type:"button",
      title:"From the layer “"+nameOf(l)+"”"+(info.kind?" ("+info.kind+")":""),
      onclick:function(){go({k:"art",id:l.id});}},nameOf(l)));
    if(!activeLayerIds()[l.id]) box.appendChild(el("span",{class:"co",text:"not running"}));
  }
  if(ov) box.appendChild(el("button",{class:"chip warn",type:"button",
    title:"Something replaces this one in the running stack",
    onclick:function(){go({k:"art",id:ov.id});}},"replaced by "+nameOf(ov)));
  var vr=(e.relations||[]).filter(function(r){return r.type===REL_VARIANT;})[0];
  if(vr){
    var q=ENT.get(vr.to);
    if(q) box.appendChild(el("button",{class:"chip",type:"button",
      onclick:function(){go({k:"art",id:q.id});}},"variant of "+nameOf(q)));
  }
  return box;
}

function elStack(e,ifn,item){
  var wrap=el("div",{class:"stackbox"});
  var camp=currentCampaign();
  var stapel=activeStack();

  if(!camp){
    wrap.appendChild(el("p",{class:"hint",
      text:"No campaign yet. Without one nothing is switched on, and every article is simply there — which is the right default for a campaign that uses no packs."}));
  }

  /* Die Ebenen von unten nach oben, mit dem, was sie beisteuern. */
  wrap.appendChild(el("div",{class:"sec",text:"Running, bottom first"}));
  if(!stapel.length) wrap.appendChild(el("p",{class:"hint",
    text:camp?"This campaign switches on no layer. Everything that carries no layer is in anyway.":""}));
  var box=el("div",{class:"layers"});
  stapel.forEach(function(x,i){
    var info=(x.layer.components||{})[LAYER_COMP]||{};
    var row=el("div",{class:"layer"});
    var kopf=el("div",{class:"ck"});
    kopf.appendChild(el("span",{class:"num",text:String(i+1)}));
    kopf.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:x.layer.id});}},nameOf(x.layer)));
    if(info.kind) kopf.appendChild(el("span",{class:"pill q",text:info.kind}));
    if(info.version) kopf.appendChild(el("span",{class:"co",text:info.version}));
    var bringt=0, nimmt=0;
    ENT.forEach(function(o){
      layerEdges(o).forEach(function(r){
        if(r.to!==x.layer.id)return;
        if(((r.props||{}).mode)==="removes") nimmt++; else bringt++;
      });
    });
    kopf.appendChild(el("span",{class:"co",
      text:bringt+" brought"+(nimmt?", "+nimmt+" taken out":"")}));
    if(canWrite()&&camp) kopf.appendChild(el("button",{class:"btn gh sm",type:"button",
      title:"Switch this layer off",
      onclick:function(){
        camp.relations=(camp.relations||[]).filter(function(r){
          return !(r.type===REL_ACTIVATES&&r.to===x.layer.id); });
        persist(camp);
      }},"off"));
    row.appendChild(kopf);
    box.appendChild(row);
  });
  wrap.appendChild(box);

  if(canWrite()&&camp){
    var frei=[];
    var an=activeLayerIds();
    ENT.forEach(function(o){
      if(((o.interfaces||[])[0])!==LAYER_IFACE)return;
      if(an[o.id])return;
      frei.push(o);
    });
    if(frei.length){
      var sel=el("select",{class:"i",style:"width:auto"});
      sel.appendChild(el("option",{value:""},"— switch a layer on …"));
      frei.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
      frei.forEach(function(o){ sel.appendChild(el("option",{value:o.id},nameOf(o))); });
      sel.addEventListener("change",function(){
        if(!sel.value)return;
        var l=ENT.get(sel.value);
        var info=(l&&l.components&&l.components[LAYER_COMP])||{};
        camp.relations=camp.relations||[];
        camp.relations.push({id:uid("r"),type:REL_ACTIVATES,to:sel.value,
          props:{order:Number(info.order)||10}});
        persist(camp);
      });
      wrap.appendChild(sel);
    }
  }

  /* Was der Stapel gerade ausblendet — die Frage, die man stellt, wenn
     etwas fehlt, und die sonst niemand beantwortet. */
  var draussen=[], ersetzt=[];
  ENT.forEach(function(o){
    if(!inStack(o)) draussen.push(o);
    else if(isOverridden(o)) ersetzt.push(o);
  });
  wrap.appendChild(el("div",{class:"sec",text:"Not in play right now"}));
  if(!draussen.length&&!ersetzt.length) wrap.appendChild(el("p",{class:"hint",
    text:"Nothing is switched out and nothing is replaced."}));
  if(draussen.length){
    var d=el("div",{class:"chips"});
    draussen.slice(0,30).forEach(function(o){
      d.appendChild(el("button",{class:"chip",type:"button",
        onclick:function(){go({k:"art",id:o.id});}},nameOf(o)));
    });
    wrap.appendChild(el("p",{class:"hint",
      text:draussen.length+" article"+(draussen.length===1?"":"s")+
        " belong only to layers that are not running."}));
    wrap.appendChild(d);
  }
  if(ersetzt.length){
    var r2=el("div",{class:"chips"});
    ersetzt.slice(0,30).forEach(function(o){
      var ov=overriderOf(o.id);
      r2.appendChild(el("button",{class:"chip warn",type:"button",
        onclick:function(){go({k:"art",id:ov?ov.id:o.id});}},
        nameOf(o)+" → "+(ov?nameOf(ov):"?")));
    });
    wrap.appendChild(el("p",{class:"hint",
      text:ersetzt.length+" replaced by a more specific layer."}));
    wrap.appendChild(r2);
  }
  return wrap;
}

/* ---------- Punktreise und Erkundung (REQ-168 bis 171) ----------
   Eine Punktreise ist kein Ausschnitt einer Karte, sondern ein Graph: Orte
   und Wege dazwischen. Der Unterschied ist nicht Darstellung — auf einer
   Karte ist jeder Punkt von jedem erreichbar, im Graph nur die, zwischen
   denen jemand einen Weg gelegt hat. Genau das macht Reisen zu einer
   Entscheidung.

   **Der Sinneseindruck steht an der Kante, nicht am Ziel.** Was man
   unterwegs hört und riecht, hängt vom Weg ab: dieselbe Lichtung riecht von
   der Sumpfseite anders als vom Grat. Das ist der Grund, warum eine
   Punktreise mehr ist als eine Liste von Orten.

   **Drei Erkundungsstufen, nicht zwei.** „Verborgen" heisst, die Gruppe
   weiss nicht einmal, dass es den Ort gibt; „entdeckt" heisst, sie weiss
   davon und war nicht dort; „erkundet" heisst, sie war da. Zwei Stufen
   könnten „wir haben davon gehört" nicht abbilden, und daraus entsteht das
   halbe Spiel.

   Angeordnet wird von selbst — nach Abstand vom Standort. Koordinaten je
   Knoten zu speichern hiesse, sie bei jeder neuen Kante nachzuziehen. */
var EXPL_COMP="Place", TRAVEL_COMP="Party", REL_ROUTE="route";
var EXPL_STATES=[["hidden","Hidden"],["discovered","Known of"],["explored","Been there"]];

function explOf(e){ return ((e.components||{})[EXPL_COMP]||{}).state||"hidden"; }
function setExpl(e,st){
  e.components=e.components||{};
  e.components[EXPL_COMP]=Object.assign({},e.components[EXPL_COMP]||{},
    {state:st,since:new Date().toISOString().slice(0,10)});
  persist(e);
}
function routesFrom(e){
  var out=[];
  (e.relations||[]).forEach(function(r){
    if(r.type!==REL_ROUTE)return;
    var t=ENT.get(r.to); if(!t)return;
    out.push({rel:r,to:t,props:r.props||{},back:false});
  });
  /* Die Gegenrichtung ist eine Abfrage, keine zweite Kante — ausser der Weg
     ist ausdrücklich einseitig. Ein gespiegeltes Gegenstück verwaist. */
  ENT.forEach(function(o){
    (o.relations||[]).forEach(function(r){
      if(r.type!==REL_ROUTE||r.to!==e.id)return;
      if((r.props||{}).oneWay)return;
      out.push({rel:r,to:o,props:r.props||{},back:true});
    });
  });
  return out;
}
/* Die Gruppe, die reist: die erste mit einer Reisekarte. Mehrere Gruppen
   wären mehrere Karten — das trägt das Modell, die Oberfläche nimmt die
   erste. */
function travellingParty(){
  var hit=null;
  ENT.forEach(function(e){
    if(hit)return;
    if((e.components||{})[TRAVEL_COMP]) hit=e;
  });
  if(hit)return hit;
  ENT.forEach(function(e){
    if(hit)return;
    if(((e.interfaces||[])[0])==="Party") hit=e;
  });
  return hit;
}
function travelCard(p2){ return ((p2&&p2.components)||{})[TRAVEL_COMP]||{}; }

/* Abstand vom Standort, damit die Knoten sich von selbst ordnen. */
function crawlLayers(start,knoten){
  var idx={}; knoten.forEach(function(k){ idx[k.id]=k; });
  var tiefe={}, rand=[start&&start.id].filter(Boolean), t=0;
  if(rand.length) tiefe[rand[0]]=0;
  while(rand.length&&t<12){
    var naechste=[];
    rand.forEach(function(id){
      var e=ENT.get(id); if(!e)return;
      routesFrom(e).forEach(function(w){
        if(!idx[w.to.id]||tiefe[w.to.id]!==undefined)return;
        tiefe[w.to.id]=t+1; naechste.push(w.to.id);
      });
    });
    rand=naechste; t++;
  }
  var max=0;
  Object.keys(tiefe).forEach(function(k){ max=Math.max(max,tiefe[k]); });
  knoten.forEach(function(k){ if(tiefe[k.id]===undefined) tiefe[k.id]=max+1; });
  var reihen={};
  knoten.forEach(function(k){ (reihen[tiefe[k.id]]=reihen[tiefe[k.id]]||[]).push(k); });
  return {tiefe:tiefe,reihen:reihen};
}

function elCrawl(e,ifn,item){
  var wrap=el("div",{class:"crawl"});
  /* Die Knoten sind die Orte unter diesem Ort — `partOf`, dieselbe Kante
     wie überall. Ein eigenes „Punktreise"-Konstrukt wäre das erste Element,
     das dem Rückgrat nicht folgt. */
  var knoten=[];
  ENT.forEach(function(o){
    if(((o.interfaces||[])[0])!=="Place")return;
    if(!(o.relations||[]).some(function(r){ return r.type==="partOf"&&r.to===e.id; }))return;
    if(!articleVisible(o))return;
    knoten.push(o);
  });
  if(!knoten.length){
    wrap.appendChild(el("p",{class:"hint",
      text:"No nodes here. A point-crawl is made of places that sit inside this one (partOf) with routes between them."}));
    return wrap;
  }
  knoten.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});

  var gruppe=travellingParty();
  var karte=travelCard(gruppe);
  var hier=karte.at&&ENT.get(karte.at);
  if(hier&&knoten.indexOf(hier)<0) hier=null;
  var lagen=crawlLayers(hier,knoten);

  /* Kopfzeile: Tag, Wache, Zehrung. Die Zahlen, nach denen am Tisch gefragt
     wird — und die niemand nachführt, wenn sie nicht dastehen. */
  if(gruppe){
    var bar=el("div",{class:"maptools"});
    if(inPlacement) bar.style.display="none";
    bar.appendChild(el("span",{class:"pill",text:nameOf(gruppe)}));
    bar.appendChild(el("span",{class:"pill q",text:"Day "+(karte.day||1)+", watch "+(karte.watch||1)}));
    var jeRation=settingNum("travelRationEvery",3);
    var jeLicht=settingNum("travelLightEvery",4);
    if(jeRation>0){
      var offen=jeRation-((karte.sinceRation||0)%jeRation);
      bar.appendChild(el("span",{class:"pill q"+(offen===jeRation?"":""),
        text:"rations in "+(offen===jeRation?jeRation:offen)}));
    }
    if(jeLicht>0){
      var offenL=jeLicht-((karte.sinceLight||0)%jeLicht);
      bar.appendChild(el("span",{class:"pill q",
        text:"light in "+(offenL===jeLicht?jeLicht:offenL)}));
    }
    if(canWrite()&&hier) bar.appendChild(el("button",{class:"btn sm gh",type:"button",
      title:"A watch passes without moving",
      onclick:function(){ zeitVergeht(gruppe,karte,0); }},"Wait a watch"));
    wrap.appendChild(bar);
  }

  function zeitVergeht(g,k,knotenSchritt){
    var wachen=Math.max(1,settingNum("travelWatchesPerDay",3));
    var w=(Number(k.watch)||1)+1, d=Number(k.day)||1;
    if(w>wachen){ w=1; d++; }
    var patch={watch:w,day:d};
    if(knotenSchritt){
      patch.sinceRation=(Number(k.sinceRation)||0)+1;
      patch.sinceLight=(Number(k.sinceLight)||0)+1;
      patch.actions={};                    /* Handlungen gehören zum Knoten */
    }
    g.components=g.components||{};
    g.components[TRAVEL_COMP]=Object.assign({},k,patch);
    persist(g);
  }
  function zieheNach(g,k,ziel){
    /* Ankommen heisst erkunden, und erkunden deckt auf, wohin es von dort
       weitergeht (REQ-169) — sonst müsste die Spielleitung jede Kante von
       Hand freischalten und vergisst die halben. */
    setExpl(ziel,"explored");
    routesFrom(ziel).forEach(function(w){
      if((w.props||{}).hidden)return;
      if(explOf(w.to)==="hidden") setExpl(w.to,"discovered");
    });
    g.components=g.components||{};
    g.components[TRAVEL_COMP]=Object.assign({},k,{at:ziel.id});
    persist(g);
    zeitVergeht(g,Object.assign({},k,{at:ziel.id}),1);
  }

  /* Der Graph. Reihen nach Abstand vom Standort, Kanten als Linien. */
  var reihenIdx=Object.keys(lagen.reihen).map(Number).sort(function(a,b){return a-b;});
  var graph=el("div",{class:"crgraph"});
  reihenIdx.forEach(function(t){
    var sp=el("div",{class:"crcol"});
    sp.appendChild(el("div",{class:"ck",text:t===0?"here":(t>99?"unlinked":t+" away")}));
    lagen.reihen[t].forEach(function(k){
      var st=explOf(k);
      var b=el("button",{class:"crnode s-"+st+(hier&&k.id===hier.id?" here":""),type:"button",
        onclick:function(){ go({k:"art",id:k.id}); }});
      b.appendChild(el("b",{text:st==="hidden"&&!isGM()?"?":nameOf(k)}));
      var wege=routesFrom(k).length;
      b.appendChild(el("em",{text:wege+(wege===1?" way":" ways")}));
      sp.appendChild(b);
    });
    graph.appendChild(sp);
  });
  wrap.appendChild(graph);

  /* Von hier aus: die Wege mit ihrem Sinneseindruck. Das ist die Ansicht,
     die am Tisch benutzt wird — alles andere ist Übersicht. */
  if(hier){
    wrap.appendChild(el("div",{class:"sec",text:"From "+nameOf(hier)}));
    var ankunft=((hier.components||{})[EXPL_COMP]||{}).arrival;
    if(ankunft) wrap.appendChild(el("div",{class:"blk readaloud"},[para(fillVars(ankunft,null,hier))]));
    var wege=routesFrom(hier).filter(function(w){
      if(!isGM()&&(w.props||{}).hidden&&explOf(w.to)==="hidden")return false;
      return true;
    });
    if(!wege.length) wrap.appendChild(el("p",{class:"hint",text:"No way on from here."}));
    wege.forEach(function(w){
      var box=el("div",{class:"crway"});
      var kopf=el("div",{class:"ck"});
      kopf.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:w.to.id});}},
        explOf(w.to)==="hidden"&&!isGM()?"somewhere unknown":nameOf(w.to)));
      if(w.props.hours) kopf.appendChild(el("span",{class:"pill q",text:w.props.hours+" h"}));
      if(w.props.terrain) kopf.appendChild(el("span",{class:"pill q",text:w.props.terrain}));
      if(w.props.hidden) kopf.appendChild(el("span",{class:"pill q",text:"has to be found"}));
      if(w.back) kopf.appendChild(el("span",{class:"co",text:"back the way you came"}));
      if(gruppe&&canWrite()) kopf.appendChild(el("button",{class:"btn sm pri",type:"button",
        onclick:function(){ zieheNach(gruppe,travelCard(gruppe),w.to); }},"Travel"));
      box.appendChild(kopf);
      if(w.props.signal) box.appendChild(para(fillVars(w.props.signal,null,hier),"cb"));
      wrap.appendChild(box);
    });

    /* Handlungsbudget (REQ-171): eine Handlung je Figur und Knoten. */
    if(gruppe){
      var figuren=[];
      ENT.forEach(function(o){
        if(!(o.relations||[]).some(function(r){
          return r.type==="memberOfParty"&&r.to===gruppe.id; }))return;
        if(articleVisible(o)) figuren.push(o);
      });
      if(figuren.length){
        wrap.appendChild(el("div",{class:"sec",text:"At this node"}));
        var moeglich=String(setting("travelActions","scout,forage,rest"))
          .split(",").map(function(x){return x.trim();}).filter(Boolean);
        var tat=karte.actions||{};
        var ab=el("div",{class:"cractions"});
        figuren.forEach(function(f){
          var row=el("div",{class:"crowlite"});
          row.appendChild(el("span",{class:"rl",text:nameOf(f)}));
          var sel=el("select",{class:"bsel"});
          sel.appendChild(el("option",{value:""},"— nothing —"));
          moeglich.forEach(function(a){ sel.appendChild(el("option",{value:a},a)); });
          sel.value=tat[f.id]||"";
          if(!canWrite()) sel.disabled=true;
          sel.addEventListener("change",function(){
            var neu=Object.assign({},tat);
            if(sel.value) neu[f.id]=sel.value; else delete neu[f.id];
            gruppe.components=gruppe.components||{};
            gruppe.components[TRAVEL_COMP]=Object.assign({},karte,{actions:neu});
            persist(gruppe);
          });
          row.appendChild(sel);
          ab.appendChild(row);
        });
        wrap.appendChild(ab);
        wrap.appendChild(el("p",{class:"hint",
          text:"One action each per node. Moving on clears them — an action belongs to the node, not to the character."}));
      }
    }
  } else if(gruppe){
    wrap.appendChild(el("p",{class:"hint",
      text:"The party is not on this crawl yet. Open a node and set it as where they are."}));
    if(canWrite()){
      var setz=el("select",{class:"i",style:"width:auto"});
      setz.appendChild(el("option",{value:""},"— put the party at …"));
      knoten.forEach(function(k){ setz.appendChild(el("option",{value:k.id},nameOf(k))); });
      setz.addEventListener("change",function(){
        if(!setz.value)return;
        var ziel=ENT.get(setz.value);
        gruppe.components=gruppe.components||{};
        gruppe.components[TRAVEL_COMP]=Object.assign({},karte,{at:setz.value});
        persist(gruppe);
        if(ziel) setExpl(ziel,"explored");
      });
      wrap.appendChild(setz);
    }
  }

  /* Die Spielleitung stellt die Stufen von Hand um — der Aufdeckschritt
     beim Ankommen nimmt ihr die Regelfälle ab, nicht die Ausnahmen. */
  if(isGM()&&canWrite()){
    wrap.appendChild(el("div",{class:"sec",text:"What they know"}));
    var tabelle=el("table",{class:"craftm"});
    var hd=el("tr");
    ["Node","State","Ways"].forEach(function(h){ hd.appendChild(el("th",{text:h})); });
    tabelle.appendChild(hd);
    knoten.forEach(function(k){
      var row=el("tr");
      var c1=el("td");
      c1.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:k.id});}},nameOf(k)));
      row.appendChild(c1);
      var c2=el("td");
      var sel2=el("select",{class:"bsel"});
      EXPL_STATES.forEach(function(x){ sel2.appendChild(el("option",{value:x[0]},x[1])); });
      sel2.value=explOf(k);
      sel2.addEventListener("change",function(){ setExpl(k,sel2.value); });
      c2.appendChild(sel2);
      row.appendChild(c2);
      row.appendChild(el("td",{class:"num",text:String(routesFrom(k).length)}));
      tabelle.appendChild(row);
    });
    wrap.appendChild(tabelle);
  }
  return wrap;
}

/* ---------- Vorbereitung (REQ-078, 084, 188, 189, 190) ----------
   Vier Listen, die es ohne dieses Element auch gäbe — nur müsste man sie
   sich jedes Mal selbst zusammensuchen, und genau daran scheitert
   Vorbereitung.

   **Was hier steht, ist nirgends zusätzlich gespeichert.** Das Cockpit
   liest Kanten, die es ohnehin gibt (`partOf`, `features`, `happensAt`,
   `tableFor`), die Ideen sind Artikel im Stand „idea", und die offenen
   Punkte stehen an den Artikeln, zu denen sie gehören. Eine eigene Tabelle
   „Vorbereitung" wäre eine zweite Wahrheit, und die erste, die veraltet.

   **Schnellerfassung** (REQ-190) ist das eine Feld, das es dafür braucht:
   ein Satz landet als Punkt am Artikel, vor dem man gerade steht — ohne
   die Ansicht zu verlassen. Wer dafür erst irgendwohin springen muss,
   notiert es nicht. */
var TODO_COMP="Todos";

function todosOf(e){
  var c=(e.components||{})[TODO_COMP]||{};
  return Array.isArray(c.items)?c.items:[];
}
function setTodos(e,items){
  e.components=e.components||{};
  e.components[TODO_COMP]=Object.assign({},(e.components||{})[TODO_COMP]||{},{items:items});
  persist(e);
}
function addTodo(e,text){
  var t=String(text||"").trim(); if(!t)return;
  setTodos(e,todosOf(e).concat([{id:uid("td"),text:t,done:false,
    at:new Date().toISOString().slice(0,16).replace("T"," ")}]));
}
/* Alle offenen Punkte über alle Artikel hinweg (REQ-189). */
function allOpenTodos(){
  var out=[];
  ENT.forEach(function(e){
    if(!articleVisible(e))return;
    todosOf(e).forEach(function(t){ if(!t.done) out.push({e:e,t:t}); });
  });
  out.sort(function(a,b){ return String(b.t.at||"").localeCompare(String(a.t.at||"")); });
  return out;
}
/* Was an dieser Sitzung, diesem Kapitel, dieser Kampagne hängt — in beide
   Richtungen: was darauf zeigt und worauf es zeigt. */
function hangingOff(e){
  var raus=(e.relations||[]).map(function(r){
    var t=ENT.get(r.to); return t?{art:t,rel:relDef(r.type).label||r.type,dir:"out"}:null;
  }).filter(Boolean);
  var rein=[];
  ENT.forEach(function(o){
    (o.relations||[]).forEach(function(r){
      if(r.to!==e.id)return;
      rein.push({art:o,rel:relDef(r.type).inverseLabel||("← "+r.type),dir:"in"});
    });
  });
  return raus.concat(rein).filter(function(x){ return articleVisible(x.art); });
}

function elPrep(e,ifn,item){
  var wrap=el("div",{class:"prep"});

  /* 1 — Schnellerfassung. Steht oben, weil sie während des Spiels benutzt
     wird und nicht danach. */
  if(canWrite()){
    var qbar=el("div",{class:"addbar quick"});
    var qi=el("input",{class:"i",type:"text",
      placeholder:"A note for later — Enter files it here"});
    qi.addEventListener("keydown",function(ev){
      if(ev.key!=="Enter")return;
      ev.preventDefault();
      addTodo(e,qi.value); qi.value="";
    });
    qbar.appendChild(qi);
    qbar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      addTodo(e,qi.value); qi.value=""; }},"Note it"));
    qbar.appendChild(el("button",{class:"btn sm gh",type:"button",
      title:"File it as an idea of its own instead",
      onclick:function(){
        var t=qi.value.trim(); if(!t)return;
        var neu={ id:uid("id"), interfaces:[REG.interfaces.Article?"Article":ifn],
          name:t.slice(0,60),
          components:{ Identity:{name:t.slice(0,60),id:nextId("Idea"),aliases:[]},
            Status:{status:"idea"}, Description:{description:t}, Tags:{tags:["idee"]} },
          adhoc:[], relations:[], createdAt:new Date().toISOString() };
        reqFor(neu.interfaces[0]).forEach(function(c){
          if(!neu.components[c]&&REG.interfaces[c]) neu.components[c]={}; });
        applyDefaults(neu,neu.interfaces[0]);
        ENT.set(neu.id,neu); persist(neu);
        qi.value="";
      }},"As an idea"));
    wrap.appendChild(qbar);
  }

  /* 2 — Das Cockpit: was an diesem Artikel hängt (REQ-078). */
  var dran=hangingOff(e);
  if(dran.length){
    wrap.appendChild(el("div",{class:"sec",text:"Hanging off this"}));
    var gruppen={};
    dran.forEach(function(x){ (gruppen[x.rel]=gruppen[x.rel]||[]).push(x); });
    var cock=el("div",{class:"cockpit"});
    Object.keys(gruppen).sort().forEach(function(k){
      var sp=el("div",{class:"cgroup"});
      sp.appendChild(el("div",{class:"ck",text:k}));
      gruppen[k].forEach(function(x){
        var row=el("div",{class:"crowlite"});
        row.appendChild(el("button",{class:"ref",type:"button",
          onclick:function(){go({k:"art",id:x.art.id});}},nameOf(x.art)));
        var st=((x.art.components||{}).Status||{}).status;
        if(st&&st!=="used") row.appendChild(el("span",{class:"pill q",text:st}));
        var off=todosOf(x.art).filter(function(t){return !t.done;}).length;
        if(off) row.appendChild(el("span",{class:"co",text:off+" open"}));
        sp.appendChild(row);
      });
      cock.appendChild(sp);
    });
    wrap.appendChild(cock);
  }

  /* 3 — Die offenen Punkte an diesem Artikel. */
  var meine=todosOf(e);
  wrap.appendChild(el("div",{class:"sec",text:"To do here"}));
  if(!meine.length) wrap.appendChild(el("p",{class:"hint",text:"Nothing noted."}));
  else{
    var liste=el("div",{class:"tasks"});
    meine.forEach(function(t){
      var row=el("label",{class:"task"+(t.done?" done":"")});
      var cb=el("input",{type:"checkbox"});
      cb.checked=!!t.done; cb.disabled=!canWrite();
      cb.addEventListener("change",function(){
        setTodos(e,meine.map(function(x){
          return x===t?Object.assign({},x,{done:cb.checked}):x; }));
      });
      row.appendChild(cb);
      row.appendChild(inline(t.text||"",el("span")));
      if(t.at) row.appendChild(el("span",{class:"co",text:t.at}));
      if(canWrite()) row.appendChild(el("button",{class:"btn gh sm",type:"button",
        onclick:function(ev){ ev.preventDefault();
          setTodos(e,meine.filter(function(x){return x!==t;})); }},"×"));
      liste.appendChild(row);
    });
    wrap.appendChild(liste);
  }

  /* 4 — Alles Offene über die Kampagne hinweg (REQ-189) und alles, was noch
     Idee oder geplant ist (REQ-084, 188). Beides mit Sprung dorthin —
     eine Liste ohne Sprung ist eine Liste, die man abschreibt. */
  var alle=allOpenTodos().filter(function(x){ return x.e.id!==e.id; });
  wrap.appendChild(el("div",{class:"sec",text:"Open elsewhere"}));
  if(!alle.length) wrap.appendChild(el("p",{class:"hint",text:"Nothing open anywhere else."}));
  else{
    var box=el("div",{class:"qlist"});
    alle.slice(0,20).forEach(function(x){
      var row=el("div",{class:"qrow"});
      var t2=el("div",{class:"qt"});
      t2.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:x.e.id});}},nameOf(x.e)));
      t2.appendChild(inline(x.t.text||"",el("span")));
      row.appendChild(t2);
      if(x.t.at) row.appendChild(el("span",{class:"qmeta",text:x.t.at}));
      box.appendChild(row);
    });
    wrap.appendChild(box);
    if(alle.length>20) wrap.appendChild(el("p",{class:"hint",
      text:"…and "+(alle.length-20)+" more."}));
  }

  var unfertig=[];
  ENT.forEach(function(o){
    if(!articleVisible(o))return;
    var st=((o.components||{}).Status||{}).status;
    if(st==="idea"||st==="planned") unfertig.push({e:o,st:st});
  });
  unfertig.sort(function(a,b){
    if(a.st!==b.st)return a.st==="idea"?-1:1;
    return nameOf(a.e).localeCompare(nameOf(b.e),"de");
  });
  wrap.appendChild(el("div",{class:"sec",text:"Not finished"}));
  if(!unfertig.length) wrap.appendChild(el("p",{class:"hint",text:"Everything is in play."}));
  else{
    var ub=el("div",{class:"qlist"});
    unfertig.slice(0,30).forEach(function(x){
      var row=el("div",{class:"qrow"});
      var t3=el("div",{class:"qt"});
      t3.appendChild(el("span",{class:"pill q",text:x.st}));
      t3.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:x.e.id});}},nameOf(x.e)));
      t3.appendChild(el("span",{class:"co",text:ifaceName(x.e)}));
      row.appendChild(t3);
      if(canWrite()){
        /* Den Stand gleich hier ändern: wer dafür erst hinspringen muss,
           lässt ihn stehen, und die Liste wird zur Tapete. */
        var sel=el("select",{class:"bsel"});
        ["idea","planned","used","discarded"].forEach(function(v){
          sel.appendChild(el("option",{value:v},v)); });
        sel.value=x.st;
        sel.addEventListener("change",function(){
          x.e.components=x.e.components||{};
          x.e.components.Status=Object.assign({},x.e.components.Status||{},{status:sel.value});
          persist(x.e);
        });
        row.appendChild(sel);
      }
      ub.appendChild(row);
    });
    wrap.appendChild(ub);
    wrap.appendChild(el("p",{class:"hint",
      text:unfertig.length+" article"+(unfertig.length===1?"":"s")+
        " still idea or planned. The compendium’s status filter shows them all, and the bulk bar changes many at once."}));
  }
  return wrap;
}

/* ---------- Tabellen (REQ-085, 125, 172, 186) ----------
   Einträge, die auf einen Artikel zeigen, sind Kanten; Einträge, die auf
   nichts zeigen — ein Name, ein Wetter, ein Satz — stehen im Feld. Dieselbe
   Trennlinie wie bei den Formen auf dem Board und den Aufgaben im Auftrag.

   **Gewichte statt Bereiche.** „1–3, 4–5, 6" von Hand zu führen bricht,
   sobald jemand eine Zeile einfügt; die Bereiche rechnet die Seite aus. Der
   Würfel daneben sagt, womit man am Tisch selbst würfeln kann — dann ist er
   eine Angabe und keine Rechnung.

   Eine Tabelle darf in einer Tabelle stehen. Das braucht genau einen
   Zyklusschutz und sonst nichts: wer A → B → A legt, bekommt keinen
   Absturz, sondern ein Ende. */
var TABLE_IFACE="Table", TABLE_COMP="Table",
    REL_ENTRY="entry", REL_TABLEFOR="tableFor";

/* Alle Einträge, Kanten und Feldzeilen in einer Liste. Die Reihenfolge ist
   die gespeicherte: Kanten zuerst, dann die Feldzeilen. */
function tableEntries(t){
  var card=(t.components||{})[TABLE_COMP]||{};
  var out=[];
  (t.relations||[]).forEach(function(r){
    if(r.type!==REL_ENTRY)return;
    var ziel=ENT.get(r.to);
    var pr=r.props||{};
    out.push({kind:"ref",rel:r,target:ziel,
      label:pr.label||(ziel?nameOf(ziel):"(missing)"),
      weight:Math.max(0,Number(pr.weight)||1),qty:pr.qty||"",
      requiresTag:pr.requiresTag||"",note:pr.note||""});
  });
  (Array.isArray(card.rows)?card.rows:[]).forEach(function(z){
    out.push({kind:"row",row:z,label:String(z.text||z.label||""),
      weight:Math.max(0,Number(z.weight)||1),qty:z.qty||"",
      requiresTag:z.requiresTag||"",note:z.note||""});
  });
  return out;
}
/* Bereiche aus Gewichten. Bei ganzzahligen Gewichten steht „4–6" da, bei
   krummen die Wahrscheinlichkeit — anders wäre eine der beiden Anzeigen
   gelogen. */
function tableRanges(eintraege){
  var summe=eintraege.reduce(function(a,b){return a+b.weight;},0);
  var ganz=eintraege.every(function(x){return x.weight===Math.round(x.weight);});
  var at=1;
  return eintraege.map(function(x){
    var von=at, bis=at+Math.round(x.weight)-1;
    at=bis+1;
    return {e:x,von:von,bis:bis,ganz:ganz,
      anteil:summe?x.weight/summe:0,summe:summe};
  });
}
/* Was der Ort verlangt: ein Eintrag mit `requiresTag` kommt nur in den
   Topf, wenn der Zusammenhang die Marke trägt (REQ-172). */
function tablePool(t,kontext){
  var marken=tagsOf(kontext);
  return tableEntries(t).filter(function(x){
    if(!x.requiresTag)return true;
    return marken.indexOf(x.requiresTag)>=0;
  }).filter(function(x){ return x.weight>0; });
}
/* Einmal würfeln. Verschachtelte Tabellen lösen sich auf, bis der
   Zyklusschutz greift — eine Tabelle, die sich selbst enthält, ist ein
   Fehler in den Daten und kein Grund, die Seite anzuhalten. */
function rollTable(t,kontext,gesehen,tiefe){
  gesehen=gesehen||{}; tiefe=tiefe||0;
  if(gesehen[t.id]||tiefe>6) return {text:"(table loops back on itself)",loop:true};
  gesehen[t.id]=1;
  var pool=tablePool(t,kontext);
  if(!pool.length) return {text:"(nothing in the pool here)",empty:true};
  var summe=pool.reduce(function(a,b){return a+b.weight;},0);
  var w=Math.random()*summe, at=0, treffer=pool[pool.length-1];
  for(var i=0;i<pool.length;i++){ at+=pool[i].weight; if(w<at){ treffer=pool[i]; break; } }
  var menge=treffer.qty?rollDice(treffer.qty):null;
  var text=(menge?menge.total+"× ":"")+treffer.label;
  if(treffer.kind==="ref"&&treffer.target&&
     ((treffer.target.interfaces||[])[0])===TABLE_IFACE){
    var tiefer=rollTable(treffer.target,kontext,gesehen,tiefe+1);
    return {text:treffer.label+" → "+tiefer.text,target:tiefer.target||treffer.target,
      nested:tiefer,qty:menge?menge.total:null};
  }
  return {text:text,target:treffer.kind==="ref"?treffer.target:null,
    qty:menge?menge.total:null,entry:treffer};
}

function elTable(e,ifn,item){
  var card=(e.components||{})[TABLE_COMP]||{};
  var wrap=el("div",{class:"tablebox"});

  /* Auf einem Ort, einer Szene oder einer Begegnung zeigt dasselbe Element
     die Tabellen, die *hier* gelten — und würfelt sie mit diesem Artikel
     als Zusammenhang. Erst dadurch greift `requiresTag`: ein Eintrag, der
     nur in der Kerzengasse vorkommt, kommt nur dort in den Topf. */
  if(!card.die&&!((e.relations||[]).some(function(r){return r.type===REL_ENTRY;}))){
    var hier=(e.relations||[]).filter(function(r){return r.type===REL_TABLEFOR;})
      .map(function(r){ return ENT.get(r.to); }).filter(Boolean);
    if(!hier.length){
      wrap.appendChild(el("p",{class:"hint",
        text:"No table here. Link one with the relation “rolls on”."}));
      return wrap;
    }
    var bar0=el("div",{class:"rowbtns"});
    hier.forEach(function(t){
      bar0.appendChild(el("button",{class:"btn sm pri",type:"button",onclick:function(){
        var r=rollTable(t,e);
        shareRoll(nameOf(t)+" @ "+nameOf(e),{total:0,rolls:[],expr:"",pretty:r.text});
        render();
      }},"Roll "+nameOf(t)));
      bar0.appendChild(el("button",{class:"btn sm gh",type:"button",
        onclick:function(){go({k:"art",id:t.id});}},"open"));
    });
    wrap.appendChild(bar0);
    wrap.appendChild(el("p",{class:"hint",
      text:"Rolled with this article as the context — entries that ask for a tag only come up where it is."}));
    if(UI.rollLog.length){
      var log0=el("div",{class:"rolllog"});
      UI.rollLog.slice(0,6).forEach(function(x){
        var row0=el("div",{class:"rollrow"});

/* ---------- Aufträge und Zeitleiste (REQ-082, 083, 106) ----------
   Aufgaben liegen als Feld am Auftrag, nicht als Kanten: „bring das Fass
   zurück" zeigt auf nichts, was eine eigene ID verdiente. Zeigt eine Aufgabe
   doch auf etwas, steht das im Text als [[Verweis]] — und der löst sich auf
   wie jeder andere. Dieselbe Trennlinie wie bei den Formen auf dem Board.

   Was auf dem Brett *steht*, entscheidet das Wissen: ein Auftrag, dessen
   Informationen du nicht kennst, steht als Gerücht da, nicht als Zeile mit
   Belohnung. Das Wissensmodell aus A6 trägt auch hier. */
var QUEST_IFACE="Quest", QUEST_COMP="Quest";
var QUEST_STATES=[
  ["rumoured","Rumoured"],["offered","Offered"],["accepted","Running"],
  ["done","Done"],["failed","Failed"],["abandoned","Dropped"]
];

function questCard(q){ return (q.components||{})[QUEST_COMP]||{}; }
function questTasks(q){
  var t=questCard(q).tasks;
  return Array.isArray(t)?t:[];
}
/* Wie viel weiss dieser Betrachter vom Auftrag? Dieselben drei Zustände wie
   beim Rezept — offen, teilweise, verborgen. */
function questKnowledge(q,viewerId){
  var infos=infosOf(q);
  if(!infos.length)return "open";
  var n=infos.filter(function(i){ return knowsInfo(i,viewerId); }).length;
  return n===infos.length?"known":(n?"partial":"hidden");
}

function elQuests(e,ifn,item){
  var wrap=el("div",{class:"quests"});

  /* Auf dem Auftrag selbst: die Aufgaben zum Abhaken. */
  if(ifn===QUEST_IFACE||((e.components||{})[QUEST_COMP])){
    var card=questCard(e);
    var kopf=el("div",{class:"crhead"});
    var lab=QUEST_STATES.filter(function(x){return x[0]===card.state;})[0];
    kopf.appendChild(el("span",{class:"pill",text:lab?lab[1]:(card.state||"—")}));
    if(card.deadline) kopf.appendChild(el("span",{class:"pill q",text:"by "+card.deadline}));
    if(card.reward) kopf.appendChild(el("span",{class:"pill q",text:card.reward}));
    if(card.restriction) kopf.appendChild(el("span",{class:"pill q",text:card.restriction}));
    if(canWrite()){
      var sel=el("select",{class:"bsel"});
      QUEST_STATES.forEach(function(x){ sel.appendChild(el("option",{value:x[0]},x[1])); });
      sel.value=card.state||"rumoured";
      sel.addEventListener("change",function(){
        e.components[QUEST_COMP]=Object.assign({},card,{state:sel.value}); persist(e); });
      kopf.appendChild(sel);
    }
    wrap.appendChild(kopf);

    var aufgaben=questTasks(e);
    wrap.appendChild(el("div",{class:"sec",text:"Tasks"}));
    if(!aufgaben.length) wrap.appendChild(el("p",{class:"hint",text:"None yet."}));
    var liste=el("div",{class:"tasks"});
    aufgaben.forEach(function(t){
      var row=el("label",{class:"task"+(t.done?" done":"")});
      var cb=el("input",{type:"checkbox"});
      cb.checked=!!t.done; cb.disabled=!canWrite();
      cb.addEventListener("change",function(){
        var neu=aufgaben.map(function(x){
          return x===t?Object.assign({},x,{done:cb.checked}):x; });
        e.components[QUEST_COMP]=Object.assign({},card,{tasks:neu}); persist(e);
      });
      row.appendChild(cb);
      row.appendChild(inline(t.text||"",el("span")));
      if(t.optional) row.appendChild(el("span",{class:"co",text:"optional"}));
      if(canWrite()) row.appendChild(el("button",{class:"btn gh sm",type:"button",
        onclick:function(ev){ ev.preventDefault();
          var neu=aufgaben.filter(function(x){return x!==t;});
          e.components[QUEST_COMP]=Object.assign({},card,{tasks:neu}); persist(e); }},"×"));
      liste.appendChild(row);
    });
    wrap.appendChild(liste);
    if(canWrite()){
      var neu2=el("input",{class:"i",type:"text",placeholder:"A task — [[links]] work here"});
      var bar=el("div",{class:"addbar",style:"margin-top:8px"});
      bar.appendChild(neu2);
      bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
        var txt=neu2.value.trim(); if(!txt)return;
        e.components[QUEST_COMP]=Object.assign({},card,
          {tasks:aufgaben.concat([{id:uid("t"),text:txt,done:false}])});
        persist(e);
      }},"Add task"));
      wrap.appendChild(bar);
    }
    /* Fortschritt: die Zahl, nach der am Tisch gefragt wird. */
    var fertig=aufgaben.filter(function(t){return t.done;}).length;
    if(aufgaben.length) wrap.appendChild(el("p",{class:"hint",
      text:fertig+" of "+aufgaben.length+" done"}));
    return wrap;
  }

  /* Sonst: das Brett. Gruppiert nach Stand, gefiltert durchs Wissen. */
  var alle=[];
  ENT.forEach(function(o){ if(((o.interfaces||[])[0])===QUEST_IFACE) alle.push(o); });
  if(!alle.length){ wrap.appendChild(el("p",{class:"hint",text:"No quests yet."}));
    return wrap; }
  alle.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});

  QUEST_STATES.forEach(function(st){
    var drin=alle.filter(function(q){ return (questCard(q).state||"rumoured")===st[0]; });
    if(!drin.length)return;
    wrap.appendChild(el("div",{class:"sec",text:st[1]}));
    var box=el("div",{class:"qlist"});
    drin.forEach(function(q){
      var w=questKnowledge(q,e.id);
      var row=el("div",{class:"qrow "+(w==="hidden"?"unknown":"")});
      var c=questCard(q);
      var t2=el("div",{class:"qt"});
      t2.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:q.id});}},
        w==="hidden"?"(a rumour you have not chased)":nameOf(q)));
      if(w==="partial") t2.appendChild(el("span",{class:"co",text:"partly known"}));
      row.appendChild(t2);
      if(w!=="hidden"){
        var auf=questTasks(q);
        var fert=auf.filter(function(x){return x.done;}).length;
        row.appendChild(el("span",{class:"qmeta",
          text:(auf.length?fert+"/"+auf.length+" tasks":"")+
            (c.deadline?"  ·  "+c.deadline:"")+(c.reward?"  ·  "+c.reward:"")}));
      }
      box.appendChild(row);
    });
    wrap.appendChild(box);
  });
  return wrap;
}

/* ---------- Zeitleiste (REQ-106) ----------
   Jeder Artikel mit einem Weltdatum steht darauf, nicht nur Ereignisse:
   eine Sitzung, ein Vertrag, ein Todesfall sind dasselbe für die Zeitleiste.
   Sortiert nach `sort`, gelesen `display` — deshalb stehen beide im Schema. */
function worldDated(){
  var out=[];
  ENT.forEach(function(o){
    var wd=(o.components||{}).Time;
    if(!wd)return;
    if(wd.sort===undefined&&!wd.display)return;
    out.push({e:o,wd:wd,sort:Number(wd.sort)});
  });
  out.sort(function(a,b){
    var as=isFinite(a.sort)?a.sort:Infinity, bs=isFinite(b.sort)?b.sort:Infinity;
    if(as!==bs)return as-bs;
    return nameOf(a.e).localeCompare(nameOf(b.e),"de");
  });
  return out;
}
function elTimeline(e,ifn,item){
  var wrap=el("div",{class:"tline"});
  var alle=worldDated();
  if(!alle.length){
    wrap.appendChild(el("p",{class:"hint",
      text:"Nothing carries a world date yet. Fill `sort` and `display` on an article — `sort` orders it, `display` is what gets read out."}));
    return wrap;
  }
  var kal=setting("calendar","");
  if(kal) wrap.appendChild(el("p",{class:"hint",text:"Calendar: "+kal}));
  alle.forEach(function(x){
    var row=el("div",{class:"tl"+(x.e.id===e.id?" here":"")});
    row.appendChild(el("span",{class:"tdate",text:x.wd.display||String(x.wd.sort||"")}));
    var b=el("div",{class:"tbody"});
    b.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:x.e.id});}},nameOf(x.e)));
    b.appendChild(el("span",{class:"pill q",text:ifaceName(x.e)}));
    var d=((x.e.components||{}).Description||{}).description;
    if(d) b.appendChild(para(fillVars(d,null,x.e),"co"));
    if(x.wd.duration) b.appendChild(el("span",{class:"co",text:x.wd.duration}));
    row.appendChild(b);
    wrap.appendChild(row);
  });
  return wrap;
}

/* ---------- Regeln: nachschlagen, verweisen, anheften (REQ-091, 098, 099, 175) ----------
   Der Massstab steht in REQ-098: unter fünf Sekunden. Daran hängt alles
   andere — wer eine Regel erst sucht, dann öffnet, dann liest, hat die
   fünf Sekunden schon überschritten. Also: alles auf einer Seite, der Text
   gleich mit, und getippt wird höchstens ein Wortanfang.

   **Verweise im Fliesstext** (REQ-175) sind der zweite Weg dorthin: wo eine
   Regel beim Namen genannt wird, steht sie auch. Das Erkennen ist bewusst
   vorsichtig — nur ganze Wörter, nur ab vier Zeichen, und nur, wo genau
   eine Regel in Frage kommt. Ein falscher Treffer kostet mehr Vertrauen,
   als zehn richtige einbringen; deshalb lässt sich das Erkennen je Regel
   abschalten und im Zweifel unterbleibt es.

   **Angeheftete Regeln** (REQ-099) liegen im eigenen Bereich des Nutzers —
   `data/users/me` ist je Betrachter privat. Ein Merkzettel, den alle sehen,
   ist keiner. */
var RULE_IFACE="Rule", RULE_COMP="Rule";
var pinned=[], pinsLoaded=false;

function ruleArticles(){
  var out=[];
  ENT.forEach(function(e){
    if(((e.interfaces||[])[0])!==RULE_IFACE)return;
    if(!articleVisible(e))return;
    out.push(e);
  });
  out.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
  return out;
}
function ruleText(e){
  var d=((e.components||{}).Description||{}).description;
  if(d)return d;
  var p=allProse(e)[0];
  return p?p.value:"";
}
/* Die Namen und Aliasse, gegen die der Fliesstext geprüft wird. Lang vor
   kurz, damit „Umschlingen des Schleims" nicht als „Umschlingen" endet. */
var ruleIndexSig="", ruleIndex=[];
function rebuildRuleIndex(){
  var sig=[];
  var eintraege=[];
  ENT.forEach(function(e){
    if(((e.interfaces||[])[0])!==RULE_IFACE)return;
    var info=(e.components||{})[RULE_COMP]||{};
    if(info.autolink===false)return;
    var id=(e.components||{}).Identity||{};
    var namen=[rawName(e)].concat(Array.isArray(id.aliases)?id.aliases:[]);
    namen.forEach(function(n){
      var t=String(n||"").trim();
      if(t.length<4)return;                  /* zu kurz, trifft zu oft */
      eintraege.push({t:t,low:t.toLowerCase(),id:e.id});
    });
    sig.push(e.id+":"+namen.join("|"));
  });
  var s2=sig.sort().join(";");
  if(s2===ruleIndexSig)return ruleIndex;
  /* Mehrdeutige Namen fliegen raus: „auto-link when unambiguous" (REQ-013),
     und Uneindeutigkeit heisst hier: zwei Regeln, ein Wort. */
  var zaehler={};
  eintraege.forEach(function(x){ (zaehler[x.low]=zaehler[x.low]||[]).push(x.id); });
  ruleIndex=eintraege.filter(function(x){
    var ids=zaehler[x.low];
    return ids.length===1||ids.every(function(i){return i===ids[0];});
  }).sort(function(a,b){ return b.t.length-a.t.length; });
  ruleIndexSig=s2;
  return ruleIndex;
}
/* Einen Textknoten nach Regelnamen absuchen und die Treffer ersetzen. Läuft
   über die fertigen Knoten, nicht über den Rohtext: so bleiben [[Verweise]]
   und {VAR} unangetastet — sie sind schon Elemente, keine Zeichen mehr. */
function markRules(root){
  if(!root)return root;
  var idx=rebuildRuleIndex();
  if(!idx.length)return root;
  var texte=[];
  (function sammle(n){
    for(var i=0;i<n.childNodes.length;i++){
      var k=n.childNodes[i];
      if(k.nodeType===3) texte.push(k);
      else if(k.nodeType===1&&k.tagName!=="BUTTON"&&!k.classList.contains("ruleref")) sammle(k);
    }
  })(root);
  texte.forEach(function(tn){
    var s2=tn.nodeValue;
    if(!s2||s2.length<4)return;
    var low=s2.toLowerCase();
    var treffer=null, at=-1;
    for(var i=0;i<idx.length;i++){
      var p=low.indexOf(idx[i].low);
      while(p>=0){
        var vor=p===0?" ":s2.charAt(p-1);
        var nach=p+idx[i].t.length>=s2.length?" ":s2.charAt(p+idx[i].t.length);
        if(!/[\wÄÖÜäöüß]/.test(vor)&&!/[\wÄÖÜäöüß]/.test(nach)){ treffer=idx[i]; at=p; break; }
        p=low.indexOf(idx[i].low,p+1);
      }
      if(treffer)break;
    }
    if(!treffer)return;
    var e=ENT.get(treffer.id); if(!e)return;
    var frag=document.createDocumentFragment();
    if(at>0) frag.appendChild(document.createTextNode(s2.slice(0,at)));
    frag.appendChild(ruleChip(e,s2.substr(at,treffer.t.length)));
    var rest=s2.slice(at+treffer.t.length);
    if(rest) frag.appendChild(document.createTextNode(rest));
    tn.parentNode.replaceChild(frag,tn);
  });
  return root;
}
/* Ein Verweis, der sich an Ort und Stelle aufklappt. Wegspringen und
   zurückspringen sind zwei Schritte zu viel für fünf Sekunden. */
function ruleChip(e,text){
  var wrap=el("span",{class:"ruleref"});
  var b=el("button",{class:"rulew",type:"button",title:"Rule: "+nameOf(e)},text);
  var box=el("span",{class:"rulepop"});
  box.style.display="none";
  b.addEventListener("click",function(ev){
    ev.stopPropagation();
    if(box.style.display==="none"){
      box.textContent="";
      var info=(e.components||{})[RULE_COMP]||{};
      var kopf=el("span",{class:"rk"});
      kopf.appendChild(el("b",{text:nameOf(e)}));
      if(info.kind) kopf.appendChild(el("span",{class:"pill q",text:info.kind}));
      if(info.uses) kopf.appendChild(el("span",{class:"co",text:info.uses}));
      if(info.recharge) kopf.appendChild(el("span",{class:"co",text:"recharge "+info.recharge}));
      kopf.appendChild(el("button",{class:"btn gh sm",type:"button",
        onclick:function(ev2){ ev2.stopPropagation(); go({k:"art",id:e.id}); }},"open"));
      kopf.appendChild(pinButton(e));
      box.appendChild(kopf);
      box.appendChild(inline(fillVars(ruleText(e),null,e),el("span",{class:"rt"})));
      box.style.display="";
    } else box.style.display="none";
  });
  wrap.appendChild(b); wrap.appendChild(box);
  return wrap;
}

/* ---- Merkzettel (REQ-099) ---- */
function pinButton(e){
  var an=pinned.indexOf(e.id)>=0;
  return el("button",{class:"btn gh sm"+(an?" pri":""),type:"button",
    title:an?"Unpin":"Pin this rule",
    onclick:function(ev){ ev.stopPropagation(); togglePin(e.id); }},an?"pinned":"pin");
}
function togglePin(id){
  pinned=pinned.indexOf(id)>=0?pinned.filter(function(x){return x!==id;}):pinned.concat([id]);
  savePins();
  render();
}
function savePins(){
  if(!db)return;
  /* `data/users/me` ist je Betrachter privat — ein Merkzettel, den alle
     sehen, ist keiner. Misslingt es, bleibt der Zettel für diese Sitzung
     stehen; ein Merkzettel ist keine Kampagnendatei. */
  try{ db.doc("data/users/me").set({pins:pinned,at:new Date().toISOString()})["catch"](function(){}); }
  catch(x){}
}
function loadPins(){
  if(!db||pinsLoaded)return;
  pinsLoaded=true;
  try{
    db.doc("data/users/me").onSnapshot(function(s2){
      var d=s2&&s2.exists&&s2.data();
      pinned=(d&&Array.isArray(d.pins))?d.pins.slice():[];
      render();
    },function(){});
  }catch(x){}
}

/* ---- Der Regelbrowser (REQ-091, 098) ---- */
function renderRules(v){
  v.appendChild(el("h2",{text:"Rules"}));
  v.appendChild(el("p",{class:"hint",
    text:"Everything on one page with its text, because looking a rule up in another view is already too slow. Type a word; the list narrows as you go."}));

  var alle=ruleArticles();
  if(!alle.length){
    v.appendChild(el("div",{class:"empty",text:"No rule elements yet."}));
    return;
  }

  var suche=el("input",{class:"i",type:"search",placeholder:"Type a word…",
    value:UI.ruleQ||"",autofocus:"autofocus"});

  var arten=el("div",{class:"chips"});
  var body=el("div");

  var sorten={};
  alle.forEach(function(e){
    var k=((e.components||{})[RULE_COMP]||{}).kind||"—";
    sorten[k]=(sorten[k]||0)+1;
  });
  Object.keys(sorten).sort().forEach(function(k){
    arten.appendChild(el("button",{class:"chip pick"+(UI.ruleKind===k?" on":""),type:"button",
      "aria-pressed":String(UI.ruleKind===k),
      onclick:function(){ UI.ruleKind=UI.ruleKind===k?"":k; zeichne(); }},
      k+" ("+sorten[k]+")"));
  });
  v.appendChild(suche);
  v.appendChild(arten);

  if(pinned.length){
    var pb=el("div",{class:"pinbar"});
    pb.appendChild(el("span",{class:"rl",text:"Pinned"}));
    pinned.forEach(function(id){
      var e=ENT.get(id); if(!e)return;
      pb.appendChild(el("button",{class:"chip",type:"button",
        onclick:function(){ UI.ruleQ=rawName(e); suche.value=UI.ruleQ; zeichne(); }},nameOf(e)));
    });
    v.appendChild(pb);
  }
  v.appendChild(body);

  function zeichne(){
    body.textContent="";
    var q=String(UI.ruleQ||"").toLowerCase().trim();
    var treffer=alle.filter(function(e){
      if(UI.ruleKind&&(((e.components||{})[RULE_COMP]||{}).kind||"—")!==UI.ruleKind)return false;
      if(!q)return true;
      if(nameOf(e).toLowerCase().indexOf(q)>=0)return true;
      var al=((e.components||{}).Identity||{}).aliases||[];
      if(al.some(function(a){return String(a).toLowerCase().indexOf(q)>=0;}))return true;
      return ruleText(e).toLowerCase().indexOf(q)>=0;
    });
    /* Namenstreffer vor Texttreffern: wer „Umschlingen" tippt, meint die
       Regel und nicht jede, die das Wort erwähnt. */
    treffer.sort(function(a,b){
      var an=nameOf(a).toLowerCase().indexOf(q)>=0?0:1;
      var bn=nameOf(b).toLowerCase().indexOf(q)>=0?0:1;
      if(an!==bn)return an-bn;
      return nameOf(a).localeCompare(nameOf(b),"de");
    });
    body.appendChild(el("p",{class:"count",
      text:treffer.length+" of "+alle.length}));
    var liste=el("div",{class:"rules"});
    treffer.slice(0,40).forEach(function(e){
      var info=(e.components||{})[RULE_COMP]||{};
      var karte=el("div",{class:"rule"});
      var kopf=el("div",{class:"rk"});
      kopf.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:e.id});}},nameOf(e)));
      if(info.kind) kopf.appendChild(el("span",{class:"pill q",text:info.kind}));
      if(info.uses) kopf.appendChild(el("span",{class:"co",text:info.uses}));
      if(info.recharge) kopf.appendChild(el("span",{class:"co",text:"recharge "+info.recharge}));
      kopf.appendChild(pinButton(e));
      karte.appendChild(kopf);
      /* Der Text steht gleich da — das ist der ganze Punkt. */
      karte.appendChild(inline(fillVars(ruleText(e),null,e),el("p",{class:"rt"})));
      /* Wer die Regel benutzt: der Rückbezug, den `composedOf` schon trägt. */
      var nutzer=[];
      ENT.forEach(function(o){
        (o.relations||[]).forEach(function(r){
          if(r.to===e.id&&relDef(r.type).section&&articleVisible(o)) nutzer.push(o);
        });
      });
      if(nutzer.length){
        var nb=el("div",{class:"rusers"});
        nb.appendChild(el("span",{class:"rl",text:"used by"}));
        nutzer.slice(0,8).forEach(function(o){
          nb.appendChild(el("button",{class:"ref",type:"button",
            onclick:function(){go({k:"art",id:o.id});}},nameOf(o)));
        });
        karte.appendChild(nb);
      }
      liste.appendChild(karte);
    });
    body.appendChild(liste);
    if(treffer.length>40) body.appendChild(el("p",{class:"hint",
      text:"…and "+(treffer.length-40)+" more. Narrow it down."}));
  }
  zeichne();
  setTimeout(function(){ try{ suche.focus(); }catch(x){} },0);
}

/* ---------- Sicherung und Ausfuhr (REQ-029, 155, 191, 192) ----------
   Der Grund steht in der alten App: ein misslungener Ladevorgang wurde von
   der nächsten Selbstspeicherung überschrieben, und der unlesbare Stand war
   danach weg. Deshalb zwei Regeln, die nichts kosten und alles retten:

   **Nach einem kaputten Ladevorgang wird nicht geschrieben.** `loadFailed`
   schliesst jeden Schreibweg, und die Seite sagt, was ausblieb, statt es
   zuzudecken. Was da ist, lässt sich weiterhin herunterladen — auch und
   gerade dann.

   **Eine fremde Änderung am offenen Artikel wird gesagt, nicht verschluckt.**
   Der Speicher kennt keine Bedingung am Schreiben, also lässt sich der
   zweite Schreiber nicht abweisen; erkennen und hinschreiben lässt er sich
   schon, und das ist mehr, als eine stille Überschreibung hinterlässt. */
var loadFailed="", lastSeenAt={}, lastWroteAt={}, foreignEdit="";

function blockedByLoad(){
  if(!loadFailed)return false;
  UI.err="Nothing is being saved: "+loadFailed+
    " Reload the page. Until then you can still download what is here — "+
    "Data model · Backup.";
  render();
  return true;
}

/* Der ganze Stand als ein Stück. Was hier hineingeht, geht auch wieder
   heraus: Register und Artikel, sonst nichts, und die Fassung dazu, damit
   ein späteres Einlesen weiss, was es vor sich hat. */
function exportState(){
  var ents=[];
  ENT.forEach(function(e){ ents.push(e); });
  ents.sort(function(a,b){ return String(a.id).localeCompare(String(b.id)); });
  return {
    format:"nebelwacht/1",
    at:new Date().toISOString(),
    registry:{interfaces:REG.interfaces,components:REG.interfaces,
      relations:REG.relations,views:REG.views,vars:REG.vars,settings:REG.settings},
    entities:ents
  };
}
function exportFilename(){
  return "nebelwacht-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".json";
}
/* Herunterladen: über die Laufzeit, wenn sie es anbietet, sonst über einen
   Link. Der Rückfall ist kein Beiwerk — eine Sicherung, die von einer
   Fähigkeit abhängt, ist genau dann weg, wenn man sie braucht. */
function downloadState(melde){
  var text=JSON.stringify(exportState(),null,1);
  var name=exportFilename();
  function fallback(){
    try{
      var blob=new Blob([text],{type:"application/json"});
      var a=el("a",{href:URL.createObjectURL(blob),download:name});
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
      melde&&melde("Downloaded "+name+" ("+Math.round(text.length/1024)+" KB).");
    }catch(x){ melde&&melde("Could not download: "+((x&&x.message)||x)); }
  }
  if(!downloadNS){ fallback(); return; }
  downloadNS.save({filename:name,data:text}).then(function(){
    melde&&melde("Saved "+name+" ("+Math.round(text.length/1024)+" KB).");
  })["catch"](function(x){
    var c=(x&&x.code)||"";
    if(c==="declined"){ melde&&melde("Not saved."); return; }
    fallback();
  });
}

/* Einlesen. Erst sagen, was es täte, dann tun — eine Wiederherstellung, die
   ohne Vorschau schreibt, ist ein zweiter Datenverlust mit Anlauf. */
function importReport(daten){
  var r={ok:false,fehler:[],neu:0,geaendert:0,gleich:0,weg:0,teile:[]};
  if(!daten||typeof daten!=="object"){ r.fehler.push("Not an object."); return r; }
  if(daten.format&&String(daten.format).indexOf("nebelwacht/")!==0)
    r.fehler.push("Unknown format: "+daten.format);
  if(!daten.registry||typeof daten.registry!=="object")
    r.fehler.push("No registry in the file.");
  if(!Array.isArray(daten.entities))
    r.fehler.push("No entities in the file.");
  if(r.fehler.length)return r;
  ["interfaces","relations","views","units","vars","settings"].forEach(function(t){
    if(daten.registry[t]&&typeof daten.registry[t]==="object")
      r.teile.push(t+" ("+Object.keys(daten.registry[t]).length+")");
  });
  var drin={};
  daten.entities.forEach(function(e){
    if(!e||!e.id){ r.fehler.push("An entity without an id."); return; }
    drin[e.id]=1;
    var alt=ENT.get(e.id);
    if(!alt) r.neu++;
    else if(JSON.stringify(alt)===JSON.stringify(e)) r.gleich++;
    else r.geaendert++;
  });
  ENT.forEach(function(e){ if(!drin[e.id]) r.weg++; });
  r.ok=r.fehler.length===0;
  return r;
}
function applyImport(daten,loeschen,melde){
  var reg=daten.registry||{};
  ["interfaces","relations","views","units","vars","settings"].forEach(function(t){
    if(reg[t]&&typeof reg[t]==="object"){ REG[t]=thawed(reg[t]); saveReg(t); }
  });
  var drin={};
  (daten.entities||[]).forEach(function(e){
    if(!e||!e.id)return;
    drin[e.id]=1;
    var kopie=thawed(e);
    ENT.set(kopie.id,kopie);
    persist(kopie);
  });
  var fort=0;
  if(loeschen){
    var weg=[];
    ENT.forEach(function(e){ if(!drin[e.id]) weg.push(e.id); });
    weg.forEach(function(id){ drop(id); fort++; });
  }
  melde&&melde("Restored "+Object.keys(drin).length+" articles"+
    (fort?", removed "+fort:"")+".");
  render();
}

  bar2.appendChild(el("button",{class:"btn",type:"button",onclick:function(){

    if(!geprueft){ bericht.appendChild(el("div",{class:"warnzeile",

  v.appendChild(opt);

  /* Ids für die Textstellen nachtragen. Steht hier, weil es dieselbe Sorte

     späterer Import nichts verliert. */
  v.appendChild(el("div",{class:"sec",text:"Passage anchors"}));

    }},"Anchor every passage"));

      : "If a part of the registry or the articles fails to arrive, the page stops writing rather than saving over what it could not read. That is the one lesson from the old app that cost the most."}));

/* ---------- Der Tisch in Echtzeit (REQ-071, 116, 117) ----------
   Zwei Kanäle, und sie tragen Verschiedenes.

   **Der Speicher ist der Kanal für alles, was bleibt.** `onSnapshot` liefert
   jede Änderung an jedes offene Fenster — die Seite war also schon vor
   diesem Abschnitt mehrgerätefähig, ohne dass es jemand gesagt hätte. Runde,
   Zug, Trefferpunkte, die laufende Szene: alles das steht im Speicher und
   kommt von dort bei allen an, auch bei dem, der zehn Minuten später
   dazukommt.

   **Der Raum ist der Kanal für Augenblicke.** Ein Wurf und ein Zeigen auf
   die Karte sind nichts, was jemand später nachlesen muss; sie werden
   gesendet, gehört und vergessen. Genau dafür ist er da — und genau deshalb
   steht dort nichts, was ein Nachzügler braucht.

   Wer gerade zusieht, ist Anwesenheit: sie beschreibt den Absender und
   befiehlt niemandem, darum darf sie jeder setzen. */
var roomNS=null, PING_MS=4000;

function roomPeers(){ return UI.peers||[]; }
/* Anwesenheit: woran ich gerade bin. Nur Kennungen und kurze Wörter — was
   hier steht, sieht jeder im Raum. */
function pushPresence(){
  if(!roomNS)return;
  var e=UI.route.k==="art"?ENT.get(UI.route.id):null;
  roomNS.presence({
    at:UI.route.k,
    article:e?e.id:null,
    title:e?nameOf(e).slice(0,60):null,
    /* Welche Ansicht jemand sieht, sagt der Ort und nicht er selbst — was
       hier hingehört, ist wo er ist, und das steht schon oben. */
    actor:viewerActor()||null,
    gm:isGM()?true:false
  })["catch"](function(){});
}
/* Ein Wurf, den alle sehen (REQ-071). Der Verlauf bleibt örtlich — er ist
   eine Erinnerungsstütze, kein Protokoll; wer ein Protokoll will, schreibt
   es in die Sitzung. */
function whoAmI(){
  var a=ENT.get(viewerActor());
  return a?nameOf(a):(isGM()?"GM":"Someone");
}
/* Was dieser Browser selbst gesendet hat. Der Raum spielt Gesendetes auch
   dem Absender wieder ein — ohne diese Marke stünde jeder eigene Wurf
   zweimal im Protokoll: einmal, weil man ihn geworfen hat, und einmal, weil
   man ihn gehört hat. Der Name reicht dafür nicht: zwei Leute dürfen gleich
   heissen, und derselbe Mensch darf zwei Fenster offen haben. */
var ROOM_SELF=uid("rs");

function shareRoll(was,r){
  logRoll(was,r,whoAmI());
  if(roomNS) roomNS.emit("roll",{src:ROOM_SELF,who:whoAmI(),what:was,
    total:r.total,text:rollText(r)})["catch"](function(){});
}
/* Auf die Karte zeigen. Das ist der Grund, warum es den Raum überhaupt
   braucht: „da" lässt sich nicht speichern. */
function pingMap(mapId,x,y){
  var p={id:uid("pg"),map:mapId,x:x,y:y,at:Date.now(),who:whoAmI()};
  addPing(p);
  if(roomNS) roomNS.emit("ping",{id:p.id,map:p.map,x:p.x,y:p.y,who:p.who,
    src:ROOM_SELF})["catch"](function(){});
}
function addPing(p){
  UI.pings=(UI.pings||[]).filter(function(x){ return Date.now()-x.at<PING_MS; }).concat([p]);
  render();
  setTimeout(function(){
    UI.pings=(UI.pings||[]).filter(function(x){ return x.id!==p.id; });
    render();
  },PING_MS);
}

  } else wrap.appendChild(para(card.partyNote||"—"));

  if(isGM()){
    var st=el("div",{class:"rowbtns"});
    st.appendChild(el("span",{class:"hint",style:"margin:0;align-self:center",
      text:"Who may write this:"}));

      st.appendChild(el("button",{class:"btn sm"+((card.stewardship||"gm")===o[0]?" pri":""),
        type:"button",onclick:function(){

          persist(e); }},o[1]));

    wbar.appendChild(el("button",{class:"btn sm gh dice",type:"button",

      }},a));

  wrap.appendChild(wbar);
  if(UI.rollLog.length){

    UI.rollLog.forEach(function(x){
      var row=el("div",{class:"rollrow"});
      row.appendChild(el("span",{class:"rl",text:(x.who?x.who+" · ":"")+x.t}));
      row.appendChild(el("span",{class:"rv",text:rollText(x.r)}));
      log.appendChild(row);

    wrap.appendChild(log);

  return wrap;
