function partyMembers(p){
  if(!p)return [];
  var out=[];
  ENT.forEach(function(o){
    (o.relations||[]).forEach(function(r){
      if(r.type===REL_PARTY&&r.to===p.id) out.push(o);
    });
  });
  return out;
}
/* Wo die Gruppe steht: da, wo ein Gruppen-Token auf der Karte sitzt. Die
   Karte weiss, welchen Ort sie zeigt (`mapOf`) — also wird nicht ein
   zweites Mal hingeschrieben, wo die Gruppe ist. */
function partyPlace(p){
  if(!p)return null;
  var ids={}; ids[p.id]=true;
  partyMembers(p).forEach(function(m){ ids[m.id]=true; });
  var treffer=null;
  ENT.forEach(function(k){
    if(treffer)return;
    if(((k.interfaces||[])[0])!=="Map")return;
    var hat=(k.relations||[]).some(function(r){
      return r.type===REL_MARKER&&((r.props||{}).kind)==="party"&&ids[r.to]; });
    if(!hat)return;
    var ort=(k.relations||[]).filter(function(r){return r.type===REL_MAPOF;})[0];
    treffer=ort?ENT.get(ort.to):k;
  });
  return treffer;
}
/* Das jüngste benutzte Ereignis — der Tag, an dem die Kampagne steht, wenn
   niemand ihn als Einstellung gesetzt hat. */
function worldToday(){
  var gesetzt=setting("today","");
  if(gesetzt)return gesetzt;
  var beste=null, rang=-Infinity;
  ENT.forEach(function(e){
    var wd=(e.components||{}).Time;
    if(!wd||!wd.display)return;
    if((((e.components||{}).Status||{}).status)!=="used")return;
    var s=Number(wd.sort);
    if(!isFinite(s)||s<rang)return;
    rang=s; beste=wd.display;
  });
  return beste||"";
}
var COMPUTED_VARS=[
  ["PARTY","The party's name"],
  ["PARTYSIZE","How many are in it"],
  ["PARTYLEVEL","Average level of its members"],
  ["PARTYTIER","1–4, for encounter budgeting"],
  ["PARTYWHERE","Where its token stands on a map"],
  ["TODAY","The world date the campaign stands at"],
  ["CALENDAR","Name of the calendar"]
];
var computedSig="", computedCache=null;
function campaignVars(){
  var sig=ENT.size+"|"+JSON.stringify(REG.settings||{});
  if(sig===computedSig&&computedCache)return computedCache;
  var p=theParty(), mit=partyMembers(p);
  var stufen=mit.map(function(m){
    return Number(((m.components||{}).PlayerCharacter||{}).level);
  }).filter(function(n){ return isFinite(n)&&n>0; });
  var mittel=stufen.length?Math.round(stufen.reduce(function(a,b){return a+b;},0)/stufen.length):0;
  var ort=partyPlace(p);
  var out={
    PARTY:p?nameOf(p):"",
    PARTYSIZE:mit.length?String(mit.length):"",
    PARTYLEVEL:mittel?String(mittel):"",
    PARTYTIER:mittel?String(mittel<5?1:(mittel<11?2:(mittel<17?3:4))):"",
    PARTYWHERE:ort?nameOf(ort):"",
    TODAY:worldToday(),
    CALENDAR:setting("calendar","")
  };
  computedSig=sig; computedCache=out;
  return out;
}

/* ---------- registry ---------- */
/* ---------- Die Artikelarten zum Durchgehen ----------
   Dieselbe Übersicht, die `pnpm --filter @nw/registry catalogue` als Datei
   schreibt — aber aus dem **laufenden** Register. Eine Datei ist ein Abbild
   von gestern; diese Seite ist, was gerade gilt.

   Sie ist zum Durchgehen gebaut und nicht zum Nachschlagen: links die Arten
   nach Bereich, rechts eine davon ganz, und vor/zurück durch die Liste. Vier
   Fragen je Art — **was sie verlangt**, **was sie erlauben darf**, **welche
   Kanten** sie trägt und **wie sie gezeichnet wird**. Genau die vier, die man
   stellt, wenn man entscheiden will, ob eine Art so bleiben soll.

   Geerbtes steht dabei, mit der Angabe woher. Ohne das liest man bei `NPC`
   „verlangt nichts" und übersieht, dass sie über `Creature` die halbe
   Kampagne trägt. */

/* Die Arten in der Reihenfolge, in der die linke Spalte sie zeigt — und
   damit auch die, in der vor/zurück läuft. Eine zweite Ordnung daneben wäre
   die Stelle, an der „nächste" etwas anderes heisst als das, was darunter
   steht. */
function typeOrder(){
  var out=[];
  function zweig(n){
    out.push(n);
    kindsOf(n).forEach(function(k){ if(areaOf(k)===areaOf(n)) zweig(k); });
  }
  AREAS.forEach(function(ar){ areaRoots(ar[0]).forEach(zweig); });
  /* Was in keinem Bereich liegt, steht am Schluss: abstrakte Oberbegriffe,
     die keine Artikel tragen. Sie wegzulassen hiesse, dass man `Identity` nie zu
     sehen bekommt — und dort steht, was jede Art erbt. */
  Object.keys(REG.interfaces).sort().forEach(function(n){
    if(!areaOf(n)&&out.indexOf(n)<0) out.push(n);
  });
  return out;
}
function relsTo(ifn){
  var out=[];
  for(var k in REG.relations){
    var r=REG.relations[k];
    if(ifaceInList(r.to,ifn)) out.push(Object.assign({type:k},r));
  }
  return out;
}
/* Die Felder einer Art, kurz: Name und Art. `derived` steht da als
   „gerechnet", weil das der Unterschied ist, der am meisten erklärt — ein
   gerechnetes Feld bekommt keine Eingabe und keine Spalte (D8). */
function compFieldList(comp){
  var props=((REG.interfaces[comp]||{}).schema||{}).properties||{};
  var pflicht=(((REG.interfaces[comp]||{}).schema||{}).required)||[];
  return Object.keys(props).map(function(k){
    var p=props[k]||{};
    var art=p.derived?"derived":(p["enum"]?p["enum"].join(" | "):(p.format||p.type||"?"));
    return {name:k,kind:art,derived:!!p.derived,required:pflicht.indexOf(k)>=0};
  });
}
/* ---- Welches Layout für diese Art gilt, und wo es liegt ----
   `layoutOf` sagt nur *was* gezeichnet wird. Wer es ändern will, muss
   wissen **wo es steht**: eine geerbte Anordnung zu bearbeiten ändert sie
   für jede Unterart mit, und das soll niemand aus Versehen tun. */
/* Welche Felder der Server zurückhält. Einmal gefragt, weil zwei Listen
   die Stelle wären, an der eine davon veraltet — und diese hier
   entscheidet, was ein Spieler zu sehen bekommt. Ein Eintrag ist
   `Typ.feld`: der Typ gehört dazu, sonst hielte `secret` auch das
   Geheimnis zurück, das eine andere Art gleich benennt. */
function gmFields(){
  return String(setting("gmFields","Secrets.secret,Tactics.tactics")).split(",")
    .map(function(x){return x.trim();}).filter(Boolean);
}
/* Welchen Registerteil ein Reiter bearbeitet. „Types" zeigt mehr als die
   Zeilen — Vorlage, Kanten, Artikel —, aber bearbeitet werden dieselben
   `interfaces`. Ohne diese Zuordnung schriebe die JSON-Fassung in ein
   `REG.types`, das es nicht gibt, und die Arbeit wäre still weg. */
function regPart(){ return UI.regtab==="types"?"interfaces":UI.regtab; }
function viewKeyOf(vw){
  var vs=Object.keys(REG.views).length?REG.views:VIEWS_FALLBACK;
  var treffer="";
  Object.keys(vs).forEach(function(k){ if(vs[k]===vw) treffer=k; });
  return treffer;
}
function layoutSource(vw,ifn,key){
  var k=key||viewKeyOf(vw), kette=selfAndAncestors(ifn);
  for(var i=0;i<kette.length;i++){
    var eigen=((REG.interfaces[kette[i]]||{}).views||{})[k];
    if(Array.isArray(eigen)&&eigen.length)
      return {wo:"iface",iface:kette[i],layout:eigen,key:k};
  }
  if(Array.isArray(vw.layout)) return {wo:"view",layout:vw.layout,key:k};
  return {wo:"legacy",layout:legacyLayout(vw),key:k};
}
/* Eine eigene Anordnung für diese Art: die geerbte kopieren und unter
   ihrem Namen ablegen. Ab da gilt sie nur hier — und die Unterarten dieser
   Art erben sie weiter. */
function ownLayout(vw,ifn,key){
  var q=layoutSource(vw,ifn,key);
  var d=REG.interfaces[ifn]; if(!d)return;
  d.views=d.views||{};
  d.views[q.key]=JSON.parse(JSON.stringify(q.layout));
  saveReg("interfaces");
}

/* Alle Felder, die eine Art überhaupt tragen kann — als `Comp.key`. Das ist
   die Menge, aus der eine Ansicht auswählt; was nicht darin steht, kann
   keine Ansicht zeigen. */
function allFieldRefs(ifn){
  var out=[];
  compsFor(ifn).forEach(function(cn){
    compFieldList(cn).forEach(function(f){
      out.push({ref:cn+"."+f.name,comp:cn,key:f.name,kind:f.kind,derived:f.derived});
    });
  });
  return out;
}
/* Zeigt diese Auswahl das Feld? `Comp` meint alle Felder der Komponente,
   `Comp.key` genau eines — dieselbe Regel wie in `fieldPlan`, weil eine
   zweite Lesart hier eine Maske ergäbe, die etwas anderes verspricht als
   die Seite zeigt. */
function wantsField(want,ausser,f){
  if((ausser||[]).some(function(x){ return x===f.comp||x===f.ref; })) return false;
  if(want==="all")return true;
  if(!Array.isArray(want))return false;
  return want.some(function(x){ return x===f.comp||x===f.ref; });
}
/* Ein Feld oder eine Blockart in dieser Anordnung an- und abschalten.
   Abschalten geht über `except`, solange die Auswahl „all" ist — eine
   ausgeschriebene Liste wäre am Tag der nächsten Registerzeile falsch, und
   niemand merkt es: das Neue stünde einfach nirgends. */
function togglePick(item,feld,ref,an){
  var want=item[feld];
  if(want==="all"){
    var weg=Array.isArray(item["except"])?item["except"].slice():[];
    var i=weg.indexOf(ref);
    if(an&&i>=0) weg.splice(i,1);
    if(!an&&i<0) weg.push(ref);
    if(weg.length) item["except"]=weg; else delete item["except"];
    return;
  }
  var liste=Array.isArray(want)?want.slice():[];
  var j=liste.indexOf(ref);
  if(an&&j<0) liste.push(ref);
  if(!an&&j>=0) liste.splice(j,1);
  item[feld]=liste;
}

/* ---- Die Vorlage ----
   Was diese Ansicht von dieser Artikelart zeigt, Element für Element. Kein
   Beispielartikel: eine Vorlage zeigt die **Form**, und ein Beispiel führt
   dazu, dass man dessen Lücken für Fehler der Form hält. */
function templateFor(v,ifn,vw,src){
  var w=canWrite()&&src.wo==="iface"&&src.iface===ifn;

  function elementBox(item,tiefe){
    var box=el("div",{class:"tmplel d"+Math.min(tiefe,3)});
    var kopf=el("div",{class:"ck"});
    kopf.appendChild(el("code",{text:item.el}));

    if(item.el==="fields"){
      var felder=allFieldRefs(ifn);
      var an=felder.filter(function(f){ return wantsField(item.fields,item["except"],f); });
      kopf.appendChild(el("span",{class:"co",text:an.length+" of "+felder.length+" fields"}));
      box.appendChild(kopf);
      var g=el("div",{class:"tmplfields"});
      felder.forEach(function(f){
        var zeigt=wantsField(item.fields,item["except"],f);
        /* Der Bezeichner steht an der Marke und nicht im Titel: ein Titel
           ist ein Satz für Menschen, und wer ihn zerlegt, um an die Daten
           zu kommen, hängt an seiner Formulierung. */
        var b=el("button",{class:"pill q tgl"+(zeigt?" on":"")+(f.derived?" der":""),
          type:"button",disabled:!w,"data-ref":f.ref,"data-comp":f.comp,
          title:(f.derived?"Computed on read — no input, no column (D8). ":"")+
            f.ref+" · "+f.kind,
          onclick:function(){
            togglePick(item,"fields",f.ref,!zeigt); saveReg("views"); render();
          }},f.key);
        g.appendChild(b);
      });
      box.appendChild(g);
      return box;
    }

    if(item.el==="prose"){
      var felder=proseFields(ifn);
      var anB=felder.filter(function(f){
        return wantsField(item.fields,item["except"],{comp:f.type,ref:f.type+"."+f.key}); });
      kopf.appendChild(el("span",{class:"co",text:anB.length+" of "+felder.length+" passages"}));
      box.appendChild(kopf);
      var g2=el("div",{class:"tmplfields"});
      felder.forEach(function(f){
        var ref=f.type+"."+f.key;
        var zeigt=wantsField(item.fields,item["except"],{comp:f.type,ref:ref});
        var sl=gmFields().indexOf(ref)>=0;
        g2.appendChild(el("button",{class:"pill q tgl"+(zeigt?" on":""),type:"button",
          disabled:!w,"data-ref":ref,
          title:sl?"Held back from players at the server":ref,
          onclick:function(){
            togglePick(item,"fields",ref,!zeigt); saveReg("views"); render();
          }},fieldTitle(ifn,f.type,f.key,f.prop)+(sl?" ●":"")));
      });
      box.appendChild(g2);
      return box;
    }

    if(item.el==="tabs"){
      kopf.appendChild(el("span",{class:"co",text:(item.tabs||[]).length+" tabs"}));
      box.appendChild(kopf);
      (item.tabs||[]).forEach(function(t){
        box.appendChild(el("div",{class:"tmpltab d"+Math.min(tiefe+1,3),
          text:t.label||t.id}));
        (t.layout||[]).forEach(function(x){ box.appendChild(elementBox(x,tiefe+2)); });
      });
      return box;
    }

    /* Alles andere zeichnet sich selbst und hat nichts auszuwählen. Es steht
       trotzdem da: eine Vorlage, die nur die Felder zeigt, verschweigt, dass
       oben der Bogen und unten die Kanten stehen. */
    var was=LAYOUT_ELEMENTS.filter(function(x){ return x[0]===item.el; })[0];
    kopf.appendChild(el("span",{class:"co",text:was?was[1]:""}));
    box.appendChild(kopf);
    return box;
  }

  var wrap=el("div",{class:"tmpl"});
  var bar=el("div",{class:"maptools"});
  bar.appendChild(el("span",{class:"hint",style:"margin:0;align-self:center",
    text:src.wo==="iface"
      ?(src.iface===ifn?"Its own arrangement":"Inherited from "+(REG.interfaces[src.iface].label||src.iface))
      :(src.wo==="view"?"The view's default arrangement":"Derived from the view's old switches")}));
  if(canWrite()&&!w) bar.appendChild(el("button",{class:"btn sm",type:"button",
    title:"Copy it here so changes stay with this kind",
    onclick:function(){ ownLayout(vw,ifn,src.key); render(); }},"Give it its own"));
  if(w&&(((REG.interfaces[ifn]||{}).views||{})[src.key]||[]).length)
    bar.appendChild(el("button",{class:"btn sm gh",type:"button",
      title:"Drop it and inherit again",
      onclick:function(){
        confirmDialog("Drop this kind’s own arrangement and inherit again?",function(){
          var d2=REG.interfaces[ifn];
          delete d2.views[src.key];
          if(!Object.keys(d2.views).length) delete d2.views;
          saveReg("interfaces"); render(); });
      }},"Inherit again"));
  wrap.appendChild(bar);

  (src.layout||[]).forEach(function(item){ wrap.appendChild(elementBox(item,0)); });
  if(!(src.layout||[]).length) wrap.appendChild(el("div",{class:"empty",
    text:"This view draws nothing for this kind."}));
  v.appendChild(wrap);
}

function renderTypes(v){
  var arten=typeOrder();
  var wahl=REG.interfaces[UI.typePick]?UI.typePick:arten[0];
  var d=REG.interfaces[wahl]||{};

  /* Die Liste der Arten steht in der Leiste links und nicht mehr hier: eine
     hohe schmale Liste gehört an die Seite, nicht mitten in den Text — und
     sie zweimal zu zeigen war der Grund, dass man sie beim ersten Mal nicht
     bedienen konnte. */
  var doc=el("div",{class:"tpdoc"});
  var i=arten.indexOf(wahl);
  var bar=el("div",{class:"maptools"});
  bar.appendChild(el("button",{class:"btn sm",type:"button",disabled:i<=0,
    onclick:function(){ UI.typePick=arten[i-1]; render(); }},"←"));
  bar.appendChild(el("button",{class:"btn sm",type:"button",disabled:i>=arten.length-1,
    onclick:function(){ UI.typePick=arten[i+1]; render(); }},"→"));
  bar.appendChild(el("span",{class:"hint",style:"margin:0;align-self:center",
    text:(i+1)+" of "+arten.length}));
  /* Kein „edit"-Knopf mehr: die Maske steht auf derselben Seite weiter
     unten. Ein Knopf, der dorthin führt, wo man schon ist, verspricht einen
     Ortswechsel und liefert keinen. */
  doc.appendChild(bar);

  var h=el("div",{class:"arthead"});
  h.appendChild(el("h2",{text:d.label||wahl}));
  var marken=el("div",{class:"chips"});
  marken.appendChild(el("span",{class:"pill q",text:wahl}));
  if(areaOf(wahl)) marken.appendChild(el("span",{class:"pill",text:areaOf(wahl)}));
  if(d.abstract) marken.appendChild(el("span",{class:"pill q",
    title:"No article carries this one directly — it is an umbrella",text:"abstract"}));
  h.appendChild(marken);
  doc.appendChild(h);

  /* **Die Maske steht hier und sonst nirgends.** Bis hierher standen
     dieselben Sachen zweimal auf dieser Seite: oben als Kurzübersicht zum
     Lesen, unten unter „Model" zum Ändern. Wer einen Bestandteil entfernen
     wollte, versuchte es oben — und dort war es ein Bild. */
  doc.appendChild(regIfaceBody(wahl));

  /* ---- Die Vorlage ----
     **Das ist, wofür man die Seite öffnet**: was diese Artikelart in einer
     Ansicht zeigt. Welche Ansicht, wird **hier** gewählt und nicht oben
     rechts für die ganze Seite: die Anordnung gehört der Art, also gehört
     die Wahl dorthin, wo die Art steht.

     Kein Beispielartikel, sondern die Form. Ein Beispiel führte dazu, dass
     man seine Lücken für Fehler der Vorlage hält. */
  /* **Nicht jede Art wird gezeichnet.** Ein Bestandteil wie `Identity` ist
     kein Artikel: „Overview" zeigte dort die Beschreibung, die es an ihm gar
     nicht gibt, und lud dazu ein, eine Anordnung an einer Stelle zu ändern,
     an der sie nichts tut. Gezeigt wird die Vorlage deshalb für Artikelarten
     — und für die Obertypen, die eine Anordnung **selbst** tragen, denn die
     ist genau dort zu ändern, wo sie steht. */
  var vws=Object.keys(REG.views).length?REG.views:VIEWS_FALLBACK;
  var vwKey=vws[UI.typeView]?UI.typeView:viewKeys()[0];
  var vw=vws[vwKey];
  var eigeneSicht=Object.keys(((REG.interfaces[wahl]||{}).views)||{}).length>0;
  var gezeichnet=!d.abstract||eigeneSicht;
  if(vw&&!gezeichnet){
    doc.appendChild(el("div",{class:"sec",text:"Views"}));
    doc.appendChild(el("p",{class:"hint",
      text:"No article is a “"+(d.label||wahl)+"” — it is a part that other kinds take. "+
        "How it is drawn is decided where it is used; open one of the kinds below, "+
        "or give this one a layout of its own from there."}));
  }
  if(vw&&gezeichnet){
    var src=layoutSource(vw,wahl,vwKey);
    var vk=el("div",{class:"sec"});
    vk.appendChild(el("span",{text:"Views"}));
    doc.appendChild(vk);
    doc.appendChild(el("p",{class:"hint",style:"margin:0 0 8px",
      text:"Three views, and where you are decides which: Overview for a reference in the text, Quick for a card, Full for the article page. A dot means this kind arranges that view itself; without one it inherits. Click a field or a block kind to take it out of the view or put it back."}));
    var vbar=el("div",{class:"chips"});
    viewKeys().forEach(function(k){
      var eigen=((REG.interfaces[wahl]||{}).views||{})[k];
      vbar.appendChild(el("button",{class:"chip pick"+(k===vwKey?" on":""),type:"button",
        "data-vk":k,
        title:(eigen&&eigen.length)?"This kind arranges it itself":"Inherited",
        onclick:function(){ UI.typeView=k; UI.regel=""; render(); }},
        (vws[k].label||k)+((eigen&&eigen.length)?" \u25cf":"")));
    });
    doc.appendChild(vbar);
    templateFor(doc,wahl,vw,src);
  }

  /* Kanten in beide Richtungen. Gespeichert wird nur vorwärts — aber wer
     entscheiden will, ob eine Art bleibt, muss wissen, wer auf sie zeigt. */
  var raus=relsFrom(wahl), rein=relsTo(wahl);
  function kantenListe(liste,titel,richtung){
    if(!liste.length)return;
    doc.appendChild(el("div",{class:"sec",text:titel}));
    var ul=el("ul",{class:"tedges"});
    liste.forEach(function(r){
      var li=el("li");
      li.appendChild(el("code",{text:r.type}));
      li.appendChild(el("span",{class:"co",
        text:richtung==="out"?("→ "+(r.to||["*"]).join(" | ")):("← "+(r.from||["*"]).join(" | "))}));
      li.appendChild(el("span",{class:"tlab",
        text:"„"+(richtung==="out"?(r.label||r.type):(r.inverseLabel||r.label||r.type))+"“"}));
      if(r.props&&r.props.properties){
        var pk=Object.keys(r.props.properties);
        if(pk.length) li.appendChild(el("span",{class:"co",text:pk.join(", ")}));
      }
      ul.appendChild(li);
    });
    doc.appendChild(ul);
  }
  kantenListe(raus,"Edges from here","out");
  kantenListe(rein,"Edges to here","in");

  /* Und die Artikel selbst. Eine Art ohne einen einzigen Artikel ist eine
     Frage für sich — deshalb steht die Null da und nicht nichts. */
  var meine=[];
  byName().forEach(function(x){ if(((x.interfaces||[])[0])===wahl) meine.push(x); });
  doc.appendChild(el("div",{class:"sec",text:"Articles ("+meine.length+")"}));
  if(!meine.length) doc.appendChild(el("p",{class:"hint",style:"margin:0",
    text:d.abstract?"None — an abstract type carries no articles of its own."
                   :"None yet."}));
  else{
    var cb=el("div",{class:"chips"});
    meine.slice(0,40).forEach(function(x){
      cb.appendChild(el("button",{class:"chip",type:"button",
        onclick:function(){ go({k:"art",id:x.id}); }},nameOf(x)));
    });
    if(meine.length>40) cb.appendChild(el("span",{class:"hint",style:"margin:0",
      text:"and "+(meine.length-40)+" more"}));
    doc.appendChild(cb);
  }

  v.appendChild(doc);
  if(canWrite()) v.appendChild(newInterfaceBar(""));
}

/* Die Teile des Registers. Sie stehen **oben als Reiter**, und die Leiste
   links zeigt die Zeilen des gewählten Teils. Es stand einmal beides in der
   Leiste und die Zeilen noch einmal in der Seite — zwei Listen für eine
   Frage, und keine sagte, welche gerade gilt. */
var REGTABS=[["howto","How it works"],["types","Types"],["views","Views"],
  ["relations","Relations"],["units","Units"],["vars","Variables"],
  ["settings","Settings"],["backup","Backup"],["stack","Stack"],
  ["graph","Graph"],["import","Import"]];

function renderRegistry(v){
  v.appendChild(el("h2",{text:"Registry"}));
  var tabs=el("div",{class:"tabs",role:"tablist"});
  REGTABS.forEach(function(t){
    if(t[0]==="import"&&!canWrite())return;
    tabs.appendChild(el("button",{type:"button",role:"tab",
      "aria-selected":String(UI.regtab===t[0]),
      onclick:function(){
        UI.err="";
        /* Import ist kein Ort, sondern eine Handlung: er macht einen
           Dialog auf und lässt die Seite, wo sie war. */
        if(t[0]==="import"){ importDialog(); return; }
        UI.regtab=t[0]; UI.regjson=false; go({k:"reg"});
      }},t[1]));
  });
  v.appendChild(tabs);

  if(UI.regtab==="howto"){ renderHowto(v); return; }
  if(UI.regtab==="stack"){ renderStackPage(v); return; }
  if(UI.regtab==="graph"){ renderGraph(v); return; }

  /* Schnittstellen bekommen eine Maske: Komponenten, Felder, Blockarten und
     Subtypen an einer Stelle. Das JSON bleibt daneben stehen — für Massen-
     änderungen ist ein Textfeld schneller als jedes Formular. */
  if(UI.regtab==="relations"&&!UI.regjson){ maskeMitJson(v,renderRelationEditor,null); return; }
  if(UI.regtab==="units"&&!UI.regjson){ maskeMitJson(v,renderUnitEditor,null); return; }
  if(UI.regtab==="vars"&&!UI.regjson){ maskeMitJson(v,renderVarEditor,null); return; }
  if(UI.regtab==="settings"&&!UI.regjson){ maskeMitJson(v,renderSettingsEditor,null); return; }
  /* Die Sicherung hat kein JSON daneben: sie *ist* das JSON. */
  if(UI.regtab==="backup"){ renderBackupEditor(v); return; }

  if(UI.regtab==="views"&&!UI.regjson){
    v.appendChild(el("p",{class:"hint",
      text:"A view is an ordered list of elements. Pick a type under “Applies to” to give that type — and its subtypes — a layout of its own."}));
    renderViewEditor(v);
    var barV=el("div",{class:"rowbtns"});
    barV.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
      UI.regjson=true; UI.err=""; render(); }},"Edit as JSON"));
    v.appendChild(barV);
    return;
  }

  /* **Artikelarten und Datenmodell sind eine Seite.** Sie waren zwei, und
     das hiess: das Modell hier anlegen, dort nachsehen, was dabei
     herauskommt, und dazwischen jedes Mal die Seite wechseln. Wer ein Feld
     dazunimmt, will sehen, wo es landet. */
  if(UI.regtab==="types"&&!UI.regjson){
    renderTypes(v);
    var bar0=el("div",{class:"rowbtns"});
    bar0.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
      UI.regjson=true; UI.err=""; render(); }},"Edit as JSON"));
    v.appendChild(bar0);
    return;
  }

  if(UI.regtab==="views") v.appendChild(el("p",{class:"hint",
    text:"The three views. Each carries a fallback layout; the layout a type actually uses lives at the type, under views. order sets the sequence."}));
  var ta=el("textarea",{class:"i code",spellcheck:"false",id:"regbox"});
  ta.value=JSON.stringify(REG[regPart()],null,2);
  v.appendChild(ta);
  var msg=el("div",{class:"err"});
  v.appendChild(msg);

  var bar=el("div",{class:"rowbtns"});
  if(canWrite()) bar.appendChild(el("button",{class:"btn pri",type:"button",onclick:function(){
    try{ var parsed=JSON.parse(ta.value); }
    catch(x){ msg.textContent="Not valid JSON: "+x.message; return; }
    REG[regPart()]=parsed; saveReg(regPart()); msg.textContent=""; render();
  }},"Apply"));
  bar.appendChild(el("button",{class:"btn",type:"button",onclick:function(){
    ta.value=JSON.stringify(REG[regPart()],null,2); msg.textContent="";}},"Reset"));
  bar.appendChild(el("button",{class:"btn gh",type:"button",
    onclick:function(){ UI.regjson=false; UI.err=""; render(); }},"Back to the form"));
  v.appendChild(bar);
}

function newInterfaceBar(unter){
  var i=el("input",{class:"i",type:"text",placeholder:"Label, e.g. Vehicle"});
  var bar=el("div",{class:"addbar",style:"margin-top:10px"});
  bar.appendChild(i);
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var label=i.value.trim(); if(!label) return;
    var n=techName(label,REG.interfaces);
    REG.interfaces[n]={name:n,label:label,schema:{type:"object",properties:{}}};
    if(unter) REG.interfaces[n].extends=[unter];
    UI.regiface=n; UI.regcomp=""; saveReg("interfaces"); render();
  }},"Create interface"));
  return bar;
}

/* ---------- relation types tab ---------- */
function renderRelationEditor(v){
  var names=Object.keys(REG.relations).sort();
  if(!names.length){
    v.appendChild(el("div",{class:"empty",text:"No relation types yet."}));
    if(canWrite()) v.appendChild(newRelationBar());
    return;
  }
  if(names.indexOf(UI.regrel)<0) UI.regrel=names[0];
  v.appendChild(relationBody(UI.regrel));
  if(canWrite()) v.appendChild(newRelationBar());
}

function newRelationBar(){
  var i=el("input",{class:"i",type:"text",placeholder:"Label, e.g. owes a favour to"});
  var bar=el("div",{class:"addbar",style:"margin-top:10px"});
  bar.appendChild(i);
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var label=i.value.trim(); if(!label) return;
    var base=slug(label).replace(/-([a-z])/g,function(_,c){return c.toUpperCase();})||"relates";
    var n=base,c=2; while(REG.relations[n]){ n=base+c; c++; }
    REG.relations[n]={label:label,inverseLabel:"← "+label,from:["*"],to:["*"]};
    UI.regrel=n; saveReg("relations"); render();
  }},"Create relation type"));
  return bar;
}

function relationBody(rt){
  var rd=REG.relations[rt], w=canWrite();
  var box=el("div",{class:"regbody"});
  function save(){ saveReg("relations"); render(); }

  box.appendChild(el("h3",{text:rd.label||rt}));
  box.appendChild(el("div",{class:"key",text:rt}));

  box.appendChild(el("p",{class:"hint",style:"margin-top:8px",
    text:"One edge, stored in one direction. The reverse is never stored — it is a query, and the inverse label is what it reads as from the other end."}));

  var head=el("div",{class:"fmore",style:"border-bottom:0"});
  function text(label,val,set,ph){
    var i=el("input",{class:"i",type:"text",value:val==null?"":val,placeholder:ph||""});
    if(!w) i.disabled=true;
    i.addEventListener("change",function(){ set(i.value.trim()); save(); });
    head.appendChild(field(label,i));
  }
  text("Label (forwards)",rd.label||"",function(x){ rd.label=x||rt; },"lives in");
  text("Label (backwards)",rd.inverseLabel||"",function(x){ rd.inverseLabel=x||("← "+rt); },"residents");
  text("Section heading",rd.section||"",function(x){ if(x)rd.section=x; else delete rd.section; },
       "set to compose the target into the article");
  var card=el("select",{class:"i"}); if(!w) card.disabled=true;
  [["","many"],["one","at most one"]].forEach(function(c){
    card.appendChild(el("option",{value:c[0]},c[1])); });
  card.value=rd.cardinality||"";
  card.addEventListener("change",function(){
    if(card.value) rd.cardinality=card.value; else delete rd.cardinality; save(); });
  head.appendChild(field("How many",card));
  box.appendChild(head);

  box.appendChild(el("div",{class:"rsec",text:"From and to"}));
  box.appendChild(el("p",{class:"hint",
    text:"Nothing picked means any type. Picking a type includes its subtypes."}));
  [["from","May start at"],["to","May point at"]].forEach(function(side){
    var sel=el("select",{class:"i",multiple:"multiple",size:"5",style:"max-width:280px"});
    if(!w) sel.disabled=true;
    var cur=(rd[side[0]]||[]).filter(function(x){return x!=="*";});
    Object.keys(REG.interfaces).sort().forEach(function(n){
      var o=el("option",{value:n},REG.interfaces[n].label||n);
      if(cur.indexOf(n)>=0) o.selected=true;
      sel.appendChild(o);
    });
    sel.addEventListener("change",function(){
      var picked=Array.prototype.filter.call(sel.options,function(o){return o.selected;})
        .map(function(o){return o.value;});
      rd[side[0]]=picked.length?picked:["*"];
      save();
    });
    box.appendChild(field(side[1],sel));
  });

  if(w){
    var n=0; ENT.forEach(function(e){ (e.relations||[]).forEach(function(r){ if(r.type===rt)n++; }); });
    var del=el("button",{class:"btn sm dngr",type:"button",onclick:function(){
      if(n)return;
      confirmDialog("Remove the relation type “"+(rd.label||rt)+"”?",function(){
        delete REG.relations[rt]; UI.regrel=""; save(); },"Remove"); }},"Remove relation type");
    if(n){ del.disabled=true; del.title=n+" edges use it"; }
    var fbar=el("div",{class:"rowbtns"}); fbar.appendChild(del);
    if(n) fbar.appendChild(el("span",{class:"co",style:"align-self:center",text:n+" edges use it"}));
    box.appendChild(fbar);
  }
  return box;
}

/* ---------- variables tab ----------
   Kampagnenvariablen: die dritte und letzte Stufe, auf der {VAR} auflöst.
   Kante → nutzender Artikel → hier. */
/* ---------- Einheiten ----------
   Wie gerechnet wird, steht hier und nicht im Code: `base` sagt, wie viel
   eine Einheit in der Grundeinheit ihrer Grösse ist — ein Fuss sind 0,3048
   Meter. Damit ist jede Umrechnung eine Division, und eine neue Einheit ist
   ein Einfügen. */
function renderUnitEditor(v){
  var w=canWrite();
  v.appendChild(el("p",{class:"hint"},
    "How a measure reads in the other system. `base` is how much one of "+
    "these is in the base unit of its quantity — metres, kilograms, litres. "+
    "Which system is shown is a setting, and an article type may override "+
    "it: a creature may stay imperial because its numbers come out of the "+
    "rules, while the rest of the campaign reads metric."));

  var jetzt=(REG.settings||{}).units||"both";
  var bar=el("div",{class:"addbar",style:"margin-bottom:12px"});
  bar.appendChild(el("span",{class:"co",style:"align-self:center",text:"Show"}));
  var sel=el("select",{class:"i",id:"unitmode"});
  [["imperial","Imperial only"],["metric","Metric only"],
   ["both","Both — stored first, converted in brackets"]].forEach(function(o){
    sel.appendChild(el("option",{value:o[0]},o[1])); });
  sel.value=jetzt;
  if(!w) sel.disabled=true;
  sel.addEventListener("change",function(){
    REG.settings=REG.settings||{};
    REG.settings.units=sel.value; saveReg("settings"); render(); });
  bar.appendChild(sel);
  v.appendChild(bar);

  /* Eine Probe mit echten Zeilen. Eine Einstellung, deren Wirkung man erst
     drei Klicks später sieht, stellt man einmal und nie wieder. */
  var probe=el("div",{class:"fbox"});
  probe.appendChild(el("div",{class:"fhead"},[el("b",{text:"Reads as"})]));
  [[40,"ft"],[3,"mi"],[30,"lb"],[1.5,"m"]].forEach(function(x){
    if(!unitByCode(x[1]))return;
    var row=el("div",{class:"frow"});
    row.appendChild(el("span",{class:"fk",text:x[0]+" "+x[1]}));
    row.appendChild(el("span",{text:formatMeasure(x[0],x[1],jetzt)}));
    probe.appendChild(row);
  });
  v.appendChild(probe);

  var keys=Object.keys(REG.units||{}).sort(function(a,b){
    var ua=REG.units[a], ub=REG.units[b];
    return ua.quantity===ub.quantity?ua.base-ub.base:ua.quantity.localeCompare(ub.quantity); });
  var box=el("div",{class:"regbody",style:"max-height:none;border:1px solid var(--line);border-radius:var(--r)"});
  if(!keys.length) box.appendChild(el("p",{class:"hint",text:"None yet."}));
  var letzte="";
  keys.forEach(function(k){
    var u=REG.units[k];
    if(u.quantity!==letzte){ letzte=u.quantity;
      box.appendChild(el("div",{class:"rsec",text:u.quantity})); }
    var row=el("div",{class:"crow"});
    row.appendChild(el("span",{class:"fk",style:"flex:0 0 70px",text:u.code}));
    var lab=el("input",{class:"i",type:"text",value:u.label||""});
    if(!w) lab.disabled=true;
    lab.addEventListener("change",function(){ u.label=lab.value.trim()||k; saveReg("units"); });
    row.appendChild(lab);
    row.appendChild(el("span",{class:"pill q",text:u.system}));
    var basis=el("input",{class:"i",type:"number",step:"any",style:"max-width:130px",
      value:String(u.base)});
    if(!w) basis.disabled=true;
    basis.addEventListener("change",function(){
      var n=Number(basis.value);
      /* Null oder Unsinn machte jede Umrechnung zu einer Division durch
         null — und die Zahl, die dabei herauskommt, sieht aus wie eine. */
      if(!isFinite(n)||n<=0){ UI.err="A unit’s base must be a positive number."; render(); return; }

  if(w){

  }
}

/* Kampagneneinstellungen (REQ-043): ein Schlüssel-Wert-Speicher, den jeder

function setting(key,fallback){

function settingNum(key,fallback){

/* ---------- how the registry works, on the page that edits it ----------
   Die Mechanik steht hier, weil sie sonst nur in Commit-Nachrichten und im
   Kopf steht. Wer eine Zeile ändert, soll daneben lesen können, was sie
   auslöst. Aufklappbar, damit sie nicht jedes Mal im Weg ist. */
/* ---------- „How it works" ----------
   Die Begriffe standen bis hierher in einer Ausklappzeile über jedem
   Registerreiter — also überall ein bisschen und nirgends ganz. Sie haben
   jetzt eine eigene Seite, und die zeigt nicht nur Worte: ein Artikel wird
   von seinem Typ bis zu seinen Feldern durchgezogen, aus dem laufenden
   Register. Eine Erklärung, die eine Liste abtippt, stimmt am Tag ihrer
   Entstehung und danach nie wieder.

   Die sieben Wörter stehen ausführlich in docs/Begriffe.md; hier steht, was
   man beim Arbeiten braucht. */
var BEGRIFFE=[
  ["Type",
   "A registry row: what a thing can be. Either a base type — it declares "+
   "fields and inherits nothing — or a composite, made of other types. A "+
   "composite may be made of composites. Abstract means no article is one "+
   "directly: nobody writes an article called “Identity”."],
  ["Part",
   "A type another type is made of. The first one named draws the tree and "+
   "decides the area; the rest only bring their fields and edges along. You "+
   "drop a field by dropping the part that brings it — an exception list "+
   "would be incomplete the day the next field arrives, and nobody would "+
   "notice."],
  ["Field",
   "One fact a type records: a key, a label, a kind, required or optional, "+
   "maybe a default, maybe a calculation. A calculated field takes no input "+
   "and is never stored. Values are kept one card per type, named after the "+
   "type that declares the field — that is what keeps hp at the creature "+
   "apart from hp at the statblock. A type may rename a field it inherits: "+
   "the same Time.until is when an event ends and when a quest is too late, "+
   "so the quest calls it “Deadline”. That is a label, not a second field "+
   "list — the part stays one, and a field added tomorrow brings its own "+
   "name."],
  ["Identifier",
   "Issued, not typed: npc-0042, the kind and a running number inside it. "+
   "It is set when the article is made and never changes. It used to be a "+
   "slug of the name — the same thing said twice, which on a rename either "+
   "had to move along or started lying. A number says nothing and stays "+
   "right; what the article is called stands next to it."],
  ["Article",
   "A thing in the campaign: an id, the types it is, the cards with its "+
   "values, and its edges. What it records is said by its type, never by "+
   "code."],
  ["View",
   "How an article is drawn. Three of them, and where you are decides which: "+
   "Overview for a reference in the text, Quick for a card, Full for the "+
   "article page. There is no picker. The arrangement lives at the type, and "+
   "subtypes inherit it."],
  ["Block",
   "One piece of a view — and the same piece in the type definition: the "+
   "fields of one part, a single field, the image, the edges. Definition and "+
   "view show the same blocks, so you do not have to hold two pictures of "+
   "one thing in your head. It no longer means a piece of prose sitting "+
   "beside the fields: that is a field with a long input, and several of "+
   "them is “one or more”."],
  ["Edge",
   "A typed, directed connection between two articles, which may carry "+
   "properties of its own. Stored forward only; the other direction is "+
   "always a query. An edge with a section heading writes the target into "+
   "the article instead of linking to it."],
  ["Unit",
   "How a measure is written and converted. The vault is imperial because "+
   "the rules are; at the table sit people for whom forty feet means "+
   "nothing. So one number is stored and the other is worked out on read — "+
   "two numbers for one measure are two numbers that can disagree. How the "+
   "conversion goes is a registry row, and which system is shown is a "+
   "setting an article type may override."]
];

/** Ein Artikel, an dem sich das Ganze zeigen lässt: einer mit möglichst
 *  vielen Karten. Fest einen zu nennen hiesse, dass die Seite leer ist,
 *  sobald jemand ihn löscht. */
function howtoBeispiel(){
  if(UI.howto&&ENT.get(UI.howto)) return ENT.get(UI.howto);
  /* Die Karten zählen, nicht die Kanten: ein Inventar mit vierzig `holds`
     ist kein gutes Beispiel, ein NPC mit acht Bestandteilen schon. Ein
     Artikel mit verschiedenen Kantenarten gewinnt trotzdem — deshalb die
     Arten und nicht deren Zahl. */
  var best=null,score=-1;
  ENT.forEach(function(e){
    if(!articleVisible(e))return;
    var arten={}; (e.relations||[]).forEach(function(r){ arten[r.type]=1; });
    var n=Object.keys(e.components||{}).length*2+Object.keys(arten).length;
    if(n>score){ score=n; best=e; }
  });
  return best;
}

  /* ---- Der Baum: von einem Artikel bis zu den Feldern ---- */
  var e=howtoBeispiel();
  v.appendChild(el("div",{class:"rsec",text:"One article, all the way down"}));

  /* ---- Was nie gespeichert wird ---- */
  v.appendChild(el("div",{class:"rsec",text:"What is never stored"}));
  var nie=el("ul",{class:"bsp"});
  [["A calculated value",
    "It is worked out each time the article is read. Two places that can "+
    "disagree are worse than one place that has to think."],
   ["The other direction of an edge",
    "It is a query. A mirrored counterpart goes stale the moment one side "+
    "is deleted."],
   ["Which kinds of article exist",
    "That is a registry row, not a line of code. Adding one is an insert, "+

  ].forEach(function(r){

/** Der Baum. Oben der Artikel, darunter sein Artikeltyp, darunter die
 *  Bestandteile bis ganz hinunter zu den Feldern. Ein Feld, das der Artikel
 *  wirklich trägt, ist markiert — sonst läse man eine Möglichkeit und
 *  hielte sie für den Bestand. */
function howtoBaum(e){
  var box=el("div",{class:"tree"});
  var art=(e.interfaces||[])[0]||"";
  var karten=e.components||{};

  var kopf=el("div",{class:"tnode tart"});
  kopf.appendChild(el("span",{class:"tw",text:"article"}));
  kopf.appendChild(el("button",{class:"ref",type:"button",
    onclick:function(){ go({k:"art",id:e.id}); }},nameOf(e)));
  box.appendChild(kopf);

  var gesehen={};
  function ast(n,tiefe){
    if(gesehen[n]||tiefe>8)return;
    gesehen[n]=1;
    var d=REG.interfaces[n]||{};
    var eigen=Object.keys((d.schema||{}).properties||{});
    var pflicht=((d.schema||{}).required)||[];
    var row=el("div",{class:"tnode"+(tiefe?"":" ttyp"),
      style:"margin-left:"+(tiefe*18)+"px"});
    row.appendChild(el("span",{class:"tw",
      text:tiefe?(eigen.length?"part":"part, empty"):"its type"}));
    row.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){ UI.regtab="types"; UI.typePick=n; go({k:"reg"}); }},
      d.label||n));
    if(d.abstract) row.appendChild(el("span",{class:"pill q",text:"abstract"}));
    box.appendChild(row);

    if(eigen.length){
      var fb=el("div",{class:"tfields",style:"margin-left:"+(tiefe*18+18)+"px"});
      eigen.forEach(function(k){
        var belegt=karten[n]&&karten[n][k]!==undefined&&karten[n][k]!==""&&
          !(Array.isArray(karten[n][k])&&!karten[n][k].length);
        var p2=((d.schema||{}).properties||{})[k]||{};
        fb.appendChild(el("span",{
          class:"pill q tfield"+(belegt?" on":"")+(p2.derived?" der":""),
          title:(p2.title||k)+(pflicht.indexOf(k)>=0?" · required":" · optional")+
            (p2.derived?" · calculated: "+p2.derived:"")+
            (belegt?"":" · this article carries none"),
          text:k+(pflicht.indexOf(k)>=0?"*":"")}));
      });
      box.appendChild(fb);
    }
    parentsOf(n).forEach(function(p2){ ast(p2,tiefe+1); });
  }
  if(art) ast(art,0);

  /* Die Kantenarten, nicht die Kanten: „holds, holds, holds …" sagt über
     das Modell nichts, „holds ×12" schon. */
  var zahl={};
  (e.relations||[]).forEach(function(r){ zahl[r.type]=(zahl[r.type]||0)+1; });
  var kArten=Object.keys(zahl).sort();
  if(kArten.length){
    var kn=el("div",{class:"tnode"});
    kn.appendChild(el("span",{class:"tw",text:"edges"}));
    kArten.forEach(function(t){
      var d2=REG.relations[t]||{};
      kn.appendChild(el("span",{class:"pill q",
        title:d2.label?("„"+d2.label+"“"):"",
        text:t+(zahl[t]>1?" \u00d7"+zahl[t]:"")}));
    });
    box.appendChild(kn);
  }
  box.appendChild(el("p",{class:"hint",style:"margin:10px 0 0"},
    "A field in bold is one this article carries; the rest the type allows "+
    "and this article leaves empty. A star means required, a dashed outline "+
    "means calculated — no input, never stored."));
  return box;
}

/* ---------- compendium: views as an ordered toolbox ---------- */
function renderViewEditor(v){
  var keys=viewKeys();
  if(!keys.length){
    v.appendChild(el("div",{class:"empty",text:"No views yet."}));
    if(canWrite()) v.appendChild(newViewBar());
    return;
  }
  if(keys.indexOf(UI.regview)<0) UI.regview=keys[0];
  /* Gewählt wird in der Leiste. Eine zweite Liste hier wäre genau die
     doppelte Auswahl, die auf der Typenseite schon im Weg stand. */
  v.appendChild(viewBody(UI.regview));
  if(canWrite()) v.appendChild(newViewBar());
}

function newViewBar(){
  var i=el("input",{class:"i",type:"text",placeholder:"Label, e.g. Handout"});
  var bar=el("div",{class:"addbar",style:"margin-top:10px"});
  bar.appendChild(i);
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var label=i.value.trim(); if(!label) return;
    var key=slug(label).replace(/-/g,"")||"view";
    var n=key,c=2; while(REG.views[n]){ n=key+c; c++; }
    var order=Object.keys(REG.views).reduce(function(m,k){
      return Math.max(m,(REG.views[k].order||0)); },0)+1;
    REG.views[n]={label:label,order:order,layout:[{id:uid("l"),el:"description"}]};
    UI.regview=n; saveReg("views"); render();
  }},"Create view"));
  return bar;
}

function viewBody(key){
  var vd=REG.views[key], w=canWrite();
  var box=el("div",{class:"regbody"});
  function save(){ saveReg("views"); render(); }

  box.appendChild(el("h3",{text:vd.label||key}));
  box.appendChild(el("div",{class:"key",text:key}));

  var head=el("div",{class:"fmore",style:"border-bottom:0;padding-top:10px"});
  var labelInput=el("input",{class:"i",type:"text",value:vd.label||""});
  if(!w) labelInput.disabled=true;
  labelInput.addEventListener("change",function(){ vd.label=labelInput.value.trim()||key; save(); });
  head.appendChild(field("Label",labelInput));
  var ord=el("input",{class:"i",type:"number",value:String(vd.order||1)});
  if(!w) ord.disabled=true;
  ord.addEventListener("change",function(){ vd.order=Number(ord.value)||1; save(); });
  head.appendChild(field("Order in the picker",ord));
  box.appendChild(head);

  /* ---- Geltungsbereich ----
     Ohne Bereich gilt das Layout für alles. Mit Bereich gilt es für einen
     Typ und dessen Subtypen — `Item: Full` zeigt dann andere Felder als
     `Statblock: Full`, ohne dass es zwei Ansichten braucht. */
  box.appendChild(el("div",{class:"rsec",text:"Applies to"}));
  var scope=el("select",{class:"i",style:"max-width:280px"});
  scope.appendChild(el("option",{value:""},"Every type (the default layout)"));
  Object.keys(REG.interfaces).sort().forEach(function(n){
    var eigen=(((REG.interfaces[n]||{}).views||{})[key]||[]).length;
    scope.appendChild(el("option",{value:n},
      (REG.interfaces[n].label||n)+(eigen?"  · own layout":"")));
  });
  scope.value=UI.regscope||"";
  scope.addEventListener("change",function(){ UI.regscope=scope.value; UI.regel=""; render(); });
  box.appendChild(scope);

  var ifn=UI.regscope;
  var eigen=ifn?(((REG.interfaces[ifn]||{}).views||{})[key]||[]):(vd.layout||null);
  var geerbtVon="";
  if(ifn&&!eigen.length){
    var kette=ancestorsOf(ifn);
    for(var ai=0;ai<kette.length;ai++){
      if((((REG.interfaces[kette[ai]]||{}).views||{})[key]||[]).length){ geerbtVon=kette[ai]; break; }
    }
  }

  if(ifn){
    box.appendChild(el("p",{class:"hint",style:"margin-top:8px",
      text:eigen&&eigen.length
        ? "This type has its own layout. Remove every element to fall back to the default."
        : (geerbtVon
            ? "Inherited from "+((REG.interfaces[geerbtVon]||{}).label||geerbtVon)+". Adding an element here makes this type's own layout."
            : "Uses the default layout. Adding an element here makes this type's own layout.")}));
  }

  /* Das gezeigte Layout ist das, was ein Artikel dieses Typs wirklich
     bekäme — nicht die leere Liste, auf der man sonst stünde. */
  var wirksam=ifn?layoutOf(vd,ifn,key):(vd.layout||legacyLayout(vd));
  var eigenes=ifn?(eigen&&eigen.length?eigen:null):(Array.isArray(vd.layout)?vd.layout:null);

  box.appendChild(el("div",{class:"rsec",text:"Layout"}));
  if(!eigenes&&!ifn) box.appendChild(el("p",{class:"hint",
    text:"Converted from the older switch form on read. The first change writes it out as elements."}));

  /* Die Anordnung einer Art steht **an der Art**. Nur die Grundanordnung —
     die ohne Art — steht an der Ansicht. */
  function schreibe(liste){
    if(ifn){
      var d2=REG.interfaces[ifn]; if(!d2)return;
      d2.views=d2.views||{};
      if(liste.length) d2.views[key]=liste; else delete d2.views[key];
      if(!Object.keys(d2.views).length) delete d2.views;
      saveReg("interfaces"); render(); return;
    }
    vd.layout=liste;
    save();
  }
  /* Beim ersten Eingriff wird aus dem abgeleiteten Layout ein echtes —
     sonst bearbeitet man eine Liste, die nirgends steht. */
  function arbeitsliste(){
    return (eigenes||wirksam).map(function(x){
      return Object.assign({},x,{id:x.id||uid("l")}); });
  }

  if(!wirksam.length) box.appendChild(el("div",{class:"empty",text:"Nothing in this layout yet."}));
  wirksam.forEach(function(item,i){
    box.appendChild(layoutRow(item,i,wirksam.length));
  });

  if(w){
    var tools=el("div",{class:"tools"});
    LAYOUT_ELEMENTS.forEach(function(t){
      tools.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
        var liste=arbeitsliste();
        var neu={id:uid("l"),el:t[0]};
        if(t[0]==="fields"){ neu.fields=[]; neu.columns=0; }
        if(t[0]==="prose") neu.fields="all";
        if(t[0]==="heading"||t[0]==="text") neu.text="";
        liste.push(neu); UI.regel=neu.id; schreibe(liste);
      }},"+ "+t[1]));
    });
    box.appendChild(el("div",{class:"rsec",text:"Toolbox"}));
    box.appendChild(tools);
  }
  return box;

  function layoutRow(item,i,n){
    var wrap=el("div");
    var row=el("div",{class:"crow"});
    var name=(LAYOUT_ELEMENTS.filter(function(t){return t[0]===item.el;})[0]||[item.el,item.el])[1];
    var lft=el("div",{class:"cl"});
    lft.appendChild(el("b",{text:name}));
    lft.appendChild(el("span",{class:"co",text:layoutSummary(item)}));
    row.appendChild(lft);
    if(w){
      var auf=el("button",{class:"btn sm gh",type:"button",title:"Move up",onclick:function(){
        var l=arbeitsliste(); if(i<1)return;
        var t=l[i-1]; l[i-1]=l[i]; l[i]=t; schreibe(l); }},"↑");
      if(i===0) auf.disabled=true;
      var ab=el("button",{class:"btn sm gh",type:"button",title:"Move down",onclick:function(){
        var l=arbeitsliste(); if(i>=l.length-1)return;
        var t=l[i+1]; l[i+1]=l[i]; l[i]=t; schreibe(l); }},"↓");
      if(i===n-1) ab.disabled=true;
      row.appendChild(auf); row.appendChild(ab);
    }
    row.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      UI.regel=(UI.regel===item.id?"":item.id); render(); }},UI.regel===item.id?"▴":"⋯"));
    if(w) row.appendChild(el("button",{class:"btn sm gh dngr",type:"button",title:"Remove",
      onclick:function(){ var l=arbeitsliste().filter(function(x){return x.id!==item.id;});
        schreibe(l); }},"×"));
    wrap.appendChild(row);
    if(UI.regel===item.id) wrap.appendChild(layoutSettings(item));
    return wrap;
  }

  function layoutSummary(item){
    if(item.el==="heading"||item.el==="text") return item.text?"„"+item.text+"“":"(empty)";
    if(item.el==="fields"){
      if(item.fields==="all") return "every field"+(item.columns?" · "+item.columns+" columns":"");
      var n=(item.fields||[]).length;
      return (n?n+(n===1?" entry":" entries"):"nothing chosen")+(item.columns?" · "+item.columns+" columns":"");
    }
    if(item.el==="prose") return item.fields==="all"?"every passage":((item.fields||[]).join(", ")||"nothing chosen");
    return "";
  }

  function layoutSettings(item){
    var kasten=el("div",{class:"fbox"});
    if(!w){ kasten.appendChild(el("p",{class:"hint",text:"Read only."})); return kasten; }

    function aendere(fn){ var l=arbeitsliste();
      var ziel=l.filter(function(x){return x.id===item.id;})[0];
      if(!ziel)return; fn(ziel); schreibe(l); }

    if(item.el==="heading"||item.el==="text"){
      var t=el(item.el==="text"?"textarea":"input",{class:"i"});
      if(item.el!=="text") t.type="text";
      t.value=item.text||"";
      t.addEventListener("change",function(){ var val=t.value; aendere(function(z){ z.text=val; }); });
      kasten.appendChild(field(item.el==="text"?"Text ([[links]] and {VAR} work)":"Heading",t));
      return kasten;
    }

    if(item.el==="prose"){
      /* Die Prosafelder, die es im ganzen Register gibt — „every passage"
         bleibt richtig, wenn morgen eines dazukommt, eine abgetippte Liste
         nicht. */
      var alleFelder={};
      Object.keys(REG.interfaces).forEach(function(n){
        proseFields(n).forEach(function(f){ alleFelder[f.type+"."+f.key]=1; }); });
      var chips=el("div",{class:"chips"});
      var isAll=item.fields==="all";
      chips.appendChild(marke("every passage",isAll,function(){
        aendere(function(z){ z.fields=isAll?[]:"all"; }); }));
      Object.keys(alleFelder).sort().forEach(function(b){
        var an=!isAll&&Array.isArray(item.fields)&&item.fields.indexOf(b)>=0;
        chips.appendChild(marke(b,an,function(){
          aendere(function(z){
            var l=Array.isArray(z.fields)?z.fields.slice():[];
            if(an) l=l.filter(function(x){return x!==b;}); else l.push(b);
            z.fields=l; });
        },isAll));
      });
      kasten.appendChild(chips);
      return kasten;
    }

    if(item.el==="fields"){
      var cols=el("select",{class:"i"});
      [["0","fit the width"],["1","1"],["2","2"],["3","3"],["4","4"]].forEach(function(c){
        cols.appendChild(el("option",{value:c[0]},c[1])); });
      cols.value=String(item.columns||0);
      cols.addEventListener("change",function(){ var n=Number(cols.value)||0;
        aendere(function(z){ z.columns=n; }); });
      kasten.appendChild(field("Columns",cols));

      var isAll=item.fields==="all";
      var chips=el("div",{class:"chips"});
      chips.appendChild(marke("every field",isAll,function(){
        aendere(function(z){ z.fields=isAll?[]:"all"; }); }));
      kasten.appendChild(chips);

      /* Nur die Komponenten, die der gewählte Typ überhaupt führen kann —
         eine Ansicht auf Felder zu stellen, die dieser Typ nie hat, sieht
         eingestellt aus und zeigt nichts. */
      var quelle=ifn?compsFor(ifn):Object.keys(REG.interfaces).sort();
      quelle.forEach(function(cn){
        var cd=REG.interfaces[cn]; if(!cd)return;
        var props=(cd.schema&&cd.schema.properties)||{};
        if(!Object.keys(props).length)return;
        var ganz=!isAll&&Array.isArray(item.fields)&&item.fields.indexOf(cn)>=0;
        var kopf=el("div",{class:"crow",style:"border-top:1px dashed var(--line)"});
        var kl=el("div",{class:"cl"});
        kl.appendChild(el("b",{text:cd.label||cn}));
        kl.appendChild(el("span",{class:"co",text:cn}));
        kopf.appendChild(kl);
        kopf.appendChild(marke("whole component",ganz,function(){
          aendere(function(z){
            var l=Array.isArray(z.fields)?z.fields.slice():[];
            if(ganz) l=l.filter(function(x){return x!==cn;});
            else l=l.filter(function(x){return x.indexOf(cn+".")!==0;}).concat([cn]);
            z.fields=l; });
        },isAll));
        kasten.appendChild(kopf);
        var fc=el("div",{class:"chips"});
        Object.keys(props).forEach(function(pk){
          var ref=cn+"."+pk;
          var an=!isAll&&!ganz&&Array.isArray(item.fields)&&item.fields.indexOf(ref)>=0;
          fc.appendChild(marke(props[pk].title||pk,an,function(){
            aendere(function(z){
              var l=Array.isArray(z.fields)?z.fields.slice():[];
              if(an) l=l.filter(function(x){return x!==ref;}); else l.push(ref);
              z.fields=l; });
          },isAll||ganz));
        });
        kasten.appendChild(fc);
      });
      return kasten;
    }

    kasten.appendChild(el("p",{class:"hint",text:"Nothing to set on this element."}));
    return kasten;
  }

  function marke(text,an,onclick,aus){
    var b=el("button",{type:"button",class:"chip pick"+(an?" on":""),onclick:onclick},text);
    if(aus) b.disabled=true;
    return b;
  }
}

function regIfaceBody(ifn){
  var d=REG.interfaces[ifn], w=canWrite();
  var box=el("div",{class:"regbody"});
  function save(){ saveReg("interfaces"); render(); }

  /* ---- Kopf ----
     Kein zweiter Titel: die Art steht als Überschrift darüber. */
  var count=countIface(ifn);
  box.appendChild(el("div",{class:"key",
    text:ifn+" · "+(count?count+(count===1?" articles":" articles"):"no articles")}));

  var head=el("div",{class:"fmore",style:"border-bottom:0;padding-top:10px"});
  var labelInput=el("input",{class:"i",type:"text",value:d.label||""});
  if(!w) labelInput.disabled=true;
  labelInput.addEventListener("change",function(){ d.label=labelInput.value.trim()||ifn; save(); });
  head.appendChild(field("Label",labelInput));

  var ab=el("select",{class:"i"}); if(!w) ab.disabled=true;
  ab.appendChild(el("option",{value:""},"instantiable"));
  ab.appendChild(el("option",{value:"1"},"abstract only"));
  ab.value=d.abstract?"1":"";
  ab.addEventListener("change",function(){
    if(ab.value) d.abstract=true; else delete d.abstract;
    save(); });
  head.appendChild(field("Kind",ab));
  box.appendChild(head);

  /* ---- Besteht aus ----
     Ein Typ ist entweder ein **Basistyp** — er erklärt Felder und erbt
     nichts — oder ein **Zusammenschluss** aus anderen Typen. Was ein
     Ereignis nicht braucht, nimmt es nicht dazu; ein Feld einzeln
     auszublenden gibt es nicht, weil eine Ausnahmeliste am Tag des nächsten
     Feldes unvollständig wäre und es niemand merkte. */
  var teile=parentsOf(ifn);
  box.appendChild(el("div",{class:"rsec",text:"Made of"}));
  box.appendChild(el("p",{class:"hint",
    text:teile.length
      ? "The types this one is made of. The first draws the tree and decides the area; the rest come along. Removing one removes its fields."
      : "Nothing — this type declares its fields itself. Add a part and it becomes a composition."}));
  var tc=el("div",{class:"chips"});
  teile.forEach(function(p2,i){
    var c=el("span",{class:"chip"+(i?"":" first")});
    c.appendChild(el("button",{type:"button",class:"ref",onclick:function(){
      UI.typePick=p2; UI.regiface=p2; UI.regcomp=""; UI.regprop=""; render(); }},
      (REG.interfaces[p2].label||p2)));
    if(w) c.appendChild(el("button",{type:"button",title:"remove",onclick:function(){
      confirmDialog("„"+(REG.interfaces[p2].label||p2)+"” aus "+(d.label||ifn)+
        " herausnehmen? Die Werte bleiben in den Artikeln, werden aber nicht mehr gezeigt.",
        function(){
          d.extends=parentsOf(ifn).filter(function(x){ return x!==p2; });
          if(!d.extends.length) delete d.extends;
          save(); },"Remove"); }},"\u00d7"));
    tc.appendChild(c);
  });
  if(w){
    var mehr=el("select",{class:"i",style:"width:auto"});
    mehr.appendChild(el("option",{value:""},"+ part\u2026"));
    Object.keys(REG.interfaces).sort().forEach(function(n2){
      if(n2===ifn||wouldCycle(ifn,n2)||teile.indexOf(n2)>=0)return;
      mehr.appendChild(el("option",{value:n2},REG.interfaces[n2].label||n2)); });
    mehr.addEventListener("change",function(){
      if(!mehr.value)return;
      d.extends=parentsOf(ifn).concat([mehr.value]);
      save(); });
    tc.appendChild(mehr);
  }
  box.appendChild(tc);

  /* ---- Felder ----
     **Eine** Liste, nicht eine Zeile je Karte. Jedes Feld mit seiner Art,
     ob es Pflicht ist und woher es kommt. Vorher standen eigene und geerbte
     Felder in zwei Abschnitten, die dasselbe meinten — und wer wissen
     wollte, was ein Ereignis trägt, musste beide aufklappen. */
  box.appendChild(el("div",{class:"rsec",text:"Fields"}));
  box.appendChild(el("p",{class:"hint",
    text:"Every field an article of this kind records. Its own are editable here; inherited ones belong to the part that brings them — open it to change them for every type that has it."}));
  box.appendChild(fieldTable(ifn,w,save));

  /* ---- Subtypen ---- */
  box.appendChild(el("div",{class:"rsec",text:"Subtypes"}));
  var children=kindsOf(ifn);
  if(!children.length) box.appendChild(el("p",{class:"hint",
    text:"None. A subtype inherits everything from here and adds parts and fields of its own."}));
  else{
    var kc=el("div",{class:"chips"});
    children.forEach(function(n){
      var c=el("span",{class:"chip"});
      c.appendChild(el("button",{type:"button",class:"ref",onclick:function(){
        UI.regiface=n; UI.regcomp=""; UI.regprop=""; render(); }},REG.interfaces[n].label||n));
      var z=countIface(n);
      if(z) c.appendChild(el("span",{class:"co",text:String(z)}));
      kc.appendChild(c);
    });
    box.appendChild(kc);
  }
  if(w) box.appendChild(newInterfaceBar(ifn));

  /* ---- Entfernen ---- */
  if(w){
    var reason=count?count+" articles use it":(children.length?"has subtypes":"");
    var del=el("button",{class:"btn sm dngr",type:"button",onclick:function(){
      if(reason) return;
      confirmDialog("Schnittstelle „"+(d.label||ifn)+"”?",function(){
        delete REG.interfaces[ifn]; UI.regiface=""; save(); },"Remove"); }},"Remove interface");
    if(reason){ del.disabled=true; del.title=reason; }
    var fbar=el("div",{class:"rowbtns"}); fbar.appendChild(del);
    if(reason) fbar.appendChild(el("span",{class:"co",style:"align-self:center",text:reason}));
    box.appendChild(fbar);
  }

  return box;

  /* ---------- eine Karte, aufklappbar ----------
     Eine Karte heisst nach der Art, die ihre Felder erklärt. Für diese Art
     ist es sie selbst; alles andere kommt von oben und wird dort geändert.
     Es gab hier einmal eine Auswahl „Pflicht / Optional / nicht benutzt" —
     sie stand für `requires` und `allows`, und beides sagte über die Hälfte
     der Einträge nichts, weil die verlangte Karte kein Pflichtfeld hatte. */
  function compRow(cn){
    var cd=REG.interfaces[cn]||{};
    var props=propsOf(cn);
    var n=Object.keys(props).length;
    var eigen=(cn===ifn);

    var row=el("div",{class:"crow"});
    var lft=el("div",{class:"cl"});
    lft.appendChild(el("b",{text:cd.label||cn}));
    lft.appendChild(el("span",{class:"co",
      text:cn+" · "+n+(n===1?" field":" fields")+(eigen?" · its own":" · inherited")}));
    row.appendChild(lft);

    if(!eigen) row.appendChild(el("button",{class:"btn sm gh",type:"button",onclick:function(){
      UI.regiface=cn; UI.regcomp=""; UI.regprop=""; render(); }},"Open"));

    row.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      UI.regcomp=(UI.regcomp===cn?"":cn); UI.regprop=""; render(); }},
      UI.regcomp===cn?"Fields \u25b4":"Fields \u25be"));

    var wrap=el("div");
    wrap.appendChild(row);
    /* Geerbte Felder werden dort geändert, wo sie stehen. Sie hier
       bearbeitbar zu machen hiesse, sie für jede andere Art mitzuändern,
       ohne dass es jemand sieht. */
    if(UI.regcomp===cn) wrap.appendChild(fieldBox(cn,ifn,w&&eigen,save));
    return wrap;
  }
}

/* ---------- alle Felder einer Art, in einer Liste ----------
   Eigene zuerst und bearbeitbar, geerbte darunter mit dem Bestandteil, der
   sie mitbringt. Geerbte sind hier **nicht** bearbeitbar: ein Feld an
   `Identity` zu ändern, weil man gerade bei `Event` steht, änderte es für
   jede Artikelart — und zwar ohne dass es irgendwo stünde. Ein Klick auf
   den Bestandteil führt dorthin, wo die Änderung hingehört. */
/* Die Felder einer Art — als **Blöcke**, nicht als eine flache Liste.
   Oben die eigenen, darunter je ein Block für den Bestandteil, der seine
   mitbringt. Vorher stand an jeder geerbten Zeile „from Time"; bei
   dreiundachtzig Feldern las man dann dreiundachtzigmal, woher etwas kommt,
   statt einmal zu sehen, woraus die Art besteht. Und es ist dieselbe
   Einteilung, die die Ansicht zeichnet — zwei Bilder derselben Sache im
   Kopf zusammenzuhalten ist Arbeit, die niemand tun sollte. */
function fieldTable(ifn,w,save){
  var aussen=el("div");
  var box=el("div",{class:"fbox"});
  var eigen=propsOf(ifn), keys=Object.keys(eigen);
  if(keys.length) box.appendChild(el("div",{class:"fhead"},
    [el("b",{text:"Its own"}),
     el("span",{class:"co",text:keys.length+(keys.length===1?" field":" fields")})]));
  keys.forEach(function(k){ box.appendChild(fieldRow(ifn,k,ifn,w,save)); });

  var geerbt=0;
  var bloecke=[];
  ancestorsOf(ifn).forEach(function(a){
    var ks=Object.keys(propsOf(a));
    if(!ks.length)return;
    var teil=el("div",{class:"fbox part"});
    var kopf=el("div",{class:"fhead"});
    kopf.appendChild(el("button",{class:"ref",type:"button",
      title:"Open the part — a field is changed where it is declared",
      onclick:function(){ UI.typePick=a; UI.regiface=a; UI.regcomp=""; UI.regprop=""; render(); }},
      REG.interfaces[a].label||a));
    kopf.appendChild(el("span",{class:"co",text:ks.length+(ks.length===1?" field":" fields")}));
    /* Woher der Bestandteil kommt: direkt genommen oder über einen anderen
       hereingekommen. Ohne das sähe `Identity` an `NPC` aus wie etwas, das
       man dort wegnehmen könnte. */
    if(parentsOf(ifn).indexOf(a)<0){
      var ueber=parentsOf(ifn).filter(function(p2){ return ancestorsOf(p2).indexOf(a)>=0||p2===a; })[0];
      if(ueber) kopf.appendChild(el("span",{class:"co",
        text:"via "+(REG.interfaces[ueber].label||ueber)}));
    }
    teil.appendChild(kopf);
    ks.forEach(function(k){ teil.appendChild(erbRow(a,k,ifn,w,save)); geerbt++; });
    bloecke.push(teil);
  });

  if(!keys.length&&!geerbt) box.appendChild(el("p",{class:"hint",text:"No fields yet."}));

  if(w){
    var nk=el("input",{class:"i",type:"text",placeholder:"Field name, e.g. weight"});
    var nt=el("input",{class:"i",type:"text",placeholder:"Label"});
    var bar=el("div",{class:"addbar",style:"margin-top:9px"});
    bar.appendChild(nk); bar.appendChild(nt);
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      var k=nk.value.trim().replace(/[^A-Za-z0-9_]/g,"");
      if(!k) return;
      var schon=fieldsOf(ifn).filter(function(f){ return f.key===k; })[0];
      if(schon){ UI.err="The field "+k+" already comes from "+
        (REG.interfaces[schon.type].label||schon.type)+"."; render(); return; }
      var d=REG.interfaces[ifn];
      d.schema=d.schema||{type:"object",properties:{}};
      d.schema.properties=d.schema.properties||{};
      d.schema.properties[k]={type:"string",title:nt.value.trim()||k};
      UI.regprop=ifn+"."+k;
      save();
    }},"Add field"));
    box.appendChild(bar);
  }
  if(keys.length||w||!geerbt) aussen.appendChild(box);
  bloecke.forEach(function(b){ aussen.appendChild(b); });
  return aussen;
}

/* Eine geerbte Zeile: das Feld gehört dem Bestandteil, und dort wird es
   geändert — wo, sagt die Kopfzeile des Blocks; an jeder Zeile stünde es
   dreiundachtzigmal.
   
   **Die Beschriftung ist die Ausnahme**, und zwar weil sie keine Tatsache
   über das Feld ist, sondern eine über diese Art: derselbe `Time.until`
   ist an einem Ereignis, wann es aufhört, und an einem Auftrag, wann es zu
   spät ist. Also darf die Art ihn umbenennen, und das schreibt in ihre
   `titles` und nicht in den Bestandteil. Eine Umbenennung, die ein
   *Obertyp* gesetzt hat, bleibt hier lesbar: sie zu ändern änderte sie für
   jede Unterart mit. */
function erbRow(art,k,ifn,w,save){
  var p=propsOf(art)[k]||{};
  var pflicht=(schemaOf(art).required||[]).indexOf(k)>=0;
  var eigenName=p.title||k;
  var woher=titleSource(ifn,art,k);
  var jetzt=fieldTitle(ifn,art,k,p);
  var row=el("div",{class:"frow inh"});
  row.appendChild(el("span",{class:"fk",text:k+(pflicht?"*":"")}));

  if(w&&(!woher||woher===ifn)){
    var ti=el("input",{class:"i",type:"text",value:jetzt,placeholder:eigenName,
      title:"What this field is called here. Empty means “"+eigenName+"”, the name it brings."});
    ti.addEventListener("change",function(){
      var neu=ti.value.trim();
      var d=REG.interfaces[ifn]; if(!d)return;
      var ref=art+"."+k;
      var t=d.titles||{};
      /* Gleich wie der eigene Name heisst: keine Umbenennung. Sie
         stehenzulassen wäre eine Zeile, die nichts tut und beim nächsten
         Umbenennen des Feldes still falsch wird. */
      if(!neu||neu===eigenName) delete t[ref]; else t[ref]=neu;
      if(Object.keys(t).length) d.titles=t; else delete d.titles;
      save();
    });
    row.appendChild(ti);
  } else {
    row.appendChild(el("span",{class:"co",
      title:woher?("Renamed at "+(REG.interfaces[woher].label||woher)+
        " — change it there, it holds for every kind under it"):"",
      text:jetzt+(woher&&woher!==ifn?" ← "+(REG.interfaces[woher].label||woher):"")}));
  }

  row.appendChild(el("span",{class:"pill q"+(p.derived?" der":""),
    title:p.derived?"Computed on read — no input, no column (D8)":"",
    text:p.derived?"derived":fieldKind(p)}));
  /* Dass hier umbenannt wurde, muss man sehen — sonst sucht jemand den
     Namen im Bestandteil und findet ihn nicht. */
  if(woher===ifn&&ifn) row.appendChild(el("span",{class:"pill",
    title:"Renamed here; it is called “"+eigenName+"” where it is declared",
    text:"renamed"}));
  return row;
}

/* Alle Felder einer Art mit der Art, die sie erklärt — dieselbe Reihenfolge
   wie die Liste oben. */
function fieldsOf(ifn){
  var out=[];
  selfAndAncestors(ifn).forEach(function(a){
    Object.keys(propsOf(a)).forEach(function(k){ out.push({type:a,key:k,prop:propsOf(a)[k]}); });
  });
  return out;
}

/* ---------- the fields of a component ----------
 Used from two places: inside an interface, where it says which *other*
 interfaces share the component, and in the components tab, where the
 component is the subject. `within` may be empty — the sharing note then
 names every user instead of "the others". */
function fieldBox(cn,within,w,saveC){
  var cd=REG.interfaces[cn];
  if(!cd) return el("div",{class:"fbox"},el("span",{class:"warnzeile",text:"Component missing from the registry."}));
  cd.schema=cd.schema||{type:"object",properties:{}};
  var schema=cd.schema;
  schema.properties=schema.properties||{};
  var props=schema.properties;
  var box=el("div",{class:"fbox"});

  /* Komponenten sind geteilt. Wer hier ein Feld ändert, ändert es überall —
     das ist der Sinn des Pools und trotzdem eine Überraschung, wenn es
     nirgends steht. */
  /* Komponenten sind geteilt. Wer hier ein Feld ändert, ändert es überall —
     das ist der Sinn des Pools und trotzdem eine Überraschung, wenn es
     nirgends steht. */
  var users=ifacesUsing(cn).filter(function(n){ return n!==within; });
  if(users.length) box.appendChild(el("p",{class:"hint",style:"margin-bottom:9px",
    text:(within?"Shared with ":"Used by ")+users.length+
      (users.length===1?" interface (":" interfaces (")+
      users.map(function(n){return REG.interfaces[n].label||n;}).join(", ")+
      "). A change here holds for all of them."}));

  var keys=Object.keys(props);
  keys.forEach(function(k){ box.appendChild(fieldRow(cn,k,within,w,saveC)); });
  if(!keys.length) box.appendChild(el("p",{class:"hint",text:"No fields yet."}));

  if(w){
    var nk=el("input",{class:"i",type:"text",placeholder:"Field name, e.g. weight"});
    var nt=el("input",{class:"i",type:"text",placeholder:"Label"});
    var bar=el("div",{class:"addbar",style:"margin-top:9px"});
    bar.appendChild(nk); bar.appendChild(nt);
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
      var k=nk.value.trim().replace(/[^A-Za-z0-9_]/g,"");
      if(!k) return;
      if(props[k]){ UI.err="The field "+k+" already exists in "+(cd.label||cn)+"."; render(); return; }
      props[k]={type:"string",title:nt.value.trim()||k};
      UI.regprop=cn+"."+k;
      saveC();
    }},"Add field"));
    box.appendChild(bar);
  }
  return box;
}

function fieldRow(cn,k,within,w,saveC){
  var cd=REG.interfaces[cn], schema=cd.schema, props=schema.properties, p=props[k];
  var row=el("div",{class:"frow"});
  row.appendChild(el("span",{class:"fk",text:k+(p["default"]!==undefined?" \u2190 "+fmtVal(p,p["default"]):"")}));

  var ti=el("input",{class:"i",type:"text",value:p.title||""});
  if(!w) ti.disabled=true;
  ti.addEventListener("change",function(){ p.title=ti.value.trim()||k; saveC(); });
  row.appendChild(ti);

  var ty=el("select",{class:"i"}); if(!w) ty.disabled=true;
  FIELD_KINDS.forEach(function(t){ ty.appendChild(el("option",{value:t[0]},t[1])); });
  ty.value=fieldKind(p);
  ty.addEventListener("change",function(){
    setFieldKind(p,ty.value);
    /* Eine neue Art will fast immer gleich eingestellt werden — Auswahlwerte
       bei „Choice", das Ziel bei „Link". Also aufklappen statt verstecken. */
    UI.regprop=cn+"."+k;
    saveC();
  });
  row.appendChild(ty);

  var id=cn+"."+k;
  row.appendChild(el("button",{class:"btn sm gh",type:"button",title:"More",onclick:function(){
    UI.regprop=(UI.regprop===id?"":id); render(); }},UI.regprop===id?"▴":"⋯"));

  if(w) row.appendChild(el("button",{class:"btn sm gh dngr",type:"button",title:"Remove field",
    onclick:function(){
      confirmDialog("Feld „"+(p.title||k)+"”? Values stay in the articles but are no longer shown.",
        function(){
          delete props[k];
          if(schema.required){
            schema.required=schema.required.filter(function(x){return x!==k;});
            if(!schema.required.length) delete schema.required;
          }
          if(UI.regprop===id) UI.regprop="";
          saveC();
        },"Remove"); }},"×"));
  else row.appendChild(el("span"));

  var wrap=el("div");
  wrap.appendChild(row);
  if(UI.regprop===id) wrap.appendChild(fieldMore(cn,k,within,w,saveC));
  return wrap;
}

function fieldMore(cn,k,within,w,saveC){
  var cd=REG.interfaces[cn], schema=cd.schema, p=schema.properties[k];
  var box=el("div",{class:"fmore"});
  function text(label,wert,setValue,ph){
    var i=el("input",{class:"i",type:"text",value:wert==null?"":wert,placeholder:ph||""});
    if(!w) i.disabled=true;
    i.addEventListener("change",function(){ setValue(i.value.trim()); saveC(); });
    box.appendChild(field(label,i));
  }

  /* Den Schlüssel umbenennen heisst: Schema, Pflichtliste, Berechnungen der
     Nachbarfelder, Ansichtsverweise und die Werte in jedem Artikel. Wer nur
     das Schema ändert, lässt die Werte hinter einem Namen zurück, den
     niemand mehr abfragt — sie sind dann still weg. */
  var keyInput=el("input",{class:"i",type:"text",value:k});
  if(!w) keyInput.disabled=true;
  keyInput.addEventListener("change",function(){
    var neuK=keyInput.value.trim().replace(/[^A-Za-z0-9_]/g,"");
    if(!neuK||neuK===k){ keyInput.value=k; return; }
    if(schema.properties[neuK]){
      UI.err="The field "+neuK+" already exists in "+(cd.label||cn)+".";
      keyInput.value=k; render(); return;
    }
    renameProperty(cn,k,neuK);
  });
  box.appendChild(field("Key",keyInput));

  var req=el("select",{class:"i"}); if(!w) req.disabled=true;
  req.appendChild(el("option",{value:""},"no"));
  req.appendChild(el("option",{value:"1"},"yes"));
  req.value=((schema.required||[]).indexOf(k)>=0)?"1":"";
  req.addEventListener("change",function(){
    var r=(schema.required||[]).filter(function(x){return x!==k;});
    if(req.value) r.push(k);
    if(r.length) schema.required=r; else delete schema.required;
    saveC(); });
  box.appendChild(field("Required field",req));

  /* Ein Standardwert gilt beim Anlegen, nicht rückwirkend. Ihn auch auf
     vorhandene Artikel zu schreiben hiesse, still Werte zu setzen, die
     niemand eingetragen hat. */
  var defNode=fieldInput(p,p["default"]);
  if(!w) defNode.disabled=true;
  defNode.addEventListener("change",function(){
    var val=fieldValue(p,defNode);
    if(val===undefined) delete p["default"]; else p["default"]=val;
    saveC();
  });
  box.appendChild(field("Default when created",defNode));

  var fm=el("select",{class:"i"}); if(!w) fm.disabled=true;
  [["","—"],["long","long text"],["signed","signed"]].forEach(function(f){
    fm.appendChild(el("option",{value:f[0]},f[1])); });
  fm.value=p.format||"";
  fm.addEventListener("change",function(){
    if(fm.value)p.format=fm.value; else delete p.format; saveC(); });
  box.appendChild(field("Display",fm));

  if(fieldKind(p)==="choice") text("Choices (comma separated)",(p["enum"]||[]).join(", "),function(v){
    var xs=v.split(",").map(function(x){return x.trim();}).filter(Boolean);
    p["enum"]=xs;
  },"common, rare");

  if(fieldKind(p)==="link") box.appendChild(targetEditor(p,saveC,w));

  text("Derived from",p.derived||"",function(v){
    if(v)p.derived=v; else delete p.derived;
  },"10+mod(wis)");

  text("belongs to field",p.of||"",function(v){
    if(v)p.of=v; else delete p.of;
  },"wis");

  if(p.derived) box.appendChild(el("p",{class:"hint",style:"grid-column:1/-1;margin:0",
    text:"Derived fields are computed on read and never stored. They get no input."}));
  return box;
}

/* ---------- renaming a field key ----------
   Five places know a field key: the schema, the component's `required` list,
   the `derived` / `of` references of its siblings, the `fields` list of every
   view, and the stored value in every article that carries the component.
   Missing any one of them loses data quietly — the value stays under the old
   key, where nothing reads it any more. */
function renameProperty(cn,oldKey,newKey){
  var cd=REG.interfaces[cn]; if(!cd||!cd.schema)return;
  var props=cd.schema.properties||{};
  if(!props[oldKey]||props[newKey])return;

  /* Die Reihenfolge der Felder ist Absicht — neu aufbauen statt anhängen. */
  var neu={};
  Object.keys(props).forEach(function(k){ neu[k===oldKey?newKey:k]=props[k]; });
  cd.schema.properties=neu;

  if(Array.isArray(cd.schema.required)){
    cd.schema.required=cd.schema.required.map(function(x){ return x===oldKey?newKey:x; });
  }
  var karte={}; karte[oldKey]=newKey;
  Object.keys(neu).forEach(function(k){
    var pd=neu[k];
    if(pd.of===oldKey) pd.of=newKey;
    if(pd.derived) pd.derived=String(pd.derived).replace(
      /[A-Za-z_][A-Za-z0-9_]*/g,function(word){ return karte[word]||word; });
  });

  var alterVerweis=cn+"."+oldKey, neuerVerweis=cn+"."+newKey;
  var viewsTouched=false;
  Object.keys(REG.views).forEach(function(vn){
    var f=REG.views[vn].fields;
    if(!Array.isArray(f))return;
    var vorher=f.join("\u0000");
    REG.views[vn].fields=f.map(function(x){ return x===alterVerweis?neuerVerweis:x; });
    if(REG.views[vn].fields.join("\u0000")!==vorher) viewsTouched=true;
  });

  var betroffen=[];
  ENT.forEach(function(e){
    var card=(e.components||{})[cn];
    if(!card||!Object.prototype.hasOwnProperty.call(card,oldKey))return;
    var neuCard={};
    Object.keys(card).forEach(function(k){ neuCard[k===oldKey?newKey:k]=card[k]; });
    e.components[cn]=neuCard;
    betroffen.push(e);
  });

  UI.regprop=cn+"."+newKey;
  saveReg("interfaces");
  if(viewsTouched) saveReg("views");
  betroffen.forEach(function(e){ persist(e); });
  UI.err=betroffen.length
    ? "Field renamed; "+betroffen.length+(betroffen.length===1?" article":" articles")+" rewritten."
    : "Field renamed.";
  render();
}

/* ---------- target constraint for a link field ---------- */
function targetEditor(p,save,writable){
  p.target=p.target||{};
  var t=p.target;
  var box=el("div",{class:"tgt"});
  box.appendChild(el("div",{class:"tt",text:"May point at"}));

  var ifs=el("select",{class:"i",multiple:"multiple",size:"4"});
  if(!writable) ifs.disabled=true;
  Object.keys(REG.interfaces).sort().forEach(function(n){
    var o=el("option",{value:n},REG.interfaces[n].label||n);
    if((t.interfaces||[]).indexOf(n)>=0) o.selected=true;
    ifs.appendChild(o);
  });
  ifs.addEventListener("change",function(){
    var picked=Array.prototype.filter.call(ifs.options,function(o){return o.selected;})
      .map(function(o){return o.value;});
    if(picked.length) t.interfaces=picked; else delete t.interfaces;
    save();
  });
  box.appendChild(field("Interfaces (subtypes included)",ifs));

  var tagBox=el("input",{class:"i",type:"text",value:(t.tags||[]).join(", "),
    placeholder:"any of these"});
  if(!writable) tagBox.disabled=true;
  tagBox.addEventListener("change",function(){
    var xs=tagBox.value.split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(xs.length) t.tags=xs; else delete t.tags;
    save();
  });
  box.appendChild(field("Tags",tagBox));

  var wo=t.where||{};
  var feldBox=el("input",{class:"i",type:"text",
    value:wo.component?wo.component+"."+(wo.property||""):"",
    placeholder:"Item.rarity"});
  var wertBox=el("input",{class:"i",type:"text",value:wo.value==null?"":String(wo.value),
    placeholder:"rare"});
  if(!writable){ feldBox.disabled=true; wertBox.disabled=true; }
  function saveWhere(){
    var teile=feldBox.value.trim().split(".");
    if(teile.length===2&&teile[0]&&teile[1]){
      t.where={component:teile[0],property:teile[1],value:wertBox.value};
    } else delete t.where;
    save();
  }
  feldBox.addEventListener("change",saveWhere);
  wertBox.addEventListener("change",saveWhere);
  box.appendChild(field("Field equals",feldBox));
  box.appendChild(field("…this value",wertBox));

  var n=linkCandidates(t,"",9999).length;
  box.appendChild(el("p",{class:"hint",style:"grid-column:1/-1;margin:0",
    text:n+(n===1?" article matches":" articles match")+
      " right now. Leave everything empty to allow any article."}));
  return box;
}
