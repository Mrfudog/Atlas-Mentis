<title>Nebelwacht Article Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e8e9e4; --surface:#f5f5f1; --surface2:#dcdfd8; --line:#c3c8bd; --line2:#aab2a4;
  --ink:#1a201d; --dim:#5c6660; --accent:#8a5d0e; --accent-soft:#f0e2c2;
  --link:#1a675e; --warn:#9c3626; --ok:#2f6b46;
  --r:3px; --gut:16px;
  --ff-disp:"Alegreya",Georgia,serif;
  --ff-body:"IBM Plex Sans",system-ui,sans-serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161e1b; --surface2:#1f2825; --line:#2e3a35; --line2:#3e4b45;
  --ink:#e6e3d8; --dim:#8c9690; --accent:#e0a83f; --accent-soft:#33290f;
  --link:#57c3b0; --warn:#e0705c; --ok:#6fc08e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161e1b; --surface2:#1f2825; --line:#2e3a35; --line2:#3e4b45;
  --ink:#e6e3d8; --dim:#8c9690; --accent:#e0a83f; --accent-soft:#33290f;
  --link:#57c3b0; --warn:#e0705c; --ok:#6fc08e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--ff-disp);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;
  padding:10px var(--gut);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--ff-disp);font-weight:700;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.sub{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
.grow{flex:1}
.search{flex:0 1 260px;min-width:0;padding:6px 9px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.body{flex:1;display:grid;grid-template-columns:210px minmax(0,1fr) 260px;gap:0;min-height:0}
.rail,.aside{overflow-y:auto;padding:14px var(--gut);border-right:1px solid var(--line);background:var(--surface)}
.aside{border-right:0;border-left:1px solid var(--line)}
.main{overflow-y:auto;padding:20px var(--gut) 60px}
.wrap{max-width:760px;margin:0 auto}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:var(--surface2);
  color:var(--ink);border:1px solid var(--line2);border-radius:var(--r);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.gh{background:transparent;border-color:transparent;color:var(--dim)}
.btn.gh:hover{color:var(--accent)}
.btn.dngr:hover{border-color:var(--warn);color:var(--warn)}
.vw{padding:5px 8px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);
  font-size:13px;max-width:140px}
label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:3px}
input.i,select.i,textarea.i{width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
textarea.i{min-height:76px;resize:vertical;font-family:var(--ff-body)}
textarea.code{font-family:var(--ff-mono);font-size:12.5px;min-height:240px;line-height:1.5}

/* ---------- rail ---------- */
.rail h3,.aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
  font-family:var(--ff-body);font-weight:600;margin:0 0 7px}
.rail section{margin-bottom:22px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
  padding:4px 7px;background:transparent;border:0;border-radius:var(--r);cursor:pointer;text-align:left}
.navrow:hover{background:var(--surface2)}
.navrow[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navrow b{font-weight:inherit}
.navrow em{font-style:normal;font-family:var(--ff-mono);font-size:11px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:1px 7px;font-size:11.5px;background:var(--surface2);border:1px solid var(--line);
  border-radius:99px;cursor:pointer;color:var(--dim);font-family:var(--ff-mono)}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* ---------- list ---------- */
.listhead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.listhead h2{font-size:24px}
.count{font-family:var(--ff-mono);font-size:12px;color:var(--dim)}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:block;width:100%;text-align:left;padding:10px 12px;background:var(--surface);border:0;cursor:pointer}
.row:hover{background:var(--surface2)}
.row .rt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row .rn{font-family:var(--ff-disp);font-size:17px;font-weight:700}
.row .rs{font-size:12px;color:var(--dim);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-size:10.5px;font-family:var(--ff-mono);text-transform:uppercase;letter-spacing:.06em;
  padding:1px 6px;border-radius:2px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.q{background:var(--surface2);color:var(--dim)}

/* ---------- article ---------- */
.arthead{border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:6px}
.arthead h2{font-size:30px}
.kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.key{font-family:var(--ff-mono);font-size:11.5px;color:var(--dim)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0}
.fld{background:var(--surface);padding:7px 10px;min-width:0}
.fld dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.fld dd{margin:1px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fld.adhoc{border-left:2px solid var(--accent)}
.fld.drv dd{color:var(--link)}
.fgrp{grid-column:1/-1;background:var(--surface2);padding:3px 10px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:600}
.drvnote{font-size:11px;color:var(--link);margin:-4px 0 8px;font-family:var(--ff-mono)}
.pruef{margin:14px 0;padding:9px 12px;border:1px solid var(--amber,var(--accent));
  border-left-width:3px;border-radius:var(--r);background:var(--accent-soft)}
.pruefkopf{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--accent);font-weight:600;margin-bottom:4px}
.pruef ul{margin:0;padding-left:18px;font-size:13px}
.pruef li{margin:1px 0}
.rail h3 .btn,.aside h3 .btn{float:right;margin-top:-2px;padding:0 6px;font-size:14px;line-height:1.2}
.warn{color:var(--accent);font-family:var(--ff-mono);font-size:11px}
.bericht{font-size:13px;margin:10px 0}
.bericht ul{margin:4px 0;padding-left:18px}
.bericht li{margin:1px 0}
.warnzeile{color:var(--warn);font-size:12.5px;margin:6px 0}
.pic{margin:14px 0}
.pic img{display:block;width:100%;max-width:100%;border:1px solid var(--line);border-radius:var(--r)}
.pic figcaption{font-size:12px;color:var(--dim);margin-top:4px;font-style:italic}
.thumb{display:block;max-width:100%;max-height:150px;margin-top:8px;border:1px solid var(--line);border-radius:var(--r)}
.blocks{margin:18px 0;display:flex;flex-direction:column;gap:12px}
.blk{position:relative}
.blk p{margin:0}
.blk .bl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
  font-weight:600;margin-bottom:2px;display:flex;gap:8px;align-items:center}
.blk.readaloud{border-left:3px solid var(--link);padding:6px 0 6px 13px;font-family:var(--ff-disp);font-size:17px;font-style:italic}
.blk.secret{border:1px dashed var(--accent);background:var(--accent-soft);padding:9px 11px;border-radius:var(--r)}
.blk.fact{border-left:3px solid var(--line2);padding-left:13px}
.blk.note{color:var(--dim);font-size:13.5px}
.sec{font-family:var(--ff-disp);font-size:20px;font-weight:700;margin:24px 0 8px;
  border-bottom:1px solid var(--line);padding-bottom:4px}
.comp{border-left:3px solid var(--accent);padding:8px 0 8px 13px;margin-bottom:12px}
.comp .cn{font-family:var(--ff-disp);font-weight:700;font-style:italic;font-size:17px}
.comp .cb{margin-top:2px}
.vr{color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent);font-variant-numeric:tabular-nums}
.ref{color:var(--link);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.ref.dead{color:var(--warn);text-decoration-style:wavy;cursor:help}
.gone{color:var(--dim);font-style:italic}

/* ---------- relations ---------- */
.rel{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.relrow{display:flex;gap:7px;align-items:baseline;font-size:13.5px}
.relrow .rl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
  flex:0 0 auto;min-width:76px;padding-top:2px}
.relrow .rv{flex:1;min-width:0}
.bind{font-family:var(--ff-mono);font-size:11px;color:var(--dim);display:block;margin-top:1px}

/* ---------- registry ---------- */
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:6px 13px;background:transparent;border:0;border-bottom:2px solid transparent;
  cursor:pointer;color:var(--dim);font-size:13px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.hint{font-size:12.5px;color:var(--dim);margin:0 0 12px;max-width:62ch}
.err{color:var(--warn);font-family:var(--ff-mono);font-size:12px;margin-top:6px;white-space:pre-wrap}

/* ---------- misc ---------- */
.banner{padding:9px 12px;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:var(--r);font-size:13px;margin-bottom:16px}
.empty{padding:40px 0;text-align:center;color:var(--dim)}
.dlg{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:var(--gut);
  background:rgba(0,0,0,.55)}
.dlgbox{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);
  padding:18px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
.dlgbox h3{font-family:var(--ff-disp);font-size:20px;margin-bottom:12px}
.dgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);
  font-weight:600;margin:16px 0 7px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.dgrp:first-child{margin-top:0}
.drvrow{display:flex;align-items:baseline;gap:7px;margin-bottom:10px;font-size:13px;color:var(--dim)}
.drvval{font-family:var(--ff-mono);color:var(--link);font-size:14px;font-variant-numeric:tabular-nums}
.drvexp{font-family:var(--ff-mono);font-size:11px;color:var(--dim);margin-left:auto;opacity:.75}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.mob{display:none}

/* ---------- registry editor ---------- */
.reg2{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.regtree{background:var(--surface2);border-right:1px solid var(--line);padding:8px 6px;
  overflow-y:auto;max-height:72vh}
.regtree button{display:block;width:100%;text-align:left;padding:4px 7px;background:none;border:0;
  border-radius:var(--r);cursor:pointer;font:inherit;font-size:13px;color:inherit}
.regtree button:hover{background:var(--surface)}
.regtree button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.regtree .ab{color:var(--dim);font-style:italic}
.regtree em{font-style:normal;font-family:var(--ff-mono);font-size:10.5px;color:var(--dim);float:right}
.regbody{padding:14px 16px;overflow-y:auto;max-height:72vh;background:var(--surface)}
.regbody h3{font-family:var(--ff-disp);font-size:19px;margin:0 0 2px}
.rsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);
  border-bottom:1px solid var(--line);padding-bottom:3px;margin:20px 0 8px}
.crow{display:flex;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .cl{flex:1;min-width:0}
.crow .cl b{font-weight:600}
.crow .co{display:block;font-size:11px;color:var(--dim)}
.crow select{width:auto;padding:3px 6px;font-size:12px}
.fbox{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;margin:2px 0 10px}
.frow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 108px auto auto;
  gap:6px;align-items:center;padding:3px 0}
.frow .fk{font-family:var(--ff-mono);font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.frow input.i,.frow select.i{padding:3px 6px;font-size:12.5px}
.fmore{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:6px;padding:4px 0 8px 0;border-bottom:1px dashed var(--line)}
.fmore label.f{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;font-size:12px;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px}
.chip.inh{color:var(--dim);font-style:italic}
.chip button{background:none;border:0;cursor:pointer;color:var(--dim);font:inherit;
  padding:0;line-height:1}
.chip button:hover{color:var(--warn)}
.addbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addbar select.i,.addbar input.i{width:auto;min-width:150px;flex:0 1 auto}

.swatch{display:inline-block;width:11px;height:11px;border-radius:2px;
  border:1px solid var(--line2);vertical-align:baseline}
.linkbox{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:70;background:var(--surface);
  border:1px solid var(--line2);border-top:0;border-radius:0 0 var(--r) var(--r);
  max-height:210px;overflow-y:auto;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.sugg button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  width:100%;text-align:left;padding:5px 9px;background:none;border:0;cursor:pointer;font:inherit}
.sugg button:hover{background:var(--accent-soft)}
.sugg em{font-style:normal;font-family:var(--ff-mono);font-size:10.5px;color:var(--dim)}
.tgt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;
  grid-column:1/-1;padding:7px 9px;margin-top:4px;background:var(--surface2);
  border:1px solid var(--line);border-radius:var(--r)}
.tgt .tt{grid-column:1/-1;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent)}

@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr)}
  .rail,.aside{display:none}
  .rail.on,.aside.on{display:block;border:0}
  .main{padding-bottom:78px}
  .mob{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--line);padding:6px var(--gut);
    padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
  .mob button{flex:1;padding:8px 2px;background:transparent;border:0;border-radius:var(--r);
    font-size:12px;color:var(--dim);cursor:pointer}
  .mob button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .search{flex:1 1 auto}
  .reg2{grid-template-columns:minmax(0,1fr)}
  .regtree{border-right:0;border-bottom:1px solid var(--line);max-height:30vh}
  .frow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .arthead h2{font-size:25px}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Nebel<span>wacht</span></div>
    <div class="sub">Article Engine</div>
    <div class="grow"></div>
    <input id="q" class="search" type="search" placeholder="Search…" aria-label="Search articles">
    <select id="facet" class="vw" aria-label="View"></select>
    <button id="new" class="btn pri" type="button">+ New</button>
  </header>

  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main"><div class="wrap" id="view"></div></main>
    <aside class="aside" id="aside"></aside>
  </div>

  <nav class="mob" id="mob">
    <button type="button" data-p="rail">Registry</button>
    <button type="button" data-p="main" aria-current="true">Articles</button>
    <button type="button" data-p="aside">Relations</button>
  </nav>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   Nebelwacht Article Engine v0
   Compound backbone at prototype depth:
     entity (peg) + components (cards) + relations (strings)
     interfaces / component_defs / relation_defs as registry ROWS
   Adding a kind of thing = one interface row. No code change.
   ============================================================ */

var db=null, me={write:true}, ready=false;
var ENT=new Map();                       // id -> entity body

/* Ein Schnappschuss liefert eingefrorene Objekte („Delivered snapshots and
   their data() are frozen"). Unter "use strict" wirft schon `b.id=b.id` auf
   so einem Objekt — und zwar mitten im Snapshot-Callback, wo niemand es
   auffängt. Deshalb kommt alles, was die Seite später bearbeitet, als
   eigene Kopie herein. */
function thawed(o){
  if(o==null) return o;
  try{ return structuredClone(o); }catch(x){}
  try{ return JSON.parse(JSON.stringify(o)); }catch(x){ return o; }
}
var REG={interfaces:{},components:{},relations:{},vars:{},views:{}};
var UI={route:{k:"list"}, view:"quick", iface:"", tag:"", q:"", offen:false, pane:"main",
        regtab:"interfaces", regiface:"", regcomp:"", regprop:"", regjson:false, err:""};

/* Darstellungsstufen (Facets, REQ-164) — registry rows, not code.
   Fallback only; the live set lives in registry/views. */
var VIEWS_FALLBACK={
  quick:{label:"Quick",order:1,fields:"none",blocks:["paragraph","readaloud"],
           description:true,relations:false,bindings:false},
  full:   {label:"Full",order:2,fields:"all",blocks:"all",
           description:true,relations:true,bindings:true}
};
function viewDef(){
  var vs=Object.keys(REG.views).length?REG.views:VIEWS_FALLBACK;
  return vs[UI.view]||vs[Object.keys(vs).sort(function(a,b){
    return (vs[a].order||99)-(vs[b].order||99);})[0]]||VIEWS_FALLBACK.full;
}
function viewKeys(){
  var vs=Object.keys(REG.views).length?REG.views:VIEWS_FALLBACK;
  return Object.keys(vs).sort(function(a,b){return (vs[a].order||99)-(vs[b].order||99);});
}
/* Which fields does this view show?
   fields: "none" | "all" | ["StatblockInfo", "StatblockInfo.ac", …]
   A bare component name takes all of its fields; "Komponente.feld" takes one. */
function showField(v,cn,p){
  if(v.fields==="all")return true;
  if(v.fields==="none"||!v.fields)return false;
  if(!Array.isArray(v.fields))return false;
  return v.fields.indexOf(cn)>=0 || v.fields.indexOf(cn+"."+p)>=0;
}
function compShown(v,cn,props){
  return Object.keys(props).some(function(p){return showField(v,cn,p);});
}

/* ---------- Calculation: derived values, computed on read (D8) ---------- */
/* Shunting-Yard, kein eval: Registerzeilen sind Daten, die jemand bearbeiten
   kann. Bei Unsinn kommt null, nicht eine irreführende 0.
   `u` ist das unäre Minus. Es muss enger binden als jeder Rechenoperator,
   sonst wird aus `2*-3` ein `(2*0)-3` — das ergab -3 statt -6 und sah wie
   eine plausible Zahl aus. */
function evalArith(s){
  var toks=String(s).match(/\d+\.?\d*|[+\-*/()]/g); if(!toks)return null;
  var out=[],ops=[],prec={"+":1,"-":1,"*":2,"/":2,u:3},prev=null;
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    if(/^\d/.test(t)){ out.push(parseFloat(t)); prev="n"; continue; }
    if(t==="("){ ops.push(t); prev="("; continue; }
    if(t===")"){
      while(ops.length&&ops[ops.length-1]!=="(")out.push(ops.pop());
      if(!ops.length)return null;            // unbalanciert
      ops.pop(); prev="n"; continue;
    }
    var op=(t==="-"&&(prev===null||prev==="op"||prev==="("))?"u":t;
    /* unäre Negation ist rechtsassoziativ, gleiche Stufe stösst also nicht ab */
    while(ops.length&&ops[ops.length-1]!=="("&&prec[ops[ops.length-1]]>=prec[op]
          &&!(op==="u"&&ops[ops.length-1]==="u")) out.push(ops.pop());
    ops.push(op); prev="op";
  }
  while(ops.length){ var last=ops.pop(); if(last==="(")return null; out.push(last); }
  var st=[];
  for(i=0;i<out.length;i++){
    var o=out[i];
    if(typeof o==="number"){st.push(o);continue;}
    if(o==="u"){ var only=st.pop(); if(only===undefined)return null; st.push(-only); continue; }
    var b=st.pop(),a=st.pop(); if(a===undefined||b===undefined)return null;
    st.push(o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:(b?a/b:0));
  }
  return st.length===1?st[0]:null;
}
// "mod(str)", "mod(dex)+prof", "2+prof" — names resolve against sibling fields
/* A grid is a list of rows of glyphs; anything but these counts as occupied. */
var EMPTY_CELL={"0":1,".":1," ":1,"_":1};
function asRows(raw){
  if(Array.isArray(raw))return raw.map(String);
  if(typeof raw==="string")return raw.split("\n");
  return [];
}
/* Unary functions over one sibling field. Extending the Calculation engine is
   adding an entry here — no consumer changes, the same promise the registry
   makes for data. The names avoid the property keys they are used on
   (`width`, `height`, `cells`): a function and a field of the same name read
   as the same thing and are not. */
var DERIVED_FN={
  mod:function(raw){ var n=Number(raw); return isFinite(n)?Math.floor((n-10)/2):0; },
  rowCount:function(raw){ return asRows(raw).length; },
  colCount:function(raw){ return asRows(raw).reduce(function(m,r){return Math.max(m,r.length);},0); },
  cellCount:function(raw){ return asRows(raw).reduce(function(sum,r){
    return sum+r.split("").filter(function(g){return !EMPTY_CELL[g];}).length; },0); }
};
function derivedValue(pd,val){
  if(!pd||!pd.derived)return undefined;
  var siblings=val||{};
  /* Funktionen zuerst: ihr Argument ist ein Feldname, kein Ausdruck. */
  var expr=String(pd.derived).replace(/([A-Za-z_][A-Za-z0-9_]*)\(\s*([A-Za-z0-9_]+)\s*\)/g,
    function(whole,fn,key){
      return DERIVED_FN[fn]?"("+DERIVED_FN[fn](siblings[key])+")":whole;
    });
  expr=expr.replace(/[A-Za-z_][A-Za-z0-9_]*/g,function(k){
    var n=Number(siblings[k]); return isFinite(n)?"("+n+")":"(0)"; });
  var r=evalArith(expr);
  return r==null?undefined:Math.trunc(r);
}
function fmtVal(pd,x){
  if(x===undefined||x===null||x==="")return "";
  if(pd&&pd.format==="signed"&&typeof x==="number")return (x>=0?"+":"")+x;
  if(typeof x==="object")return Array.isArray(x)?x.join(", "):JSON.stringify(x);
  return String(x);
}
/* does this view show this block type? blocks: "all" | [Blockarten] */
function showBlock(v,bt){
  if(v.blocks==="all")return true;
  return Array.isArray(v.blocks)&&v.blocks.indexOf(bt)>=0;

/* ---------- field kinds ----------
   A schema property carries a JSON-Schema `type`, but the page needs a finer
   distinction: a colour, a fixed choice and a link to another article are all
   strings on the wire and nothing alike in a form. `format` and the presence
   of `enum` carry that; fieldKind() reads it back out so the registry stays
   plain JSON Schema instead of growing a private type system. */
var FIELD_KINDS=[
  ["text","Text"],["number","Number"],["boolean","Yes/No"],
  ["choice","Choice"],["color","Colour"],["link","Link to article"],
  ["list","List"],["object","Object"]
];
function fieldKind(p){
  if(!p) return "text";
  if(p.format==="color") return "color";
  if(p.format==="link") return "link";
  if(Array.isArray(p["enum"])) return "choice";
  if(p.type==="number"||p.type==="integer") return "number";
  if(p.type==="boolean") return "boolean";
  if(p.type==="array") return "list";
  if(p.type==="object") return "object";
  return "text";
}
/* Setting a kind rewrites exactly the keys that define it and leaves the rest
   alone — title, derived and required survive a change of mind. */
function setFieldKind(p,kind){
  delete p["enum"];
  if(p.format==="color"||p.format==="link") delete p.format;
  delete p.target;
  switch(kind){
    case "number":  p.type="number"; break;
    case "boolean": p.type="boolean"; break;
    case "list":    p.type="array"; break;
    case "object":  p.type="object"; break;
    case "choice":  p.type="string"; p["enum"]=[]; break;
    case "color":   p.type="string"; p.format="color"; break;
    case "link":    p.type="string"; p.format="link"; p.target={}; break;
    default:        p.type="string";
  }
}

/* ---------- link targets ----------
   Which articles may a link field point at. Three filters, all optional and
   combined with AND: interface (subtypes included), tags (any of), and a
   field value. Empty means "any article" — a link with no constraint is still
   a link, not an error. */
function ifaceAndKinds(name,seen){
  seen=seen||{}; if(seen[name])return []; seen[name]=1;
  var out=[name];
  kindsOf(name).forEach(function(k){ out=out.concat(ifaceAndKinds(k,seen)); });
  return out;
}
function targetMatches(target,e){
  var t=target||{};
  if(Array.isArray(t.interfaces)&&t.interfaces.length){
    var erlaubt={};
    t.interfaces.forEach(function(n){ ifaceAndKinds(n).forEach(function(k){ erlaubt[k]=1; }); });
    if(!(e.interfaces||[]).some(function(n){ return erlaubt[n]; })) return false;
  }
  if(Array.isArray(t.tags)&&t.tags.length){
    if(!(e.tags||[]).some(function(x){ return t.tags.indexOf(x)>=0; })) return false;
  }
  if(t.where&&t.where.component&&t.where.property){
    var have=((e.components||{})[t.where.component]||{})[t.where.property];
    if(String(have==null?"":have)!==String(t.where.value==null?"":t.where.value)) return false;
  }
  return true;
}
/* Candidates for a link field, newest-relevant first: name match before a
   match anywhere else, so typing a name does not bury it under descriptions. */
function linkCandidates(target,query,limit){
  var q=String(query||"").toLowerCase().trim();
  var vorn=[], hinten=[];
  ENT.forEach(function(e){
    if(!targetMatches(target,e))return;
    var name=nameOf(e).toLowerCase();
    var aliases=(((e.components||{}).Identity||{}).aliases||[]).join(" ").toLowerCase();
    if(!q){ vorn.push(e); return; }
    if(name.indexOf(q)===0) vorn.push(e);
    else if(name.indexOf(q)>=0||aliases.indexOf(q)>=0) hinten.push(e);
  });
  var byName=function(a,b){ return nameOf(a).localeCompare(nameOf(b),"en"); };
  return vorn.sort(byName).concat(hinten.sort(byName)).slice(0,limit||12);
}

/* A link field holds an article id but a person types a name. The input keeps
   the id on the node (`data-id`) and shows the name; the suggestion list is
   filtered through the field's own target constraint, so a Weapon field never
   offers a Place. Typing a name that matches nothing leaves the id empty —
   better than storing a name the resolver will not find later. */
function linkInput(pd,cur){
  var wrap=el("div",{class:"linkbox"});
  var known=ENT.get(cur);
  var inp=el("input",{class:"i",type:"text",autocomplete:"off",
    placeholder:"Type to search…",value:known?nameOf(known):""});
  inp.dataset.id=known?known.id:"";
  var list=el("div",{class:"sugg"});
  /* Beim Übernehmen eines Vorschlags läuft derselbe `input`, mit dem sonst
     das Tippen die Id verwirft. Ohne diese Sperre löschte die Auswahl genau
     das, was sie eben gesetzt hat — das Feld sah gefüllt aus und speicherte
     nichts. */
  var waehlt=false;
  function hide(){ list.textContent=""; list.style.display="none"; }
  function show(){
    var treffer=linkCandidates(pd.target,inp.value,10);
    list.textContent="";
    if(!treffer.length){ hide(); return; }
    treffer.forEach(function(t){
      var b=el("button",{type:"button",onmousedown:function(ev){
        ev.preventDefault();
        waehlt=true;
        inp.value=nameOf(t); inp.dataset.id=t.id; hide();
        inp.dispatchEvent(new Event("input",{bubbles:true}));
        waehlt=false;
      }});
      b.appendChild(el("b",{text:nameOf(t)}));
      b.appendChild(el("em",{text:ifaceName(t)}));
      list.appendChild(b);
    });
    list.style.display="block";
  }
  inp.addEventListener("focus",show);
  inp.addEventListener("input",function(){
    if(waehlt)return;
    /* Was getippt wird, ist erst eine Absicht. Die Id fällt weg, bis wieder
       ein Artikel gewählt ist — sonst zeigt das Feld einen Namen und speichert
       einen anderen Artikel. */
    inp.dataset.id="";
    show();
  });
  inp.addEventListener("blur",function(){ setTimeout(hide,150); });
  wrap.appendChild(inp); wrap.appendChild(list);
  hide();
  wrap.value="";
  Object.defineProperty(wrap,"value",{
    get:function(){ return inp.dataset.id||""; },
    set:function(v){ var t=ENT.get(v); inp.value=t?nameOf(t):""; inp.dataset.id=t?v:""; }
  });
  wrap.addEventListener=function(t,f){ inp.addEventListener(t,f); };
  return wrap;
}

/* ---------- small helpers ---------- */
function el(t,a,kids){var n=document.createElement(t);
  if(a)for(var k in a){ if(k==="class")n.className=a[k];
    else if(k==="text")n.textContent=a[k];
    else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),a[k]);
    else if(a[k]!==null&&a[k]!==false&&a[k]!==undefined)n.setAttribute(k,a[k]); }
  if(kids)(Array.isArray(kids)?kids:[kids]).forEach(function(c){ if(c==null)return;
    n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;}
function uid(p){return (p||"e")+"_"+Math.random().toString(36).slice(2,9);}
function slug(s){return String(s||"").toLowerCase()
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"unnamed";}
function esc(s){return String(s==null?"":s);}
function nameOf(e){return e&&(e.name||(e.components&&e.components.Name&&e.components.Name.text))||"Unnamed";}
function byName(){return Array.from(ENT.values()).sort(function(a,b){
  return nameOf(a).localeCompare(nameOf(b),"de");});}

/* ---------- registry access ---------- */
function ifaceOf(e){ var n=(e.interfaces&&e.interfaces[0])||""; return REG.interfaces[n]||null; }
function ifaceName(e){ var d=ifaceOf(e); return d?(d.label||d.name):((e.interfaces&&e.interfaces[0])||"—"); }
// requires ∪ allows, walking `extends`
function compsFor(name,seen){
  var d=REG.interfaces[name]; if(!d)return [];
  seen=seen||{}; if(seen[name])return []; seen[name]=1;
  var out=[];
  (d.extends||[]).forEach(function(p){ out=out.concat(compsFor(p,seen)); });
  out=out.concat(d.requires||[],d.allows||[]);
  return out.filter(function(c,i){return out.indexOf(c)===i && REG.components[c];});
}
function reqFor(name,seen){
  var d=REG.interfaces[name]; if(!d)return [];
  seen=seen||{}; if(seen[name])return []; seen[name]=1;
  var out=[]; (d.extends||[]).forEach(function(p){out=out.concat(reqFor(p,seen));});
  return out.concat(d.requires||[]);
}
function blockTypesFor(name){
  var d=REG.interfaces[name]; if(!d)return ["paragraph"];
  var out=[]; (d.extends||[]).forEach(function(p){out=out.concat(blockTypesFor(p));});
  (d.blockTypes||[]).forEach(function(b){ out.push(b.charAt(0)==="+"?b.slice(1):b); });
  out=out.filter(function(b,i){return out.indexOf(b)===i;});
  return out.length?out:["paragraph"];
}
/* ---------- registry: hierarchy and provenance ---------- */
/* Subtypen sind keine eigene Sorte Zeile: eine Schnittstelle, die eine andere
   erweitert, ist deren Subtyp. Material erweitert Gegenstand, mehr steht da
   nicht. Damit bleibt „Subtyp anlegen" eine eingefügte Zeile. */
function parentOf(n){ var p=((REG.interfaces[n]||{}).extends||[])[0]; return REG.interfaces[p]?p:""; }
function kindsOf(n){
  return Object.keys(REG.interfaces).filter(function(k){ return parentOf(k)===n; })
    .sort(function(a,b){return a.localeCompare(b,"de");});
}
function ifaceRoots(){
  return Object.keys(REG.interfaces).filter(function(n){ return !parentOf(n); })
    .sort(function(a,b){return a.localeCompare(b,"de");});
}
/* Würde `kind` unter `ganz above` hängen, entstünde ein Ring — dann fände
   compsFor() kein Ende. `seen` in compsFor fängt das ab, aber ein Register,
   das sich im Kreis dreht, ist trotzdem broken. Hier wird es verhindert. */
function wouldCycle(n,parent){
  var at=parent, guard=0;
  while(at && guard++<64){ if(at===n) return true; at=parentOf(at); }
  return false;
}
/* Woher eine Komponente an dieser Schnittstelle kommt, und wie sie dort steht. */
function compOrigin(ifn,comp){
  var at=ifn, guard=0;
  while(at && guard++<64){
    var d=REG.interfaces[at]||{};
    if((d.requires||[]).indexOf(comp)>=0) return {iface:at,mode:"requires"};
    if((d.allows||[]).indexOf(comp)>=0)   return {iface:at,mode:"allows"};
    at=parentOf(at);
  }
  return null;
}
/* Welche Schnittstellen eine Komponente nutzen — ein Feld zu ändern ändert es
   bei allen. Das gehört hingeschrieben, bevor jemand es herausfindet. */
function ifacesUsing(comp){
  return Object.keys(REG.interfaces).filter(function(n){
    var d=REG.interfaces[n];
    return (d.requires||[]).indexOf(comp)>=0||(d.allows||[]).indexOf(comp)>=0;
  }).sort();
}
function countIface(n){
  var c=0; ENT.forEach(function(e){ if(((e.interfaces||[])[0])===n) c++; }); return c;
}
function techName(label,taken){
  var base=slug(label).replace(/-([a-z])/g,function(_,c){return c.toUpperCase();})
    .replace(/^[a-z]/,function(c){return c.toUpperCase();})||"New";
  var n=base, i=2; while(taken[n]){ n=base+i; i++; }
  return n;
}

function relsFrom(ifn){
  var out=[];
  for(var k in REG.relations){ var r=REG.relations[k];
    var from=r.from||["*"];
    if(from.indexOf("*")>=0||from.indexOf(ifn)>=0) out.push(Object.assign({type:k},r)); }
  return out;
}
function relDef(t){ var r=REG.relations[t]; return r?Object.assign({type:t},r):{type:t,label:t,inverseLabel:"← "+t,to:["*"]}; }

/* ---------- Validation: dieselben Regeln wie validateEntity im Modellpaket ---------- */
function checkArticle(e){
  var problems=[], ifn=(e.interfaces||[])[0];
  if(!ifn||!REG.interfaces[ifn]){
    return [{t:"Unknown interface: "+(ifn||"(none)")}];
  }
  var erlaubt={}; compsFor(ifn).forEach(function(c){erlaubt[c]=1;});

  reqFor(ifn).forEach(function(c){
    if(!(e.components||{})[c]) problems.push({t:(REG.interfaces[ifn].label||ifn)+" requires the component "+((REG.components[c]||{}).label||c)});
  });

  Object.keys(e.components||{}).forEach(function(c){
    if(!REG.components[c]) problems.push({t:"Component "+c+" is not in the registry"});
    else if(!erlaubt[c]) problems.push({t:(REG.interfaces[ifn].label||ifn)+" does not allow the component "+(REG.components[c].label||c)+""});
  });

  Object.keys(e.components||{}).forEach(function(c){
    var cd=REG.components[c]; if(!cd)return;
    ((cd.schema||{}).required||[]).forEach(function(p){
      var pd=(cd.schema.properties||{})[p];
      if(pd&&pd.derived)return;                       // abgeleitet wird nie gespeichert
      var val=(e.components[c]||{})[p];
      if(val===undefined||val===""||val===null)
        problems.push({t:(cd.label||c)+" · "+((pd&&pd.title)||p)+" is required"});
    });
  });

  (e.relations||[]).forEach(function(r){
    if(!REG.relations[r.type]) problems.push({t:"Relation type "+r.type+" is not in the registry"});
    if(!ENT.get(r.to)) problems.push({t:relDef(r.type).label+" points at an article that does not exist",id:r.id});
  });

  return problems;
}

/* ---------- {VAR} resolution (REQ-174) ---------- */
// order: per-reference bindings → entity defaults → campaign register
function fillVars(text,refVars,ent){
  var entVars=(ent&&ent.components&&ent.components.Vars&&ent.components.Vars.bindings)||{};
  return String(text==null?"":text).replace(/\{([A-Z0-9_ÄÖÜ]+)\}/g,function(m,k){
    var v=(refVars&&refVars[k])!=null?refVars[k]
         :(entVars[k]!=null?entVars[k]
         :(REG.vars[k]!=null?REG.vars[k]:null));
    return v==null?m:"\u0001"+v+"\u0002";   // sentinels -> <span class=vr> at render
  });
}

/* ---------- inline rendering: [[links]] + resolved vars ---------- */
function findByName(n){
  var t=String(n||"").trim().toLowerCase();
  var hit=null;
  ENT.forEach(function(e,id){ if(hit)return;
    if(nameOf(e).toLowerCase()===t){hit=id;return;}
    var al=(e.components&&e.components.Identity&&e.components.Identity.aliases)||[];
    for(var i=0;i<al.length;i++) if(String(al[i]).toLowerCase()===t){hit=id;return;} });
  return hit;
}
function inline(text,into){
  var s=String(text==null?"":text);
  var re=/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]|\u0001([^\u0002]*)\u0002|\*\*([^*]+)\*\*/g;
  var last=0,m;
  while((m=re.exec(s))){
    if(m.index>last) into.appendChild(document.createTextNode(s.slice(last,m.index)));
    if(m[1]!==undefined){
      var target=m[1].trim(), show=(m[2]||m[1]).trim(), id=findByName(target);
      if(id) into.appendChild(el("button",{class:"ref",type:"button",onclick:function(x){return function(){go({k:"art",id:x});};}(id)},show));
      // A dead link is an invitation, not an error: klicken legt den Artikel an.
      else   into.appendChild(el("button",{class:"ref dead",type:"button",
               title:me.write?"No article yet — create one":"No article named “"+target+"“",
               onclick:function(t){return function(){ if(me.write)newEntity(t); };}(target)},show));
    } else if(m[3]!==undefined){
      into.appendChild(el("span",{class:"vr"},m[3]));
    } else {
      // Auszeichnung schachtelt: **{NAME}.** ist eine fette *Variable*.
      // Ohne Rekursion landet der Platzhalter als Rohtext im <strong>.
      into.appendChild(inline(m[4],el("strong")));
    }
    last=re.lastIndex;
  }
  if(last<s.length) into.appendChild(document.createTextNode(s.slice(last)));
  return into;
}
function para(text,cls){ return inline(text,el("p",cls?{class:cls}:null)); }

   RENDER

function go(r){ UI.route=r; UI.err=""; UI.pane="main"; render();
  var m=document.getElementById("main"); if(m)m.scrollTop=0; }

/* Jeder Abschnitt für sich. Vorher konnte eine Ausnahme in renderRail()
   renderMain() verhindern — die Seite blieb dann auf „Lädt…" stehen und
   sagte nicht, warum. Ein sichtbarer Fehler ist besser als eine leere Seite. */
function render(){
  var broken=[];
  [["Auswahl",renderViewSelect],["Seitenleiste",renderRail],["Content",renderMain],
   ["Bezüge",renderAside],["Bereiche",renderPanes]].forEach(function(t){
    try{ t[1](); }catch(x){ broken.push(t[0]+": "+(x&&x.message||x)); }
  });
  if(broken.length){
    try{
      var v=document.getElementById("view");
      if(v) v.insertBefore(el("div",{class:"banner",text:"Anzeigefehler — "+broken.join(" · ")}),v.firstChild);
      if(window.console) console.error("Nebelwacht:",broken);
    }catch(y){}
  }
}
function renderPanes(){
  var narrow=window.matchMedia("(max-width:900px)").matches;
  ["rail","main","aside"].forEach(function(p){
    var n=document.getElementById(p); if(!n)return;
    if(narrow){ n.classList.toggle("on",UI.pane===p); n.style.display=(UI.pane===p)?"":"none"; }
    else { n.classList.remove("on"); n.style.display=""; }
  });
  Array.prototype.forEach.call(document.querySelectorAll("#mob button"),function(b){
    b.setAttribute("aria-current",String(b.dataset.p===UI.pane)); });
}

/* ---------- left rail ---------- */
function renderRail(){

    var i=(e.interfaces&&e.interfaces[0])||"—"; counts[i]=(counts[i]||0)+1;
    (e.tags||[]).forEach(function(t){tags[t]=(tags[t]||0)+1;});

    onclick:function(){UI.iface="";go({k:"list"});}},[el("b",{text:"All articles"}),el("em",{text:String(ENT.size)})]));

/* ---------- main ---------- */
function renderMain(){
  var v=document.getElementById("view"); v.textContent="";
  if(UI.err) v.appendChild(el("div",{class:"banner",text:UI.err}));
  if(!ready){ v.appendChild(el("div",{class:"empty",text:"Loading…"})); return; }
  if(UI.route.k==="art"){ renderArticle(v,UI.route.id); return; }
  if(UI.route.k==="reg"){ renderRegistry(v); return; }
  if(UI.route.k==="graph"){ renderGraph(v); return; }
  renderList(v);
}

function matches(e){
  if(UI.offen && !checkArticle(e).length) return false;
  if(UI.iface && (e.interfaces||[]).indexOf(UI.iface)<0) return false;
  if(UI.tag && (e.tags||[]).indexOf(UI.tag)<0) return false;
  if(UI.q){
    var hay=(nameOf(e)+" "+(e.tags||[]).join(" ")+" "+
      (e.blocks||[]).map(function(b){return b.body;}).join(" ")+" "+
      JSON.stringify(e.components||{})).toLowerCase();
    if(hay.indexOf(UI.q.toLowerCase())<0) return false;
  }
  return true;
}
function summary(e){
  var d=e.components&&e.components.Description&&e.components.Description.raw;
  if(d)return d;
  var b=(e.blocks||[]).filter(function(x){return x.blockType!=="secret";})[0];
  return b?b.body:"";
}

function renderList(v){
  var list=byName().filter(matches);
  var head=el("div",{class:"listhead"});
  head.appendChild(el("h2",{text:UI.iface?(REG.interfaces[UI.iface]&&REG.interfaces[UI.iface].label||UI.iface):"All articles"}));
  head.appendChild(el("span",{class:"count",text:list.length+" of "+ENT.size}));
  if(UI.tag) head.appendChild(el("span",{class:"pill",text:"#"+UI.tag}));
  v.appendChild(head);

  if(!list.length){ v.appendChild(el("div",{class:"empty",text:"Nichts gefunden."})); return; }

  var vw=viewDef();
  var rows=el("div",{class:"rows"});
  list.forEach(function(e){
    var row=el("button",{class:"row",type:"button",onclick:function(){go({k:"art",id:e.id});}});
    var t=el("div",{class:"rt"});
    t.appendChild(el("span",{class:"rn",text:nameOf(e)}));
    t.appendChild(el("span",{class:"pill",text:ifaceName(e)}));
    var st=e.components&&e.components.Status&&e.components.Status.value;
    if(st) t.appendChild(el("span",{class:"pill q",text:st}));
    (e.tags||[]).slice(0,3).forEach(function(tg){ t.appendChild(el("span",{class:"pill q",text:"#"+tg})); });
    var pr=checkArticle(e);
    if(pr.length) t.appendChild(el("span",{class:"warn",title:pr.map(function(x){return x.t;}).join("\n"),
      text:"\u25cf "+pr.length}));
    row.appendChild(t);
    if(vw.image){
      var b=e.components&&e.components.Image&&e.components.Image.url;
      if(b) row.appendChild(el("img",{class:"thumb",src:b,alt:"",loading:"lazy"}));
    }
    if(vw.description!==false&&summary(e))
      row.appendChild(el("div",{class:"rs",text:String(summary(e)).replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g,"$1").slice(0,220)}));
    rows.appendChild(row);

  v.appendChild(rows);
}

/* ---------- article ---------- */
function renderArticle(v,id){
  var e=ENT.get(id);
  if(!e){ v.appendChild(el("div",{class:"empty",text:"Article not found."})); return; }
  var ifn=(e.interfaces||[])[0]||"", d=REG.interfaces[ifn], vw=viewDef();

  var head=el("div",{class:"arthead"});
  var kick=el("div",{class:"kicker"});
  kick.appendChild(el("span",{class:"pill",text:ifaceName(e)}));
  var st=e.components&&e.components.Status&&e.components.Status.value;
  if(st) kick.appendChild(el("span",{class:"pill q",text:st}));
  (e.tags||[]).forEach(function(t){ kick.appendChild(el("button",{class:"tag",type:"button",
    onclick:function(){UI.tag=t;UI.iface="";go({k:"list"});}},"#"+t)); });
  head.appendChild(kick);
  head.appendChild(el("h2",{text:nameOf(e)}));
  var ik=e.components&&e.components.Identity&&e.components.Identity.key;
  if(ik) head.appendChild(el("div",{class:"key",text:ik}));
  v.appendChild(head);

  var bar=el("div",{class:"rowbtns"});
  if(me.write){
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){editEntity(e);}},"Edit"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){addBlock(e);}},"+ Block"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){addRelation(e);}},"+ Relation"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){addAdhoc(e);}},"+ Custom field"));
    bar.appendChild(el("button",{class:"btn sm dngr gh",type:"button",onclick:function(){
      confirmDialog("Delete “"+nameOf(e)+"” for good?",function(){
        drop(e.id); go({k:"list"}); });}},"Delete"));
  }
  v.appendChild(bar);

  /* Was die Validierung beanstanden würde — hier, wo es zu beheben ist. */
  var problems=checkArticle(e);
  if(problems.length){
    var box=el("div",{class:"pruef"});
    box.appendChild(el("div",{class:"pruefkopf",text:problems.length===1?"One open issue":problems.length+" open issues"}));
    var ul=el("ul");
    problems.forEach(function(p){ ul.appendChild(el("li",{text:p.t})); });
    box.appendChild(ul);
    v.appendChild(box);
  }

  /* image — the Bild facet leads with it */
  var pic=e.components&&e.components.Image&&e.components.Image.url;
  if(pic&&vw.image) v.appendChild(el("figure",{class:"pic"},[
    el("img",{src:pic,alt:nameOf(e)}),
    (e.components.Image.bu?el("figcaption",{text:e.components.Image.bu}):null)]));

  /* fields — generated from the component schemas (D0: forms from the registry) */
  var flds=el("dl",{class:"fields"}), nf=0;
  compsFor(ifn).forEach(function(cn){
    if(cn==="Name"||cn==="Description"||cn==="Identity"||cn==="Vars"||cn==="Image")return;
    var cd=REG.components[cn]; if(!cd)return;
    var val=(e.components||{})[cn]; if(!val)return;
    var props=(cd.schema&&cd.schema.properties)||{};
    if(!compShown(vw,cn,props))return;
    /* a derived field with `of` rides in its base field's cell: 16 (+3) */
    var attach={};
    Object.keys(props).forEach(function(p){
      var pd=props[p];
      if(pd.derived&&pd.of&&!showField(vw,cn,p)) (attach[pd.of]=attach[pd.of]||[]).push(p);
    });
    Object.keys(props).forEach(function(p){
      var pd=props[p];
      if(!showField(vw,cn,p))return;
      if(pd.derived&&pd.of)return;
      var s=fmtVal(pd, pd.derived?derivedValue(pd,val):val[p]);
      if(s==="")return;
      (attach[p]||[]).forEach(function(dp){
        var dv=fmtVal(props[dp],derivedValue(props[dp],val));
        if(dv!=="") s+=" ("+dv+")";
      });
      var dd=el("dd");
      if(fieldKind(pd)==="color"){
        dd.appendChild(el("span",{class:"swatch",style:"background:"+s}));
        dd.appendChild(document.createTextNode(" "+s));
      } else if(fieldKind(pd)==="link"){
        var ziel=ENT.get(s);
        if(ziel) dd.appendChild(el("button",{class:"ref",type:"button",
          onclick:function(){ go({k:"art",id:ziel.id}); }},nameOf(ziel)));
        else dd.appendChild(el("span",{class:"gone",text:"missing"}));
      } else dd.textContent=s;
      flds.appendChild(el("div",{class:"fld"+(pd.derived?" drv":"")},[
        el("dt",{text:pd.title||p}), dd])); nf++;
    });
  });
  if(vw.fields==="all") (e.adhoc||[]).forEach(function(f){
    if(f.value===""||f.value==null)return;
    flds.appendChild(el("div",{class:"fld adhoc"},[
      el("dt",{text:f.label}),el("dd",{text:String(f.value)})])); nf++;
  });
  if(nf) v.appendChild(flds);

  var desc=e.components&&e.components.Description&&e.components.Description.raw;
  if(desc&&vw.description!==false) v.appendChild(para(fillVars(desc,null,e)));

  /* blocks */
  var blocks=(e.blocks||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
  if(blocks.length){
    var bw=el("div",{class:"blocks"});
    blocks.forEach(function(b){
      if(!showBlock(vw,b.blockType))return;
      var box=el("div",{class:"blk "+b.blockType});
      if(b.blockType!=="paragraph"){
        var blockLabel=el("div",{class:"bl"},[document.createTextNode(b.blockType)]);
        if(me.write) blockLabel.appendChild(el("button",{class:"btn gh sm",type:"button",
          onclick:function(){ confirmDialog("Delete this block?",function(){
            e.blocks=e.blocks.filter(function(x){return x.id!==b.id;}); persist(e); }); }},"×"));
        box.appendChild(blockLabel);
      }
      box.appendChild(para(fillVars(b.body,null,e)));
      bw.appendChild(box);
    });
    if(bw.childNodes.length) v.appendChild(bw);
  }

  /* compounding — composedOf sections resolved from the pool */
  var comp=(e.relations||[]).filter(function(r){ var rd=REG.relations[r.type]; return rd&&rd.section; });
  if(comp.length&&vw.composed!==false){
    var groups={};
    comp.forEach(function(r){ var s=REG.relations[r.type].section; (groups[s]=groups[s]||[]).push(r); });
    Object.keys(groups).forEach(function(sec){
      v.appendChild(el("div",{class:"sec",text:sec}));
      groups[sec].forEach(function(r){
        var t=ENT.get(r.to);
        var box=el("div",{class:"comp"});
        if(!t){ box.appendChild(el("div",{class:"gone",text:"Fehlender Bezug ("+r.to+")"})); v.appendChild(box); return; }
        var tn=el("div",{class:"cn"});
        tn.appendChild(el("button",{class:"ref",type:"button",onclick:function(){go({k:"art",id:t.id});}},
          (r.props&&r.props.vars&&r.props.vars.NAME)||nameOf(t)));
        box.appendChild(tn);
        var body=(t.components&&t.components.Description&&t.components.Description.raw)||
                 ((t.blocks||[])[0]&&t.blocks[0].body)||"";
        // Reihenfolge nach REQ-174: Bindung an der Kante → der *nutzende*
        // Artikel → Kampagnenregister. Der Statblock trägt DC=12, nicht die
        // Regel — gegen die Regel aufzulösen lässt {DC} stehen.
        box.appendChild(para(fillVars(body,(r.props&&r.props.vars)||null,e),"cb"));
        var vb=(r.props&&r.props.vars)||{}, ks=Object.keys(vb);
        if(ks.length&&vw.bindings)
          box.appendChild(el("span",{class:"bind",text:ks.map(function(k){return k+"="+vb[k];}).join("  ·  ")}));
        v.appendChild(box);
      });
    });
  }
}

      if(b.rel.props&&b.rel.props.note) rv.appendChild(el("span",{class:"bind",text:b.rel.props.note}));
      row.appendChild(rv); bx.appendChild(row);
    });
    a.appendChild(bx);
  }
}

/* Der Baum links, die gewählte Schnittstelle rechts. */
function regIfaceEditor(v){
  var namen=Object.keys(REG.interfaces);
  if(!namen.length){
    v.appendChild(el("div",{class:"empty",text:"No interfaces yet."}));
    if(me.write) v.appendChild(newInterfaceBar(""));
    return;
  }
  if(!REG.interfaces[UI.regiface]) UI.regiface=ifaceRoots()[0]||namen.sort()[0];

  var grid=el("div",{class:"reg2"});
  var tree=el("div",{class:"regtree"});
  (function walk(list,depth){
    list.forEach(function(n){
      var d=REG.interfaces[n], c=countIface(n);
      var b=el("button",{type:"button","aria-current":String(UI.regiface===n),
        style:"padding-left:"+(7+depth*13)+"px",
        onclick:function(){ UI.regiface=n; UI.regcomp=""; UI.regprop=""; render(); }});
      if(c) b.appendChild(el("em",{text:String(c)}));
      b.appendChild(el("span",{class:d.abstract?"ab":"",text:d.label||n}));
      tree.appendChild(b);
      walk(kindsOf(n),depth+1);
    });
  })(ifaceRoots(),0);
  grid.appendChild(tree);
  grid.appendChild(regIfaceBody(UI.regiface));
  v.appendChild(grid);
  if(me.write) v.appendChild(newInterfaceBar(""));
}

function newInterfaceBar(unter){

function regIfaceBody(ifn){
  var d=REG.interfaces[ifn], w=me.write;
  var box=el("div",{class:"regbody"});
  function save(){ saveReg("interfaces"); render(); }
  function saveC(){ saveReg("components"); render(); }
  function setMode(cn,mode){
    d.requires=(d.requires||[]).filter(function(x){return x!==cn;});
    d.allows=(d.allows||[]).filter(function(x){return x!==cn;});
    if(mode==="requires") d.requires.push(cn);
    else if(mode==="allows") d.allows.push(cn);
  }

  /* ---- Kopf ---- */
  box.appendChild(el("h3",{text:d.label||ifn}));
  var count=countIface(ifn);
  box.appendChild(el("div",{class:"key",
    text:ifn+" · "+(count?count+(count===1?" articles":" articles"):"no articles")}));

  var head=el("div",{class:"fmore",style:"border-bottom:0;padding-top:10px"});
  var labelInput=el("input",{class:"i",type:"text",value:d.label||""});
  if(!w) labelInput.disabled=true;
  labelInput.addEventListener("change",function(){ d.label=labelInput.value.trim()||ifn; save(); });
  head.appendChild(field("Label",labelInput));

  var parentSel=el("select",{class:"i"}); if(!w) parentSel.disabled=true;
  parentSel.appendChild(el("option",{value:""},"— none —"));
  Object.keys(REG.interfaces).sort().forEach(function(n){
    if(n===ifn||wouldCycle(ifn,n))return;
    parentSel.appendChild(el("option",{value:n},REG.interfaces[n].label||n)); });
  parentSel.value=parentOf(ifn);
  parentSel.addEventListener("change",function(){
    if(parentSel.value) d.extends=[parentSel.value]; else delete d.extends;
    save(); });
  head.appendChild(field("Extends",parentSel));

  var ab=el("select",{class:"i"}); if(!w) ab.disabled=true;
  ab.appendChild(el("option",{value:""},"instantiable"));
  ab.appendChild(el("option",{value:"1"},"abstract only"));

  function fieldMore(cn,k){

    var keyInput=el("input",{class:"i",type:"text",value:k});

      saveC(); });
    box.appendChild(field("Required field",req));

    var fm=el("select",{class:"i"}); if(!w) fm.disabled=true;

    if(fieldKind(p)==="choice") text("Choices (comma separated)",(p["enum"]||[]).join(", "),function(v){

    text("Derived from",p.derived||"",function(v){
      if(v)p.derived=v; else delete p.derived;
    },"10+mod(wis)");

    text("belongs to field",p.of||"",function(v){
      if(v)p.of=v; else delete p.of;
    },"wis");

    if(p.derived) box.appendChild(el("p",{class:"hint",style:"grid-column:1/-1;margin:0",
      text:"Derived fields are computed on read and never stored. They get no input."}));
    return box;
  }
}

/* ---------- renaming a field key ----------
   Five places know a field key: the schema, the component's `required` list,
   the `derived` / `of` references of its siblings, the `fields` list of every
   view, and the stored value in every article that carries the component.
   Missing any one of them loses data quietly — the value stays under the old
   key, where nothing reads it any more. */
function renameProperty(cn,oldKey,newKey){
  var cd=REG.components[cn]; if(!cd||!cd.schema)return;
  var props=cd.schema.properties||{};
  if(!props[oldKey]||props[newKey])return;

  /* Die Reihenfolge der Felder ist Absicht — neu aufbauen statt anhängen. */
  var neu={};
  Object.keys(props).forEach(function(k){ neu[k===oldKey?newKey:k]=props[k]; });
  cd.schema.properties=neu;

  if(Array.isArray(cd.schema.required)){
    cd.schema.required=cd.schema.required.map(function(x){ return x===oldKey?newKey:x; });
  }
  var karte={}; karte[oldKey]=newKey;
  Object.keys(neu).forEach(function(k){
    var pd=neu[k];
    if(pd.of===oldKey) pd.of=newKey;
    if(pd.derived) pd.derived=String(pd.derived).replace(
      /[A-Za-z_][A-Za-z0-9_]*/g,function(word){ return karte[word]||word; });
  });

  var alterVerweis=cn+"."+oldKey, neuerVerweis=cn+"."+newKey;
  var viewsTouched=false;
  Object.keys(REG.views).forEach(function(vn){
    var f=REG.views[vn].fields;
    if(!Array.isArray(f))return;
    var vorher=f.join("\u0000");
    REG.views[vn].fields=f.map(function(x){ return x===alterVerweis?neuerVerweis:x; });
    if(REG.views[vn].fields.join("\u0000")!==vorher) viewsTouched=true;
  });

  var betroffen=[];
  ENT.forEach(function(e){
    var card=(e.components||{})[cn];
    if(!card||!Object.prototype.hasOwnProperty.call(card,oldKey))return;
    var neuCard={};
    Object.keys(card).forEach(function(k){ neuCard[k===oldKey?newKey:k]=card[k]; });
    e.components[cn]=neuCard;
    betroffen.push(e);
  });

  UI.regprop=cn+"."+newKey;
  saveReg("components");
  if(viewsTouched) saveReg("views");
  betroffen.forEach(function(e){ persist(e); });
  UI.err=betroffen.length
    ? "Field renamed; "+betroffen.length+(betroffen.length===1?" article":" articles")+" rewritten."
    : "Field renamed.";
  render();
}

/* ---------- target constraint for a link field ---------- */
function targetEditor(p,save,writable){
  p.target=p.target||{};
  var t=p.target;
  var box=el("div",{class:"tgt"});
  box.appendChild(el("div",{class:"tt",text:"May point at"}));

  var ifs=el("select",{class:"i",multiple:"multiple",size:"4"});
  if(!writable) ifs.disabled=true;
  Object.keys(REG.interfaces).sort().forEach(function(n){
    var o=el("option",{value:n},REG.interfaces[n].label||n);
    if((t.interfaces||[]).indexOf(n)>=0) o.selected=true;
    ifs.appendChild(o);
  });
  ifs.addEventListener("change",function(){
    var picked=Array.prototype.filter.call(ifs.options,function(o){return o.selected;})
      .map(function(o){return o.value;});
    if(picked.length) t.interfaces=picked; else delete t.interfaces;
    save();
  });
  box.appendChild(field("Interfaces (subtypes included)",ifs));

  var tagBox=el("input",{class:"i",type:"text",value:(t.tags||[]).join(", "),
    placeholder:"any of these"});
  if(!writable) tagBox.disabled=true;
  tagBox.addEventListener("change",function(){
    var xs=tagBox.value.split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(xs.length) t.tags=xs; else delete t.tags;
    save();
  });
  box.appendChild(field("Tags",tagBox));

  var wo=t.where||{};
  var feldBox=el("input",{class:"i",type:"text",
    value:wo.component?wo.component+"."+(wo.property||""):"",
    placeholder:"ItemInfo.rarity"});
  var wertBox=el("input",{class:"i",type:"text",value:wo.value==null?"":String(wo.value),
    placeholder:"rare"});
  if(!writable){ feldBox.disabled=true; wertBox.disabled=true; }
  function saveWhere(){
    var teile=feldBox.value.trim().split(".");
    if(teile.length===2&&teile[0]&&teile[1]){
      t.where={component:teile[0],property:teile[1],value:wertBox.value};
    } else delete t.where;
    save();
  }
  feldBox.addEventListener("change",saveWhere);
  wertBox.addEventListener("change",saveWhere);
  box.appendChild(field("Field equals",feldBox));
  box.appendChild(field("…this value",wertBox));

  var n=linkCandidates(t,"",9999).length;
  box.appendChild(el("p",{class:"hint",style:"grid-column:1/-1;margin:0",
    text:n+(n===1?" article matches":" articles match")+
      " right now. Leave everything empty to allow any article."}));
  return box;
}

/* Kein window.confirm: die Seite läuft in einem sandboxed iframe, und ohne

/* edit entity: name, tags, and every component field from the schema */
function editEntity(e){
  dialog("Edit",function(host,close){
    var ifn=(e.interfaces||[])[0]||"";
    var nm=el("input",{class:"i",type:"text",value:nameOf(e)});
    host.appendChild(field("Name",nm));
    var tg=el("input",{class:"i",type:"text",value:(e.tags||[]).join(", "),placeholder:"comma, separated"});
    host.appendChild(field("Tags",tg));

    var inputs=[], drvCells=[];
    function readInput(it){
      var raw=it.node.value;
      if(raw==="")return undefined;
      if(it.pd.type==="number"||it.pd.type==="integer")return Number(raw);
      if(it.pd.type==="array")return raw.split(",").map(function(s){return s.trim();}).filter(Boolean);
      if(it.pd.type==="object"){ try{return JSON.parse(raw);}catch(x){return undefined;} }
      return raw;
    }
    function recalc(){
      var live={};
      inputs.forEach(function(it){
        if(it.adhoc!==undefined)return;
        live[it.cn]=live[it.cn]||{};
        var v=readInput(it); if(v!==undefined) live[it.cn][it.p]=v;
      });
      drvCells.forEach(function(c){
        c.node.textContent=fmtVal(c.pd,derivedValue(c.pd,live[c.cn]||{}))||"—";
      });
    }
    compsFor(ifn).forEach(function(cn){
      var cd=REG.components[cn]; if(!cd)return;
      var props=(cd.schema&&cd.schema.properties)||{};
      var keys=Object.keys(props).filter(function(p){return !(cn==="Name"&&p==="text");});
      if(!keys.length)return;
      host.appendChild(el("div",{class:"dgrp",text:cd.label||cn}));
      keys.forEach(function(p){
        var pd=props[p], cur=((e.components||{})[cn]||{})[p];
        if(pd.derived){
          var b=el("b",{class:"drvval",text:"—"});
          host.appendChild(el("div",{class:"drvrow"},[
            el("span",{text:(pd.title||p)+" "}), b,
            el("span",{class:"drvexp",text:pd.derived})]));
          drvCells.push({cn:cn,p:p,pd:pd,node:b});
          return;
        }
        var node, kind=fieldKind(pd);
        if(kind==="color"){
          node=el("input",{class:"i",type:"color",value:/^#[0-9a-fA-F]{6}$/.test(String(cur||""))?String(cur):"#888888"});
        } else if(kind==="link"){
          node=linkInput(pd,cur);
        } else if(pd.enum){
          node=el("select",{class:"i"});
          node.appendChild(el("option",{value:""},"—"));
          pd.enum.forEach(function(o){ node.appendChild(el("option",{value:o},o)); });
          node.value=cur==null?"":String(cur);
        } else if(pd.type==="number"||pd.type==="integer"){
          node=el("input",{class:"i",type:"number",value:cur==null?"":String(cur)});
        } else if(pd.format==="long"){
          node=el("textarea",{class:"i"}); node.value=cur==null?"":String(cur);
        } else if(pd.type==="array"){
          node=el("input",{class:"i",type:"text",value:Array.isArray(cur)?cur.join(", "):""});
        } else if(pd.type==="object"){
          node=el("textarea",{class:"i code"}); node.value=JSON.stringify(cur||{},null,1);
        } else {
          node=el("input",{class:"i",type:"text",value:cur==null?"":String(cur)});
        }
        host.appendChild(field(pd.title||p,node));
        node.addEventListener("input",recalc);
        inputs.push({cn:cn,p:p,pd:pd,node:node});
      });
    });

    (e.adhoc||[]).forEach(function(f,i){
      var node=el("input",{class:"i",type:"text",value:f.value==null?"":String(f.value)});
      host.appendChild(field("Eigenes · "+f.label,node));
      inputs.push({adhoc:i,node:node});
    });
    recalc();

    actions(host,close,function(){
      e.name=nm.value.trim()||e.name;
      e.tags=tg.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
      e.components=e.components||{};
      e.components.Name={text:e.name};
      inputs.forEach(function(it){
        if(it.adhoc!==undefined){ e.adhoc[it.adhoc].value=it.node.value; return; }
        var val=readInput(it);
        e.components[it.cn]=e.components[it.cn]||{};
        if(val===undefined) delete e.components[it.cn][it.p]; else e.components[it.cn][it.p]=val;
      });
      persist(e);
    });
  });
}

/* ============================================================
   Obsidian-Import. Dieselben Regeln wie @nw/import im Repo,
   dort gegen echte Vault-Dateien getestet:
   - Schlüssel case-insensitiv (der Vault schreibt Rarität, aber
     rüstungsklasse — Dataview kleinschreibt Eigenschaften)
   - U+2212 MINUS in Attributtabellen, kein Bindestrich
   - Eintragstexte laufen über mehrere >-Zeilen weiter
   - cr kann ein Bruch sein (1/8), also Text, keine Zahl
   - „—"", not "—"
   ============================================================ */

function parseFM(text){
  var src=String(text||"").replace(/^﻿/,"");
  var m=/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(src);
  if(!m) return {raw:{},index:{},body:src};
  var raw={},cur=null;
  (m[1]||"").split(/\r?\n/).forEach(function(line){
    var li=/^\s*-\s+(.*)$/.exec(line);
    if(li&&cur){ if(!Array.isArray(raw[cur]))raw[cur]=[]; raw[cur].push(unquote(li[1])); return; }
    var kv=/^([^\s:][^:]*):\s*(.*)$/.exec(line);
    if(!kv)return;
    cur=kv[1].trim();
    var v=unquote(kv[2]);
    raw[cur]= v===""?[]:v;
  });
  Object.keys(raw).forEach(function(k){ if(Array.isArray(raw[k])&&!raw[k].length) raw[k]=""; });
  var index={}; Object.keys(raw).forEach(function(k){ index[k.toLowerCase()]=k; });
  return {raw:raw,index:index,body:src.slice(m[0].length)};
}
function unquote(v){ var t=String(v||"").trim();
  return (t.length>=2&&/^(".*"|'.*')$/.test(t))?t.slice(1,-1):t; }
function fmStr(fm,k){ var o=fm.index[String(k).toLowerCase()]; if(!o)return "";
  var v=fm.raw[o]; return Array.isArray(v)?v.join(", "):String(v==null?"":v).trim(); }
function fmList(fm,k){ var o=fm.index[String(k).toLowerCase()]; if(!o)return [];
  var v=fm.raw[o]; if(Array.isArray(v))return v.filter(function(x){return x!=="";});
  var s=String(v==null?"":v).trim(); return s?[s]:[]; }
function fmNum(fm,k){ var t=fmStr(fm,k); if(t==="")return undefined;
  var n=Number(t.replace(/[^\d.,-]/g,"").replace(",",".")); return isFinite(n)?n:undefined; }
function linkZiel(raw){ var m=/\[\[([^\]]+)\]\]/.exec(String(raw||""));
  var t=m?m[1]:String(raw||""); return (t.split("|")[0]||"").split("#")[0].trim(); }
function stripDataview(b){ return String(b||"")
  .replace(/#+\s*Inventar\s*\r?\n+```dataviewjs[\s\S]*?```/gi,"")
  .replace(/```dataviewjs[\s\S]*?```/gi,"").trim(); }
function sinnvoll(v){ var t=String(v||"").trim(); return t!==""&&!/^[—–-]+$/.test(t); }

/* welche Art Datei ist das? */
/* Die Vault-Werte links bleiben deutsch — sie stehen so in den Notizen.
   Zurück kommt die Sorte, unter der der Import sie führt. */
function erkenne(text){
  var fm=parseFM(text);
  if(fmStr(fm,"typ").toLowerCase()==="statblock") return "statblock";
  if(fmStr(fm,"Gegenstandstyp")) return "item";
  var t=fmStr(fm,"typ").toLowerCase();
  if(["siedlung","region","kontinent","ort","gebäude","raum"].indexOf(t)>=0) return "place";
  return null;
}

var IF_TYP={waffe:"Weapon","ausrüstung":"Armor",ausruestung:"Armor","rüstung":"Armor",
  material:"Material",verbrauchsgut:"Consumable"};

function impGegenstand(text,datei){
  var fm=parseFM(text), name=datei.replace(/\.md$/i,"").trim();
  var typ=fmStr(fm,"Gegenstandstyp").toLowerCase(), ifn=IF_TYP[typ]||"Item";
  var body=stripDataview(fm.body), bilder=[];
  (body.match(/!\[\[[^\]|#]+\.(?:png|jpe?g|webp|gif)(?:\|[^\]]*)?\]\]/gi)||[]).forEach(function(x){
    bilder.push(linkZiel(x)); });

  var c={ Name:{text:name},
    Identity:{key:slug(ifn)+"/"+slug(name),aliases:fmList(fm,"aliases")},
    Status:{value:"used"},
    RawContent:{raw:text,format:"obsidian",importedAt:new Date().toISOString().slice(0,10)} };

  var info={}, r=fmStr(fm,"Rarität"), kr=fmStr(fm,"Kaufrarität"),
      kp=fmNum(fm,"Kupferpreis"), st=fmNum(fm,"Stapelgrösse");
  if(fmStr(fm,"Gegenstandstyp")) info.itemType=fmStr(fm,"Gegenstandstyp");
  if(r&&r!=="-") info.rarity=r;            // „-" heisst: kein magischer Gegenstand
  if(kr&&kr!=="-") info.availability=kr;     // andere Skala als raritaet
  if(kp!==undefined) info.copperPrice=kp;
  if(st!==undefined) info.stackSize=st;
  if(Object.keys(info).length) c.ItemInfo=info;

  var rows=fmList(fm,"Formfaktor"); if(rows.length) c.Footprint={rows:rows};
  if(ifn==="Weapon"){ var w={};
    if(fmStr(fm,"Schaden"))w.damage=fmStr(fm,"Schaden");
    if(fmStr(fm,"Schadenstyp"))w.damageType=fmStr(fm,"Schadenstyp");
    if(fmStr(fm,"Reichweite"))w.range=fmStr(fm,"Reichweite");
    if(Object.keys(w).length)c.WeaponInfo=w; }
  if(ifn==="Armor"){ var ru={}, rk=fmNum(fm,"rüstungsklasse");
    if(rk!==undefined)ru.ac=rk;
    if(fmStr(fm,"rüstungstyp"))ru.armorType=fmStr(fm,"rüstungstyp");
    if(Object.keys(ru).length)c.ArmorInfo=ru; }
  if(ifn==="Material"){ var ma={};
    if(fmStr(fm,"Materialtyp"))ma.materialType=fmStr(fm,"Materialtyp");
    var be=fmList(fm,"Berufe"); if(be.length)ma.trades=be;
    if(Object.keys(ma).length)c.MaterialInfo=ma; }
  if(bilder[0]) c.Image={url:bilder[0],caption:""};

  var prosa=body.replace(/!\[\[[^\]]+\]\]/g,"").replace(/^#+\s*Eigenschaften[\s\S]*$/im,"").trim();
  var bl=[]; if(prosa) bl.push({id:uid("b"),blockType:"paragraph",body:prosa,order:0});

  var unresolved=[];
  fmList(fm,"Eigenschaften").forEach(function(x){
    var z=linkZiel(x); if(z) unresolved.push({type:"hasProperty",target:z}); });

  return { e:{ id:uid("g"), interfaces:[ifn], name:name,
      tags:fmList(fm,"tags").filter(function(t){return t!=="gegenstand";}),
      components:c, adhoc:[], blocks:bl, relations:[], createdAt:new Date().toISOString() },
    unresolved:unresolved, bilder:bilder };
}

/* Links steht, wie der Vault die Zeile beschriftet — rechts, wie das Feld im
   Register heisst. Nur die rechte Seite ist englisch geworden; die linke zu
   übersetzen hiesse, die Notizen nicht mehr zu erkennen. */
var SB_LABEL={"rüstungsklasse":"_skip","trefferpunkte":"_skip","geschwindigkeit":"speed",
  "saving throws":"saves",skills:"skills","damage resistances":"resistances",
  immunities:"immunities",vulnerabilities:"vulnerabilities",senses:"senses",
  languages:"languages","proficiency bonus":"prof"};
var ATTR=["str","dex","con","int","wis","cha"];

function impStatblock(text,datei){
  var fm=parseFM(text), name=fmStr(fm,"name")||datei.replace(/\.md$/i,"").trim();
  var zeilen=String(fm.body).replace(/−/g,"-").split(/\r?\n/)
    .filter(function(l){return l.trimStart().indexOf(">")===0;})
    .map(function(l){return l.replace(/^\s*>\s?/,"");});

  var info={system:"dnd5e-2014"}, g=fmStr(fm,"grösse");
  if(g){ var p=/^([^(]+?)\s*(?:\(([^)]*)\))?$/.exec(g.trim());
    if(p&&p[1])info.size=p[1].trim(); if(p&&p[2])info.kind=p[2].trim(); }
  if(fmStr(fm,"ausrichtung"))info.alignment=fmStr(fm,"ausrichtung");
  if(fmStr(fm,"cr"))info.cr=fmStr(fm,"cr");            // kann 1/8 sein
  if(fmStr(fm,"rolle"))info.combatRole=fmStr(fm,"rolle");
  var ac=fmStr(fm,"ac");
  if(ac){ var an=/(-?\d+)/.exec(ac); if(an)info.ac=Number(an[1]);
    var aq=/\(([^)]*)\)/.exec(ac); if(aq)info.acNote=aq[1].trim(); }
  var tp=fmNum(fm,"leben"); if(tp!==undefined)info.hp=tp;
  if(fmStr(fm,"lebenswürfel"))info.hpFormula=fmStr(fm,"lebenswürfel");
  var sp=fmList(fm,"geschwindigkeit"); if(sp.length)info.speed=sp.join(", ");

  zeilen.forEach(function(l){
    var m=/^\*\*([^*]+?):?\*\*\s*(.*)$/.exec(l); if(!m)return;   // Doppelpunkt erlaubt
    var k=SB_LABEL[m[1].trim().toLowerCase()], v=m[2].trim();
    if(!k||k==="_skip"||!sinnvoll(v))return;
    if(k==="prof"){ var n=Number(v.replace("+","")); if(isFinite(n))info.prof=n; return; }
    if(k==="speed"&&info.speed)return;
    info[k]=v;
  });

  var hi=-1; zeilen.forEach(function(l,i){ if(hi<0&&/^\|\s*STR\s*\|/i.test(l))hi=i; });
  if(hi>=0){ for(var i=hi+1;i<zeilen.length;i++){ var l=zeilen[i];
      if(!/^\|/.test(l))continue; if(/^\|\s*-/.test(l))continue;
      var cells=l.split("|").slice(1,-1).map(function(c){return c.trim();});
      ATTR.forEach(function(a,j){ var s=/(-?\d+)/.exec(cells[j]||""); if(s)info[a]=Number(s[1]); });
      break; } }

  var abschnitte=[],akt=null,eintrag=null;
  function schliess(){ if(akt&&eintrag&&eintrag.name){ eintrag.text=eintrag.text.trim();
      akt.eintraege.push(eintrag); } eintrag=null; }
  zeilen.forEach(function(l){
    var h=/^#+\s*(.+?)\s*$/.exec(l);
    if(h){ schliess(); if(akt)abschnitte.push(akt); akt={name:h[1].trim(),eintraege:[]}; return; }
    if(!akt)return;
    var s=/^\*\*([^*]+?)\.?\*\*\s*(.*)$/.exec(l);
    if(s){ schliess(); eintrag={name:s[1].trim(),text:s[2].trim()}; return; }
    if(eintrag){ if(!l.trim()||/^-{3,}$/.test(l.trim()))return; eintrag.text+=" "+l.trim(); }
  });
  schliess(); if(akt)abschnitte.push(akt);

  return { e:{ id:uid("sb"), interfaces:["Statblock"], name:name, tags:[],
      components:{ Name:{text:name},
        Identity:{key:"statblock/"+slug(name),aliases:fmList(fm,"aliases")},
        Status:{value:"used"}, StatblockInfo:info,
        RawContent:{raw:text,format:"obsidian",importedAt:new Date().toISOString().slice(0,10)} },
      adhoc:[], blocks:[], relations:[], createdAt:new Date().toISOString() },
    abschnitte:abschnitte, kreatur:linkZiel(fmStr(fm,"kreatur"))||null };
}

function impOrt(text,datei){
  var fm=parseFM(text), name=datei.replace(/\.md$/i,"").trim();
  // Der leaflet-Block bleibt unangetastet: er wird später die Kartenansicht.
  // Hier nur aus der Prosa genommen, im RawContent liegt er unverändert.
  var body=String(fm.body)
    .replace(/```leaflet[\s\S]*?```/gi,"")
    .replace(new RegExp("^#\\s*"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*$","im"),"")
    .trim();

  var enthaelt=[];
  (body.match(/!\[\[[^\]]+\]\]/g)||[]).forEach(function(x){
    var z=linkZiel(x); if(z&&!/\.(png|jpe?g|webp|gif)$/i.test(z)) enthaelt.push(z); });
  var li={}; if(fmStr(fm,"typ"))li.kind=fmStr(fm,"typ");
  if(fmStr(fm,"biom"))li.umwelt=fmStr(fm,"biom");
  if(fmStr(fm,"siedlungstyp"))li.siedlungstyp=fmStr(fm,"siedlungstyp");

  var c={ Name:{text:name},
    Identity:{key:"ort/"+slug(name),aliases:fmList(fm,"aliases")},
    Status:{value:"used"}, LocationInfo:li,
    RawContent:{raw:text,format:"obsidian",importedAt:new Date().toISOString().slice(0,10)} };

  var prosa=body.replace(/!\[\[[^\]]+\]\]/g,"").replace(/^#+\s.*$/gm,"").trim();
  var bl=[]; if(prosa) bl.push({id:uid("b"),blockType:"paragraph",body:prosa,order:0});

  return { e:{ id:uid("o"), interfaces:["Place"], name:name, tags:fmList(fm,"tags"),
      components:c, adhoc:[], blocks:bl, relations:[], createdAt:new Date().toISOString() },
    unresolved:enthaelt.map(function(z){return {type:"contains",target:z};}) };
}

/* ---------- Stapelimport: Verweise innerhalb des Stapels auflösen ---------- */
function runImport(files){
  var result={item:[],statblock:[],place:[],rules:[],unresolved:[],unknown:[],images:[]};
  var roh=[];
  files.forEach(function(f){
    var kind=erkenne(f.text);
    if(!kind){ result.unknown.push(f.name); return; }
    if(kind==="item"){ var g=impGegenstand(f.text,f.name); roh.push({kind:kind,r:g}); result.item.push(g.e); }
    if(kind==="place"){ var o=impOrt(f.text,f.name); roh.push({kind:kind,r:o}); result.place.push(o.e); }
    if(kind==="statblock"){ var s=impStatblock(f.text,f.name); roh.push({kind:kind,r:s}); result.statblock.push(s.e); }
  });

  /* Abschnittseinträge werden je eine eigene Regel, die der Statblock
     referenziert. Gleicher Name und Text heisst gleiche Regel, keine Kopie. */
  var regelNach={};
  roh.forEach(function(x){ if(x.kind!=="statblock")return;
    x.r.abschnitte.forEach(function(ab){ ab.eintraege.forEach(function(en){
      var k=en.name+"\u0000"+en.text, id=regelNach[k];
      if(!id){ id=uid("r"); regelNach[k]=id;
        var kind=/^bonus/i.test(ab.name)?"bonus":/^reaction/i.test(ab.name)?"reaction"
                :/^(villain|legendary)/i.test(ab.name)?"legendary":/^action/i.test(ab.name)?"action":"trait";
        result.rules.push({ id:id, interfaces:["Rule"], name:en.name, tags:[],
          components:{ Name:{text:en.name}, Identity:{key:"regel/"+slug(en.name),aliases:[]},
            Status:{value:"used"}, RuleInfo:{kind:kind}, Description:{raw:en.text} },
          adhoc:[], blocks:[], relations:[], createdAt:new Date().toISOString() }); }
      x.r.e.relations.push({id:uid("rel"),type:"composedOf",to:id,props:{section:ab.name}});
    });});
  });

  var alle=result.item.concat(result.place,result.statblock,result.rules);
  var nachName={};
  ENT.forEach(function(e){ if((e.interfaces||[])[0]!=="Statblock") nachName[nameOf(e).toLowerCase()]=e.id;
    ((e.components&&e.components.Identity&&e.components.Identity.aliases)||[]).forEach(function(a){
      nachName[String(a).toLowerCase()]=e.id; }); });
  alle.forEach(function(e){ if((e.interfaces||[])[0]==="Statblock")return;
    nachName[e.name.toLowerCase()]=e.id;
    ((e.components.Identity&&e.components.Identity.aliases)||[]).forEach(function(a){
      nachName[String(a).toLowerCase()]=e.id; }); });

  roh.forEach(function(x){
    if(x.kind==="item"){ (x.r.unresolved||[]).forEach(function(v){
      var id=nachName[v.target.toLowerCase()];
      if(id) x.r.e.relations.push({id:uid("rel"),type:v.type,to:id});
      else result.unresolved.push({from:x.r.e.name,kind:v.type,target:v.target}); });
      (x.r.bilder||[]).forEach(function(b){ result.images.push({from:x.r.e.name,datei:b}); }); }

    /* Der Vault drückt die Hierarchie als Transklusion im Elternteil aus:
       ![[Rubinrot]] in Vallehy heisst „Vallehy enthält Rubinrot". Gespeichert
       wird die Kante aber am Kind als teilVon — eine Kante, eine Richtung. */
    if(x.kind==="place"){ (x.r.unresolved||[]).forEach(function(v){
      var id=nachName[v.target.toLowerCase()], kind=null;
      alle.forEach(function(e){ if(e.id===id) kind=e; });
      if(kind) kind.relations.push({id:uid("rel"),type:"partOf",to:x.r.e.id});
      else result.unresolved.push({from:x.r.e.name,kind:"contains",target:v.target}); }); }

    if(x.kind==="statblock"&&x.r.kreatur){
      var id=nachName[x.r.kreatur.toLowerCase()];
      if(id) x.r.e.relations.push({id:uid("rel"),type:"belongsTo",to:id});
      else result.unresolved.push({from:x.r.e.name,kind:"belongs to",target:x.r.kreatur}); }
  });

  result.all=alle;
  return result;
}

function importDialog(){
  dialog("Aus Obsidian importieren",function(host,close){
    host.appendChild(el("p",{class:"hint",text:
      "Markdown-Dateien aus dem Vault wählen. Gegenstände, Statblöcke und Orte "+
      "werden an ihrem Frontmatter erkannt. Verweise innerhalb des Stapels lösen sich "+
      "gegenseitig auf; was offen bleibt, steht danach als toter Verweis da und lässt "+
      "sich mit einem Klick anlegen."}));
    var inp=el("input",{class:"i",type:"file",multiple:"multiple",accept:".md,text/markdown"});
    host.appendChild(field("Dateien",inp));
    var report=el("div",{class:"bericht"});
    host.appendChild(report);
    var erg=null;

    inp.addEventListener("change",function(){
      var fs=Array.prototype.slice.call(inp.files||[]);
      if(!fs.length)return;
      report.textContent="Reading "+fs.length+" file(s)…";
      window.__GELESEN__=fs.map(function(f){return f.name;});
      Promise.all(fs.map(function(f){ return f.text().then(function(t){return {name:f.name,text:t};}); }))
        .then(function(files){
          erg=runImport(files);
          report.textContent="";
          var z=el("ul");
          [["Items",erg.item.length],["Statblocks",erg.statblock.length],
           ["Places",erg.place.length],["Rules from sections",erg.rules.length]]
            .forEach(function(p){ if(p[1]) z.appendChild(el("li",{text:p[1]+" "+p[0]})); });
          report.appendChild(z);
          if(erg.unknown.length) report.appendChild(el("p",{class:"warnzeile",
            text:"Not recognised: "+erg.unknown.join(", ")}));
          if(erg.unresolved.length){
            report.appendChild(el("p",{class:"hint",text:"Unresolved links — clickable afterwards as dead links:"}));
            var ul=el("ul");
            erg.unresolved.slice(0,12).forEach(function(o){
              ul.appendChild(el("li",{text:o.from+" → "+o.kind+" → "+o.target})); });
            if(erg.unresolved.length>12) ul.appendChild(el("li",{text:"… and "+(erg.unresolved.length-12)+" more"}));
            report.appendChild(ul);
          }
          if(erg.images.length) report.appendChild(el("p",{class:"hint",
            text:"Images are named but not transferred: "+
              erg.images.map(function(b){return b.datei;}).join(", ")}));
        })
        .catch(function(x){ report.textContent="Reading failed: "+x.message; });
    });

    actions(host,close,function(){
      if(!erg||!erg.all.length) return false;
      erg.all.forEach(function(e){ ENT.set(e.id,e); });
      render();
      if(db) erg.all.forEach(function(e){ db.doc("entities/"+e.id).set(e).catch(fail); });
      UI.err=erg.all.length+" articles imported.";
      go({k:"list"});
    },"Import");
  });
}

    viewSel.textContent="";

(async function boot(){
  // Beide Fähigkeiten nebeneinander anfordern. Nacheinander hiesse: wenn die
  // eine nicht antwortet, wartet die andere ihre volle Frist mit ab.
  var hat=window.claude&&claude.use;
  var erg=await Promise.all([
    hat?claude.use("db").catch(function(){return null;}):null,
    hat?claude.use("user").catch(function(){return null;}):null
  ]);
  db=erg[0];
  try{ if(erg[1]){ var w=await erg[1].can("data.write"); if(w===false) me.write=false; } }catch(x){}

  if(!db){
    ready=true;
    UI.err="No data store reachable — nothing will be saved. "+
           "A full page reload usually helps.";
    render(); return;
  }

  var TEILE=["interfaces","components","relations","views","vars"];
  var arrived={register:{},artikel:false};

  /* Wirft ein Snapshot-Callback, endet die Zustellung still: `ready` bliebe
     false und die Seite stünde auf „Lädt…". Darum fängt jeder Callback
     seinen eigenen Fehler und sagt, woran es lag. */
  function guarded(was,fn){
    return function(arg){
      try{ fn(arg); }
      catch(x){ ready=true; UI.err=was+": "+((x&&x.message)||x); render(); }
    };
  }

  TEILE.forEach(function(part){
    db.doc("registry/"+part).onSnapshot(guarded("Registry "+part,function(s){
      arrived.register[part]=true;
      REG[part]=thawed(s.exists&&s.data())||REG[part]||{};
      render();
    }),function(e){ UI.err="Registry: "+e.code; render(); });
  });

  db.collection("entities").limit(1000).onSnapshot(guarded("Artikel",function(snap){
    arrived.artikel=true;
    var neu=new Map();
    (snap.docs||[]).forEach(function(d){
      var b=thawed(d.data())||{};
      if(!b.id) b.id=d.id;
      neu.set(b.id,b);
    });
    ENT=neu;
    ready=true;
    UI.err="";   // eine frühere Wachmeldung ist mit den Daten erledigt
    render();
  }),function(e){ UI.err="Articles: "+e.code; ready=true; render(); });

  /* Kommt binnen zehn Sekunden nichts, sagt die Seite, was ausblieb —
     statt schweigend auf „Lädt…" zu stehen. */
  setTimeout(function(){
    if(ready) return;
    ready=true;
    UI.err="No data received: "+Object.keys(arrived.register).length+" of "+
           TEILE.length+" registry parts, "+
           (arrived.artikel?"articles yes":"articles no")+". "+
           "Reload the page fully; if it persists, it is a bug in the page.";
    render();
  },10000);
})();

})();
</script>
