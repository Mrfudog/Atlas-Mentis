/* ---------- Handwerk (REQ-184) ----------
   Ein Rezept ist ein Artikel, und was es verbraucht, steht an `needs`-Kanten
   mit Menge. Die Menge gehört an die Kante, weil sie von beiden Enden
   abhängt: dasselbe Material geht in das eine Rezept einmal und in das
   andere zwölfmal ein.

   **Ein Rezept, das jemand kennt, ist Wissen** — und Wissen hat dieses
   Modell schon. Das Rezept trägt eine Information, die Information geht über
   `knownBy` an Figuren; ein Feld „bekannt von" am Rezept wäre ein zweites,
   schwächeres Wissensmodell neben dem vorhandenen. Ein Rezept ohne
   Information liegt offen — dieselbe Regel wie überall sonst. */
var RECIPE_IFACE="Recipe", RECIPE_COMP="RecipeInfo",
    REL_NEEDS="needs", REL_YIELDS="yields";

function recipeNeeds(r){
  return (r.relations||[]).filter(function(x){return x.type===REL_NEEDS;})
    .map(function(x){ var it=ENT.get(x.to);
      return it?{item:it,rel:x,qty:Number((x.props||{}).qty)||1,
        consumed:(x.props||{}).consumed!==false}:null; })
    .filter(Boolean);
}
function recipeYield(r){
  var x=(r.relations||[]).filter(function(y){return y.type===REL_YIELDS;})[0];
  return x?ENT.get(x.to):null;
}
/* Wie viel von diesem Gegenstand trägt der Träger — über alle Stufen
   hinweg. Was eingelagert ist, zählt mit; das Rezept fragt nach Vorrat,
   nicht nach Griffabstand. */
function amountHeld(traeger,itemId){
  var n=0;
  carriedItems(traeger).forEach(function(st){ if(st.item.id===itemId) n+=st.qty; });
  return n;
}
/* Kennt der Betrachter das Rezept? Alle Informationen daran müssen bekannt
   sein; keine Information heisst offen. Teilwissen ist ein eigener Zustand —
   „du kennst das Rezept, aber nicht die letzte Zutat" ist eine Lage, die am
   Tisch vorkommt, und sie soll sichtbar sein. */
function recipeKnowledge(rec,viewerId){
  var infos=infosOf(rec);
  if(!infos.length)return "open";
  var bekannt=infos.filter(function(i){ return knowsInfo(i,viewerId); }).length;
  if(bekannt===infos.length)return "known";
  return bekannt?"partial":"hidden";
}
/* Was fehlt — Material **und** Werkzeug. Die beiden auseinanderzuhalten
   hiesse, dass die Matrix „ja" sagt und das Anfangen „nein": genau die Art
   Widerspruch, die man am Tisch der Software nicht mehr verzeiht. */
function craftStatus(rec,traeger){
  var fehlt=[], ok=true;
  recipeNeeds(rec).forEach(function(n){
    var da=traeger?amountHeld(traeger,n.item.id):0;
    if(da<n.qty){ ok=false; fehlt.push({item:n.item,need:n.qty,have:da}); }
  });
  var info=(rec.components||{})[RECIPE_COMP]||{};
  var werkzeug=!info.tool||(traeger&&hasTool(traeger,info));
  if(!werkzeug){ ok=false; }
  return {ok:ok,missing:fehlt,tool:werkzeug?"":info.tool};
}

/* ---------- Ein laufender Handwerksgang (REQ-184, Rest) ----------
   Bis hierher stand am Rezept, was es kostet, wie lange es dauert und
   gegen welchen Wert man würfelt — und niemand würfelte und niemand zählte.
   Eine Zeit, die nur dasteht, ist eine Notiz; eine Probe, die nur dasteht,
   ist eine Behauptung.

   Ein Gang hängt an **beiden** Enden: an dem, der arbeitet, und an dem
   Rezept. Also steht er an einer Kante — dieselbe Regel wie bei der
   Tragestufe im Inventar und beim Lichtradius auf der Karte. Kein Artikel:
   ein Gang ist vorbei, wenn er vorbei ist, und ein Artikel, den man
   anschliessend löscht, war keiner.

   **Das Material wird angehängt, während der Gang läuft.** Es ging einmal
   am Anfang hinein, und das hiess: anfangen konnte nur, wer schon alles
   hatte. Am Tisch ist es andersherum — man fängt an, weil man etwas
   vorhat, und sammelt dabei. Der Gang trägt deshalb, was schon drin ist
   (`put`), und man legt jederzeit nach.

   Tage lassen sich von Anfang an arbeiten. **Fertig wird es nicht, bevor
   alles drin ist**: der letzte Tag ist der Wurf, und ein Wurf auf halbes
   Material wäre ein Wurf auf nichts.

   Weil etwas drin liegt, kann ein Gang scheitern und etwas kosten — und
   deshalb ist `onFailure` mehr als eine Zeile im Register. Was übrig
   bleibt, wandert zurück ins Inventar; was verloren ist, ist verloren.

   Gewürfelt wird **einmal am Ende**, mit demselben Würfelwerk wie alles
   andere, und der Wurf bleibt an der Kante stehen. Ein Ergebnis, das nicht
   nachlesbar ist, wird am Tisch neu gewürfelt. */
var REL_CRAFTING="crafting";

function craftJobs(traeger){
  return ((traeger&&traeger.relations)||[]).filter(function(r){
    return r.type===REL_CRAFTING&&ENT.get(r.to);
  }).map(function(r){ return {rel:r,recipe:ENT.get(r.to),
    day:Number((r.props||{}).day)||0, days:Math.max(1,Number((r.props||{}).days)||1),
    rolls:((r.props||{}).rolls)||[]}; });
}
function jobFor(traeger,recId){
  return craftJobs(traeger).filter(function(j){ return j.recipe.id===recId; })[0]||null;
}
/* Wie viele Tage dieses Rezept braucht. Eine Zahl im Register schlägt den
   Text — „2 Tage" liest sich schön und rechnet nicht. */
function recipeDays(info){
  var n=Number(info.days);
  if(isFinite(n)&&n>0)return Math.round(n);
  var m=/(\d+)\s*(tag|tage|day|days)/i.exec(String(info.time||""));
  if(m)return parseInt(m[1],10);
  return 1;
}
/* Der Wert, gegen den gewürfelt wird. Fähigkeitsbonus immer, Übungsbonus
   nur, wenn das Werkzeug in den Werkzeugübungen steht — und das steht in
   den Daten, nicht in einer Annahme. */
function craftMod(traeger,info){
  if(!traeger)return {mod:0,parts:["no crafter"]};
  var sb=statsOf(traeger).card;
  var m=modOf(sb,(info.ability||"int"));
  var teile=[(info.ability||"int").toUpperCase()+" "+sgn(m)];
  var werkzeuge=((traeger.components||{}).Skills||{}).tools||[];
  var geuebt=info.tool&&werkzeuge.some(function(t){
    return String(t).toLowerCase()===String(info.tool).toLowerCase(); });
  if(geuebt){ var p=profOf(traeger); m+=p; teile.push("proficient "+sgn(p)); }
  return {mod:m,parts:teile,proficient:!!geuebt};
}
/* Hat der Arbeiter das Werkzeug dabei? Ein Rezept, das Alchemistenwerkzeug
   verlangt, lässt sich ohne nicht anfangen — und das ist eine Frage an das
   Inventar, nicht an eine Häkchenliste. */
function hasTool(traeger,info){
  if(!info.tool)return true;
  var gesucht=String(info.tool).toLowerCase();
  return carriedItems(traeger).some(function(st){
    return rawName(st.item).toLowerCase().indexOf(gesucht)>=0
        || nameOf(st.item).toLowerCase().indexOf(gesucht)>=0;
  });
}

/* Was dieser Gang noch braucht. Drei Zahlen je Zutat: wie viel das Rezept
   verlangt, wie viel schon drin liegt, wie viel der Arbeiter dabei hat. */
function jobNeeds(traeger,job){
  var drin={};
  ((job.rel.props||{}).put||[]).forEach(function(p){
    drin[p.item]=(drin[p.item]||0)+(Number(p.qty)||0); });
  return recipeNeeds(job.recipe).map(function(n){
    return {item:n.item,need:n.qty,consumed:n.consumed,
      put:drin[n.item.id]||0,held:amountHeld(traeger,n.item.id)};
  });
}
/* Fertig werden kann nur, was vollständig ist — Material und Werkzeug.
   Was nicht verbraucht wird, muss dabei sein und nicht hinein. */
function jobReady(traeger,job){
  var info=(job.recipe.components||{})[RECIPE_COMP]||{};
  var fehlt=jobNeeds(traeger,job).filter(function(n){
    return n.consumed?n.put<n.need:n.held<n.need; });
  var werkzeug=!info.tool||hasTool(traeger,info);
  return {ok:!fehlt.length&&werkzeug,missing:fehlt,tool:werkzeug?"":info.tool};
}
/* Nachlegen. Was hineingeht, ist aus dem Inventar weg — sonst läge dieselbe
   Zutat zweimal da, einmal im Beutel und einmal im Kessel. */
function craftPut(traeger,job,itemId,menge){
  var inv=inventoryOf(traeger);
  if(!inv)return;
  var genommen=takeFromInventory(inv,traeger,itemId,menge);
  if(genommen<=0){ UI.err="Nothing of that in the pack."; render(); return; }
  var put=((job.rel.props||{}).put||[]).slice();
  var da=put.filter(function(p){return p.item===itemId;})[0];
  if(da) da.qty=(Number(da.qty)||0)+genommen;
  else put.push({item:itemId,qty:genommen});
  job.rel.props=Object.assign({},job.rel.props,{put:put});
  persist(inv);
  if(inv.id!==traeger.id) persist(traeger);
}

/* Anfangen: die Kante anlegen, und sonst nichts. Das Werkzeug muss dabei
   sein — ohne Kessel fängt niemand an —, das Material nicht: es wird
   angehängt, während der Gang läuft. */
function craftStart(rec,traeger){
  var inv=inventoryOf(traeger);
  if(!inv){ UI.err="No inventory to take from."; render(); return; }
  var info=(rec.components||{})[RECIPE_COMP]||{};
  if(info.tool&&!hasTool(traeger,info)){
    UI.err="Needs "+info.tool+" to work with."; render(); return; }
  if(jobFor(traeger,rec.id)){ UI.err="Already working on that one."; render(); return; }
  var tage=recipeDays(info);
  confirmDialog("Start “"+nameOf(rec)+"”? Nothing goes in yet — put the "+
    "materials in as you get them. "+tage+" day"+(tage===1?"":"s")+" of work, "+
    "then a "+(info.ability||"int").toUpperCase()+" check against DC "+
    (info.dc||12)+".",
    function(){
      traeger.relations=traeger.relations||[];
      traeger.relations.push({id:uid("r"),type:REL_CRAFTING,to:rec.id,
        props:{day:0,days:tage,rolls:[],put:[]}});
      persist(traeger);
    },"Start");
}
/* Material abtragen. Von hinten: was eingelagert ist, geht zuerst, was in
   der Hand liegt, zuletzt — sonst nimmt das Handwerk die Waffe weg. */
function takeFromInventory(inv,traeger,itemId,menge){
  var rest=menge;
  var stuecke=carriedItems(traeger).filter(function(x){return x.item.id===itemId;});
  var ordnung=["stored","pack","belt","worn","held"];
  stuecke.sort(function(a,b){ return ordnung.indexOf(a.tier)-ordnung.indexOf(b.tier); });
  stuecke.forEach(function(x){
    if(rest<=0)return;
    var weg=Math.min(rest,x.qty); rest-=weg;
    if(x.qty-weg<=0) inv.relations=inv.relations.filter(function(y){return y.id!==x.rel.id;});
    else x.rel.props=Object.assign({},x.rel.props,{qty:x.qty-weg});
  });
  return menge-rest;
}
function putIntoInventory(inv,itemId,menge,stufe){
  var vorhanden=(inv.relations||[]).filter(function(y){
    return y.type===REL_HOLDS&&y.to===itemId; })[0];
  if(vorhanden) vorhanden.props=Object.assign({},vorhanden.props,
    {qty:(Number((vorhanden.props||{}).qty)||1)+menge});
  else{ inv.relations=inv.relations||[];
    inv.relations.push({id:uid("r"),type:REL_HOLDS,to:itemId,
      props:{qty:menge,tier:stufe||"pack"}}); }
}

/* Einen Tag arbeiten. Am letzten Tag wird gewürfelt, und dann ist der Gang
   vorbei — so oder so. */
function craftDay(traeger,job){
  var info=(job.recipe.components||{})[RECIPE_COMP]||{};
  var tag=job.day+1;
  /* Arbeiten geht immer, fertig werden nicht. Ein Wurf auf halbes Material
     wäre ein Wurf auf nichts — und der Tag wäre weg. */
  if(tag>=job.days){
    var bereit=jobReady(traeger,job);
    if(!bereit.ok){
      UI.err="Not finished yet — still missing: "+
        bereit.missing.map(function(m){
          return nameOf(m.item)+" ("+(m.consumed?m.put:m.held)+"/"+m.need+")"; })
        .concat(bereit.tool?[bereit.tool]:[]).join(", ");
      render(); return;
    }
  }
  if(tag<job.days){
    job.rel.props=Object.assign({},job.rel.props,{day:tag});
    persist(traeger);
    return;
  }
  var bonus=craftMod(traeger,info);
  var wurf=rollDice("1d20"+(bonus.mod?sgn(bonus.mod):""));
  var dc=Number(info.dc)||12;
  var geschafft=wurf&&wurf.total>=dc;
  var eintrag={at:new Date().toISOString(),total:wurf?wurf.total:0,
    dice:wurf?wurf.rolls:[],dc:dc,mod:bonus.mod,ok:!!geschafft};
  var inv=inventoryOf(traeger);
  var ergebnis=recipeYield(job.recipe);
  var zurueck=[];

  if(geschafft&&inv&&ergebnis) putIntoInventory(inv,ergebnis.id,Number(info.yieldCount)||1);
  if(!geschafft&&inv){
    /* Was bei einem Fehlschlag übrig bleibt (REQ-184). `halfLost` rundet
       zugunsten des Arbeiters ab — die Hälfte einer einzelnen Zutat ist
       keine halbe Zutat, sondern Glück. */
    var regel=info.onFailure||"halfLost";
    (job.rel.props.put||[]).forEach(function(p){
      var behalten=regel==="nothingLost"?p.qty:
        (regel==="halfLost"?Math.floor(p.qty/2):0);
      if(behalten>0){ putIntoInventory(inv,p.item,behalten); zurueck.push({item:p.item,qty:behalten}); }
    });
  }
  traeger.relations=(traeger.relations||[]).filter(function(r){ return r.id!==job.rel.id; });
  UI.craftLog=(UI.craftLog||[]).concat([{recipe:job.recipe.id,who:traeger.id,
    roll:eintrag,back:zurueck,
    yield:geschafft&&ergebnis?ergebnis.id:""}]).slice(-12);
  if(inv) persist(inv);
  if(!inv||inv.id!==traeger.id) persist(traeger);
}
function craftAbort(traeger,job){
  var info=(job.recipe.components||{})[RECIPE_COMP]||{};
  confirmDialog("Stop working on “"+nameOf(job.recipe)+"”? "+
    (info.onFailure==="nothingLost"?"The materials come back."
      :"What is already in it is spoilt — "+
       (info.onFailure==="materialsLost"?"nothing comes back.":"half comes back.")),
    function(){
      var inv=inventoryOf(traeger);
      var regel=info.onFailure||"halfLost";
      if(inv)(job.rel.props.put||[]).forEach(function(p){
        var behalten=regel==="nothingLost"?p.qty:
          (regel==="halfLost"?Math.floor(p.qty/2):0);
        if(behalten>0) putIntoInventory(inv,p.item,behalten);
      });
      traeger.relations=(traeger.relations||[]).filter(function(r){ return r.id!==job.rel.id; });
      if(inv) persist(inv);
      if(!inv||inv.id!==traeger.id) persist(traeger);
    },"Stop");
}

/* Die Werkbank: was läuft, wie weit, und was zuletzt gewürfelt wurde. */
function craftBench(traeger){
  var jobs=craftJobs(traeger);
  var log=(UI.craftLog||[]).filter(function(x){ return x.who===traeger.id; });
  if(!jobs.length&&!log.length)return null;
  var wrap=el("div",{class:"bench"});
  wrap.appendChild(el("div",{class:"sec",text:"On the bench"}));
  jobs.forEach(function(j){
    var info=(j.recipe.components||{})[RECIPE_COMP]||{};
    var bonus=craftMod(traeger,info);
    var row=el("div",{class:"job"});
    var kopf=el("div",{class:"ck"});
    kopf.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:j.recipe.id});}},nameOf(j.recipe)));
    kopf.appendChild(el("span",{class:"co",
      text:j.day+"/"+j.days+" day"+(j.days===1?"":"s")+
        (j.days===1&&info.time?" ("+info.time+", one sitting)":"")}));
    kopf.appendChild(el("span",{class:"pill q",
      title:bonus.parts.join(" · "),
      text:(info.ability||"int").toUpperCase()+" "+sgn(bonus.mod)+" vs DC "+(info.dc||12)}));
    row.appendChild(kopf);
    var bar=el("div",{class:"jbar"});
    var fill=el("i"); fill.style.width=Math.min(100,(j.day/j.days)*100)+"%";
    bar.appendChild(fill); row.appendChild(bar);

    /* Was drin ist und was fehlt — je Zutat eine Zeile, und der Knopf, der
       sie hineinlegt, steht daneben. Eine Liste, die nur zählt, schickt
       einen zum Inventar und wieder zurück. */
    var bedarf=jobNeeds(traeger,j);
    var bereit=jobReady(traeger,j);
    if(bedarf.length){
      var liste=el("ul",{class:"jmat"});
      bedarf.forEach(function(n){
        var voll=n.consumed?n.put>=n.need:n.held>=n.need;
        var li=el("li",{class:voll?"ok":"short"});
        li.appendChild(el("button",{class:"ref",type:"button",
          onclick:function(){go({k:"art",id:n.item.id});}},nameOf(n.item)));
        li.appendChild(el("span",{class:"co",
          text:n.consumed?(n.put+"/"+n.need+" in"):(n.held+"/"+n.need+" to hand")}));
        if(!voll&&n.consumed){
          var kann=Math.min(n.need-n.put,n.held);
          if(kann>0&&canWrite()) li.appendChild(el("button",{class:"btn sm",type:"button",
            title:"Take it out of the pack and put it in",
            onclick:function(){ craftPut(traeger,j,n.item.id,kann); }},
            "put in "+kann));
          else li.appendChild(el("span",{class:"gone",
            text:n.held?"":"none in the pack"}));
        }
        liste.appendChild(li);
      });
      row.appendChild(liste);
    }
    if(bereit.tool) row.appendChild(el("p",{class:"hint warnzeile",style:"margin:2px 0",
      text:"Needs "+bereit.tool+" — it is not in the pack."}));

    if(canWrite()){
      var btns=el("div",{class:"rowbtns"});
      var letzter=j.day+1>=j.days;
      var knopf=el("button",{class:"btn sm pri",type:"button",
        onclick:function(){ craftDay(traeger,j); }},
        letzter?"Last day — roll it":"Work a day");
      /* Der letzte Tag bleibt zu, solange etwas fehlt, und sagt warum.
         Ein Knopf, der nichts tut und nichts sagt, wird zweimal gedrückt. */
      if(letzter&&!bereit.ok){
        knopf.disabled=true;
        knopf.title="Still missing: "+bereit.missing.map(function(m){
          return nameOf(m.item); }).concat(bereit.tool?[bereit.tool]:[]).join(", ");
      }
      btns.appendChild(knopf);
      if(bedarf.some(function(n){ return n.consumed&&n.put<n.need&&n.held>0; }))
        btns.appendChild(el("button",{class:"btn sm",type:"button",
          onclick:function(){
            bedarf.forEach(function(n){
              if(!n.consumed||n.put>=n.need)return;
              var kann=Math.min(n.need-n.put,n.held);
              if(kann>0) craftPut(traeger,j,n.item.id,kann);
            });
          }},"Put everything in"));
      btns.appendChild(el("button",{class:"btn sm gh",type:"button",
        onclick:function(){ craftAbort(traeger,j); }},"Stop"));
      row.appendChild(btns);
    }
    wrap.appendChild(row);
  });
  log.slice().reverse().forEach(function(x){
    var rec=ENT.get(x.recipe), erg=x.yield&&ENT.get(x.yield);
    var z=el("p",{class:"hint"+(x.roll.ok?"":" warnzeile"),style:"margin:2px 0"});
    z.textContent=(rec?nameOf(rec):"?")+": "+x.roll.total+" vs DC "+x.roll.dc+
      " — "+(x.roll.ok?("made it"+(erg?", "+nameOf(erg)+" in the pack":""))
                     :("failed"+(x.back.length?", some of it came back":", all of it gone")));
    wrap.appendChild(z);
  });
  return wrap;
}


function elCrafting(e,ifn,item){
  var wrap=el("div",{class:"craft"});

  /* Auf dem Rezept selbst: was es braucht, was es gibt, wer es kennt. */
  if(ifn===RECIPE_IFACE||((e.components||{})[RECIPE_COMP])){
    var info=(e.components||{})[RECIPE_COMP]||{};
    var kopf=el("div",{class:"crhead"});
    if(info.trade) kopf.appendChild(el("span",{class:"pill",text:info.trade}));
    if(info.dc) kopf.appendChild(el("span",{class:"pill q",
      text:(info.ability||"int").toUpperCase()+" DC "+info.dc}));
    if(info.time) kopf.appendChild(el("span",{class:"pill q",text:info.time}));
    if(info.tool) kopf.appendChild(el("span",{class:"pill q",text:info.tool}));
    wrap.appendChild(kopf);

    var erg=recipeYield(e);
    if(erg){
      var z=el("p",{class:"yield"});
      z.appendChild(document.createTextNode("Yields "+((Number(info.yieldCount)||1)>1?
        (info.yieldCount+"× "):"")));
      z.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:erg.id});}},nameOf(erg)));
      wrap.appendChild(z);
    }

    var braucht=recipeNeeds(e);
    if(!braucht.length) wrap.appendChild(el("p",{class:"hint",
      text:"No materials listed yet — add them with the relation “needs”."}));
    else{
      wrap.appendChild(el("div",{class:"sec",text:"Materials"}));
      /* Je Träger eine Spalte: dieselbe Frage, die man am Tisch stellt —
         „hat jemand von uns genug?" — statt für jeden einzeln nachzusehen. */
      var traeger=[];
      ENT.forEach(function(o){
        if(!(o.relations||[]).some(function(r){return r.type===REL_CARRIES;}))return;
        traeger.push(o);
      });
      traeger.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
      var tb=el("table",{class:"craftm"});
      var hd=el("tr");
      hd.appendChild(el("th",{text:"Material"}));
      hd.appendChild(el("th",{text:"Needs"}));
      traeger.forEach(function(t){ hd.appendChild(el("th",{text:nameOf(t)})); });
      tb.appendChild(hd);
      braucht.forEach(function(n){
        var row=el("tr");
        var c=el("td");
        c.appendChild(el("button",{class:"ref",type:"button",
          onclick:function(){go({k:"art",id:n.item.id});}},nameOf(n.item)));
        if(!n.consumed) c.appendChild(el("span",{class:"co",text:" (not consumed)"}));
        row.appendChild(c);
        row.appendChild(el("td",{class:"num",text:String(n.qty)}));
        traeger.forEach(function(t){
          var da=amountHeld(t,n.item.id);
          row.appendChild(el("td",{class:"num"+(da<n.qty?" short":" ok"),text:String(da)}));
        });
        tb.appendChild(row);
      });
      var foot=el("tr",{class:"crfoot"});
      foot.appendChild(el("td",{text:"Craftable"}));
      foot.appendChild(el("td",{text:""}));
      var rinfo=(e.components||{})[RECIPE_COMP]||{};
      traeger.forEach(function(t){
        var st=craftStatus(e,t);
        var cell=el("td");
        /* Anfangen darf, wer das Werkzeug hat — das Material wird
           angehängt. Die Zeile darüber sagt weiter, wer genug hat: das ist
           die Frage „können wir das jetzt durchziehen?", und sie bleibt
           eine andere als „dürfen wir anfangen?". */
        var laeuft=!!jobFor(t,e.id);
        var werkzeug=!rinfo.tool||hasTool(t,rinfo);
        if(canWrite()&&werkzeug) cell.appendChild(el("button",
          {class:"btn sm"+(st.ok?" pri":""),type:"button",
           title:st.ok?"":"Start now and add the materials as you get them",
           onclick:function(){ if(!laeuft) craftStart(e,t); }},
          laeuft?"on the bench":"start"));
        else cell.appendChild(el("span",{class:st.ok?"ok":"gone",
          title:werkzeug?"":"No "+rinfo.tool,text:st.ok?"yes":"no"}));
        foot.appendChild(cell);
      });
      tb.appendChild(foot);
      wrap.appendChild(tb);
    }

    /* Wer es kennt: der Rückbezug über die Informationen am Rezept. */
    var infos=infosOf(e);
    wrap.appendChild(el("div",{class:"sec",text:"Who knows it"}));
    if(!infos.length) wrap.appendChild(el("p",{class:"hint",
      text:"Nothing about this recipe is guarded — everyone can read it. Bundle its fields into an information in the side panel to hand it out deliberately."}));
    else{
      var wl=el("div",{class:"chips"});
      var wer={};
      infos.forEach(function(i){
        edgesOf(i,REL_KNOWNBY).forEach(function(r){ var t=ENT.get(r.to); if(t) wer[t.id]=t; });
      });
      if(!Object.keys(wer).length) wl.appendChild(el("span",{class:"hint",style:"margin:0",
        text:"Nobody yet — it stays with the GM."}));
      Object.keys(wer).forEach(function(k){
        wl.appendChild(el("button",{class:"chip",type:"button",
          onclick:function(){go({k:"art",id:k});}},nameOf(wer[k])));
      });
      wrap.appendChild(wl);
    }
    return wrap;
  }

  /* Sonst: die Werkbank dieser Figur oder Gruppe. */
  var inv=inventoryOf(e);
  if(!inv){ wrap.appendChild(el("p",{class:"hint",
    text:"No inventory — nothing to craft from."})); return wrap; }

  var werkbank=craftBench(e);
  if(werkbank) wrap.appendChild(werkbank);

  var rezepte=[];
  ENT.forEach(function(o){ if(((o.interfaces||[])[0])===RECIPE_IFACE) rezepte.push(o); });
  rezepte.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
  if(!rezepte.length){ wrap.appendChild(el("p",{class:"hint",text:"No recipes in the registry yet."}));
    return wrap; }

  var bar=el("div",{class:"ktabs"});
  bar.appendChild(el("button",{class:"btn sm"+(UI.craftOnly?" pri":""),type:"button",
    "aria-pressed":String(UI.craftOnly),
    onclick:function(){ UI.craftOnly=!UI.craftOnly; render(); }},"Only what works"));
  wrap.appendChild(bar);

  var tb2=el("table",{class:"craftm"});
  var hd2=el("tr");
  ["Recipe","Knowledge","Materials","Yields",""].forEach(function(h){ hd2.appendChild(el("th",{text:h})); });
  tb2.appendChild(hd2);
  var gezeigt=0;
  rezepte.forEach(function(rec){
    var wissen=recipeKnowledge(rec,e.id);
    var st=craftStatus(rec,e);
    if(UI.craftOnly&&(!st.ok||wissen==="hidden"))return;
    gezeigt++;
    var row=el("tr",{class:"crrow "+(wissen==="hidden"?"unknown":(st.ok?"ready":"short"))});
    var c1=el("td");
    c1.appendChild(el("span",{class:"cdot "+(wissen==="hidden"?"d-un":(st.ok?"d-ok":"d-no"))}));
    c1.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:rec.id});}},
      wissen==="hidden"?"(unknown recipe)":nameOf(rec)));
    row.appendChild(c1);
    row.appendChild(el("td",{class:"note",
      text:{open:"open",known:"known",partial:"partly known",hidden:"not known"}[wissen]}));
    var c3=el("td",{class:"note"});
    if(wissen==="hidden") c3.textContent="—";
    else if(st.ok) c3.textContent="all there";
    else c3.textContent=st.missing.map(function(m){
      return nameOf(m.item)+" "+m.have+"/"+m.need; })
      .concat(st.tool?["no "+st.tool]:[]).join(", ");
    row.appendChild(c3);
    var erg2=recipeYield(rec);
    var c4=el("td");
    if(wissen!=="hidden"&&erg2) c4.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:erg2.id});}},nameOf(erg2)));
    else c4.textContent="—";
    row.appendChild(c4);
    var c5=el("td");
    if(st.ok&&wissen!=="hidden"&&canWrite())
      c5.appendChild(el("button",{class:"btn sm pri",type:"button",
        onclick:function(){ craftStart(rec,e); }},
        jobFor(e,rec.id)?"On the bench":"Start"));
    row.appendChild(c5);
    tb2.appendChild(row);
  });
  wrap.appendChild(tb2);
  if(!gezeigt) wrap.appendChild(el("p",{class:"hint",
    text:"Nothing craftable right now."}));
  return wrap;
}

/* ---------- Inventar (REQ-064, 065) ----------
   Drei Darstellungen über denselben Daten: Griffabstand, Körper, Raster.
   Die Angaben stehen an der Kante, nicht am Gegenstand — dasselbe Seil liegt
   bei der einen Figur am Gürtel und bei der anderen ganz unten im Rucksack,
   und ein Feld am Gegenstand trüge nur eine der beiden Wahrheiten.

   `tier` ist der Griffabstand, nicht der Ort. Genau diese Frage stellt sich
   am Tisch — „habe ich das jetzt?" —, und sie ist eine andere als „gehört
   es mir?". */
var INV_IFACE="Inventory", REL_CARRIES="carries", REL_HOLDS="holds";
var TIERS=[
  ["held","In hand","One action away: it is already in your hands."],
  ["worn","Worn","On the body — armour, cloak, rings."],
  ["belt","At the belt","An interact: pouch, sheath, bandolier."],
  ["pack","In the pack","A whole action of rummaging."],
  ["stored","Stored","Not here. At an inn, on a cart, at home."]
];
var SLOTS=[
  ["head","Head"],["neck","Neck"],["cloak","Cloak"],["torso","Torso"],
  ["mainHand","Main hand"],["offHand","Off hand"],["hands","Hands"],
  ["belt","Belt"],["legs","Legs"],["feet","Feet"],["ring1","Ring I"],["ring2","Ring II"]
];
function tierLabel(t){ var h=TIERS.filter(function(x){return x[0]===t;})[0]; return h?h[1]:t; }

/* Das Inventar einer Figur — oder der Artikel selbst, wenn er eines ist. */
function inventoryOf(e){
  if(((e.interfaces||[])[0])===INV_IFACE)return e;
  var r=(e.relations||[]).filter(function(x){return x.type===REL_CARRIES;})[0];
  return r?ENT.get(r.to):null;
}
function carriedItems(e){
  var inv=inventoryOf(e); if(!inv)return [];
  var out=[];
  (inv.relations||[]).forEach(function(r){
    if(r.type!==REL_HOLDS)return;
    var it=ENT.get(r.to); if(!it)return;
    var pr=r.props||{};
    out.push({item:it,rel:r,inv:inv,tier:pr.tier||"pack",qty:Number(pr.qty)||1,
      slot:pr.slot||"",gx:pr.gx,gy:pr.gy,note:pr.note||"",attuned:!!pr.attuned});
  });
  return out;
}
/* Die Form eines Gegenstands im Raster. Ohne `Footprint` ist er ein Feld
   gross — das ist kein Sonderfall, sondern der Normalfall. */
function footprintOf(it){
  var fp=(it.components||{}).Footprint||{};
  var rows=Array.isArray(fp.rows)?fp.rows.map(String):
    (typeof fp.rows==="string"?fp.rows.split("\n"):[]);
  if(!rows.length)return {rows:["1"],w:1,h:1};
  var w=rows.reduce(function(m,r){return Math.max(m,r.length);},0)||1;
  return {rows:rows,w:w,h:rows.length};
}
function fpFilled(fp,x,y){
  var row=fp.rows[y]||"";
  var g=row.charAt(x);
  return !!g&&!EMPTY_CELL[g];
}
function invSize(){
  return {cols:Math.max(2,settingNum("inventoryCols",10)),
          rows:Math.max(2,settingNum("inventoryRows",6))};
}
/* Passt der Gegenstand dorthin? Belegte Felder und der Rand sind die einzigen
   Gründe, nein zu sagen — Gewicht und Volumen führt dieses Modell nicht. */
function fitsAt(stuecke,ich,gx,gy){
  var size=invSize(), fp=footprintOf(ich.item);
  if(gx<0||gy<0||gx+fp.w>size.cols||gy+fp.h>size.rows)return false;
  var belegt={};
  stuecke.forEach(function(st){
    if(st.rel.id===ich.rel.id)return;
    if(st.gx==null||st.gy==null)return;
    var f=footprintOf(st.item);
    for(var y=0;y<f.h;y++)for(var x=0;x<f.w;x++)
      if(fpFilled(f,x,y)) belegt[(st.gx+x)+":"+(st.gy+y)]=1;
  });
  for(var y2=0;y2<fp.h;y2++)for(var x2=0;x2<fp.w;x2++)
    if(fpFilled(fp,x2,y2)&&belegt[(gx+x2)+":"+(gy+y2)])return false;
  return true;
}

function elInventory(e,ifn,item){

    wrap.appendChild(el("p",{class:"hint",
      text:"No inventory yet. Link one with the relation “carries”."}));
    if(canWrite()) wrap.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ newInventory(e); }},"+ Inventory"));

  }
  var stuecke=carriedItems(e);

  var tabs=el("div",{class:"ktabs"});
  if(inPlacement) tabs.style.display="none";
  [["tiers","Within reach"],["body","Worn"],["grid","Grid"]].forEach(function(t){
    tabs.appendChild(el("button",{class:"btn sm"+(UI.invView===t[0]?" pri":""),type:"button",
      "aria-pressed":String(UI.invView===t[0]),
      onclick:function(){ UI.invView=t[0]; render(); }},t[1]));

  if(geld.copper!=null) tabs.appendChild(el("span",{class:"hint",style:"margin:0",

  wrap.appendChild(tabs);

  if(!stuecke.length){
    wrap.appendChild(el("div",{class:"empty",text:"Nothing carried yet."}));
    return wrap;
  }

  /* Ein Stück ist gewählt: der nächste Klick auf eine Stufe, einen Slot oder
     ein Rasterfeld legt es dorthin. Das trägt auf dem Telefon genauso wie
     Ziehen — und Ziehen bleibt daneben möglich. */
  var gewaehlt=stuecke.filter(function(st){ return st.rel.id===UI.invPick; })[0]||null;
  if(gewaehlt) wrap.appendChild(el("p",{class:"hint pickon",
    text:"“"+nameOf(gewaehlt.item)+"” picked up — now click where it goes."}));

  function chip(st){
    var b=el("button",{class:"chip item"+(st.rel.id===UI.invPick?" selected":""),
      type:"button",draggable:canWrite()?"true":null,
      title:(st.note||"")+(st.attuned?" · attuned":"")});
    b.appendChild(el("span",{text:nameOf(st.item)}));
    if(st.qty>1) b.appendChild(el("span",{class:"qty",text:"×"+st.qty}));
    b.addEventListener("click",function(ev){
      if(ev.shiftKey||!canWrite()){ go({k:"art",id:st.item.id}); return; }
      UI.invPick=(UI.invPick===st.rel.id?"":st.rel.id); render();
    });
    b.addEventListener("dragstart",function(ev){
      UI.invPick=st.rel.id;
      try{ ev.dataTransfer.setData("text/plain",st.rel.id); }catch(x){}
    });
    return b;
  }
  function lege(st,patch){
    st.rel.props=Object.assign({},st.rel.props,patch);
    UI.invPick="";
    persist(st.inv);
  }
  function dropZiel(node,fn){
    if(!canWrite())return node;
    node.addEventListener("dragover",function(ev){ ev.preventDefault();
      node.classList.add("over"); });
    node.addEventListener("dragleave",function(){ node.classList.remove("over"); });
    node.addEventListener("drop",function(ev){ ev.preventDefault();
      node.classList.remove("over");
      var st=stuecke.filter(function(x){return x.rel.id===UI.invPick;})[0];
      if(st) fn(st);
    });
    node.addEventListener("click",function(){
      var st=stuecke.filter(function(x){return x.rel.id===UI.invPick;})[0];
      if(st) fn(st);
    });
    return node;
  }

  if(UI.invView==="tiers"){
    TIERS.forEach(function(t){
      var box=el("div",{class:"tier t-"+t[0]});
      var head=el("div",{class:"tlabel"});
      head.appendChild(el("b",{text:t[1]}));
      head.appendChild(el("span",{class:"co",text:t[2]}));
      box.appendChild(head);
      var liste=stuecke.filter(function(st){ return st.tier===t[0]; });
      if(!liste.length) box.appendChild(el("span",{class:"hint",style:"margin:0",text:"—"}));
      liste.forEach(function(st){ box.appendChild(chip(st)); });
      dropZiel(box,function(st){ lege(st,{tier:t[0]}); });
      wrap.appendChild(box);
    });
  }

  if(UI.invView==="body"){
    var rig=el("div",{class:"bodyrig"+(gewaehlt?" picking":"")});
    SLOTS.forEach(function(sl){
      var box=el("div",{class:"slot"});
      box.appendChild(el("div",{class:"slabel",text:sl[1]}));
      var inhalt=el("div",{class:"sbox"});
      var drin=stuecke.filter(function(st){ return st.slot===sl[0]; });
      if(!drin.length) inhalt.appendChild(el("span",{class:"hint",style:"margin:0",text:"empty"}));
      drin.forEach(function(st){
        inhalt.appendChild(chip(st));
        if(canWrite()) inhalt.appendChild(el("button",{class:"btn gh sm",type:"button",
          title:"Take off",onclick:function(ev){ ev.stopPropagation();
            lege(st,{slot:undefined,tier:"pack"}); }},"×"));
      });
      dropZiel(inhalt,function(st){
        lege(st,{slot:sl[0],tier:sl[0]==="mainHand"||sl[0]==="offHand"?"held":"worn"}); });
      box.appendChild(inhalt);
      rig.appendChild(box);
    });
    wrap.appendChild(rig);
    var frei=stuecke.filter(function(st){ return !st.slot; });
    if(frei.length){
      wrap.appendChild(el("div",{class:"sec",text:"Not worn"}));
      var bag=el("div",{class:"chips"});
      frei.forEach(function(st){ bag.appendChild(chip(st)); });
      wrap.appendChild(bag);
    }
  }

  if(UI.invView==="grid"){
    /* Das Kachelraster (REQ-065). Dieselben Daten wie oben — was hier liegt,
       liegt auch in einer Stufe; das Raster sagt nur, *wo* im Rucksack.
       Die Form kommt aus `Footprint`, das der Import schon füllt. */
    var size=invSize();
    var g=el("div",{class:"invgrid"+(gewaehlt?" picking":"")});
    g.style.gridTemplateColumns="repeat("+size.cols+",1fr)";
    for(var y=0;y<size.rows;y++)for(var x=0;x<size.cols;x++)(function(x,y){
      var c=el("div",{class:"gcell"});
      c.style.gridColumn=(x+1); c.style.gridRow=(y+1);
      dropZiel(c,function(st){
        if(!fitsAt(stuecke,st,x,y)){ UI.err="It does not fit there."; render(); return; }
        lege(st,{gx:x,gy:y});
      });
      g.appendChild(c);
    })(x,y);

    stuecke.forEach(function(st){
      if(st.gx==null||st.gy==null)return;
      var fp=footprintOf(st.item);
      var box=el("div",{class:"gitem"+(st.rel.id===UI.invPick?" selected":"")});
      box.style.gridColumn=(st.gx+1)+" / span "+fp.w;
      box.style.gridRow=(st.gy+1)+" / span "+fp.h;
      box.style.gridTemplateColumns="repeat("+fp.w+",1fr)";
      box.style.gridTemplateRows="repeat("+fp.h+",1fr)";
      for(var yy=0;yy<fp.h;yy++)for(var xx=0;xx<fp.w;xx++){
        var f=el("i",{class:fpFilled(fp,xx,yy)?"on":"off"});
        box.appendChild(f);
      }
      var lab=el("span",{class:"glab",text:nameOf(st.item)+(st.qty>1?" ×"+st.qty:"")});
      box.appendChild(lab);
      box.setAttribute("draggable",canWrite()?"true":"false");
      box.title=nameOf(st.item)+" — "+fp.w+"×"+fp.h;
      box.addEventListener("click",function(ev){
        ev.stopPropagation();
        if(ev.shiftKey||!canWrite()){ go({k:"art",id:st.item.id}); return; }
        UI.invPick=(UI.invPick===st.rel.id?"":st.rel.id); render();
      });
      box.addEventListener("dragstart",function(ev){ UI.invPick=st.rel.id;
        try{ ev.dataTransfer.setData("text/plain",st.rel.id); }catch(x){} });
      g.appendChild(box);
    });
    wrap.appendChild(g);

    var lose=stuecke.filter(function(st){ return st.gx==null||st.gy==null; });
    if(lose.length){
      wrap.appendChild(el("p",{class:"hint",
        text:lose.length+" item"+(lose.length===1?"":"s")+" not placed yet — pick one, then click a free cell."}));
      var tray=el("div",{class:"chips"});
      lose.forEach(function(st){ tray.appendChild(chip(st)); });
      wrap.appendChild(tray);
    }
    wrap.appendChild(el("p",{class:"hint",
      text:size.cols+"×"+size.rows+" — set inventoryCols and inventoryRows under Data model · Settings."}));
  }
  return wrap;
}

/* Ein Inventar anlegen und an die Figur hängen. Ein Behälter, den man erst

function newInventory(e){

}

/* ---------- Charakterbogen (REQ-051, 063, 066) ----------
   Zwei Sorten Zahl, und der Bogen hält sie auseinander: `StatblockInfo` sind
   die ruhigen Werte (Rüstungsklasse, Attribute, Höchst-Trefferpunkte),
   `Vitals` ist, was sich am Tisch zwanzigmal pro Kampf ändert. In einer
   Karte lägen sie im Weg — jede Änderung schriebe die andere mit.

   Ein Spielercharakter trägt seine Zahlen selbst; ein NSC borgt sie meist
   von einem Statblock über `belongsTo`. Der Bogen liest erst die eigene
   Karte, dann die geborgte, statt eine der beiden Formen zu verbieten. */
var VIT_COMP="Vitals", SKILL_COMP="Skills", SB_COMP="StatblockInfo";
var ATTR6=["str","dex","con","int","wis","cha"];

/* Fertigkeit zu Attribut: eine Kampagneneinstellung mit Rückfall, damit die
   Seite auch ohne die Zeile rechnet. Fest im Code hiesse: eine Kampagne mit
   anderen Fertigkeiten wäre eine Codeänderung. */
var SKILLS_FALLBACK="acrobatics:dex,animalHandling:wis,arcana:int,athletics:str,"+
  "deception:cha,history:int,insight:wis,intimidation:cha,investigation:int,"+
  "medicine:wis,nature:int,perception:wis,performance:cha,persuasion:cha,"+
  "religion:int,sleightOfHand:dex,stealth:dex,survival:wis";
var CONDITIONS_FALLBACK="blinded,charmed,deafened,frightened,grappled,incapacitated,"+
  "invisible,paralysed,petrified,poisoned,prone,restrained,stunned,unconscious";
function skillList(){
  return String(setting("skills",SKILLS_FALLBACK)).split(",").map(function(p){
    var t=p.split(":"); return {key:(t[0]||"").trim(),attr:(t[1]||"dex").trim()};
  }).filter(function(x){return x.key;});
}
function conditionList(){
  return String(setting("conditions",CONDITIONS_FALLBACK)).split(",")
    .map(function(x){return x.trim();}).filter(Boolean);
}
/* aus `animalHandling` wird „Animal handling" — Titel aus dem Schlüssel,
   damit eine neue Fertigkeit nur eine Einstellung ist. */
function humanKey(k){
  var t=String(k).replace(/([a-z0-9])([A-Z])/g,"$1 $2");
  return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase();
}

/* Die ruhigen Zahlen: erst am Artikel, sonst am Statblock, der auf ihn zeigt. */
function statsOf(e){
  var eigen=(e.components||{})[SB_COMP];
  if(eigen&&Object.keys(eigen).length) return {card:eigen,from:e};
  var geliehen=null;
  ENT.forEach(function(o){
    if(geliehen)return;
    if(!((o.components||{})[SB_COMP]))return;
    if((o.relations||[]).some(function(r){ return r.type==="belongsTo"&&r.to===e.id; }))
      geliehen={card:o.components[SB_COMP],from:o};
  });
  return geliehen||{card:{},from:null};
}
function modOf(card,attr){
  var n=Number(card[attr]);
  return isFinite(n)?Math.floor((n-10)/2):0;
}
function profOf(e){
  var ch=(e.components||{}).CharacterInfo||{};
  if(ch.level!==undefined){
    var pd=((REG.components.CharacterInfo||{}).schema||{}).properties||{};
    var d=pd.proficiency&&derivedValue(pd.proficiency,ch);
    if(d!==undefined)return d;
  }
  var sb=statsOf(e).card;
  var cr=Number(sb.cr);
  if(isFinite(cr))return Math.max(2,2+Math.floor(Math.max(0,cr-1)/4));
  return 2;
}
function sgn(n){ return (n>=0?"+":"")+n; }

/* Eine Zahl, die man im Kampf antippt: Wert plus zwei Knöpfe. `schritt`
   schreibt sofort — ein Bogen, der erst nach einem Speichern-Klick stimmt,
   stimmt am Tisch nie. */
function vitalStepper(label,wert,setzen,klasse,zusatz){
  var box=el("div",{class:"vital"+(klasse?" "+klasse:"")});
  box.appendChild(el("div",{class:"vk",text:label}));
  var row=el("div",{class:"vrow"});
  if(canWrite()) row.appendChild(el("button",{class:"vbtn",type:"button",
    "aria-label":"minus",onclick:function(){ setzen(-1); }},"−"));
  var inp=el("input",{class:"vin",type:"number",value:String(wert==null?"":wert)});
  if(!canWrite()) inp.disabled=true;
  inp.addEventListener("change",function(){ setzen(null,inp.value); });
  row.appendChild(inp);
  if(zusatz) row.appendChild(el("span",{class:"vmax",text:zusatz}));
  if(canWrite()) row.appendChild(el("button",{class:"vbtn",type:"button",
    "aria-label":"plus",onclick:function(){ setzen(1); }},"+"));
  box.appendChild(row);
  return box;
}
function vitalPlain(label,wert,klasse){
  var box=el("div",{class:"vital"+(klasse?" "+klasse:"")});
  box.appendChild(el("div",{class:"vk",text:label}));
  box.appendChild(el("div",{class:"vv",text:String(wert)}));
  return box;
}
/* Punkte statt Zahlen für alles, was man abzählt: Trefferwürfel,
   Rettungswürfe, Inspiration. Antippen setzt und nimmt zurück. */
function pipRow(n,voll,aus,rund,klasse){
  var row=el("div",{class:"pips"+(klasse?" "+klasse:"")});
  for(var i=0;i<n;i++)(function(i){
    var b=el("button",{class:"pip"+(i<voll?"":" used")+(rund?" round":""),type:"button",
      "aria-pressed":String(i<voll)});
    if(canWrite()) b.addEventListener("click",function(){ aus(i<voll?i:i+1); });
    else b.disabled=true;
    row.appendChild(b);
  })(i);
  return row;
}

function elSheet(e,ifn,item){
  var st=statsOf(e), sb=st.card;
  var vit=(e.components||{})[VIT_COMP]||{};
  var sk=(e.components||{})[SKILL_COMP]||{};
  var ch=(e.components||{}).CharacterInfo||{};
  var prof=profOf(e);
  var wrap=el("div",{class:"sheet"});

  function schreibVit(patch){
    e.components=e.components||{};
    e.components[VIT_COMP]=Object.assign({},e.components[VIT_COMP]||{},patch);
    persist(e);
  }
  function stepper(key,d,roh,max){
    var cur=Number(vit[key]);
    if(!isFinite(cur)) cur=max!==undefined?max:0;
    var neu=roh!=null?Number(roh):cur+d;
    if(!isFinite(neu))return;
    if(max!==undefined) neu=Math.min(max,neu);
    schreibVit((function(o){o[key]=Math.max(0,neu);return o;})({}));
  }

  /* ---- Vitalleiste: immer sichtbar, immer antippbar ---- */
  var hpMax=Number(sb.hp)||0;
  var strip=el("div",{class:"vitals"});
  strip.appendChild(vitalStepper("HP",
    vit.hp===undefined?hpMax:vit.hp,
    function(d,roh){ stepper("hp",d,roh); },"hp",hpMax?"/"+hpMax:""));
  strip.appendChild(vitalStepper("Temp",vit.hpTemp||0,
    function(d,roh){ stepper("hpTemp",d,roh); },"tmp"));
  strip.appendChild(vitalPlain("AC",sb.ac==null?"—":sb.ac));
  strip.appendChild(vitalPlain("Init",sgn(modOf(sb,"dex"))));
  strip.appendChild(vitalPlain("Speed",sb.speed||"—"));
  strip.appendChild(vitalPlain("Prof",sgn(prof)));
  strip.appendChild(vitalPlain("Pass. per.",10+modOf(sb,"wis")+
    ((sk.proficient||[]).indexOf("perception")>=0?prof:0)));
  strip.appendChild(vitalStepper("Exhaustion",vit.exhaustion||0,
    function(d,roh){ stepper("exhaustion",d,roh); }));

  /* Trefferwürfel als Punkte: wie viele noch da sind, sieht man, ohne zu
     rechnen — und eine kurze Rast ist ein Tipp, kein Formular. */
  var hdMax=Number(ch.level)||Number(sb.hitDice)||0;
  if(hdMax){
    var hdBox=el("div",{class:"vital"});
    hdBox.appendChild(el("div",{class:"vk",text:"Hit dice"}));
    var hdLeft=vit.hitDiceLeft===undefined?hdMax:Number(vit.hitDiceLeft);
    hdBox.appendChild(pipRow(Math.min(12,hdMax),hdLeft,function(n){
      schreibVit({hitDiceLeft:n}); }));
    strip.appendChild(hdBox);
  }
  var dsBox=el("div",{class:"vital"});
  dsBox.appendChild(el("div",{class:"vk",text:"Death saves"}));
  var ds=el("div",{class:"dsrow"});
  ds.appendChild(pipRow(3,Number(vit.deathSuccess)||0,function(n){
    schreibVit({deathSuccess:n}); },true,"ok"));
  ds.appendChild(pipRow(3,Number(vit.deathFail)||0,function(n){
    schreibVit({deathFail:n}); },true,"bad"));
  dsBox.appendChild(ds);
  strip.appendChild(dsBox);

  var inspBox=el("div",{class:"vital"});
  inspBox.appendChild(el("div",{class:"vk",text:"Inspiration"}));
  inspBox.appendChild(pipRow(1,vit.inspiration?1:0,function(n){
    schreibVit({inspiration:n>0}); },true,"insp"));
  strip.appendChild(inspBox);
  wrap.appendChild(strip);

  /* ---- Rasten: die Regel steht im Code, aber sie steht auch daneben ---- */
  if(canWrite()){
    var rest=el("div",{class:"rowbtns"});
    rest.appendChild(el("button",{class:"btn sm",type:"button",
      title:"Spend one hit die: heal the die's average plus your CON modifier",
      onclick:function(){
        var links=vit.hitDiceLeft===undefined?hdMax:Number(vit.hitDiceLeft);
        if(links<=0){ UI.err="No hit dice left."; render(); return; }
        var wuerfel=Number(String(sb.hpFormula||"1d8").split("d")[1])||8;
        var heil=Math.max(1,Math.floor(wuerfel/2)+1+modOf(sb,"con"));
        var jetzt=vit.hp===undefined?hpMax:Number(vit.hp);
        schreibVit({hitDiceLeft:links-1,hp:Math.min(hpMax||jetzt+heil,jetzt+heil)});
      }},"Short rest"));
    rest.appendChild(el("button",{class:"btn sm",type:"button",
      title:"Full HP, half the hit dice back, death saves cleared, one step less exhaustion",
      onclick:function(){
        schreibVit({hp:hpMax||undefined,hpTemp:0,
          hitDiceLeft:Math.min(hdMax,(vit.hitDiceLeft===undefined?hdMax:Number(vit.hitDiceLeft))+Math.max(1,Math.floor(hdMax/2))),
          deathSuccess:0,deathFail:0,
          exhaustion:Math.max(0,(Number(vit.exhaustion)||0)-1)});
      }},"Long rest"));
    rest.appendChild(el("button",{class:"btn sm gh",type:"button",
      title:"One more natural 1 for the tally",
      onclick:function(){ schreibVit({nat1:(Number(vit.nat1)||0)+1}); }},
      "Nat 1 · "+(Number(vit.nat1)||0)));
    wrap.appendChild(rest);
  }

  /* ---- Zustände ---- */
  var zust=el("div",{class:"condrow"});
  var aktiv=vit.conditions||[];
  conditionList().forEach(function(c){
    var an=aktiv.indexOf(c)>=0;
    var b=el("button",{class:"chip pick"+(an?" on":""),type:"button","aria-pressed":String(an)},c);
    if(canWrite()) b.addEventListener("click",function(){
      var neu=an?aktiv.filter(function(x){return x!==c;}):aktiv.concat([c]);
      schreibVit({conditions:neu});
    });
    else b.disabled=true;
    zust.appendChild(b);
  });
  wrap.appendChild(el("div",{class:"sec",text:"Conditions"}));
  wrap.appendChild(zust);

  /* ---- Attribute und Rettungswürfe ---- */
  wrap.appendChild(el("div",{class:"sec",text:"Abilities"}));
  var ab=el("div",{class:"abgrid"});
  ATTR6.forEach(function(a){
    var box=el("div",{class:"ability"});
    box.appendChild(el("div",{class:"k",text:a.toUpperCase()}));
    box.appendChild(el("div",{class:"score",text:sb[a]==null?"—":String(sb[a])}));
    box.appendChild(el("div",{class:"mod",text:sgn(modOf(sb,a))}));
    var geuebt=(sk.saves||[]).indexOf(a)>=0;
    var sv=el("button",{class:"save"+(geuebt?" on":""),type:"button",
      title:"Saving throw"+(geuebt?" (proficient)":"")},
      "save "+sgn(modOf(sb,a)+(geuebt?prof:0)));
    if(canWrite()) sv.addEventListener("click",function(){
      var liste=sk.saves||[];
      var neu=geuebt?liste.filter(function(x){return x!==a;}):liste.concat([a]);
      e.components[SKILL_COMP]=Object.assign({},sk,{saves:neu});
      persist(e);
    });
    else sv.disabled=true;
    box.appendChild(sv);
    ab.appendChild(box);
  });
  wrap.appendChild(ab);

  /* ---- Fertigkeiten: Punkt an, Punkt aus ---- */
  wrap.appendChild(el("div",{class:"sec",text:"Skills"}));
  var sg=el("div",{class:"skillgrid"});
  var pl=sk.proficient||[], ex=sk.expertise||[];
  skillList().forEach(function(s2){
    var stufe=ex.indexOf(s2.key)>=0?2:(pl.indexOf(s2.key)>=0?1:0);
    var wert=modOf(sb,s2.attr)+prof*stufe;
    var row=el("div",{class:"skillrow"});
    var dot=el("button",{class:"sdot s"+stufe,type:"button",
      title:["not proficient","proficient","expertise"][stufe]});
    if(canWrite()) dot.addEventListener("click",function(){
      var np=pl.filter(function(x){return x!==s2.key;});
      var ne=ex.filter(function(x){return x!==s2.key;});
      if(stufe===0) np.push(s2.key);
      else if(stufe===1) ne.push(s2.key);
      e.components[SKILL_COMP]=Object.assign({},sk,{proficient:np,expertise:ne});
      persist(e);
    });
    else dot.disabled=true;
    row.appendChild(dot);
    row.appendChild(el("span",{class:"sname",text:humanKey(s2.key)}));
    row.appendChild(el("span",{class:"srule"}));
    row.appendChild(el("span",{class:"sattr",text:s2.attr.toUpperCase()}));
    row.appendChild(el("span",{class:"smod",text:sgn(wert)}));
    sg.appendChild(row);
  });
  wrap.appendChild(sg);

  /* ---- Angriffe: was getragen wird, nicht was eingetippt wurde ---- */
  var waffen=carriedItems(e).filter(function(x){ return (x.item.components||{}).WeaponInfo; });
  if(waffen.length){
    wrap.appendChild(el("div",{class:"sec",text:"Attacks"}));
    var tb=el("table",{class:"atk"});
    var hd=el("tr");
    ["Weapon","Where","To hit","Damage","Notes"].forEach(function(h){ hd.appendChild(el("th",{text:h})); });
    tb.appendChild(hd);
    waffen.forEach(function(w){
      var wi=(w.item.components||{}).WeaponInfo||{};
      var fern=/fern|ranged|wurf|thrown/i.test(String(wi.range||"")+" "+String(wi.Properties||""));
      var attr=fern?"dex":"str";
      /* Finesse nimmt den besseren der beiden — dieselbe Regel wie am Tisch. */
      if(/finesse|finess/i.test(String(wi.Properties||""))&&modOf(sb,"dex")>modOf(sb,"str")) attr="dex";
      var row=el("tr",{class:w.tier==="worn"||w.tier==="held"?"equipped":w.tier});
      var c1=el("td");
      c1.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:w.item.id});}},nameOf(w.item)));
      row.appendChild(c1);
      row.appendChild(el("td",{class:"note",text:w.tier}));
      row.appendChild(el("td",{class:"num",text:sgn(modOf(sb,attr)+prof)}));
      row.appendChild(el("td",{class:"num",
        text:(wi.damage||"—")+(modOf(sb,attr)?" "+sgn(modOf(sb,attr)):"")+
             (wi.damageType?" "+wi.damageType:"")}));
      row.appendChild(el("td",{class:"note",text:wi.Properties||wi.range||""}));
      tb.appendChild(row);
    });
    wrap.appendChild(tb);
  }

  if(!Object.keys(sb).length) wrap.appendChild(el("p",{class:"hint",
    text:"No numbers yet — give this article a StatblockInfo card, or link a statblock to it."}));
  return wrap;
}

/* ---------- Karten (REQ-130 bis 136) ----------
   Eine Karte ist ein Bild plus ein Gitter plus das, was darauf liegt. Das
   Darauf sind Kanten mit Koordinaten, keine Felder: ein Token zeigt auf
   einen Artikel, also öffnet ein Klick den Artikel, und „auf welchen Karten
   kommt der Baron vor?" ist ein Rückbezug wie jeder andere.

   Koordinaten stehen in Anteilen von 0 bis 1, nicht in Bildpunkten. Ein Bild
   darf dadurch ersetzt, verkleinert oder neu ausgeschnitten werden, ohne
   dass jeder Marker wandert — und dieselbe Karte trägt auf dem Telefon und
   am Bildschirm dieselben Stellen. */
var MAP_IFACE="Map", MAP_COMP="MapInfo",
    REL_MARKER="marker", REL_MAPOF="mapOf", REL_INSIDE="insideMap";

var TOKEN_KINDS=[
  ["static","Marker"],["scenery","Scenery"],["party","Party"],
  ["quest","Quest"],["play","In play"]
];
function tokenKind(r){ return (r.props&&r.props.kind)||"static"; }
function mapCard(e){ return (e.components||{})[MAP_COMP]||{}; }

/* Die Karten, die in dieser hier liegen — die Gegenrichtung von `insideMap`.
   Gespeichert wird nur vorwärts; das Kind nennt sein Elternteil. */
function childMaps(e){
  var out=[];
  ENT.forEach(function(o){
    (o.relations||[]).forEach(function(r){
      if(r.type===REL_INSIDE&&r.to===e.id) out.push({map:o,rel:r});
    });
  });
  return out;
}
function parentMap(e){
  var r=(e.relations||[]).filter(function(x){return x.type===REL_INSIDE;})[0];
  return r?ENT.get(r.to):null;
}

/* Das Gitter als Überlagerung. Quadrate zeichnet ein Verlauf, Hexfelder ein
   SVG-Muster — beides über dem Bild und ohne Mausfang, damit ein Klick auf
   das Gitter die Karte trifft und nicht das Gitter. */
function gridOverlay(card,zoom){
  var form=card.gridShape||"none";
  if(form==="none")return null;
  var g=Math.max(4,Number(card.gridSize)||70)*zoom;
  var ox=(Number(card.gridOffsetX)||0)*zoom, oy=(Number(card.gridOffsetY)||0)*zoom;
  var lay=el("div",{class:"mgrid"});
  if(form==="square"){
    lay.style.backgroundImage=
      "linear-gradient(to right,var(--gridline) 1px,transparent 1px),"+
      "linear-gradient(to bottom,var(--gridline) 1px,transparent 1px)";
    lay.style.backgroundSize=g+"px "+g+"px";
    lay.style.backgroundPosition=ox+"px "+oy+"px";
  } else {
    /* Hex: Breite w, Höhe h = w*2/sqrt(3); die Kachel wiederholt sich nach
       drei Halbreihen. Ein Muster statt gezeichneter Felder — sonst hinge
       die Anzahl Knoten an der Bildgrösse. */
    var w=g, h=g*1.1547;
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+(h*1.5)+'" '+
      'viewBox="0 0 100 173.2">'+
      '<path d="M50 0 L100 28.9 L100 86.6 L50 115.5 L0 86.6 L0 28.9 Z" fill="none" '+
      'stroke="rgba(128,128,128,0.45)" stroke-width="3"/>'+
      '<path d="M100 86.6 L100 144.3 M0 86.6 L0 144.3 M50 115.5 L50 173.2" '+
      'fill="none" stroke="rgba(128,128,128,0.45)" stroke-width="3"/></svg>';
    lay.style.backgroundImage="url(\"data:image/svg+xml;utf8,"+encodeURIComponent(svg)+"\")";
    lay.style.backgroundSize=w+"px "+(h*1.5)+"px";
    lay.style.backgroundPosition=ox+"px "+oy+"px";
  }
  return lay;
}

/* ---------- Nebel, Licht und Sicht, Gebiete (REQ-138, 139, 140, 193) ----------
   Drei Dinge, die gern verwechselt werden, weil sie alle etwas zudecken:

   **Nebel** ist, was die Gruppe noch nie gesehen hat. Er wird aufgedeckt und
   bleibt aufgedeckt; er gehört zur Karte und wird gespeichert.
   **Licht** ist, was sie gerade sieht. Es hängt an den Lichtern auf der Karte
   und an den Wänden dazwischen, ändert sich mit jedem Zug und wird nie
   gespeichert — es wird bei jeder Zeichnung neu gerechnet, wie jeder
   abgeleitete Wert (D8).
   **Gebiet** ist, wem etwas gehört. Es zeigt auf einen Artikel, also ist es
   eine Kante; Nebel und Wände zeigen auf nichts, also sind sie Felder.

   Alles in Anteilen, nie in Bildpunkten (dieselbe Entscheidung wie bei den
   Tokens): eine Karte, die neu ausgeschnitten wird, verliert sonst jede
   aufgedeckte Ecke.

   Für die Spielleitung ist Zugedecktes durchscheinend — sie muss sehen, was
   sie zudeckt. Für alle anderen ist es zu. Und solange die Seite die Grösse
   des Bildes nicht kennt, deckt sie alles zu: ein Nebel, der zu spät kommt,
   ist kein Nebel. */
var REL_TERRITORY="territory", SVGNS="http://www.w3.org/2000/svg";
function sv(t,a,kids){
  var n=document.createElementNS(SVGNS,t);
  if(a)for(var k in a){ if(a[k]!=null&&a[k]!==false) n.setAttribute(k,a[k]); }
  if(kids)(Array.isArray(kids)?kids:[kids]).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}

/* Die natürliche Grösse des Kartenbildes. Sie wird gebraucht, weil der
   Lichtradius in Quadraten steht und die Gitterweite in Bildpunkten — ohne
   die Breite des Bildes lässt sich das eine nicht ins andere rechnen. */
var mapNat={};
function natOf(src){ return mapNat[src]||null; }
/* Zuerst gefragt wird das Register: ein Asset trägt seine Masse als Feld,
   und ein Wert, der da steht, muss nicht gemessen werden. Gemessen wird nur,
   was von aussen kommt — eine Adresse, die niemand beschrieben hat. */
function natFor(card,src){
  var a=card&&card.image&&ENT.get(card.image);
  var ai=a&&(a.components||{}).AssetInfo;
  if(ai&&Number(ai.width)>0&&Number(ai.height)>0)
    return {w:Number(ai.width),h:Number(ai.height)};
  return natOf(src);
}
function noteNat(src,w,h){
  if(!src||!w||!h)return;
  var alt=mapNat[src];
  if(alt&&alt.w===w&&alt.h===h)return;
  mapNat[src]={w:w,h:h};
  render();
}

/* ---- Geometrie: ein Strahl, eine Wand ---- */
function rayHit(ox,oy,dx,dy,walls,max){
  var best=max;
  for(var i=0;i<walls.length;i++){
    var w=walls[i], rx=w.x2-w.x1, ry=w.y2-w.y1;
    var den=dx*ry-dy*rx;
    if(den>-1e-12&&den<1e-12)continue;              /* parallel */
    var ax=w.x1-ox, ay=w.y1-oy;
    var t1=(ax*ry-ay*rx)/den;                       /* entlang des Strahls */
    var t2=(ax*dy-ay*dx)/den;                       /* entlang der Wand */
    if(t1>=0&&t1<best&&t2>=0&&t2<=1) best=t1;
  }
  return best;
}
function segDist(px,py,w){
  var rx=w.x2-w.x1, ry=w.y2-w.y1, l2=rx*rx+ry*ry;
  if(l2<1e-12) return Math.sqrt((px-w.x1)*(px-w.x1)+(py-w.y1)*(py-w.y1));
  var t=Math.max(0,Math.min(1,((px-w.x1)*rx+(py-w.y1)*ry)/l2));
  var qx=w.x1+t*rx-px, qy=w.y1+t*ry-py;
  return Math.sqrt(qx*qx+qy*qy);
}
/* Das Sichtbarkeitspolygon (REQ-140). Strahlen zu jeder Wandecke — knapp
   daneben auf beiden Seiten, sonst hat der Schatten keine Kante — und dazu
   ein Kranz, damit der Rand des Lichtkreises rund bleibt. Wände, die den
   Kreis nicht berühren, werden gar nicht erst geprüft. */
function visionPoly(lx,ly,rad,walls){
  var nah=[], winkel=[];
  for(var i=0;i<walls.length;i++){
    if(segDist(lx,ly,walls[i])>rad)continue;
    nah.push(walls[i]);
    var ecken=[[walls[i].x1,walls[i].y1],[walls[i].x2,walls[i].y2]];
    for(var j=0;j<2;j++){
      var a=Math.atan2(ecken[j][1]-ly,ecken[j][0]-lx);
      winkel.push(a-0.0007,a,a+0.0007);
    }
  }
  var n=nah.length?48:24;
  for(var k=0;k<n;k++) winkel.push(-Math.PI+k*2*Math.PI/n);
  winkel.sort(function(a,b){return a-b;});
  var pts=[];
  for(var m=0;m<winkel.length;m++){
    var dx=Math.cos(winkel[m]), dy=Math.sin(winkel[m]);
    var t=rayHit(lx,ly,dx,dy,nah,rad);
    pts.push([lx+dx*t,ly+dy*t]);
  }
  return pts;
}
function polyAttr(pts){
  return pts.map(function(p){ return (Math.round(p[0]*10000)/10000)+","+(Math.round(p[1]*10000)/10000); }).join(" ");
}

/* ---- Formen: Anteile hinein, Quadrateinheiten heraus ---- */
/* Gezeichnet wird in einem Raum, in dem ein Schritt nach rechts so lang ist
   wie einer nach unten (x von 0 bis 1, y von 0 bis ar). Sonst wäre jeder
   Lichtkreis auf einer breiten Karte ein Ei. */
function shapeNode(s,ar,attrs){
  var a=Object.assign({},attrs||{});
  if(s.kind==="circle"){
    a.cx=s.x; a.cy=(s.y||0)*ar; a.r=Math.max(0.001,Number(s.r)||0.05);
    return sv("circle",a);
  }
  if(s.kind==="poly"&&(s.pts||[]).length>2){
    a.points=(s.pts||[]).map(function(p){ return p[0]+","+(p[1]*ar); }).join(" ");
    return sv("polygon",a);
  }
  a.x=Math.min(s.x,s.x+(s.w||0)); a.y=Math.min(s.y,s.y+(s.h||0))*ar;
  a.width=Math.abs(s.w||0); a.height=Math.abs(s.h||0)*ar;
  return sv("rect",a);
}
function inShape(s,x,y){
  if(s.kind==="circle"){
    var dx=x-s.x, dy=y-(s.y||0);
    return dx*dx+dy*dy<=(Number(s.r)||0)*(Number(s.r)||0);
  }
  if(s.kind==="poly"){
    var p=s.pts||[], drin=false;
    for(var i=0,j=p.length-1;i<p.length;j=i++){
      if(((p[i][1]>y)!==(p[j][1]>y))&&
         (x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1]+1e-12)+p[i][0])) drin=!drin;
    }
    return drin;
  }
  var x0=Math.min(s.x,s.x+(s.w||0)), x1=Math.max(s.x,s.x+(s.w||0));
  var y0=Math.min(s.y,s.y+(s.h||0)), y1=Math.max(s.y,s.y+(s.h||0));
  return x>=x0&&x<=x1&&y>=y0&&y<=y1;
}

/* ---- Was leuchtet ---- */
/* Ein Licht ist keine eigene Artikelart: es ist ein Token, an dessen Kante
   ein Radius steht. Eine Laterne auf der Karte ist eine Laterne auf der
   Karte — und was sie beleuchtet, hängt an beiden Enden, also an der Kante
   (dieselbe Regel wie bei der Tragestufe im Inventar). */
function mapLights(e,card,nat){
  var g=Math.max(4,Number(card.gridSize)||70), out=[];
  (e.relations||[]).forEach(function(r){
    if(r.type!==REL_MARKER)return;
    var pr=r.props||{};
    var hell=Number(pr.light)||0, matt=Number(pr.dim)||0;
    if(hell<=0&&matt<=0)return;
    out.push({x:Number(pr.x)||0.5,y:Number(pr.y)||0.5,
      bright:hell*g/nat.w, dim:Math.max(matt,hell)*g/nat.w});
  });
  return out;
}
/* ---- Sperren: Wand, Tür, Fenster, Abgrund ----
   Eine Sperre hält Blick, Schritt, beides oder — bei einer offenen Tür —
   nichts. Das steht an der Sperre selbst und nicht in vier Listen, die
   dasselbe meinen: wer eine Tür zur Wand macht, ändert ein Feld und nicht
   den Ort des Eintrags.

   Die Bewegung wertet noch niemand aus — es gibt keine Zugrechnung. Sie
   steht trotzdem hier, weil eine Tür, die man erst beim Bewegungssystem
   als Tür erfasst, bis dahin als Wand gezeichnet wird und die Karte
   zweimal gebaut werden muss. */
/* Schlüssel, Name, Farbe, durchsichtig, hält den Schritt. */
var WALL_KINDS=[
  ["wall",  "Wall",   "#e2554a", false, true],
  ["door",  "Door",   "#d99a2b", false, true],
  ["window","Window", "#4aa3e2", true,  true],
  ["chasm", "Chasm",  "#8a6bd1", true,  true]
];
function wallKind(w){
  var k=(w&&w.kind)||"wall";
  for(var i=0;i<WALL_KINDS.length;i++) if(WALL_KINDS[i][0]===k)return WALL_KINDS[i];
  return WALL_KINDS[0];
}
/* Eine offene Tür ist keine Sperre. Alles andere kennt `open` nicht — ein
   offenes Fenster bleibt ein Fenster, und ein Abgrund lässt sich nicht
   aufklappen. */
function wallOpen(w){ return (w&&w.kind)==="door"&&!!w.open; }
function blocksSight(w){ return !wallOpen(w)&&!wallKind(w)[3]; }
function blocksMove(w){ return !wallOpen(w)&&!!wallKind(w)[4]; }

/* Was das Sichtbarkeitspolygon kennt: nur, was den Blick hält. Ein Fenster
   steht auf der Karte und im Weg, aber nicht im Licht. */
function mapWalls(card,ar){
  return (card.walls||[]).filter(blocksSight).map(function(w){
    return {id:w.id,x1:Number(w.x1)||0,y1:(Number(w.y1)||0)*ar,
            x2:Number(w.x2)||0,y2:(Number(w.y2)||0)*ar};
  });
}
/* Was den Schritt hält. Noch wertet es niemand aus; die Abfrage steht, damit
   das Bewegungssystem sie nicht erfinden muss. */
function mapBarriers(card,ar){
  return (card.walls||[]).filter(blocksMove).map(function(w){
    return {id:w.id,kind:wallKind(w)[0],x1:Number(w.x1)||0,y1:(Number(w.y1)||0)*ar,
            x2:Number(w.x2)||0,y2:(Number(w.y2)||0)*ar};
  });
}
/* Gezeichnet wird jede Sperre, auch die offene Tür — die Spielleitung baut
   die Karte und muss sehen, was sie gebaut hat. Wer nur mitspielt, sieht
   keine: für ihn ist die Wand der Grund, warum es dahinter dunkel ist. */
function wallLines(card,ar){
  return (card.walls||[]).map(function(w){
    var k=wallKind(w);
    return {id:w.id,kind:k[0],label:k[1],color:k[2],open:wallOpen(w),
            x1:Number(w.x1)||0,y1:(Number(w.y1)||0)*ar,
            x2:Number(w.x2)||0,y2:(Number(w.y2)||0)*ar};
  });
}

/* ---- Zeichenebenen ----
   Ein Kartenblatt je Ebene, das unterste ist das Kartenbild selbst. Es
   steht in `image` und nicht als erster Eintrag in `sheets`, weil die
   natürliche Grösse an ihm hängt und eine Karte ohne unterstes Blatt keine
   Karte ist. Die Leiste zeigt trotzdem beides in einer Liste — dort ist es
   eine Ebene wie jede andere.

   Oben in der Liste heisst obenauf: gezeichnet wird von hinten nach vorn,
   also die Liste rückwärts. Eine Reihenfolge, die im Feld anders herum
   steht als auf dem Schirm, sortiert früher oder später jemand falsch. */
function mapSheets(e,card){
  var out=[{id:"__base",name:"Base map",image:card.image,opacity:1,
            visible:!card.baseHidden,gmOnly:!!card.baseGmOnly,base:true}];
  (card.sheets||[]).forEach(function(s){
    out.push({id:s.id,name:s.name||"Layer",image:s.image,
      opacity:s.opacity==null?1:Number(s.opacity),
      visible:s.visible!==false,gmOnly:!!s.gmOnly,base:false});
  });
  return out;
}
/* Was gezeichnet wird: sichtbar, mit Bild, und für Spieler ohne die Blätter,
   die der Spielleitung gehören. Zurückgehalten wird hier in der Seite, weil
   die Seite keinen Server hat — im echten Stapel tut es `redactEntity`. */
function drawnSheets(e,card){
  var gm=isGM();
  return mapSheets(e,card).filter(function(s){
    return s.visible&&s.image&&(gm||!s.gmOnly);
  });
}

/* ---- Die Überlagerung ---- */
function visionOverlay(e,card,nat){
  var ar=nat.h/nat.w;
  var nebel=!!card.fog, licht=card.lighting||"bright";
  var terr=(e.relations||[]).filter(function(r){ return r.type===REL_TERRITORY; });
  /* Die Sperren sieht nur, wer sie setzen darf. Sie sind aber auch bei
     Tageslicht zu zeichnen — wer eine Battlemap baut, baut sie am hellen
     Tag und will sehen, wo die Wände stehen. */
  var bau=isGM()&&canWrite()&&(card.walls||[]).length>0;
  if(!nebel&&licht==="bright"&&!terr.length&&!bau)return null;

  var svg=sv("svg",{"class":"mvis",viewBox:"0 0 1 "+ar,preserveAspectRatio:"none"});
  var defs=sv("defs"); svg.appendChild(defs);
  var gm=isGM();

  /* Gebiete zuerst, damit Nebel und Dunkelheit darüber liegen — wem ein Feld
     gehört, ist eine Frage der Karte und keine des Augenblicks. */
  if(terr.length){
    var g=Math.max(4,Number(card.gridSize)||70);
    var cols=Math.max(1,Math.round(nat.w/g)), rows=Math.max(1,Math.round(nat.h/g));
    var deckel=cols*rows<=20000;
    terr.forEach(function(r){
      var ziel=ENT.get(r.to);
      if(ziel&&!articleVisible(ziel))return;
      var pr=r.props||{};
      var farbe=pr.color||"#7a5cff";
      var grp=sv("g",{"class":"mterr",fill:farbe,"fill-opacity":pr.opacity!=null?pr.opacity:0.18,
        stroke:farbe,"stroke-opacity":0.5,"stroke-width":0.0015});
      if(deckel&&(card.gridShape==="square")){
        /* Gerastert (REQ-193): gefüllt wird, welches Feld mit seiner Mitte
           in der Form liegt. Am Tisch zählt „welche Quadrate sind unsere",
           nicht wo die Linie genau verläuft. */
        for(var cy=0;cy<rows;cy++)for(var cx=0;cx<cols;cx++){
          var mx=(cx+0.5)/cols, my=(cy+0.5)/rows;
          if(!inShape(pr,mx,my))continue;
          grp.appendChild(sv("rect",{x:cx/cols,y:(cy/rows)*ar,
            width:1/cols,height:(1/rows)*ar}));
        }
      } else {
        grp.appendChild(shapeNode(pr,ar,{}));
      }
      if(ziel){ var tt=sv("title"); tt.textContent=nameOf(ziel); grp.appendChild(tt); }
      svg.appendChild(grp);
    });
  }

  /* Dunkelheit: die Lichter stanzen ihr Sichtbarkeitspolygon heraus. Ohne
     ein einziges Licht bleibt sie ganz — das ist keine Panne, sondern eine
     dunkle Karte. */
  if(licht!=="bright"){
    var walls=mapWalls(card,ar), lichter=mapLights(e,card,nat);
    var mid="dark_"+uid("m");
    var maske=sv("mask",{id:mid});
    maske.appendChild(sv("rect",{x:0,y:0,width:1,height:ar,fill:"#fff"}));
    lichter.forEach(function(l){
      var lx=l.x, ly=l.y*ar;
      if(l.dim>0) maske.appendChild(sv("polygon",
        {points:polyAttr(visionPoly(lx,ly,l.dim,walls)),fill:"#808080"}));
      if(l.bright>0) maske.appendChild(sv("polygon",
        {points:polyAttr(visionPoly(lx,ly,l.bright,walls)),fill:"#000"}));
    });
    defs.appendChild(maske);
    svg.appendChild(sv("rect",{x:0,y:0,width:1,height:ar,
      fill:licht==="dark"?"#05070d":"#0b1020",
      "fill-opacity":gm?0.42:(licht==="dark"?0.94:0.6),
      mask:"url(#"+mid+")"}));
  }

  /* Nebel: zugedeckt ist alles, was keine aufgedeckte Form berührt. */
  if(nebel){
    var fid="fog_"+uid("m");
    var fm=sv("mask",{id:fid});
    fm.appendChild(sv("rect",{x:0,y:0,width:1,height:ar,fill:"#fff"}));
    (card.reveal||[]).forEach(function(s){ fm.appendChild(shapeNode(s,ar,{fill:"#000"})); });
    defs.appendChild(fm);
    svg.appendChild(sv("rect",{x:0,y:0,width:1,height:ar,"class":"mfog",
      "fill-opacity":gm?0.5:1,mask:"url(#"+fid+")"}));
  }

  /* Die Sperren zuletzt und damit obenauf: für alle anderen sind sie der
     Grund, warum es dahinter dunkel ist, und sonst nichts. Eine offene Tür
     wird gestrichelt — sie steht da, hält aber nichts. */
  if(bau) wallLines(card,ar).forEach(function(w){
    var n=sv("line",{"class":"mwall k-"+w.kind,x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2,
      stroke:w.color});
    if(w.open||w.kind==="window") n.setAttribute("stroke-dasharray","0.012 0.008");
    var tt=sv("title"); tt.textContent=w.label+(w.open?" (open)":"");
    n.appendChild(tt);
    svg.appendChild(n);
  });
  return svg;
}

/* ---- Zeichnen: was die Spielleitung aufdeckt und zumauert ---- */
var MAP_TOOLS=[["reveal","Reveal"],["hide","Hide"],["wall","Barrier"],
               ["area","Sub-map"],["erase","Erase"]];
function mapToolLayer(e,card,img){
  var lay=el("div",{class:"mdraw t-"+UI.mapTool});
  var von=null, vorschau=null;
  function punkt(ev){
    var rect=img.getBoundingClientRect();
    if(!rect.width||!rect.height)return null;
    return {x:Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width)),
            y:Math.min(1,Math.max(0,(ev.clientY-rect.top)/rect.height))};
  }
  lay.addEventListener("pointerdown",function(ev){
    var p=punkt(ev); if(!p)return;
    von=p; ev.preventDefault();
    try{ lay.setPointerCapture(ev.pointerId); }catch(x){}
    vorschau=el("div",{class:"mprev"+(UI.mapTool==="wall"?" line":"")+
      (UI.mapTool==="area"?" area":"")});
    lay.appendChild(vorschau);
  });
  lay.addEventListener("pointermove",function(ev){
    if(!von||!vorschau)return;
    var p=punkt(ev); if(!p)return;
    if(UI.mapTool==="wall"){
      var dx=(p.x-von.x), dy=(p.y-von.y);
      var rect=img.getBoundingClientRect();
      var lx=dx*rect.width, ly=dy*rect.height;
      vorschau.style.left=(von.x*100)+"%"; vorschau.style.top=(von.y*100)+"%";
      vorschau.style.width=Math.sqrt(lx*lx+ly*ly)+"px";
      vorschau.style.transform="rotate("+Math.atan2(ly,lx)+"rad)";
    } else {
      vorschau.style.left=(Math.min(von.x,p.x)*100)+"%";
      vorschau.style.top=(Math.min(von.y,p.y)*100)+"%";
      vorschau.style.width=(Math.abs(p.x-von.x)*100)+"%";
      vorschau.style.height=(Math.abs(p.y-von.y)*100)+"%";
    }
  });
  lay.addEventListener("pointerup",function(ev){
    var p=punkt(ev), a=von; von=null;
    if(vorschau){ vorschau.remove(); vorschau=null; }
    if(!a||!p)return;
    try{ lay.releasePointerCapture(ev.pointerId); }catch(x){}
    applyMapTool(e,card,a,p);
  });
  return lay;
}
function applyMapTool(e,card,a,b){
  var t=UI.mapTool, winzig=Math.abs(b.x-a.x)<0.005&&Math.abs(b.y-a.y)<0.005;
  if(t==="wall"){
    /* Ziehen baut, ein Klick schaltet. Eine Tür, die man nur über ein Menü
       aufbekommt, bleibt am Tisch zu. */
    if(winzig){
      var tuer=null, nah=0.02;
      (card.walls||[]).forEach(function(w){
        if((w.kind||"wall")!=="door")return;
        var d=segDist(a.x,a.y,{x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2});
        if(d<nah){ nah=d; tuer=w; }
      });
      if(!tuer)return;
      card.walls=(card.walls||[]).map(function(w){
        return w.id===tuer.id?Object.assign({},w,{open:!w.open}):w; });
    } else {
      card.walls=(card.walls||[]).concat([{id:uid("w"),kind:UI.wallKind||"wall",
        x1:a.x,y1:a.y,x2:b.x,y2:b.y}]);
    }
  } else if(t==="area"){
    /* Der Rahmen einer Unterkarte wird aufgezogen und nicht in die Mitte
       gelegt: eine Karte, die zeigt, *wo* sie liegt, ist der halbe Zweck
       der Verschachtelung. */
    if(winzig)return;
    addSubmap(e,{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),
      w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)});
    return;
  } else if(t==="reveal"){
    if(winzig)return;
    card.reveal=(card.reveal||[]).concat([{id:uid("s"),kind:"rect",
      x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),
      w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)}]);
    card.fog=true;
  } else if(t==="hide"){
    if(winzig)return;
    var kasten={kind:"rect",x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),
      w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)};
    /* Zudecken heisst hier: was in diesem Kasten liegt, gilt nicht mehr als
       aufgedeckt. Ein Loch in eine Form zu schneiden ginge auch, wäre aber
       eine Form, die niemand mehr von Hand versteht. */
    card.reveal=(card.reveal||[]).filter(function(s){
      return !inShape(kasten,s.kind==="circle"?s.x:(s.x+(s.w||0)/2),
                             s.kind==="circle"?s.y:(s.y+(s.h||0)/2));
    });
  } else if(t==="erase"){
    var best=null, weit=0.02;
    (card.walls||[]).forEach(function(w){
      var d=segDist(a.x,a.y,{x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2});
      if(d<weit){ weit=d; best={art:"wall",id:w.id}; }
    });
    if(!best) (card.reveal||[]).forEach(function(s){
      if(inShape(s,a.x,a.y)) best={art:"reveal",id:s.id};
    });
    if(!best)return;
    if(best.art==="wall") card.walls=(card.walls||[]).filter(function(w){return w.id!==best.id;});
    else card.reveal=(card.reveal||[]).filter(function(s){return s.id!==best.id;});
  } else return;
  e.components=e.components||{};
  e.components[MAP_COMP]=card;
  persist(e);
}

/* Die Ebenenleiste. Eine Zeile je Zeichenebene, oben ist obenauf.

   Das unterste Blatt ist das Kartenbild selbst und lässt sich weder
   entfernen noch verschieben — an ihm hängt die Grösse. Es lässt sich
   ausblenden: wer ein Gelände über eine Skizze legt, will die Skizze
   danach weghaben, ohne sie zu verlieren. */
function sheetRow(e,card,sh,i,n){
  var zeile=el("div",{class:"msheetrow"+(sh.base?" base":"")});

  var auge=el("input",{type:"checkbox",title:"Visible"});
  auge.checked=sh.visible;
  auge.addEventListener("change",function(){ setSheet(e,card,sh,{visible:auge.checked}); });
  zeile.appendChild(auge);

  var name=el("button",{class:"btn sm gh msname",type:"button",
    title:sh.base?"The map image":"Rename this layer",
    onclick:function(){
      if(sh.base){ setSheetImage(e,card,sh); return; }
      prompt1("Layer name",sh.name,function(v){ setSheet(e,card,sh,{name:v||"Layer"}); });
    }},sh.name);
  zeile.appendChild(name);

  zeile.appendChild(el("button",{class:"btn sm gh",type:"button",title:"Background image",
    onclick:function(){ setSheetImage(e,card,sh); }},sh.image?"image":"no image"));

  /* Deckkraft nur, wo sie etwas heisst: das unterste Blatt hat nichts, durch
     das es scheinen könnte. */
  if(!sh.base){
    var sl=el("input",{type:"range",min:"0",max:"1",step:"0.05",
      class:"msopacity",title:"Opacity"});
    sl.value=String(sh.opacity);
    sl.addEventListener("change",function(){ setSheet(e,card,sh,{opacity:Number(sl.value)}); });
    zeile.appendChild(sl);
  }

  var gm=el("button",{class:"btn sm"+(sh.gmOnly?" pri":" gh"),type:"button",
    title:sh.gmOnly?"Only the GM sees this layer":"Everyone sees this layer",
    onclick:function(){ setSheet(e,card,sh,{gmOnly:!sh.gmOnly}); }},sh.gmOnly?"GM":"all");
  zeile.appendChild(gm);

  if(!sh.base){
    zeile.appendChild(el("button",{class:"btn sm gh",type:"button",title:"Further up",
      disabled:i<=1,onclick:function(){ moveSheet(e,card,sh,-1); }},"\u2191"));
    zeile.appendChild(el("button",{class:"btn sm gh",type:"button",title:"Further down",
      disabled:i>=n-1,onclick:function(){ moveSheet(e,card,sh,1); }},"\u2193"));
    zeile.appendChild(el("button",{class:"btn sm gh",type:"button",title:"Remove this layer",
      onclick:function(){
        confirmDialog("Remove the layer \u201c"+sh.name+"\u201d? Its image stays an asset.",
          function(){
            card.sheets=(card.sheets||[]).filter(function(x){return x.id!==sh.id;});
            e.components[MAP_COMP]=card; persist(e);
          });
      }},"\u00d7"));
  }
  return zeile;
}
function setSheet(e,card,sh,patch){
  if(sh.base){
    /* Das unterste Blatt hat keinen eigenen Eintrag — es *ist* die Karte.
       Was an ihm einstellbar ist, steht deshalb an der Karte. */
    if(patch.visible!=null) card.baseHidden=!patch.visible;
    if(patch.gmOnly!=null) card.baseGmOnly=!!patch.gmOnly;
    if(patch.image!==undefined) card.image=patch.image;
  } else {
    card.sheets=(card.sheets||[]).map(function(x){
      return x.id===sh.id?Object.assign({},x,patch):x; });
  }
  e.components=e.components||{}; e.components[MAP_COMP]=card; persist(e);
}
function moveSheet(e,card,sh,d){
  var l=(card.sheets||[]).slice();
  var i=l.findIndex(function(x){return x.id===sh.id;});
  /* Die Liste wird rückwärts gezeichnet, also ist „hoch" in der Liste
     „später" im Feld. Ein Vorzeichen, das an einer Stelle steht statt an
     zweien. */
  var j=i-d;
  if(i<0||j<0||j>=l.length)return;
  var t=l[i]; l[i]=l[j]; l[j]=t;
  card.sheets=l; e.components[MAP_COMP]=card; persist(e);
}
function setSheetImage(e,card,sh){
  dialog("Background image \u2014 "+sh.name,function(host,close){
    var w=assetInput({},sh.image||"");
    host.appendChild(field("Image",w));
    actions(host,close,function(){ setSheet(e,card,sh,{image:w.value||undefined}); },"Set");
  });
}
function addSheet(e,card){
  prompt1("New layer","Layer "+((card.sheets||[]).length+1),function(v){
    card.sheets=(card.sheets||[]).concat([
      {id:uid("sh"),name:v||"Layer",opacity:1,visible:true,gmOnly:false}]);
    e.components=e.components||{}; e.components[MAP_COMP]=card; persist(e);
  });
}
function sheetTools(e,card){
  var box=el("div",{class:"msheets sub"});
  var kopf=el("div",{class:"maptools"});
  kopf.appendChild(el("strong",{class:"hint",style:"margin:0;align-self:center",text:"Layers"}));
  kopf.appendChild(el("button",{class:"btn sm",type:"button",
    onclick:function(){ addSheet(e,card); }},"+ Layer"));
  box.appendChild(kopf);
  var liste=mapSheets(e,card);
  /* Oben ist obenauf: gezeichnet wird von hinten nach vorn, also die Liste
     rückwärts. Wer sie vorwärts zeigte, müsste jedes Mal umdenken. */
  liste.slice().reverse().forEach(function(sh,i){
    box.appendChild(sheetRow(e,card,sh,i,liste.length));
  });
  return box;
}

/* Die Leiste dafür. Sie steht nur der Spielleitung offen und nur, wenn die
   Karte ein Bild hat — ein Nebelwerkzeug über einer leeren Fläche wäre
   ein Knopf, der nichts tut. */
function fogTools(e,card){
  var bar=el("div",{class:"maptools sub"});
  var an=el("label",{class:"task"});
  var cb=el("input",{type:"checkbox"});
  cb.checked=!!card.fog;
  cb.addEventListener("change",function(){
    card.fog=cb.checked; e.components[MAP_COMP]=card; persist(e); });
  an.appendChild(cb); an.appendChild(el("span",{text:"Fog"}));
  bar.appendChild(an);

  var sel=el("select",{class:"i",style:"width:auto",title:"Lighting"});
  [["bright","Daylight"],["dim","Dim"],["dark","Dark"]].forEach(function(o){
    sel.appendChild(el("option",{value:o[0]},o[1])); });
  sel.value=card.lighting||"bright";
  sel.addEventListener("change",function(){
    card.lighting=sel.value; e.components[MAP_COMP]=card; persist(e); });
  bar.appendChild(sel);

  MAP_TOOLS.forEach(function(t){
    bar.appendChild(el("button",{class:"btn sm"+(UI.mapTool===t[0]?" pri":""),type:"button",
      onclick:function(){ UI.mapTool=UI.mapTool===t[0]?"":t[0]; render(); }},t[1]));
    /* Die Art steht neben dem Werkzeug, das sie braucht, und nur dann.
       Eine Auswahl, die immer dasteht, fragt nach einer Antwort, die
       gerade niemand hat. */
    if(t[0]==="wall"&&UI.mapTool==="wall"){
      var art=el("select",{class:"i",style:"width:auto",title:"What kind of barrier"});
      WALL_KINDS.forEach(function(k){ art.appendChild(el("option",{value:k[0]},k[1])); });
      art.value=UI.wallKind||"wall";
      art.addEventListener("change",function(){ UI.wallKind=art.value; render(); });
      bar.appendChild(art);
    }
  });
  bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    title:"Reveal the whole map",
    onclick:function(){
      card.reveal=[{id:uid("s"),kind:"rect",x:0,y:0,w:1,h:1}];
      card.fog=true; e.components[MAP_COMP]=card; persist(e); }},"all"));
  bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    title:"Cover the whole map again",
    onclick:function(){
      confirmDialog("Cover the whole map again? Everything the party has uncovered goes back under.",
        function(){ card.reveal=[]; card.fog=true; e.components[MAP_COMP]=card; persist(e); });
    }},"none"));
  var n=(card.reveal||[]).length, w=(card.walls||[]).length;
  var tuer=(card.walls||[]).filter(function(x){return (x.kind||"wall")==="door";}).length;
  var wie=UI.mapTool==="wall"?" · drag to build, click a door to open or shut it":
          UI.mapTool==="area"?" · drag the frame the sub-map covers":
          UI.mapTool?" · drag on the map":"";
  bar.appendChild(el("span",{class:"hint",style:"margin:0;align-self:center",
    text:n+" uncovered · "+w+" barrier"+(w===1?"":"s")+
      (tuer?" ("+tuer+" door"+(tuer===1?"":"s")+")":"")+wie}));
  return bar;
}

/* Kartenkacheln (REQ-138). Ein Muster mit {x} und {y} statt eines Bildes —
   für Scans, die als ein Stück niemand lädt. Die natürliche Grösse steht
   dann fest, statt vom Laden abzuhängen. */
function tileGrid(card){
  var m=card.tiles; if(!m)return null;
