/* ---------- editing many at once ----------
   Everything here writes one article at a time through persist(); there is no
   bulk path in the store and inventing one would skip the same checks a
   single edit goes through. What it saves is the clicking, not the writing. */
function bulkBar(list){
  var ids=Object.keys(UI.picked);
  var bar=el("div",{class:"bulk"});

  var alle=ids.length===list.length&&list.length>0;
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    if(alle) UI.picked={};
    else list.forEach(function(e){ UI.picked[e.id]=1; });
    render();
  }},alle?"Select none":"Select all "+list.length));

  bar.appendChild(el("span",{class:"count",
    text:ids.length?ids.length+(ids.length===1?" selected":" selected"):"none selected"}));

  if(!ids.length){
    bar.appendChild(el("span",{class:"hint",style:"margin:0",
      text:"Click the rows you mean."}));
    return bar;
  }

  var gewaehlt=function(){ return ids.map(function(id){return ENT.get(id);}).filter(Boolean); };
  var durch=function(was,fn){
    var betroffen=gewaehlt();
    betroffen.forEach(fn);
    betroffen.forEach(function(e){ persist(e); });
    UI.picked={};
    UI.err=was+" — "+betroffen.length+(betroffen.length===1?" article":" articles")+".";
    render();
  };

  /* Tags */
  var tagIn=el("input",{class:"i",type:"text",placeholder:"tag, tag",style:"min-width:140px"});
  bar.appendChild(tagIn);
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var xs=tagIn.value.split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(!xs.length)return;
    durch("Tags added",function(e){
      e.tags=e.tags||[];
      xs.forEach(function(t){ if(e.tags.indexOf(t)<0) e.tags.push(t); });
    });
  }},"+ tags"));
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    var xs=tagIn.value.split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(!xs.length)return;
    durch("Tags removed",function(e){
      e.tags=(e.tags||[]).filter(function(t){ return xs.indexOf(t)<0; });
    });
  }},"− tags"));

  /* Stand */
  var stEnum=(((REG.components.Status||{}).schema||{}).properties||{}).value;
  var stSel=el("select",{class:"i",style:"width:auto"});
  stSel.appendChild(el("option",{value:""},"set status…"));
  ((stEnum&&stEnum["enum"])||["idea","planned","used","discarded"]).forEach(function(o){
    stSel.appendChild(el("option",{value:o},o)); });
  stSel.addEventListener("change",function(){
    if(!stSel.value)return;
    var val=stSel.value; stSel.value="";
    durch("Status set to “"+val+"”",function(e){
      e.components=e.components||{}; e.components.Status={value:val}; });
  });
  bar.appendChild(stSel);

  /* Schnittstelle wechseln */
  var ifSel=el("select",{class:"i",style:"width:auto"});
  ifSel.appendChild(el("option",{value:""},"change type…"));
  Object.keys(REG.interfaces).sort().forEach(function(n){
    if(REG.interfaces[n].abstract)return;
    ifSel.appendChild(el("option",{value:n},REG.interfaces[n].label||n)); });
  ifSel.addEventListener("change",function(){
    if(!ifSel.value)return;
    var ifn=ifSel.value; ifSel.value="";
    /* Der Typwechsel nimmt nichts weg. Eine Komponente, die der neue Typ
       nicht erlaubt, bleibt am Artikel stehen und wird von der Prüfung
       beanstandet — sichtbar und behebbar, statt still gelöscht. */
    var verliert=0;
    gewaehlt().forEach(function(e){
      Object.keys(e.components||{}).forEach(function(cn){
        if(!compOrigin(ifn,cn)) verliert++;
      });
    });
    var frage="Change "+ids.length+(ids.length===1?" article":" articles")+" to “"+
      (REG.interfaces[ifn].label||ifn)+"”?";
    if(verliert) frage+=" "+verliert+" component value(s) will no longer be allowed there; "+
      "they stay on the articles and validation will flag them.";
    confirmDialog(frage,function(){
      durch("Type changed",function(e){
        e.interfaces=[ifn];
        reqFor(ifn).forEach(function(c){ if(!e.components[c]&&REG.components[c]) e.components[c]={}; });
      });
    },"Change");
  });
  bar.appendChild(ifSel);

  /* Ein Feld auf denselben Wert */
  bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
    bulkFieldDialog(gewaehlt(),durch);
  }},"Set a field…"));

  bar.appendChild(el("button",{class:"btn sm dngr",type:"button",onclick:function(){
    confirmDialog("Delete "+ids.length+(ids.length===1?" article":" articles")+" for good?",function(){
      var weg=gewaehlt();
      weg.forEach(function(e){ drop(e.id); });
      UI.picked={};
      UI.err=weg.length+(weg.length===1?" article deleted.":" articles deleted.");
      render();
    });
  }},"Delete"));

  return bar;
}

var BULK_TABU={"Name.text":1,"Identity.key":1};
/* Nur Felder anbieten, die alle Gewählten überhaupt führen können — sonst
   stellt man etwas ein, das bei der Hälfte nirgends ankommt. */
function bulkFieldDialog(betroffen,durch){
  var gemeinsam=null;
  betroffen.forEach(function(e){
    var ifn=(e.interfaces||[])[0]||"";
    var hier={};
    compsFor(ifn).forEach(function(cn){
      var props=((REG.components[cn]||{}).schema||{}).properties||{};
      Object.keys(props).forEach(function(k){
        if(props[k].derived)return;
        /* Name und Identitätsschlüssel sind nicht Eigenschaft, sondern
           Identität. Sie auf allen Gewählten gleich zu setzen macht
           Dubletten, die danach kein Verweis mehr auseinanderhält. */
        if(BULK_TABU[cn+"."+k])return;
        hier[cn+"."+k]=1;
      });
    });
    if(gemeinsam===null) gemeinsam=hier;
    else Object.keys(gemeinsam).forEach(function(r){ if(!hier[r]) delete gemeinsam[r]; });
  });
  var refs=Object.keys(gemeinsam||{}).sort();

  dialog("Set one field on "+betroffen.length+(betroffen.length===1?" article":" articles"),
    function(host,close){
    if(!refs.length){
      host.appendChild(el("p",{class:"hint",
        text:"These articles share no editable field. Narrow the selection to one type."}));
      host.appendChild(el("div",{class:"rowbtns"},
        el("button",{class:"btn",type:"button",onclick:close},"Close")));
      return;
    }
    var sel=el("select",{class:"i"});
    refs.forEach(function(r){
      var teil=r.split("."), cd=REG.components[teil[0]]||{};
      var pd=((cd.schema||{}).properties||{})[teil[1]]||{};
      sel.appendChild(el("option",{value:r},(cd.label||teil[0])+" · "+(pd.title||teil[1])));
    });
    host.appendChild(field("Field",sel));
    var halter=el("div");
    host.appendChild(halter);
    function zeigeEingang(){
      halter.textContent="";
      var teil=sel.value.split(".");
      var pd=((REG.components[teil[0]].schema||{}).properties||{})[teil[1]];
      var node=fieldInput(pd,undefined);
      halter.appendChild(field("Value",node));
      halter.__node=node; halter.__pd=pd; halter.__ref=teil;
    }
    sel.addEventListener("change",zeigeEingang);
    zeigeEingang();
    host.appendChild(el("p",{class:"hint",
      text:"An empty value clears the field on every selected article."}));
    actions(host,close,function(){
      var pd=halter.__pd, teil=halter.__ref;
      var val=fieldValue(pd,halter.__node);
      durch("Field “"+(pd.title||teil[1])+"” set",function(e){
        e.components=e.components||{};
        var card=e.components[teil[0]]=e.components[teil[0]]||{};
        if(val===undefined) delete card[teil[1]]; else card[teil[1]]=val;
      });
    },"Set");
  });
}

/* ---------- editing where the value is ----------
   A click on a value turns that one field into an input; the switch in the
   bar turns every field into one at once. The dialog stays for creating an
   article from another one, where there is nothing to click yet.
   Derived fields never become inputs — they have no stored value to write
   back to, and offering one would promise an edit that cannot happen. */
function fieldCell(e,cn,p,pd,val,txt){
  var id=cn+"."+p;
  var cell=el("div",{class:"fld"+(pd.derived?" drv":"")});
  cell.appendChild(el("dt",{text:pd.title||p}));
  var editable=me.write&&!pd.derived;
  var open=editable&&(UI.inline||UI.editField===id);

  if(open){
    var node=fieldInput(pd,val[p]);
    var dd=el("dd",{class:"editing"});
    dd.appendChild(node);
    var schliessen=function(){
      var neu=fieldValue(pd,node);
      var card=e.components[cn]=e.components[cn]||{};
      var alt=card[p];
      if(neu===undefined) delete card[p]; else card[p]=neu;
      var gleich=JSON.stringify(alt===undefined?null:alt)===JSON.stringify(neu===undefined?null:neu);
      if(!UI.inline) UI.editField="";
      if(gleich){ render(); return; }
      persist(e);
    };
    node.addEventListener("change",schliessen);
    if(node.tagName==="INPUT") node.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"){ ev.preventDefault(); node.blur(); }
      if(ev.key==="Escape"){ UI.editField=""; render(); }
    });
    cell.appendChild(dd);
    /* Beim Einzelfeld sofort hineinspringen — sonst muss man zweimal klicken. */
    if(!UI.inline) setTimeout(function(){ try{ node.focus(); }catch(x){} },0);
    return cell;
  }

  var dd2=el(editable?"dd":"dd",{class:editable?"editable":null});
  if(fieldKind(pd)==="color"&&txt){
    dd2.appendChild(el("span",{class:"swatch",style:"background:"+txt}));
    dd2.appendChild(document.createTextNode(" "+txt));
  } else if(fieldKind(pd)==="link"&&txt){
    var target=ENT.get(txt);
    if(target) dd2.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(ev){ ev.stopPropagation(); go({k:"art",id:target.id}); }},nameOf(target)));
    else dd2.appendChild(el("span",{class:"gone",text:"missing"}));
  } else dd2.textContent=txt===""?"—":txt;
  if(editable) dd2.addEventListener("click",function(){ UI.editField=id; render(); });
  cell.appendChild(dd2);
  return cell;
}

/* ---------- breadcrumbs ----------
   Jeder Absprung hinterlässt eine Spur. Kommt man auf etwas zurück, das
   schon darin steht, wird die Spur dort abgeschnitten statt verlängert —
   sonst wächst sie beim Hin und Her ins Endlose. */
var TRAIL_MAX=8;
function trailPush(von){
  if(!von||von.k!=="art")return;
  var da=-1;
  UI.trail.forEach(function(t,i){ if(t.id===von.id) da=i; });
  if(da>=0){ UI.trail=UI.trail.slice(0,da+1); return; }
  UI.trail.push({k:"art",id:von.id});
  if(UI.trail.length>TRAIL_MAX) UI.trail=UI.trail.slice(-TRAIL_MAX);
}
function renderTrail(){
  if(!UI.trail.length)return null;
  var bar=el("nav",{class:"crumbs","aria-label":"Where you came from"});
  UI.trail.forEach(function(t,i){
    var e=ENT.get(t.id);
    if(i) bar.appendChild(el("span",{class:"sep",text:"›"}));
    bar.appendChild(el("button",{class:"ref",type:"button",onclick:function(){
      UI.trail=UI.trail.slice(0,i);
      UI.route={k:"art",id:t.id}; UI.err=""; UI.editField=""; render();
    }},e?nameOf(e):"(gone)"));
  });
  bar.appendChild(el("span",{class:"sep",text:"›"}));
  return bar;
}

/* ---------- view layout ----------
   A view carries `layout`, and optionally `byInterface` for types that need
   a different one. Resolution walks `extends` upward, like components do:
   Weapon with no layout of its own takes Item's. Views written before
   layouts existed are converted on read, so nothing has to be migrated
   before it is edited. */
var LAYOUT_ELEMENTS=[
  ["heading","Heading"],["text","Paragraph"],["fields","Field table"],
  ["description","Description"],["blocks","Text blocks"],
  ["composed","Composed rules"],["relations","Relations"],["image","Image"],
  ["knowledge","Knowledge groups"],["map","Map"],["sheet","Character sheet"],["inventory","Inventory"],["crafting","Crafting"],["board","Board"]
];
function layoutOf(vw,ifn){
  var by=vw.byInterface||{};
  var at=ifn, guard=0;
  while(at&&guard++<64){
    if(Array.isArray(by[at])&&by[at].length) return by[at];
    at=parentOf(at);
  }
  if(Array.isArray(vw.layout)) return vw.layout;
  return legacyLayout(vw);
}
/* Die alte Schalterform in Elemente übersetzen. Sie bleibt lesbar, bis
   jemand die Ansicht anfasst — eine Zwangsmigration bräuchte es nicht. */
function legacyLayout(vw){
  var out=[];
  if(vw.image) out.push({id:"l-img",el:"image"});
  if(vw.description!==false) out.push({id:"l-desc",el:"description"});
  if(vw.fields&&vw.fields!=="none") out.push({id:"l-f",el:"fields",fields:vw.fields,columns:0});
  if(vw.blocks&&(vw.blocks==="all"||vw.blocks.length)) out.push({id:"l-b",el:"blocks",blocks:vw.blocks});
  if(vw.composed!==false) out.push({id:"l-c",el:"composed"});
  return out;
}
function renderLayoutItem(item,e,ifn,vw){
  switch(item.el){
    case "heading":     return item.text?el("div",{class:"sec",text:fillVars(item.text,null,e)}):null;
    case "text":        return item.text?para(fillVars(item.text,null,e)):null;
    case "image":       return elImage(e);
    case "description": return elDescription(e);
    case "fields":      return elFields(e,ifn,item);
    case "blocks":      return elBlocks(e,item);
    case "composed":    return elComposed(e);
    case "relations":   return elRelations(e);
    case "knowledge":   return elKnowledge(e,ifn,item);
    case "map":         return elMap(e,ifn,item);
    case "sheet":       return elSheet(e,ifn,item);
    case "inventory":   return elInventory(e,ifn,item);
    case "crafting":    return elCrafting(e,ifn,item);
    case "board":       return elBoard(e,ifn,item);
    default:            return null;
  }
}

function elImage(e){
  var img=(e.components||{}).Image;
  if(!img)return null;
  var src=assetSrc(img.ref||img.url);
  if(!src)return null;
  var fig=el("figure",{class:"pic"});
  fig.appendChild(el("img",{src:src,alt:img.caption||nameOf(e),loading:"lazy"}));
  if(img.caption) fig.appendChild(el("figcaption",{text:img.caption}));
  return fig;
}

function elDescription(e){
  var desc=((e.components||{}).Description||{}).raw;
  return desc?para(fillVars(desc,null,e)):null;
}

/* Welche Feldzellen zeigt diese Ansicht — einmal berechnet, damit die
   Feldtabelle und die Wissensgruppen dieselbe Auswahl sehen. Berechnete sie
   jede für sich, könnte die Wissensansicht etwas gruppieren, das die Tabelle
   gar nicht zeigt, und es fiele erst am Tisch auf.
   `want`: "all" oder eine Liste aus "Comp" / "Comp.key". */
function fieldPlan(e,ifn,want){
  var zeig=function(cn,p){
    if(want==="all")return true;
    if(!Array.isArray(want))return false;
    return want.indexOf(cn)>=0||want.indexOf(cn+"."+p)>=0;
  };
  var cells=[];
  compsFor(ifn).forEach(function(cn){
    if(cn==="Name"||cn==="Identity"||cn==="Vars")return;
    var cd=REG.components[cn]; if(!cd)return;
    var val=(e.components||{})[cn]; if(!val)return;
    var props=(cd.schema&&cd.schema.properties)||{};
    /* a derived field with `of` rides in its base field's cell: 16 (+3) */
    var attach={};
    Object.keys(props).forEach(function(p){
      var pd=props[p];
      if(pd.derived&&pd.of&&!zeig(cn,p)) (attach[pd.of]=attach[pd.of]||[]).push(p);
    });
    Object.keys(props).forEach(function(p){
      var pd=props[p];
      if(!zeig(cn,p))return;
      if(pd.derived&&pd.of)return;
      var txt=fmtVal(pd, pd.derived?derivedValue(pd,val):val[p]);
      if(txt===""&&!(UI.inline&&me.write&&!pd.derived))return;
      (attach[p]||[]).forEach(function(dp){
        var dv=fmtVal(props[dp],derivedValue(props[dp],val));
        if(dv!=="") txt+=" ("+dv+")";
      });
      cells.push({cn:cn,p:p,pd:pd,val:val,txt:txt,ref:cn+"."+p,
        label:(REG.components[cn].label||cn)+" · "+(pd.title||p)});
    });
  });
  return cells;
}

/* `fields: "all"` or a list of "Comp" / "Comp.key"; `columns` 0 means "fit". */
function elFields(e,ifn,item){
  var flds=el("dl",{class:"fields"}), nf=0;
  if(item.columns>0) flds.style.gridTemplateColumns="repeat("+item.columns+",minmax(0,1fr))";
  fieldPlan(e,ifn,item.fields).forEach(function(c){
    flds.appendChild(fieldCell(e,c.cn,c.p,c.pd,c.val,c.txt)); nf++;
  });
  if(item.fields==="all") (e.adhoc||[]).forEach(function(f){
    if(f.value===""||f.value==null)return;
    flds.appendChild(el("div",{class:"fld adhoc"},[
      el("dt",{text:f.label}),el("dd",{text:String(f.value)})])); nf++;
  });
  return nf?flds:null;
}

function elBlocks(e,item){
  var want=item.blocks;
  var zeig=function(bt){ return want==="all"||(Array.isArray(want)&&want.indexOf(bt)>=0); };
  var blocks=(e.blocks||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
  var bw=el("div",{class:"blocks"});
  blocks.forEach(function(b){
    if(!zeig(b.blockType))return;
    var box=el("div",{class:"blk "+b.blockType});
    if(b.blockType!=="paragraph"){
      var blockLabel=el("div",{class:"bl"},[document.createTextNode(b.blockType)]);
      if(me.write) blockLabel.appendChild(el("button",{class:"btn gh sm",type:"button",
        onclick:function(){ confirmDialog("Delete this block?",function(){
          e.blocks=e.blocks.filter(function(x){return x.id!==b.id;}); persist(e); }); }},"×"));
      box.appendChild(blockLabel);
    }
    box.appendChild(para(fillVars(b.body,null,e)));
    bw.appendChild(box);
  });
  return bw.childNodes.length?bw:null;
}

/* compounding — composedOf sections resolved from the pool */
function elComposed(e){
  var comp=(e.relations||[]).filter(function(r){ var rd=REG.relations[r.type]; return rd&&rd.section; });
  if(!comp.length)return null;
  var wrap=el("div");
  var groups={};
  comp.forEach(function(r){ var s=REG.relations[r.type].section; (groups[s]=groups[s]||[]).push(r); });
  Object.keys(groups).forEach(function(sec){
    wrap.appendChild(el("div",{class:"sec",text:sec}));
    groups[sec].forEach(function(r){
      var t=ENT.get(r.to);
      var box=el("div",{class:"comp"});
      if(!t){ box.appendChild(el("div",{class:"gone",text:"Missing reference ("+r.to+")"}));
        wrap.appendChild(box); return; }
      var tn=el("div",{class:"cn"});
      tn.appendChild(el("button",{class:"ref",type:"button",onclick:function(){go({k:"art",id:t.id});}},
        (r.props&&r.props.vars&&r.props.vars.NAME)||nameOf(t)));
      box.appendChild(tn);
      var body=((t.components||{}).Description||{}).raw||((t.blocks||[])[0]&&t.blocks[0].body)||"";
      /* Reihenfolge nach REQ-174: Bindung an der Kante → der *nutzende*
         Artikel → Kampagnenregister. Der Statblock trägt DC=12, nicht die
         Regel — gegen die Regel aufzulösen lässt {DC} stehen. */
      box.appendChild(para(fillVars(body,(r.props&&r.props.vars)||null,e),"cb"));
      wrap.appendChild(box);
    });
  });
  return wrap;
}

/* Bezüge im Hauptteil — dieselbe Liste, die sonst in der Seitenleiste steht. */
function elRelations(e){
  var outs=(e.relations||[]).filter(function(r){ var rd=REG.relations[r.type]; return !(rd&&rd.section); });
  if(!outs.length)return null;
  var wrap=el("div",{class:"rel"});
  outs.forEach(function(r){
    var rd=relDef(r.type), t=ENT.get(r.to);
    var row=el("div",{class:"relrow"});
    row.appendChild(el("span",{class:"rl",text:rd.label||r.type}));
    var rv=el("span",{class:"rv"});
    if(t) rv.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:t.id});}},nameOf(t)));
    else rv.appendChild(el("span",{class:"gone",text:"missing"}));
    row.appendChild(rv);
    wrap.appendChild(row);
  });
  return wrap;
}

/* ---------- Boards (REQ-111, 157 bis 166) ----------
   Eine Leinwand, auf der Artikel frei liegen. Was darauf liegt, sind Kanten
   mit Ort und Grösse — damit beantwortet „wo liegt dieser NSC überall?"
   derselbe Rückbezug wie überall sonst.

   **Jede Platzierung wird in einer Ansicht gezeichnet, und dieselbe
   Ansicht, die auch die Artikelseite zeichnet.** Genau dafür wurde die
   Ansicht in A4 eine geordnete Liste von Elementen: `layoutOf` und
   `renderLayoutItem` gelten hier unverändert, und ein neues Element steht
   ohne Zutun auch auf dem Board.

   Die Auflösung, welche Ansicht (REQ-161): erst die Platzierung, dann die
   Regel des Boards je Schnittstelle, dann die erste Ansicht. So steht ein
   Board voller Kurzfassungen da, und *dieser eine* Statblock darin voll.

   Rechtecke und Ankerpunkte liegen als Felder am Board, nicht als Kanten.
   Das ist kein Rückfall: ein Rechteck zeigt auf nichts. Ein Token zeigt auf
   einen Artikel, deshalb ist es eine Kante; eine Linie, die zwei Kästen
   umfasst, ist Zeichnung und gehört dem Board. */
var BOARD_IFACE="Board", BOARD_COMP="BoardInfo", REL_PLACED="placed";
var SHAPE_KINDS=[["rect","Rectangle"],["ellipse","Ellipse"],["line","Line"],["label","Label"]];

function boardCard(e){ return (e.components||{})[BOARD_COMP]||{}; }
/* Welche Ansicht zeichnet diese Platzierung (REQ-161)? */
function placementView(board,rel,target){
  var pr=rel.props||{};
  if(pr.view&&REG.views[pr.view])return pr.view;
  var regeln=boardCard(board).rules||{};
  var at=(target.interfaces||[])[0], guard=0;
  while(at&&guard++<64){ if(regeln[at]&&REG.views[regeln[at]])return regeln[at]; at=parentOf(at); }
  return viewKeys()[0];
}
/* Eine Platzierung zeichnen: dieselben Elemente wie die Artikelseite.
   `tiefe` bricht ab, wenn ein Board auf einem Board auf einem Board liegt —
   das ist erlaubt, aber nicht unendlich. */
/* Innerhalb einer Platzierung gehören die Werkzeugleisten nicht hin: ein
   Zoomknopf auf einer Karte, die als Kachel auf einem Board liegt, änderte
   den Zoom der grossen Karte nebenan. Gelesen wird hier, bearbeitet wird
   auf der Artikelseite — der Titel der Kachel führt hin. */
var inPlacement=0;
function renderPlacement(target,viewKey,tiefe){
  var host=el("div",{class:"pbody"});
  var vw=(REG.views||{})[viewKey];
  if(!vw){ host.appendChild(el("p",{class:"hint",text:"Unknown view."})); return host; }
  var ifn=(target.interfaces||[])[0]||"";
  if((tiefe||0)>2){ host.appendChild(el("p",{class:"hint",text:"…"})); return host; }
  inPlacement++;
  try{
    layoutOf(vw,ifn).forEach(function(it){
      /* Ein Board in einem Board zeichnet nicht wieder eine ganze Leinwand. */
      if(it.el==="board"&&(tiefe||0)>=1)return;
      var node;
      try{ node=renderLayoutItem(it,target,ifn,vw); }
      catch(x){ node=el("p",{class:"err",text:String(x&&x.message||x)}); }
      if(node) host.appendChild(node);
    });
  } finally { inPlacement--; }
  if(!host.childNodes.length) host.appendChild(el("p",{class:"hint",
    text:"Nothing to show in this view."}));
  return host;
}

function elBoard(e,ifn,item){
  var card=boardCard(e);
  var breite=Number(card.width)||2400, hoehe=Number(card.height)||1500;
  var snap=Math.max(1,Number(card.snap)||10);
  var z=UI.boardZoom;
  var wrap=el("div",{class:"boardbox"});

  var bar=el("div",{class:"maptools"});
  [["−",-0.1],["+",0.1]].forEach(function(t){
    bar.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ UI.boardZoom=Math.min(2,Math.max(0.2,UI.boardZoom+t[1])); render(); }},t[0]));
  });
  bar.appendChild(el("span",{class:"hint",style:"margin:0",text:Math.round(z*100)+"%"}));
  if(me.write){
    bar.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ placeOnBoard(e); }},"+ Place"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ newOnBoard(e); }},"+ New article"));
    var werkzeug=el("select",{class:"i",style:"width:auto"});
    werkzeug.appendChild(el("option",{value:""},"draw…"));
    SHAPE_KINDS.forEach(function(k){ werkzeug.appendChild(el("option",{value:k[0]},k[1])); });
    werkzeug.value=UI.boardTool;
    werkzeug.addEventListener("change",function(){ UI.boardTool=werkzeug.value; render(); });
    bar.appendChild(werkzeug);
  }
  /* Ankerpunkte (REQ-159, 160): benannte Stellen auf der Leinwand. */
  var anker=Array.isArray(card.anchors)?card.anchors:[];
  if(anker.length){
    var sel=el("select",{class:"i",style:"width:auto"});
    sel.appendChild(el("option",{value:""},"jump to…"));
    anker.forEach(function(a){ sel.appendChild(el("option",{value:a.id},a.name||a.id)); });
    sel.addEventListener("change",function(){
      var a=anker.filter(function(x){return x.id===sel.value;})[0];
      if(!a)return;
      var st=wrap.querySelector(".boardstage");
      if(a.zoom){ UI.boardZoom=a.zoom; render();
        setTimeout(function(){ var s2=document.querySelector(".boardstage");
          if(s2){ s2.scrollLeft=(a.x||0)*UI.boardZoom-60; s2.scrollTop=(a.y||0)*UI.boardZoom-60; } },0);
        return; }
      if(st){ st.scrollLeft=(a.x||0)*z-60; st.scrollTop=(a.y||0)*z-60; }
    });

  }
  if(me.write) bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    onclick:function(){ addAnchor(e,wrap); }},"+ Anchor"));
  wrap.appendChild(bar);

  var stage=el("div",{class:"boardstage"});

  canvas.style.height=(hoehe*z)+"px";

  canvas.style.backgroundSize="100% 100%";

    var n=el("div",{class:"bshape sh-"+(sh.kind||"rect")});
    n.style.left=((sh.x||0)*z)+"px"; n.style.top=((sh.y||0)*z)+"px";
    n.style.width=((sh.w||120)*z)+"px"; n.style.height=((sh.h||80)*z)+"px";
    if(sh.color) n.style.borderColor=sh.color;
    if(sh.kind==="label"){ n.textContent=sh.text||""; n.style.color=sh.color||""; }
    if(me.write) n.addEventListener("contextmenu",function(ev){
      ev.preventDefault();
      confirmDialog("Remove this shape?",function(){
        card.shapes=(card.shapes||[]).filter(function(x){return x.id!==sh.id;});
        e.components[BOARD_COMP]=card; persist(e); });
    });
    canvas.appendChild(n);
  });

  var platz=(e.relations||[]).filter(function(r){ return r.type===REL_PLACED; });
  platz.sort(function(a,b){ return ((a.props||{}).z||0)-((b.props||{}).z||0); });
  platz.forEach(function(r){
    var t=ENT.get(r.to);
    var pr=r.props||{};
    var karte=el("div",{class:"bcard"+(UI.boardPick===r.id?" selected":"")});
    karte.style.left=((pr.x||0)*z)+"px";
    karte.style.top=((pr.y||0)*z)+"px";
    karte.style.width=((pr.w||260)*z)+"px";
    karte.style.height=((pr.h||180)*z)+"px";
    if(!t){
      karte.appendChild(el("div",{class:"gone",text:"missing article"}));
      canvas.appendChild(karte); return;
    }
    var vk=placementView(e,r,t);
    var kopf=el("div",{class:"bhead"});
    kopf.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(ev){ ev.stopPropagation(); go({k:"art",id:t.id}); }},nameOf(t)));
    kopf.appendChild(el("span",{class:"bview",text:(REG.views[vk]||{}).label||vk}));
    if(me.write){
      /* Die Ansicht je Platzierung wechseln: das ist die
         Darstellungsauflösung von Hand, und sie muss dort sein, wo die
         Karte steht — nicht in einem Register. */
      var vs=el("select",{class:"bsel"});
      vs.appendChild(el("option",{value:""},"(board rule)"));
      viewKeys().forEach(function(k){ vs.appendChild(el("option",{value:k},(REG.views[k]||{}).label||k)); });
      vs.value=pr.view||"";
      vs.addEventListener("click",function(ev){ ev.stopPropagation(); });
      vs.addEventListener("change",function(){
        r.props=Object.assign({},r.props,{view:vs.value||undefined}); persist(e); });
      kopf.appendChild(vs);
      kopf.appendChild(el("button",{class:"btn gh sm",type:"button",title:"Take off the board",
        onclick:function(ev){ ev.stopPropagation();
          e.relations=e.relations.filter(function(x){return x.id!==r.id;}); persist(e); }},"×"));
    }
    karte.appendChild(kopf);
    var body=el("div",{class:"bscroll"});
    body.style.transform="scale("+z+")";
    body.style.width=(100/z)+"%";
    body.style.height="calc("+(100/z)+"% - "+(26/z)+"px)";
    body.appendChild(renderPlacement(t,vk,0));
    karte.appendChild(body);

    if(me.write&&!pr.locked){
      var griff=el("div",{class:"bgrip",title:"Resize"});
      karte.appendChild(griff);
      var zieh=null;
      kopf.addEventListener("pointerdown",function(ev){
        if(ev.target!==kopf)return;
        zieh={x:ev.clientX,y:ev.clientY,ox:pr.x||0,oy:pr.y||0,mode:"move"};
        UI.boardPick=r.id;
        try{ kopf.setPointerCapture(ev.pointerId); }catch(x){}
      });
      griff.addEventListener("pointerdown",function(ev){
        ev.stopPropagation();
        zieh={x:ev.clientX,y:ev.clientY,ow:pr.w||260,oh:pr.h||180,mode:"size"};
        try{ griff.setPointerCapture(ev.pointerId); }catch(x){}
      });
      var bewegen=function(ev){
        if(!zieh)return;
        var dx=(ev.clientX-zieh.x)/z, dy=(ev.clientY-zieh.y)/z;
        if(zieh.mode==="move"){
          zieh.nx=Math.max(0,Math.round((zieh.ox+dx)/snap)*snap);
          zieh.ny=Math.max(0,Math.round((zieh.oy+dy)/snap)*snap);
          karte.style.left=(zieh.nx*z)+"px"; karte.style.top=(zieh.ny*z)+"px";
        } else {
          zieh.nw=Math.max(80,Math.round((zieh.ow+dx)/snap)*snap);
          zieh.nh=Math.max(60,Math.round((zieh.oh+dy)/snap)*snap);
          karte.style.width=(zieh.nw*z)+"px"; karte.style.height=(zieh.nh*z)+"px";
        }
      };
      var los=function(){
        if(!zieh)return;
        var w=zieh; zieh=null;
        if(w.mode==="move"&&w.nx!=null) r.props=Object.assign({},r.props,{x:w.nx,y:w.ny});
        if(w.mode==="size"&&w.nw!=null) r.props=Object.assign({},r.props,{w:w.nw,h:w.nh});
        persist(e);
      };
      kopf.addEventListener("pointermove",bewegen);
      kopf.addEventListener("pointerup",los);
      griff.addEventListener("pointermove",bewegen);
      griff.addEventListener("pointerup",los);
    }
    canvas.appendChild(karte);
  });

  /* Mit einem Zeichenwerkzeug in der Hand legt ein Klick eine Form an. */
  if(me.write&&UI.boardTool){
    canvas.style.cursor="crosshair";
    canvas.addEventListener("click",function(ev){
      if(ev.target!==canvas)return;
      var rect=canvas.getBoundingClientRect();
      var x=Math.round(((ev.clientX-rect.left)/z)/snap)*snap;
      var y=Math.round(((ev.clientY-rect.top)/z)/snap)*snap;
      var sh={id:uid("sh"),kind:UI.boardTool,x:x,y:y,w:160,h:100};
      if(UI.boardTool==="label"){ sh.text="Label"; sh.h=24; }
      card.shapes=(card.shapes||[]).concat([sh]);
      e.components=e.components||{}; e.components[BOARD_COMP]=card;
      UI.boardTool=""; persist(e);
    });
  }

  stage.appendChild(canvas);
  wrap.appendChild(stage);
  wrap.appendChild(el("p",{class:"hint",
    text:platz.length+" placed · "+((card.shapes||[]).length)+" shapes · "+
      anker.length+" anchors"+(me.write?" · drag the title bar to move, the corner to resize, right-click a shape to remove":"")}));
  return wrap;
}

/* ---------- Handwerk (REQ-184) ----------
   Ein Rezept ist ein Artikel, und was es verbraucht, steht an `needs`-Kanten
   mit Menge. Die Menge gehört an die Kante, weil sie von beiden Enden
   abhängt: dasselbe Material geht in das eine Rezept einmal und in das
   andere zwölfmal ein.

   **Ein Rezept, das jemand kennt, ist Wissen** — und Wissen hat dieses
   Modell schon. Das Rezept trägt eine Information, die Information geht über
   `knownBy` an Figuren; ein Feld „bekannt von" am Rezept wäre ein zweites,
   schwächeres Wissensmodell neben dem vorhandenen. Ein Rezept ohne
   Information liegt offen — dieselbe Regel wie überall sonst. */
var RECIPE_IFACE="Recipe", RECIPE_COMP="RecipeInfo",
    REL_NEEDS="needs", REL_YIELDS="yields";

function recipeNeeds(r){
  return (r.relations||[]).filter(function(x){return x.type===REL_NEEDS;})
    .map(function(x){ var it=ENT.get(x.to);
      return it?{item:it,rel:x,qty:Number((x.props||{}).qty)||1,
        consumed:(x.props||{}).consumed!==false}:null; })
    .filter(Boolean);
}
function recipeYield(r){
  var x=(r.relations||[]).filter(function(y){return y.type===REL_YIELDS;})[0];
  return x?ENT.get(x.to):null;
}
/* Wie viel von diesem Gegenstand trägt der Träger — über alle Stufen
   hinweg. Was eingelagert ist, zählt mit; das Rezept fragt nach Vorrat,
   nicht nach Griffabstand. */
function amountHeld(traeger,itemId){
  var n=0;
  carriedItems(traeger).forEach(function(st){ if(st.item.id===itemId) n+=st.qty; });
  return n;
}
/* Kennt der Betrachter das Rezept? Alle Informationen daran müssen bekannt
   sein; keine Information heisst offen. Teilwissen ist ein eigener Zustand —
   „du kennst das Rezept, aber nicht die letzte Zutat" ist eine Lage, die am
   Tisch vorkommt, und sie soll sichtbar sein. */
function recipeKnowledge(rec,viewerId){
  var infos=infosOf(rec);
  if(!infos.length)return "open";
  var bekannt=infos.filter(function(i){ return knowsInfo(i,viewerId); }).length;
  if(bekannt===infos.length)return "known";
  return bekannt?"partial":"hidden";
}
function craftStatus(rec,traeger){
  var fehlt=[], ok=true;
  recipeNeeds(rec).forEach(function(n){
    var da=traeger?amountHeld(traeger,n.item.id):0;
    if(da<n.qty){ ok=false; fehlt.push({item:n.item,need:n.qty,have:da}); }
  });
  return {ok:ok,missing:fehlt};
}

/* Herstellen: verbrauchen, was verbraucht wird, und das Ergebnis eintragen.
   Ohne diesen Schritt ist die Matrix eine Tabelle, und die Tabelle führt
   niemand nach. */
function craftIt(rec,traeger){
  var inv=inventoryOf(traeger);
  if(!inv){ UI.err="No inventory to take from."; render(); return; }
  var st=craftStatus(rec,traeger);
  if(!st.ok){ UI.err="Missing: "+st.missing.map(function(m){
    return nameOf(m.item)+" ("+m.have+"/"+m.need+")"; }).join(", "); render(); return; }
  var ergebnis=recipeYield(rec);
  var info=(rec.components||{})[RECIPE_COMP]||{};
  confirmDialog("Craft “"+(ergebnis?nameOf(ergebnis):nameOf(rec))+"”? "+
    "This consumes the materials"+(info.dc?" — the check is DC "+info.dc+
      " and it is not rolled here":"")+".",function(){
    recipeNeeds(rec).forEach(function(n){
      if(!n.consumed)return;
      var rest=n.qty;
      /* Von hinten abtragen: was eingelagert ist, geht zuerst, was in der
         Hand liegt, zuletzt — sonst nimmt das Handwerk die Waffe weg. */
      var stuecke=carriedItems(traeger).filter(function(x){return x.item.id===n.item.id;});
      var ordnung=["stored","pack","belt","worn","held"];
      stuecke.sort(function(a,b){ return ordnung.indexOf(a.tier)-ordnung.indexOf(b.tier); });
      stuecke.forEach(function(x){
        if(rest<=0)return;
        var weg=Math.min(rest,x.qty); rest-=weg;
        if(x.qty-weg<=0) inv.relations=inv.relations.filter(function(y){return y.id!==x.rel.id;});
        else x.rel.props=Object.assign({},x.rel.props,{qty:x.qty-weg});
      });
    });
    if(ergebnis){
      var wieviel=Number(info.yieldCount)||1;
      var vorhanden=(inv.relations||[]).filter(function(y){
        return y.type===REL_HOLDS&&y.to===ergebnis.id; })[0];
      if(vorhanden) vorhanden.props=Object.assign({},vorhanden.props,
        {qty:(Number((vorhanden.props||{}).qty)||1)+wieviel});
      else{ inv.relations=inv.relations||[];
        inv.relations.push({id:uid("r"),type:REL_HOLDS,to:ergebnis.id,
          props:{qty:wieviel,tier:"pack"}}); }
    }
    persist(inv);
  },"Craft");
}

function elCrafting(e,ifn,item){
  var wrap=el("div",{class:"craft"});

  /* Auf dem Rezept selbst: was es braucht, was es gibt, wer es kennt. */
  if(ifn===RECIPE_IFACE||((e.components||{})[RECIPE_COMP])){
    var info=(e.components||{})[RECIPE_COMP]||{};
    var kopf=el("div",{class:"crhead"});
    if(info.trade) kopf.appendChild(el("span",{class:"pill",text:info.trade}));
    if(info.dc) kopf.appendChild(el("span",{class:"pill q",
      text:(info.ability||"int").toUpperCase()+" DC "+info.dc}));
    if(info.time) kopf.appendChild(el("span",{class:"pill q",text:info.time}));
    if(info.tool) kopf.appendChild(el("span",{class:"pill q",text:info.tool}));
    wrap.appendChild(kopf);

    var erg=recipeYield(e);
    if(erg){
      var z=el("p",{class:"yield"});
      z.appendChild(document.createTextNode("Yields "+((Number(info.yieldCount)||1)>1?
        (info.yieldCount+"× "):"")));
      z.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:erg.id});}},nameOf(erg)));
      wrap.appendChild(z);
    }

    var braucht=recipeNeeds(e);
    if(!braucht.length) wrap.appendChild(el("p",{class:"hint",
      text:"No materials listed yet — add them with the relation “needs”."}));
    else{
      wrap.appendChild(el("div",{class:"sec",text:"Materials"}));
      /* Je Träger eine Spalte: dieselbe Frage, die man am Tisch stellt —
         „hat jemand von uns genug?" — statt für jeden einzeln nachzusehen. */
      var traeger=[];
      ENT.forEach(function(o){
        if(!(o.relations||[]).some(function(r){return r.type===REL_CARRIES;}))return;
        traeger.push(o);
      });
      traeger.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
      var tb=el("table",{class:"craftm"});
      var hd=el("tr");
      hd.appendChild(el("th",{text:"Material"}));
      hd.appendChild(el("th",{text:"Needs"}));
      traeger.forEach(function(t){ hd.appendChild(el("th",{text:nameOf(t)})); });
      tb.appendChild(hd);
      braucht.forEach(function(n){
        var row=el("tr");
        var c=el("td");
        c.appendChild(el("button",{class:"ref",type:"button",
          onclick:function(){go({k:"art",id:n.item.id});}},nameOf(n.item)));
        if(!n.consumed) c.appendChild(el("span",{class:"co",text:" (not consumed)"}));
        row.appendChild(c);
        row.appendChild(el("td",{class:"num",text:String(n.qty)}));
        traeger.forEach(function(t){
          var da=amountHeld(t,n.item.id);
          row.appendChild(el("td",{class:"num"+(da<n.qty?" short":" ok"),text:String(da)}));
        });
        tb.appendChild(row);
      });
      var foot=el("tr",{class:"crfoot"});
      foot.appendChild(el("td",{text:"Craftable"}));
      foot.appendChild(el("td",{text:""}));
      traeger.forEach(function(t){
        var st=craftStatus(e,t);
        var cell=el("td");
        if(st.ok&&me.write) cell.appendChild(el("button",{class:"btn sm pri",type:"button",
          onclick:function(){ craftIt(e,t); }},"Craft"));
        else cell.appendChild(el("span",{class:st.ok?"ok":"gone",text:st.ok?"yes":"no"}));
        foot.appendChild(cell);
      });
      tb.appendChild(foot);
      wrap.appendChild(tb);
    }

    /* Wer es kennt: der Rückbezug über die Informationen am Rezept. */
    var infos=infosOf(e);
    wrap.appendChild(el("div",{class:"sec",text:"Who knows it"}));
    if(!infos.length) wrap.appendChild(el("p",{class:"hint",
      text:"Nothing about this recipe is guarded — everyone can read it. Bundle its fields into an information in the side panel to hand it out deliberately."}));
    else{
      var wl=el("div",{class:"chips"});
      var wer={};
      infos.forEach(function(i){
        edgesOf(i,REL_KNOWNBY).forEach(function(r){ var t=ENT.get(r.to); if(t) wer[t.id]=t; });
      });
      if(!Object.keys(wer).length) wl.appendChild(el("span",{class:"hint",style:"margin:0",
        text:"Nobody yet — it stays with the GM."}));
      Object.keys(wer).forEach(function(k){
        wl.appendChild(el("button",{class:"chip",type:"button",
          onclick:function(){go({k:"art",id:k});}},nameOf(wer[k])));
      });
      wrap.appendChild(wl);
    }
    return wrap;
  }

  /* Sonst: die Werkbank dieser Figur oder Gruppe. */
  var inv=inventoryOf(e);
  if(!inv){ wrap.appendChild(el("p",{class:"hint",
    text:"No inventory — nothing to craft from."})); return wrap; }

  var rezepte=[];
  ENT.forEach(function(o){ if(((o.interfaces||[])[0])===RECIPE_IFACE) rezepte.push(o); });
  rezepte.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
  if(!rezepte.length){ wrap.appendChild(el("p",{class:"hint",text:"No recipes in the registry yet."}));
    return wrap; }

  var bar=el("div",{class:"ktabs"});
  bar.appendChild(el("button",{class:"btn sm"+(UI.craftOnly?" pri":""),type:"button",
    "aria-pressed":String(UI.craftOnly),
    onclick:function(){ UI.craftOnly=!UI.craftOnly; render(); }},"Only what works"));
  wrap.appendChild(bar);

  var tb2=el("table",{class:"craftm"});
  var hd2=el("tr");
  ["Recipe","Knowledge","Materials","Yields",""].forEach(function(h){ hd2.appendChild(el("th",{text:h})); });
  tb2.appendChild(hd2);
  var gezeigt=0;
  rezepte.forEach(function(rec){
    var wissen=recipeKnowledge(rec,e.id);
    var st=craftStatus(rec,e);
    if(UI.craftOnly&&(!st.ok||wissen==="hidden"))return;
    gezeigt++;
    var row=el("tr",{class:"crrow "+(wissen==="hidden"?"unknown":(st.ok?"ready":"short"))});
    var c1=el("td");
    c1.appendChild(el("span",{class:"cdot "+(wissen==="hidden"?"d-un":(st.ok?"d-ok":"d-no"))}));
    c1.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:rec.id});}},
      wissen==="hidden"?"(unknown recipe)":nameOf(rec)));
    row.appendChild(c1);
    row.appendChild(el("td",{class:"note",
      text:{open:"open",known:"known",partial:"partly known",hidden:"not known"}[wissen]}));
    var c3=el("td",{class:"note"});
    if(wissen==="hidden") c3.textContent="—";
    else if(st.ok) c3.textContent="all there";
    else c3.textContent=st.missing.map(function(m){
      return nameOf(m.item)+" "+m.have+"/"+m.need; }).join(", ");
    row.appendChild(c3);
    var erg2=recipeYield(rec);
    var c4=el("td");
    if(wissen!=="hidden"&&erg2) c4.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:erg2.id});}},nameOf(erg2)));
    else c4.textContent="—";
    row.appendChild(c4);
    var c5=el("td");
    if(st.ok&&wissen!=="hidden"&&me.write)
      c5.appendChild(el("button",{class:"btn sm pri",type:"button",
        onclick:function(){ craftIt(rec,e); }},"Craft"));
    row.appendChild(c5);
    tb2.appendChild(row);
  });
  wrap.appendChild(tb2);
  if(!gezeigt) wrap.appendChild(el("p",{class:"hint",
    text:"Nothing craftable right now."}));
  return wrap;
}

/* ---------- Inventar (REQ-064, 065) ----------
   Drei Darstellungen über denselben Daten: Griffabstand, Körper, Raster.
   Die Angaben stehen an der Kante, nicht am Gegenstand — dasselbe Seil liegt
   bei der einen Figur am Gürtel und bei der anderen ganz unten im Rucksack,
   und ein Feld am Gegenstand trüge nur eine der beiden Wahrheiten.

   `tier` ist der Griffabstand, nicht der Ort. Genau diese Frage stellt sich
   am Tisch — „habe ich das jetzt?" —, und sie ist eine andere als „gehört
   es mir?". */
var INV_IFACE="Inventory", REL_CARRIES="carries", REL_HOLDS="holds";
var TIERS=[
  ["held","In hand","One action away: it is already in your hands."],
  ["worn","Worn","On the body — armour, cloak, rings."],
  ["belt","At the belt","An interact: pouch, sheath, bandolier."],
  ["pack","In the pack","A whole action of rummaging."],
  ["stored","Stored","Not here. At an inn, on a cart, at home."]
];
var SLOTS=[
  ["head","Head"],["neck","Neck"],["cloak","Cloak"],["torso","Torso"],
  ["mainHand","Main hand"],["offHand","Off hand"],["hands","Hands"],
  ["belt","Belt"],["legs","Legs"],["feet","Feet"],["ring1","Ring I"],["ring2","Ring II"]
];
function tierLabel(t){ var h=TIERS.filter(function(x){return x[0]===t;})[0]; return h?h[1]:t; }

/* Das Inventar einer Figur — oder der Artikel selbst, wenn er eines ist. */
function inventoryOf(e){
  if(((e.interfaces||[])[0])===INV_IFACE)return e;
  var r=(e.relations||[]).filter(function(x){return x.type===REL_CARRIES;})[0];
  return r?ENT.get(r.to):null;
}
function carriedItems(e){
  var inv=inventoryOf(e); if(!inv)return [];
  var out=[];
  (inv.relations||[]).forEach(function(r){
    if(r.type!==REL_HOLDS)return;
    var it=ENT.get(r.to); if(!it)return;
    var pr=r.props||{};
    out.push({item:it,rel:r,inv:inv,tier:pr.tier||"pack",qty:Number(pr.qty)||1,
      slot:pr.slot||"",gx:pr.gx,gy:pr.gy,note:pr.note||"",attuned:!!pr.attuned});
  });
  return out;
}
/* Die Form eines Gegenstands im Raster. Ohne `Footprint` ist er ein Feld
   gross — das ist kein Sonderfall, sondern der Normalfall. */
function footprintOf(it){
  var fp=(it.components||{}).Footprint||{};
  var rows=Array.isArray(fp.rows)?fp.rows.map(String):
    (typeof fp.rows==="string"?fp.rows.split("\n"):[]);
  if(!rows.length)return {rows:["1"],w:1,h:1};
  var w=rows.reduce(function(m,r){return Math.max(m,r.length);},0)||1;
  return {rows:rows,w:w,h:rows.length};
}
function fpFilled(fp,x,y){
  var row=fp.rows[y]||"";
  var g=row.charAt(x);
  return !!g&&!EMPTY_CELL[g];
}
function invSize(){
  return {cols:Math.max(2,settingNum("inventoryCols",10)),
          rows:Math.max(2,settingNum("inventoryRows",6))};
}
/* Passt der Gegenstand dorthin? Belegte Felder und der Rand sind die einzigen
   Gründe, nein zu sagen — Gewicht und Volumen führt dieses Modell nicht. */
function fitsAt(stuecke,ich,gx,gy){
  var size=invSize(), fp=footprintOf(ich.item);
  if(gx<0||gy<0||gx+fp.w>size.cols||gy+fp.h>size.rows)return false;
  var belegt={};
  stuecke.forEach(function(st){
    if(st.rel.id===ich.rel.id)return;
    if(st.gx==null||st.gy==null)return;
    var f=footprintOf(st.item);
    for(var y=0;y<f.h;y++)for(var x=0;x<f.w;x++)
      if(fpFilled(f,x,y)) belegt[(st.gx+x)+":"+(st.gy+y)]=1;
  });
  for(var y2=0;y2<fp.h;y2++)for(var x2=0;x2<fp.w;x2++)
    if(fpFilled(fp,x2,y2)&&belegt[(gx+x2)+":"+(gy+y2)])return false;
  return true;
}

function elInventory(e,ifn,item){
  var inv=inventoryOf(e);
  var wrap=el("div",{class:"invbox"});
  if(!inv){
    wrap.appendChild(el("p",{class:"hint",
      text:"No inventory yet. Link one with the relation “carries”."}));
    if(me.write) wrap.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ newInventory(e); }},"+ Inventory"));
    return wrap;
  }
  var stuecke=carriedItems(e);

  var tabs=el("div",{class:"ktabs"});
  if(inPlacement) tabs.style.display="none";
  [["tiers","Within reach"],["body","Worn"],["grid","Grid"]].forEach(function(t){
    tabs.appendChild(el("button",{class:"btn sm"+(UI.invView===t[0]?" pri":""),type:"button",
      "aria-pressed":String(UI.invView===t[0]),
      onclick:function(){ UI.invView=t[0]; render(); }},t[1]));
  });
  if(me.write) tabs.appendChild(el("button",{class:"btn sm",type:"button",
    onclick:function(){ addToInventory(inv); }},"+ Item"));
  var geld=(inv.components||{}).InventoryInfo||{};
  if(geld.copper!=null) tabs.appendChild(el("span",{class:"hint",style:"margin:0",
    text:geld.copper+" cp"}));
  wrap.appendChild(tabs);

  if(!stuecke.length){
    wrap.appendChild(el("div",{class:"empty",text:"Nothing carried yet."}));
    return wrap;
  }

  /* Ein Stück ist gewählt: der nächste Klick auf eine Stufe, einen Slot oder
     ein Rasterfeld legt es dorthin. Das trägt auf dem Telefon genauso wie
     Ziehen — und Ziehen bleibt daneben möglich. */
  var gewaehlt=stuecke.filter(function(st){ return st.rel.id===UI.invPick; })[0]||null;
  if(gewaehlt) wrap.appendChild(el("p",{class:"hint pickon",
    text:"“"+nameOf(gewaehlt.item)+"” picked up — now click where it goes."}));

  function chip(st){
    var b=el("button",{class:"chip item"+(st.rel.id===UI.invPick?" selected":""),
      type:"button",draggable:me.write?"true":null,
      title:(st.note||"")+(st.attuned?" · attuned":"")});
    b.appendChild(el("span",{text:nameOf(st.item)}));
    if(st.qty>1) b.appendChild(el("span",{class:"qty",text:"×"+st.qty}));
    b.addEventListener("click",function(ev){
      if(ev.shiftKey||!me.write){ go({k:"art",id:st.item.id}); return; }
      UI.invPick=(UI.invPick===st.rel.id?"":st.rel.id); render();
    });
    b.addEventListener("dragstart",function(ev){
      UI.invPick=st.rel.id;
      try{ ev.dataTransfer.setData("text/plain",st.rel.id); }catch(x){}
    });
    return b;
  }
  function lege(st,patch){
    st.rel.props=Object.assign({},st.rel.props,patch);
    UI.invPick="";
    persist(st.inv);
  }
  function dropZiel(node,fn){
    if(!me.write)return node;
    node.addEventListener("dragover",function(ev){ ev.preventDefault();
      node.classList.add("over"); });
    node.addEventListener("dragleave",function(){ node.classList.remove("over"); });
    node.addEventListener("drop",function(ev){ ev.preventDefault();
      node.classList.remove("over");
      var st=stuecke.filter(function(x){return x.rel.id===UI.invPick;})[0];
      if(st) fn(st);
    });
    node.addEventListener("click",function(){
      var st=stuecke.filter(function(x){return x.rel.id===UI.invPick;})[0];
      if(st) fn(st);
    });
    return node;
  }

  if(UI.invView==="tiers"){
    TIERS.forEach(function(t){
      var box=el("div",{class:"tier t-"+t[0]});
      var head=el("div",{class:"tlabel"});
      head.appendChild(el("b",{text:t[1]}));
      head.appendChild(el("span",{class:"co",text:t[2]}));
      box.appendChild(head);
      var liste=stuecke.filter(function(st){ return st.tier===t[0]; });
      if(!liste.length) box.appendChild(el("span",{class:"hint",style:"margin:0",text:"—"}));
      liste.forEach(function(st){ box.appendChild(chip(st)); });
      dropZiel(box,function(st){ lege(st,{tier:t[0]}); });
      wrap.appendChild(box);
    });
  }

  if(UI.invView==="body"){
    var rig=el("div",{class:"bodyrig"+(gewaehlt?" picking":"")});
    SLOTS.forEach(function(sl){
      var box=el("div",{class:"slot"});
      box.appendChild(el("div",{class:"slabel",text:sl[1]}));
      var inhalt=el("div",{class:"sbox"});
      var drin=stuecke.filter(function(st){ return st.slot===sl[0]; });
      if(!drin.length) inhalt.appendChild(el("span",{class:"hint",style:"margin:0",text:"empty"}));
      drin.forEach(function(st){
        inhalt.appendChild(chip(st));
        if(me.write) inhalt.appendChild(el("button",{class:"btn gh sm",type:"button",
          title:"Take off",onclick:function(ev){ ev.stopPropagation();
            lege(st,{slot:undefined,tier:"pack"}); }},"×"));
      });
      dropZiel(inhalt,function(st){
        lege(st,{slot:sl[0],tier:sl[0]==="mainHand"||sl[0]==="offHand"?"held":"worn"}); });
      box.appendChild(inhalt);
      rig.appendChild(box);
    });
    wrap.appendChild(rig);
    var frei=stuecke.filter(function(st){ return !st.slot; });
    if(frei.length){
      wrap.appendChild(el("div",{class:"sec",text:"Not worn"}));
      var bag=el("div",{class:"chips"});
      frei.forEach(function(st){ bag.appendChild(chip(st)); });
      wrap.appendChild(bag);
    }
  }

  if(UI.invView==="grid"){
    /* Das Kachelraster (REQ-065). Dieselben Daten wie oben — was hier liegt,
       liegt auch in einer Stufe; das Raster sagt nur, *wo* im Rucksack.
       Die Form kommt aus `Footprint`, das der Import schon füllt. */
    var size=invSize();
    var g=el("div",{class:"invgrid"+(gewaehlt?" picking":"")});
    g.style.gridTemplateColumns="repeat("+size.cols+",1fr)";
    for(var y=0;y<size.rows;y++)for(var x=0;x<size.cols;x++)(function(x,y){
      var c=el("div",{class:"gcell"});
      c.style.gridColumn=(x+1); c.style.gridRow=(y+1);
      dropZiel(c,function(st){
        if(!fitsAt(stuecke,st,x,y)){ UI.err="It does not fit there."; render(); return; }
        lege(st,{gx:x,gy:y});
      });
      g.appendChild(c);
    })(x,y);

    stuecke.forEach(function(st){
      if(st.gx==null||st.gy==null)return;
      var fp=footprintOf(st.item);
      var box=el("div",{class:"gitem"+(st.rel.id===UI.invPick?" selected":"")});
      box.style.gridColumn=(st.gx+1)+" / span "+fp.w;
      box.style.gridRow=(st.gy+1)+" / span "+fp.h;
      box.style.gridTemplateColumns="repeat("+fp.w+",1fr)";
      box.style.gridTemplateRows="repeat("+fp.h+",1fr)";
      for(var yy=0;yy<fp.h;yy++)for(var xx=0;xx<fp.w;xx++){
        var f=el("i",{class:fpFilled(fp,xx,yy)?"on":"off"});
        box.appendChild(f);
      }
      var lab=el("span",{class:"glab",text:nameOf(st.item)+(st.qty>1?" ×"+st.qty:"")});
      box.appendChild(lab);
      box.setAttribute("draggable",me.write?"true":"false");
      box.title=nameOf(st.item)+" — "+fp.w+"×"+fp.h;
      box.addEventListener("click",function(ev){
        ev.stopPropagation();
        if(ev.shiftKey||!me.write){ go({k:"art",id:st.item.id}); return; }
        UI.invPick=(UI.invPick===st.rel.id?"":st.rel.id); render();
      });
      box.addEventListener("dragstart",function(ev){ UI.invPick=st.rel.id;
        try{ ev.dataTransfer.setData("text/plain",st.rel.id); }catch(x){} });
      g.appendChild(box);
    });
    wrap.appendChild(g);

    var lose=stuecke.filter(function(st){ return st.gx==null||st.gy==null; });
    if(lose.length){
      wrap.appendChild(el("p",{class:"hint",
        text:lose.length+" item"+(lose.length===1?"":"s")+" not placed yet — pick one, then click a free cell."}));
      var tray=el("div",{class:"chips"});
      lose.forEach(function(st){ tray.appendChild(chip(st)); });
      wrap.appendChild(tray);
    }
    wrap.appendChild(el("p",{class:"hint",
      text:size.cols+"×"+size.rows+" — set inventoryCols and inventoryRows under Data model · Settings."}));
  }
  return wrap;
}

/* Ein Inventar anlegen und an die Figur hängen. Ein Behälter, den man erst
   im Register verdrahten müsste, legt niemand an. */
function newInventory(e){
  var name=nameOf(e)+" — gear";
  var inv={ id:uid("inv"), interfaces:[INV_IFACE], name:name, tags:[],
    components:{ Name:{text:name}, Identity:{key:"inventory/"+slug(name),aliases:[]} },
    adhoc:[], blocks:[], relations:[], createdAt:new Date().toISOString() };
  reqFor(INV_IFACE).forEach(function(c){ if(!inv.components[c]&&REG.components[c]) inv.components[c]={}; });
  applyDefaults(inv,INV_IFACE);
  ENT.set(inv.id,inv);
  persist(inv);
  e.relations=e.relations||[];
  e.relations.push({id:uid("r"),type:REL_CARRIES,to:inv.id,props:{}});
  persist(e);
}

function addToInventory(inv){
  dialog("Put something in",function(host,close){

    function fuelle(){

        sel.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
      });
      if(!sel.childNodes.length) sel.appendChild(el("option",{value:""},"— nothing matches —"));
    }
    suche.addEventListener("input",fuelle); fuelle();
    var tier=el("select",{class:"i"});
    TIERS.forEach(function(t){ tier.appendChild(el("option",{value:t[0]},t[1])); });
    tier.value="pack";
    var qty=el("input",{class:"i",type:"number",value:"1",min:"1"});
    host.appendChild(field("Item",suche));
    host.appendChild(sel);
    host.appendChild(field("Within reach",tier));
    host.appendChild(field("Quantity",qty));
    actions(host,close,function(){
      if(!sel.value)return false;

      inv.relations.push({id:uid("r"),type:REL_HOLDS,to:sel.value,
