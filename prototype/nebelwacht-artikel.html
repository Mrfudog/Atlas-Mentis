  wrap.appendChild(el("p",{class:"hint",
    text:"Weights, not ranges — the ranges are computed, so inserting a row does not break the numbering."}));
  return wrap;
}

function addTableEntry(e){
  var card=(e.components||{})[TABLE_COMP]||{};
  dialog("Add an entry",function(host,close){
    var art=el("select",{class:"i"});
    art.appendChild(el("option",{value:"row"},"Plain text — points at nothing"));
    art.appendChild(el("option",{value:"ref"},"An article — or another table"));
    var txt=el("input",{class:"i",type:"text",placeholder:"What it says"});
    var suche=el("input",{class:"i",type:"text",placeholder:"Search articles…"});
    var sel=el("select",{class:"i",size:"6",style:"height:auto"});
    function fuelle(){
      var q=suche.value.toLowerCase().trim();
      sel.textContent="";
      byName().forEach(function(c){
        if(c.id===e.id)return;
        if(q&&nameOf(c).toLowerCase().indexOf(q)<0)return;
        sel.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
      });
      if(!sel.childNodes.length) sel.appendChild(el("option",{value:""},"— nothing matches —"));
    }
    suche.addEventListener("input",fuelle); fuelle();
    var gew=el("input",{class:"i",type:"number",value:"1",min:"0",step:"0.5"});
    var menge=el("input",{class:"i",type:"text",placeholder:"1 or 2d4"});
    var marke=el("input",{class:"i",type:"text",placeholder:"only where tagged…"});
    var refFeld=field("Article",suche), listFeld=sel, txtFeld=field("Text",txt);
    host.appendChild(field("Kind",art));
    host.appendChild(txtFeld);
    host.appendChild(refFeld); host.appendChild(listFeld);
    host.appendChild(field("Weight",gew));
    host.appendChild(field("Quantity",menge));
    host.appendChild(field("Condition",marke));
    function zeige(){
      var ref=art.value==="ref";
      refFeld.style.display=ref?"":"none";
      listFeld.style.display=ref?"":"none";
      txtFeld.style.display=ref?"none":"";
    }
    art.addEventListener("change",zeige); zeige();
    actions(host,close,function(){
      var g=Number(gew.value)||1;
      if(art.value==="ref"){
        if(!sel.value)return false;
        e.relations=e.relations||[];
        e.relations.push({id:uid("r"),type:REL_ENTRY,to:sel.value,props:{
          weight:g,qty:menge.value.trim()||undefined,
          requiresTag:marke.value.trim()||undefined}});
      } else {
        var t=txt.value.trim(); if(!t){txt.focus();return false;}
        e.components=e.components||{};
        e.components[TABLE_COMP]=Object.assign({},card,{rows:(card.rows||[]).concat([{
          id:uid("tr"),text:t,weight:g,qty:menge.value.trim()||undefined,
          requiresTag:marke.value.trim()||undefined}])});
      }
      persist(e);
    },"Add");
  });
}

/* ---------- Aufträge und Zeitleiste (REQ-082, 083, 106) ----------
   Aufgaben liegen als Feld am Auftrag, nicht als Kanten: „bring das Fass
   zurück" zeigt auf nichts, was eine eigene ID verdiente. Zeigt eine Aufgabe
   doch auf etwas, steht das im Text als [[Verweis]] — und der löst sich auf
   wie jeder andere. Dieselbe Trennlinie wie bei den Formen auf dem Board.

   Was auf dem Brett *steht*, entscheidet das Wissen: ein Auftrag, dessen
   Informationen du nicht kennst, steht als Gerücht da, nicht als Zeile mit
   Belohnung. Das Wissensmodell aus A6 trägt auch hier. */
var QUEST_IFACE="Quest", QUEST_COMP="QuestInfo";
var QUEST_STATES=[
  ["rumoured","Rumoured"],["offered","Offered"],["accepted","Running"],
  ["done","Done"],["failed","Failed"],["abandoned","Dropped"]
];

function questCard(q){ return (q.components||{})[QUEST_COMP]||{}; }
function questTasks(q){
  var t=questCard(q).tasks;
  return Array.isArray(t)?t:[];
}
/* Wie viel weiss dieser Betrachter vom Auftrag? Dieselben drei Zustände wie
   beim Rezept — offen, teilweise, verborgen. */
function questKnowledge(q,viewerId){
  var infos=infosOf(q);
  if(!infos.length)return "open";
  var n=infos.filter(function(i){ return knowsInfo(i,viewerId); }).length;
  return n===infos.length?"known":(n?"partial":"hidden");
}

function elQuests(e,ifn,item){
  var wrap=el("div",{class:"quests"});

  /* Auf dem Auftrag selbst: die Aufgaben zum Abhaken. */
  if(ifn===QUEST_IFACE||((e.components||{})[QUEST_COMP])){
    var card=questCard(e);
    var kopf=el("div",{class:"crhead"});
    var lab=QUEST_STATES.filter(function(x){return x[0]===card.state;})[0];
    kopf.appendChild(el("span",{class:"pill",text:lab?lab[1]:(card.state||"—")}));
    if(card.deadline) kopf.appendChild(el("span",{class:"pill q",text:"by "+card.deadline}));
    if(card.reward) kopf.appendChild(el("span",{class:"pill q",text:card.reward}));
    if(card.restriction) kopf.appendChild(el("span",{class:"pill q",text:card.restriction}));
    if(canWrite()){
      var sel=el("select",{class:"bsel"});
      QUEST_STATES.forEach(function(x){ sel.appendChild(el("option",{value:x[0]},x[1])); });
      sel.value=card.state||"rumoured";
      sel.addEventListener("change",function(){
        e.components[QUEST_COMP]=Object.assign({},card,{state:sel.value}); persist(e); });
      kopf.appendChild(sel);
    }
    wrap.appendChild(kopf);

    var aufgaben=questTasks(e);
    wrap.appendChild(el("div",{class:"sec",text:"Tasks"}));
    if(!aufgaben.length) wrap.appendChild(el("p",{class:"hint",text:"None yet."}));
    var liste=el("div",{class:"tasks"});
    aufgaben.forEach(function(t){
      var row=el("label",{class:"task"+(t.done?" done":"")});
      var cb=el("input",{type:"checkbox"});
      cb.checked=!!t.done; cb.disabled=!canWrite();
      cb.addEventListener("change",function(){
        var neu=aufgaben.map(function(x){
          return x===t?Object.assign({},x,{done:cb.checked}):x; });
        e.components[QUEST_COMP]=Object.assign({},card,{tasks:neu}); persist(e);
      });
      row.appendChild(cb);
      row.appendChild(inline(t.text||"",el("span")));
      if(t.optional) row.appendChild(el("span",{class:"co",text:"optional"}));
      if(canWrite()) row.appendChild(el("button",{class:"btn gh sm",type:"button",
        onclick:function(ev){ ev.preventDefault();
          var neu=aufgaben.filter(function(x){return x!==t;});
          e.components[QUEST_COMP]=Object.assign({},card,{tasks:neu}); persist(e); }},"×"));
      liste.appendChild(row);
    });
    wrap.appendChild(liste);
    if(canWrite()){
      var neu2=el("input",{class:"i",type:"text",placeholder:"A task — [[links]] work here"});
      var bar=el("div",{class:"addbar",style:"margin-top:8px"});
      bar.appendChild(neu2);
      bar.appendChild(el("button",{class:"btn sm",type:"button",onclick:function(){
        var txt=neu2.value.trim(); if(!txt)return;
        e.components[QUEST_COMP]=Object.assign({},card,
          {tasks:aufgaben.concat([{id:uid("t"),text:txt,done:false}])});
        persist(e);
      }},"Add task"));
      wrap.appendChild(bar);
    }
    /* Fortschritt: die Zahl, nach der am Tisch gefragt wird. */
    var fertig=aufgaben.filter(function(t){return t.done;}).length;
    if(aufgaben.length) wrap.appendChild(el("p",{class:"hint",
      text:fertig+" of "+aufgaben.length+" done"}));
    return wrap;
  }

  /* Sonst: das Brett. Gruppiert nach Stand, gefiltert durchs Wissen. */
  var alle=[];
  ENT.forEach(function(o){ if(((o.interfaces||[])[0])===QUEST_IFACE) alle.push(o); });
  if(!alle.length){ wrap.appendChild(el("p",{class:"hint",text:"No quests yet."}));
    return wrap; }
  alle.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});

  QUEST_STATES.forEach(function(st){
    var drin=alle.filter(function(q){ return (questCard(q).state||"rumoured")===st[0]; });
    if(!drin.length)return;
    wrap.appendChild(el("div",{class:"sec",text:st[1]}));
    var box=el("div",{class:"qlist"});
    drin.forEach(function(q){
      var w=questKnowledge(q,e.id);
      var row=el("div",{class:"qrow "+(w==="hidden"?"unknown":"")});
      var c=questCard(q);
      var t2=el("div",{class:"qt"});
      t2.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:q.id});}},
        w==="hidden"?"(a rumour you have not chased)":nameOf(q)));
      if(w==="partial") t2.appendChild(el("span",{class:"co",text:"partly known"}));
      row.appendChild(t2);
      if(w!=="hidden"){
        var auf=questTasks(q);
        var fert=auf.filter(function(x){return x.done;}).length;
        row.appendChild(el("span",{class:"qmeta",
          text:(auf.length?fert+"/"+auf.length+" tasks":"")+
            (c.deadline?"  ·  "+c.deadline:"")+(c.reward?"  ·  "+c.reward:"")}));
      }
      box.appendChild(row);
    });
    wrap.appendChild(box);
  });
  return wrap;
}

/* ---------- Zeitleiste (REQ-106) ----------
   Jeder Artikel mit einem Weltdatum steht darauf, nicht nur Ereignisse:
   eine Sitzung, ein Vertrag, ein Todesfall sind dasselbe für die Zeitleiste.
   Sortiert nach `sort`, gelesen `display` — deshalb stehen beide im Schema. */
function worldDated(){
  var out=[];
  ENT.forEach(function(o){
    var wd=(o.components||{}).WorldDate;
    if(!wd)return;
    if(wd.sort===undefined&&!wd.display)return;
    out.push({e:o,wd:wd,sort:Number(wd.sort)});
  });
  out.sort(function(a,b){
    var as=isFinite(a.sort)?a.sort:Infinity, bs=isFinite(b.sort)?b.sort:Infinity;
    if(as!==bs)return as-bs;
    return nameOf(a.e).localeCompare(nameOf(b.e),"de");
  });
  return out;
}
function elTimeline(e,ifn,item){
  var wrap=el("div",{class:"tline"});
  var alle=worldDated();
  if(!alle.length){
    wrap.appendChild(el("p",{class:"hint",
      text:"Nothing carries a world date yet. Give an article a WorldDate card — `sort` orders it, `display` is what gets read out."}));
    return wrap;
  }
  var kal=setting("calendar","");
  if(kal) wrap.appendChild(el("p",{class:"hint",text:"Calendar: "+kal}));
  alle.forEach(function(x){
    var row=el("div",{class:"tl"+(x.e.id===e.id?" here":"")});
    row.appendChild(el("span",{class:"tdate",text:x.wd.display||String(x.wd.sort||"")}));
    var b=el("div",{class:"tbody"});
    b.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:x.e.id});}},nameOf(x.e)));
    b.appendChild(el("span",{class:"pill q",text:ifaceName(x.e)}));
    var d=((x.e.components||{}).Description||{}).raw;
    if(d) b.appendChild(para(fillVars(d,null,x.e),"co"));
    if(x.wd.duration) b.appendChild(el("span",{class:"co",text:x.wd.duration}));
    row.appendChild(b);
    wrap.appendChild(row);
  });
  return wrap;
}

/* ---------- Regeln: nachschlagen, verweisen, anheften (REQ-091, 098, 099, 175) ----------
   Der Massstab steht in REQ-098: unter fünf Sekunden. Daran hängt alles
   andere — wer eine Regel erst sucht, dann öffnet, dann liest, hat die
   fünf Sekunden schon überschritten. Also: alles auf einer Seite, der Text
   gleich mit, und getippt wird höchstens ein Wortanfang.

   **Verweise im Fliesstext** (REQ-175) sind der zweite Weg dorthin: wo eine
   Regel beim Namen genannt wird, steht sie auch. Das Erkennen ist bewusst
   vorsichtig — nur ganze Wörter, nur ab vier Zeichen, und nur, wo genau
   eine Regel in Frage kommt. Ein falscher Treffer kostet mehr Vertrauen,
   als zehn richtige einbringen; deshalb lässt sich das Erkennen je Regel
   abschalten und im Zweifel unterbleibt es.

   **Angeheftete Regeln** (REQ-099) liegen im eigenen Bereich des Nutzers —
   `data/users/me` ist je Betrachter privat. Ein Merkzettel, den alle sehen,
   ist keiner. */
var RULE_IFACE="Rule", RULE_COMP="RuleInfo";
var pinned=[], pinsLoaded=false;

function ruleArticles(){
  var out=[];
  ENT.forEach(function(e){
    if(((e.interfaces||[])[0])!==RULE_IFACE)return;
    if(!articleVisible(e))return;
    out.push(e);
  });
  out.sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"de");});
  return out;
}
function ruleText(e){
  var d=((e.components||{}).Description||{}).raw;
  if(d)return d;
  var b=(e.blocks||[])[0];
  return b?b.body:"";
}
/* Die Namen und Aliasse, gegen die der Fliesstext geprüft wird. Lang vor
   kurz, damit „Umschlingen des Schleims" nicht als „Umschlingen" endet. */
var ruleIndexSig="", ruleIndex=[];
function rebuildRuleIndex(){
  var sig=[];
  var eintraege=[];
  ENT.forEach(function(e){
    if(((e.interfaces||[])[0])!==RULE_IFACE)return;
    var info=(e.components||{})[RULE_COMP]||{};
    if(info.autolink===false)return;
    var id=(e.components||{}).Identity||{};
    var namen=[rawName(e)].concat(Array.isArray(id.aliases)?id.aliases:[]);
    namen.forEach(function(n){
      var t=String(n||"").trim();
      if(t.length<4)return;                  /* zu kurz, trifft zu oft */
      eintraege.push({t:t,low:t.toLowerCase(),id:e.id});
    });
    sig.push(e.id+":"+namen.join("|"));
  });
  var s2=sig.sort().join(";");
  if(s2===ruleIndexSig)return ruleIndex;
  /* Mehrdeutige Namen fliegen raus: „auto-link when unambiguous" (REQ-013),
     und Uneindeutigkeit heisst hier: zwei Regeln, ein Wort. */
  var zaehler={};
  eintraege.forEach(function(x){ (zaehler[x.low]=zaehler[x.low]||[]).push(x.id); });
  ruleIndex=eintraege.filter(function(x){
    var ids=zaehler[x.low];
    return ids.length===1||ids.every(function(i){return i===ids[0];});
  }).sort(function(a,b){ return b.t.length-a.t.length; });
  ruleIndexSig=s2;
  return ruleIndex;
}
/* Einen Textknoten nach Regelnamen absuchen und die Treffer ersetzen. Läuft
   über die fertigen Knoten, nicht über den Rohtext: so bleiben [[Verweise]]
   und {VAR} unangetastet — sie sind schon Elemente, keine Zeichen mehr. */
function markRules(root){
  if(!root)return root;
  var idx=rebuildRuleIndex();
  if(!idx.length)return root;
  var texte=[];
  (function sammle(n){
    for(var i=0;i<n.childNodes.length;i++){
      var k=n.childNodes[i];
      if(k.nodeType===3) texte.push(k);
      else if(k.nodeType===1&&k.tagName!=="BUTTON"&&!k.classList.contains("ruleref")) sammle(k);
    }
  })(root);
  texte.forEach(function(tn){
    var s2=tn.nodeValue;
    if(!s2||s2.length<4)return;
    var low=s2.toLowerCase();
    var treffer=null, at=-1;
    for(var i=0;i<idx.length;i++){
      var p=low.indexOf(idx[i].low);
      while(p>=0){
        var vor=p===0?" ":s2.charAt(p-1);
        var nach=p+idx[i].t.length>=s2.length?" ":s2.charAt(p+idx[i].t.length);
        if(!/[\wÄÖÜäöüß]/.test(vor)&&!/[\wÄÖÜäöüß]/.test(nach)){ treffer=idx[i]; at=p; break; }
        p=low.indexOf(idx[i].low,p+1);
      }
      if(treffer)break;
    }
    if(!treffer)return;
    var e=ENT.get(treffer.id); if(!e)return;
    var frag=document.createDocumentFragment();
    if(at>0) frag.appendChild(document.createTextNode(s2.slice(0,at)));
    frag.appendChild(ruleChip(e,s2.substr(at,treffer.t.length)));
    var rest=s2.slice(at+treffer.t.length);
    if(rest) frag.appendChild(document.createTextNode(rest));
    tn.parentNode.replaceChild(frag,tn);
  });
  return root;
}
/* Ein Verweis, der sich an Ort und Stelle aufklappt. Wegspringen und
   zurückspringen sind zwei Schritte zu viel für fünf Sekunden. */

function renderRules(v){
  v.appendChild(el("h2",{text:"Rules"}));

  var arten=el("div",{class:"chips"});

  alle.forEach(function(e){

      "aria-pressed":String(UI.ruleKind===k),

  v.appendChild(suche);

  if(pinned.length){
    var pb=el("div",{class:"pinbar"});

      var e=ENT.get(id); if(!e)return;
      pb.appendChild(el("button",{class:"chip",type:"button",
        onclick:function(){ UI.ruleQ=rawName(e); suche.value=UI.ruleQ; zeichne(); }},nameOf(e)));
    });
    v.appendChild(pb);
  }
  v.appendChild(body);

  function zeichne(){
    body.textContent="";
    var q=String(UI.ruleQ||"").toLowerCase().trim();
    var treffer=alle.filter(function(e){
      if(UI.ruleKind&&(((e.components||{})[RULE_COMP]||{}).kind||"—")!==UI.ruleKind)return false;
      if(!q)return true;
      if(nameOf(e).toLowerCase().indexOf(q)>=0)return true;
      var al=((e.components||{}).Identity||{}).aliases||[];
      if(al.some(function(a){return String(a).toLowerCase().indexOf(q)>=0;}))return true;
      return ruleText(e).toLowerCase().indexOf(q)>=0;
    });
    /* Namenstreffer vor Texttreffern: wer „Umschlingen" tippt, meint die
       Regel und nicht jede, die das Wort erwähnt. */
    treffer.sort(function(a,b){
      var an=nameOf(a).toLowerCase().indexOf(q)>=0?0:1;
      var bn=nameOf(b).toLowerCase().indexOf(q)>=0?0:1;
      if(an!==bn)return an-bn;
      return nameOf(a).localeCompare(nameOf(b),"de");
    });
    body.appendChild(el("p",{class:"count",
      text:treffer.length+" of "+alle.length}));
    var liste=el("div",{class:"rules"});
    treffer.slice(0,40).forEach(function(e){
      var info=(e.components||{})[RULE_COMP]||{};
      var karte=el("div",{class:"rule"});
      var kopf=el("div",{class:"rk"});
      kopf.appendChild(el("button",{class:"ref",type:"button",
        onclick:function(){go({k:"art",id:e.id});}},nameOf(e)));
      if(info.kind) kopf.appendChild(el("span",{class:"pill q",text:info.kind}));
      if(info.uses) kopf.appendChild(el("span",{class:"co",text:info.uses}));
      if(info.recharge) kopf.appendChild(el("span",{class:"co",text:"recharge "+info.recharge}));
      kopf.appendChild(pinButton(e));
      karte.appendChild(kopf);
      /* Der Text steht gleich da — das ist der ganze Punkt. */
      karte.appendChild(inline(fillVars(ruleText(e),null,e),el("p",{class:"rt"})));
      /* Wer die Regel benutzt: der Rückbezug, den `composedOf` schon trägt. */
      var nutzer=[];
      ENT.forEach(function(o){
        (o.relations||[]).forEach(function(r){
          if(r.to===e.id&&relDef(r.type).section&&articleVisible(o)) nutzer.push(o);
        });
      });
      if(nutzer.length){
        var nb=el("div",{class:"rusers"});
        nb.appendChild(el("span",{class:"rl",text:"used by"}));
        nutzer.slice(0,8).forEach(function(o){
          nb.appendChild(el("button",{class:"ref",type:"button",
            onclick:function(){go({k:"art",id:o.id});}},nameOf(o)));
        });
        karte.appendChild(nb);
      }
      liste.appendChild(karte);
    });
    body.appendChild(liste);
    if(treffer.length>40) body.appendChild(el("p",{class:"hint",
      text:"…and "+(treffer.length-40)+" more. Narrow it down."}));
  }
  zeichne();
  setTimeout(function(){ try{ suche.focus(); }catch(x){} },0);
}

/* ---------- Sicherung und Ausfuhr (REQ-029, 155, 191, 192) ----------
   Der Grund steht in der alten App: ein misslungener Ladevorgang wurde von
   der nächsten Selbstspeicherung überschrieben, und der unlesbare Stand war
   danach weg. Deshalb zwei Regeln, die nichts kosten und alles retten:

   **Nach einem kaputten Ladevorgang wird nicht geschrieben.** `loadFailed`
   schliesst jeden Schreibweg, und die Seite sagt, was ausblieb, statt es
   zuzudecken. Was da ist, lässt sich weiterhin herunterladen — auch und
   gerade dann.

   **Eine fremde Änderung am offenen Artikel wird gesagt, nicht verschluckt.**
   Der Speicher kennt keine Bedingung am Schreiben, also lässt sich der
   zweite Schreiber nicht abweisen; erkennen und hinschreiben lässt er sich
   schon, und das ist mehr, als eine stille Überschreibung hinterlässt. */
var loadFailed="", lastSeenAt={}, lastWroteAt={}, foreignEdit="";

function blockedByLoad(){
  if(!loadFailed)return false;
  UI.err="Nothing is being saved: "+loadFailed+
    " Reload the page. Until then you can still download what is here — "+
    "Data model · Backup.";
  render();
  return true;
}

/* Der ganze Stand als ein Stück. Was hier hineingeht, geht auch wieder
   heraus: Register und Artikel, sonst nichts, und die Fassung dazu, damit
   ein späteres Einlesen weiss, was es vor sich hat. */
function exportState(){
  var ents=[];
  ENT.forEach(function(e){ ents.push(e); });
  ents.sort(function(a,b){ return String(a.id).localeCompare(String(b.id)); });
  return {
    format:"nebelwacht/1",
    at:new Date().toISOString(),
    registry:{interfaces:REG.interfaces,components:REG.components,
      relations:REG.relations,views:REG.views,vars:REG.vars,settings:REG.settings},
    entities:ents
  };
}
function exportFilename(){
  return "nebelwacht-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".json";
}
/* Herunterladen: über die Laufzeit, wenn sie es anbietet, sonst über einen
   Link. Der Rückfall ist kein Beiwerk — eine Sicherung, die von einer
   Fähigkeit abhängt, ist genau dann weg, wenn man sie braucht. */
function downloadState(melde){
  var text=JSON.stringify(exportState(),null,1);
  var name=exportFilename();
  function fallback(){
    try{
      var blob=new Blob([text],{type:"application/json"});
      var a=el("a",{href:URL.createObjectURL(blob),download:name});
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
      melde&&melde("Downloaded "+name+" ("+Math.round(text.length/1024)+" KB).");
    }catch(x){ melde&&melde("Could not download: "+((x&&x.message)||x)); }
  }
  if(!downloadNS){ fallback(); return; }
  downloadNS.save({filename:name,data:text}).then(function(){
    melde&&melde("Saved "+name+" ("+Math.round(text.length/1024)+" KB).");
  })["catch"](function(x){
    var c=(x&&x.code)||"";
    if(c==="declined"){ melde&&melde("Not saved."); return; }
    fallback();
  });
}

/* Einlesen. Erst sagen, was es täte, dann tun — eine Wiederherstellung, die
   ohne Vorschau schreibt, ist ein zweiter Datenverlust mit Anlauf. */
function importReport(daten){
  var r={ok:false,fehler:[],neu:0,geaendert:0,gleich:0,weg:0,teile:[]};
  if(!daten||typeof daten!=="object"){ r.fehler.push("Not an object."); return r; }
  if(daten.format&&String(daten.format).indexOf("nebelwacht/")!==0)
    r.fehler.push("Unknown format: "+daten.format);
  if(!daten.registry||typeof daten.registry!=="object")
    r.fehler.push("No registry in the file.");
  if(!Array.isArray(daten.entities))
    r.fehler.push("No entities in the file.");
  if(r.fehler.length)return r;
  ["interfaces","components","relations","views","vars","settings"].forEach(function(t){
    if(daten.registry[t]&&typeof daten.registry[t]==="object")
      r.teile.push(t+" ("+Object.keys(daten.registry[t]).length+")");
  });
  var drin={};
  daten.entities.forEach(function(e){
    if(!e||!e.id){ r.fehler.push("An entity without an id."); return; }
    drin[e.id]=1;
    var alt=ENT.get(e.id);
    if(!alt) r.neu++;
    else if(JSON.stringify(alt)===JSON.stringify(e)) r.gleich++;
    else r.geaendert++;
  });
  ENT.forEach(function(e){ if(!drin[e.id]) r.weg++; });
  r.ok=r.fehler.length===0;
  return r;
}
function applyImport(daten,loeschen,melde){
  var reg=daten.registry||{};
  ["interfaces","components","relations","views","vars","settings"].forEach(function(t){
    if(reg[t]&&typeof reg[t]==="object"){ REG[t]=thawed(reg[t]); saveReg(t); }
  });
  var drin={};
  (daten.entities||[]).forEach(function(e){
    if(!e||!e.id)return;
    drin[e.id]=1;
    var kopie=thawed(e);
    ENT.set(kopie.id,kopie);
    persist(kopie);
  });
  var fort=0;
  if(loeschen){
    var weg=[];
    ENT.forEach(function(e){ if(!drin[e.id]) weg.push(e.id); });
    weg.forEach(function(id){ drop(id); fort++; });
  }
  melde&&melde("Restored "+Object.keys(drin).length+" articles"+
    (fort?", removed "+fort:"")+".");
  render();
}

  bar2.appendChild(el("button",{class:"btn",type:"button",onclick:function(){

  v.appendChild(opt);

  /* Blockanker nachtragen. Steht hier, weil es dieselbe Sorte Arbeit ist

  v.appendChild(el("div",{class:"sec",text:"Block anchors"}));

      : "If a part of the registry or the articles fails to arrive, the page stops writing rather than saving over what it could not read. That is the one lesson from the old app that cost the most."}));
  return v;

/* ---------- Der Tisch in Echtzeit (REQ-071, 116, 117) ----------
   Zwei Kanäle, und sie tragen Verschiedenes.

   **Der Speicher ist der Kanal für alles, was bleibt.** `onSnapshot` liefert
   jede Änderung an jedes offene Fenster — die Seite war also schon vor
   diesem Abschnitt mehrgerätefähig, ohne dass es jemand gesagt hätte. Runde,
   Zug, Trefferpunkte, die laufende Szene: alles das steht im Speicher und
   kommt von dort bei allen an, auch bei dem, der zehn Minuten später
   dazukommt.

   **Der Raum ist der Kanal für Augenblicke.** Ein Wurf und ein Zeigen auf
   die Karte sind nichts, was jemand später nachlesen muss; sie werden
   gesendet, gehört und vergessen. Genau dafür ist er da — und genau deshalb
   steht dort nichts, was ein Nachzügler braucht.

   Wer gerade zusieht, ist Anwesenheit: sie beschreibt den Absender und
   befiehlt niemandem, darum darf sie jeder setzen. */
var roomNS=null, PING_MS=4000;

function roomPeers(){ return UI.peers||[]; }
/* Anwesenheit: woran ich gerade bin. Nur Kennungen und kurze Wörter — was
   hier steht, sieht jeder im Raum. */
function pushPresence(){
  if(!roomNS)return;
  var e=UI.route.k==="art"?ENT.get(UI.route.id):null;
  roomNS.presence({
    at:UI.route.k,
    article:e?e.id:null,
    title:e?nameOf(e).slice(0,60):null,
    view:UI.view||null,
    actor:viewerActor()||null,
    gm:isGM()?true:false
  })["catch"](function(){});
}
/* Ein Wurf, den alle sehen (REQ-071). Der Verlauf bleibt örtlich — er ist
   eine Erinnerungsstütze, kein Protokoll; wer ein Protokoll will, schreibt
   es in die Sitzung. */
function whoAmI(){
  var a=ENT.get(viewerActor());
  return a?nameOf(a):(isGM()?"GM":"Someone");
}
function shareRoll(was,r){
  logRoll(was,r,whoAmI());
  if(roomNS) roomNS.emit("roll",{who:whoAmI(),what:was,total:r.total,text:rollText(r)})
    ["catch"](function(){});
}
/* Auf die Karte zeigen. Das ist der Grund, warum es den Raum überhaupt
   braucht: „da" lässt sich nicht speichern. */
function pingMap(mapId,x,y){
  var p={id:uid("pg"),map:mapId,x:x,y:y,at:Date.now(),who:whoAmI()};
  addPing(p);
  if(roomNS) roomNS.emit("ping",p)["catch"](function(){});
}
function addPing(p){
  UI.pings=(UI.pings||[]).filter(function(x){ return Date.now()-x.at<PING_MS; }).concat([p]);
  render();
  setTimeout(function(){
    UI.pings=(UI.pings||[]).filter(function(x){ return x.id!==p.id; });
    render();
  },PING_MS);
}

function elLive(e,ifn,item){
  var card=(e.components||{}).SessionState||{};
  var wrap=el("div",{class:"live"});
  var darf=isGM()||card.stewardship==="table";

  /* Wer gerade zusieht. Eine leere Liste heisst nicht „niemand" — sie heisst
     „dieser Raum ist hier nicht erreichbar"; das steht auch so da. */
  wrap.appendChild(el("div",{class:"sec",text:"At the table"}));
  if(!roomNS) wrap.appendChild(el("p",{class:"hint",
    text:"No live channel in this view — everything below still syncs through the store, just without the little dots."}));
  var leute=roomPeers();
  var pbox=el("div",{class:"chips"});
  if(!leute.length) pbox.appendChild(el("span",{class:"hint",style:"margin:0",text:"Only you."}));
  leute.forEach(function(pe){
    var pr=pe.presence||{};

    wrap.appendChild(log);
  }
  return wrap;
}

/* ---------- Würfel (REQ-070) ----------
   Ein Ausdruck, ein Ergebnis, und die Einzelwürfe daneben. Die Einzelwürfe
   sind nicht Zierde: „18" und „1+17" sind am Tisch zweierlei, und wer den
   Wurf nicht sieht, glaubt ihn nicht. Kein `eval` — dieselbe Regel wie beim
   Rechenwerk: Registerzeilen und Eingaben sind Daten. */
function rollDice(ausdruck){
  var txt=String(ausdruck||"").replace(/\s+/g,"").toLowerCase();
  if(!txt)return null;
  var teile=txt.match(/[+-]?[^+-]+/g);
  if(!teile)return null;
  var summe=0, wuerfe=[], ok=true;
  teile.forEach(function(t){
    var vz=1;
    if(t.charAt(0)==="+")t=t.slice(1);
    else if(t.charAt(0)==="-"){ vz=-1; t=t.slice(1); }
    var m=/^(\d*)d(\d+)$/.exec(t);
    if(m){
      var n=Math.min(100,Math.max(1,parseInt(m[1]||"1",10)));
      /* Mindestens eine Seite, nicht zwei: ein W1 ist albern, aber er
         würfelt 1 — ihn auf einen W2 zu heben wäre eine stille Lüge. */
      var seiten=Math.min(1000,Math.max(1,parseInt(m[2],10)));
      for(var i=0;i<n;i++){
        var w=1+Math.floor(Math.random()*seiten);
        wuerfe.push({d:seiten,v:w,vz:vz});
        summe+=vz*w;
      }
      return;
    }
    if(/^\d+$/.test(t)){ summe+=vz*parseInt(t,10); wuerfe.push({flat:vz*parseInt(t,10)}); return; }
    ok=false;
  });
  if(!ok)return null;
  return {total:summe,rolls:wuerfe,expr:ausdruck};
}
function rollText(r){
  if(!r)return "?";
  /* Ein Wurf aus dem Raum bringt seinen Text mit: die Einzelwürfe sind dort
     schon geworfen, und sie hier nachzurechnen hiesse, andere Zahlen zu
     zeigen als der, der gewürfelt hat. */
  if(r.pretty)return r.pretty;
  /* `x.flat === undefined` und nicht `!x.flat`: ein Modifikator von 0 ist
     falsy, und mit `!x.flat` landete er in der Würfelliste und wurde dort
     als „undefined" gezeichnet. Ein Wurf, der undefined anzeigt, glaubt
     niemand mehr — auch die richtigen nicht. */
  var st=r.rolls.filter(function(x){return x.flat===undefined;})
    .map(function(x){return (x.vz<0?"−":"")+x.v;}).join(", ");
  var flach=r.rolls.filter(function(x){return x.flat!==undefined;})
    .reduce(function(a,b){return a+b.flat;},0);
  return r.total+(st?"  ("+st+(flach?(flach>0?" +"+flach:" "+flach):"")+")":"");
}
/* Der Wurf landet im Verlauf — damit man am Ende der Runde noch sagen kann,
   was da eigentlich gefallen ist. */
function logRoll(was,r,wer){
  UI.rollLog.unshift({t:was,r:r,at:Date.now(),who:wer||""});
  if(UI.rollLog.length>12) UI.rollLog.length=12;
}
function rollButton(label,ausdruck,titel){
  return el("button",{class:"btn sm gh dice",type:"button",title:titel||("Roll "+ausdruck),
    onclick:function(){
      var r=rollDice(ausdruck);
      if(!r){ UI.err="Cannot read the dice expression “"+ausdruck+"”."; render(); return; }
      logRoll(label,r); render();
    }},label);
}

/* ---------- Begegnung und Initiative (REQ-085, 115, 144) ----------
   Eine Kante je Teilnehmer, nicht eine mit Anzahl: drei Goblins haben drei
   Mal Trefferpunkte, und eine Zahl an einer Kante könnte nur einen davon
   verletzen.

   Zustände tragen ihre Dauer mit und zählen am Ende des Zuges herunter, der
   sie gesetzt hat. Ohne Dauer vergisst sie der Tisch — das ist der Grund,
   warum sie überhaupt hier stehen und nicht an der Figur.

   `round` und `turn` liegen vorläufig an der Begegnung. Richtig wären
   Sitzungszustände mit Echtzeitkanal (REQ-116); das ist die Stelle, die
   dann umzieht. */
var ENC_IFACE="Encounter", ENC_COMP="EncounterInfo",
    REL_PART="participates", REL_ONMAP="onMap", REL_LOOT="loot";

function encCard(e){ return (e.components||{})[ENC_COMP]||{}; }
function participants(e){
  return (e.relations||[]).filter(function(r){return r.type===REL_PART;})
    .map(function(r){
      var t=ENT.get(r.to);
      var pr=r.props||{};
      return {rel:r,art:t,label:pr.label||(t?nameOf(t):"(missing)"),
        init:Number(pr.init),hp:Number(pr.hp),hpMax:Number(pr.hpMax),
        ally:!!pr.ally,conditions:Array.isArray(pr.conditions)?pr.conditions:[],
        note:pr.note||""};
    });
}
/* Die Reihenfolge: hohe Initiative zuerst, bei Gleichstand die Verbündeten —
   das ist eine Hausregel, und sie steht hier, damit sie jedes Mal gleich
   ausgeht statt jedes Mal neu verhandelt zu werden. */
function initOrder(e){
  return participants(e).sort(function(a,b){
    var d=(isFinite(b.init)?b.init:-99)-(isFinite(a.init)?a.init:-99);
    if(d)return d;
    if(a.ally!==b.ally)return a.ally?-1:1;
    return a.label.localeCompare(b.label,"de");
  });
}

function elInitiative(e,ifn,item){
  var card=encCard(e);
  var liste=initOrder(e);
  var runde=Number(card.round)||0, zug=Number(card.turn)||0;
  if(zug>=liste.length) zug=0;
  var dran=liste[zug]||null;
  UI.turnActor=dran&&dran.art?dran.art.id:"";
  var wrap=el("div",{class:"fight"});

  function schreib(patch){
    e.components=e.components||{};
    e.components[ENC_COMP]=Object.assign({},e.components[ENC_COMP]||{},patch);
    persist(e);
  }
  /* Am Ende eines Zuges laufen die Zustände ab, die in diesem Zug gesetzt
     wurden. Sie dort zu zählen und nicht am Rundenwechsel ist der
     Unterschied zwischen „bis zum Ende deines nächsten Zuges" und „bis
     irgendwann". */
  function naechster(){
    if(!liste.length)return;
    var aktuell=liste[zug];
    if(aktuell){
      var rest=(aktuell.conditions||[]).map(function(c){
        var r2=Object.assign({},c);
        if(isFinite(Number(r2.rounds))) r2.rounds=Number(r2.rounds)-1;
        return r2;
      }).filter(function(c){ return !isFinite(Number(c.rounds))||Number(c.rounds)>0; });
      aktuell.rel.props=Object.assign({},aktuell.rel.props,{conditions:rest});
    }
    var n=zug+1, r3=runde;
    if(n>=liste.length){ n=0; r3=runde+1; }
    schreib({turn:n,round:r3,state:"running"});
  }

  var bar=el("div",{class:"maptools"});
  if(inPlacement) bar.style.display="none";
  bar.appendChild(el("span",{class:"pill",text:"Round "+(runde||"—")}));
  if(canWrite()){
    bar.appendChild(el("button",{class:"btn sm pri",type:"button",
      onclick:naechster},"Next turn ▸"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",
      title:"Roll initiative for everyone who has none",
      onclick:function(){
        liste.forEach(function(p2){
          if(isFinite(p2.init))return;
          var sb=p2.art?statsOf(p2.art).card:{};
          var r4=rollDice("1d20"+(modOf(sb,"dex")>=0?"+":"")+modOf(sb,"dex"));
          logRoll("Initiative "+p2.label,r4);
          p2.rel.props=Object.assign({},p2.rel.props,{init:r4?r4.total:0});
        });
        schreib({state:"running",round:runde||1});
      }},"Roll initiative"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ addParticipants(e); }},"+ Fighters"));
    bar.appendChild(el("button",{class:"btn sm gh",type:"button",
      title:"Back to round zero, initiative cleared",
      onclick:function(){
        confirmDialog("Reset the fight? Initiative and conditions are cleared, hit points stay.",function(){
          (e.relations||[]).forEach(function(r5){
            if(r5.type!==REL_PART)return;
            r5.props=Object.assign({},r5.props,{init:undefined,conditions:[]});
          });
          schreib({round:0,turn:0,state:"planned"});
        }); }},"Reset"));
  }
  wrap.appendChild(bar);

  if(!liste.length){
    wrap.appendChild(el("div",{class:"empty",
      text:canWrite()?"Nobody in this fight yet — add fighters.":"No participants."}));
    return wrap;
  }

  var tb=el("table",{class:"initt"});
  var hd=el("tr");
  ["","Init","Who","HP","Conditions",""].forEach(function(h){ hd.appendChild(el("th",{text:h})); });
  tb.appendChild(hd);
  liste.forEach(function(p2,i){
    var row=el("tr",{class:(i===zug?"now ":"")+(p2.ally?"ally":"foe")+
      ((isFinite(p2.hp)&&p2.hp<=0)?" down":"")});
    row.appendChild(el("td",{class:"turn",text:i===zug?"▶":""}));

    var ci=el("td",{class:"num"});
    if(canWrite()){
      var iv=el("input",{class:"tin",type:"number",value:isFinite(p2.init)?String(p2.init):""});
      iv.addEventListener("change",function(){
        p2.rel.props=Object.assign({},p2.rel.props,
          {init:iv.value===""?undefined:Number(iv.value)});
        persist(e); });
      ci.appendChild(iv);
    } else ci.textContent=isFinite(p2.init)?String(p2.init):"—";
    row.appendChild(ci);

    var cw=el("td");
    if(p2.art) cw.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(){go({k:"art",id:p2.art.id});}},p2.label));
    else cw.appendChild(el("span",{class:"gone",text:p2.label}));
    if(p2.note) cw.appendChild(el("span",{class:"bind",text:p2.note}));
    row.appendChild(cw);

    var ch=el("td",{class:"num hpcell"});
    if(canWrite()){
      /* Schaden wird dem laufenden Zug zugeschrieben: der Wurf landet im
         Verlauf mit dem Namen dessen, der gerade dran ist. */
      ch.appendChild(el("button",{class:"vbtn",type:"button",title:"Damage 1",
        onclick:function(){ traf(p2,-1); }},"−"));
      var hv=el("input",{class:"tin",type:"number",value:isFinite(p2.hp)?String(p2.hp):""});
      hv.addEventListener("change",function(){
        p2.rel.props=Object.assign({},p2.rel.props,
          {hp:hv.value===""?undefined:Number(hv.value)});
        persist(e); });
      ch.appendChild(hv);
      if(isFinite(p2.hpMax)) ch.appendChild(el("span",{class:"vmax",text:"/"+p2.hpMax}));
      ch.appendChild(el("button",{class:"vbtn",type:"button",title:"Heal 1",
        onclick:function(){ traf(p2,1); }},"+"));
    } else ch.textContent=(isFinite(p2.hp)?p2.hp:"—")+(isFinite(p2.hpMax)?"/"+p2.hpMax:"");
    row.appendChild(ch);

    var cc=el("td",{class:"conds"});
    (p2.conditions||[]).forEach(function(c){
      var chip=el("span",{class:"chip cond"},
        c.name+(isFinite(Number(c.rounds))?" ("+c.rounds+")":""));
      if(canWrite()) chip.appendChild(el("button",{class:"x",type:"button",
        onclick:function(){
          p2.rel.props=Object.assign({},p2.rel.props,
            {conditions:(p2.conditions||[]).filter(function(x){return x!==c;})});
          persist(e); }},"×"));
      cc.appendChild(chip);
    });
    if(canWrite()){
      var add=el("select",{class:"bsel"});
      add.appendChild(el("option",{value:""},"+ condition"));
      conditionList().forEach(function(c){ add.appendChild(el("option",{value:c},c)); });
      add.addEventListener("change",function(){
        if(!add.value)return;
        var dauer=prompt?null:null;
        p2.rel.props=Object.assign({},p2.rel.props,{conditions:
          (p2.conditions||[]).concat([{name:add.value,rounds:1,source:dran?dran.label:""}])});
        persist(e);
      });
      cc.appendChild(add);
    }
    row.appendChild(cc);

    var cx=el("td");
    if(canWrite()) cx.appendChild(el("button",{class:"btn gh sm",type:"button",title:"Remove",
      onclick:function(){
        e.relations=e.relations.filter(function(x){return x.id!==p2.rel.id;});
        persist(e); }},"×"));
    row.appendChild(cx);
    tb.appendChild(row);
  });
  wrap.appendChild(tb);

  function traf(p2,d){
    var jetzt=isFinite(p2.hp)?p2.hp:(isFinite(p2.hpMax)?p2.hpMax:0);
    p2.rel.props=Object.assign({},p2.rel.props,{hp:jetzt+d});
    logRoll((dran?dran.label+" → ":"")+p2.label+(d<0?" damage":" healed"),
      {total:Math.abs(d),rolls:[{flat:Math.abs(d)}],expr:"manual"});
    persist(e);
  }

  /* Die Karte, auf der gekämpft wird, mit dem Zeiger auf dem, der dran ist
     (REQ-144). Dieselbe Karte, derselbe Zeichner — nur der Ring ist neu. */
  var mapRel=(e.relations||[]).filter(function(r){return r.type===REL_ONMAP;})[0];
  var karte=mapRel?ENT.get(mapRel.to):null;
  if(karte&&!inPlacement){
    wrap.appendChild(el("div",{class:"sec",text:"On the map"}));
    wrap.appendChild(elMap(karte,(karte.interfaces||[])[0]||"",{el:"map"}));
  }

  /* Beute (REQ-085): was dabei zu holen ist, steht bei der Begegnung. */
  /* Beutetabellen an der Begegnung (REQ-085, 186): was gewürfelt wird,
     steht in der Tabelle, nicht hier — sonst gäbe es zwei Wahrheiten. */
  var btab=(e.relations||[]).filter(function(r){return r.type===REL_TABLEFOR;})
    .map(function(r){ return ENT.get(r.to); }).filter(Boolean);
  if(btab.length){
    wrap.appendChild(el("div",{class:"sec",text:"Tables"}));
    var tbar=el("div",{class:"rowbtns"});
    btab.forEach(function(t){
      tbar.appendChild(el("button",{class:"btn sm",type:"button",
        onclick:function(){
          var r=rollTable(t,e);
          shareRoll(nameOf(t),{total:0,rolls:[],expr:"",pretty:r.text});
          render();
        }},"Roll " + nameOf(t)));
    });
    wrap.appendChild(tbar);
  }

  var beute=(e.relations||[]).filter(function(r){return r.type===REL_LOOT;});
  if(beute.length){
    wrap.appendChild(el("div",{class:"sec",text:"Loot"}));
    var lb=el("div",{class:"chips"});
    beute.forEach(function(r){
      var it=ENT.get(r.to); if(!it)return;
      var pr=r.props||{};
      lb.appendChild(el("button",{class:"chip",type:"button",
        onclick:function(){go({k:"art",id:it.id});}},
        nameOf(it)+(pr.qty>1?" ×"+pr.qty:"")+(pr.chance?" ("+pr.chance+"%)":"")));
    });
    wrap.appendChild(lb);
  }

  /* Der Würfelverlauf. Er steht hier und nicht in einer Ecke, weil er zum
     Kampf gehört: „was ist da gefallen?" fragt jemand zwei Minuten später. */
  var wbar=el("div",{class:"rowbtns"});
  ["1d20","1d20+5","2d6","1d8+3","1d4"].forEach(function(a){
    wbar.appendChild(rollButton(a,a));
  });
  var frei=el("input",{class:"i",type:"text",placeholder:"3d6+2",style:"width:auto;max-width:110px"});
  frei.addEventListener("keydown",function(ev){
    if(ev.key!=="Enter")return;
    ev.preventDefault();
    var r6=rollDice(frei.value);
    if(!r6){ UI.err="Cannot read “"+frei.value+"”."; render(); return; }
    logRoll(frei.value,r6); render();
  });
  wbar.appendChild(frei);
  wrap.appendChild(el("div",{class:"sec",text:"Dice"}));
  wrap.appendChild(wbar);
  if(UI.rollLog.length){
    var log=el("div",{class:"rolllog"});
    UI.rollLog.forEach(function(x){
      var row=el("div",{class:"rollrow"});
      row.appendChild(el("span",{class:"rl",text:x.t}));
      row.appendChild(el("span",{class:"rv",text:rollText(x.r)}));
      log.appendChild(row);
    });
    wrap.appendChild(log);
  }
  return wrap;
}

/* Kämpfer dazunehmen. Eine Anzahl legt mehrere Kanten an, nicht eine mit
   Zahl — jeder Goblin hat eigene Trefferpunkte. */
function addParticipants(e){
  dialog("Add fighters",function(host,close){
    var suche=el("input",{class:"i",type:"text",placeholder:"Search…"});
    var sel=el("select",{class:"i",size:"8",style:"height:auto"});
    function fuelle(){
      var q=suche.value.toLowerCase().trim();
      sel.textContent="";
      byName().forEach(function(c){
        var ifn2=(c.interfaces||[])[0];
        if(!ifaceInList(["Creature","Statblock","Party"],ifn2))return;
        if(q&&nameOf(c).toLowerCase().indexOf(q)<0)return;
        sel.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
      });
      if(!sel.childNodes.length) sel.appendChild(el("option",{value:""},"— nothing matches —"));
    }
    suche.addEventListener("input",fuelle); fuelle();
    var anzahl=el("input",{class:"i",type:"number",value:"1",min:"1",max:"20"});
    var seite=el("select",{class:"i"});
    seite.appendChild(el("option",{value:"foe"},"Against the party"));
    seite.appendChild(el("option",{value:"ally"},"On the party’s side"));
    host.appendChild(field("Who",suche));
    host.appendChild(sel);
    host.appendChild(field("How many",anzahl));
    host.appendChild(field("Side",seite));
    actions(host,close,function(){
      if(!sel.value)return false;
      var art=ENT.get(sel.value); if(!art)return false;
      var n=Math.min(20,Math.max(1,Number(anzahl.value)||1));
      var sb=statsOf(art).card;
      var hp=Number(sb.hp);
      e.relations=e.relations||[];
      for(var i=0;i<n;i++){
        e.relations.push({id:uid("r"),type:REL_PART,to:art.id,props:{
          label:n>1?nameOf(art)+" "+(i+1):nameOf(art),
          hp:isFinite(hp)?hp:undefined, hpMax:isFinite(hp)?hp:undefined,
          ally:seite.value==="ally", conditions:[]}});
      }
      persist(e);
    },"Add");
  });
}

/* ---------- Boards (REQ-111, 157 bis 166) ----------
   Eine Leinwand, auf der Artikel frei liegen. Was darauf liegt, sind Kanten
   mit Ort und Grösse — damit beantwortet „wo liegt dieser NSC überall?"
   derselbe Rückbezug wie überall sonst.

   **Jede Platzierung wird in einer Ansicht gezeichnet, und dieselbe
   Ansicht, die auch die Artikelseite zeichnet.** Genau dafür wurde die
   Ansicht in A4 eine geordnete Liste von Elementen: `layoutOf` und
   `renderLayoutItem` gelten hier unverändert, und ein neues Element steht
   ohne Zutun auch auf dem Board.

   Die Auflösung, welche Ansicht (REQ-161): erst die Platzierung, dann die
   Regel des Boards je Schnittstelle, dann die erste Ansicht. So steht ein
   Board voller Kurzfassungen da, und *dieser eine* Statblock darin voll.

   Rechtecke und Ankerpunkte liegen als Felder am Board, nicht als Kanten.
   Das ist kein Rückfall: ein Rechteck zeigt auf nichts. Ein Token zeigt auf
   einen Artikel, deshalb ist es eine Kante; eine Linie, die zwei Kästen
   umfasst, ist Zeichnung und gehört dem Board. */
var BOARD_IFACE="Board", BOARD_COMP="BoardInfo", REL_PLACED="placed";
var SHAPE_KINDS=[["rect","Rectangle"],["ellipse","Ellipse"],["line","Line"],["label","Label"]];

function boardCard(e){ return (e.components||{})[BOARD_COMP]||{}; }
/* Welche Ansicht zeichnet diese Platzierung (REQ-161)? */
function placementView(board,rel,target){
  var pr=rel.props||{};
  if(pr.view&&REG.views[pr.view])return pr.view;
  var regeln=boardCard(board).rules||{};
  var at=(target.interfaces||[])[0], guard=0;
  while(at&&guard++<64){ if(regeln[at]&&REG.views[regeln[at]])return regeln[at]; at=parentOf(at); }
  return viewKeys()[0];
}
/* Eine Platzierung zeichnen: dieselben Elemente wie die Artikelseite.
   `tiefe` bricht ab, wenn ein Board auf einem Board auf einem Board liegt —
   das ist erlaubt, aber nicht unendlich. */
/* Innerhalb einer Platzierung gehören die Werkzeugleisten nicht hin: ein
   Zoomknopf auf einer Karte, die als Kachel auf einem Board liegt, änderte
   den Zoom der grossen Karte nebenan. Gelesen wird hier, bearbeitet wird
   auf der Artikelseite — der Titel der Kachel führt hin. */
var inPlacement=0;
function renderPlacement(target,viewKey,tiefe){
  var host=el("div",{class:"pbody"});
  var vw=(REG.views||{})[viewKey];
  if(!vw){ host.appendChild(el("p",{class:"hint",text:"Unknown view."})); return host; }
  var ifn=(target.interfaces||[])[0]||"";
  if((tiefe||0)>2){ host.appendChild(el("p",{class:"hint",text:"…"})); return host; }
  inPlacement++;
  try{
    layoutOf(vw,ifn).forEach(function(it){
      /* Ein Board in einem Board zeichnet nicht wieder eine ganze Leinwand. */
      if(it.el==="board"&&(tiefe||0)>=1)return;
      var node;
      try{ node=renderLayoutItem(it,target,ifn,vw); }
      catch(x){ node=el("p",{class:"err",text:String(x&&x.message||x)}); }
      if(node) host.appendChild(node);
    });
  } finally { inPlacement--; }
  if(!host.childNodes.length) host.appendChild(el("p",{class:"hint",
    text:"Nothing to show in this view."}));
  return host;
}

function elBoard(e,ifn,item){
  var card=boardCard(e);
  var breite=Number(card.width)||2400, hoehe=Number(card.height)||1500;
  var snap=Math.max(1,Number(card.snap)||10);
  var z=UI.boardZoom;
  var wrap=el("div",{class:"boardbox"});

  var bar=el("div",{class:"maptools"});
  [["−",-0.1],["+",0.1]].forEach(function(t){
    bar.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ UI.boardZoom=Math.min(2,Math.max(0.2,UI.boardZoom+t[1])); render(); }},t[0]));
  });
  bar.appendChild(el("span",{class:"hint",style:"margin:0",text:Math.round(z*100)+"%"}));
  if(canWrite()){
    bar.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ placeOnBoard(e); }},"+ Place"));
    bar.appendChild(el("button",{class:"btn sm",type:"button",
      onclick:function(){ newOnBoard(e); }},"+ New article"));
    var werkzeug=el("select",{class:"i",style:"width:auto"});
    werkzeug.appendChild(el("option",{value:""},"draw…"));
    SHAPE_KINDS.forEach(function(k){ werkzeug.appendChild(el("option",{value:k[0]},k[1])); });
    werkzeug.value=UI.boardTool;
    werkzeug.addEventListener("change",function(){ UI.boardTool=werkzeug.value; render(); });
    bar.appendChild(werkzeug);
  }
  /* Ankerpunkte (REQ-159, 160): benannte Stellen auf der Leinwand. */
  var anker=Array.isArray(card.anchors)?card.anchors:[];
  if(anker.length){
    var sel=el("select",{class:"i",style:"width:auto"});
    sel.appendChild(el("option",{value:""},"jump to…"));
    anker.forEach(function(a){ sel.appendChild(el("option",{value:a.id},a.name||a.id)); });
    sel.addEventListener("change",function(){
      var a=anker.filter(function(x){return x.id===sel.value;})[0];
      if(!a)return;
      var st=wrap.querySelector(".boardstage");
      if(a.zoom){ UI.boardZoom=a.zoom; render();
        setTimeout(function(){ var s2=document.querySelector(".boardstage");
          if(s2){ s2.scrollLeft=(a.x||0)*UI.boardZoom-60; s2.scrollTop=(a.y||0)*UI.boardZoom-60; } },0);
        return; }
      if(st){ st.scrollLeft=(a.x||0)*z-60; st.scrollTop=(a.y||0)*z-60; }
    });
    bar.appendChild(sel);
  }
  if(canWrite()) bar.appendChild(el("button",{class:"btn sm gh",type:"button",
    onclick:function(){ addAnchor(e,wrap); }},"+ Anchor"));
  wrap.appendChild(bar);

  var stage=el("div",{class:"boardstage"});
  var canvas=el("div",{class:"boardcanvas"});
  canvas.style.width=(breite*z)+"px";
  canvas.style.height=(hoehe*z)+"px";
  var bg=assetSrc(card.background);
  if(bg) canvas.style.backgroundImage="url("+JSON.stringify(bg).slice(1,-1)+")";
  canvas.style.backgroundSize="100% 100%";

  /* Zeichnung zuerst: sie liegt unter den Karten. */
  (Array.isArray(card.shapes)?card.shapes:[]).forEach(function(sh){
    var n=el("div",{class:"bshape sh-"+(sh.kind||"rect")});
    n.style.left=((sh.x||0)*z)+"px"; n.style.top=((sh.y||0)*z)+"px";
    n.style.width=((sh.w||120)*z)+"px"; n.style.height=((sh.h||80)*z)+"px";
    if(sh.color) n.style.borderColor=sh.color;
    if(sh.kind==="label"){ n.textContent=sh.text||""; n.style.color=sh.color||""; }
    if(canWrite()) n.addEventListener("contextmenu",function(ev){
      ev.preventDefault();
      confirmDialog("Remove this shape?",function(){
        card.shapes=(card.shapes||[]).filter(function(x){return x.id!==sh.id;});
        e.components[BOARD_COMP]=card; persist(e); });
    });
    canvas.appendChild(n);
  });

  var platz=(e.relations||[]).filter(function(r){ return r.type===REL_PLACED; });
  platz.sort(function(a,b){ return ((a.props||{}).z||0)-((b.props||{}).z||0); });
  platz.forEach(function(r){
    var t=ENT.get(r.to);
    var pr=r.props||{};
    var karte=el("div",{class:"bcard"+(UI.boardPick===r.id?" selected":"")});
    karte.style.left=((pr.x||0)*z)+"px";
    karte.style.top=((pr.y||0)*z)+"px";
    karte.style.width=((pr.w||260)*z)+"px";
    karte.style.height=((pr.h||180)*z)+"px";
    if(!t){
      karte.appendChild(el("div",{class:"gone",text:"missing article"}));
      canvas.appendChild(karte); return;
    }
    var vk=placementView(e,r,t);
    var kopf=el("div",{class:"bhead"});
    kopf.appendChild(el("button",{class:"ref",type:"button",
      onclick:function(ev){ ev.stopPropagation(); go({k:"art",id:t.id}); }},nameOf(t)));
    kopf.appendChild(el("span",{class:"bview",text:(REG.views[vk]||{}).label||vk}));
    if(canWrite()){
      /* Die Ansicht je Platzierung wechseln: das ist die
         Darstellungsauflösung von Hand, und sie muss dort sein, wo die
         Karte steht — nicht in einem Register. */
      var vs=el("select",{class:"bsel"});
      vs.appendChild(el("option",{value:""},"(board rule)"));
      viewKeys().forEach(function(k){ vs.appendChild(el("option",{value:k},(REG.views[k]||{}).label||k)); });
      vs.value=pr.view||"";
      vs.addEventListener("click",function(ev){ ev.stopPropagation(); });
      vs.addEventListener("change",function(){
        r.props=Object.assign({},r.props,{view:vs.value||undefined}); persist(e); });
      kopf.appendChild(vs);
      kopf.appendChild(el("button",{class:"btn gh sm",type:"button",title:"Take off the board",
        onclick:function(ev){ ev.stopPropagation();
          e.relations=e.relations.filter(function(x){return x.id!==r.id;}); persist(e); }},"×"));
    }
    karte.appendChild(kopf);
    var body=el("div",{class:"bscroll"});
    body.style.transform="scale("+z+")";
    body.style.width=(100/z)+"%";
    body.style.height="calc("+(100/z)+"% - "+(26/z)+"px)";
    body.appendChild(renderPlacement(t,vk,0));
    karte.appendChild(body);

    if(canWrite()&&!pr.locked){
      var griff=el("div",{class:"bgrip",title:"Resize"});
      karte.appendChild(griff);
      var zieh=null;
      kopf.addEventListener("pointerdown",function(ev){
        if(ev.target!==kopf)return;
        zieh={x:ev.clientX,y:ev.clientY,ox:pr.x||0,oy:pr.y||0,mode:"move"};
        UI.boardPick=r.id;
        try{ kopf.setPointerCapture(ev.pointerId); }catch(x){}
      });
      griff.addEventListener("pointerdown",function(ev){
        ev.stopPropagation();
        zieh={x:ev.clientX,y:ev.clientY,ow:pr.w||260,oh:pr.h||180,mode:"size"};
        try{ griff.setPointerCapture(ev.pointerId); }catch(x){}
      });
      var bewegen=function(ev){
        if(!zieh)return;
        var dx=(ev.clientX-zieh.x)/z, dy=(ev.clientY-zieh.y)/z;
        if(zieh.mode==="move"){
          zieh.nx=Math.max(0,Math.round((zieh.ox+dx)/snap)*snap);
          zieh.ny=Math.max(0,Math.round((zieh.oy+dy)/snap)*snap);
          karte.style.left=(zieh.nx*z)+"px"; karte.style.top=(zieh.ny*z)+"px";
        } else {
          zieh.nw=Math.max(80,Math.round((zieh.ow+dx)/snap)*snap);
          zieh.nh=Math.max(60,Math.round((zieh.oh+dy)/snap)*snap);
          karte.style.width=(zieh.nw*z)+"px"; karte.style.height=(zieh.nh*z)+"px";
        }
      };
      var los=function(){
        if(!zieh)return;
        var w=zieh; zieh=null;
        if(w.mode==="move"&&w.nx!=null) r.props=Object.assign({},r.props,{x:w.nx,y:w.ny});
        if(w.mode==="size"&&w.nw!=null) r.props=Object.assign({},r.props,{w:w.nw,h:w.nh});
        persist(e);
      };
      kopf.addEventListener("pointermove",bewegen);
      kopf.addEventListener("pointerup",los);
      griff.addEventListener("pointermove",bewegen);
      griff.addEventListener("pointerup",los);
    }
    canvas.appendChild(karte);
  });

  /* Mit einem Zeichenwerkzeug in der Hand legt ein Klick eine Form an. */
  if(canWrite()&&UI.boardTool){
    canvas.style.cursor="crosshair";
    canvas.addEventListener("click",function(ev){
      if(ev.target!==canvas)return;
      var rect=canvas.getBoundingClientRect();
      var x=Math.round(((ev.clientX-rect.left)/z)/snap)*snap;
      var y=Math.round(((ev.clientY-rect.top)/z)/snap)*snap;
      var sh={id:uid("sh"),kind:UI.boardTool,x:x,y:y,w:160,h:100};
      if(UI.boardTool==="label"){ sh.text="Label"; sh.h=24; }
      card.shapes=(card.shapes||[]).concat([sh]);
      e.components=e.components||{}; e.components[BOARD_COMP]=card;
      UI.boardTool=""; persist(e);
    });
  }

  stage.appendChild(canvas);
  wrap.appendChild(stage);
  wrap.appendChild(el("p",{class:"hint",
    text:platz.length+" placed · "+((card.shapes||[]).length)+" shapes · "+
      anker.length+" anchors"+(canWrite()?" · drag the title bar to move, the corner to resize, right-click a shape to remove":"")}));
  return wrap;
}
