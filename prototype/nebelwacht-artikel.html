function dialog(title,build){
  var box=el("div",{class:"dlgbox"});
  box.appendChild(el("h3",{text:title}));
  var host=el("div"); box.appendChild(host);
  var back=el("div",{class:"dlg",onclick:function(ev){ if(ev.target===back) close(); }});
  back.appendChild(box); document.body.appendChild(back);
  function close(){ back.remove(); }
  build(host,close,box);
  var first=box.querySelector("input,select,textarea"); if(first)first.focus();
  document.addEventListener("keydown",function k(ev){ if(ev.key==="Escape"){close();document.removeEventListener("keydown",k);} });
  return close;
}
function field(label,node){ var l=el("label",{class:"f"}); l.appendChild(el("span",{text:label})); l.appendChild(node); return l; }
/* Kein window.confirm: die Seite läuft in einem sandboxed iframe, und ohne
   `allow-modals` verwirft der Browser den Aufruf und liefert false zurück.
   Jede Abfrage sagte damit stillschweigend Nein — die Löschknöpfe taten
   schlicht nichts. Die Seite fragt jetzt selbst. */
function confirmDialog(question, onOk, okLabel){
  dialog(okLabel||"Delete",function(host,close){
    host.appendChild(el("p",{text:question}));
    var bar=el("div",{class:"rowbtns"});
    bar.appendChild(el("button",{class:"btn pri dngr",type:"button",onclick:function(){
      close(); onOk(); }},okLabel||"Delete"));
    bar.appendChild(el("button",{class:"btn",type:"button",onclick:close},"Cancel"));
    host.appendChild(bar);
  });
}

/* Eine Zeile abfragen. `window.prompt` gibt es in der Artefakt-Umgebung
   nicht zuverlässig, und ein Dialog, der manchmal erscheint, ist keiner. */
function prompt1(title,value,onOk,okLabel){
  dialog(title,function(host,close){
    var inp=el("input",{class:"i",type:"text",value:value==null?"":String(value)});
    host.appendChild(field(title,inp));
    setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(x){} },0);
    actions(host,close,function(){ onOk(inp.value.trim()); },okLabel||"Save");
  });
}
function actions(host,close,onOk,okLabel){
  var bar=el("div",{class:"rowbtns"});
  bar.appendChild(el("button",{class:"btn pri",type:"button",onclick:function(){ if(onOk()!==false) close(); }},okLabel||"Save"));
  bar.appendChild(el("button",{class:"btn",type:"button",onclick:close},"Cancel"));
  host.appendChild(bar);
}

/* new entity — `presetName` prefills from a dead [[link]] */
function newEntity(presetName){
  dialog(presetName?"„"+presetName+"”":"New article",function(host,close){
    var sel=el("select",{class:"i"});
    Object.keys(REG.interfaces).sort().forEach(function(n){
      if(REG.interfaces[n].abstract)return;
      sel.appendChild(el("option",{value:n},REG.interfaces[n].label||n)); });
    if(UI.iface)sel.value=UI.iface;
    var nm=el("input",{class:"i",type:"text",placeholder:"Name",value:presetName||""});
    host.appendChild(field("Interface",sel));
    host.appendChild(field("Name",nm));
    if(presetName) host.appendChild(el("p",{class:"hint",
      text:"The link that led here finds the article as soon as it carries the name."}));
    actions(host,close,function(){
      var name=nm.value.trim(); if(!name){nm.focus();return false;}
      var ifn=sel.value;
      var e={ id:uid("e"), interfaces:[ifn], name:name,
        components:{ Identity:{name:name,id:nextId(ifn),aliases:[]} },
        adhoc:[], relations:[], createdAt:new Date().toISOString() };
      reqFor(ifn).forEach(function(c){ if(!e.components[c]&&REG.interfaces[c]) e.components[c]={}; });
      applyDefaults(e,ifn);
      persist(e); go({k:"art",id:e.id});
      /* Aus einem Verweis heraus angelegt heisst: man war woanders und will
         dahin zurück. Das Formular nimmt die Angaben in einem Zug auf,
         statt dass man sich durch die frische, leere Ansicht klickt. */
      if(presetName) editEntity(e);
    },"Create");
  });
}

/* edit entity: name, tags, and every component field from the schema */
function editEntity(e){
  dialog("Edit",function(host,close){
    var ifn=(e.interfaces||[])[0]||"";
    var nm=el("input",{class:"i",type:"text",value:nameOf(e)});
    host.appendChild(field("Name",nm));
    var tg=el("input",{class:"i",type:"text",value:tagsOf(e).join(", "),placeholder:"comma, separated"});
    host.appendChild(field("Tags",tg));

    var inputs=[], drvCells=[];
    function readInput(it){ return fieldValue(it.pd,it.node); }
    function recalc(){
      var live={};
      inputs.forEach(function(it){
        if(it.adhoc!==undefined)return;
        live[it.cn]=live[it.cn]||{};
        var v=readInput(it); if(v!==undefined) live[it.cn][it.p]=v;
      });
      drvCells.forEach(function(c){
        c.node.textContent=fmtVal(c.pd,derivedValue(c.pd,live[c.cn]||{}))||"—";
      });
    }
    compsFor(ifn).forEach(function(cn){
      var cd=REG.interfaces[cn]; if(!cd)return;
      var props=(cd.schema&&cd.schema.properties)||{};
      var keys=Object.keys(props).filter(function(p){return !(cn==="Name"&&p==="text");});
      if(!keys.length)return;
      host.appendChild(el("div",{class:"dgrp",text:cd.label||cn}));
      keys.forEach(function(p){
        var pd=props[p], cur=((e.components||{})[cn]||{})[p];
        if(pd.derived){
          var b=el("b",{class:"drvval",text:"—"});
          host.appendChild(el("div",{class:"drvrow"},[
            el("span",{text:fieldTitle(ifn,cn,p,pd)+" "}), b,
            el("span",{class:"drvexp",text:pd.derived})]));
          drvCells.push({cn:cn,p:p,pd:pd,node:b});
          return;
        }
        if(pd.readOnly){
          /* Sichtbar, aber ohne Eingabe: man will die Nummer lesen
             können, und sie zu ändern wäre keine Korrektur, sondern ein
             anderer Artikel. */
          host.appendChild(el("div",{class:"drvrow"},[
            el("span",{text:fieldTitle(ifn,cn,p,pd)+" "}),
            el("b",{class:"drvval",text:String(cur==null?"—":cur)}),
            el("span",{class:"drvexp",text:"issued once"})]));
          return;
        }
        var node=fieldInput(pd,cur);
        host.appendChild(field(fieldTitle(ifn,cn,p,pd),node));
        node.addEventListener("input",recalc);
        inputs.push({cn:cn,p:p,pd:pd,node:node});
      });
    });

    (e.adhoc||[]).forEach(function(f,i){
      var node=el("input",{class:"i",type:"text",value:f.value==null?"":String(f.value)});
      host.appendChild(field("Eigenes · "+f.label,node));
      inputs.push({adhoc:i,node:node});
    });
    recalc();

    actions(host,close,function(){
      e.name=nm.value.trim()||e.name;
      setTags(e,tg.value.split(","));
      e.components=e.components||{};
      e.components.Identity=Object.assign({},e.components.Identity||{},{name:e.name});
      inputs.forEach(function(it){
        if(it.adhoc!==undefined){ e.adhoc[it.adhoc].value=it.node.value; return; }
        var val=readInput(it);
        e.components[it.cn]=e.components[it.cn]||{};
        if(val===undefined) delete e.components[it.cn][it.p]; else e.components[it.cn][it.p]=val;
      });
      persist(e);
    });
  });
}

function addRelation(e){
  dialog("Add relation",function(host,close){
    var ifn=(e.interfaces||[])[0]||"";
    var defs=relsFrom(ifn);
    if(!defs.length){ host.appendChild(el("p",{class:"hint",text:"No relation type is defined for this interface. Add one in the registry."}));
      actions(host,close,function(){},"Close"); return; }
    var rsel=el("select",{class:"i"});
    defs.forEach(function(d){ rsel.appendChild(el("option",{value:d.type},(d.label||d.type))); });
    var tsel=el("select",{class:"i"});
    var note=el("input",{class:"i",type:"text",placeholder:"optional"});
    var vars=el("textarea",{class:"i code",placeholder:'{"NAME":"Pseudopod","DMG":"2d6 + 3"}'});
    vars.style.minHeight="72px";
    var vlab=field("Variable bindings (JSON)",vars);

    function fillTargets(){
      tsel.textContent="";
      var d=relDef(rsel.value), to=d.to||["*"];
      byName().forEach(function(c){
        if(c.id===e.id)return;
        if(!ifaceInList(to,(c.interfaces||[])[0]))return;
        tsel.appendChild(el("option",{value:c.id},nameOf(c)+" — "+ifaceName(c)));
      });
      if(!tsel.childNodes.length) tsel.appendChild(el("option",{value:""},"— no matching article —"));
      vlab.style.display=relDef(rsel.value).section?"":"none";
    }
    rsel.addEventListener("change",fillTargets);
    host.appendChild(field("Bezugsart",rsel));
    host.appendChild(field("Target",tsel));
    host.appendChild(vlab);
    host.appendChild(field("Notiz",note));
    fillTargets();

    actions(host,close,function(){
      if(!tsel.value)return false;
      var props={}; if(note.value.trim())props.note=note.value.trim();
      if(vars.value.trim()){ try{props.vars=JSON.parse(vars.value);}catch(x){ alert("Variables: not valid JSON"); return false; } }
      e.relations=e.relations||[];
      e.relations.push({id:uid("r"),type:rsel.value,to:tsel.value,props:props});
      persist(e);
    },"Link");
  });
}

/* ad-hoc field + promotion into the interface (REQ-181) */
function addAdhoc(e){
  dialog("Custom field",function(host,close){
    var lb=el("input",{class:"i",type:"text",placeholder:"e.g. Favourite oath"});
    var vl=el("input",{class:"i",type:"text"});
    var pr=el("input",{type:"checkbox",id:"promote"});
    host.appendChild(field("Label",lb));
    host.appendChild(field("Value",vl));
    var pw=el("label",{class:"f"});
    pw.appendChild(el("span",{text:"Promote into the registry"}));
    var line=el("div",{style:"display:flex;gap:8px;align-items:center"});
    line.appendChild(pr);
    line.appendChild(el("span",{class:"hint",style:"margin:0",text:"The field becomes part of the interface — for every article of this kind."}));
    pw.appendChild(line); host.appendChild(pw);
    actions(host,close,function(){
      var label=lb.value.trim(); if(!label)return false;
      var key=slug(label).replace(/-/g,"_");
      if(pr.checked){
        /* Befördern heisst jetzt: das Feld an die Art schreiben, der der
           Artikel angehört. Vorher legte es eine Sammelkarte „Custom
           fields" an — ein Behälter neben dem Modell, in dem alles landete,
           was jemand einmal gebraucht hat. */
        var cn=(e.interfaces||[])[0];
        var d=REG.interfaces[cn];
        d.schema=d.schema||{type:"object",properties:{}};
        d.schema.properties[key]={type:"string",title:label};
        saveReg("interfaces");
        e.components[cn]=e.components[cn]||{}; e.components[cn][key]=vl.value;
      } else {
        e.adhoc=e.adhoc||[];
        e.adhoc.push({key:key,label:label,type:"text",value:vl.value});
      }
      persist(e);
    },"Create");
  });
}


/* ============================================================
   Obsidian-Import. Dieselben Regeln wie @nw/import im Repo,
   dort gegen echte Vault-Dateien getestet:
   - Schlüssel case-insensitiv (der Vault schreibt Rarität, aber
     rüstungsklasse — Dataview kleinschreibt Eigenschaften)
   - U+2212 MINUS in Attributtabellen, kein Bindestrich
   - Eintragstexte laufen über mehrere >-Zeilen weiter
   - cr kann ein Bruch sein (1/8), also Text, keine Zahl
   - „—"", not "—"
   ============================================================ */

function parseFM(text){
  var src=String(text||"").replace(/^﻿/,"");
  var m=/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(src);
  if(!m) return {raw:{},index:{},body:src};
  var raw={},cur=null;
  (m[1]||"").split(/\r?\n/).forEach(function(line){
    var li=/^\s*-\s+(.*)$/.exec(line);
    if(li&&cur){ if(!Array.isArray(raw[cur]))raw[cur]=[]; raw[cur].push(unquote(li[1])); return; }
    var kv=/^([^\s:][^:]*):\s*(.*)$/.exec(line);
    if(!kv)return;
    cur=kv[1].trim();
    var v=unquote(kv[2]);
    raw[cur]= v===""?[]:v;
  });
  Object.keys(raw).forEach(function(k){ if(Array.isArray(raw[k])&&!raw[k].length) raw[k]=""; });
  var index={}; Object.keys(raw).forEach(function(k){ index[k.toLowerCase()]=k; });
  return {raw:raw,index:index,body:src.slice(m[0].length)};
}
function unquote(v){ var t=String(v||"").trim();
  return (t.length>=2&&/^(".*"|'.*')$/.test(t))?t.slice(1,-1):t; }
function fmStr(fm,k){ var o=fm.index[String(k).toLowerCase()]; if(!o)return "";
  var v=fm.raw[o]; return Array.isArray(v)?v.join(", "):String(v==null?"":v).trim(); }
function fmList(fm,k){ var o=fm.index[String(k).toLowerCase()]; if(!o)return [];
  var v=fm.raw[o]; if(Array.isArray(v))return v.filter(function(x){return x!=="";});
  var s=String(v==null?"":v).trim(); return s?[s]:[]; }
function fmNum(fm,k){ var t=fmStr(fm,k); if(t==="")return undefined;
  var n=Number(t.replace(/[^\d.,-]/g,"").replace(",",".")); return isFinite(n)?n:undefined; }
function linkZiel(raw){ var m=/\[\[([^\]]+)\]\]/.exec(String(raw||""));
  var t=m?m[1]:String(raw||""); return (t.split("|")[0]||"").split("#")[0].trim(); }
function stripDataview(b){ return String(b||"")
  .replace(/#+\s*Inventar\s*\r?\n+```dataviewjs[\s\S]*?```/gi,"")
  .replace(/```dataviewjs[\s\S]*?```/gi,"").trim(); }
function sinnvoll(v){ var t=String(v||"").trim(); return t!==""&&!/^[—–-]+$/.test(t); }

/* welche Art Datei ist das? */
/* Die Vault-Werte links bleiben deutsch — sie stehen so in den Notizen.
   Zurück kommt die Sorte, unter der der Import sie führt. */
function erkenne(text){
  var fm=parseFM(text);
  if(fmStr(fm,"typ").toLowerCase()==="statblock") return "statblock";
  if(fmStr(fm,"Gegenstandstyp")) return "item";
  var t=fmStr(fm,"typ").toLowerCase();
  if(["siedlung","region","kontinent","ort","gebäude","raum"].indexOf(t)>=0) return "place";
  return null;
}

var IF_TYP={waffe:"Weapon","ausrüstung":"Armor",ausruestung:"Armor","rüstung":"Armor",
  material:"Material",verbrauchsgut:"Consumable"};

function impGegenstand(text,datei){
  var fm=parseFM(text), name=datei.replace(/\.md$/i,"").trim();
  var typ=fmStr(fm,"Gegenstandstyp").toLowerCase(), ifn=IF_TYP[typ]||"Item";
  var body=stripDataview(fm.body), bilder=[];
  (body.match(/!\[\[[^\]|#]+\.(?:png|jpe?g|webp|gif)(?:\|[^\]]*)?\]\]/gi)||[]).forEach(function(x){
    bilder.push(linkZiel(x)); });

  /* Eine Karte je Bestandteil: was `Identity` erklärt, steht auf `Identity`. */
  var c={ Identity:{name:name,aliases:fmList(fm,"aliases")},
    Status:{status:"used"},
    Imported:{text:text,format:"obsidian",at:new Date().toISOString().slice(0,10)} };

  var info={}, r=fmStr(fm,"Rarität"), kr=fmStr(fm,"Kaufrarität"),
      kp=fmNum(fm,"Kupferpreis"), st=fmNum(fm,"Stapelgrösse");
  if(fmStr(fm,"Gegenstandstyp")) info.itemType=fmStr(fm,"Gegenstandstyp");
  if(r&&r!=="-") info.rarity=r;            // „-" heisst: kein magischer Gegenstand
  if(kr&&kr!=="-") info.availability=kr;     // andere Skala als raritaet
  if(kp!==undefined) info.copperPrice=kp;
  if(st!==undefined) info.stackSize=st;
  if(Object.keys(info).length) c.Item=Object.assign({},c.Item||{},info);

  var rows=fmList(fm,"Formfaktor"); if(rows.length) c.Item=Object.assign({},c.Item||{},{rows:rows});
  if(ifn==="Weapon"){ var w={};
    if(fmStr(fm,"Schaden"))w.damage=fmStr(fm,"Schaden");
    if(fmStr(fm,"Schadenstyp"))w.damageType=fmStr(fm,"Schadenstyp");
    if(fmStr(fm,"Reichweite"))w.range=fmStr(fm,"Reichweite");
    if(Object.keys(w).length)c.Weapon=w; }
  if(ifn==="Armor"){ var ru={}, rk=fmNum(fm,"rüstungsklasse");
    if(rk!==undefined)ru.ac=rk;
    if(fmStr(fm,"rüstungstyp"))ru.armorType=fmStr(fm,"rüstungstyp");
    if(Object.keys(ru).length)c.Armor=ru; }
  if(ifn==="Material"){ var ma={};
    if(fmStr(fm,"Materialtyp"))ma.materialType=fmStr(fm,"Materialtyp");
    var be=fmList(fm,"Berufe"); if(be.length)ma.trades=be;
    if(Object.keys(ma).length)c.Material=ma; }
  if(bilder[0]) c.Image={url:bilder[0],caption:""};

  var prosa=body.replace(/!\[\[[^\]]+\]\]/g,"").replace(/^#+\s*Eigenschaften[\s\S]*$/im,"").trim();
  if(prosa) c.Prose={paragraph:[{id:entryAnchor("paragraph",prosa,{}),value:prosa}]};

  var unresolved=[];
  fmList(fm,"Eigenschaften").forEach(function(x){
    var z=linkZiel(x); if(z) unresolved.push({type:"hasProperty",target:z}); });

  /* `tags` trägt immer `gegenstand` und, uneinheitlich, eine Artmarke. */
  var marken=fmList(fm,"tags").filter(function(t){return t!=="gegenstand";});
  if(marken.length) c.Tags={tags:marken};
  return { e:{ id:uid("g"), interfaces:[ifn], name:name,
      components:c, adhoc:[], relations:[], createdAt:new Date().toISOString() },
    unresolved:unresolved, bilder:bilder };
}

/* Links steht, wie der Vault die Zeile beschriftet — rechts, wie das Feld im
   Register heisst. Nur die rechte Seite ist englisch geworden; die linke zu
   übersetzen hiesse, die Notizen nicht mehr zu erkennen. */
var SB_LABEL={"rüstungsklasse":"_skip","trefferpunkte":"_skip","geschwindigkeit":"speed",
  "saving throws":"saves",skills:"skills","damage resistances":"resistances",
  immunities:"immunities",vulnerabilities:"vulnerabilities",senses:"senses",
  languages:"languages","proficiency bonus":"prof"};
var ATTR=["str","dex","con","int","wis","cha"];

function impStatblock(text,datei){
  var fm=parseFM(text), name=fmStr(fm,"name")||datei.replace(/\.md$/i,"").trim();
  var zeilen=String(fm.body).replace(/−/g,"-").split(/\r?\n/)
    .filter(function(l){return l.trimStart().indexOf(">")===0;})
    .map(function(l){return l.replace(/^\s*>\s?/,"");});

  var info={system:"dnd5e-2014"}, g=fmStr(fm,"grösse");
  if(g){ var p=/^([^(]+?)\s*(?:\(([^)]*)\))?$/.exec(g.trim());
    if(p&&p[1])info.size=p[1].trim(); if(p&&p[2])info.kind=p[2].trim(); }
  if(fmStr(fm,"ausrichtung"))info.alignment=fmStr(fm,"ausrichtung");
  if(fmStr(fm,"cr"))info.cr=fmStr(fm,"cr");            // kann 1/8 sein
  if(fmStr(fm,"rolle"))info.combatRole=fmStr(fm,"rolle");
  var ac=fmStr(fm,"ac");
  if(ac){ var an=/(-?\d+)/.exec(ac); if(an)info.ac=Number(an[1]);
    var aq=/\(([^)]*)\)/.exec(ac); if(aq)info.acNote=aq[1].trim(); }
  var tp=fmNum(fm,"leben"); if(tp!==undefined)info.hp=tp;
  if(fmStr(fm,"lebenswürfel"))info.hpFormula=fmStr(fm,"lebenswürfel");
  var sp=fmList(fm,"geschwindigkeit"); if(sp.length)info.speed=sp.join(", ");

  zeilen.forEach(function(l){
    var m=/^\*\*([^*]+?):?\*\*\s*(.*)$/.exec(l); if(!m)return;   // Doppelpunkt erlaubt
    var k=SB_LABEL[m[1].trim().toLowerCase()], v=m[2].trim();
    if(!k||k==="_skip"||!sinnvoll(v))return;
    if(k==="prof"){ var n=Number(v.replace("+","")); if(isFinite(n))info.prof=n; return; }
    if(k==="speed"&&info.speed)return;
    info[k]=v;
  });

  var hi=-1; zeilen.forEach(function(l,i){ if(hi<0&&/^\|\s*STR\s*\|/i.test(l))hi=i; });
  if(hi>=0){ for(var i=hi+1;i<zeilen.length;i++){ var l=zeilen[i];
      if(!/^\|/.test(l))continue; if(/^\|\s*-/.test(l))continue;
      var cells=l.split("|").slice(1,-1).map(function(c){return c.trim();});
      ATTR.forEach(function(a,j){ var s=/(-?\d+)/.exec(cells[j]||""); if(s)info[a]=Number(s[1]); });
      break; } }

  var abschnitte=[],akt=null,eintrag=null;
  function schliess(){ if(akt&&eintrag&&eintrag.name){ eintrag.text=eintrag.text.trim();
      akt.eintraege.push(eintrag); } eintrag=null; }
  zeilen.forEach(function(l){
    var h=/^#+\s*(.+?)\s*$/.exec(l);
    if(h){ schliess(); if(akt)abschnitte.push(akt); akt={name:h[1].trim(),eintraege:[]}; return; }
    if(!akt)return;
    var s=/^\*\*([^*]+?)\.?\*\*\s*(.*)$/.exec(l);
    if(s){ schliess(); eintrag={name:s[1].trim(),text:s[2].trim()}; return; }
    if(eintrag){ if(!l.trim()||/^-{3,}$/.test(l.trim()))return; eintrag.text+=" "+l.trim(); }
  });
  schliess(); if(akt)abschnitte.push(akt);

  return { e:{ id:uid("sb"), interfaces:["Statblock"], name:name,
      components:{ Identity:{name:name,aliases:fmList(fm,"aliases")},
        Status:{status:"used"},
        Imported:{text:text,format:"obsidian",at:new Date().toISOString().slice(0,10)},
        /* Die Zahlen bleiben ihre eigene Karte: `hp` heisst am Statblock
           etwas anderes als an der Kreatur, die gerade Schaden nimmt. */
        StatblockInfo:info },
      adhoc:[], relations:[], createdAt:new Date().toISOString() },
    abschnitte:abschnitte, kreatur:linkZiel(fmStr(fm,"kreatur"))||null };
}

function impOrt(text,datei){
  var fm=parseFM(text), name=datei.replace(/\.md$/i,"").trim();
  // Der leaflet-Block bleibt unangetastet: er wird später die Kartenansicht.
  // Hier nur aus der Prosa genommen, im RawContent liegt er unverändert.
  var body=String(fm.body)
    .replace(/```leaflet[\s\S]*?```/gi,"")
    .replace(new RegExp("^#\\s*"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*$","im"),"")
    .trim();

  var enthaelt=[];
  (body.match(/!\[\[[^\]]+\]\]/g)||[]).forEach(function(x){
    var z=linkZiel(x); if(z&&!/\.(png|jpe?g|webp|gif)$/i.test(z)) enthaelt.push(z); });
  var li={}; if(fmStr(fm,"typ"))li.kind=fmStr(fm,"typ");
  if(fmStr(fm,"biom"))li.umwelt=fmStr(fm,"biom");
  if(fmStr(fm,"siedlungstyp"))li.siedlungstyp=fmStr(fm,"siedlungstyp");

  var c={ Identity:{name:name,aliases:fmList(fm,"aliases")},
    Status:{status:"used"},
    Imported:{text:text,format:"obsidian",at:new Date().toISOString().slice(0,10)}, Place:li };

  var prosa=body.replace(/!\[\[[^\]]+\]\]/g,"").replace(/^#+\s.*$/gm,"").trim();
  if(prosa) c.Prose={paragraph:[{id:entryAnchor("paragraph",prosa,{}),value:prosa}]};

  if(fmList(fm,"tags").length) c.Tags={tags:fmList(fm,"tags")};
  return { e:{ id:uid("o"), interfaces:["Place"], name:name,
      components:c, adhoc:[], relations:[], createdAt:new Date().toISOString() },
    unresolved:enthaelt.map(function(z){return {type:"contains",target:z};}) };
}

/* ---------- Stapelimport: Verweise innerhalb des Stapels auflösen ---------- */
function runImport(files){
  var result={item:[],statblock:[],place:[],rules:[],unresolved:[],unknown:[],images:[]};
  var roh=[];
  files.forEach(function(f){
    var kind=erkenne(f.text);
    if(!kind){ result.unknown.push(f.name); return; }
    if(kind==="item"){ var g=impGegenstand(f.text,f.name); roh.push({kind:kind,r:g}); result.item.push(g.e); }
    if(kind==="place"){ var o=impOrt(f.text,f.name); roh.push({kind:kind,r:o}); result.place.push(o.e); }
    if(kind==="statblock"){ var s=impStatblock(f.text,f.name); roh.push({kind:kind,r:s}); result.statblock.push(s.e); }
  });

  /* Abschnittseinträge werden je eine eigene Regel, die der Statblock
     referenziert. Gleicher Name und Text heisst gleiche Regel, keine Kopie. */
  var regelNach={};
  roh.forEach(function(x){ if(x.kind!=="statblock")return;
    x.r.abschnitte.forEach(function(ab){ ab.eintraege.forEach(function(en){
      var k=en.name+"\u0000"+en.text, id=regelNach[k];
      if(!id){ id=uid("r"); regelNach[k]=id;
        var kind=/^bonus/i.test(ab.name)?"bonus":/^reaction/i.test(ab.name)?"reaction"
                :/^(villain|legendary)/i.test(ab.name)?"legendary":/^action/i.test(ab.name)?"action":"trait";
        result.rules.push({ id:id, interfaces:["Rule"], name:en.name,
          components:{ Identity:{name:en.name,aliases:[]},
            Status:{status:"used"}, Description:{description:en.text},
            Rule:{kind:kind} },
          adhoc:[], relations:[], createdAt:new Date().toISOString() }); }
      x.r.e.relations.push({id:uid("rel"),type:"composedOf",to:id,props:{section:ab.name}});
    });});
  });

  var alle=result.item.concat(result.place,result.statblock,result.rules);

  /* Die Nummern. Sie entstehen **hier** und nicht beim Lesen einer Notiz:
     eine einzelne Datei weiss nicht, welche schon vergeben sind, und ohne
     die Liste des laufenden Stapels bekämen zwanzig Artikel aus einem Lauf
     dieselbe. */
  var vergeben=[];
  alle.forEach(function(e){
    var id=nextId((e.interfaces||[])[0]||"Article",vergeben);
    vergeben.push(id);
    e.components=e.components||{};
    e.components.Identity=Object.assign({},e.components.Identity||{},{id:id});
  });
  var nachName={};
  ENT.forEach(function(e){ if((e.interfaces||[])[0]!=="Statblock") nachName[nameOf(e).toLowerCase()]=e.id;
    ((e.components&&e.components.Identity&&e.components.Identity.aliases)||[]).forEach(function(a){
      nachName[String(a).toLowerCase()]=e.id; }); });
  alle.forEach(function(e){ if((e.interfaces||[])[0]==="Statblock")return;
    nachName[e.name.toLowerCase()]=e.id;
    ((e.components.Identity&&e.components.Identity.aliases)||[]).forEach(function(a){
      nachName[String(a).toLowerCase()]=e.id; }); });

  roh.forEach(function(x){
    if(x.kind==="item"){ (x.r.unresolved||[]).forEach(function(v){
      var id=nachName[v.target.toLowerCase()];
      if(id) x.r.e.relations.push({id:uid("rel"),type:v.type,to:id});
      else result.unresolved.push({from:x.r.e.name,kind:v.type,target:v.target}); });
      (x.r.bilder||[]).forEach(function(b){ result.images.push({from:x.r.e.name,datei:b}); }); }

    /* Der Vault drückt die Hierarchie als Transklusion im Elternteil aus:
       ![[Rubinrot]] in Vallehy heisst „Vallehy enthält Rubinrot". Gespeichert
       wird die Kante aber am Kind als teilVon — eine Kante, eine Richtung. */
    if(x.kind==="place"){ (x.r.unresolved||[]).forEach(function(v){
      var id=nachName[v.target.toLowerCase()], kind=null;
      alle.forEach(function(e){ if(e.id===id) kind=e; });
      if(kind) kind.relations.push({id:uid("rel"),type:"partOf",to:x.r.e.id});
      else result.unresolved.push({from:x.r.e.name,kind:"contains",target:v.target}); }); }

    if(x.kind==="statblock"&&x.r.kreatur){
      var id=nachName[x.r.kreatur.toLowerCase()];
      if(id) x.r.e.relations.push({id:uid("rel"),type:"belongsTo",to:id});
      else result.unresolved.push({from:x.r.e.name,kind:"belongs to",target:x.r.kreatur}); }
  });

  result.all=alle;
  return result;
}

function importDialog(){
  dialog("Aus Obsidian importieren",function(host,close){
    host.appendChild(el("p",{class:"hint",text:
      "Markdown-Dateien aus dem Vault wählen. Gegenstände, Statblöcke und Orte "+
      "werden an ihrem Frontmatter erkannt. Verweise innerhalb des Stapels lösen sich "+
      "gegenseitig auf; was offen bleibt, steht danach als toter Verweis da und lässt "+
      "sich mit einem Klick anlegen."}));
    var inp=el("input",{class:"i",type:"file",multiple:"multiple",accept:".md,text/markdown"});
    host.appendChild(field("Dateien",inp));
    var report=el("div",{class:"bericht"});
    host.appendChild(report);
    var erg=null;

    inp.addEventListener("change",function(){
      var fs=Array.prototype.slice.call(inp.files||[]);
      if(!fs.length)return;
      report.textContent="Reading "+fs.length+" file(s)…";
      window.__GELESEN__=fs.map(function(f){return f.name;});
      Promise.all(fs.map(function(f){ return f.text().then(function(t){return {name:f.name,text:t};}); }))
        .then(function(files){
          erg=runImport(files);
          report.textContent="";
          var z=el("ul");
          [["Items",erg.item.length],["Statblocks",erg.statblock.length],
           ["Places",erg.place.length],["Rules from sections",erg.rules.length]]
            .forEach(function(p){ if(p[1]) z.appendChild(el("li",{text:p[1]+" "+p[0]})); });
          report.appendChild(z);
          if(erg.unknown.length) report.appendChild(el("p",{class:"warnzeile",
            text:"Not recognised: "+erg.unknown.join(", ")}));
          if(erg.unresolved.length){
            report.appendChild(el("p",{class:"hint",text:"Unresolved links — clickable afterwards as dead links:"}));
            var ul=el("ul");
            erg.unresolved.slice(0,12).forEach(function(o){
              ul.appendChild(el("li",{text:o.from+" → "+o.kind+" → "+o.target})); });
            if(erg.unresolved.length>12) ul.appendChild(el("li",{text:"… and "+(erg.unresolved.length-12)+" more"}));
            report.appendChild(ul);
          }
          if(erg.images.length) report.appendChild(el("p",{class:"hint",
            text:"Images are named but not transferred: "+
              erg.images.map(function(b){return b.datei;}).join(", ")}));
        })
        .catch(function(x){ report.textContent="Reading failed: "+x.message; });
    });

    actions(host,close,function(){
      if(!erg||!erg.all.length) return false;
      erg.all.forEach(function(e){ ENT.set(e.id,e); });
      render();
      if(db) erg.all.forEach(function(e){ db.doc("entities/"+e.id).set(e).catch(fail); });
      UI.err=erg.all.length+" articles imported.";
      go({k:"list"});
    },"Import");
  });
}

(async function boot(){
  // Beide Fähigkeiten nebeneinander anfordern. Nacheinander hiesse: wenn die
  // eine nicht antwortet, wartet die andere ihre volle Frist mit ab.
  var hat=window.claude&&claude.use;
  var erg=await Promise.all([
    hat?claude.use("db").catch(function(){return null;}):null,
    hat?claude.use("user").catch(function(){return null;}):null,
    hat?claude.use("assets").catch(function(){return null;}):null,
    hat?claude.use("room").catch(function(){return null;}):null,
    hat?claude.use("downloads").catch(function(){return null;}):null
  ]);
  db=erg[0];
  /* Nur Schreibberechtigte bekommen die Ablage; `null` heisst hier nicht
     „kaputt", sondern „diese Ansicht darf nicht hochladen". */
  assetStore=erg[2];

  /* Wer zusieht. `isOwner` ist die Spielleitung — im Artefakt gibt es keine
     zweite Stelle, an der eine Rolle stünde, und eine erfundene wäre eine
     Behauptung. Die Zuordnung Nutzer → Figur steht dagegen in den Daten
     (Access-Karte), damit sie die Spielleitung ändern kann. */
  try{
    if(erg[1]){
      me.gm=await erg[1].isOwner();
      if(erg[1].id) me.id=(await erg[1].id())||"";
      var w=await erg[1].can("data.write");
      if(w===false) me.base=false;
    }
  }catch(x){}

  /* Der Raum ist die Zugabe, nicht die Grundlage: fehlt er, läuft alles
     weiter — nur ohne Anwesenheit und ohne Zeigen. */
  roomNS=erg[3];
  downloadNS=erg[4];
  if(roomNS){
    try{
      roomNS.onPeers(function(liste){ UI.peers=liste||[]; render(); });
      roomNS.on("roll",function(ev){
        var d=(ev&&ev.data)||{};
        if(!d.text||d.src===ROOM_SELF)return;
        UI.rollLog.unshift({t:d.what||"roll",who:d.who||"",at:Date.now(),
          r:{total:d.total,rolls:[],expr:d.what,pretty:d.text}});
        if(UI.rollLog.length>12) UI.rollLog.length=12;
        render();
      });
      roomNS.on("ping",function(ev){
        var d=(ev&&ev.data)||{};
        if(!d.map||d.src===ROOM_SELF)return;
        addPing({id:d.id||uid("pg"),map:d.map,x:d.x,y:d.y,at:Date.now(),who:d.who||""});
      });
    }catch(x){}
  }

  if(!db){
    ready=true;
    loadFailed="no data store reachable.";
    UI.err="No data store reachable — nothing will be saved. "+
           "A full page reload usually helps.";
    render(); return;
  }

  var TEILE=["interfaces","relations","views","units","vars","settings"];
  var arrived={register:{},artikel:false};

  /* Wirft ein Snapshot-Callback, endet die Zustellung still: `ready` bliebe
     false und die Seite stünde auf „Lädt…". Darum fängt jeder Callback
     seinen eigenen Fehler und sagt, woran es lag. */
  function guarded(was,fn){
    return function(arg){
      try{ fn(arg); }
      catch(x){
        /* Ein Ladevorgang, der hier hereinfällt, hat etwas nicht gelesen.
           Von da an wird nicht mehr geschrieben (REQ-191): die alte App ist
           genau daran gestorben, dass die nächste Selbstspeicherung den
           unlesbaren Stand überschrieb. */
        ready=true; loadFailed=was+" could not be read.";
        UI.err=was+": "+((x&&x.message)||x); render();
      }
    };
  }

  TEILE.forEach(function(part){
    db.doc("registry/"+part).onSnapshot(guarded("Registry "+part,function(s){
      arrived.register[part]=true;
      REG[part]=thawed(s.exists&&s.data())||REG[part]||{};
      render();
    }),function(e){ loadFailed="the registry part “"+part+"” failed ("+e.code+").";
      UI.err="Registry: "+e.code; render(); });
  });

  loadPins();

  db.collection("entities").limit(1000).onSnapshot(guarded("Artikel",function(snap){
    arrived.artikel=true;
    var neu=new Map();
    var fremd="";
    (snap.docs||[]).forEach(function(d){
      var b=thawed(d.data())||{};
      if(!b.id) b.id=d.id;
      /* Fremd heisst: seit dem letzten Schnappschuss geändert, und nicht
         von uns. Der Speicher kennt keine Bedingung am Schreiben, also
         lässt sich der zweite Schreiber nicht abweisen — erkennen und
         hinschreiben lässt er sich schon, und das ist mehr, als eine
         stille Überschreibung hinterlässt (REQ-192). */
      var vorher=lastSeenAt[b.id];
      if(vorher&&b.updatedAt&&b.updatedAt!==vorher&&b.updatedAt!==lastWroteAt[b.id]
         &&UI.route.k==="art"&&UI.route.id===b.id) fremd=b.id;
      lastSeenAt[b.id]=b.updatedAt||"";
      neu.set(b.id,b);
    });
    foreignEdit=fremd;
    ENT=neu;
    ready=true;
    /* Erst mit den Artikeln steht fest, wen dieser Nutzer spielt — die
       Zuordnung liegt in den Daten, nicht in der Sitzung. */
    me.actor=actorForUser(me.id);
    UI.err="";   // eine frühere Wachmeldung ist mit den Daten erledigt
    render();
  }),function(e){ loadFailed="the articles failed ("+e.code+").";
    UI.err="Articles: "+e.code; ready=true; render(); });

  /* Kommt binnen zehn Sekunden nichts, sagt die Seite, was ausblieb —
     statt schweigend auf „Lädt…" zu stehen. */
  setTimeout(function(){
    if(ready) return;
    ready=true;
    UI.err="No data received: "+Object.keys(arrived.register).length+" of "+
           TEILE.length+" registry parts, "+
           (arrived.artikel?"articles yes":"articles no")+". "+
           "Reload the page fully; if it persists, it is a bug in the page.";
    render();
  },10000);
})();

})();
</script>
