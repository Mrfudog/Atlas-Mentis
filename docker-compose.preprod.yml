# Testinstanz — eigener Port, eigene Datenbank, eigenes Volume.
# Läuft von preprod, damit main ungestört bleibt.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nebelwacht
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: nebelwacht_preprod
    volumes: ["./daten/db-preprod:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebelwacht"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${IMAGE:-atlas-mentis:local}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://nebelwacht:${POSTGRES_PASSWORD}@db:5432/nebelwacht_preprod
      HOST: 0.0.0.0
      PORT: 8080
      TRUST_PROXY: loopback,uniquelocal
    ports: ["127.0.0.1:${APP_PORT:-8081}:8080"]
