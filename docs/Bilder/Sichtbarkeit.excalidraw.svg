<text x="410" y="137.6" font-size="16" text-anchor="middle" fill="#1e1e1e">eigener Artikel?</text>
<text x="410" y="157.6" font-size="16" text-anchor="middle" fill="#1e1e1e">(angelegt oder schreibbar)</text>
