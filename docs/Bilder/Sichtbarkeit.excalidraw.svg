<text x="410" y="487.6" font-size="16" text-anchor="middle" fill="#1e1e1e">einen Träger?</text>
<text x="410" y="577.6" font-size="16" text-anchor="middle" fill="#1e1e1e">revealedTo nennt</text>
<text x="410" y="597.6" font-size="16" text-anchor="middle" fill="#1e1e1e">einen Träger?</text>
<text x="410" y="687.6" font-size="16" text-anchor="middle" fill="#1e1e1e">audience</text>
<text x="410" y="707.6" font-size="16" text-anchor="middle" fill="#1e1e1e">am Artikel?</text>
