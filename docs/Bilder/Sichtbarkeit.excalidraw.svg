<text x="780" y="927.6" font-size="16" text-anchor="middle" fill="#1e1e1e">(public immer; Rolle in der Kampagne)</text>
<text x="110" y="247.6" font-size="16" text-anchor="middle" fill="#1e1e1e">gm oder co-gm der</text>
<text x="110" y="267.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Kampagne, der er gehört?</text>
