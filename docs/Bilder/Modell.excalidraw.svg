<rect x="-20" y="-20" width="960" height="625" fill="#ffffff"/>
<rect x="0" y="0" width="270" height="530" rx="0" fill="none" stroke="#868e96" stroke-dasharray="6 4"/>

<rect x="300" y="0" width="260" height="430" rx="0" fill="none" stroke="#868e96" stroke-dasharray="6 4"/>

<rect x="620" y="0" width="300" height="530" rx="0" fill="none" stroke="#868e96" stroke-dasharray="6 4"/>

<rect x="20" y="50" width="220" height="60" rx="8" fill="#d0ebff" stroke="#1971c2"/>

