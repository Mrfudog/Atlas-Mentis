<line x1="770" y1="210" x2="770" y2="250" stroke="#1e1e1e" marker-end="url(#spitze)"/>
<line x1="770" y1="310" x2="770" y2="350" stroke="#1e1e1e" marker-end="url(#spitze)"/>
<line x1="770" y1="410" x2="770" y2="450" stroke="#1e1e1e" marker-end="url(#spitze)"/>
<line x1="250" y1="480" x2="640" y2="480" stroke="#1e1e1e" marker-end="url(#spitze)"/>

<rect x="103.5" y="121.9" width="58.1" height="16.3" fill="#ffffff"/>
<rect x="218.8" y="121.9" width="122.4" height="16.3" fill="#ffffff"/>
<rect x="265.3" y="271.9" width="29.5" height="16.3" fill="#ffffff"/>
<rect x="561" y="71.9" width="58.1" height="16.3" fill="#ffffff"/>
<text x="10" y="20" font-size="14" text-anchor="start" fill="#868e96">Register — Zeilen, nicht Code</text>
<text x="310" y="20" font-size="14" text-anchor="start" fill="#868e96">Bestand — die Artikel</text>
<text x="630" y="20" font-size="14" text-anchor="start" fill="#868e96">Lesen — die Reihenfolge ist die Regel</text>
<text x="130" y="75.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Typ · InterfaceDef</text>
<text x="130" y="95.6" font-size="16" text-anchor="middle" fill="#1e1e1e">extends, area, views</text>
<text x="135" y="175.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Feld · PropertySchema</text>
<text x="135" y="195.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Form, enumRef, unit, target</text>
<text x="130" y="275.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Kantenart · RelationDef</text>
<text x="130" y="295.6" font-size="16" text-anchor="middle" fill="#1e1e1e">from, to, asField</text>
<text x="130" y="375.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Aufzählung · Einheit</text>
<text x="130" y="395.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Variable · Einstellung</text>
<text x="135" y="475.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Ansicht + Anordnung</text>
<text x="135" y="495.6" font-size="16" text-anchor="middle" fill="#1e1e1e">fünf Orte und eigene</text>
<text x="430" y="75.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Artikel (Peg)</text>
<text x="430" y="95.6" font-size="16" text-anchor="middle" fill="#1e1e1e">id · interfaces</text>
<text x="430" y="175.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Karte je Typ</text>
<text x="430" y="195.6" font-size="16" text-anchor="middle" fill="#1e1e1e">components[Typ]</text>
<text x="430" y="275.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Kante</text>
<text x="430" y="295.6" font-size="16" text-anchor="middle" fill="#1e1e1e">nur vorwärts gespeichert</text>
<text x="430" y="375.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Ebene · Stapel</text>
<text x="430" y="395.6" font-size="16" text-anchor="middle" fill="#1e1e1e">inLayer, activates, partOf</text>
<text x="770" y="75.6" font-size="16" text-anchor="middle" fill="#1e1e1e">1. Steht er im Stapel?</text>
<text x="770" y="95.6" font-size="16" text-anchor="middle" fill="#1e1e1e">inPlay (stack.ts)</text>
<text x="770" y="175.6" font-size="16" text-anchor="middle" fill="#1e1e1e">2. Darf er an dich?</text>
<text x="770" y="195.6" font-size="16" text-anchor="middle" fill="#1e1e1e">articleVisible</text>
<text x="770" y="275.6" font-size="16" text-anchor="middle" fill="#1e1e1e">3. Welche Felder?</text>
<text x="770" y="295.6" font-size="16" text-anchor="middle" fill="#1e1e1e">redactEntity</text>
<text x="770" y="375.6" font-size="16" text-anchor="middle" fill="#1e1e1e">4. Vorlage darunter, Werte rechnen</text>
<text x="770" y="395.6" font-size="16" text-anchor="middle" fill="#1e1e1e">resolveInstance · calc.ts</text>
<text x="770" y="475.6" font-size="16" text-anchor="middle" fill="#1e1e1e">5. Zeichnen</text>
<text x="770" y="495.6" font-size="16" text-anchor="middle" fill="#1e1e1e">anordnen · Layout-Elemente</text>
<text x="132.5" y="134.6" font-size="13" text-anchor="middle" fill="#495057">erklärt</text>
<text x="280" y="134.6" font-size="13" text-anchor="middle" fill="#495057">Werte der Felder</text>
<text x="280" y="284.6" font-size="13" text-anchor="middle" fill="#495057">Art</text>
<text x="590" y="84.6" font-size="13" text-anchor="middle" fill="#495057">gelesen</text>
<text x="0" y="564" font-size="14" text-anchor="start" fill="#1e1e1e">Karte, Kante und Ebene gehören zum Artikel; die Kante liegt nur an ihrem Ausgang. Geschrieben wird durch validateEntity;</text>
<text x="0" y="581.5" font-size="14" text-anchor="start" fill="#1e1e1e">abgeleitete Werte und Masse werden beim Lesen gerechnet, nie gespeichert (D8).</text>
</svg>
