<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 960 625" width="960" height="625" font-family="Helvetica, Arial, sans-serif">
<!-- Das Modell auf einen Blick — erzeugt von scripts/excalidraw.mjs; nach einer Änderung in Obsidian schreibt das Plugin diese Datei neu -->
