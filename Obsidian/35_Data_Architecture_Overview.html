<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VTT Data Architecture — Overview</title>
<style>
  :root{--paper:#F2F4F6;--dot:#C9CFD6;--ink:#1E242C;--ink-2:#5B646F;--line:#D5DAE0;--panel:#fff;
    --c-input:#C08A2E;--c-registry:#8C5A9E;--c-storage:#2E7D8C;--c-engine:#4B4F58;--c-read:#D26A8A;
    --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--ui:"Avenir Next","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px}
  body{display:flex;flex-direction:column;height:100dvh}
  header{display:flex;align-items:baseline;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  header h1{margin:0;font:400 20px/1 var(--display)}
  header .sub{font:11px var(--mono);color:var(--ink-2)}
  #cases{display:flex;gap:6px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;-webkit-overflow-scrolling:touch}
  #cases button{flex:none;font:12px var(--ui);padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
  #cases button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #graph{flex:1;position:relative;overflow:hidden;min-height:0;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;touch-action:none}
  svg{width:100%;height:100%;display:block}
  .tier text{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;fill:var(--ink-2)}
  .tier rect{fill:none;stroke:var(--line);stroke-dasharray:6 4}
  .n rect{fill:#fff;stroke-width:1.5}
  .n.dashed rect{stroke-dasharray:5 3}
  .n text{pointer-events:none}
  .n .t{font:500 12px var(--ui);fill:var(--ink)}
  .n .s{font:10px var(--mono);fill:var(--ink-2)}
  .n.dim{opacity:.18}.n.sel rect{stroke-width:3}
  .n .badge{font:600 10px var(--mono);fill:#fff}
  .e{fill:none;stroke:#8D96A0;stroke-width:1.2;stroke-opacity:.5}
  .e.dim{stroke-opacity:.05}.e.hot{stroke-opacity:1;stroke-width:2.4}
  #sheet{flex:none;background:var(--panel);border-top:1px solid var(--line);max-height:42dvh;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
  #sheet h3{font:400 18px var(--display);margin:0 0 4px}
  #sheet .tag{display:inline-block;font:10px var(--mono);padding:2px 7px;border-radius:3px;color:#fff;margin:0 4px 8px 0}
  #sheet p{font-size:13px;line-height:1.5;margin:6px 0}
  #sheet h4{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 5px}
  #sheet pre{font:11.5px/1.5 var(--mono);background:#F7F8FA;border:1px solid var(--line);border-radius:4px;padding:8px;white-space:pre-wrap;margin:0;overflow-x:auto}
  #sheet ul{margin:0;padding:0;list-style:none;font-size:13px}
  #sheet li{padding:4px 0;border-bottom:1px dotted var(--line)}
  #sheet li a{color:var(--ink);text-decoration:underline dotted;cursor:pointer}
  .empty{color:var(--ink-2);font-size:13px;line-height:1.5}
  .steps{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .steps button{font:13px var(--ui);padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;min-width:44px}
  .steps .pos{font:11px var(--mono);color:var(--ink-2);flex:1;text-align:center}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font:11px var(--mono);color:var(--ink-2);margin-top:10px}
  .legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--c);vertical-align:-1px}
  @media(min-width:900px){body{display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:1fr 340px;grid-template-areas:"head head" "cases cases" "graph sheet"}header{grid-area:head}#cases{grid-area:cases}#graph{grid-area:graph}#sheet{grid-area:sheet;max-height:none;border-top:0;border-left:1px solid var(--line)}}
</style>
</head>
